name: Execute and publish a test lane
description: Run pytest under one supervisor, end leftovers, then publish scanned evidence.
inputs:
  command:
    description: The lane command, including its flags
    required: true
  source:
    description: The lane report and evidence directory
    required: true
  artifact:
    description: Attempt-specific evidence name
    required: true
  job-label:
    description: The hosted job name for matching its published evidence
    required: true
  shell:
    description: Command interpreter
    default: bash
runs:
  using: composite
  steps:
    - name: Execute pytest
      id: pytest
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        SOURCE: ${{ inputs.source }}
        LANE_SHELL: ${{ inputs.shell }}
        AEW_RUNNING_TESTS_DIR: ${{ inputs.source }}
        AEW_LANE_JOB_LABEL: ${{ inputs.job-label }}
        AEW_LANE_STEP: ${{ inputs.artifact }}
      run: |
        script="$RUNNER_TEMP/lane-command-${{ github.action }}.sh"
        printf '%s\n' "$COMMAND" > "$script"
        if [ "$AEW_EVIDENCE_PLANT" = sigkill ]; then
          python "$GITHUB_WORKSPACE/tools/ci/evidence_plant_driver.py" "$SOURCE" "$AEW_EVIDENCE_PLANT" &
        fi
        exec python "$GITHUB_WORKSPACE/tools/ci/lane_step.py" --root "$SOURCE" --shell "$LANE_SHELL" --script "$script"
    - name: Collect and end leftovers before uploads
      id: collect
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        AEW_LANE_JOB_STATUS: ${{ job.status }}
        AEW_LANE_JOB_LABEL: ${{ inputs.job-label }}
      run: |
        python tools/ci/evidence_timing.py mark "$RUNNER_TEMP/${{ inputs.artifact }}-post.clock"
        python tools/ci/lane_step.py --collect --root "$SOURCE"
    - name: Prepare owned evidence inputs
      if: always() && steps.collect.outcome == 'success'
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        ARTIFACT: ${{ inputs.artifact }}
      run: python tools/ci/evidence_inputs.py "$SOURCE" "$RUNNER_TEMP/$ARTIFACT-watchdog-input"
    - name: Time names-upload
      if: always() && steps.collect.outcome == 'success'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: python tools/ci/evidence_timing.py mark "$RUNNER_TEMP/$ARTIFACT-names-upload.clock"
    - name: Publish running source names
      if: always() && steps.collect.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}-running
        path: ${{ runner.temp }}/${{ inputs.artifact }}-names
        if-no-files-found: ignore
        retention-days: 14
    - name: Report names-upload time
      if: always() && steps.collect.outcome == 'success'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: python tools/ci/evidence_timing.py elapsed "$RUNNER_TEMP/$ARTIFACT-names-upload.clock" names-upload
    - name: Publish priority evidence
      if: always() && steps.collect.outcome == 'success'
      uses: ./.github/actions/publish-evidence
      with:
        source: ${{ inputs.source }}
        artifact: ${{ inputs.artifact }}
        portion: priority
    - name: Time report-upload
      if: always() && steps.collect.outcome == 'success'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: python tools/ci/evidence_timing.py mark "$RUNNER_TEMP/$ARTIFACT-report-upload.clock"
    - name: Publish lane report
      if: always() && steps.collect.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: lane-report-${{ inputs.artifact }}
        path: ${{ inputs.source }}/*.json
        if-no-files-found: ignore
        retention-days: 14
    - name: Report report-upload time
      if: always() && steps.collect.outcome == 'success'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: python tools/ci/evidence_timing.py elapsed "$RUNNER_TEMP/$ARTIFACT-report-upload.clock" report-upload
    - name: Publish full evidence
      if: always() && steps.collect.outcome == 'success'
      uses: ./.github/actions/publish-evidence
      with:
        source: ${{ inputs.source }}
        artifact: ${{ inputs.artifact }}
        portion: full
    - name: Report the publication interval
      if: always() && steps.collect.outcome == 'success'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: python tools/ci/evidence_timing.py elapsed "$RUNNER_TEMP/$ARTIFACT-post.clock" after-pytest
