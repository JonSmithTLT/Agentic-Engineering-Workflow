name: Execute and publish a test lane
description: Run pytest under one supervisor, end leftovers, then publish scanned evidence.
inputs:
  command:
    description: The lane command, including its flags
    required: true
  source:
    description: The lane report and evidence directory
    required: true
  artifact:
    description: Attempt-specific evidence name
    required: true
  job-label:
    description: The hosted job name for matching its published evidence
    required: true
  shell:
    description: Command interpreter
    default: bash
  recovery-outcome:
    description: Outcome of an enclosing action that expired before its normal collection and publication finished
    default: ''
outputs:
  finished:
    description: Whether this action reached its final step after publishing
    value: ${{ steps.finished.outcome }}
runs:
  using: composite
  steps:
    - name: Install evidence tools
      id: tools
      if: always()
      continue-on-error: true
      shell: bash
      run: python tools/ci/install_evidence.py
    - name: Probe hosted attachment
      id: probe
      if: env.AEW_EVIDENCE_PROBE == 'true'
      continue-on-error: true
      shell: bash
      run: |
        method=$(python tools/ci/lane_step.py --probe)
        echo "method=$method" >> "$GITHUB_OUTPUT"
    - name: Execute pytest
      id: pytest
      if: inputs.recovery-outcome == ''
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        SOURCE: ${{ inputs.source }}
        LANE_SHELL: ${{ inputs.shell }}
        AEW_RUNNING_TESTS_DIR: ${{ inputs.source }}
        # The paired hosted Linux census gates this rollout. Other runners may opt in explicitly.
        AEW_WORKER_SNAPSHOTS: ${{ env.AEW_WORKER_SNAPSHOTS || (runner.environment == 'github-hosted' && runner.os == 'Linux' && !env.AEW_EVIDENCE_PLANT && '1' || '0') }}
        AEW_LANE_JOB_LABEL: ${{ inputs.job-label }}
        AEW_LANE_STEP: ${{ inputs.artifact }}
      run: |
        script="$RUNNER_TEMP/lane-command-${{ github.action }}.sh"
        printf '%s\n' "$COMMAND" > "$script"
        if [ "$AEW_EVIDENCE_PLANT" = sigkill ]; then
          python "$GITHUB_WORKSPACE/tools/ci/evidence_plant_driver.py" "$SOURCE" "$AEW_EVIDENCE_PLANT" &
        fi
        exec python "$GITHUB_WORKSPACE/tools/ci/lane_step.py" --root "$SOURCE" --shell "$LANE_SHELL" --script "$script"
    - name: Collect and end leftovers before uploads
      id: collect
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        AEW_LANE_JOB_STATUS: ${{ job.status }}
        AEW_PYTEST_OUTCOME: ${{ inputs.recovery-outcome || steps.pytest.outcome }}
        AEW_LANE_RECOVERY_OUTCOME: ${{ inputs.recovery-outcome }}
        AEW_LANE_JOB_LABEL: ${{ inputs.job-label }}
      run: python tools/ci/lane_step.py --collect --root "$SOURCE"
    - name: Prepare owned evidence inputs
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        ARTIFACT: ${{ inputs.artifact }}
        JOB_LABEL: ${{ inputs.job-label }}
        COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        LANE_OUTCOME: ${{ inputs.recovery-outcome || steps.pytest.outcome }}
        SCANNER_AVAILABLE: ${{ steps.tools.outputs.scanner }}
        SPY_AVAILABLE: ${{ steps.tools.outputs.spy }}
        ATTACHMENT_PROBE: ${{ steps.probe.outputs.method }}
      run: python tools/ci/evidence_inputs.py "$SOURCE" "$RUNNER_TEMP/$ARTIFACT-watchdog-input"
    - name: Publish running source names
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact }}-running
        path: ${{ runner.temp }}/${{ inputs.artifact }}-names
        if-no-files-found: ignore
        retention-days: 14
    - name: Publish priority evidence
      if: always() && (inputs.recovery-outcome != '' || steps.pytest.outcome != 'success' || steps.collect.outcome != 'success')
      uses: ./.github/actions/publish-evidence
      with:
        source: ${{ inputs.source }}
        artifact: ${{ inputs.artifact }}
        portion: priority
    - name: Publish lane report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: lane-report-${{ inputs.artifact }}
        path: ${{ inputs.source }}/*.json
        if-no-files-found: ignore
        retention-days: 14
    - name: Publish full evidence
      if: always() && (inputs.recovery-outcome != '' || steps.pytest.outcome != 'success' || steps.collect.outcome != 'success')
      uses: ./.github/actions/publish-evidence
      with:
        source: ${{ inputs.source }}
        artifact: ${{ inputs.artifact }}
        portion: full
    - name: Mark the end of lane publication
      id: finished
      if: always()
      shell: bash
      run: echo 'Lane publication finished.'
