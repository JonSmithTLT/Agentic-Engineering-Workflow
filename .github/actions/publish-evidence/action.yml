name: Publish test evidence
description: Scan a bounded staging directory and publish the evidence for this attempt.
inputs:
  source:
    description: Test report or hang directory
    required: true
  artifact:
    description: Attempt-specific artifact name
    required: true
  portion:
    description: priority, full, or both
    default: both
runs:
  using: composite
  steps:
    - name: Prepare the scanner for a standalone publication
      if: always() && inputs.portion == 'both'
      shell: bash
      run: python tools/ci/install_evidence.py --scanner-only
    - name: Find evidence and isolate watchdog dumps
      id: inputs
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        if [ ! -d "$RUNNER_TEMP/$ARTIFACT-watchdog-input" ]; then
          python tools/ci/evidence_inputs.py "$SOURCE" "$RUNNER_TEMP/$ARTIFACT-watchdog-input" >> "$GITHUB_OUTPUT"
        else
          echo present=true >> "$GITHUB_OUTPUT"
          echo watchdog=true >> "$GITHUB_OUTPUT"
        fi
    - name: Report an empty evidence directory
      if: always() && steps.inputs.outputs.present == 'false'
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: printf 'Test evidence contains no files under %s\n' "$SOURCE" >> "$GITHUB_STEP_SUMMARY"
    - name: Stage and scan watchdog evidence
      id: watchdog
      if: always() && inputs.portion != 'full' && steps.inputs.outputs.watchdog != 'false'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        dir="$RUNNER_TEMP/$ARTIFACT-watchdog"
        mkdir -p "$dir-input"
        result=$(python tools/ci/stage_evidence.py "$dir-input" "$dir")
        printf 'Watchdog evidence: %s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      if: always() && inputs.portion != 'full' && steps.watchdog.outcome == 'success'
      with:
        name: ${{ inputs.artifact }}-watchdog
        path: ${{ runner.temp }}/${{ inputs.artifact }}-watchdog
        retention-days: 14
    - name: Stage and scan test evidence
      if: always() && inputs.portion != 'priority' && steps.inputs.outputs.present != 'false'
      id: stage
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        dir="$RUNNER_TEMP/$ARTIFACT"
        result=$(python tools/ci/stage_evidence.py "$SOURCE" "$dir")
        echo "directory=$dir" >> "$GITHUB_OUTPUT"
        printf 'Test evidence: %s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v7
      id: upload
      if: always() && steps.stage.outcome == 'success'
      with:
        name: ${{ inputs.artifact }}
        path: ${{ steps.stage.outputs.directory }}
        retention-days: 14
    - name: Link the evidence bundle
      if: always() && steps.upload.outcome == 'success'
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
      run: printf '[%s](%s)\n' "$ARTIFACT" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
