name: Set up AEW test environment
description: >-
  Python with a pip wheel cache, a git identity for fixture repositories, AEW with its test extras, and (on
  Windows) Defender exclusions for the test paths. See docs/implementation/testing-and-ci-strategy.md.
inputs:
  python-version:
    description: Python version for this job
    required: true
  defender-exclusions:
    description: Exclude test paths and processes from Defender real-time scanning on Windows runners
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        # Only downloaded wheels are cached; resolution runs every time (the dependency ranges are unpinned).
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Git identity for fixture repositories
      shell: bash
      run: |
        git config --global user.name "AEW CI"
        git config --global user.email "aew-ci@invalid"
    - name: Defender exclusions for test paths (ephemeral Windows runner only)
      if: runner.os == 'Windows' && inputs.defender-exclusions == 'true'
      shell: pwsh
      run: |
        $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (Get-Item $env:TEMP).FullName, $env:RUNNER_TOOL_CACHE)
        Add-MpPreference -ExclusionPath $paths
        Add-MpPreference -ExclusionProcess @("python.exe", "git.exe")
        Get-MpComputerStatus | Format-List RealTimeProtectionEnabled, AMRunningMode
    - name: Install AEW with test extras
      shell: bash
      run: python -m pip install -e ".[dev,parallel]"
