name: ci

# Implements docs/implementation/testing-and-ci-strategy.md. A change to lanes, shards, platforms or the
# merge gate updates that document in the same pull request.
#
#   changes              the change's tier (tools/ci/tier.py, CI redesign P1): docs, web or full; fail closed to full
#   core (per OS)        fast lane (unit + frozen-spec pin), then the serial lane (no xdist)
#   lanes (per OS)       integration | acceptance | regression | adversarial, xdist inside each job (full tier only)
#   web                  the dashboard's checks (web.yml): when web/, the contract or web.yml changed
#   static               Ruff, Pyright (as Linux and as Windows) and pip-audit on the Python side
#   assurance            every collected test of the tier's lanes ran exactly once and passed on every OS, and web
#                        and static passed (the merge gate). It recomputes the tier, and refuses a reduced tier on
#                        any event but a pull request: a push to main and a merge group always run in full.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  changes:
    # Reduced tiers are for pull requests only, and are backed by main's always-full push run: a personal-account
    # repository has no merge queue (strategy §3, "Tiers"). Anything not provably docs or web is full.
    name: tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tier
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/ci/tier.py --event "$EVENT" --base-ref "$BASE_REF" --base "$BASE" --head "$HEAD"
          --github-output "$GITHUB_OUTPUT"

  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"   # Rocky Linux 8 AppStream / SPT wheelhouse target
          - os: windows-latest
            python: "3.13"   # developer workstation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # the spec-pin test verifies the frozen tag
      - run: git fetch --tags --force
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ matrix.python }}
      - name: Coverage for this Linux job (E2; strategy §3, Coverage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/coverage"
          echo "COVERAGE_FILE=${{ runner.temp }}/coverage/.coverage" >> "$GITHUB_ENV"
      - name: fast lane (unit, schemas, store model, frozen-spec pin)
        run: >-
          ${{ runner.os == 'Linux' && 'python -m coverage run -m pytest' || 'python -m pytest' }}
          -q -p no:cacheprovider -p no:xdist --durations=20 --lane fast
          --lane-report "${{ runner.temp }}/lane-reports/${{ runner.os }}-fast.json"
      - name: serial lane (racing writers, real process kills, pty takeover) — never parallel
        if: success() || failure()
        run: >-
          python -m pytest -q -p no:cacheprovider -p no:xdist --durations=20 --lane serial
          --lane-report "${{ runner.temp }}/lane-reports/${{ runner.os }}-serial.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-report-${{ runner.os }}-core
          path: ${{ runner.temp }}/lane-reports/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: coverage-core-${{ runner.os }}
          path: ${{ runner.temp }}/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  lanes:
    name: ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tier == 'full'
    strategy:
      fail-fast: false
      matrix:
        # Shard counts come from measured lane durations (strategy doc, "Runtime budgets").
        include:
          - {os: ubuntu-latest, python: "3.11", lane: integration, shard: 1, of: 5}
          - {os: ubuntu-latest, python: "3.11", lane: integration, shard: 2, of: 5}
          - {os: ubuntu-latest, python: "3.11", lane: integration, shard: 3, of: 5}
          - {os: ubuntu-latest, python: "3.11", lane: integration, shard: 4, of: 5}
          - {os: ubuntu-latest, python: "3.11", lane: integration, shard: 5, of: 5}
          - {os: ubuntu-latest, python: "3.11", lane: acceptance, shard: 1, of: 1}
          - {os: ubuntu-latest, python: "3.11", lane: regression, shard: 1, of: 4}
          - {os: ubuntu-latest, python: "3.11", lane: regression, shard: 2, of: 4}
          - {os: ubuntu-latest, python: "3.11", lane: regression, shard: 3, of: 4}
          - {os: ubuntu-latest, python: "3.11", lane: regression, shard: 4, of: 4}
          - {os: ubuntu-latest, python: "3.11", lane: adversarial, shard: 1, of: 1}
          - {os: windows-latest, python: "3.13", lane: integration, shard: 1, of: 4}
          - {os: windows-latest, python: "3.13", lane: integration, shard: 2, of: 4}
          - {os: windows-latest, python: "3.13", lane: integration, shard: 3, of: 4}
          - {os: windows-latest, python: "3.13", lane: integration, shard: 4, of: 4}
          - {os: windows-latest, python: "3.13", lane: acceptance, shard: 1, of: 2}
          - {os: windows-latest, python: "3.13", lane: acceptance, shard: 2, of: 2}
          - {os: windows-latest, python: "3.13", lane: regression, shard: 1, of: 3}
          - {os: windows-latest, python: "3.13", lane: regression, shard: 2, of: 3}
          - {os: windows-latest, python: "3.13", lane: regression, shard: 3, of: 3}
          - {os: windows-latest, python: "3.13", lane: adversarial, shard: 1, of: 2}
          - {os: windows-latest, python: "3.13", lane: adversarial, shard: 2, of: 2}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ matrix.python }}
      - name: Coverage for this Linux job (E2; strategy §3, Coverage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/coverage"
          echo "COVERAGE_FILE=${{ runner.temp }}/coverage/.coverage" >> "$GITHUB_ENV"
      - name: pytest --lane ${{ matrix.lane }} --shard ${{ matrix.shard }}/${{ matrix.of }} -n auto
        run: >-
          ${{ runner.os == 'Linux' && 'python -m coverage run -m pytest' || 'python -m pytest' }}
          -q -p no:cacheprovider --durations=20
          --lane ${{ matrix.lane }} --shard ${{ matrix.shard }}/${{ matrix.of }} -n auto --dist worksteal
          --lane-report "${{ runner.temp }}/lane-reports/${{ runner.os }}-${{ matrix.lane }}-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-report-${{ runner.os }}-${{ matrix.lane }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/lane-reports/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: coverage-${{ matrix.lane }}-${{ matrix.shard }}-${{ runner.os }}
          path: ${{ runner.temp }}/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  web:
    # The dashboard (F20.1). Its `result` job decides: checks passed, or nothing it covers changed.
    uses: ./.github/workflows/web.yml

  static:
    # Static checks (strategy, "Static checks"): lint with Bandit's security rules, types on both platforms, and
    # known vulnerabilities in the installed dependencies. Tool versions are pinned in the `lint` extra.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install AEW with the lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parallel,coverage,lint]"
      - name: Ruff (pycodestyle, pyflakes, bugbear, Bandit security rules, pyupgrade, import order)
        if: success() || failure()
        run: ruff check --output-format github .
      - name: Pyright as Linux
        if: success() || failure()
        run: pyright --pythonplatform Linux
      - name: Pyright as Windows
        if: success() || failure()
        run: pyright --pythonplatform Windows
      - name: pip-audit (every installed distribution except AEW itself)
        if: success() || failure()
        # The exact installed set, frozen without the editable AEW: --strict then fails only on a vulnerability or on a
        # distribution that cannot be audited (with an editable install present, --strict refuses to skip it).
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"
          pip-audit --strict --desc --no-deps --disable-pip -r "$RUNNER_TEMP/installed.txt"

  assurance:
    # The merge gate: mark this check as required on `main`.
    needs: [changes, core, lanes, web, static]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # the run's jobs, for the cost record's queue and runner times
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tier
        name: The tier, recomputed from the same diff, is the one the jobs ran under
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RAN: ${{ needs.changes.outputs.tier }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          test "$CHANGES_RESULT" = success
          python3 tools/ci/tier.py --event "$EVENT" --base-ref "$BASE_REF" --base "$BASE" --head "$HEAD" \
            --github-output "$RUNNER_TEMP/tier"
          tier=$(sed -n 's/^tier=//p' "$RUNNER_TEMP/tier")
          echo "tier: recomputed $tier, ran $RAN"
          test "$tier" = "$RAN"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install "PyYAML>=6.0" "coverage[toml]>=7.10"
      - uses: actions/download-artifact@v8
        with:
          pattern: lane-report-*
          path: lane-reports
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
      - name: Every collected test of the tier's lanes ran exactly once and passed (pinned platform skips excepted)
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          EVENT: ${{ github.event_name }}
        run: >-
          python tools/ci/check_assurance.py lane-reports --skips tests/platform-skips.yaml
          --require linux,win32 --tier "$TIER" --event "$EVENT" --summary "$GITHUB_STEP_SUMMARY"
      - name: The cost record (reported, never gated; CI redesign P4, register E43 and E45)
        if: always()
        continue-on-error: true
        timeout-minutes: 3  # continue-on-error does not cover the job's timeout: a hung call must not cancel the gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json" || rm -f "$RUNNER_TEMP/jobs.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/run.json" \
            || rm -f "$RUNNER_TEMP/run.json"
          changed=()
          if [ -n "$BASE" ]; then
            if git diff --name-only "$BASE"..."$HEAD" > "$RUNNER_TEMP/changed.txt"; then
              changed=(--changed-files "$RUNNER_TEMP/changed.txt")
            fi
          fi
          mkdir -p cost-record
          python tools/ci/cost_record.py lane-reports --jobs "$RUNNER_TEMP/jobs.json" --run "$RUNNER_TEMP/run.json" \
            --durations tests/durations.json "${changed[@]}" --out cost-record/cost-record.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        with:
          name: cost-record
          path: cost-record/
          if-no-files-found: ignore
          retention-days: 30
      - name: Coverage holds its baseline (line and branch, Linux lanes; E2; full tier only)
        if: steps.tier.outputs.tier == 'full'
        run: >-
          python tools/ci/coverage_gate.py coverage-data --baseline tests/coverage-baseline.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Every test job the tier requires succeeded (lanes are required unless the tier is known and reduced)
        if: always()
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          LANES: ${{ needs.lanes.result }}
          WEB: ${{ needs.web.result }}
          STATIC: ${{ needs.static.result }}
        run: >-
          python3 tools/ci/tier.py --jobs-for "$TIER"
          --jobs "changes=$CHANGES,core=$CORE,lanes=$LANES,web=$WEB,static=$STATIC"
