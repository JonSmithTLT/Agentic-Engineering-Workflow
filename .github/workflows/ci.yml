name: ci

# Implements docs/implementation/testing-and-ci-strategy.md. A change to lanes, shards, platforms or the
# merge gate updates that document in the same pull request.
#
#   changes              the change's tier (tools/ci/tier.py, CI redesign P1, CI plan v7): docs, fast, web or full,
#                        from the merge commit's diff against its first parent; fail closed to full. `decision` is
#                        the tier the paths give; `tier` the one the run takes (in shadow mode, full for fast). It
#                        also sizes the lanes (tools/ci/shard_plan.py, register E44): each lane's shard count, and
#                        the durations its shards balance on, from the rolling history of main's green push runs
#   core (per OS)        fast lane (unit + frozen-spec pin, xdist) and serial lane (no xdist), every tier unless a
#                        pin-only head reuses them (tools/ci/pin_shortcut.py): one job per shard of each, in as many
#                        shards as the tier job computed
#   lanes (per OS)       integration | acceptance | regression | adversarial, xdist inside each job (full tier only),
#                        in as many shards as the tier job computed; never written by hand
#   fastbase             the whole fast lane at the base tip under coverage, when the decision is fast (plan v7 §5)
#   web                  the dashboard's checks (web.yml): when web/, the contract or web.yml changed
#   static               Ruff, Pyright (as Linux and as Windows) and pip-audit on the Python side; it also prints the
#                        generated reference's counts (reported, never gating)
#   assurance            every collected test of the tier's lanes ran exactly once and passed on every OS, in each
#                        shard's latest run attempt, and web and static passed (the merge gate). It recomputes the
#                        tier, and refuses a reduced tier on any event but a pull request: a push to main and a merge
#                        group always run in full. With a changed fast-lane test module in a reduced tier it also
#                        requires the runtime lane check and the coverage premise; in shadow mode it reports both
#                        without gating. On a green push to main it adds the run's lane reports to the
#                        shard-durations history.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A push to main has a group of its own commit, so every merge gets its own full run and none is replaced by the next
# merge's (operator, 2026-10-25, ST-30; strategy §3). A pull request has one group, and its newer push cancels its
# older run.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Linux jobs run on ubuntu-24.04, not ubuntu-latest (26.04 since 2026-11-01); matrix `os` stays `ubuntu-latest`,
# the label job names, shard sizing and budgets key on. Why: testing-and-ci-strategy.md §4, "Linux runner image".
jobs:
  changes:
    # Reduced tiers are for pull requests only, and are backed by main's always-full push run: a personal-account
    # repository has no merge queue (strategy §3, "Tiers"). Anything not provably docs, fast or web is full; a
    # `full-ci` label or a `CI-Full: yes` trailer on the head commit forces full (plan v7 §1.2).
    name: tier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # the `full-ci` label, read live
      actions: read  # an earlier run's jobs and reports, for the pin-only shortcut
    outputs:
      decision: ${{ steps.tier.outputs.decision }}
      tier: ${{ steps.tier.outputs.tier }}
      modules: ${{ steps.tier.outputs.modules }}
      reuse_run: ${{ steps.reuse.outputs.reuse_run }}
      core_matrix: ${{ steps.shards.outputs.core_matrix }}
      lanes_matrix: ${{ steps.shards.outputs.lanes_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Dependencies for the lane and flake register checks (without them the tier is full)
        continue-on-error: true
        run: python -m pip install "pytest>=8" "PyYAML>=6.0"
      - id: tier
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/ci/tier.py --event "$EVENT" --base-ref "$BASE_REF" --merge-ref "$GITHUB_SHA"
          --repo "$REPO" --pr "$PR" --record "$RUNNER_TEMP/tier-decision/tier-decision.json"
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tier-decision
          path: ${{ runner.temp }}/tier-decision/
          if-no-files-found: ignore
          retention-days: 30
      # The shard sizing (register E44): only `main`'s green push runs save the history (the assurance job), so this
      # restores the newest of them. The key itself is never saved; a miss falls back to the committed table and
      # twice its counts (the nightly restores the history every night, so a quiet week does not evict it). At the
      # save's path: actions/cache keys an entry by its path too, so a restore anywhere else always misses (until this
      # restore used it, every run sized from the fallback; test_ci_tools checks every restore against its saves).
      - name: The shard-durations history of main's green push runs (newest)
        uses: actions/cache/restore@v6
        with:
          path: shard-history/history.json
          key: shard-durations-restore-only
          restore-keys: shard-durations-
      - name: PyYAML, for the lanes job's deadline as ci.yml sets it (tests/helpers/bounds.py)
        run: python -m pip install "PyYAML>=6.0" "pytest>=8"
      # Only `tests/platform-skips.yaml` changed since a run where every test ran and passed: `assurance` judges that
      # run's reports against these pins, and no lane runs (tools/ci/pin_shortcut.py; strategy §3). Any doubt, or this
      # step failing or timing out, leaves `reuse_run` empty, which is the normal tier. `reusable` is false when the
      # pull request touches CI's own code, whose tests are in `core`: read here, apart from the walk, so that a slip in
      # the walk can't skip them.
      - id: reuse
        name: The pin-only shortcut, if this run qualifies
        if: >-
          github.event_name == 'pull_request' && steps.tier.outputs.tier == 'full'
          && steps.tier.outputs.reusable == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          python tools/ci/pin_shortcut.py --event "$GITHUB_EVENT_NAME" --base-ref "$BASE_REF" --merge-ref "$GITHUB_SHA"
          --repo "$GITHUB_REPOSITORY" --pr "$PR" --head-repo "$HEAD_REPO" --reports-dir "$RUNNER_TEMP/reuse-check"
          --github-output "$GITHUB_OUTPUT"
      # The gate's runners, each on the one Python its platform is tested on: Linux on 3.11 (the Rocky Linux 8
      # AppStream and SPT wheelhouse target), Windows on 3.13 (the developer workstation).
      - id: shards
        name: Each lane's shard count, and the durations its shards balance on (tools/ci/shard_plan.py)
        run: >-
          python tools/ci/shard_plan.py --history shard-history/history.json
          --seed tests/durations.json --durations-out "$RUNNER_TEMP/shard-durations/durations.json"
          --runner ubuntu-latest:3.11 --runner windows-latest:3.13
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"
      # One table for the whole run: every shard of a lane must cut the same partition (assurance proves it ran each
      # test once).
      - uses: actions/upload-artifact@v7
        with:
          name: shard-durations
          path: ${{ runner.temp }}/shard-durations/
          retention-days: 30

  # The fast and serial lanes, in every tier unless a pin-only head reuses them (the tier job's `reuse` step): one job
  # per shard of each, so neither lane's session shares a deadline
  # with the other's. Sized for every run like the `lanes` job (tools/ci/shard_plan.py: the fewest shards that fit on
  # a runner twice as slow). Until 2026-11-07 this was one job per runner running both lanes one after the other under
  # one deadline, which nothing sized: the fast lane grew until a slow runner left the serial lane no time.
  core:
    name: ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.core_matrix) }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    # its timeout before G3a plus the session deadline's clearance (test_ci_tools: PRE_G3A_TIMEOUT_MIN)
    timeout-minutes: 24
    steps:
      # Its start plus timeout-minutes, less bounds.JOB_MARGIN_S + 2 x DEADLINE_MARGIN_S: the number is checked
      # against this job's timeout-minutes by bounds.job_deadline_problems (test_ci_tools), never set by hand.
      - name: The job's deadline for its pytest sessions (G3 H3; tests/helpers/session_deadline.py)
        shell: bash
        run: echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 1200 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0     # the spec-pin test verifies the frozen tag
      - run: git fetch --tags --force
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ matrix.python }}
      - name: Coverage for this Linux job (E2; strategy §3, Coverage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/coverage"
          echo "COVERAGE_FILE=${{ runner.temp }}/coverage/.coverage" >> "$GITHUB_ENV"
      - name: Validate the flake register in core fast and serial
        env:
          FLAKE_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha ||
                github.event.before || 'refs/remotes/origin/main' }}
        run: python tools/flake_register.py check --base "$env:FLAKE_BASE"
        shell: pwsh
      - uses: actions/download-artifact@v8
        with:
          name: shard-durations
          path: ${{ runner.temp }}/shard-durations
      # Under xdist (strategy §5: everything but the serial lane may run in parallel). `--durations-file=` is one word,
      # as in the lanes job.
      - name: fast lane (unit, schemas, store model, frozen-spec pin)
        if: matrix.lane == 'fast'
        run: >-
          ${{ runner.os == 'Linux' && 'python -m coverage run -m pytest' || 'python -m pytest' }}
          -q -p no:cacheprovider -n auto --dist worksteal --max-worker-restart 0 --durations=20 --lane fast
          --shard ${{ matrix.shard }}/${{ matrix.of }}
          "--durations-file=${{ runner.temp }}/shard-durations/durations.json"
          --test-timeout 600 --session-deadline 1200
          "--lane-report=${{ runner.temp }}/lane-reports/${{ runner.os }}-fast-${{ matrix.shard }}.json"
      - name: serial lane (racing writers, real process kills, pty takeover) — never parallel
        if: matrix.lane == 'serial'
        run: >-
          python -m pytest -q -p no:cacheprovider -p no:xdist --durations=20 --lane serial
          --shard ${{ matrix.shard }}/${{ matrix.of }}
          "--durations-file=${{ runner.temp }}/shard-durations/durations.json"
          --test-timeout 600 --session-deadline 1200
          "--lane-report=${{ runner.temp }}/lane-reports/${{ runner.os }}-serial-${{ matrix.shard }}.json"
      # Named per run attempt: `download-artifact` keeps one artifact of a name, not always the newest, so a re-run's
      # report must not share its earlier attempt's name (assurance keeps each shard's latest attempt).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-report-${{ runner.os }}-core-${{ matrix.lane }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lane-reports/*.json
          retention-days: 14

      - uses: ./.github/actions/publish-evidence
        if: failure() || cancelled()
        with:
          source: ${{ runner.temp }}/lane-reports/
          artifact: evidence-lane-report-${{ runner.os }}-core-${{ matrix.lane }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
      - uses: ./.github/actions/prove-evidence
        if: needs.changes.outputs.tier == 'full' && matrix.lane == 'serial' && matrix.shard == 1
      # Only from a passing job: the gate reads coverage only when every shard's latest attempt passed, and a failed
      # attempt's data, under the same name as its re-run's, could be the one `download-artifact` keeps. The serial
      # lane runs without coverage, as it always has.
      - uses: actions/upload-artifact@v7
        if: success() && runner.os == 'Linux' && matrix.lane == 'fast'
        with:
          name: coverage-core-fast-${{ matrix.shard }}-${{ runner.os }}
          path: ${{ runner.temp }}/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  lanes:
    name: ${{ matrix.lane }} ${{ matrix.shard }}/${{ matrix.of }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tier == 'full' && needs.changes.outputs.reuse_run == ''
    strategy:
      fail-fast: false
      # Computed for this run by the tier job (tools/ci/shard_plan.py; strategy doc, "Runtime budgets"): per runner
      # and lane, shards 1..N of N, N the fewest that fit the session deadline on a runner twice as slow.
      matrix: ${{ fromJSON(needs.changes.outputs.lanes_matrix) }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    # its timeout before G3a plus the session deadline's clearance (test_ci_tools: PRE_G3A_TIMEOUT_MIN)
    timeout-minutes: 34
    steps:
      # Its start plus timeout-minutes, less bounds.JOB_MARGIN_S + 2 x DEADLINE_MARGIN_S: the number is checked
      # against this job's timeout-minutes by bounds.job_deadline_problems (test_ci_tools), never set by hand.
      - name: The job's deadline for its pytest sessions (G3 H3; tests/helpers/session_deadline.py)
        shell: bash
        run: echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 1800 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ matrix.python }}
      - name: Coverage for this Linux job (E2; strategy §3, Coverage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/coverage"
          echo "COVERAGE_FILE=${{ runner.temp }}/coverage/.coverage" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: shard-durations
          path: ${{ runner.temp }}/shard-durations
      # `--durations-file=`, one word: pytest picks its rootdir before the repository's plugin defines the option, so
      # an existing file given as a separate word counts as a test path, and the rootdir becomes its common ancestor
      # with the checkout, outside the repository (#235's first run: every lane job a usage error).
      - name: pytest --lane ${{ matrix.lane }} --shard ${{ matrix.shard }}/${{ matrix.of }} -n auto
        run: >-
          ${{ runner.os == 'Linux' && 'python -m coverage run -m pytest' || 'python -m pytest' }}
          -q -p no:cacheprovider --durations=20
          --lane ${{ matrix.lane }} --shard ${{ matrix.shard }}/${{ matrix.of }} -n auto --dist worksteal
          "--durations-file=${{ runner.temp }}/shard-durations/durations.json"
          --test-timeout 600 --session-deadline 1800 --max-worker-restart 0
          "--lane-report=${{ runner.temp }}/lane-reports/${{ runner.os }}-${{ matrix.lane }}-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lane-report-${{ runner.os }}-${{ matrix.lane }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lane-reports/*.json
          retention-days: 14

      - uses: ./.github/actions/publish-evidence
        if: failure() || cancelled()
        with:
          source: ${{ runner.temp }}/lane-reports/
          artifact: evidence-lane-report-${{ runner.os }}-${{ matrix.lane }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: success() && runner.os == 'Linux'  # only from a passing job, as core's
        with:
          name: coverage-${{ matrix.lane }}-${{ matrix.shard }}-${{ runner.os }}
          path: ${{ runner.temp }}/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  fastbase:
    # The coverage premise's base (CI plan v7 §5, V5-1): the whole fast lane at the base tip (GITHUB_SHA^1), under
    # coverage, in the same run, with exactly the fast step's flags, xdist included (both sides measured the same way:
    # review of #232, F1 and F6; test_ci_tools compares the two steps' flags), so `assurance` can prove that a
    # fast-tier change did not lower the fast lane's footprint. Keyed on the mode-independent decision, so a shadow
    # run (which stays full) runs it too (V6-1), and only when a fast-lane test module changed: with only docs and
    # durations there is no premise to check (PR #163 review, V7-2). Not a required check: `assurance` is, and requires its success only
    # in the fast tier with a changed module. During shadow a red fastbase is evidence for PR 1b, never a merge blocker.
    name: fastbase
    needs: changes
    if: needs.changes.outputs.decision == 'fast' && needs.changes.outputs.modules == 'true'
    runs-on: ubuntu-24.04
    # At least 2x the slowest measured fast-lane step plus setup (strategy §8: 7.4 and 0.8 minutes), and
    # its timeout before G3a plus the session deadline's clearance (test_ci_tools: PRE_G3A_TIMEOUT_MIN)
    timeout-minutes: 20
    steps:
      # Its start plus timeout-minutes, less bounds.JOB_MARGIN_S + 2 x DEADLINE_MARGIN_S: the number is checked
      # against this job's timeout-minutes by bounds.job_deadline_problems (test_ci_tools), never set by hand.
      - name: The job's deadline for its pytest sessions (G3 H3; tests/helpers/session_deadline.py)
        shell: bash
        run: echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 960 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0     # the base tip, and the spec-pin test verifies the frozen tag
      - run: git fetch --tags --force
      - uses: ./.github/actions/setup-aew
        with:
          python-version: "3.11"
      - name: The base tip in its own worktree
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$GITHUB_SHA^1"
          mkdir -p "$RUNNER_TEMP/fastbase"
      - name: fast lane at the base tip, under coverage
        working-directory: ${{ runner.temp }}/base
        env:
          PYTHONPATH: ${{ runner.temp }}/base/src
          COVERAGE_FILE: ${{ runner.temp }}/fastbase/.coverage
        run: >-
          python -m coverage run -m pytest -q -p no:cacheprovider -n auto --dist worksteal --max-worker-restart 0
          --lane fast --test-timeout 600 --session-deadline 960 "--hang-dir=${{ runner.temp }}/fastbase/hangs"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fastbase-coverage  # outside the `coverage-*` pattern the ratchet combines
          path: ${{ runner.temp }}/fastbase/.coverage
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - uses: ./.github/actions/publish-evidence
        if: failure() || cancelled()
        with:
          source: ${{ runner.temp }}/fastbase/hangs
          artifact: evidence-fastbase-coverage-attempt-${{ github.run_attempt }}

  web:
    # The dashboard (F20.1). Its `result` job decides: checks passed, or nothing it covers changed.
    uses: ./.github/workflows/web.yml

  static:
    # Static checks (strategy, "Static checks"): lint with Bandit's security rules, types on both platforms, and
    # known vulnerabilities in the installed dependencies. Tool versions are pinned in the `lint` extra.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install AEW with the lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parallel,coverage,lint,eval,g3]"
      - name: Ruff (pycodestyle, pyflakes, bugbear, Bandit security rules, pyupgrade, import order)
        if: success() || failure()
        run: ruff check --output-format github .
      - name: Ruff blank-line rules E301-E306 (preview-only in the pinned Ruff, so run apart from the main config)
        if: success() || failure()
        # --select replaces the config's selection, so preview applies to these six rules only; the main config stays
        # non-preview, so no stable rule's detection, fix or code-named output changes (review of #222, W1).
        run: ruff check --preview --select E301,E302,E303,E304,E305,E306 --output-format github .
      # The fast lane's test holds the same check; here it reports in the run's first minutes, whatever the tier.
      - name: Platform skips and their pins, from the source (tools/ci/skip_pins.py)
        if: success() || failure()
        run: python tools/ci/skip_pins.py
      - name: Pyright as Linux
        if: success() || failure()
        run: pyright --pythonplatform Linux
      - name: Pyright as Windows
        if: success() || failure()
        run: pyright --pythonplatform Windows
      # The reference's index is not committed (operator, 2026-11-05), so its counts are printed here for every pull
      # request instead: reported, never gating (the fast lane's `check` gates the committed pages). One render, on
      # Linux only, in this job because it has AEW installed from this checkout and no pytest session deadline.
      - name: The generated reference's counts (tools/reference.py counts; reported, never gating)
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python tools/reference.py counts > "$RUNNER_TEMP/reference-counts.json"
          cat "$RUNNER_TEMP/reference-counts.json"
          {
            echo "## The generated reference's counts"
            echo
            echo "Measured by \`python tools/reference.py counts\` at this run's commit; the index is not committed."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/reference-counts.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: pip-audit (every installed distribution except AEW itself)
        if: success() || failure()
        # The exact installed set, frozen without the editable AEW: --strict then fails only on a vulnerability or on a
        # distribution that cannot be audited (with an editable install present, --strict refuses to skip it).
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"
          pip-audit --strict --desc --no-deps --disable-pip -r "$RUNNER_TEMP/installed.txt"

  assurance:
    # The merge gate: mark this check as required on `main`.
    needs: [changes, core, lanes, web, static, fastbase]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # the run's jobs, for the cost record's queue and runner times; an earlier run's reports
      pull-requests: read  # the recompute reads the `full-ci` label live
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install "PyYAML>=6.0" "coverage[toml]>=7.10" "pytest>=8"
      - id: tier
        name: The tier, recomputed from the same merge commit with the label read live, is not narrower than the one the jobs ran under
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          RAN: ${{ needs.changes.outputs.tier }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          test "$CHANGES_RESULT" = success
          python tools/ci/tier.py --event "$EVENT" --base-ref "$BASE_REF" --merge-ref "$GITHUB_SHA" \
            --repo "$REPO" --pr "$PR" --ran "$RAN" --modules-out "$RUNNER_TEMP/changed-modules.txt" \
            --github-output "$GITHUB_OUTPUT"
      # The jobs were skipped on the tier job's word, so that's worked out again here, from this commit, as the tier is:
      # a label added meanwhile, or a run that can't be read now, fails with what to do. `assure` below then judges the
      # reused reports against this tree's pins, and `static` read those pins against this tree's source.
      - name: "The pin-only shortcut: still the run the jobs were skipped for"
        if: needs.changes.outputs.reuse_run != ''
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REUSE_RUN: ${{ needs.changes.outputs.reuse_run }}
        run: |
          python tools/ci/pin_shortcut.py --event "$GITHUB_EVENT_NAME" --base-ref "$BASE_REF" --merge-ref "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --head-repo "$HEAD_REPO" --reports-dir "$RUNNER_TEMP/reuse-check" \
            --expect "$REUSE_RUN" --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.reuse_run == ''
        with:
          pattern: lane-report-*
          path: lane-reports
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.reuse_run != ''
        with:
          pattern: lane-report-*
          path: lane-reports
          run-id: ${{ needs.changes.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.reuse_run == ''
        with:
          pattern: coverage-*
          path: coverage-data
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.reuse_run != ''
        with:
          pattern: coverage-*
          path: coverage-data
          run-id: ${{ needs.changes.outputs.reuse_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          pattern: fastbase-coverage
          path: fastbase-data
      - uses: actions/download-artifact@v8
        with:
          pattern: shard-durations
          path: shard-durations
          merge-multiple: true
      - id: assure
        name: Every collected test of the tier's lanes ran exactly once and passed (pinned platform skips excepted); in a reduced tier, every test of a changed test module is fast or serial
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          EVENT: ${{ github.event_name }}
        run: >-
          python tools/ci/check_assurance.py lane-reports --skips tests/platform-skips.yaml
          --require linux,win32 --tier "$TIER" --event "$EVENT"
          --changed-modules "$RUNNER_TEMP/changed-modules.txt" --summary "$GITHUB_STEP_SUMMARY"
      # The shard-durations history (register E44; tools/ci/shard_plan.py sizes every run's lanes from it). Only a
      # push to main whose envelope is complete adds to it: every test ran once and passed, so a killed or failed
      # session never moves a duration. How long the run took plays no part: a slow green run is recorded too, so a
      # lane that outgrows its budget is measured and gets more shards. The history never fails the gate
      # (continue-on-error), and a history the update could not write is never saved. A bad one is replaced by the next
      # green run, whose update sets aside one not of a history's shape and starts again (review of #235, F2).
      # Overlapping push runs can lose reports, since the newest save wins (strategy §7; review of #277, F2).
      - name: The shard-durations history so far (main's green push runs only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tier.outputs.tier == 'full'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: shard-history/history.json
          key: shard-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: shard-durations-
      - id: durations
        name: This run's durations join the history (each test keeps its last five; a re-run adds nothing)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tier.outputs.tier == 'full'
        continue-on-error: true
        run: >-
          python tools/ci/update_durations.py lane-reports --history shard-history/history.json
          --seed tests/durations.json --out shard-history/durations.json
          --run-label "${{ github.run_id }}/${{ github.run_attempt }} ${{ github.sha }}"
      - name: Save the history for the next runs
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tier.outputs.tier == 'full'
          && steps.durations.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: shard-history/history.json
          key: shard-durations-${{ github.run_id }}-${{ github.run_attempt }}
      - id: premise
        name: The coverage premise (a changed fast-lane test module in a reduced tier; plan v7 §5)
        if: (success() || failure()) && steps.tier.outputs.tier != 'full' && steps.tier.outputs.modules == 'true'
        env:
          BASE_RESULT: ${{ needs.fastbase.result }}
        run: >-
          python tools/ci/coverage_premise.py --base fastbase-data --head coverage-data
          --head-name "coverage-core-fast-*-Linux" --base-result "$BASE_RESULT" --summary "$GITHUB_STEP_SUMMARY"
      - id: shadow
        name: "Shadow: the fast tier's checks, computed and reported, never gating (plan v7 §7; PR 1b enforces)"
        if: always() && steps.tier.outputs.decision == 'fast' && steps.tier.outputs.tier != 'fast'
        continue-on-error: true
        timeout-minutes: 5  # continue-on-error does not cover the job's timeout: a hang must not cancel the gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_RESULT: ${{ needs.fastbase.result }}
        run: |
          set +e
          mkdir -p tier-shadow
          python tools/ci/check_assurance.py lane-reports --skips tests/platform-skips.yaml \
            --require linux,win32 --tier fast --event "$EVENT" \
            --changed-modules "$RUNNER_TEMP/changed-modules.txt" > tier-shadow/lane-check.txt
          lanecheck=$?
          python tools/ci/coverage_premise.py --base fastbase-data --head coverage-data \
            --head-name "coverage-core-fast-*-Linux" --base-result "$BASE_RESULT" --out tier-shadow/premise.json > tier-shadow/premise.txt
          premise=$?
          cp "$RUNNER_TEMP/changed-modules.txt" tier-shadow/
          printf '{"schema": "aew/tier-shadow/v1", "fastbase": "%s", "lanecheck_exit": %d, "premise_exit": %d}\n' \
            "$BASE_RESULT" "$lanecheck" "$premise" > tier-shadow/shadow.json
          {
            echo "## Shadow: the fast tier (reported, never gating; plan v7 §7)"
            echo ""
            echo "This run would have taken the fast tier. fastbase: $BASE_RESULT; runtime lane check: exit" \
              "$lanecheck; coverage premise: exit $premise (0 means it passed)."
            echo ""
            cat tier-shadow/premise.txt
            grep -E "lane: a changed module|no lane reports" tier-shadow/lane-check.txt
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v7
        if: always() && steps.tier.outputs.decision == 'fast' && steps.tier.outputs.tier != 'fast'
        continue-on-error: true
        timeout-minutes: 3
        with:
          name: tier-shadow
          path: tier-shadow/
          if-no-files-found: ignore
          retention-days: 90
      - name: The cost record (reported, never gated; CI redesign P4, register E43 and E45)
        if: always()
        continue-on-error: true
        timeout-minutes: 3  # continue-on-error does not cover the job's timeout: a hung call must not cancel the gate
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            > "$RUNNER_TEMP/jobs.json" || rm -f "$RUNNER_TEMP/jobs.json"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$RUNNER_TEMP/run.json" \
            || rm -f "$RUNNER_TEMP/run.json"
          changed=()
          if [ -n "$BASE" ]; then
            if git diff --name-only "$BASE"..."$HEAD" > "$RUNNER_TEMP/changed.txt"; then
              changed=(--changed-files "$RUNNER_TEMP/changed.txt")
            fi
          fi
          mkdir -p cost-record
          # the table this run's shards balanced on (the tier job's), or the committed one if it was not uploaded
          durations=shard-durations/durations.json
          [ -f "$durations" ] || durations=tests/durations.json
          python tools/ci/cost_record.py lane-reports --jobs "$RUNNER_TEMP/jobs.json" --run "$RUNNER_TEMP/run.json" \
            --durations "$durations" "${changed[@]}" --out cost-record/cost-record.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        with:
          name: cost-record
          path: cost-record/
          if-no-files-found: ignore
          retention-days: 30
      - name: Coverage holds its baseline (line and branch, Linux lanes; E2; full tier only)
        if: steps.tier.outputs.tier == 'full'
        run: >-
          python tools/ci/coverage_gate.py coverage-data --baseline tests/coverage-baseline.json
          --summary "$GITHUB_STEP_SUMMARY"
      # D2, the discovery layer's output and text rules (tests/helpers/discovery): the findings every lane job wrote
      # beside its lane report, decided against the allow-list. A new key fails only when its rule is enforced. A listed
      # key no longer observed is stale, decided by completeness and not by event: only the full tier with `assure`
      # green proves an output is gone, so a full-tier pull request fails on the change that retires one, and a lost
      # shard decides nothing. On a pull request the list may only shrink and a mode may not fall against the base
      # (either only with the operator-merge label, read live). A capture error fails it.
      - name: "D2: no new violation of an enforced output rule, and the allow-list only shrinks"
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ steps.tier.outputs.tier }}
          ASSURANCE: ${{ steps.assure.outcome }}
        run: |
          base=()
          if [ "$EVENT" = pull_request ]; then
            if git show "$GITHUB_SHA^1:tests/helpers/discovery/allowed.yaml" > "$RUNNER_TEMP/allowed-base.yaml"; then
              base=(--base-allowlist "$RUNNER_TEMP/allowed-base.yaml")
            fi
            git show "$GITHUB_SHA^1:tests/helpers/discovery/modes.py" > "$RUNNER_TEMP/modes-base.py" \
              || rm -f "$RUNNER_TEMP/modes-base.py"  # the ratchet fails on a base it cannot read
            base+=(--base-modes "$RUNNER_TEMP/modes-base.py")
          fi
          python tools/ci/discovery_ratchet.py lane-reports --event "$EVENT" --tier "$TIER" --assurance "$ASSURANCE" \
            "${base[@]}" --repo "$REPO" --pr "$PR" --summary "$GITHUB_STEP_SUMMARY"
      - name: Every test job the tier requires succeeded (lanes are required unless the tier is known and reduced)
        if: always()
        env:
          TIER: ${{ needs.changes.outputs.reuse_run != '' && 'reused' || steps.tier.outputs.tier }}
          CHANGES: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          LANES: ${{ needs.lanes.result }}
          WEB: ${{ needs.web.result }}
          STATIC: ${{ needs.static.result }}
          FASTBASE: ${{ needs.fastbase.result }}
          MODULES: ${{ steps.tier.outputs.modules }}
          LANECHECK: ${{ steps.assure.outcome }}
          PREMISE: ${{ steps.premise.outcome }}
        run: >-
          python3 tools/ci/tier.py --jobs-for "$TIER"
          --jobs "changes=$CHANGES,core=$CORE,lanes=$LANES,web=$WEB,static=$STATIC,fastbase=$FASTBASE"
          --modules-changed "$MODULES" --checks "lanecheck=$LANECHECK,premise=$PREMISE"
