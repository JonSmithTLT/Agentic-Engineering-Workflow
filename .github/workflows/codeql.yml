name: codeql

# Code scanning, replacing GitHub's default setup so that research scripts in eval/ can be excluded
# (.github/codeql/codeql-config.yml). The languages, query suite and weekly schedule match the default setup.
# Not part of the `assurance` merge gate.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"   # weekly, Monday 05:23 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
