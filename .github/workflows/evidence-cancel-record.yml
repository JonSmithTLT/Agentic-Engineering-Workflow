name: Record canceled CI evidence
on:
  workflow_run:
    workflows: [ci, evidence-proof]
    types: [completed]
permissions: {}
jobs:
  record:
    if: github.event.workflow_run.conclusion == 'cancelled' && (github.event.workflow_run.name == 'ci' || startsWith(github.event.workflow_run.display_title, 'evidence-cancel-run-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      actions: read
    concurrency:
      group: record-cancel-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0'
      - name: Record the completed run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: python tools/ci/record_cancel_evidence.py --run "$SOURCE_RUN" --index-dir "$RUNNER_TEMP/cancel-index"
      - name: Publish registered test failures observed before cancellation
        uses: actions/upload-artifact@v7
        with:
          name: flake-sighting-index
          path: ${{ runner.temp }}/cancel-index/sightings.json
          if-no-files-found: ignore
          retention-days: 14
