name: Record canceled CI evidence
on:
  workflow_run:
    workflows: [ci, evidence-proof]
    types: [completed]
permissions: {}
jobs:
  record:
    if: github.event.workflow_run.conclusion == 'cancelled' && (github.event.workflow_run.name == 'ci' || (github.event.workflow_run.name == 'evidence-proof' && github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      actions: read
      pull-requests: read
    concurrency:
      group: record-cancel-evidence-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0'
      - name: Install the pinned publication scanner
        run: python tools/ci/install_evidence.py --scanner-only
      - name: Record the completed run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python tools/ci/record_cancel_evidence.py --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
          --index-dir "$RUNNER_TEMP/cancel-index" --report-dir "$RUNNER_TEMP/cancel-check"
      - name: Publish the complete check when the GitHub summary limit is exceeded
        uses: actions/upload-artifact@v7
        with:
          name: cancel-evidence-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/cancel-check/evidence.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish registered test failures observed before cancellation
        uses: actions/upload-artifact@v7
        with:
          name: flake-sighting-index
          path: ${{ runner.temp }}/cancel-index/sightings.json
          if-no-files-found: ignore
          retention-days: 14
