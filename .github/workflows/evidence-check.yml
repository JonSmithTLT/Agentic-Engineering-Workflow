name: Check published evidence
on:
  workflow_call:
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0'
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: evidence-*
          path: evidence-artifacts
      - name: Report defects from published evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/check_evidence_run.py evidence-artifacts
