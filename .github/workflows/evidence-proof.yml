name: evidence-proof
on:
  pull_request:
    paths:
      - '.github/**'
      - 'tools/ci/**'
      - 'tests/helpers/**'
      - 'tests/conftest.py'
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plant:
    name: plant (${{ matrix.os }}, ${{ matrix.kind }}, ${{ matrix.ablate }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, kind: normal, ablate: none, test_timeout: 120, deadline: 180}
          - {os: ubuntu-24.04, kind: cancel, ablate: none, test_timeout: 120, deadline: 180}
          - {os: ubuntu-24.04, kind: deadline, ablate: none, test_timeout: 120, deadline: 30}
          - {os: ubuntu-24.04, kind: time-limit, ablate: none, test_timeout: 120, deadline: 180}
          - {os: ubuntu-24.04, kind: hang, ablate: none, test_timeout: 8, deadline: 30}
          - {os: ubuntu-24.04, kind: deadline, ablate: stacks, test_timeout: 120, deadline: 30}
          - {os: ubuntu-24.04, kind: hang, ablate: stacks, test_timeout: 8, deadline: 30}
          - {os: windows-latest, kind: normal, ablate: none, test_timeout: 120, deadline: 180}
          - {os: windows-latest, kind: cancel, ablate: none, test_timeout: 120, deadline: 180}
          - {os: windows-latest, kind: deadline, ablate: none, test_timeout: 120, deadline: 30}
          - {os: windows-latest, kind: time-limit, ablate: none, test_timeout: 120, deadline: 180}
          - {os: windows-latest, kind: hang, ablate: none, test_timeout: 8, deadline: 30}
          - {os: windows-latest, kind: deadline, ablate: stacks, test_timeout: 120, deadline: 30}
          - {os: windows-latest, kind: hang, ablate: stacks, test_timeout: 8, deadline: 30}
          - {os: ubuntu-24.04, kind: sigkill, ablate: none, test_timeout: 120, deadline: 180}
          - {os: ubuntu-24.04, kind: deadline, ablate: kind, test_timeout: 120, deadline: 30}
          - {os: ubuntu-24.04, kind: deadline, ablate: running, test_timeout: 120, deadline: 30}
          - {os: ubuntu-24.04, kind: deadline, ablate: header-only, test_timeout: 120, deadline: 30}
          - {os: ubuntu-24.04, kind: deadline, ablate: zero-byte, test_timeout: 120, deadline: 30}
          - {os: windows-latest, kind: deadline, ablate: kind, test_timeout: 120, deadline: 30}
          - {os: windows-latest, kind: deadline, ablate: running, test_timeout: 120, deadline: 30}
          - {os: windows-latest, kind: deadline, ablate: header-only, test_timeout: 120, deadline: 30}
          - {os: windows-latest, kind: deadline, ablate: zero-byte, test_timeout: 120, deadline: 30}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    timeout-minutes: 17
    concurrency:
      group: evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.kind }}-${{ matrix.ablate }}
      cancel-in-progress: true
    steps:
      - name: The job's deadline
        shell: bash
        run: echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 360 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ runner.os == 'Windows' && '3.13' || '3.11' }}
      - name: Real planted lane
        id: lane
        timeout-minutes: 17
        uses: ./.github/actions/lane
        env:
          AEW_EVIDENCE_PLANT: ${{ matrix.kind }}
          AEW_EVIDENCE_ABLATE: ${{ matrix.ablate }}
        with:
          job-label: plant (${{ matrix.os }}, ${{ matrix.kind }}, ${{ matrix.ablate }})
          source: ${{ runner.temp }}/lane-reports
          artifact: plant-${{ runner.os }}-${{ matrix.kind }}-${{ matrix.ablate }}-attempt-${{ github.run_attempt }}
          command: >-
            python -m pytest -q -p no:cacheprovider -n auto --dist worksteal --max-worker-restart 0
            tests/integration/evidence_plants/deaths.py --lane integration
            --test-timeout ${{ matrix.test_timeout }} --session-deadline ${{ matrix.deadline }}
            --session-deadline-margin 3 "--lane-report=${{ runner.temp }}/lane-reports/plant.json"
  cancel-ready-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0' 'pytest>=8'
      - name: Poll the target lane's state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/cancel_evidence_plant.py ubuntu-24.04
  cancel-trigger-linux:
    needs: cancel-ready-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: evidence-${{ github.run_id }}-${{ github.run_attempt }}-ubuntu-24.04-cancel-none
      cancel-in-progress: true
    steps:
      - run: echo 'Queued the planted concurrency cancellation.'
  cancel-ready-windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0' 'pytest>=8'
      - name: Poll the target lane's state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/cancel_evidence_plant.py windows-latest
  cancel-trigger-windows:
    needs: cancel-ready-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    concurrency:
      group: evidence-${{ github.run_id }}-${{ github.run_attempt }}-windows-latest-cancel-none
      cancel-in-progress: true
    steps:
      - run: echo 'Queued the planted concurrency cancellation.'
  verify:
    if: always()
    needs: [plant, cancel-trigger-linux, cancel-trigger-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0'
      - uses: actions/download-artifact@v8
        with:
          pattern: plant-*-attempt-${{ github.run_attempt }}*
          path: published
      - name: Verify downloaded evidence and checker ablations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/verify_evidence.py published
