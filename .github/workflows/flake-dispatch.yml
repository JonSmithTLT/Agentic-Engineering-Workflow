name: Score the first nine ordinary red CI jobs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6'
      - name: Score the original attempts and surviving artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/evidence_scorecard.py --jobs 137616648586 137616648758 137616648523 137616648607 137616648601 137616649111 137616648681 137626437049 137925942195 > "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ordinary-ci-scorecard
          path: ${{ runner.temp }}/scorecard.md
