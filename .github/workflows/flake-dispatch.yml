name: Score the first 30 ordinary red CI jobs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6'
      - name: Score the original attempts and surviving artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/evidence_scorecard.py --jobs 137616648586 137616648758 137616648523 137616648607 137616648601 137616649111 137616648681 137626437049 137925942195 138033663830 138033663643 138033661863 138033663179 138033663598 138033661874 138033661993 138033663393 138033663636 138033663696 138033663580 138033661997 138033663390 138033663766 138033663888 138033663298 138033663422 138033663713 138033663253 138033663590 138033663790 > "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ordinary-ci-scorecard
          path: ${{ runner.temp }}/scorecard.md
