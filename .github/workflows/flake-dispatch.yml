name: flake-dispatch
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: [45493091752, 45494709169]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.source }}
          pattern: windows-fixture-*
          path: observations
      - name: Check all native worker node IDs and planted controls
        run: python tests/helpers/check_store_fixture_probe.py observations
