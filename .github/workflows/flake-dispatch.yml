name: flake-dispatch
on: workflow_dispatch
permissions:
  contents: read
jobs:
  snapshot:
    name: Collect Windows snapshot timeout evidence
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 55e4d028abdaaec53b2b7628eb3db7c112889202
          persist-credentials: false
      - uses: ./.github/actions/setup-aew
        with:
          python-version: "3.13"
      - name: Set the lane deadline
        shell: bash
        run: echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 600 ))" >> "$GITHUB_ENV"
      - name: Collect the three deliberate failures
        id: plants
        continue-on-error: true
        uses: ./.github/actions/lane
        with:
          job-label: Snapshot timeout plants
          source: ${{ runner.temp }}/snap-evidence
          artifact: snapshot-windows-attempt-${{ github.run_attempt }}
          shell: bash
          command: |
            python -m pytest -q -p no:xdist -p no:cacheprovider \
              --hang-dir "$RUNNER_TEMP/snap-evidence" --basetemp "$RUNNER_TEMP/snap-private" \
              tests/integration/messaging_snapshot_plant.py
      - name: Check which plants failed
        shell: pwsh
        run: |
          python -c "import os; from pathlib import Path; base=Path(os.environ['RUNNER_TEMP'],'snap-evidence','autopsy'); records=list(base.glob('*/children/snapshot-timeout.txt')); assert len(records)==3, records; assert all('before cleanup' in p.read_text() for p in records), records"
