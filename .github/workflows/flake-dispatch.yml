name: Observe the normal lane action at its GitHub step timeout
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-lane:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ runner.os == 'Windows' && '3.13' || '3.11' }}
      - name: Set deadline and prime pinned tool installation
        shell: bash
        run: |
          echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 360 ))" >> "$GITHUB_ENV"
          python tools/ci/install_evidence.py
      - name: Actual lane action with a shortened outer limit
        timeout-minutes: 1
        id: lane
        continue-on-error: true
        uses: ./.github/actions/lane
        env:
          AEW_EVIDENCE_PLANT: time-limit-github
        with:
          source: ${{ runner.temp }}/lane-reports
          artifact: actual-timeout-${{ runner.os }}-attempt-${{ github.run_attempt }}
          job-label: actual-lane (${{ matrix.os }})
          command: >-
            python -m pytest -q -p no:cacheprovider -n 1 --dist worksteal --max-worker-restart 0
            tests/integration/evidence_plants/deaths.py --lane integration --test-timeout 120
            --session-deadline 180 --session-deadline-margin 3 "--lane-report=${{ runner.temp }}/lane-reports/plant.json"
      - name: Identify which steps completed inside the real action
        if: always()
        shell: python
        env:
          OUTCOME: ${{ steps.lane.outcome }}
        run: |
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          lane = root/'lane-reports'
          evidence = root/f"actual-timeout-{os.environ['RUNNER_OS']}-attempt-{os.environ['GITHUB_RUN_ATTEMPT']}"
          result = {'outcome': os.environ['OUTCOME'], 'collect_reached': (lane/'runner-resources-job.txt').exists(),
                    'full_scan_reached': (evidence/'inventory.txt').exists(),
                    'observations': [p.name for p in lane.rglob('*.txt') if p.name.startswith(('cancelled-', 'interrupted-'))]}
          print(json.dumps(result))
