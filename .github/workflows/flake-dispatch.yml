name: flake-dispatch
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [receipts, replay]
        default: receipts
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: inputs.mode == 'receipts'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        source: [45493091752, 45494709169]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.source }}
          pattern: windows-fixture-*
          path: observations
      - name: Check all native worker node IDs and planted controls
        run: python tests/helpers/check_store_fixture_probe.py observations
  replay:
    if: inputs.mode == 'replay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6.0' 'pytest>=8'
      - name: Replay real two-parent trees and the required Windows defects
        env:
          PYTHONPATH: tools/ci:tests/helpers:src
        run: python tests/helpers/replay_store_selection_proof.py
