name: flake-dispatch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: base
            revision: 911550a6fdd94718bd21177f5684208efe317641
          - case: fixed
            revision: 571636b877957e40ec27d7e1ab370858b8c4b809
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the original test against the named source revision
        shell: bash
        run: git checkout '${{ matrix.revision }}' -- src tests/integration
      - uses: ./.github/actions/setup-aew
        with:
          python-version: '3.13'
      - name: Order the real assignment, loop guard and worker write
        shell: bash
        env:
          PYTHONPATH: tests/helpers
          PROOF_CASE: ${{ matrix.case }}
        run: |
          log="$RUNNER_TEMP/ordered-wake.log"
          code=0
          python -m pytest -q -s -p wake_assignment_order tests/integration/test_run_progress_digest.py::test_a_real_dispatch_under_a_real_broker_says_end_your_turn_and_the_wake_comes > "$log" 2>&1 || code=$?
          cat "$log"
          if [ "$PROOF_CASE" = base ]; then
            test "$code" -eq 1
            grep -F 'original race posted loop_waiting before the worker write' "$log"
            grep -F "[['loop_waiting']]" "$log"
          else
            test "$code" -eq 0
            grep -F 'fresh projection result: NOTHING_TO_DO' "$log"
          fi
