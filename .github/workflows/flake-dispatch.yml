name: Compare the Windows flake census with periodic snapshots on and off
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  census:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aew
        with:
          python-version: '3.13'
      - name: Install pinned evidence tools
        run: python tools/ci/install_evidence.py
      - name: Compare the same register entries on one runner
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          import sys
          import time
          import yaml

          rows = yaml.safe_load(Path('tests/flake-register.yaml').read_text())['entries']
          nodes = sorted({row['test'] for row in rows if 'windows' in row.get('platforms', []) and row.get('test')})
          stats = []
          for index, value in enumerate([0, 1, 1, 0]):
              root = Path(os.environ['RUNNER_TEMP']) / f'census-{index}'
              root.mkdir()
              script = root / 'command.sh'
              command = [sys.executable, '-m', 'pytest', '-q', '-p', 'no:cacheprovider', '-n', '4', '--dist',
                         'worksteal', '--session-deadline', '1080', '--session-deadline-margin', '3',
                         '--test-timeout', '240', f'--lane-report={root}/report.json', *nodes]
              script.write_text('exec ' + shlex.join(command) + '\n', newline='\n')
              env = {**os.environ, 'AEW_RUNNING_TESTS_DIR': str(root), 'AEW_JOB_DEADLINE': str(time.time() + 1140),
                     'AEW_WORKER_SNAPSHOTS': str(value)}
              start = time.monotonic()
              result = subprocess.run([sys.executable, 'tools/ci/lane_step.py', '--root', str(root), '--script',
                                       str(script)], env=env, timeout=1200)
              report = json.loads((root/'report.json').read_text())
              samples = sum(p.read_text().count('worker snapshot ') for p in (root/'snapshots').glob('*.txt'))
              stats.append({'samples_enabled': bool(value), 'wall_s': round(time.monotonic()-start, 3),
                            'pytest_exit': result.returncode, 'tests': len(report['results']), 'samples': samples,
                            'failed': [node for node, row in report['results'].items() if row['outcome'] != 'passed']})
              print(json.dumps(stats[-1]), flush=True)
          summary = json.dumps(stats, indent=2)
          print(summary, flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write('Paired flake-register census on a single Windows runner\n\n```json\n' + summary + '\n```\n')
          assert all(row['pytest_exit'] == 0 and row['tests'] >= len(nodes) and not row['failed']
                     and row['samples_enabled'] == bool(row['samples']) for row in stats), summary
