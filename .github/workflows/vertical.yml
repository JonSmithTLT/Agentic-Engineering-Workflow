name: vertical

# The vertical UAT (docs/implementation/vertical-uat.md): a fresh project from setup to a published one-line fix, with
# the burden ledger as its measurement. In shadow (`VERTICAL_MODE` in tests/helpers/vertical/ledger.py): it runs on
# dispatch, uploads each scenario's ledger and summary, and is honestly red while the ledger is not zero.
# Not on pushes (operator, 2026-11-08): with no path to green for days, its red on every merge said nothing about that
# merge and left main's page red. The operator turns it back on. To measure: `gh workflow run vertical --ref main`,
# which adds its line to main's series, or `pytest --lane vertical tests/acceptance/test_vertical_path.py` locally.
# Not on pull requests (operator, 2026-10-23, on the designer's ruling that freezes it as a baseline): its result on a
# pull request says nothing about that pull request.
# It is a workflow of its own, so ci.yml's conclusion stays the merge gate's (`assurance`); no required job collects
# its tests (tests/helpers/lanes.py), so it never blocks a merge. Enforcing it is the operator's decision.

on:
  workflow_dispatch:

concurrency:
  group: vertical-${{ github.ref }}
  cancel-in-progress: false  # main's time series: a running run is never cancelled; GitHub keeps the newest pending

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Linux jobs run on ubuntu-24.04, not ubuntu-latest (26.04 since 2026-11-01); matrix `os` stays `ubuntu-latest`,
# the label job names, shard sizing and budgets key on. Why: testing-and-ci-strategy.md §4, "Linux runner image".
jobs:
  vertical:
    name: vertical (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: windows-latest, python: "3.13"}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.os }}
    # its timeout before G3a plus the session deadline's clearance (test_ci_tools: PRE_G3A_TIMEOUT_MIN)
    timeout-minutes: 49
    steps:
      # Its start plus timeout-minutes, less bounds.JOB_MARGIN_S + 2 x DEADLINE_MARGIN_S: the number is checked
      # against this job's timeout-minutes by bounds.job_deadline_problems (test_ci_tools), never set by hand.
      - name: The job's deadline for its pytest sessions (G3 H3; tests/helpers/session_deadline.py)
        shell: bash
        run: echo "AEW_JOB_DEADLINE=$(( $(date +%s) + 2700 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-aew
        with:
          python-version: ${{ matrix.python }}
      - name: pytest --lane vertical (the ledgers go to the runner's temp directory)
        id: pytest
        env:
          AEW_VERTICAL_OUT: ${{ runner.temp }}/vertical
        run: >-
          python -m pytest -q -p no:cacheprovider --lane vertical tests/acceptance/test_vertical_path.py
          -n auto --dist worksteal --test-timeout 1800 --session-deadline 2700 --max-worker-restart 0
          "--hang-dir=${{ runner.temp }}/vertical/hangs" "--junitxml=${{ runner.temp }}/vertical/junit.xml"
      # The series of main's runs (register E115), keyed per OS, the newest found by prefix. The restore and the save
      # use one path: actions/cache keys an entry by its path too (ci.yml's tier job explains it). A branch's dispatch
      # restores main's newest and reports beside it; it saves nothing.
      - name: The series of main's runs, for the scoreboard (the newest)
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vertical/vertical-series.jsonl
          key: vertical-series-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vertical-series-${{ runner.os }}-
      # The not-measured count first (a scenario that ended before its verdict: STG-13, addendum 1), then the V-01 line
      # and the scoreboard with the last ten runs (whether anything moved: register E115), then each ledger's
      # one-screen summary (tests/helpers/vertical/report.py). On main it adds this run's line to the series. It
      # reports, and gates nothing. A JUnit report holds only the scenarios that ran, so "every scenario passes" also
      # reads how the pytest step ended.
      - name: The lane's report and the ledgers' one-screen summaries
        if: always()
        shell: bash
        env:
          PYTHONPATH: tests/helpers
          VERTICAL_PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: python -m vertical.report "${{ runner.temp }}/vertical" >> "$GITHUB_STEP_SUMMARY"
      # Only main writes, so a branch cannot change main's line. No hashFiles guard: it reads only under the workspace,
      # and this path is not, so it would always say empty and nothing would ever be saved.
      - name: This run's series, for main's next run
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vertical/vertical-series.jsonl
          key: vertical-series-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vertical-ledger-${{ runner.os }}
          path: |
            ${{ runner.temp }}/vertical/*.json
            ${{ runner.temp }}/vertical/*.jsonl
            ${{ runner.temp }}/vertical/*.xml
            ${{ runner.temp }}/vertical/*.txt
            ${{ runner.temp }}/vertical/*/vertical-ledger.json
            ${{ runner.temp }}/vertical/*/vertical-summary.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: ./.github/actions/publish-evidence
        if: failure() || cancelled()
        with:
          source: ${{ runner.temp }}/vertical/hangs
          artifact: evidence-vertical-ledger-${{ runner.os }}-attempt-${ github.run_attempt }
