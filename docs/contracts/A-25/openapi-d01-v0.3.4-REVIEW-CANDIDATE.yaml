    PageInfo:
      type: object
      properties:
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        has_more:
          type: boolean
        scope:
          type: string
          enum:
          - effective_recipient_view
        membership:
          type: string
          enum:
          - qualified_scoped
          - unknown
          - not_disclosable
      required:
      - page_size
      - next_cursor
      - has_more
      - scope
      - membership
      additionalProperties: false
      description: Pagination end is scoped to authorized view, never a global absence claim. Cursors bound to effective recipient and
        entitlement.
      allOf:
      - if:
          properties:
            has_more:
              const: true
          required:
          - has_more
        then:
          properties:
            next_cursor:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
      - if:
          properties:
            has_more:
              const: false
          required:
          - has_more
        then:
          properties:
            next_cursor:
              type: 'null'
    ReadResult:
      type: object
      properties:
        wire_version:
          const: 0.3.4
        mode:
          type: string
          enum:
          - list
          - detail
        outcome:
          type: string
          enum:
          - provided
          - partial
          - historical
          - not_established
          - unavailable
          - unsupported
        projection_as_of:
          type: string
          format: date-time
        continuity:
          type: string
          enum:
          - source_qualified
          - revalidate_required
          - unknown
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        page:
          anyOf:
          - $ref: '#/components/schemas/PageInfo'
          - type: 'null'
        limitations:
          type: array
          items:
            type: string
            enum:
            - redacted
            - partial_source
            - source_unqualified
            - source_unavailable
            - G1_unqualified
            - G2_unqualified
            - G3_unqualified
            - G4_unqualified
            - historical_only
            - knowledge_receipts_missing
        correlation_id:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        collection_basis:
          anyOf:
          - $ref: '#/components/schemas/SourceStamp'
          - type: 'null'
        effective_recipient_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        journal_selection:
          $ref: '#/components/schemas/JournalSelection'
      required:
      - wire_version
      - mode
      - outcome
      - projection_as_of
      - continuity
      - items
      - page
      - limitations
      - correlation_id
      - collection_basis
      - effective_recipient_ref
      additionalProperties: false
      description: Presence is explicit. List always has page; detail has null page. Failure of identity/disclosure is a Problem response,
        not a green empty set.
      allOf:
      - if:
          properties:
            mode:
              const: detail
          required:
          - mode
        then:
          properties:
            page:
              type: 'null'
            items:
              maxItems: 1
      - if:
          properties:
            mode:
              const: list
          required:
          - mode
        then:
          properties:
            page:
              $ref: '#/components/schemas/PageInfo'
      - if:
          properties:
            outcome:
              const: unavailable
          required:
          - outcome
        then:
          properties:
            continuity:
              enum:
              - revalidate_required
              - unknown
      - if:
          properties:
            mode:
              const: detail
            outcome:
              const: provided
          required:
          - mode
          - outcome
        then:
          properties:
            items:
              minItems: 1
              maxItems: 1
      - if:
          properties:
            mode:
              const: detail
            outcome:
              const: historical
          required:
          - mode
          - outcome
        then:
          properties:
            items:
              minItems: 1
              maxItems: 1
      - if:
          properties:
            continuity:
              const: source_qualified
          required:
          - continuity
        then:
          properties:
            items:
              items:
                properties:
                  source:
                    properties:
                      observation_state:
                        const: present_current
      - if:
          properties:
            mode:
              const: detail
            outcome:
              enum:
              - provided
              - partial
              - historical
              - not_established
          required:
          - mode
          - outcome
        then:
          properties:
            items:
              minItems: 1
              maxItems: 1
    Problem:
      type: object
      properties:
        type:
          const: about:blank
        title:
          type: string
        status:
          type: integer
          enum:
          - 400
          - 401
          - 404
          - 409
          - 503
        code:
          type: string
          enum:
          - invalid_request
          - authentication_unqualified
          - not_found_or_not_disclosable
          - cursor_stale_or_unauthorized
          - owner_unavailable
        retry:
          type: string
          enum:
          - never
          - reauthenticate
          - refresh_read
          - when_source_recovers
          - not_established
        correlation_id:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
      required:
      - type
      - title
      - status
      - code
      - retry
      - correlation_id
      additionalProperties: false
      description: No hidden fact IDs, reason classes or counts in error details. 404 used for both hidden and nonexistent.
      allOf:
      - if:
          properties:
            code:
              const: invalid_request
          required:
          - code
        then:
          properties:
            status:
              const: 400
            retry:
              const: never
      - if:
          properties:
            code:
              const: authentication_unqualified
          required:
          - code
        then:
          properties:
            status:
              const: 401
            retry:
              const: reauthenticate
      - if:
          properties:
            code:
              const: not_found_or_not_disclosable
          required:
          - code
        then:
          properties:
            status:
              const: 404
            retry:
              const: never
      - if:
          properties:
            code:
              const: cursor_stale_or_unauthorized
          required:
          - code
        then:
          properties:
            status:
              const: 409
            retry:
              const: refresh_read
      - if:
          properties:
            code:
              const: owner_unavailable
          required:
          - code
        then:
          properties:
            status:
              const: 503
            retry:
              const: when_source_recovers
