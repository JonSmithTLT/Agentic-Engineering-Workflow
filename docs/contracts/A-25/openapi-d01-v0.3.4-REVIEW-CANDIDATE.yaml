components:
  securitySchemes:
    readSession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Transport bearer only; privilege above agent-equivalent requires separately qualified read-principal isolation/binding,
        not this token alone.
  schemas:
    SubjectRef:
      type: object
      properties:
        kind:
          type: string
          enum:
          - epic
          - story
          - ticket
          - accepted_revision
          - composition_commitment
          - dependency_conflict
          - assignment
          - effect_grant
          - attachment_generation
          - execution_activity
          - package
          - assurance_basis
          - assurance_evidence
          - assurance_determination
          - hold
          - composed_outcome
          - inquiry
          - research_claim
          - experiment
          - premise_use
          - attention
          - protected_intent
          - fact_projection
          - coordination_message
          - waiting_condition
          - knowledge_record
          - knowledge_activity
          - release_coverage
          - profile_capability
          - continuation_state
          - owner_operation_index
          - hold_recovery
        id:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        revision:
          anyOf:
          - type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-]{0,191}$
          - type: 'null'
        generation:
          anyOf:
          - type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-]{0,191}$
          - type: 'null'
        package_digest:
          anyOf:
          - type: string
            pattern: ^sha256:[0-9a-f]{64}$
          - type: 'null'
      required:
      - kind
      - id
      - revision
      - generation
      - package_digest
      additionalProperties: false
      description: Knowledge/coverage refs are auxiliary read projections, not new authority owners. Nullable disambiguators are explicitly
        null when inapplicable.
    Closure:
      type: object
      properties:
        domain:
          type: string
          enum:
          - accepted_revision_membership
          - mandatory_obligation_roster
          - applicable_hold_collection
          - source_visibility
          - other_governed_set
        owner:
          type: string
          enum:
          - ADC
          - AEV
          - CNI
          - HEB
          - WIS
          - RESEARCH
          - KNOWLEDGE
          - IF13
          - RESOURCE_POLICY_ISSUER
        epoch:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        version:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        coverage_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        completeness:
          type: string
          enum:
          - qualified_complete
          - qualified_scoped
          - unknown
          - not_disclosable
      required:
      - domain
      - owner
      - epoch
      - version
      - coverage_ref
      - completeness
      additionalProperties: false
      description: Only governing owner can attest membership/absence. Scoped closure is never all-domain closure.
      allOf:
      - if:
          properties:
            domain:
              enum:
              - mandatory_obligation_roster
              - applicable_hold_collection
          required:
          - domain
        then:
          properties:
            owner:
              const: AEV
      - if:
          properties:
            domain:
              const: accepted_revision_membership
          required:
          - domain
        then:
          properties:
            owner:
              const: WIS
    Renewal:
      type: object
      properties:
        kind:
          type: string
          enum:
          - source_valid_until
          - qualified_continuity
          - none
        source_proof_ref:
          anyOf:
          - type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
          - type: 'null'
        valid_until:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        qualified_owner:
          anyOf:
          - type: string
            enum:
            - ADC
            - AEV
            - CNI
            - HEB
            - WIS
            - RESEARCH
            - HOST_ASSESSOR
            - IF10
            - IF12
            - AUDIT_OBSERVER
            - IF13
            - R01
          - type: 'null'
        source_epoch:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
          - type: 'null'
        coverage_ref:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
          - type: 'null'
        verification_method:
          type: string
          enum:
          - source_attested_interval
          - source_continuity_validation
          - none
        checked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        invalidation:
          type: string
          enum:
          - expiry_or_revalidation_failure
          - source_invalidated
          - none
      required:
      - kind
      - source_proof_ref
      - valid_until
      - qualified_owner
      - source_epoch
      - coverage_ref
      - verification_method
      - checked_at
      - invalidation
      additionalProperties: false
      description: Owner-issued renewal. Provider receipt timestamp never renews source conclusion.
      allOf:
      - if:
          properties:
            kind:
              const: source_valid_until
          required:
          - kind
        then:
          properties:
            source_proof_ref:
              type: string
            valid_until:
              type: string
              format: date-time
      - if:
          properties:
            kind:
              const: none
          required:
          - kind
        then:
          properties:
            source_proof_ref:
              type: 'null'
            valid_until:
              type: 'null'
      - if:
          properties:
            kind:
              enum:
              - source_valid_until
              - qualified_continuity
          required:
          - kind
        then:
          properties:
            source_proof_ref:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
            valid_until:
              type: string
              format: date-time
            qualified_owner:
              type: string
              enum:
              - ADC
              - AEV
              - CNI
              - HEB
              - WIS
              - RESEARCH
              - HOST_ASSESSOR
              - IF10
              - IF12
              - AUDIT_OBSERVER
              - IF13
              - R01
            source_epoch:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
            coverage_ref:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
            checked_at:
              type: string
              format: date-time
            verification_method:
              enum:
              - source_attested_interval
              - source_continuity_validation
            invalidation:
              enum:
              - expiry_or_revalidation_failure
              - source_invalidated
      - if:
          properties:
            kind:
              const: none
          required:
          - kind
        then:
          properties:
            qualified_owner:
              type: 'null'
            source_epoch:
              type: 'null'
            coverage_ref:
              type: 'null'
            checked_at:
              type: 'null'
            verification_method:
              const: none
            invalidation:
              const: none
    SourceStamp:
      type: object
      properties:
        owner:
          type: string
          enum:
          - ADC
          - AEV
          - AUDIT_OBSERVER
          - CNI
          - HEB
          - HOST_ASSESSOR
          - IF10
          - IF12
          - IF13
          - KNOWLEDGE
          - R01
          - RELEASE
          - RESEARCH
          - WIS
        fact_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        source_epoch:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        source_version:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        coverage_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        observed_at:
          type: string
          format: date-time
        qualification:
          type: string
          enum:
          - qualified
          - not_established
          - unqualified
        observation_state:
          type: string
          enum:
          - present_current
          - historical
          - stale
          - unknown
          - unavailable
          - unsupported
        renewal:
          $ref: '#/components/schemas/Renewal'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/Closure'
        authority_class:
          type: string
          enum:
          - governing_determination
          - qualified_observation
          - unqualified_report
        governing_owner:
          anyOf:
          - type: string
            enum:
            - ADC
            - AEV
            - CNI
            - HEB
            - WIS
            - RESEARCH
          - type: 'null'
        issuer_ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
        owner_coverage_class:
          type: string
          enum:
          - qualified_source_basis
          - receipt_observation
          - accepted_operator_scope
          - not_established
      required:
      - owner
      - fact_ref
      - source_epoch
      - source_version
      - coverage_ref
      - observed_at
      - qualification
      - observation_state
      - renewal
      - closures
      - authority_class
      - governing_owner
      - issuer_ref
      - owner_coverage_class
      additionalProperties: false
      description: Source qualification is separate from transport uptime; exact stamp is owner-issued or qualification attributed,
        never frontend invented.
      allOf:
      - if:
          properties:
            observation_state:
              const: present_current
          required:
          - observation_state
        then:
          properties:
            qualification:
              const: qualified
            renewal:
              properties:
                kind:
                  enum:
                  - source_valid_until
                  - qualified_continuity
                source_proof_ref:
                  type: string
              required:
              - source_proof_ref
      - if:
          properties:
            owner:
              enum:
              - KNOWLEDGE
              - RELEASE
          required:
          - owner
        then:
          properties:
            authority_class:
              enum:
              - qualified_observation
              - unqualified_report
      - if:
          properties:
            authority_class:
              const: governing_determination
          required:
          - authority_class
        then:
          properties:
            governing_owner:
              type: string
              enum:
              - ADC
              - AEV
              - CNI
              - HEB
              - WIS
              - RESEARCH
            owner_coverage_class:
              const: qualified_source_basis
      - if:
          properties:
            authority_class:
              const: governing_determination
          required:
          - authority_class
        then:
          properties:
            owner:
              enum:
              - ADC
              - AEV
              - CNI
              - HEB
              - WIS
              - RESEARCH
    Disclosure:
      type: object
      properties:
        form:
          type: string
          enum:
          - full
          - qualified_coarse
          - redacted
          - not_disclosable
        policy_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        scope_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        effective_recipient_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        qualified_release:
          type: boolean
      required:
      - form
      - policy_ref
      - scope_ref
      - effective_recipient_ref
      - qualified_release
      additionalProperties: false
      description: Per effective principal+lineage/assignment/subject context. Scope_ref is opaque non-secret qualified token, not bearer
        authority.
    FieldSource:
      type: object
      properties:
        field_path:
          type: string
          pattern: ^data\.[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z][A-Za-z0-9_]*){0,2}$
        source:
          $ref: '#/components/schemas/SourceStamp'
      required:
      - field_path
      - source
      additionalProperties: false
      description: Explicit authoritative owner source for mixed-origin consequential data fields.
    Provenance:
      type: object
      properties:
        kind:
          type: string
          enum:
          - canonical_owner
          - qualified_derivation
          - agent_narrative
          - imported_narrative
          - service_observation
        owner_or_author:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        source_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
      required:
      - kind
      - owner_or_author
      - source_ref
      additionalProperties: false
      description: Narrative always inert. No author text as authoritative decision.
    Attribution:
      type: object
      properties:
        text:
          type: string
        provenance:
          $ref: '#/components/schemas/Provenance'
        render:
          const: inert_text
      required:
      - text
      - provenance
      - render
      additionalProperties: false
    Link:
      type: object
      properties:
        relation:
          type: string
          enum:
          - parent
          - child
          - depends_on
          - package
          - evidence
          - determination
          - hold
          - claim
          - knowledge
          - work
          - received_by
          - produced_by
          - accepted_interface
          - source
          - historical_generation
        target:
          $ref: '#/components/schemas/SubjectRef'
        availability:
          const: navigable
      required:
      - relation
      - target
      - availability
      additionalProperties: false
      description: Only currently recipient-eligible, exact resolvable, reauthorized links may be emitted. Restricted/unknown targets
        have no Link object and no per-hidden placeholder.
    WaitingData:
      type: object
      properties:
        work:
          $ref: '#/components/schemas/SubjectRef'
        cause:
          type: string
          enum:
          - mandatory_result
          - qualified_hold
          - dependency
          - resource_conflict
          - operator_need
          - authority
          - other_qualified
          - unknown
        basis_refs:
          $ref: '#/components/schemas/MemberView'
        responsible_owner:
          type: string
          enum:
          - ADC
          - AEV
          - CNI
          - HEB
          - WIS
          - RESEARCH
        progress:
          type: string
          enum:
          - blocked
          - independent_work_allowed
          - unknown
        action_status:
          type: string
          enum:
          - read_only
          - no_qualified_response_path
          - unsupported
        narrative:
          anyOf:
          - $ref: '#/components/schemas/Attribution'
          - type: 'null'
        impact_assessment:
          anyOf:
          - $ref: '#/components/schemas/ImpactAssessment'
          - type: 'null'
      required:
      - work
      - cause
      - basis_refs
      - responsible_owner
      - progress
      - action_status
      - narrative
      additionalProperties: false
    AttentionData:
      type: object
      properties:
        work:
          anyOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        lane:
          type: string
          enum:
          - owner_issued
          - agent_attention
        category:
          type: string
          enum:
          - decision_need
          - blocker
          - clarification
          - direction_brief
          - expiry
        root_lineage_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        priority:
          type: string
          enum:
          - owner_time_critical
          - owner_normal
          - agent_normal
          - agent_summarized
        summary_of_excess:
          type: boolean
        narrative:
          $ref: '#/components/schemas/Attribution'
      required:
      - work
      - lane
      - category
      - root_lineage_ref
      - priority
      - summary_of_excess
      - narrative
      additionalProperties: false
      description: Priority and lane are owner-derived; agent text never sets urgency. Per root lineage aggregated flood limits.
      allOf:
      - if:
          properties:
            lane:
              const: agent_attention
          required:
          - lane
        then:
          properties:
            priority:
              enum:
              - agent_normal
              - agent_summarized
            category:
              enum:
              - clarification
              - direction_brief
              - blocker
      - if:
          properties:
            lane:
              const: owner_issued
          required:
          - lane
        then:
          properties:
            priority:
              enum:
              - owner_time_critical
              - owner_normal
    AttachmentData:
      type: object
      properties:
        generation:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        attachment_state:
          type: string
          enum:
          - attached
          - closed
          - suspended
          - preparing
          - unknown
        aew_lead_authority:
          type: string
          enum:
          - active
          - revoked
          - unknown
        custody:
          type: string
          enum:
          - held
          - draining
          - released
          - none
          - unknown
        harness_state:
          type: string
          enum:
          - observed_running
          - observed_stopped
          - unknown
        held_result_refs:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
        current_generation_ref:
          anyOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        lineage_basis:
          anyOf:
          - $ref: '#/components/schemas/AuthorityLineageBasis'
          - type: 'null'
      required:
      - generation
      - attachment_state
      - aew_lead_authority
      - custody
      - harness_state
      - held_result_refs
      - current_generation_ref
      additionalProperties: false
      description: Closed AEW attachment does not mean model conversation or remote process killed.
    WorkData:
      type: object
      properties:
        work_kind:
          type: string
          enum:
          - epic
          - story
          - ticket
        accepted_revision:
          anyOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        parent:
          anyOf:
          - $ref: '#/components/schemas/SubjectRef'
          - type: 'null'
        child_refs:
          $ref: '#/components/schemas/MemberView'
        accepted_interface_refs:
          $ref: '#/components/schemas/MemberView'
        composition:
          type: string
          enum:
          - accepted
          - provisional
          - blocked
          - not_established
          - not_applicable
        completion:
          type: string
          enum:
          - qualified_complete
          - in_progress
          - blocked
          - not_established
        narrative:
          anyOf:
          - $ref: '#/components/schemas/Attribution'
          - type: 'null'
      required:
      - work_kind
      - accepted_revision
      - parent
      - child_refs
      - accepted_interface_refs
      - composition
      - completion
      - narrative
      additionalProperties: false
      description: Child completion never means qualified parent completion; no default all-work ready.
    PackageData:
      type: object
      properties:
        work:
          $ref: '#/components/schemas/SubjectRef'
        digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        designation:
          type: string
          enum:
          - provisional
          - protected_accepted
          - unknown
        accepted_revision:
          $ref: '#/components/schemas/SubjectRef'
        g1:
          type: string
          enum:
          - CONFORMING
          - NONCONFORMING
          - NOT_ESTABLISHED
          - unavailable
          - not_applicable
        baseline_limitations:
          type: array
          items:
            type: string
        source_closure_ref:
          anyOf:
          - type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
          - type: 'null'
      required:
      - work
      - digest
      - designation
      - accepted_revision
      - g1
      - baseline_limitations
      - source_closure_ref
      additionalProperties: false
      description: G1 result is independently qualified under adopted D-02 when available; no assumed historical main baseline.
      allOf:
      - if:
          properties:
            g1:
              const: CONFORMING
          required:
          - g1
        then:
          properties:
            designation:
              enum:
              - provisional
              - protected_accepted
    AssuranceData:
      type: object
      properties:
        target:
          $ref: '#/components/schemas/SubjectRef'
        accepted_revision:
          $ref: '#/components/schemas/SubjectRef'
        obligation_state:
          type: string
          enum:
          - all_satisfied
          - missing_mandatory
          - unknown
        hold_state:
          type: string
          enum:
          - none_qualified
          - outstanding
          - unknown
        readiness:
          type: string
          enum:
          - qualified_clear
          - blocked
          - not_established
          - historical
        mandatory_obligations:
          $ref: '#/components/schemas/MemberView'
        determination_refs:
          $ref: '#/components/schemas/MemberView'
        applicable_hold_refs:
          $ref: '#/components/schemas/MemberView'
        g1_conformance:
          type: string
          enum:
          - CONFORMING
          - NONCONFORMING
          - NOT_ESTABLISHED
          - unavailable
          - not_applicable
        roster_closure:
          $ref: '#/components/schemas/Closure'
        hold_closure:
          $ref: '#/components/schemas/Closure'
      required:
      - target
      - accepted_revision
      - obligation_state
      - hold_state
      - readiness
      - mandatory_obligations
      - determination_refs
      - applicable_hold_refs
      - g1_conformance
      - roster_closure
      - hold_closure
      additionalProperties: false
      description: Missing obligation is not HOLD. Empty visible hold list does not establish absence. Qualified-clear requires both
        qualified complete closures.
      allOf:
      - if:
          properties:
            readiness:
              const: qualified_clear
          required:
          - readiness
        then:
          properties:
            obligation_state:
              const: all_satisfied
            hold_state:
              const: none_qualified
            g1_conformance:
              enum:
              - CONFORMING
              - not_applicable
            roster_closure:
              properties:
                completeness:
                  const: qualified_complete
            hold_closure:
              properties:
                completeness:
                  const: qualified_complete
    ClaimData:
      type: object
      properties:
        qualification:
          type: string
          enum:
          - qualified
          - limited
          - challenged
          - historical
          - not_established
        scope_conditions:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        premise_use_refs:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
      required:
      - qualification
      - scope_conditions
      - limitations
      - premise_use_refs
      - evidence_refs
      additionalProperties: false
      description: Research finding not engineering acceptance or scope authority.
    KnowledgeData:
      type: object
      properties:
        knowledge_id:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        version:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        kind:
          type: string
          enum:
          - raw_history
          - case
          - lesson
        admission:
          type: string
          enum:
          - admitted
          - candidate
          - held
          - rejected
          - not_established
        serving:
          type: string
          enum:
          - eligible
          - held
          - restricted
          - unknown
        lifecycle:
          type: string
          enum:
          - active
          - challenged
          - superseded
          - historical
          - unknown
        work_refs:
          $ref: '#/components/schemas/MemberView'
        root_evidence_refs:
          $ref: '#/components/schemas/MemberView'
        producer_lineage:
          anyOf:
          - type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
          - type: 'null'
        admission_basis_ref:
          anyOf:
          - type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
          - type: 'null'
        limitations:
          type: array
          items:
            type: string
        summary:
          $ref: '#/components/schemas/Attribution'
      required:
      - knowledge_id
      - version
      - kind
      - admission
      - serving
      - lifecycle
      - work_refs
      - root_evidence_refs
      - producer_lineage
      - admission_basis_ref
      - limitations
      - summary
      additionalProperties: false
      description: Knowledge is a durable source-linked read projection. Case observation and Lesson interpretation remain distinct.
        No model-internal learning assertion.
      allOf:
      - if:
          properties:
            admission:
              const: admitted
          required:
          - admission
        then:
          properties:
            admission_basis_ref:
              type: string
      - if:
          properties:
            kind:
              const: lesson
          required:
          - kind
        then:
          properties:
            admission:
              not:
                const: not_established
    ActivityData:
      type: object
      properties:
        knowledge_ref:
          $ref: '#/components/schemas/SubjectRef'
        agent_lineage:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        work:
          $ref: '#/components/schemas/SubjectRef'
        activity:
          type: string
          enum:
          - selected
          - prepared
          - delivered
          - cited
          - benefit_evaluated
        receipt_ref:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        observation_at:
          type: string
          format: date-time
        benefit:
          type: string
          enum:
          - not_evaluated
          - supported
          - not_supported
          - inconclusive
        basis_refs:
          type: array
          items:
            $ref: '#/components/schemas/SubjectRef'
      required:
      - knowledge_ref
      - agent_lineage
      - work
      - activity
      - receipt_ref
      - observation_at
      - benefit
      - basis_refs
      additionalProperties: false
      description: Activity kind and benefit qualification are independent. Delivered/cited not proof of model used or was helped.
      allOf:
      - if:
          properties:
            activity:
              not:
                const: benefit_evaluated
          required:
          - activity
        then:
          properties:
            benefit:
              const: not_evaluated
            basis_refs:
              maxItems: 0
      - if:
          properties:
            benefit:
              enum:
              - supported
              - not_supported
              - inconclusive
          required:
          - benefit
        then:
          properties:
            activity:
              const: benefit_evaluated
            basis_refs:
              minItems: 1
    CoverageData:
      type: object
      properties:
        journey:
          type: string
          enum:
          - J01
          - J02
          - J03
          - J04
          - J05
          - J06
          - J07
          - J08
        channel:
          type: string
          enum:
          - backend_api
          - private_website
        commitment:
          type: string
          enum:
          - core_read
          - bounded_read
          - informational_only
          - degraded_only
          - not_committed
        implementation:
          type: string
          enum:
          - qualified_producer_available
          - implemented_unqualified
          - fixture_only
          - unsupported
          - unknown
        qualification:
          type: string
          enum:
          - provider_tested
          - consumer_tested
          - composed_tested
          - runtime_qualified
          - not_tested
        evidence_refs:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
        gate_refs:
          type: array
          items:
            type: string
            enum:
            - G1
            - G2
            - G3
            - G4
        qualification_basis:
          anyOf:
          - $ref: '#/components/schemas/QualifiedCoverageBasis'
          - type: 'null'
      required:
      - journey
      - channel
      - commitment
      - implementation
      - qualification
      - evidence_refs
      - gate_refs
      - qualification_basis
      additionalProperties: false
      description: Coverage values are evidence-bound. Never infer qualified from schema or fixture pass.
      allOf:
      - if:
          properties:
            qualification:
              not:
                const: not_tested
          required:
          - qualification
        then:
          properties:
            qualification_basis:
              $ref: '#/components/schemas/QualifiedCoverageBasis'
            evidence_refs:
              minItems: 1
    Resource:
      type: object
      properties:
        resource_type:
          type: string
          enum:
          - waiting
          - attention
          - attachment
          - work
          - package
          - assurance
          - claim
          - knowledge
          - knowledge_activity
          - coverage
          - subject_detail
          - journal_history
          - capability
          - run
          - continuation_vector
          - owner_operation_index
          - hold_recovery
        ref:
          $ref: '#/components/schemas/SubjectRef'
        source:
          $ref: '#/components/schemas/SourceStamp'
        disclosure:
          $ref: '#/components/schemas/Disclosure'
        data:
          type: object
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        field_sources:
          type: array
          items:
            $ref: '#/components/schemas/FieldSource'
      required:
      - resource_type
      - ref
      - source
      - disclosure
      - data
      - links
      - field_sources
      additionalProperties: false
      description: Resource-specific data required and separately typed by resource_type. Owner_operation_index resources contain one
        operation entry, NOT a collection. Collection closure is outer only.
      allOf:
      - if:
          properties:
            resource_type:
              const: waiting
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/WaitingData'
            ref:
              properties:
                kind:
                  enum:
                  - waiting_condition
      - if:
          properties:
            resource_type:
              const: attention
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/AttentionData'
            ref:
              properties:
                kind:
                  enum:
                  - attention
      - if:
          properties:
            resource_type:
              const: attachment
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/AttachmentData'
            ref:
              properties:
                kind:
                  enum:
                  - attachment_generation
      - if:
          properties:
            resource_type:
              const: work
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/WorkData'
            ref:
              properties:
                kind:
                  enum:
                  - epic
                  - story
                  - ticket
      - if:
          properties:
            resource_type:
              const: package
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/PackageData'
            ref:
              properties:
                kind:
                  enum:
                  - package
      - if:
          properties:
            resource_type:
              const: assurance
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/AssuranceData'
            ref:
              properties:
                kind:
                  enum:
                  - assurance_basis
      - if:
          properties:
            resource_type:
              const: claim
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/ClaimData'
            ref:
              properties:
                kind:
                  enum:
                  - research_claim
      - if:
          properties:
            resource_type:
              const: knowledge
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/KnowledgeData'
            ref:
              properties:
                kind:
                  enum:
                  - knowledge_record
      - if:
          properties:
            resource_type:
              const: knowledge_activity
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/ActivityData'
            ref:
              properties:
                kind:
                  enum:
                  - knowledge_activity
      - if:
          properties:
            resource_type:
              const: coverage
          required:
          - resource_type
        then:
          properties:
            data:
              $ref: '#/components/schemas/CoverageData'
            ref:
              properties:
                kind:
                  enum:
                  - release_coverage
      - if:
          properties:
            resource_type:
              const: subject_detail
          required:
          - resource_type
        then:
          properties:
            ref:
              properties:
                kind:
                  enum:
                  - assurance_basis
                  - assurance_evidence
                  - assurance_determination
                  - hold
                  - composition_commitment
                  - dependency_conflict
                  - package
            data:
              $ref: '#/components/schemas/SubjectDetailData'
      - if:
          properties:
            resource_type:
              const: assurance
            data:
              properties:
                readiness:
                  const: qualified_clear
              required:
              - readiness
          required:
          - resource_type
          - data
        then:
          properties:
            source:
              properties:
                owner:
                  const: AEV
                qualification:
                  const: qualified
                observation_state:
                  const: present_current
            disclosure:
              properties:
                form:
                  enum:
                  - full
                  - qualified_coarse
                qualified_release:
                  const: true
            data:
              properties:
                obligation_state:
                  const: all_satisfied
                hold_state:
                  const: none_qualified
                roster_closure:
                  properties:
                    domain:
                      const: mandatory_obligation_roster
                    owner:
                      const: AEV
                    completeness:
                      const: qualified_complete
                hold_closure:
                  properties:
                    domain:
                      const: applicable_hold_collection
                    owner:
                      const: AEV
                    completeness:
                      const: qualified_complete
      - if:
          properties:
            resource_type:
              const: package
          required:
          - resource_type
        then:
          properties:
            field_sources:
              contains:
                properties:
                  field_path:
                    const: data.g1
                  source:
                    properties:
                      owner:
                        const: AEV
                required:
                - field_path
                - source
              minContains: 1
            source:
              properties:
                owner:
                  const: WIS
      - if:
          properties:
            resource_type:
              const: work
          required:
          - resource_type
        then:
          properties:
            field_sources:
              contains:
                properties:
                  field_path:
                    const: data.accepted_revision
                  source:
                    properties:
                      owner:
                        const: WIS
                required:
                - field_path
                - source
              minContains: 1
      - if:
          properties:
            resource_type:
              const: assurance
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: AEV
      - if:
          properties:
            resource_type:
              const: attachment
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: HEB
      - if:
          properties:
            resource_type:
              const: waiting
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: CNI
      - if:
          properties:
            resource_type:
              const: attention
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: CNI
      - if:
          properties:
            resource_type:
              const: claim
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: RESEARCH
      - if:
          properties:
            resource_type:
              const: work
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: CNI
      - if:
          properties:
            resource_type:
              const: knowledge
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: KNOWLEDGE
      - if:
          properties:
            resource_type:
              const: knowledge_activity
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: KNOWLEDGE
      - if:
          properties:
            resource_type:
              const: coverage
          required:
          - resource_type
        then:
          properties:
            source:
              properties:
                owner:
                  const: RELEASE
      - if:
          properties:
            disclosure:
              properties:
                form:
                  const: qualified_coarse
              required:
              - form
          required:
          - disclosure
        then:
          properties:
            disclosure:
              properties:
                qualified_release:
                  const: true
      - if:
          properties:
            disclosure:
              properties:
                form:
                  enum:
                  - redacted
                  - not_disclosable
              required:
              - form
          required:
          - disclosure
        then:
          properties:
            disclosure:
              properties:
                qualified_release:
                  const: false
