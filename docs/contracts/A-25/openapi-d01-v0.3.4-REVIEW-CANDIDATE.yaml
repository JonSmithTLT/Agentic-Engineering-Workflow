          uniqueItems: true
        assessment_scope_ref:
          type:
          - string
          - 'null'
        assessment_source_epoch:
          type:
          - string
          - 'null'
        limitation_classes:
          type: array
          uniqueItems: true
          items:
            enum:
            - host_isolation
            - operator_origin
            - effect_route
            - disclosure
            - resource_meter
            - history_integrity
            - source_unavailable
            - profile_transition
