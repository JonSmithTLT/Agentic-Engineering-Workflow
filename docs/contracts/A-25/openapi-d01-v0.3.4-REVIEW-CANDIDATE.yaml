      - effective_profile_ref
      - effective_state
      - controller_qualification
      - capability_role
      - observed_status
      - assessment_status
      - assessment_issuer_ref
      - assessment_evidence_refs
      - assessment_scope_ref
      - assessment_source_epoch
      - limitation_classes
      - history_audit
      - authority_effect
      - installation_ref
      - binding_epoch
      properties:
        capability_id:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,95}$
        profile_definition_ref:
          type:
          - string
          - 'null'
        requested_profile_ref:
          type:
          - string
          - 'null'
        observed_profile_ref:
          type:
          - string
          - 'null'
        effective_profile_ref:
          type:
          - string
          - 'null'
        effective_state:
          enum:
          - REQUESTED
          - CHECKING
          - HELD
          - APPLYING
          - EFFECTIVE
          - FAILED
          - UNKNOWN_EFFECT
          - SUPERSEDED
          - NOT_ESTABLISHED
        controller_qualification:
          enum:
          - QUALIFIED
