            assessment_scope_ref:
              type: string
              minLength: 1
            assessment_source_epoch:
              type: string
              minLength: 1
            assessment_evidence_refs:
              minItems: 1
    HistoryAuditObservation:
      type: object
      additionalProperties: false
      required:
      - audit_scope_ref
      - audit_run_ref
      - observation
      - protection_claim
      - auditor_basis_ref
      - observed_at
      - backlog_count
      - over_policy_count
      - limitations
      - observation_producer_ref
      - inspected_scope_ref
      - inspected_population_ref
      - inspection_period_start
      - inspection_period_end
      - inspection_epoch
      - coverage_state
      - excluded_scope_ref
      - claim_scope
      properties:
        audit_scope_ref:
          type: string
        audit_run_ref:
          type:
          - string
          - 'null'
        observation:
          enum:
          - OBSERVED_NO_FINDINGS
          - BACKLOG
          - OVER_POLICY
          - UNKNOWN
          - UNAVAILABLE
        protection_claim:
          enum:
          - TAMPER_DETECTION_ONLY
          - NOT_ESTABLISHED
          - QUALIFIED_PROTECTED_SCOPE
        auditor_basis_ref:
          type:
          - string
          - 'null'
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        backlog_count:
          type:
          - integer
          - 'null'
          minimum: 0
        over_policy_count:
          type:
          - integer
          - 'null'
          minimum: 0
        limitations:
          type: array
          items:
            type: string
        observation_producer_ref:
          type:
          - string
          - 'null'
        inspected_scope_ref:
          type:
          - string
          - 'null'
        inspected_population_ref:
          type:
          - string
          - 'null'
        inspection_period_start:
          type:
          - string
          - 'null'
          format: date-time
        inspection_period_end:
          type:
          - string
          - 'null'
          format: date-time
        inspection_epoch:
          type:
          - string
          - 'null'
        coverage_state:
          enum:
          - INSPECTED_SET_BOUNDED
          - REQUESTED_SCOPE_QUALIFIED_COMPLETE
          - PARTIAL_WITH_OMISSIONS
          - NOT_ESTABLISHED
        excluded_scope_ref:
          type:
          - string
          - 'null'
        claim_scope:
          enum:
          - INSPECTED_SET_ONLY
          - REQUESTED_SCOPE_QUALIFIED_COMPLETE
          - UNKNOWN
      description: Auditor-origin bounded detection observation (not independent protection). No-findings always limited to attributable
        inspected set/period, with omissions and requested-scope incompleteness explicit. Null counters are withheld/unknown. Issuer
        qualification requires Layer B.
      allOf:
      - if:
          properties:
            observation:
              enum:
              - OBSERVED_NO_FINDINGS
              - BACKLOG
              - OVER_POLICY
        then:
          properties:
            audit_run_ref:
              type: string
              minLength: 1
            observation_producer_ref:
              type: string
              minLength: 1
            inspected_scope_ref:
              type: string
              minLength: 1
            inspected_population_ref:
              type: string
              minLength: 1
            inspection_epoch:
              type: string
              minLength: 1
            inspection_period_start:
              type: string
              format: date-time
            inspection_period_end:
              type: string
              format: date-time
            observed_at:
              type: string
              format: date-time
          not:
            properties:
              coverage_state:
                const: NOT_ESTABLISHED
      - if:
          properties:
            observation:
              const: OBSERVED_NO_FINDINGS
        then:
          properties:
            claim_scope:
              enum:
              - INSPECTED_SET_ONLY
              - REQUESTED_SCOPE_QUALIFIED_COMPLETE
      - if:
          properties:
            protection_claim:
              const: TAMPER_DETECTION_ONLY
        then:
          properties:
            claim_scope:
              enum:
              - INSPECTED_SET_ONLY
              - UNKNOWN
      - if:
          properties:
            claim_scope:
              const: REQUESTED_SCOPE_QUALIFIED_COMPLETE
          required:
          - claim_scope
        then:
          properties:
            coverage_state:
              const: REQUESTED_SCOPE_QUALIFIED_COMPLETE
            excluded_scope_ref:
              type: 'null'
            auditor_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            coverage_state:
              const: REQUESTED_SCOPE_QUALIFIED_COMPLETE
          required:
          - coverage_state
        then:
          properties:
            claim_scope:
              const: REQUESTED_SCOPE_QUALIFIED_COMPLETE
            excluded_scope_ref:
              type: 'null'
            auditor_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            protection_claim:
              const: QUALIFIED_PROTECTED_SCOPE
          required:
          - protection_claim
        then:
          properties:
            auditor_basis_ref:
              type: string
              minLength: 1
            claim_scope:
              const: REQUESTED_SCOPE_QUALIFIED_COMPLETE
    RunData:
      type: object
      additionalProperties: false
      required:
      - invocation_ref
      - work_ref
      - attachment_ref
      - phase
      - progress_basis_ref
      - started_at
      - last_progress_at
      - elapsed_observed_seconds
      - elapsed_basis_ref
      - custody_state
      - custody_basis_ref
      - resource_state
      - resource_basis_ref
      - source_epoch
      - limitations
      - authority_effect
      - phase_observation_class
      - phase_basis_ref
      - stall_assessment
      - stall_basis_ref
      - wake_assessment
      - wake_basis_ref
      - remote_effect_state
      - remote_effect_basis_ref
      - remote_effect_domain
      - non_model_effect_state
      - non_model_effect_basis_ref
      - non_model_resource_exposure
      - non_model_resource_basis_ref
      - whole_invocation_effect_clearance
      - whole_invocation_resource_clearance
      properties:
        invocation_ref:
          $ref: '#/components/schemas/SubjectRef'
        work_ref:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SubjectRef'
        attachment_ref:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SubjectRef'
        phase:
          enum:
          - OBSERVED_ACTIVE
          - OBSERVED_IDLE
          - OBSERVED_FINISHED
          - REPORTED_ACTIVE
          - REPORTED_IDLE
          - REPORTED_FINISHED
          - INFERRED_ACTIVE
          - INFERRED_IDLE
          - INFERRED_FINISHED
          - UNKNOWN
          - WITHHELD
        progress_basis_ref:
          type:
          - string
          - 'null'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        last_progress_at:
          type:
          - string
          - 'null'
          format: date-time
        elapsed_observed_seconds:
          type:
          - integer
          - 'null'
          minimum: 0
        elapsed_basis_ref:
          type:
          - string
          - 'null'
        custody_state:
          enum:
          - HEB_HELD
          - HEB_DRAINING
          - HEB_ATTACHED
          - HEB_CLOSED
          - UNKNOWN
          - WITHHELD
        custody_basis_ref:
          type:
          - string
          - 'null'
        resource_state:
          $ref: '#/components/schemas/RunResourceSummary'
        resource_basis_ref:
          type:
          - string
          - 'null'
        source_epoch:
          type:
          - string
          - 'null'
        limitations:
          type: array
          items:
            enum:
            - cooperative_only
            - source_unqualified
            - historical_only
            - unknown_remote_effect
            - custody_withheld
            - private_usage_withheld
            - progress_suspected
            - partial_observation
        authority_effect:
          const: READ_ONLY_NO_LIFECYCLE_EFFECT
        phase_observation_class:
          enum:
          - HEB_OBSERVED
          - AGENT_REPORTED
          - MODEL_INFERRED
          - UNKNOWN
          - WITHHELD
        phase_basis_ref:
          type:
          - string
          - 'null'
        stall_assessment:
          enum:
          - POSSIBLE_STALL
          - NO_STALL_OBSERVED
          - NOT_ESTABLISHED
          - WITHHELD
        stall_basis_ref:
          type:
          - string
          - 'null'
        wake_assessment:
          enum:
          - WAKE_OVERDUE
          - NOT_OVERDUE_OBSERVED
          - NOT_ESTABLISHED
          - WITHHELD
        wake_basis_ref:
          type:
          - string
          - 'null'
        remote_effect_state:
          enum:
          - UNKNOWN_EFFECT
          - POSSIBLE_EFFECT
          - NO_EFFECT_QUALIFIED
          - SETTLED_OBSERVED
          - NOT_ESTABLISHED
          - WITHHELD
          description: Only remote effect across IF12_MODEL_DELIVERY_ONLY model-delivery calls; whole-invocation clearance remains NOT_ESTABLISHED
        remote_effect_basis_ref:
          type:
          - string
          - 'null'
        remote_effect_domain:
          const: IF12_MODEL_DELIVERY_ONLY
          description: Model-provider effects across all IF-12 original model-delivery operations of this invocation, NEVER all non-model
            effects
        non_model_effect_state:
          enum:
          - NOT_ESTABLISHED
          - UNKNOWN_EFFECT
          - POSSIBLE_EFFECT
          - WITHHELD
          description: Separately attributable HEB non-model external/tool effect uncertainty; no whole-domain clear state
        non_model_effect_basis_ref:
          type:
          - string
          - 'null'
        non_model_resource_exposure:
          enum:
          - UNKNOWN
          - POSSIBLE_CHARGE
          - UNSETTLED
          - WITHHELD
          description: Separately attributable R-01 resource/tool exposure outside the model-delivery accounting domain
        non_model_resource_basis_ref:
          type:
          - string
          - 'null'
        whole_invocation_effect_clearance:
          const: NOT_ESTABLISHED
          description: No selected all-effects issuer/universe; model-only qualification NEVER upgrades this
        whole_invocation_resource_clearance:
          const: NOT_ESTABLISHED
          description: No selected all-resource accounting universe; model-only charge closure NEVER upgrades this
      description: Distinct phase with typed provenance, stall and wake suspicion, possible external effect, HEB custody, R-01/IF-10
        resource facts; simultaneous conditions are permitted. Schema strings never qualify an issuer or actor. No lifecycle effect.
      allOf:
      - if:
          properties:
            phase:
              enum:
              - OBSERVED_ACTIVE
              - OBSERVED_IDLE
              - OBSERVED_FINISHED
        then:
          properties:
            phase_observation_class:
              const: HEB_OBSERVED
      - if:
          properties:
            phase:
              enum:
              - REPORTED_ACTIVE
              - REPORTED_IDLE
              - REPORTED_FINISHED
        then:
          properties:
            phase_observation_class:
              const: AGENT_REPORTED
      - if:
          properties:
            phase:
              enum:
              - INFERRED_ACTIVE
              - INFERRED_IDLE
              - INFERRED_FINISHED
        then:
          properties:
            phase_observation_class:
              const: MODEL_INFERRED
      - if:
          properties:
            phase:
              const: UNKNOWN
        then:
          properties:
            phase_observation_class:
              const: UNKNOWN
      - if:
          properties:
            phase:
              const: WITHHELD
        then:
          properties:
            phase_observation_class:
              const: WITHHELD
      - if:
          properties:
            phase_observation_class:
              const: HEB_OBSERVED
          required:
          - phase_observation_class
        then:
          properties:
            phase_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            stall_assessment:
              enum:
              - POSSIBLE_STALL
              - NO_STALL_OBSERVED
          required:
          - stall_assessment
        then:
          properties:
            stall_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            wake_assessment:
              enum:
              - WAKE_OVERDUE
              - NOT_OVERDUE_OBSERVED
          required:
          - wake_assessment
        then:
          properties:
            wake_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            remote_effect_state:
              enum:
              - UNKNOWN_EFFECT
              - POSSIBLE_EFFECT
              - NO_EFFECT_QUALIFIED
              - SETTLED_OBSERVED
          required:
          - remote_effect_state
        then:
          properties:
            remote_effect_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            elapsed_observed_seconds:
              type: integer
          required:
          - elapsed_observed_seconds
        then:
          properties:
            elapsed_basis_ref:
              type: string
              minLength: 1
      - if:
          properties:
            custody_state:
              enum:
              - HEB_HELD
              - HEB_DRAINING
              - HEB_ATTACHED
              - HEB_CLOSED
          required:
          - custody_state
        then:
          properties:
            custody_basis_ref:
              type: string
              minLength: 1
    RunResourceSummary:
      type: object
      additionalProperties: false
      required:
      - accounting_class
      - monetary_amount
      - currency
      - usage_units
      - observation_class
      - outstanding_exposure
      - original_operation_ref
      - accounting_domain
      properties:
        accounting_class:
          enum:
          - COOPERATIVE
          - HARD_QUALIFIED
          - NOT_APPLICABLE
          - UNKNOWN
          - WITHHELD
        monetary_amount:
          type:
          - string
          - 'null'
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
        currency:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{3}$
        usage_units:
          type:
          - integer
          - 'null'
          minimum: 0
        observation_class:
          enum:
          - SOURCE_QUALIFIED
          - PROVIDER_OBSERVED
          - GATEWAY_COOPERATIVE
          - UNKNOWN
          - WITHHELD
        outstanding_exposure:
          enum:
          - NONE_QUALIFIED
          - POSSIBLE_CHARGE
          - UNSETTLED
          - UNKNOWN
          - WITHHELD
          description: Only outstanding exposure in IF10_MODEL_DELIVERY_ONLY model-delivery accounting domain, never whole-run expenses
        original_operation_ref:
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
          description: Operation attributed usage, or null only when independent complete zero-operation run closure qualifies NONE_QUALIFIED.
        accounting_domain:
          const: IF10_MODEL_DELIVERY_ONLY
          description: IF-10 accounting for model-delivery operations; not all other run resources or expenses
      description: Amounts may be omitted for confidentiality; null never means zero. Owner currentness and private parent scope still
        assessed independently.
      allOf:
      - if:
          properties:
            accounting_class:
              const: HARD_QUALIFIED
          required:
          - accounting_class
        then:
          properties:
            observation_class:
              const: SOURCE_QUALIFIED
      - if:
          properties:
            accounting_class:
              const: HARD_QUALIFIED
            outstanding_exposure:
              not:
                const: NONE_QUALIFIED
          required:
          - accounting_class
          - outstanding_exposure
        then:
          properties:
            original_operation_ref:
              type: string
              minLength: 1
