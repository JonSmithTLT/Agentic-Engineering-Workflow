          - not_established
        unaffected_subset_basis:
          anyOf:
          - $ref: '#/components/schemas/SourceStamp'
          - type: 'null'
          description: CNI proof of exact disclosed unaffected subset; absence is not evidence of independence, especially when total
            affected universe is unknown.
        unaffected_scope_comparison:
          anyOf:
          - $ref: '#/components/schemas/CNIImpactScopeComparison'
          - type: 'null'
          description: Mandatory CNI-qualified comparison for nonempty positive unaffected subset, including exact owner-issued binding
            coverage; null when no positive unaffected subset is asserted.
      allOf:
      - if:
          properties:
            qualified_unaffected:
              properties:
                refs:
                  minItems: 1
              required:
              - refs
          required:
          - qualified_unaffected
        then:
          properties:
            unaffected_subset_basis:
              $ref: '#/components/schemas/SourceStamp'
            unaffected_scope_comparison:
              $ref: '#/components/schemas/CNIImpactScopeComparison'
