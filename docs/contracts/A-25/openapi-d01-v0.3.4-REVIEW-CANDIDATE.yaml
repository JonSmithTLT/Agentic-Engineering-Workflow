    get:
      operationId: resolveDisclosedSubject
      summary: Bounded recipient-qualified exact subject resolver (no graph or command effects)
      description: For a Link with availability=navigable only; use literal exact SubjectRef fields encoded as RFC3986 query components.
        No inferable hidden targets; requalify every read; absent or restricted 404.
      parameters:
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum:
          - assurance_basis
          - assurance_evidence
          - assurance_determination
          - hold
          - composition_commitment
          - dependency_conflict
          - package
      - name: id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,191}$
        description: Exact canonical ID in RFC3986 query encoding; query decoding is once and rejects invalid/double-encoded forms.
      - name: revision
        in: query
        required: false
        schema: &id001
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:\-]{0,191}$
      - name: generation
