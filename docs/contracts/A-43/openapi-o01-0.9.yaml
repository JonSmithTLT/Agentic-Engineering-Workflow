      - source_valid_until
      - result
      - wire_version
      properties:
        owner:
          enum:
          - HEB
          - ADC
          - IF13
          - RESOURCE_POLICY_ISSUER
          - WIS
          - CNI
          - AEV
          - R01
        operation_ref:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9:._-]{2,127}$
        request_set_ref:
          type: string
        intent_ref:
          type: string
        recipient_ref:
          type: string
        installation_ref:
          type: string
        source_epoch:
          type: string
        observed_at:
          $ref: '#/components/schemas/RFC3339Offset'
        source_valid_until:
