    Problem:
      type: object
      properties:
        type:
          const: about:blank
        title:
          type: string
        status:
          type: integer
          enum:
          - 400
          - 401
          - 404
          - 409
          - 503
        code:
          type: string
          enum:
          - invalid_request
          - authentication_unqualified
          - not_found_or_not_disclosable
          - cursor_stale_or_unauthorized
          - owner_unavailable
          - operator_origin_not_established
          - operator_origin_unqualified
          - precondition_changed
          - request_key_conflict
          - unsupported_action
          - unresolved_no_redispatch
        retry:
          type: string
          enum:
          - never
          - reauthenticate
          - refresh_read
          - when_source_recovers
          - not_established
        correlation_id:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:\-/]{0,191}$
      required:
      - type
      - title
      - status
      - code
      - retry
      - correlation_id
      additionalProperties: false
      description: No hidden fact IDs, reason classes or counts in error details. 404 used for both hidden and nonexistent.
      allOf:
      - if:
          properties:
            code:
              const: invalid_request
          required:
          - code
        then:
          properties:
            status:
              const: 400
            retry:
              const: never
      - if:
          properties:
            code:
              const: authentication_unqualified
          required:
          - code
        then:
          properties:
            status:
              const: 401
            retry:
              const: reauthenticate
      - if:
          properties:
            code:
              const: not_found_or_not_disclosable
          required:
          - code
        then:
          properties:
            status:
              const: 404
            retry:
              const: never
      - if:
          properties:
            code:
              const: cursor_stale_or_unauthorized
          required:
          - code
        then:
          properties:
            status:
              const: 409
            retry:
              const: refresh_read
      - if:
          properties:
            code:
              const: owner_unavailable
          required:
          - code
        then:
          properties:
            status:
              const: 503
            retry:
              const: when_source_recovers
      - if:
          properties:
            code:
              const: operator_origin_not_established
          required:
          - code
        then:
          properties:
            status:
              const: 401
            retry:
              const: not_established
      - if:
          properties:
            code:
              const: operator_origin_unqualified
          required:
          - code
        then:
          properties:
            status:
              const: 401
            retry:
              const: reauthenticate
      - if:
          properties:
            code:
              const: precondition_changed
          required:
          - code
        then:
          properties:
            status:
              const: 409
            retry:
              const: refresh_read
      - if:
          properties:
            code:
              const: request_key_conflict
          required:
          - code
        then:
          properties:
            status:
              const: 409
            retry:
              const: never
      - if:
          properties:
            code:
              const: unsupported_action
          required:
          - code
        then:
          properties:
            status:
              const: 400
            retry:
              const: never
      - if:
          properties:
            code:
              const: unresolved_no_redispatch
          required:
          - code
        then:
          properties:
            status:
              const: 409
            retry:
              const: never
    OwnerOperationRead:
      type: object
      additionalProperties: false
      required:
      - owner
      - operation_ref
      - request_set_ref
      - intent_ref
      - recipient_ref
      - installation_ref
      - source_epoch
