openapi: 3.1.0
info:
  title: AEW Read-only Dashboard API — C0 PROVISIONAL
  version: 0.1.0
  description: Not approved for domain implementation. AEW main-line contracts remain
    authoritative. Every route is same-origin GET/HEAD with authenticated cookies;
    no durable storage layout exposed.
servers:
- url: /api/v1
security:
- session: []
x-c0-review:
  status: PENDING
  questions:
  - Accept action_projection as the capability name for /attention?
  - Accept four-state capability objects with reasons, absent means UNKNOWN?
  - Accept snake_case wire names and opaque string control_revision?
  - Accept bounded cursor snapshots (100 default, 250 max), 409 expiration?
  - Confirm all states, reason codes, queue fields and historical/currentness semantics
    against Engine contracts.
  - Confirm projection timestamps and ETag scope; no frontend derivation of conclusions.
