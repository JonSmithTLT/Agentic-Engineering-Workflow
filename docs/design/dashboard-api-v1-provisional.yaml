        severity:
          type: string
        subject:
          $ref: '#/components/schemas/EntityRef'
        title:
          type: string
        summary:
          $ref: '#/components/schemas/RichText'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        first_seen_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - kind
      - severity
      - subject
      - title
      - summary
      - reasons
      - first_seen_at
      additionalProperties: false
    Activity:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        subject:
          $ref: '#/components/schemas/EntityRef'
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        title:
          type: string
        reason:
          anyOf:
          - $ref: '#/components/schemas/Reason'
          - type: 'null'
      required:
      - id
      - subject
      - occurred_at
      - title
      - reason
      additionalProperties: false
    Overview:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/Project'
        health:
          $ref: '#/components/schemas/Health'
        summary:
          $ref: '#/components/schemas/RichText'
        work:
          type: array
          items:
            $ref: '#/components/schemas/Work'
          maxItems: 6
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Invocation'
          maxItems: 6
        attention:
          type: array
          items:
            $ref: '#/components/schemas/Attention'
          maxItems: 6
        activity:
          type: array
          items:
            $ref: '#/components/schemas/Activity'
          maxItems: 10
        counts:
          type: object
          properties:
            work:
              $ref: '#/components/schemas/WorkCounts'
            runs:
              type: integer
              minimum: 0
            attention:
              type: integer
              minimum: 0
          required:
