          maxItems: 250
        summary:
          $ref: '#/components/schemas/RichText'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - id
      - role
      - status
      - work
      - created_at
      - runs
      - summary
      - evidence
      - reasons
      additionalProperties: false
      description: An engine invocation, including invocations with no harness run. /runs
        lists these objects. Nested statuses are observed harness telemetry and do not establish
        invocation completion or authority.
    EvaluatedSnapshot:
      type: object
      properties:
        base_revision:
          anyOf:
          - type: string
          - type: 'null'
        relevant_inputs_fingerprint:
          type: string
          description: Opaque engine fingerprint, including git-tree:<hex>. Do not interpret
            as a bare SHA-256.
        artifact_digests:
          type: array
          items:
            type: string
            description: Opaque engine artifact digest string.
          maxItems: 250
      required:
      - base_revision
      - relevant_inputs_fingerprint
      - artifact_digests
      additionalProperties: false
      description: Explicit path-free snapshot projection. workspace_id and storage/workspace/observation
        paths are excluded.
    EvidencePlanRevision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
