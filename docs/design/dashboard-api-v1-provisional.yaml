    Cursor:
      type: string
      minLength: 1
      description: Opaque cursor; not an entity ID. Scope includes project, route,
        filters and limit. History cursors pin the starting manifest count and stable
        sequence, and survive appends. Hot collection cursors expire on control_revision
        changes.
    ControlRevision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      description: Engine integer control revision serialized as a decimal string;
        monotonic per project. Observed harness telemetry can change without advancing
        this revision.
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    TicketState:
      type: string
      x-known-values:
      - BLOCKED
      - READY
      - ASSIGNED
      - RUNNING
      - REVIEW_PENDING
      - REVIEW_FAILED
      - REVIEW_PASSED
      - VERIFY_PENDING
      - VERIFICATION_FAILED
      - VERIFICATION_INCONCLUSIVE
      - VERIFIED
      - COMMIT_READY
      - DONE
      - INTERRUPTED
      - REPLAN_REQUIRED
      - ESCALATED
      - CANCELLED
      description: Open backend semantic value. Unknown values display their raw string
        with a warning; no client conclusion is inferred.
    ParentState:
      type: string
      x-known-values:
      - PLANNING
      - IN_PROGRESS
      - ACCEPTANCE_PENDING
