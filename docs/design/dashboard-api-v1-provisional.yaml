        '304':
          description: Representation unchanged. No payload. Preserve generated_at
            and control_revision; update only client last_checked_at.
        '401':
          description: Session required.
        '403':
          description: Capability unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Opaque identity does not exist.
