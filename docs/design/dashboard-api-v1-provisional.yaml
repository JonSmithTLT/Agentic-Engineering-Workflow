    Cursor:
      type: string
      minLength: 1
      description: Opaque cursor; not an entity ID. Scope includes project, route, filters
        and limit. History cursors pin the starting manifest count and stable sequence, and
        survive appends. Hot collection cursors expire on control_revision changes.
    ControlRevision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      description: Engine integer control revision serialized as a decimal string; monotonic
        per project. Observed harness telemetry can change without advancing this revision.
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    TicketState:
      type: string
      x-known-values:
      - BLOCKED
      - READY
      - ASSIGNED
      - RUNNING
      - REVIEW_PENDING
      - REVIEW_FAILED
      - REVIEW_PASSED
      - VERIFY_PENDING
      - VERIFICATION_FAILED
      - VERIFICATION_INCONCLUSIVE
      - VERIFIED
      - COMMIT_READY
      - DONE
      - INTERRUPTED
      - REPLAN_REQUIRED
      - ESCALATED
      - CANCELLED
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    ParentState:
      type: string
      x-known-values:
      - PLANNING
      - IN_PROGRESS
      - ACCEPTANCE_PENDING
      - DONE
      - CANCELLED
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    WorkState:
      type: string
      x-known-values:
      - BLOCKED
      - READY
      - ASSIGNED
      - RUNNING
      - REVIEW_PENDING
      - REVIEW_FAILED
      - REVIEW_PASSED
      - VERIFY_PENDING
      - VERIFICATION_FAILED
      - VERIFICATION_INCONCLUSIVE
      - VERIFIED
      - COMMIT_READY
      - DONE
      - INTERRUPTED
      - REPLAN_REQUIRED
      - ESCALATED
      - CANCELLED
      - PLANNING
      - IN_PROGRESS
      - ACCEPTANCE_PENDING
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    InvocationRole:
      type: string
      x-known-values:
      - implementer
      - reviewer
      - verifier
      - planner
      - investigator
      - researcher
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    InvocationStatus:
      type: string
      x-known-values:
      - active
      - completed
      - cancelled
      - interrupted
      - revoked
      - superseded
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    HarnessStatus:
      type: string
      x-known-values:
      - starting
      - running
      - launch_failed
      - ended_with_evidence
      - ended_without_evidence
      - crashed
      - terminated
      - unconfirmed
      - lost
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    DecisionType:
      type: string
      x-known-values:
      - verification_failure_classification
      - authority_transfer
      - authority_acceptance
      - authority_rejection
      - waiver
      - manifest_adoption
      - state_regression
      - cancellation
      - reconciliation
      - plan_acceptance
      - promotion
      - role_plan_change
      - closeout
      - evidence_acceptance
      - hierarchy_change
      - dependency_change
      - plan_reconfirmation
      - input_acknowledgement
      - attempt_supersession
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    WorkCounts:
      type: object
      properties:
        open:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
      required:
      - open
      - done
      - cancelled
      additionalProperties: false
      description: Backend-computed counts. For Work.rollup, open counts Tickets in the entire
        parent subtree that are not DONE or CANCELLED; done and cancelled count subtree Tickets
        in those states, including archived Tickets through the parent summary. children contains
        direct children, and its bounded preview never determines rollup. For Overview.counts.work,
        open counts hot open units; done and cancelled are archived counts by state.
    Integration:
      type: object
      properties:
        status:
          anyOf:
          - type: string
            x-known-values:
            - prepared
            - publishing
            - conflict
            - superseded
            description: Open backend semantic value. Unknown values display their raw string
              with a warning; no client conclusion is inferred.
          - type: 'null'
        commit:
          anyOf:
          - type: string
          - type: 'null'
        commit_ready_seq:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - status
      - commit
      - commit_ready_seq
      additionalProperties: false
