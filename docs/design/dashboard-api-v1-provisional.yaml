components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: aew_session
      description: Illustrative cookie name pending backend bootstrap/security review;
        frontend uses same-origin credentials.
  schemas:
    OpaqueId:
      type: string
      description: Opaque, nonempty identifier. Never parse or derive ordering. Encode
        as a path segment.
      minLength: 1
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
      description: UTC timestamp.
    Reason:
      type: object
      properties:
        code:
          type: string
        message:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - code
      - message
      additionalProperties: false
    EntityRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - kind
      - title
      additionalProperties: false
    RichText:
      type: object
      properties:
        format:
          type: string
          x-known-values:
          - plain
          - markdown
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        text:
          type: string
      required:
      - format
      - text
      additionalProperties: false
    Capability:
      type: object
      properties:
        state:
          type: string
          x-known-values:
          - AVAILABLE
          - UNAVAILABLE
          - UNSUPPORTED
          - UNKNOWN
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - state
      - reasons
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        overview:
          $ref: '#/components/schemas/Capability'
        work:
          $ref: '#/components/schemas/Capability'
        runs:
          $ref: '#/components/schemas/Capability'
        evidence:
          $ref: '#/components/schemas/Capability'
        knowledge:
          $ref: '#/components/schemas/Capability'
        history:
          $ref: '#/components/schemas/Capability'
        integrity:
          $ref: '#/components/schemas/Capability'
        queue:
          $ref: '#/components/schemas/Capability'
        action_projection:
          $ref: '#/components/schemas/Capability'
        activity:
          $ref: '#/components/schemas/Capability'
      required: []
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          x-known-values:
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          - UNKNOWN
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - status
      - reasons
      - observed_at
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        aew_version:
          type: string
      required:
      - id
      - name
      - aew_version
      additionalProperties: false
    Work:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          x-known-values:
          - epic
          - story
          - ticket
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        title:
          type: string
        state:
          type: string
        parent_id:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        revision:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        classification:
          anyOf:
          - type: string
          - type: 'null'
        assurance:
          anyOf:
          - type: string
          - type: 'null'
        has_attention:
          type: boolean
        summary:
          $ref: '#/components/schemas/RichText'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        related:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - id
      - kind
      - title
      - state
      - parent_id
      - revision
      - classification
      - assurance
      - has_attention
      - summary
      - reasons
      - related
      - updated_at
      additionalProperties: false
    Run:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        work:
          $ref: '#/components/schemas/EntityRef'
        status:
          type: string
        role:
          type: string
        started_at:
          $ref: '#/components/schemas/Timestamp'
        finished_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        summary:
          $ref: '#/components/schemas/RichText'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - id
      - work
      - status
      - role
      - started_at
      - finished_at
      - summary
      - evidence
      - reasons
      additionalProperties: false
    Evidence:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
        result:
          type: string
        subject:
          $ref: '#/components/schemas/EntityRef'
        currentness:
          type: string
        requires_disposition:
          type: boolean
        claim:
          $ref: '#/components/schemas/RichText'
        body:
          $ref: '#/components/schemas/RichText'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        deviations:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        bindings:
          type: object
          additionalProperties: true
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
      required:
      - id
      - kind
      - result
      - subject
      - currentness
      - requires_disposition
      - claim
      - body
      - findings
      - deviations
      - bindings
      - provenance
      additionalProperties: false
    Knowledge:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          x-known-values:
          - decision
          - fact
          - assumption
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        title:
          type: string
        state:
          type: string
        body:
          $ref: '#/components/schemas/RichText'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
      required:
      - id
      - kind
      - title
      - state
      - body
      - reasons
      - provenance
      additionalProperties: false
    History:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        subject:
          $ref: '#/components/schemas/EntityRef'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
        currentness:
          type: string
        annotation:
          type: string
        body:
          $ref: '#/components/schemas/RichText'
        lineage:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
      required:
      - id
      - subject
      - recorded_at
      - currentness
      - annotation
      - body
      - lineage
      additionalProperties: false
    Integrity:
      type: object
      properties:
        status:
          type: string
        current_root:
          anyOf:
          - type: string
          - type: 'null'
        verified_root:
          anyOf:
          - type: string
          - type: 'null'
        verified_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        last_full_audit_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        backlog:
          type: integer
          minimum: 0
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - status
      - current_root
      - verified_root
      - verified_at
      - last_full_audit_at
      - backlog
      - reasons
      additionalProperties: false
    Queue:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        work:
          $ref: '#/components/schemas/EntityRef'
        state:
          type: string
          x-known-values:
          - QUEUED
          - LEASED
          - DEFERRED
          - AWAITING_DISPOSITION
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        position:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        commit_ready_seq:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        attempt:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        publication_mode:
          anyOf:
          - type: string
            x-known-values:
            - PUBLISH_IF_CLEAN
            - VALIDATE_ONLY
            description: Open semantic value. Unknown strings must display an explicit
              warning with the raw value.
          - type: 'null'
        custodian:
          anyOf:
          - type: string
          - type: 'null'
        lease_started_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
        current_base:
          anyOf:
          - type: string
          - type: 'null'
        latest_validation:
          anyOf:
          - $ref: '#/components/schemas/Reason'
          - type: 'null'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - id
      - work
      - state
      - position
      - commit_ready_seq
      - attempt
      - publication_mode
      - custodian
      - lease_started_at
      - current_base
      - latest_validation
      - reasons
      additionalProperties: false
    Attention:
      type: object
      properties:
        id:
