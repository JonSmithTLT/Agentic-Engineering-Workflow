components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: aew_session
      description: Illustrative cookie name pending backend bootstrap/security review;
        frontend uses same-origin credentials.
  schemas:
    OpaqueId:
      type: string
      description: Server-declared path-safe opaque identity (including project/card
        slugs). Do not parse identity, order, or storage layout.
      minLength: 1
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
    Timestamp:
      type: string
      format: date-time
      pattern: Z$
      description: UTC timestamp.
    Reason:
      type: object
      properties:
        code:
          type: string
          description: Any backend code string. A shared registry (including contradictions)
            is main-line integration work. Always show the backend message; never
            derive conclusions from this code.
        message:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - code
      - message
      additionalProperties: false
    EntityRef:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
        title:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - kind
      - title
      additionalProperties: false
    RichText:
      type: object
      properties:
        format:
          type: string
          x-known-values:
          - plain
          - markdown
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        text:
          type: string
      required:
      - format
      - text
      additionalProperties: false
    Capability:
      type: object
      properties:
        state:
          type: string
          x-known-values:
          - AVAILABLE
          - UNAVAILABLE
          - UNSUPPORTED
          - UNKNOWN
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - state
      - reasons
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        overview:
          $ref: '#/components/schemas/Capability'
        work:
          $ref: '#/components/schemas/Capability'
        runs:
          $ref: '#/components/schemas/Capability'
        evidence:
          $ref: '#/components/schemas/Capability'
        knowledge:
          $ref: '#/components/schemas/Capability'
        history:
          $ref: '#/components/schemas/Capability'
        integrity:
          $ref: '#/components/schemas/Capability'
          description: UNSUPPORTED on the reviewed engine baseline until P2c audit
            ships.
        queue:
          $ref: '#/components/schemas/Capability'
          description: UNSUPPORTED on the reviewed engine baseline. No queue API is
            declared in 0.1.1; M4/M5 owns its future semantics.
        action_projection:
          $ref: '#/components/schemas/Capability'
        activity:
          $ref: '#/components/schemas/Capability'
      required: []
      additionalProperties:
        $ref: '#/components/schemas/Capability'
      description: Known keys are optional. Missing means UNKNOWN. New capability
        keys validate as Capability objects and display an explicit unknown-capability
        warning without triggering requests.
    Health:
      type: object
      properties:
        status:
          type: string
          x-known-values:
          - HEALTHY
          - DEGRADED
          - UNHEALTHY
          - UNKNOWN
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      required:
      - status
      - reasons
      - observed_at
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
        aew_version:
          type: string
      required:
      - id
      - name
      - aew_version
      additionalProperties: false
    Work:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          x-known-values:
          - epic
          - story
          - ticket
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        title:
          type: string
        state:
          $ref: '#/components/schemas/WorkState'
        parent_id:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        has_attention:
          type: boolean
        summary:
          $ref: '#/components/schemas/RichText'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        related:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        risk_class:
          anyOf:
          - type: integer
            minimum: 0
            maximum: 4
          - type: 'null'
        plan_revision:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        mutating:
          anyOf:
          - type: boolean
          - type: 'null'
        archived:
          type: boolean
        blocked_by:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        children:
          type: array
          items:
            $ref: '#/components/schemas/OpaqueId'
          maxItems: 250
        children_truncated:
          type: boolean
          description: True when the bounded child-ID preview omits children. Backend
            rollup remains complete. Use bounded /work queries with parent and explicit
            terminal-state filters to inspect archived children.
        rollup:
          anyOf:
          - $ref: '#/components/schemas/WorkCounts'
          - type: 'null'
        integration:
          anyOf:
          - $ref: '#/components/schemas/Integration'
          - type: 'null'
      required:
      - id
      - kind
      - title
      - state
      - parent_id
      - has_attention
      - summary
      - reasons
      - related
      - updated_at
      - risk_class
      - plan_revision
      - mutating
      - archived
      - blocked_by
      - children
      - children_truncated
      - rollup
      - integration
      additionalProperties: false
      description: Hot or archived work projection. Archived-by-ID includes later
        moves; backend owns blockers, counts and integration facts. Assurance is omitted
        until its structured mapping is reviewed.
    Evidence:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          x-known-values:
          - implementation_report
          - review
          - verification
          - check_result
          - discovery_record
          - research_record
          - plan_proposal
          description: Open backend semantic value. Unknown values display their raw
            string with a warning; no client conclusion is inferred.
        result:
          anyOf:
          - type: string
            x-known-values:
            - pass
            - fail
            - inconclusive
            - blocked
            description: Open backend semantic value. Unknown values display their
              raw string with a warning; no client conclusion is inferred.
          - type: 'null'
        subject:
          $ref: '#/components/schemas/EntityRef'
        currentness:
          type: string
          x-known-values:
          - CURRENT
          - STALE
          - UNKNOWN
          description: Open backend semantic value. Unknown values display their raw
            string with a warning; no client conclusion is inferred.
        requires_disposition:
          type: boolean
        claim:
          $ref: '#/components/schemas/RichText'
        body:
          $ref: '#/components/schemas/RichText'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        deviations:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        bindings:
          $ref: '#/components/schemas/EvidenceBindings'
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
      required:
      - id
      - kind
      - result
      - subject
      - currentness
      - requires_disposition
      - claim
      - body
      - findings
      - deviations
      - bindings
      - provenance
      additionalProperties: false
    Knowledge:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          x-known-values:
          - decision
          - fact
          - assumption
          description: Open semantic value. Unknown strings must display an explicit
            warning with the raw value.
        title:
          type: string
        state:
          type: string
        body:
          $ref: '#/components/schemas/RichText'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
        provenance:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
        decision_type:
          anyOf:
          - $ref: '#/components/schemas/DecisionType'
          - type: 'null'
      required:
      - id
      - kind
      - title
      - state
      - body
      - reasons
      - provenance
      - decision_type
      additionalProperties: false
    History:
      type: object
      properties:
        seq:
          type: integer
          minimum: 1
        kind:
          type: string
          x-known-values:
          - unit
          - annotation
          - audit
          - lead
          description: Open backend semantic value. Unknown values display their raw
            string with a warning; no client conclusion is inferred.
        id:
          $ref: '#/components/schemas/OpaqueId'
        at:
          $ref: '#/components/schemas/Timestamp'
        state:
          anyOf:
          - $ref: '#/components/schemas/WorkState'
          - type: 'null'
        unit_kind:
          anyOf:
          - type: string
            x-known-values:
            - epic
            - story
            - ticket
            description: Open backend semantic value. Unknown values display their
              raw string with a warning; no client conclusion is inferred.
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
        parent:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        subject:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        rel:
          anyOf:
          - type: string
          - type: 'null'
        links:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/OpaqueId'
            maxItems: 250
        sha256:
          $ref: '#/components/schemas/Sha256'
        source:
          type: string
          x-known-values:
          - engine
          - operator
          - model
          - external
          description: Open backend semantic value. Unknown values display their raw
            string with a warning; no client conclusion is inferred.
      required:
      - seq
      - kind
      - id
      - at
      - state
      - unit_kind
      - title
      - parent
      - subject
      - rel
      - links
      - sha256
      - source
      additionalProperties: false
      description: Path-free manifest entry projection, ordered by stable seq, with
        moves applied to current parent. Always display source and a historical-reference
        warning. Never current evidence. No storage path or currentness field.
    Integrity:
      type: object
      properties:
        status:
          type: string
        current_root:
          $ref: '#/components/schemas/HistoryRoot'
        verified:
          anyOf:
          - $ref: '#/components/schemas/VerifiedRoot'
          - type: 'null'
        backlog:
          type: integer
          minimum: 0
        last_audit:
          anyOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - status
      - current_root
      - verified
      - backlog
      - last_audit
      - reasons
      additionalProperties: false
      x-provisional: P2c
      description: Future P2c audit projection. Capability remains UNSUPPORTED at
        reviewed baseline. Backlog/status are computed by backend, never by frontend
        arithmetic or age.
    Attention:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          x-known-values:
          - decision_required
          - blocker
          - required_finding
          - anomaly
          description: Open semantic value. Unknown strings must display an explicit
