          - lineage
          - audit_finding
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        object:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        at:
          $ref: '#/components/schemas/Timestamp'
        decision:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        source:
          type: string
          x-known-values:
          - engine
          - operator
          - model
          - external
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        note:
          anyOf:
          - type: string
          - type: 'null'
