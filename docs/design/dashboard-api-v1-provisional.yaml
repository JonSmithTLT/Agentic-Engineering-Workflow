openapi: 3.1.0
info:
  title: AEW Read-only Dashboard API — C0 PROVISIONAL
  version: 0.1.1
  description: Not approved for domain implementation. AEW main-line contracts remain
    authoritative. Every route is same-origin GET/HEAD with authenticated cookies;
    no durable storage layout exposed.
servers:
- url: /api/v1
security:
- session: []
x-c0-review:
  status: PENDING_REVIEW
  amends: 0.1.0
  reviewed_engine_commit: 91c0d98
  review_document: web/docs/c0-review-main-line.md
  findings_addressed:
  - C0-1
  - C0-2
  - C0-3
  - C0-4
  - C0-5
  - C0-6
  - C0-7
  - C0-8
  - C0-9
  notes:
  - Queue wire shape and endpoint removed; queue capability UNSUPPORTED until M4/M5.
  - Integrity remains a provisional P2c projection with capability UNSUPPORTED on
    baseline.
  - Assurance omitted rather than assigning a scalar or unreviewed card projection.
  - Parent children are a bounded ID preview with explicit children_truncated; backend
    rollup remains complete. Renewed review must confirm this bounded representation.
  - History detail annotations use bounded annotations_limit/annotations_cursor and
    annotations_next_cursor, pinning the starting manifest count. Renewed review must
    confirm this pagination detail.
