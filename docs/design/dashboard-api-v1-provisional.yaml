        unit_kind:
          anyOf:
          - type: string
            x-known-values:
            - epic
            - story
            - ticket
            description: Open backend semantic value. Unknown values display their raw string
              with a warning; no client conclusion is inferred.
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
        parent:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        subject:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        rel:
          anyOf:
          - type: string
          - type: 'null'
        links:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/OpaqueId'
            maxItems: 250
          description: 'Backend omits the completion relation: its values are storage paths.
            The completion record is reachable through the unit itself. All projected relation
            values are AEW IDs or git commit hashes (integration_commit), never paths.'
          x-known-relations:
          - depends_on
          - invocations
          - tokens
          - evidence
          - integration_commit
          - moved_to
          - audit_finding
        sha256:
          $ref: '#/components/schemas/Sha256'
        source:
          type: string
          x-known-values:
          - engine
          - operator
          - model
          - external
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          maxItems: 250
        annotations_next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      required:
      - seq
      - kind
      - id
      - at
      - state
      - unit_kind
      - title
      - parent
      - subject
      - rel
      - links
      - sha256
      - source
      - annotations
      - annotations_next_cursor
      additionalProperties: false
      description: Manifest projection plus the bounded annotation list. Relation links replace
        a separate lineage array. No raw storage record is exposed.
