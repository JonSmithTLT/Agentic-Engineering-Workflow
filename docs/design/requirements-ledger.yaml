  # ---- KRB: the research basis, what the designs did not carry ---------------------------------------------------
  KRB-01: {section: "3. Evidence survey: write paths, not storage marketing", kind: requirement, tracked_by: [F21], statement: "Do not design against an assumed provider protocol (e.g. Mem0's older ADD/UPDATE/DELETE) without testing a pinned provider; public issue reports are leads, not evidence"}
  KRB-02: {section: "3. Evidence survey: write paths, not storage marketing", kind: requirement, tracked_by: [F21], statement: "Treat apparently successful trajectories and tool text as potentially hostile (MINJA-style poisoning is a write-path problem)"}
  KRB-03: {section: "4. Plausible architectures", kind: decision, tracked_by: [F21], statement: "Architecture E (structured cases plus selective lessons) with D (canonical recall) throughout; Lead/role closeout lessons only as nominations (B); a continuous observer only as an optional candidate producer (A); an independent distiller plus challenger only as escalation (C); no prebuilt general knowledge graph platform"}
  KRB-04: {section: "Narrow interfaces", kind: requirement, tracked_by: [F21], statement: "The ten narrow interfaces (CaptureCoordinator.on_committed, EvidenceResolver.bundle, CaseProjector.project, MemoryDistiller.propose, CandidateValidator.check, KnowledgeMatcher.compare, KnowledgeChallenger.assess, AdmissionPolicy.decide, KnowledgeStore.commit, ContextRouter.select); assess cannot verify by confidence; commit rechecks atomically"}
  KRB-05: {section: "Delivery and job integrity", kind: requirement, tracked_by: [F21, E18], statement: "Capture jobs distinguish attempts that share a prompt; use the existing durable job/outbox mechanism; never put another project's worker queue on the resume critical path"}
  KRB-06: {section: "6. What deserves retention", kind: requirement, tracked_by: [F21], statement: "A candidate names the future question it answers and the work it saves; the retain/exclude table per kind (case, failed approach, environment constraint, lesson, hypothesis, reference, pattern, procedure); a rejected candidate never deletes evidence; candidate prose may have its own bounded retention"}
  KRB-07: {section: "AdmittedKnowledge", kind: requirement, tracked_by: [F21], statement: "Keep observation time, evidence-valid conditions, publication time and reassessment time separate; a fresh summary of old evidence is not fresh evidence"}
  KRB-08: {section: "8. Generalization and applicability", kind: requirement, tracked_by: [F21], statement: "Record rename mappings and unresolved identity for path/symbol subjects; cross-component knowledge may have several subjects"}
  KRB-09: {section: "Model routing", kind: requirement, tracked_by: [F21, F19], statement: "No model for deterministic references and cases; roles may nominate; evaluate an approved extraction model on exact AEW examples (cheap is not automatically suitable); stronger review for complex reasoning where measured; no mandated cheap model or fine-tune before evidence; batch, cache snapshots, escalate selectively"}
  KRB-10: {section: "9. Admission tiers: automatic versus judgment-bearing", kind: requirement, tracked_by: [F21], statement: "Security-sensitive actions need stronger controls even when narrowly scoped (disable verification to fix the build is never an ordinary lesson)"}
  KRB-11: {section: "11. Duplicate, overlap, contradiction, correction", kind: requirement, tracked_by: [F21], statement: "Proposing challenges may be automatic; resolving contradiction or applying supersedes is a disposition; preserve reversible membership when grouping; a plausible conflict may suspend default lesson delivery without declaring falsity while unrelated recall continues"}
  KRB-12: {section: "12. Trust and lifecycle: avoid one overloaded enum", kind: requirement, tracked_by: [F21], statement: "Policy changes yield reassessment receipts, not rewritten evidence; never expire sound knowledge only because time passed; reassess on relevant dependency or evidence change"}
  KRB-13: {section: "13. Make the store worthwhile for agents", kind: requirement, tracked_by: [F21], statement: "Records answer the five engineering questions (reproduced already, discriminating check, failing environment, contract location, overturning evidence); if the model reliably uses harmful knowledge, fix admission and serving before encouraging usage"}
  KRB-14: {section: "14. Adversarial evaluation corpus", kind: evaluation, tracked_by: [F21, F19], statement: "The 28-fixture adversarial corpus K01-K28 with expert-adjudicated labels, plus paraphrase, adversarial wording, missing-field, truncation and environment perturbations; held-out repositories and later tasks; never tune on the acceptance corpus; add real AEW incidents"}
  KRB-15: {section: "Agent behavior experiment", kind: evaluation, tracked_by: [F21, F19], statement: "Matched tasks with identical harness/model/skills/budgets and frozen prior history; several trials; count attempted authority violations even when guards block them; check seeded histories for future answer or test leakage; temporal arms with a defined history schedule and no cross-arm contamination; preregister error budgets and benefit targets; zero observed failures is not zero risk"}
  KRB-16: {section: "16. Failure/invariant registry proposals", kind: requirement, tracked_by: [F21, F14], statement: "Map the proposed failure names (EVIDENCE_LAUNDERING, CAUSAL_OVERCLAIM, SCOPE_WIDENING, FALSE_MERGE, FALSE_SUPERSESSION, KNOWLEDGE_POISONING, STALE_ADMISSION_RACE, CROSS_ATTEMPT_CAPTURE, ACKNOWLEDGED_CANDIDATE_LOSS, RECALL_AS_AUTHORITY, DISTILLATION_UTILITY_LOSS) into the existing failure-class registry naming"}
  KRB-17: {section: "16. Failure/invariant registry proposals", kind: invariant, tracked_by: [F21], statement: "KINV-03: origin and visibility are engine-bound; caller or model strings cannot assign another attempt (no design invariant states the attempt half); KINV-09: preconditions are rechecked at expansion as well as publication"}
  KRB-18: {section: "17. M6 sequence and concrete design changes", kind: requirement, tracked_by: [F21, F20], statement: "Journal mocks must not present hypotheses or model interpretations as established knowledge; Journal views show held reasons, support basis, observed versus proposed conditions, capture lag and included/cited/helpful distinctions; no silent self-modification of instruction skills or policies"}

  # ---- ARR: architecture review response (proposed disposition, 2026-10-04) ---------------------------------------
  ARR-01: {section: "G1 — Evaluation is the critical path and not yet a component", kind: decision, tracked_by: [F19, Q13], statement: "ACCEPT: F19 becomes a reusable evaluation component (versioned fixture and run-record schemas, preregistration, protected evaluator material, metrics from AEW records, failed runs kept, incident fixtures, model/harness identity); before M4-H's consequential claims; does not stop approved M4 work (D-AR1)"}
  ARR-02: {section: "G2 — The Lead surface is a shell and the shell carries measured cost/defects", kind: decision, tracked_by: [F15, Q13], statement: "ACCEPT WITH MODIFICATION: a typed AEW action surface over the same Engine, DispatchDecision and guards, with MCP, CLI, dashboard and scheduler as transports; F15 stages the normal surface; structured ActionProjection results; mechanical retry only where primitive semantics permit (D-AR2)"}
  ARR-03: {section: "G3 — Project-knowledge maps are specified but largely unimplemented", kind: decision, tracked_by: [F22, Q13], statement: "ACCEPT WITH MODIFICATION: a deterministic project map (topology, generated/source boundaries, entry points, language boundaries, revision and freshness) earlier, semantic architecture/ownership/glossary material later; bounded fragments in packs; a generated map is derived knowledge, not K0 (D-AR6)"}
