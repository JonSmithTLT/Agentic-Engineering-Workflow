  # ---- OBX: ADR-0012, the transaction outbox -------------------------------------------------------------------
  OBX-01: {section: "Decision", kind: decision, tracked_by: [E18], statement: "The outbox is the transition log: no second store and no second record of a commit; the log becomes a derived, complete, bounded, consumable copy of what the commit point records"}
  OBX-02: {section: "D1. Completeness is a stated guarantee", kind: invariant, tracked_by: [E18], statement: "For every revision r <= revision exactly one logical transition record exists, unsealed (state/log/<r>.yaml, optional immutable overflow sidecar) or in a sealed segment; transient coexistence must be byte/hash-equivalent, and any disagreement is corruption that fails audit and reading closed"}
  OBX-03: {section: "D1. Completeness is a stated guarantee", kind: invariant, tracked_by: [E18], statement: "control.yaml stays the single workflow authority and last_transition the authoritative description of the newest transition; the log is complete and consumable but never workflow authority; recovery's repair of a missing log record becomes a consumer guarantee and extends to staged overflow payloads"}
  OBX-04: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "last_transition gains bounded events plus an optional event_overflow descriptor, derived by ControlStore._commit from the committed before/after states plus operation-declared facts, in the store and not a finalizer, so direct Session.commit sites are covered"}
  OBX-05: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "Derived kinds by comparing hot collections only: lead.generation, work.state, invocation.status, run.added, credential.revoked, history.appended, unit.archived, and queue.entry/queue.lease (M4-D), with the fields of the table"}
  OBX-06: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "Operation-declared kinds (decision.recorded, handoff.recorded, evidence.ingested, audit.recorded) are appended through TxnContext.events by the authoritative Engine operation only; callers and consumers never invent events; op, actor, summary, reason and refs stay"}
  OBX-07: {section: "Bounded hot representation", kind: invariant, tracked_by: [E18], statement: "last_transition.events holds at most 64 events; above 64 it holds the first 64 and event_overflow {path, sha256, event_count, counts_by_kind}; consumers are never told to reconstruct truncated events by diffing historical control states"}
  OBX-08: {section: "Complete overflow payload", kind: requirement, tracked_by: [E18], statement: "An overflow transition's complete event list is written as immutable state/log/<rev>.events.yaml, prepared as a normal staged transaction write and named/digested by the committed descriptor; redo publishes or verifies the identical payload; a mismatch fails closed; nothing regenerates the set after commit"}
  OBX-09: {section: "Schema and hash coverage", kind: requirement, tracked_by: [E18], statement: "transition.schema.json (aew/transition/v1) validates the bounded record and descriptor, closed at every level, referenced by control.schema.json; every log record carries its schema; the overflow payload has its own closed JSON-only schema; the transition hash commits to the overflow digest and count"}
  OBX-10: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "One reader surface: aew history log --since R [--follow] [--kind ...] [--json] yields logical transitions R+1..revision in order, resolving and verifying overflow payloads so the consumer sees the complete event set; the cursor is the revision number whatever the physical representation"}
  OBX-11: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "Readers take no control lock and are race-safe against lockless sealing: try unsealed, refresh the sealed view, require equivalence when both exist, and after a bounded retry report corruption/incomplete history rather than a false gap"}
  OBX-12: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "A reader finds the current revision through the authority-file identity/cached parse; a long-lived waiter does not repeatedly parse control.yaml (H3); --follow blocks on the wake signal; a consumer behind the window walks sealed segments transparently"}
  OBX-13: {section: "D4. One wake signal, advisory", kind: decision, tracked_by: [E18, E1], statement: "local/wake is bumped by the store after each commit's log write (after txn.after_log) and by the supervisor after each run.json write; waiters stat it every 20 to 50 ms with a coarse full check every 2 s; waking is advisory (a missed wake costs latency, never correctness); OS notification may replace the stat behind the same interface; the M4 plan's 'wake file or pipe' is decided as the file"}
  OBX-14: {section: "D5. Observed run facts stay outside the outbox", kind: decision, tracked_by: [E18, E1, Q12], statement: "run.json and events.jsonl are observations, not committed facts, and never enter the outbox; harness wait --any combines both lanes on each wake; F15 section 16 revocation on run end lands as a commit; whether a supervisor may commit is an ADR-0005/ADR-0009 authority decision not made here"}
  OBX-15: {section: "D6. Bounding: a 4,096-revision unsealed window, sealed segments, no discard", kind: requirement, tracked_by: [E18], statement: "Transition history is never discarded; LOG_WINDOW is 4,096 revisions; older records are sealed 256 at a time into state/log/seg-NNNNNN.yaml carrying overflow payloads, written create-if-absent, fsynced, re-read, schema-validated and hash-verified (overflow digest/count recomputed) before any unsealed file is removed; pruning is idempotent and never leaves neither representation"}
  OBX-16: {section: "D6. Bounding: a 4,096-revision unsealed window, sealed segments, no discard", kind: requirement, tracked_by: [E18], statement: "Compaction is off the commit path: aew history compact is the v1 mechanism, doctor reports an unsealed window above LOG_WINDOW + 256, a future background service may call the same primitive, and no finalizer seals synchronously; the control lock may serialize pruning but is not what makes readers safe"}
  OBX-17: {section: "D7. The records are hash-chained", kind: requirement, tracked_by: [E18], statement: "Each transition record carries h = SHA-256(bytes.fromhex(prev_h) || canonical_json(record without h)) with ADR-0011's genesis convention; last_transition.h is the committed head; overflow records hash the descriptor; one hash per commit; a repaired record hashes identically; segments preserve and verify the chain; the chain is tamper evidence, not authority"}
  OBX-18: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E1, E18], statement: "E1 wait-any (M4-D): aew harness wait --any blocks on local/wake, checks both lanes and returns the first run to end with its next action; the 0.2 s poll goes, the coarse fallback stays"}
  OBX-19: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18], statement: "Supervisor and Lead broker watchdogs may keep their identity stat and react to lead.generation and credential.revoked events instead of re-parsing on every change"}
  OBX-20: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F20], statement: "Dashboard: the backend keeps a cursor and serves GET /api/v1/events?since=R as a bounded long poll (SSE later over the same service); notifications name changed kinds/ids and the frontend refetches projections with ETags; a contract addition that renews the C0 review; no poll takes the control lock"}
  OBX-21: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F21], statement: "Knowledge capture: a durable knowledge-domain cursor (never local/), job identity (project_id, revision, event_index), duplicate capture returns the prior receipt, knowledge_event_seq stays its own sequence with the outbox position recorded on receipts, read-only service identity on the outbox"}
  OBX-22: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F11, F15], statement: "The scheduler and F15 section 16 consume queue.*, work.state, run.added, credential.revoked and lead.generation and react on the event; the ActionProjection behind /attention is recomputed when an affecting kind lands, not per poll"}
  OBX-23: {section: "D9. Crash semantics under ADR-0001", kind: requirement, tracked_by: [E18], statement: "events, event_overflow and h commit atomically inside control.yaml; overflow payloads are staged, named and hashed, published or verified by recovery from staging, never reconstructed; fault points for an unpublished overflow payload, log.seal.after_segment and log.seal.mid_prune; every committed transition keeps at least one valid representation; migration/mass-transition tests exceed 64 events"}
  OBX-24: {section: "D10. Downgrade safety", kind: sequencing, tracked_by: [E18], statement: "The fields are additive but older engines refuse the file (additionalProperties false); ship them with M4-D under that phase's schema decision (v2 additive with refusal, or v3 with a no-op migrate step), never separately"}
  OBX-25: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "One commit point (ADR-0001): nothing new is staged beyond fields of a record already inside it"}
  OBX-26: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "History independence (ADR-0011 H1, H2, invariant 13): derivation compares hot collections only, hot events are capped at 64, overflow bytes do not stay hot, the commit path does no sealing"}
  OBX-27: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Nothing in local/ is authority: the wake file is advisory and resume after deleting local/ is unchanged"}
  OBX-28: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Readers take no control lock; the log is immutable once written"}
  OBX-29: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "The log is never discarded: sealing changes the physical representation, never drops a logical transition or overflow payload"}
  OBX-30: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Observed facts are not committed facts: a run record is telemetry until the Lead ingests it"}
  OBX-31: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 24, logical log completeness: exactly one logical transition resolvable per revision; equivalent copies may coexist transiently; the newest equals last_transition"}
  OBX-32: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 25, event fidelity: the complete events of r equal the derivation over (state r-1, state r) plus operation-declared facts wherever the model test retains them"}
  OBX-33: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 26, hot-state bound: len(last_transition.events) <= 64; above it event_overflow exists, matches the immutable payload, and the reader returns the complete set"}
  OBX-34: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 27, segment fidelity: 256 logical transitions per segment, overflow payloads preserved and digest-verified, chain continuity across segment boundaries"}
  OBX-35: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 28, reader race safety: under every modelled sealing/crash interleaving a lockless reader resolves the transition or reports explicit corruption/incomplete history, never a false gap"}
  OBX-36: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "H2 budget: derivation plus hash add at most 10 ms per commit at 20 open / 3,000 completed, flat along the history series (tools/perf/control_plane.py, reference Windows machine and Rocky 8)"}
  OBX-37: {section: "Completion criteria", kind: gate, tracked_by: [E18, E1], statement: "Wake latency: commit to waiter wake across two processes, median under 50 ms on both platforms"}
  OBX-38: {section: "Completion criteria", kind: gate, tracked_by: [E18, E1, F20], statement: "No parse while waiting: harness wait --any makes zero control.yaml parses between wakes, and the dashboard event endpoint none per request"}
  OBX-39: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "Git cost: with 60,000 revisions compacted behind the window, git status at most 0.15 s on the reference machine"}
  OBX-40: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "Coverage: crash matrix and seeded walks include overflow publication recovery, both sealing fault points, lockless reader/compaction races and repaired logs; mass transitions exceed 64 events; rules 24 to 28 in the oracle; earlier tests unchanged except for the transition schema"}
  OBX-41: {section: "Completion criteria", kind: process, tracked_by: [E18], statement: "Reviewed like a store change (ADR-0011 'Review'): a brief states what changed in ADR-0001's model"}
  OBX-42: {section: "Test sketch", kind: evaluation, tracked_by: [E18], statement: "Unit (table-driven derivation for every kind incl. >64 overflow, both schemas, hash covers overflow), store model (event fidelity, overflow and log.seal.* fault points, the repaired-log regression), integration (two-process wake, wait --any over two fake runs, missed-wake fallback, lockless reader during compaction, overflow across sealing), regression (rules 24 to 28, downgrade), perf (commit delta, git status at 60,000 revisions)"}
  OBX-43: {section: "Alternatives considered", kind: decision, tracked_by: [E18], statement: "Rejected: a separate state/outbox ring, commits as history-manifest entries, SQLite in local/ as the record, OS notification alone; a SQLite reader index may come later as a locator only; supervisor-committed run events deferred to the authority decision"}
  OBX-44: {section: "Consequences", kind: process, tracked_by: [E18, E1], statement: "The register gets the outbox row (E18) and E1 points at it; the dashboard API gets a new endpoint and a renewed C0 review; older engines refuse the file (D10)"}
  OBX-45: {section: "Frozen design decisions and deferred dependency", kind: decision, tracked_by: [E18, F21], statement: "Frozen: LOG_WINDOW 4,096 with maintenance-only compaction; D7's hash chain kept; the command is aew history log, not aew events; bounded long poll first; supervisor commits not authorized; the knowledge cursor is durable project-bound knowledge state, placed by ADR-0013; adopted by the operator 2026-10-04"}
  # ---- KST: ADR-0013, knowledge storage placement ----------------------------------------------------------------
  KST-01: {section: "Decision", kind: decision, tracked_by: [F21], statement: "Knowledge records are entries of the ADR-0011 history manifest: one chain, hot root, audit, derived index and history surface for terminal work and knowledge; five kinds added (reference, case, lesson, knowledge_disposition, capture_receipt); knowledge_event_seq is the manifest seq, globally monotonic and unique, with numeric gaps"}
  KST-02: {section: "D1. Five entry kinds, one additive schema change", kind: requirement, tracked_by: [F21], statement: "history.schema.json entry.kind and manifest.ENTRY_KINDS gain the five kinds; entries gain optional version (integer >= 1), required by the writer for reference/case/lesson; K0 references use version 1 and a changed canonical pointer is a new Knowledge ID; existing chains unaffected"}
  KST-03: {section: "D1. Five entry kinds, one additive schema change", kind: requirement, tracked_by: [F21], statement: "Entry identity, subject/rel, links and coarse source per kind as the table gives; hot counters allocate Knowledge, knowledge_disposition and capture_receipt ids; external id prefixes are an M6b schema choice"}
  KST-04: {section: "D2. Records are immutable files under `.aew/knowledge/`, git-tracked", kind: requirement, tracked_by: [F21], statement: "Records are immutable files under .aew/knowledge/records/{cases,lessons,references,dispositions,capture-receipts}, one file per version, written with History.write_record (create-if-absent, immutable, redo) in the transaction that appends their entries; RECORD_GLOBS gains only knowledge/records/**/*.yaml; nothing knowledge-authoritative under local/"}
  KST-05: {section: "D3. Identity: manifest `seq` is `knowledge_event_seq`; `knowledge_disposition_seq` is per version", kind: requirement, tracked_by: [F21], statement: "knowledge_id is stable across versions and version identifies the immutable version; knowledge_event_seq is the manifest seq, an opaque monotonic cursor from which consumers never infer missing Knowledge"}
  KST-06: {section: "D3. Identity: manifest `seq` is `knowledge_event_seq`; `knowledge_disposition_seq` is per version", kind: requirement, tracked_by: [F21], statement: "Every knowledge_disposition targets an exact immutable version; knowledge_disposition_seq is the per-version ordinal in manifest order, stored in the event and validated against authenticated history plus earlier staged entries; current state is a fold, never written back into content, cacheable and rebuildable"}
  KST-07: {section: "D4. `knowledge_disposition` events reuse the history-event mechanism, not Archive ownership", kind: requirement, tracked_by: [F21], statement: "A shared history-domain event writer (HistoryEvents.append, name illustrative) that Archive.annotate may delegate to; the index gains about(subject, kinds=None) and annotations() becomes its compatibility wrapper"}
  KST-08: {section: "D4. `knowledge_disposition` events reuse the history-event mechanism, not Archive ownership", kind: requirement, tracked_by: [F21], statement: "The v1 rel vocabulary is bounded to implemented project-scope semantics (admitted, held_active, held_dormant, rejected, superseded_proposal, serving_hold, serving_release, supersedes, refines, challenged, reassessed, quarantined, archived; no visibility_widened); each event carries policy_version, exact target, principal, at and relation fields; admission records its serving envelope; coarse source follows the actual actor"}
  KST-09: {section: "D4. `knowledge_disposition` events reuse the history-event mechanism, not Archive ownership", kind: decision, tracked_by: [F21], statement: "Audit findings are not knowledge_disposition events; they stay audit records referencing the damaged entry; quarantine is a separate attributable knowledge_disposition"}
  KST-10: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: requirement, tracked_by: [F21], statement: "A capture_receipt is written for every terminally processed capture job, NO_CANDIDATE included, binding the exact committed origin event/work/attempt/source and recording extractor/model/prompt/template/policy versions and the pinned input snapshot"}
  KST-11: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: requirement, tracked_by: [F21], statement: "PARTIAL is durable but does not close its origin event while retryable work remains; it records persisted outputs and enough pinned input to resume idempotently without regenerating accepted provider output; RETRYABLE_FAILURE never advances durable coverage"}
  KST-12: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: invariant, tracked_by: [F21, E18], statement: "The recovery position is the largest contiguous safe prefix of outbox positions whose every capture opportunity has a terminal receipt, never the highest receipt; re-scanning is safe through idempotency, skipping an uncovered opportunity never is; receipts link the exact origin event so a duplicate returns the prior receipt"}
  KST-13: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: requirement, tracked_by: [F21], statement: "In-flight job state lives under local/knowledge/jobs/ and is disposable (loss means replay); accepted provider output a retry must reuse is persisted before local state claims progress; consecutive NO_CANDIDATE receipts are kept, not folded away"}
  KST-14: {section: "D6. What stays hot: counters, bounded human attention, and a non-authoritative lag summary", kind: requirement, tracked_by: [F21], statement: "Hot state gains only counters, knowledge.pending (at most 20 identity-only attention items plus knowledge.pending_overflow, no silent default, full set queryable) and knowledge.capture, a constant-size status summary that is never the recovery cursor or admission authority; everything else derives from the manifest"}
  KST-15: {section: "D7. Trust: coarse history `source` never upgrades semantic meaning", kind: invariant, tracked_by: [F21], statement: "The coarse source (engine/operator/model/external) never upgrades meaning; records keep the fine source-authentication classes; ENGINE_OBSERVED_WEAK_BOUNDARY stays distinguishable and gains no default serving; serving eligibility is a disposition fold plus request-time policy, never inferred from source"}
  KST-16: {section: "D7. Trust: coarse history `source` never upgrades semantic meaning", kind: requirement, tracked_by: [F21], statement: "A Knowledge record loaded into context keeps the history pin/hash/trust wrapper and also its fine source classes, applicability, limitations and current serving qualification; recall never flattens weak-boundary provenance into an unqualified engine fact"}
  KST-17: {section: "D8. The derived index gains `about`, fold caches, and a reusable FTS substrate", kind: requirement, tracked_by: [F21], statement: "local/history.sqlite stays disposable and gains about(), current(knowledge_id, version?) with the authenticated fold, and a rebuildable FTS5 substrate of locators; every result authenticates against the manifest and record hash before use; a tampered index may omit but never invent; full audit compares derived rows"}
  KST-18: {section: "D8. The derived index gains `about`, fold caches, and a reusable FTS substrate", kind: sequencing, tracked_by: [F21, F19], statement: "M6b stays simple-first: Arm B guarded raw-history search first, historical replay of K1 coverage, the smallest Case arm C only on a measured gap, K2 only if C earns it; placing storage authorizes no production K1/K2; the first FTS consumer indexes Arm B's raw material and Knowledge bodies join only when those kinds exist"}
  KST-19: {section: "D9. Who commits: a project-scoped knowledge service principal for closed policy-resolved transactions", kind: decision, tracked_by: [F21, Q12], statement: "A knowledge_service principal may commit a closed knowledge.* family: project-bound, enabled and revoked by operator-authorized policy, independent of Lead generation, a new credential kind in the existing verifier/custody architecture, held only by the capture/admission service, unreachable from workers, harness context and bridges, in ADR-0009's environment-trust inventory and scrubbing tests, denied everything else; encoding/storage/rotation is an ADR-0005/ADR-0009 amendment"}
  KST-20: {section: "D9. Who commits: a project-scoped knowledge service principal for closed policy-resolved transactions", kind: requirement, tracked_by: [F21], statement: "On policy-resolved paths the service may publish K0 references, approved-template K1 Cases, initial/hold dispositions and capture receipts; K2/K3 stay behind the judgment boundary, K3 is never auto-admitted in M6 v1, and judgment-bearing actions go through the Lead/operator path linked to decision records"}
  KST-21: {section: "Runtime closure is a commit invariant", kind: invariant, tracked_by: [F21], statement: "The store commit path checks every knowledge_service commit: principal kind, allowed knowledge.* operation, permitted hot delta, permitted entry kinds, no mutation of work/invocation/Lead/credential domains, required staged record/entry relationships; role bridges never append knowledge_disposition in v1"}
  KST-22: {section: "D10. Visibility is the project in v1; the schema reserves the field", kind: decision, tracked_by: [F21], statement: "Records carry visibility_scope: project and entries nothing; matching, hints, links and FTS stay within one project; no v1 operation widens visibility; multi-scope waits for Q12 or later design as record/index policy, not a second store"}
  KST-23: {section: "D11. Migration and compatibility", kind: requirement, tracked_by: [F21], statement: "Additive for existing projects; aew history list keeps its legacy default kinds with a bounded hint that Knowledge exists, explicit kind filters (a --knowledge group later) and direct history show of a Knowledge id; older engines that cannot validate the widened schema fail closed"}
  KST-24: {section: "D12. Audit and commit-time relationship checks", kind: requirement, tracked_by: [F21], statement: "Full audit also checks: record schema/hash; canonical/evidence links resolve; each disposition subject is an exact version earlier in manifest order (staged included); stored knowledge_disposition_seq; supersedes/refines/support/challenge targets; capture_receipt.produced resolves to content written before the receipt or an explicitly referenced prior output; receipts fold to a contiguous safe watermark"}
  KST-25: {section: "D12. Audit and commit-time relationship checks", kind: invariant, tracked_by: [F21], statement: "Commit-time checks use the index only as a locator and authenticate against the manifest, inspecting earlier staged entries; a stale index grants nothing; audit findings stay audit-domain; global checks stay off the commit path (ADR-0011 invariant 13), which enforces only bounded schema, exact subject/currentness, principal authority, staged order and family closure"}
  KST-26: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 15, one chain: every Knowledge content record, disposition and receipt is pinned by the ADR-0011 manifest; no second root, manifest or audit"}
  KST-27: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 16, immutable content, appended state: versions are create-if-absent, mutable state is append-only knowledge_disposition, current state a fold"}
  KST-28: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 17, closed service transactions: knowledge_service commits are runtime-checked at the store boundary and cannot touch workflow/Lead/invocation/credential domains"}
  KST-29: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 18, safe cursor from receipts: recovery never advances past a gap or a PARTIAL job because a later receipt exists"}
  KST-30: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 19, locators not vouchers: index, FTS and fold-cache results authenticate before use"}
  KST-31: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 20, bounded hot footprint: Knowledge volume does not grow active-path hot cost"}
  KST-32: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 21, provenance is not meaning: coarse source=engine and ENGINE_OBSERVED_* never alone establish correctness, oracle adequacy or default serving"}
  KST-33: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 29: a knowledge_service commit changes only permitted Knowledge/cold/counter/last-transition fields and entry kinds; a mutation of another domain fails before commit"}
  KST-34: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 30: every disposition targets an exact reference/case/lesson version existing earlier (staged included), with a correct knowledge_disposition_seq"}
  KST-35: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 31: len(knowledge.pending) <= 20, each a current judgment-bearing candidate, overflow non-negative, nothing resolved by timeout or default"}
  KST-36: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 32: safe_through is the largest contiguous terminally covered position; out-of-order receipts above a gap and PARTIAL receipts do not advance it"}
  KST-37: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "1. history.schema.json accepts the five kinds and version; existing history fixtures verify unchanged"}
  KST-38: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "2. One redo-protected service transaction appends a K1 Case, its initial disposition and a terminal receipt, each immutable and manifest-pinned"}
  KST-39: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "3. Crash/recovery at the history fault points leaves old-or-new valid history; service closure is rechecked at the store commit boundary"}
  KST-40: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "4. Exact-version show/load keeps hash pinning and the fine source/applicability/limitation qualification"}
  KST-41: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "5. unreferenced() covers only the machine-managed Knowledge subtree; full audit detects damaged records/links and records findings without rewriting Knowledge"}
  KST-42: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "6. Capture restart: duplicates return the prior receipt, PARTIAL resumes idempotently, out-of-order receipts cannot jump the watermark, NO_CANDIDATE closes its job and advances contiguous coverage"}
  KST-43: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "7. H1/H2 stay within bounds with thousands of Knowledge records; status, checkpoint and resume scan no Knowledge files"}
  KST-44: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "8. Index/FTS acceptance proves locator-not-voucher, rebuildability and bounded query cost; Arm B stays the first recall consumer"}
  KST-45: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "9. Pack tests prove a Knowledge load cannot displace mandatory guardrails or current authority, and weak-boundary provenance stays visibly qualified"}
  KST-46: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "10. Oracle rules 29 to 32 pass seeded walks, including a service attempt to mutate work and a Lead takeover while capture continues"}
  KST-47: {section: "Completion criteria", kind: gate, tracked_by: [F21, F20], statement: "11. history list keeps its legacy default; Knowledge filters and show work; the dashboard handles new history kinds safely until /knowledge gets its own renewed contract"}
  KST-48: {section: "Test sketch", kind: evaluation, tracked_by: [F21], statement: "Unit (five kinds, about, disposition seq, folds, the safe-cursor fold with gaps/out-of-order/PARTIAL/NO_CANDIDATE, qualification, downgrade), store/authority (service family at Session.commit, every forbidden domain refused, same-transaction ordering without SQLite authority, takeover leaves the service valid), history integration (crash matrix, unreferenced, audit against damaged index/records), end to end, scale (measured labelled measured, extrapolations labelled)"}
  KST-49: {section: "Alternatives considered", kind: decision, tracked_by: [F21], statement: "Rejected: a second knowledge manifest/root, SQLite as knowledge authority, knowledge inside unit bundles, a separate authoritative capture cursor, a separate knowledge_event_seq counter, versions as revision objects in one file"}
  KST-50: {section: "Not decided here", kind: open-question, tracked_by: [F21, Q12, F20], statement: "Open: the knowledge id prefix and record schemas (aew/knowledge/*/v1, written by the M6b plan); the service credential's encoding/rotation/storage; Arm B FTS over evidence and decisions with its request-mode labelling; multi-project visibility (K3, Q12); whether a post-v1 role capability may nominate Knowledge actions; the /knowledge dashboard contract revision (C0 renewal)"}
  KST-51: {section: "Frozen designer decisions", kind: decision, tracked_by: [F21], statement: "The qualified vocabulary is normative: knowledge_disposition, knowledge_disposition_seq and capture_receipt; generic disposition/receipt names are not frozen schema terms"}
  KST-52: {section: "Checks before relying on this ADR", kind: process, tracked_by: [F21], statement: "Before implementation, reconcile field names with the finalized capture/admission v0.4, shared semantics v0.4 and recall v0.3 drafts, and re-check the history code (history/*, archive_ops, history.schema.json) against the probed tree"}
  # ---- EVC: the evaluation component (F19), v0.2 ----------------------------------------------------------------
  EVC-01: {section: "1. What exists, and what F19 adds", kind: requirement, tracked_by: [F19], statement: "Turn the M3 dogfood's single-experiment pieces (fixture format, hidden-test module, rubric, arms, model configuration, record, collector) into shared components that Q7, F14 phases, F17 and Class 0 sampling use without one run becoming several samples"}
  EVC-02: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "F19 is a measurement instrument: evaluation code and outputs never become AEW workflow truth because AEW produced them"}
  EVC-03: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "A paid/model run is counted once; it may support several preregistered metrics or later analyses but is never duplicated into independent samples"}
  EVC-04: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Every attempted paid/model run is durably registered before the first provider action, so a runner crash cannot erase a failure"}
  EVC-05: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Run observations are immutable after finalization; re-scoring and re-analysis create new artifacts"}
  EVC-06: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Hidden oracles, reference answers and held-out cases never reach a model-controlled process, agent environment, context pack, scratch repository or harness home"}
  EVC-07: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Objective hidden checks dominate; rubric/model adjudication is blinded to arm where feasible and attributable"}
  EVC-08: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "An AEW-versus-raw comparison changes one factor, AEW; cross-harness comparisons are separate experiments"}
  EVC-09: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Preregistration freezes question, cases, arms, assignment/order, profiles, budget, scoring, exclusion/invalid-run rules, stopping rule and primary measure before outcomes are visible"}
  EVC-10: {section: "2. Package layout", kind: requirement, tracked_by: [F19], statement: "The package eval/aew_eval/ (schema/{eval-run,preregistration,case}.schema.json, fixture, arms (aew, raw, scripted), runner, hidden, collect, metrics, prereg, report) and eval/experiments/ (m3-dogfood kept as it was, m4h-dogfood first, f17-shallow-finding, f14-plan-assurance, class0-sample); tools/perf unchanged"}
  EVC-11: {section: "2. Package layout", kind: decision, tracked_by: [F19], statement: "The shared instrument is public in this repository; hidden oracles, held-out cases and references live in aew-private/eval/; the public tree holds case manifests and cryptographic commitments to hidden material; schema/unit tests run without hidden material, whose access is a runner capability, not an import dependency"}
  EVC-12: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19], statement: "Each paid/model attempt is appended to an experiment-local attempt ledger before any provider action and finalized with exactly one immutable aew/eval-run/v1 result; a crash leaves a visible RUNNER_LOST/unfinished attempt in the sample accounting"}
  EVC-13: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19], statement: "Backward compatible with aew/dogfood-run/v1: every M3 field keeps its meaning and a deterministic adapter maps historical records without rewriting them"}
  EVC-14: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19, F25], statement: "The record: experiment and preregistration hash, run id, case and hidden hashes, arm, requested and observed profile with mismatch, AEW commit/spec/schema, harness name/version/artifact/capability-fixture/containment, environment, assignment, validity status and reason, limits, outcome (hidden checks, done, commit, paths, scope, interventions, safety, scoring provenance), AEW facts, cost with pricing snapshot, unscored notes"}
  EVC-15: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19], statement: "A run belongs to exactly one preregistration; raw observations and preregistered scorer outputs are immutable; later metrics write a separate aew/eval-analysis/v1 artifact keyed by preregistration hash, run ids and metric versions; requested versus observed profile is kept as a validity fact"}
  EVC-16: {section: "4. The preregistration record, `aew/eval-prereg/v1`", kind: requirement, tracked_by: [F19], statement: "aew/eval-prereg/v1 records question, arms, cases with paired controls, pinned profiles and budget, runs per cell, assignment method/seed/materialized order, one primary measure and secondaries, thresholds, versioned metrics, validity/retry/missing-result rules, stopping rule, scoring (hidden channel, who scores, blinding, adjudication), held-out ids, exposure and amendment policies, frozen_at/by and canonical hash"}
  EVC-17: {section: "4. The preregistration record, `aew/eval-prereg/v1`", kind: requirement, tracked_by: [F19], statement: "prereg.py freeze canonicalizes, hashes, materializes the schedule and refuses a case whose fixture, oracle, profile or config hash differs; material changes after outcomes are visible get a new experiment id; report.py groups by preregistration and shows amendments and secondary analyses"}
  EVC-18: {section: "5. The hidden-evaluator channel", kind: requirement, tracked_by: [F19], statement: "An oracle is a private-repository directory cases/<id>/oracle/ with checks.py, optional reference/ and a manifest.yaml of expected answers; rubrics stay prose and are hashed into the preregistration"}
  EVC-19: {section: "5. The hidden-evaluator channel", kind: invariant, tracked_by: [F19], statement: "hidden.py loads oracles from the evaluator-only AEW_EVAL_HIDDEN_ROOT, never inherited by or mounted into model-controlled processes, with no oracle descriptor open across agent launch; scoring starts after the model-controlled tree ends where practical, on an export in an evaluator-owned directory outside the scratch repository"}
  EVC-20: {section: "5. The hidden-evaluator channel", kind: requirement, tracked_by: [F19], statement: "Records store hidden_sha256 (the oracle directory's content hash); on an air-gapped host the private repository is part of the deployment bundle and the channel is the same path"}
  EVC-21: {section: "5. The hidden-evaluator channel", kind: invariant, tracked_by: [F19], statement: "Held-out status is an exposure property: a case revealed and used to change AEW is marked exposed and no longer counts as confirmatory held-out evidence; the private corpus keeps the exposure history"}
  EVC-22: {section: "5. The hidden-evaluator channel", kind: requirement, tracked_by: [F19], statement: "An evaluator model's provider/model/effort, observed configuration, prompt/rubric hash and output are recorded as scorer provenance; it sees an arm-neutral artifact wherever feasible"}
  EVC-23: {section: "6. The incident corpus, with sources", kind: requirement, tracked_by: [F19, F17, F14], statement: "The corpus starts from recorded families: M3 dogfood tasks, acceptance-input mutation, oracle weakening and evaluator integrity, shallow-finding termination, Class 0 eligibility samples, resume after harness loss, seeded review defects, containment under the Q7 classification; new incidents enter the private repository with a public manifest entry, never the answer"}
  EVC-24: {section: "7. The external comparator: a verification item, not a choice", kind: requirement, tracked_by: [F19, Q11], statement: "The raw arm and an external evaluator model are named apart; no evaluator model is chosen here; prereg.py verifies the gateway features an evaluator needs and records the observed configuration, and an experiment with unverified evaluator features cannot freeze"}
  EVC-25: {section: "7. The external comparator: a verification item, not a choice", kind: invariant, tracked_by: [F19], statement: "Model agreement is never independent proof; objective hidden checks stay primary; for rubric facts the frozen adjudication policy decides and model scoring is attributable evidence, not self-authenticating"}
  EVC-26: {section: "8. Sequencing", kind: sequencing, tracked_by: [F19], statement: "Schemas, prereg.py and the append-only attempt ledger first (M4-H must be unable to lose or redefine a paid run); runner and fixture by generalizing dogfood.py with M3 still runnable; hidden.py with the private boundary, exposure tracking and the first held-out case; metrics and immutable analysis; report last; first consumer M4-H's preregistered dogfood, and F17 phase 1 may use the same runner"}
  EVC-27: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "aew/eval-run/v1 represents every historical M3 run through a deterministic mapping without renaming or changing M3 fields"}
  EVC-28: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Before the first provider action the attempt ledger durably holds experiment, preregistration hash, run id, case, arm, assignment order and requested profile; killing the runner after launch leaves a visible unfinished attempt"}
  EVC-29: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "A preregistration canonically hashes fixtures, oracle commitments, profiles, arm configs, schedule, validity/retry/stopping rules and scoring; a changed material input refuses to run under it"}
  EVC-30: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "One attempt counts once; retries happen only under the frozen invalid-infrastructure policy and stay linked to the original attempt"}
  EVC-31: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Run records are immutable after finalization; re-analysis is a separately hashed aew/eval-analysis/v1 naming exact run ids and metric versions"}
  EVC-32: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "No hidden oracle path, content or descriptor in a scratch repository, agent environment, harness home, context pack or model-controlled mount or process; hidden scoring arm-blind where feasible and preferably after agent termination"}
  EVC-33: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Held-out exposure is tracked; an exposed case cannot silently stay confirmatory"}
  EVC-34: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Objective checks and model/operator adjudication are identified separately; every adjudicated score records scorer provenance and disagreement resolution"}
  EVC-35: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Effective harness/model/profile/capability-fixture identity is recorded; a material requested/observed mismatch triggers the frozen validity rule"}
  EVC-36: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Any evaluator-model feature an experiment uses is gateway-verified before its preregistration freezes"}
  EVC-37: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19, F24], statement: "The raw control uses the same harness, model/profile, case and environmental envelope as the AEW arm; AEW-on-OpenCode versus another harness is a cross-harness experiment, not the causal raw control"}
  EVC-38: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19], statement: "Contested rubric facts: automated checks win where they exist; otherwise a preregistered blinded evaluator-model assessment plus operator adjudication on disagreement or material ambiguity, all recorded; the operator may adjudicate directly when the preregistration says no adequate evaluator exists"}
  EVC-39: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19], statement: "Paired/cell runs are randomized or counterbalanced from a preregistered seed or schedule; the actual order is part of the run record"}
  EVC-40: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19], statement: "F19 is evaluation-only: its records, scores and evaluator judgments never mutate project control state or satisfy workflow gates by themselves"}
  EVC-41: {section: "Frozen designer decisions", kind: sequencing, tracked_by: [F19], statement: "The first implementation stops after the schemas, preregistration and attempt-ledger slice proves these invariants against the M3 corpus, before generalizing the runner; nothing else blocks M4-H preregistration"}
  # ---- NET: Linux network containment (F-F), v0.2 ---------------------------------------------------------------
  NET-01: {section: "1.1 Design-authority correction: CONNECT allowlisting and provider credential injection are separate jobs", kind: decision, tracked_by: [F28], statement: "Provider credentialing and generic egress are separate mechanisms: a secretless in-sandbox shim forwards plaintext provider bytes over AF_UNIX to a supervisor-owned reverse relay with a fixed configured upstream that strips client Authorization, adds the real credential and makes the TLS connection; a CONNECT egress proxy holds no credential; key custody is never claimed through header injection into a CONNECT tunnel; the relay never takes an upstream from the sandbox"}
  NET-02: {section: "2. What the results settle", kind: decision, tracked_by: [F28], statement: "--unshare-net is viable on EL8 for the whole run tree: OpenCode starts without network when its catalog is embedded or seeded, and the sandbox fails fast; the model API need is met through a bound-in socket, not a shared namespace"}
  NET-03: {section: "2. What the results settle", kind: requirement, tracked_by: [F28], statement: "The custody bridge is unchanged (filesystem AF_UNIX survives the namespace; abstract sockets do not); the supervisor-server link needs an in-sandbox forwarder because the server listens on the sandbox's own loopback (about 0.7 ms per request)"}
  NET-04: {section: "2. What the results settle", kind: requirement, tracked_by: [F28], statement: "The provider key leaves the sandbox entirely, closing the review's G5 exfiltration path (reading the server's environment or /proc/<pid>/environ from an agent shell)"}
  NET-05: {section: "2. What the results settle", kind: requirement, tracked_by: [F28], statement: "The allowlist is the gateway and nothing else; models.opencode.ai is the only other startup destination and is unnecessary with a seeded catalog; connected deployments may allow it or not"}
  NET-06: {section: "2. What the results settle", kind: requirement, tracked_by: [F28, F12], statement: "Offline model availability is a catalog question: a pinned model newer than the binary's embedded catalog needs a seeded catalog or one allowed fetch, and aew doctor says which"}
  NET-07: {section: "3.1 Truthful network labels", kind: requirement, tracked_by: [F28], statement: "The containment label gains network.mode (proxy_only, isolated, shared, not_provided), network.provider_relay (configured or none) and network.egress_allow (only when generic egress exists), with the meanings given; shared is truthful topology, not a guarantee"}
  NET-08: {section: "3.1 Truthful network labels", kind: decision, tracked_by: [F28], statement: "Until F-F lands, Linux M4-B runs are labelled network shared, never retroactively proxy_only; once F-F is accepted, Linux model-controlled runs default to proxy_only and shared is an explicit weaker execution-policy choice"}
  NET-09: {section: "3.2 Layout and one secretless in-sandbox network shim", kind: requirement, tracked_by: [F28], statement: "The M4-B Layout gains a network mode and the AF_UNIX paths it needs; bwrap_argv adds --unshare-net for proxy_only and isolated"}
  NET-10: {section: "3.2 Layout and one secretless in-sandbox network shim", kind: requirement, tracked_by: [F28], statement: "An AEW-owned network shim runs in the harness's network namespace for the run's lifetime as a ProcessTree-owned sibling (not an exec wrapper), providing only the configured legs (supervisor to the server, the provider baseURL to the relay, optional egress to the allowlist proxy); it holds no credential or authority; Codex may use native unix:// transport for the server leg once proven"}
  NET-11: {section: "3.3 Supervisor-owned credentialing provider relay", kind: requirement, tracked_by: [F28], statement: "For proxy_only the supervisor runs one credentialing relay per provider/profile (or an equivalent isolated multiplexer): fixed upstream from the execution profile, holds the credential, strips/replaces Authorization, TLS to the gateway, streaming passthrough, outside the run's PID/network namespaces under existing custody rules; never a general web proxy"}
  NET-12: {section: "3.4 Generic allowlisted egress is separate and credentialless", kind: requirement, tracked_by: [F28], statement: "Authorized non-provider egress goes through a separate supervisor-owned proxy with a bounded host:port allowlist and no secret; for OpenCode 2.0.18 connected mode models.opencode.ai:443 may be allowed for catalog refresh only; tool destinations (web fetch, browser, package managers) need their own authorized capability"}
  NET-13: {section: "3.5 Adapter behavior", kind: requirement, tracked_by: [F28, F24], statement: "OpenCode projects the provider baseURL to the local relay endpoint, gives the sandbox at most a sentinel key, uses HTTP(S)_PROXY only for authorized generic egress, sets NO_PROXY for the loopback endpoints, and sends the real provider_env only to the relay; Codex follows the same boundary, its native network proxy or domain rules defence in depth only, never the credential holder or label"}
  NET-14: {section: "3.6 Self-test and readiness", kind: requirement, tracked_by: [F28], statement: "The containment self-test proves: direct non-loopback egress fails; the bridge answers over its filesystem socket; the supervisor-server path through the shim works; a supervisor-owned local probe upstream succeeds through the relay path; an unauthorized egress target is refused; no provider secret in the sandbox environment or readable files"}
  NET-15: {section: "3.6 Self-test and readiness", kind: requirement, tracked_by: [F28], statement: "Provider/gateway readiness is a separate adapter/doctor check through the profile's bounded health or catalog operation, explicit and fail-closed, never folded into the containment self-test"}
  NET-16: {section: "3.7 OpenCode catalog for connected and air-gapped profiles", kind: decision, tracked_by: [F28, F12], statement: "An air-gapped release may carry a sanitized, checksum-pinned catalog seed generated in a clean disposable instance of the exact OpenCode pin, never an operator's opencode.db; doctor verifies the seed's fingerprint and pin and that the configured model/variant is in the effective catalog; an official offline-catalog mechanism on a later pin replaces it"}
  NET-17: {section: "3.8 Project checks", kind: decision, tracked_by: [F28], statement: "Checks default to network isolated, may request proxy_only or shared only where the check definition and execution policy permit (equal to or stricter than the policy ceiling, never widening the surrounding run's authority), and record the effective mode and egress with their evidence"}
  NET-18: {section: "3.9 Lead session", kind: decision, tracked_by: [F28], statement: "The Lead harness also defaults to proxy_only on Linux once F-F is built; operator UI/attach traffic stays outside the model-execution boundary; broader Lead network capability is an explicit bounded tool path, never raw shared network"}
  NET-19: {section: "4. Costs and what is not shown", kind: evaluation, tracked_by: [F28], statement: "Still to probe in implementation/conformance: a real streamed model turn through the credentialing relay against a TLS gateway (P4 was a local stand-in and is not proof of production injection), backpressure and cancellation on long streams, IPv6 upstreams; Windows stays network not_provided until a separate backend exists"}
  NET-20: {section: "5. Register entry text (F-F, frozen candidate)", kind: process, tracked_by: [F28], statement: "The register carries F-F with the frozen candidate text (F28): depends on M4-B, required before internal alpha, an ADR-0009 label/custody amendment"}
  NET-21: {section: "6. Frozen designer decisions", kind: gate, tracked_by: [F28], statement: "Network containment is a pre-internal-alpha requirement, not an M4-C/D blocker; no internal-alpha security claim calls Linux runs network-contained before its live lane passes"}
  # ---- HNI: harness-native integration research (T9), v0.3 -------------------------------------------------------
  HNI-01: {section: "0. The one finding that frames the rest", kind: requirement, tracked_by: [F13, E35], statement: "AEW relies only on what the pinned binary's own schema advertises, checked at launch; capabilities are recorded per adapter per pinned version, never per product"}
  HNI-02: {section: "0. The one finding that frames the rest", kind: requirement, tracked_by: [F13, E35, F24], statement: "A generated or served schema is necessary but not sufficient: the real model-visible request surface (tools, instructions, deferred runtimes) is part of per-pin conformance"}
  HNI-03: {section: "A. Capability matrix", kind: decision, tracked_by: [F15, E35, F24], statement: "MCP tool registration: MUST USE OpenCode 2.0.18 with mcp.servers.aew codemode false (the twelve typed tools directly); Codex 0.160.0 is not support-ready for the Lead's typed surface (MCP deferred behind exec) until DynamicToolSpec or a later pin is proven; capability recorded as transport.mcp.local with per-pin presentation direct_function_tools or deferred_runtime"}
  HNI-04: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F13], statement: "Tool filtering: SHOULD USE on both, recorded as inventory_filtering and request_schema_filtering per pin; only OpenCode 2.0.18 may claim schema removal; Codex 0.160.0 enabled_tools narrows inventory only"}
  HNI-05: {section: "A. Capability matrix", kind: decision, tracked_by: [F19], statement: "Structured tool results: OPTIONAL Codex output schemas for the F19 raw arm and reports; never AEW evidence (submit validates records)"}
  HNI-06: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Session resume: DO NOT USE for recovery (AEW recovery is aew resume from .aew/); OPTIONAL for the Lead TUI's reattach convenience, marked AEW_MANAGED continuation"}
  HNI-07: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24], statement: "Events and hooks: SHOULD USE event streams for telemetry on both; DO NOT USE hooks that decide or rewrite tool input (a second policy engine, and host-side execution escapes the sandbox); Codex PostToolUse artifact capture OPTIONAL after a probe of host confinement and updatedInput"}
  HNI-08: {section: "A. Capability matrix", kind: decision, tracked_by: [F24], statement: "Native sandbox: SHOULD USE on Codex as defence in depth (workspace-write, network_access false, writable_roots within the M4-B layout, never danger-full-access), recorded as a second label line, never replacing filesystem os_readonly_roots; nested bwrap on EL8 needs a probe"}
  HNI-09: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24, F15], statement: "Approvals: no ask or auto_review in runs (allow or deny decided at projection); for the Lead TUI only as a display of decisions_required whose answer routes through an AEW decision tool, never the harness reply"}
  HNI-10: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24], statement: "Model, provider and effort: MUST USE through ADR-0010 pins only with effective-model verification; the harness never chooses (auto-routing refused); effort recorded with verified_through_gateway and probed through the gateway"}
  HNI-11: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24, F26], statement: "Skills and instructions: native skills are an evaluated enhancement, not baseline authority; project discovery stays off for runs; a supported Codex run proves bundled system skills and ambient base instructions are suppressed or replaced"}
  HNI-12: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Context: set tool_output max_bytes/max_lines now; compaction hooks later and version-gated, injecting AEW pack text only, never a model summary; probe experimental.session.compacting on the OpenCode pin"}
  HNI-13: {section: "A. Capability matrix", kind: decision, tracked_by: [F24, F13, F7], statement: "Native subagents/delegation: DO NOT USE; capability recorded with model_visible, disabled_verified and max_depth; Codex 0.160.0 is not support-ready for worker runs until conformance proves its collaboration tools/instructions absent or unreachable under the granted capability"}
  HNI-14: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Native planning is UI only and never AEW plan state; filesystem/edit, interrupt/message delivery, process lifecycle (one private instance per run under the supervisor) and usage telemetry (never evidence) are MUST USE as today"}
  HNI-15: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24], statement: "Shell environment: MUST USE Codex shell_environment_policy inherit none with set equal to agent_env (probe it) and OpenCode's session environment replacement"}
  HNI-16: {section: "A. Capability matrix", kind: requirement, tracked_by: [E35, F24], statement: "Configuration scoping: the adapter knows the complete effective configuration; Codex uses a private CODEX_HOME with --ignore-user-config --ignore-rules; OpenCode keeps OPENCODE_CONFIG_CONTENT plus OPENCODE_DISABLE_PROJECT_CONFIG and probes whether that also disables .opencode plugins and the remote .well-known layer"}
  HNI-17: {section: "A. Capability matrix", kind: requirement, tracked_by: [F24, F28], statement: "Credentials: a per-run CODEX_HOME (a shared one leaks login state to every run); the provider key reaches the app-server process only, and F-F moves it to the relay"}
  HNI-18: {section: "A. Capability matrix", kind: requirement, tracked_by: [E35, F24, F13], statement: "Capability probing: MUST USE schema probes plus a model-visible surface probe; Codex support pins the generated app-server schema and its hash"}
  HNI-19: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Plugins: DO NOT USE inside runs (plugins.loaded none asserted); the Lead TUI may load the operator's plugins only on an explicit operator flag"}
  HNI-20: {section: "A. Capability matrix", kind: decision, tracked_by: [F15], statement: "Native UI: SHOULD USE command and toast affordances to show ActionProjection/decisions_required hints; OPTIONAL attach for a second operator view; a surface may show, never decide"}
  HNI-21: {section: "OpenCode (pinned 2.0.18, next pin to be chosen by probe)", kind: requirement, tracked_by: [E35], statement: "OpenCode profile: MUST USE private serve --stdio per run, the openapi capability probe, the config projection with project config disabled, session environment replacement, allow/deny rules only, model/variant pins verified, tool_output limits, events for telemetry, mcp.servers.aew with codemode false; SHOULD USE per-agent tool filtering and a run-private curated skills directory; DO NOT USE ask, task/subagents, project plugins and .opencode/ in runs, session resume, share, autoupdate, LSP/formatter in runs, the remote .well-known layer; execute and the desktop browser namespace explicitly denied in worker runs and covered by conformance"}
  HNI-22: {section: "Codex (probed pin: CLI 0.160.0 / app-server protocol v2)", kind: decision, tracked_by: [F24], statement: "Codex app-server is a viable private transport but 0.160.0 is not a supported AEW pin; once a pin qualifies: one private app-server per run, pinned schema/hash, private CODEX_HOME with --ignore-user-config --ignore-rules, inherit none, approval_policy never, effective-policy verification, loud MCP readiness, telemetry and interrupt; DO NOT USE Code Mode as the Lead transport, uncontrolled collaboration, harness approvals as decisions, shared login, deciding hooks, memories, resume as recovery"}
  HNI-23: {section: "Custody caveat (probe 1)", kind: requirement, tracked_by: [E35, F15], statement: "The probes forwarded the Lead token into the MCP process to isolate harness behaviour; production stays broker-custodied (the Lead MCP process holds no AEW_LEAD_TOKEN), so every readiness/smoke test repeats the server-start and catalog check through the broker-only architecture"}
  HNI-24: {section: "Custody caveat (probe 2)", kind: requirement, tracked_by: [F24], statement: "No Codex support claim may rely on the direct-token probe setup; qualification runs broker-custodied"}
  HNI-25: {section: "Design meaning", kind: sequencing, tracked_by: [F24], statement: "The next Codex work is a bounded qualification spike, not a design: try DynamicToolSpec/client registration or a later pin for direct typed tools, and find the supported suppression of collaboration tools and bundled system skills/instructions; the T1/F13 semantics then apply unchanged"}
  HNI-26: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35, F13], statement: "HarnessAdapter gains a read-only capabilities() returning the matrix ids with their states per pinned version, consumed by the registry"}
  HNI-27: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35], statement: "LaunchContract names skills, tools_allowed and native_sandbox as fields when they exist; extra stays for the rest"}
  HNI-28: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35, F28], statement: "The containment label records a harness-native sandbox as a list mechanism or a native {harness, mode, roots} line; Server.start/Client take an address family for the F-F forwarder or a native unix socket"}
  HNI-29: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [F13], statement: "The capability registry keys on (adapter, pinned_version, fixture_hash) and records advertised/available state and presentation (direct, deferred, hidden) plus a request-surface conformance hash where feasible"}
  HNI-30: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35], statement: "A 'nothing else loaded' conformance scenario per driver: planted project config, plugins, rules and skills have no observable effect and the worker request/tool/instruction surface holds no unapproved capability (OpenCode: execute, browser; Codex: collaboration tools/instructions, bundled skills, Code Mode where disallowed, unexpected MCP)"}
  HNI-31: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: gate, tracked_by: [E35, F24], statement: "Minimum conformance for a supported harness: the harness-neutral conformance scenarios and AT-14 to AT-17 on the real binary, fail-closed schema probe, custody, allow/deny only, a private instance per run, effective model equals the pin, stop ends every process under the M4-B layout on Linux, the nothing-else-loaded scenario, and explicit Lead MCP readiness (a missing server never degrades silently into a session without the AEW control surface)"}
  HNI-32: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: requirement, tracked_by: [E35, F13], statement: "Enhanced capabilities are declared per pin, never assumed; a missing capability degrades to the matrix fallback with an UNSUPPORTED label and never changes a gate, transition or label's truthfulness"}
  HNI-33: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: process, tracked_by: [E35, E17], statement: "One pinned version per adapter (TESTED_VERSIONS) with its schema fixture; a new version regenerates the fixture, re-runs the live lane and updates the matrix's evidence; MCP protocol revisions are negotiated and declared"}
  HNI-34: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: gate, tracked_by: [E35, F24], statement: "Live smoke per pin before 'supported': server start and schema probe, a scripted run through the bridge with evidence ingested, broker-only control-surface readiness, a run under the M4-B layout on Rocky 8.10, the model-visible nothing-else-loaded scenario, cost telemetry; OpenCode 2.0.18 exposes direct tools with codemode false, and a Codex pin proves the direct T1 surface and absent ungranted collaboration/system-skill surfaces"}
  HNI-35: {section: "H. Design-authority disposition", kind: decision, tracked_by: [E35, F24, F13], statement: "Durable conclusions: capability state keyed by adapter + pin + schema/probe identity; native features never become workflow authority; missing optional features degrade without changing gates, transitions or evidence; a supported pin needs real-binary conformance, custody, effective-model, process/containment and nothing-else-loaded checks; OpenCode 2.0.18 needs codemode false for the Lead MCP surface; Codex 0.160.0 is not a supported pin; the Lead fails closed when the AEW control surface is unavailable; available/inventory is distinct from model-visible presentation; the matrix is a versioned qualification artifact re-run on each pin change"}
  # ---- SAI: the effective-spec overlay index and re-freeze plan (T7), v0.2 --------------------------------------
  SAI-01: {section: "1. How the governing order works today, and the gap", kind: requirement, tracked_by: [E19], statement: "Close the two gaps: record machine-readably which frozen WC/KC sections each amendment replaces, and check contract citations (36 distinct sections cited 80 times in living documents, none checked today)"}
  SAI-02: {section: "1.1 Frozen governance model", kind: decision, tracked_by: [E19], statement: "The index is an overlay resolver for the frozen WC/KC set, not a second specification or a general document-version database"}
  SAI-03: {section: "1.1 Frozen governance model", kind: requirement, tracked_by: [E19], statement: "Explicit authority states proposed, design_frozen, adopted, superseded; only adopted overlays take part in effective resolution; adopted needs an attributable operator/repository adoption reference; superseded stays in history, not effective; designer freeze, implementation and adoption are never collapsed into one status"}
  SAI-04: {section: "1.1 Frozen governance model", kind: requirement, tracked_by: [E19], statement: "The index names exact frozen sections or cases an adopted overlay replaces or extends, and pending consolidation debt where an accepted design requires an unwritten contract amendment; ADR self-amendments that do not alter or extend WC/KC semantics stay out"}
  SAI-05: {section: "3. What a v0.8 / v0.5 re-freeze would consolidate", kind: sequencing, tracked_by: [E19], statement: "Re-freeze after M4-E (F15 governing, so WC 15.6 is amended once) and before internal alpha; WC v0.8 folds 7.4/7.5 (Class 0), 7, 8 and invariant 7 (Ticket revisions), 15.6 (stages, ActionProjection), 22 pruned; KC v0.5 folds 12, 12.3, 21, 26"}
  SAI-06: {section: "3. What a v0.8 / v0.5 re-freeze would consolidate", kind: requirement, tracked_by: [E19], statement: "A re-freeze gets a new manifest spec_set, new spec-pin hashes and tag, a new SPEC_SET in aew/__init__.py, and an aew migrate step for each project's control.yaml spec_set (no mixing without a migration review)"}
  SAI-07: {section: "4. The index: `docs/spec-amendments.yaml` (frozen candidate)", kind: requirement, tracked_by: [E19], statement: "docs/spec-amendments.yaml (aew/spec-amendments/v1): base_spec_set plus overlays with id, path, status, adoption {at, ref}, replaces/extends targets {doc, section, case?, anchor}, pending {doc, section, reason}, superseded_by; it resolves effective authority without repeating amendment prose; populated from the repository (Class 0 adopted, Ticket revisions adopted with pending KC 12, WC 7, WC 8, invariant 7, two surfaces design_frozen with pending WC 15.6)"}
  SAI-08: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "Every effective replaces/extends target is a real frozen WC/KC section or named case"}
  SAI-09: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "At most one effective replacement head per target; chains are explicit through superseded_by; ambiguity fails closed"}
  SAI-10: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "design_frozen and proposed entries never affect effective resolution; an adopted entry has an attributable adoption reference"}
  SAI-11: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "pending creates visible consolidation debt but never invents replacement text; superseded overlays stay indexed for historical resolution"}
  SAI-12: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "Research and proposal files may be cited as evidence but are never the effective target of an adopted overlay; a decision living only in research/ is extracted to design/ or an ADR first"}
  SAI-13: {section: "4.2 Citation semantics", kind: decision, tracked_by: [E19], statement: "An unversioned citation (WC 7.4) means the effective section, frozen base plus the adopted overlay chain; a citation of historical frozen text is version-qualified (WC v0.7 7.4); docs/README.md states the convention beside the governing order; the resolver can report base, effective replacement and source; aew docs resolve is optional later"}
  SAI-14: {section: "5. Tests: `tests/unit/test_spec_amendments.py`", kind: requirement, tracked_by: [E19], statement: "tests/unit/test_spec_amendments.py, structural and deterministic (no paragraph-level 'amend nearby' heuristic, no natural-language interpretation): index integrity, a single effective head, map/index coverage both ways for WC/KC-affecting overlays, living citations resolve (unversioned through the chain, historical against the named version), no research authority, pending debt reported deterministically, the frozen files stay pinned by test_spec_pin.py"}
  SAI-15: {section: "6. Re-freeze and migration", kind: sequencing, tracked_by: [E19, F4], statement: "Before the re-freeze: write the missing Ticket-revision WC/KC amendment; promote governing decisions stranded in research/ to a decision record or ADR; adopt the F15 overlay; clear the pending debt meant for the new base; fold the effective adopted heads into WC v0.8 / KC v0.5; create a new immutable manifest, pin and tag, keeping the old set for historical resolution"}
  SAI-16: {section: "6. Re-freeze and migration", kind: requirement, tracked_by: [E19], statement: "A new spec set never silently rewrites projects: migration is explicit and attributable (a migrate-spec path with migration review and compatibility checks); old-spec projects stay readable; mutating under the new spec requires the migration to pass; no mixed authority in one active project; the new base's overlay index starts clean while historical entries stay with the prior set"}
  SAI-17: {section: "7. Frozen designer disposition", kind: sequencing, tracked_by: [E19, F4], statement: "Immediate work is small: the index schema and file, the resolver and tests, populating it from the repository, and writing the missing Ticket-revision contract amendment; no further research needed"}
  # ---- KMP: lessons from the knowledge-manifest prototype (research; ADR-0013 governs) ----------------------------
  KMP-01: {section: "2. Patterns worth keeping", kind: requirement, tracked_by: [F21], statement: "Carry forward, where ADR-0013 allows: engine-owned fields refused by name on submission; the capture commit writes the initial disposition; search falls back to a phrase when FTS5 rejects the text; kind filtering in SQL so a planted row is dropped; and the prototype's tests (allowed hot keys only, a tampered FTS row hides and never invents, orphans reported, crash mid-capture leaves old or new history, audit covers records while resume and status read none)"}
  KMP-02: {section: "3. Registry findings: the checks worked", kind: requirement, tracked_by: [E36], status: "done: PR #51 (V2_ONLY_KEYS and as_v1)", statement: "Define the v2-only hot-key set once (schema v1 exclusion list, aew init and the v1 test fixtures all derive from or are checked against it), before M4-D adds queue"}
  KMP-03: {section: "3. Registry findings: the checks worked", kind: process, tracked_by: [F21], statement: "A new command family is classified in the DispatchDecision CLI enumeration (dispatching entry point or not dispatching); the M6b plan budgets for it"}
  KMP-04: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "ENGINE_OBSERVED_WEAK_BOUNDARY never earns default serving (case_recall) through a coarse engine source (KST-15)"}
  KMP-05: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21, E18], statement: "knowledge.capture follows the contiguous safe watermark, not the newest receipt, and a job's origin is the triggering committed event, never the capture transaction's own revision (KST-12, KST-14)"}
  KMP-06: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "A duplicate capture of the same origin event returns the prior receipt, with a test (KST-12, completion criterion 6)"}
  KMP-07: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Commit-time numbering (knowledge_disposition_seq, record paths) is computed from authenticated history plus staged entries, never from the derived index alone (KST-06, KST-25)"}
  KMP-08: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Dispositions target and sequence by exact version (K@v), not the bare Knowledge ID (KST-06)"}
  KMP-09: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "A disposition's coarse source follows the actual actor: a Lead judgment is model with its decision and Lead generation, operator only for a direct operator judgment (KST-08)"}
  KMP-10: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Use the accepted vocabulary and names: no visibility_widened or audit_finding, supersedes/superseded_proposal, knowledge_disposition and capture_receipt (KST-08, KST-09, KST-51)"}
  KMP-11: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Use the accepted layout: records under knowledge/records/, RECORD_GLOBS covering only that subtree (KST-04)"}
  KMP-12: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Number the knowledge oracle rules 29 to 32, after ADR-0012's 24 to 28 (KST-33 to KST-36)"}
  KMP-13: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "history list keeps the legacy kinds by default (KST-23)"}
  KMP-14: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Build what the prototype left out: the knowledge_service principal with its commit-boundary closure check, and PARTIAL and NO_CANDIDATE receipts (KST-19, KST-21, KST-10, KST-11)"}
  # ---- TLS: the typed Lead surface v0.2 (T1) -----------------------------------------------------------------------
  TLS-01: {section: "1. The decision, in one paragraph", kind: requirement, tracked_by: [F15.1], statement: "The Lead's interface is a catalog of typed actions defined once below transport as data plus one runner; each action names its argument schema, the primitives it expands to, its judgment-bearing inputs and its base operation class, and the runner computes an effective operation class per invocation"}
  TLS-02: {section: "1. The decision, in one paragraph", kind: requirement, tracked_by: [F15.1], statement: "Every valid action call returns one StageResult: committed revision, stage-intent identity where applicable, completed steps, the exact stop boundary, payload and an ActionProjection of what is available, blocked or not yet queryable"}
  TLS-03: {section: "1. The decision, in one paragraph", kind: decision, tracked_by: [F15.1, Q13], statement: "MCP is the first normal Lead transport: the harness spawns `aew lead mcp`, a process with no Lead credential that forwards to the Lead broker; the server is `aew-lead`, with `aew-run` and `aew-knowledge` as separate namespaces. (The lead developer's review asks for the CLI relay first and MCP once spiked; reconciled under Q13)"}
  TLS-04: {section: "1. The decision, in one paragraph", kind: decision, tracked_by: [F15.1], statement: "The CLI is a parity, recovery, conformance and operator/debug adapter over the same catalog; the generic `cli(argv)` escape exists but is not advertised to the model in the normal surface, only under an explicit recovery/debug profile; common consequential actions get dedicated typed tools"}
  TLS-05: {section: "1. The decision, in one paragraph", kind: invariant, tracked_by: [F15], statement: "No transport decides legality, retries judgment, widens authority or invents next actions; the Engine remains the sole legality and workflow authority"}
  TLS-06: {section: "2. Layering", kind: requirement, tracked_by: [F15.1], statement: "The runner is the only module that knows a tool's steps; a transport carries arguments in and a StageResult out; one conformance test enumerates the catalog against the dispatch registry, one golden pins the harness projection, and the CLI enumeration classifies the two new commands"}
  TLS-07: {section: "3.1 The catalog, v1", kind: requirement, tracked_by: [F15.1, F15.2], statement: "The v1 catalog: queries (status, resume, work_show, explain, harness_status), harness_wait, checkpoint, the stages ticket_draft, ticket_start, ticket_request_review, ticket_request_verification, ticket_prepare, the decision tool integration_publish, and the recovery-only cli; each with kind, class, primitive expansion, judgment inputs and build status (ticket_prepare and integration_publish designed, unavailable until M4-D/M4-E)"}
  TLS-08: {section: "3.1 The catalog, v1", kind: decision, tracked_by: [F15.2], statement: "Publication is not a stage and is never automatic because preparation succeeded; `integration_publish` is a single-primitive judgment-bearing decision tool, and a conditional `ticket_submit_integration --publish-if-clean` exists only if F15 §17's semantics are accepted"}
  TLS-09: {section: "3.2 Argument conventions", kind: requirement, tracked_by: [F15.1], statement: "Closed schemas (additionalProperties false); `expect_rev` required on every stage and absent on every query; free text travels as JSON data with no shell between model and engine; execution overrides are one optional object recorded as selected_by lead; a judgment-bearing override promotes the call to JUDGMENT_BEARING and never drops back; no credential is ever an argument and results are scrubbed"}
  TLS-10: {section: "3.3 `StageResult` and `ActionProjection` (`schemas/surface.schema.json`, closed)", kind: requirement, tracked_by: [F15.1], statement: "The closed StageResult and ActionProjection schemas, with the stop boundary vocabulary; availability is tri-state AVAILABLE | BLOCKED | UNKNOWN, UNKNOWN is never rendered or treated as BLOCKED, and auto_runnable is false unless availability is AVAILABLE and the effective class is non-judgment-bearing"}
  TLS-11: {section: "3.3 `StageResult` and `ActionProjection` (`schemas/surface.schema.json`, closed)", kind: requirement, tracked_by: [F15.1], statement: "Every well-formed call that reaches the runner returns a StageResult, Engine refusals and partial stops included; JSON-schema and transport validation failures are adapter input errors that commit nothing and never pretend to be Engine refusals; the MCP adapter sets isError from ok without discarding structured content"}
  TLS-12: {section: "3.3 `StageResult` and `ActionProjection` (`schemas/surface.schema.json`, closed)", kind: invariant, tracked_by: [F15.1], statement: "The projection is derived from accepted query surfaces and explicit local telemetry, exposes UNKNOWN where the Engine cannot yet answer, is not a second planner, and decisions never carry a default"}
  TLS-13: {section: "3.4 Stop and retry rules", kind: gate, tracked_by: [F15.2], statement: "A stage is one tool call, not one atomic commit; mutating stages are not enabled on the normal Lead surface until the stage-intent journal is implemented"}
  TLS-14: {section: "3.4 Stop and retry rules", kind: requirement, tracked_by: [F15.2], statement: "The eight frozen rules: caller CAS on expect_rev; a durable StageIntent is the first commit; the first refusal stops with completed steps kept; a later STALE_REVISION retries once only for MECHANICAL or POLICY_RESOLVED steps in a non-judgment-bearing stage with an unchanged digest; judgment is never replayed; policy drift stops as STALE_POLICY; launch failure after committed dispatch stops as launch_failed; after crash or takeover `resume` surfaces nonterminal intents and a Lead chooses CONTINUE_STAGE or ABANDON_STAGE"}
  TLS-15: {section: "3.5 Classification and conformance", kind: requirement, tracked_by: [F15.1], statement: "A catalog entry has a base operation class and every invocation an effective one: any judgment input promotes to JUDGMENT_BEARING, a stage with a judgment-bearing primitive or Lead acceptance is judgment-bearing, POLICY_RESOLVED only when every consequential choice is policy-resolved, MECHANICAL has no unresolved choice, unknown fails closed to JUDGMENT_BEARING; retry logic uses the effective class"}
  TLS-16: {section: "3.5 Classification and conformance", kind: evaluation, tracked_by: [F15.1], statement: "Tests pin the catalog: closed valid schemas; every dispatching tool names a registered entrypoint and dispatch.launch and no non-dispatching tool names one; judgments declared and conditional promotion tested; built tools have runners and designed tools are refused; the normal advertised list stays under its byte budget and excludes recovery tools; ticket_draft is equivalent to its primitive sequence; the CLI transport returns the same contract"}
  TLS-17: {section: "3.6 What moves into the engine for M4-E", kind: requirement, tracked_by: [F15.2], statement: "Engine work before normal mutating stages: the StageIntent journal (hot while active, cold when terminal under ADR-0011; the durable source for partial-stage recovery), the policy/dependency digest and STALE_POLICY, queryable transition and ingest guards on the DispatchDecision substrate, policy-resolved review and verification card sets; plus `requires_disposition` as a gate input, `ticket_prepare` once M4-D's lease exists, and `ticket_submit_integration --publish-if-clean` on the queue"}
  TLS-18: {section: "4.1 Where the process runs, and custody", kind: requirement, tracked_by: [F15.1], statement: "The `aew-lead` MCP process runs in the TUI's curated environment with no Lead credential and no provider key, forwards each call as broker operation `lead.tool` over the existing bridge, and the broker runs the common runner under `dispatch.channel(\"lead_mcp\")`; bridge material is never accepted as a Lead credential; a closed broker yields STALE_AUTHORITY; there is no direct MCP authority mode and the process fails closed without a live broker"}
  TLS-19: {section: "4.2 Projection and probe changes (`harness/opencode/projection.py`, `capabilities.py`)", kind: requirement, tracked_by: [F15.1], statement: "The Lead projection declares the `aew-lead` local server as the pinned 2.0.18 schema spells it, LEAD_RULES allows its namespace, the system text names the typed surface as the normal path and primitive shell mutation as recovery, and the capability probe requires the MCP configuration keys from the served OpenAPI so a respelling fails closed"}
  TLS-20: {section: "4.3 The protocol layer (`aew.surface.mcp`)", kind: requirement, tracked_by: [F15.1], statement: "A dependency-free newline JSON-RPC 2.0 stdio server: initialize with a known protocol revision, ping, profile-filtered tools/list with MCP annotations, tools/call returning StageResult as structuredContent with isError from ok; invalid arguments, unknown, designed or concealed tools are adapter input errors that commit nothing; stdout is protocol only"}
  TLS-21: {section: "4.4 Context cost", kind: requirement, tracked_by: [F15.1], statement: "Acceptance measures the normal advertised surface, which must stay under the 12,000-byte budget and 16-tool ceiling; recovery-only tools consume no normal prompt context; any saving claimed from progressive disclosure is measured against the pinned harness"}
  TLS-22: {section: "5. Transport B: CLI parity, recovery, and conformance", kind: requirement, tracked_by: [F15.1], statement: "`aew lead tool <name>` invokes the same catalog and runner and returns the same StageResult, routed through the broker inside a session; the generic cli action is catalogued but not advertised normally; stage commands as CLI verbs are not required and, if added, are generated adapters over the catalog, never a second semantic implementation"}
  TLS-23: {section: "6. The role surface (`aew-run`), designed only", kind: requirement, tracked_by: [F15.3], statement: "The separate `aew-run` server exposes the run bridge's whoami, check.run and submit as tools from a thin stdio client inside the sandbox; the supervisor keeps the credential; submit takes the report as a typed object with the evidence schema, ending the YAML-frontmatter failure class; not prototyped"}
  TLS-24: {section: "7. Dispatch conformance", kind: requirement, tracked_by: [F15.1], statement: "Dispatches through the typed surface carry channel `lead_mcp` (provenance only, never legality), `lead tool` and `lead mcp` are classified as non-dispatching commands, dispatching stages reach the registry through work_assign and invoke_create, and `explain` is Dispatch.decide on committed state"}
  TLS-25: {section: "8. What ADR-0012 gives this surface", kind: requirement, tracked_by: [F15.1, E18], statement: "`harness_wait {runs[]}` blocks on the outbox wake file and checks run records and committed events; the ActionProjection behind `/attention` is recomputed when an affecting event lands and the same projection module serves StageResult, status, the dashboard and later the scheduler; the revision every result carries is the session's cursor"}
  TLS-26: {section: "9. The prototype: what is there, what it proves, what it does not", kind: requirement, tracked_by: [F15.1, F15.2], statement: "Everything the prototype did not build is required before the corresponding frozen behaviour ships: ticket_prepare, integration_publish, the StageIntent journal and STALE_POLICY, effective-class promotion, tri-state availability, queryable guards, policy-resolved card sets, wait-any via ADR-0012, the aew-run server, broker-only enforcement, recovery-profile filtering, the aew-lead rename, takeover-mid-session coverage, a live OpenCode 2.0.18 MCP spawn check and lead_mcp channel conformance"}
  TLS-27: {section: "10. Evaluation and completion criteria (for M4-E, from F15 §21)", kind: evaluation, tracked_by: [F15.2, F19], statement: "Hard gates: no false advance in the seeded corpus, an attributable durable record before every dependent transition, no normal mutating stage without a StageIntent, no automatic retry of judgment, anomaly catch at least the primitive baseline, recovery correctness across crash, retry, drift, takeover and mixed-mode walks; stage/primitive and query/execute equivalence, PrimitiveSpec coverage, bounded hot state. Reported, never traded: steps per Ticket, refusals, reads between mutations, help lookups, cached tokens, wall clock; measured by the preregistered dogfood against the M3 baseline with the primitive path as control"}
  TLS-28: {section: "11. Sequencing", kind: sequencing, tracked_by: [F15.1, F15.2, F15.3], statement: "M4-D: catalog/runner skeleton, broker lead.tool, broker-only MCP transport, read/query tools, ADR-0012 wait-any, CLI parity, conformance and profile filtering. M4-E: the StageIntent journal, drift binding, effective-class promotion, queryable guards, policy-resolved sets, governed mutating stages, ticket_prepare, integration_publish, equivalence tests, lead_mcp conformance, live MCP spawning. M4-H: the paired F19 evaluation. M6: aew-knowledge as a separate namespace"}
  TLS-29: {section: "12. Frozen designer decisions", kind: decision, tracked_by: [F15], statement: "The nine frozen decisions: review acceptance and verification dispatch stay one typed stage; generic cli is not a normal model tool; unqueryable actions stay visible as UNKNOWN; no direct MCP credential mode; StageIntent is mandatory before normal mutating-stage dogfood; the server is aew-lead with aew-run and aew-knowledge separate; the effective class is invocation-specific; transport validation and Engine refusal are distinct; publication gets a typed judgment tool. No designer-level question remains; operator adoption is the approval step"}
  TLS-30: {section: "13. Alternatives considered", kind: decision, tracked_by: [F15], statement: "Rejected: the broker itself speaking MCP over its socket, stage commands as CLI verbs first, an MCP SDK dependency, advertising the result schema per tool, a generic advance tool, the generic cli advertised normally, a direct MCP mode holding a Lead token, and boolean action availability"}
  # ---- PMP: project maps v0.3 (T5, designer) -----------------------------------------------------------------------
  PMP-01: {section: "1. Frozen decision", kind: decision, tracked_by: [F22.1], statement: "Two maps, two mechanisms, neither an authority source: the codebase map is deterministic Engine output from one exact Git tree under a versioned static ruleset, holding only repository-structural facts reproducible without executing project code; the architecture map is investigator-authored evidence through the existing non-mutating path, every claim attributable to its investigation and observed paths"}
  PMP-02: {section: "1. Frozen decision", kind: invariant, tracked_by: [F22.1], statement: "A manifest pointer means current project navigation reference, never true, accepted as fact or admitted Knowledge; maps do not enter the K0 to K3 ladder, are not default recall candidates and receive no knowledge_disposition; a stale or missing map never changes project authority, a workflow transition, dispatch legality or source truth"}
  PMP-03: {section: "2. The codebase map record", kind: requirement, tracked_by: [F22.1], statement: "`aew/codebase-map/v1`, YAML, an immutable derived artifact under `.aew/knowledge/maps/` whose content address includes the source tree identity and the generator/ruleset identity, with the required envelope: schema, source_revision, source_tree, generator version and ruleset digest, artifact digest, limits and sections"}
  PMP-04: {section: "2. The codebase map record", kind: requirement, tracked_by: [F22.1], statement: "The generator reads the commit object (`git ls-tree -r <H>` or an equivalent object API), never the working tree or index, so `--commit H` is exactly H whatever the checkout's staged or unstaged state"}
  PMP-05: {section: "2. The codebase map record", kind: requirement, tracked_by: [F22.1], statement: "The v1 sections and their deterministic rules: directories (bounded summary with counts, languages and structural labels from a versioned table), languages (versioned extension table, unknown explicit), build_descriptors (all matches, no singular build-system claim), entry_point_candidates (declared versus convention, with evidence paths), test_candidates (proposal evidence only, never policy), generated_and_vendor (navigation hints, not write-deny policy), semantic_prerequisites and limits_and_omissions"}
  PMP-06: {section: "2.1 Deliberately excluded from the canonical revision-bound map", kind: decision, tracked_by: [F22.1], statement: "Excluded from the canonical map: untracked or ignored workspace content (a future `--workspace` overlay is ephemeral, never stored), the Python import or dependency graph in v1, and any prose, inferred purpose or ownership, call graphs, runtime behaviour or model summaries; metadata reads are size-bounded, parser failures are omissions, and symlinks are treated as Git objects and never followed into the host"}
  PMP-07: {section: "3. Freshness: tree-bound, computed, non-authoritative", kind: requirement, tracked_by: [F22.1], statement: "Codebase-map freshness binds the whole tracked Git tree, computed and never written, because a path list misses added paths; the commands `aew map generate [--commit H] [--expect-rev N]`, `map show`, `map diff` and `map architecture --from <evidence-id>`; `aew init` never silently creates or adopts the first map outside T10's proposal/apply flow; `aew doctor` reports map freshness as INFO and a missing or stale map is never a launch error"}
  PMP-08: {section: "5. Storage and history: derived artifact, not admitted Knowledge", kind: requirement, tracked_by: [F22.1], statement: "The existing `knowledge.codebase_map` and `knowledge.architecture_map` manifest pointers are used, not reinterpreted as K0 admission; the codebase pointer records path, digest, source revision, tree, generator version and ruleset digest; the file is immutable, moving the pointer is an attributable project-state transaction, historical maps stay addressable, and no ADR-0013 reference id or knowledge_disposition is required (a later derived-artifact history kind would be indexing convenience only)"}
  PMP-09: {section: "6. The architecture map", kind: requirement, tracked_by: [F22.1], statement: "An investigator Ticket may produce an architecture-map candidate from a fixed KC §8.2 template as an ordinary sealed discovery/evidence record; the Lead may select one as the current architecture reference, which does not certify its claims; its source class stays role-attested; a stale reference is a hint for a new investigation and AEW never auto-dispatches one; no new record kind, admission or acceptance path"}
  PMP-10: {section: "7. Semantic map extensions: additive capability, not a new core", kind: decision, tracked_by: [F22.2], statement: "The structural map is the required, language-neutral core; `map.semantic.<language>` extensions are optional enrichments that never redefine the structural map, replace source truth or become workflow authority"}
  PMP-11: {section: "7.1 Extension contract", kind: requirement, tracked_by: [F22.2], statement: "Every semantic extension has a versioned contract (capability, extractor version, source tree, inputs including compile database, toolchain identity and build configuration, coverage per fact family, limitations, artifact digest) and obeys seven rules: additive only, independent freshness from its own inputs, explicit coverage with partial shown as partial, no source replacement, no universal graph fiction, capability-qualified serving, and versioned extractor identity producing a new artifact"}
  PMP-12: {section: "7.2 C/C++ is the first semantic-extension priority", kind: decision, tracked_by: [F22.2], statement: "C/C++ is the first semantic extension; its effective identity is the Git tree plus compilation database, toolchain identity, include paths, defines, generated-header context and extractor version, so freshness cannot come from source_tree alone; the initial target facts are translation units, declarations and definitions with symbol identity, linkage, include relationships under the active command, locations, resolvable caller/callee relationships, generated-header bindings and bounded macro context, each reported complete, partial or unavailable; AEW implements no C/C++ parser and uses compiler-quality compilation-database tooling with the tool identity recorded"}
  PMP-13: {section: "7.3 Later language extensions", kind: decision, tracked_by: [F22.2, F19], statement: "Python, TypeScript, Go and other extensions model their own language and build semantics rather than the C/C++ schema; each must earn its complexity through an actual AEW use case and F19 evidence"}
  PMP-14: {section: "7.4 Storage and composition", kind: invariant, tracked_by: [F22.2], statement: "Semantic extension artefacts are immutable derived artefacts tied to the structural map, source tree and their semantic inputs; composition into an effective view is explicit; no combined artefact becomes an authority source, extension records are not automatically admitted Knowledge, and extension availability never changes dispatch legality by itself"}
  PMP-15: {section: "8. Packs and context: interfaces now, serving policy after evaluation", kind: requirement, tracked_by: [F22.1, F19], statement: "T5 defines bounded read/query interfaces, not automatic serving: directory rows intersecting a Ticket's authoritative scope globs, generated/vendor hints on those paths, metadata for files in a reviewer diff, and the map's freshness and limits; full-map or architecture-map injection, token budgets and role-specific serving are F19 questions, compared against the M3 failure where the Lead guessed scope globs; without measured benefit the map stays an on-demand query surface"}
  PMP-16: {section: "9. Explicit non-goals", kind: decision, tracked_by: [F22.1], statement: "Non-goals: semantic or import graphs in v1, model summaries in the deterministic map, ownership maps and glossary generation, automatic policy or check-command application from map findings, any dispatch gate on map freshness, maps as K0 to K3 admission, following untracked or symlinked content into the host, full-pack serving policy before F19 evidence, one universal semantic graph schema, a mandatory language extension, or treating extension output as stronger evidence than its inputs"}
  PMP-17: {section: "10. Frozen designer decisions", kind: decision, tracked_by: [F22.1, F22.2], statement: "The fifteen frozen decisions: T10 wins on the first map at init; no import graph in v1; a stale map never blocks dispatch; freshness binds the whole tree; generate from Git objects; untracked content excluded; maps are derived context not admission; architecture selection is not truth certification; serving stays measurable; generator limits are part of the record; structural core plus semantic extensions is the permanent composition model; C/C++ is extension one; compiler-quality extraction only; extension failure is local; language schemas may differ"}
  PMP-18: {section: "10. Frozen designer decisions", kind: sequencing, tracked_by: [F22.1, F22.2], statement: "No designer-level question blocks the bounded structural v1 (deterministic generator, immutable artifact plus manifest pointer, current/stale query, diff, architecture-reference selection); the structural v1 waits on no language extension, and the C/C++ extractor is designed and implemented as its own capability when scheduled"}
  # ---- IBU: installation, bootstrap and first-run UX v0.3 (T10, designer) --------------------------------------------
  IBU-01: {section: "1.1 Frozen bootstrap principles", kind: requirement, tracked_by: [F18], statement: "Thirteen frozen principles: bootstrap proposes and the operator authorizes; one proposal, one attributable atomic apply; static discovery only before trust (no project code executed); AEW owns only AEW-scoped integration state; generated configuration is non-secret and regenerable; doctor diagnoses and never mutates; supported means a qualified pin; air-gap completeness is an artifact property; upgrade and project migration are separate; Q12 stays open; harness launch and model access are separate contracts; organization qualification cannot bypass AEW conformance; corporate PKI stays supervisor-side"}
  IBU-02: {section: "2. Survey: patterns worth borrowing [doc], and what each would mean for AEW", kind: decision, tracked_by: [F18], statement: "Patterns adopted with their AEW translation: pinned isolated install, tiered doctor with remedies, propose-then-apply init, generated ignored configuration fragments with the user's global config untouched, evidence-reporting repository detection, first-class non-interactive mode, fail-closed capability probing, hashed offline bundle with a verifier, explicit migratable upgrade, project-supplied configuration never loaded into runs. Not borrowed: curl-pipe-shell installers, auto-update, writing into the user's harness directories, a GUI installer"}
  IBU-03: {section: "3. The proposed workflow", kind: requirement, tracked_by: [F18.1, F18.2], statement: "The workflow install → doctor → `aew init` (inspects repository, authority candidates, harnesses, credential variable names, existing `.aew/`; writes `.aew/local/init-proposal.yaml`) → operator review → `aew init --apply` (applies only accepted proposals) → project doctor → `aew opencode --acquire` → first Ticket; the operator decides harness pin, provider/model, authority classification, check commands and containment weakening; AEW derives evidence without executing code, proposes and never applies silently, and automates only local structure, the proposal file, non-secret fragments and deterministic probes; restart points are named"}
  IBU-04: {section: "3.1 Organization launch and provider-access integration", kind: decision, tracked_by: [F18.4], statement: "Deployments with an organization wrapper for harness launch, PKI and an internal OpenAI-compatible gateway are consumed through two narrow contracts, harness launch provider and provider access profile; AEW does not replace that machinery"}
  IBU-05: {section: "Harness launch provider", kind: requirement, tracked_by: [F18.4], statement: "The execution profile selects a qualified harness pin (adapter, version, qualification, launch_provider ∈ direct_binary | airgap_bundle | organization); an organization provider may resolve, install and start the approved binary with its own ceremony but decides no workflow state and satisfies no conformance by assertion; after launch AEW independently verifies the effective harness identity, schema fixture, capabilities, generated configuration, containment and readiness"}
  IBU-06: {section: "Harness qualification manifest", kind: requirement, tracked_by: [F18.4, E35], statement: "Qualification data (`aew/harness-qualification/v1`: artifact digest, protocol fixture, capability results, conformance results, qualifying authority) lives outside adapter source so an organization can adopt a new pin without an AEW release; AEW-shipped and organization-approved qualifications satisfy the same mandatory minimum conformance contract, may be stricter, and may not waive custody, authority or compatibility properties"}
  IBU-07: {section: "Provider access profile", kind: requirement, tracked_by: [F18.4, F28], statement: "Model access is a `provider_access` profile (id, protocol, transport, auth kind) holding no secret; the expected path is harness → secretless local endpoint → T6 shim → supervisor-owned provider relay → organization mTLS helper → internal gateway; the model-controlled harness never receives mTLS private keys, client credentials, bearer tokens or PKI secrets, and gets only placeholder material where an SDK syntactically requires a key"}
  IBU-08: {section: "Organization integration qualification gate", kind: gate, tracked_by: [F18.4], statement: "Before organization launcher/provider integration counts as supported, one bounded live qualification proves: an exact organization-qualified pin launches through the real wrapper; AEW independently verifies pin, schema and capabilities; a real model request completes through the internal gateway; one AEW-relevant tool-call round trip succeeds; the production path uses the supervisor-side relay; PKI and launcher secrets are absent from model-controlled state; run termination cleans up wrapper children per the process-ownership contract"}
  IBU-09: {section: "4. Configuration ownership model", kind: requirement, tracked_by: [F18.1, F18.4], statement: "The ownership table: per-run harness configuration inline under the run directory; the Lead session's configuration generated and isolated with a non-secret rendered copy carrying inputs_sha256; the operator's and the project's harness files untouched and not loaded into runs; AEW policy only through attributable apply; qualified skills per invocation; qualification manifests from AEW or the organization; organization launch and provider-access configuration owned by the organization with AEW storing ids and non-secret selections only; each visible to the operator through a named command or doctor row"}
  IBU-10: {section: "4. Configuration ownership model", kind: decision, tracked_by: [F18.1, F18.2], statement: "Rejected: patching user configuration, a global configuration, a generated include; the wrapper configuration (projection plus disabled project config or a private harness home) is the model. Conflict detection is a doctor row; supported sessions inherit no ambient plugins, instructions, MCP servers, skills or policy layers; a future `--allow-user-config` mode must be labelled customized and outside conformance and evaluation; only `.aew/local/integration` is regenerated, and input hashes exclude secret values"}
  IBU-11: {section: "Connected developer environment", kind: requirement, tracked_by: [F18.1, F18.2], statement: "Connected profile: `pipx` or `uv tool install aew==X`; doctor names missing pieces with the host's install command, finds the harness binary and checks it against TESTED_VERSIONS (newer is WARN, older or V1 is ERROR), and verifies the selected provider profile without exposing values; under `proxy_only` the relay consumes the real credential and the harness gets none; `--online` verifies gateway readiness separately; upgrade is `pipx upgrade`, doctor, then `aew migrate` if required"}
  IBU-12: {section: "Rocky 8 / air-gapped deployment", kind: requirement, tracked_by: [F18.3], statement: "The bundle `aew-bundle-<version>-rl8-py311.tar` holds the wheel and complete wheelhouse, only qualified harness pins, qualified capability assets and a canonical manifest recording every artifact's path, type, size, digest, platform and pins; install verifies the signed manifest before consuming anything and installs only listed wheels; the verifier rejects traversal, duplicates, unexpected types and mismatches; doctor proves no hidden fetch with the network unshared; tool upgrade and project migration are separate with a declared restore point; `aew doctor --bundle --json` is the host acceptance record"}
  IBU-13: {section: "5.1 Bundle signature and trust root", kind: requirement, tracked_by: [F18.3], statement: "The bundle signing key is release/distribution authority, not a Lead, provider or runtime credential; a detached signature over the canonical manifest is sufficient for v1 only if the trust root is provisioned independently of the bundle, the manifest commits to every consumed artifact, the verifier rejects traversal, duplicates and mismatches, and installation consumes only verified listed artifacts; the runtime never holds the signing key"}
  IBU-14: {section: "6. `aew doctor`: the rows", kind: requirement, tracked_by: [F18.2], statement: "Doctor rows with ERROR (launch refuses), WARN (degraded, labelled) and INFO tiers and a one-line remedy each, covering OS and kernel, Python, filesystem, git, harness qualification and launch provider, harness binary, protocol and supported pin, containment, provider access and gateway, build and test configuration, AEW schema version, generated integration configuration, offline completeness, permissions and account layout, and project harness files present but ignored"}
  IBU-15: {section: "6.1 Doctor execution semantics", kind: requirement, tracked_by: [F18.2], statement: "Default doctor runs every local, bounded, non-mutating check needed to predict launch safety, including the harness dry start and schema probe under isolated configuration and the narrowest network mode; external traffic only under `--online`; expensive checks may cache by inputs_sha256 but launch never trusts a cache in place of its own probe; any ERROR exits non-zero, WARN-only exits zero unless `--strict`, `--json` carries the same ids, severities and remedies, and doctor never auto-fixes or rewrites policy"}
  IBU-16: {section: "7. First-run failure and recovery UX", kind: requirement, tracked_by: [F18.1, F18.2], statement: "Every refusal names its doctor row and remedy; a failed `init --apply` applies nothing and leaves the proposal inspectable; a stale proposal is refused and regenerated, never partially rebased; a failed launch points at the doctor finding id and performs no repair; `aew doctor --todo` lists ERROR and WARN rows in fix order; there is no daemon to restart"}
  IBU-17: {section: "8. Ownership of the work", kind: decision, tracked_by: [F18], statement: "Ownership: the proposal mechanism and `init --apply` in the engine; doctor rows, remedies, `--bundle`, `--online`, `--todo` and the dry probe in `doctor.py`; harness discovery, version checks, generated fragments and per-run homes in the adapters; qualification manifests in the capability registry and conformance; organization launch and gateway access behind AEW's contracts; the wheelhouse, bundle manifest and signing in packaging and release work; host, account and session topology in F18 after Q12; a first-run checklist view in a later UI"}
  IBU-18: {section: "9. Non-goals", kind: decision, tracked_by: [F18], statement: "Non-goals: an installer platform (GUI, package hosting, self-update, marketplace); replacing organization distribution or PKI infrastructure; owning or persisting PKI private material; bootstrap mutation of user or project files outside AEW-owned state; persisted provider secrets in project or generated configuration; multi-project orchestration or a global state directory; guessing and applying a test command"}
  IBU-19: {section: "10. Frozen designer decisions", kind: decision, tracked_by: [F18], statement: "Thirteen frozen decisions: init always materializes a proposal and no blanket `--yes` accepts consequential choices; proposals carry proposal_id and inputs_sha256 with atomic apply refusing stale or expanded proposals; static before trust; Lead isolation with any customized mode explicit and outside conformance; the dry probe runs on normal project doctor; a separate release signing identity with a detached manifest signature; the sanitized exact-pin OpenCode catalog seed; support by qualified pin from AEW-shipped or organization-approved manifests; organization launch and provider seams as first-class contracts without workflow authority; the existing internal gateway plus mTLS helper as the intended provider path needing one tool-call custody qualification; Codex shipped only after T9 qualification; previous-environment rollback only before project migration; T5 and Q12 dependencies stay soft. No designer-level question blocks the bootstrap and doctor shape; F18 stays unscheduled until Q12"}
  IBU-20: {section: "Targeted follow-up evidence", kind: evaluation, tracked_by: [F18.4], statement: "No broad research thread; if the independent researcher is used, one bounded live task exercises a qualified pin through the real organization wrapper and provider path and records the endpoint family, tool-call round trip, effective model and profile, mTLS helper boundary and the absence of PKI material from the model-controlled process, as qualification evidence that does not reopen T10 unless it contradicts the contracts"}
  # ---- RIT: remote integration target sketch (T8) --------------------------------------------------------------------
  RIT-01: {section: "1. What changes and what does not", kind: requirement, tracked_by: [F23], statement: "Under a remote target the publication point is the provider's merge: DONE is observed, not declared at publish, and the merged commit may differ from the candidate; the candidate's base is the remote head that moves without AEW's CAS; reconcile must ask the provider or fetch the remote ref and tolerate an unreachable provider; prepare, post-integration verification on the candidate, the acceptance binding recheck and retirement ending write authority stay as ADR-0004 has them"}
  RIT-02: {section: "2. `integration.target`", kind: requirement, tracked_by: [F23], statement: "A project policy `integration.target: local | remote` (file not decided) with, for remote, the provider adapter name, remote, protected branch that AEW never pushes directly, `merge_method: observe` (the provider's merge settings are recorded, not chosen) and a poll interval; `local` is today's behaviour unchanged"}
  RIT-03: {section: "3. The saga with a remote target", kind: requirement, tracked_by: [F23], statement: "The remote saga: fetch and merge onto the remote head, push the candidate to `refs/aew/candidates/<T>-<n>`, record `proposing`, open a proposal through the adapter, wait in `observing` by polling status (a moved base makes the candidate stale as a moved ref does today), on `merged {M'}` fetch and verify that M' contains the candidate, record the integration commit and proposal, sync the authoritative worktree and complete with a record naming M'; reconcile checks provider and git, retires a closed proposal as discarded, and reports `INTEGRATION_TARGET_UNREACHABLE` while staying in observing"}
  RIT-04: {section: "4. The provider adapter interface (sketch)", kind: requirement, tracked_by: [F23], statement: "One narrow `IntegrationTarget` adapter per provider (push_candidate, open, status, close, fetch) that holds no AEW credential and keeps the operator's provider token out of AEW state and out of the Lead model's reach; status is polled, never streamed; nothing the adapter returns is evidence, and a merged state is confirmed by fetch and ancestry before DONE; it belongs in neither the harness adapter, the Lead broker nor the supervisor"}
  RIT-05: {section: "5. Questions for the designer (only two, both blocking for scope)", kind: open-question, tracked_by: [Q14], statement: "Is a remote (PR) integration target wanted before internal alpha? When the provider's merge commit differs from the candidate, does DONE require a second post-integration verification on M', or is verification on M plus containment enough?"}
  RIT-06: {section: "6. What M4-D should not foreclose", kind: requirement, tracked_by: [F10, F23], statement: "M4-D's records must allow a candidate open against a base that is not the local branch head (the lease held through proposing and observing, or released and re-acquired); `integration.status` stays an open string set so `proposed` and `observing` are additive; the Completion Record has room for an integration commit that differs from the candidate"}
  RIT-07: {section: "Not decided here", kind: open-question, tracked_by: [Q14], statement: "Undecided: the first provider (GitHub is the obvious one; Bitbucket is the contract's example), whether AEW ever merges through the provider's API with a sha precondition (restoring a CAS-like publication point and an immediate DONE), and how the proposal's CI checks relate to AEW's own post-integration verification as two evidence sets with different trust labels"}
  # ---- KSI: the knowledge service identity spike (D9) ----------------------------------------------------------------
  KSI-01: {section: "1. The boundary, as built", kind: requirement, tracked_by: [F21, E37], statement: "A fourth credential kind `service` with the same form, verifier, issuance and revocation fields as lead, invocation and handoff_offer; scope `{service, family, issued_by}` with no generation, because the credential grants no Lead authority a generation could supersede; `SERVICE_FAMILIES` is the only registry of principals"}
  KSI-02: {section: "1. The boundary, as built", kind: requirement, tracked_by: [F21, E37], statement: "The credential is issued, rotated and revoked only by the Lead (`aew service issue|revoke|show`, Lead transitions with `--expect-rev`); rotation revokes the previous credential in the same commit; the secret is printed once and never shown again; at most one live credential per service (oracle rule 30)"}
  KSI-03: {section: "1. The boundary, as built", kind: requirement, tracked_by: [F21], statement: "`Kernel.service_txn` beside `lead_txn`: `require_service` (kind, not revoked, bound to the family, no generation check), compare-and-swap, v2 required, the manifest pin check and finalizers, one commit, with `archival=False` so a service commit archives nothing, ends no credential and prunes nothing; `actor_txn` routes a knowledge command by credential kind and the result names the actor"}
  KSI-04: {section: "1. The boundary, as built", kind: invariant, tracked_by: [F21], statement: "Closure is enforced in the control store's commit path before validation and disk writes by comparing states: under a service actor only the family's hot keys and counters may change, every staged or pre-written record path must be under `knowledge/` or `history/`, the op must carry the family prefix, and an unknown family is refused; a violation is `TRANSACTION_CLOSURE` with control.yaml unchanged and no redo record, whatever layer asked"}
  KSI-05: {section: "1. The boundary, as built", kind: invariant, tracked_by: [F21], statement: "Custody as for the Lead: the broker refuses `service issue` as credential-emitting, `AEW_SERVICE_TOKEN` never reaches a worker's environment, the secret is written to no file, and because handoff and takeover revoke only lead and handoff_offer kinds the service credential survives rotation by construction and the new Lead may revoke it"}
  KSI-06: {section: "2. What it is not, and why it is not a second Lead", kind: invariant, tracked_by: [F21], statement: "The service principal cannot acquire, offer, accept, take over or release the seat, has no generation, is refused by require_lead and require_invocation, cannot mint or extend itself, cannot change work, invocations, tokens, lead or any counter but its own, writes nowhere but knowledge/ and history/, archives nothing, and is durable but not sovereign: the Lead issues, rotates and revokes it and every credential it ever had is recorded"}
  KSI-07: {section: "3. The seven properties, as tests (`tests/integration/test_service_identity.py`)", kind: evaluation, tracked_by: [F21], statement: "The designer's seven properties each hold as a test: a distinct principal through the existing verifier; a legitimate Case, disposition and receipt transaction; closure enforced by the store whatever layer asked; mutations of work, invocation, Lead, credential and token refused before commit; handoff and operator takeover leave the principal valid; the secret reaches no file, output or agent environment; and the smallest amendment is written out. Passed on Windows and on Rocky 8 with the takeover through a real pty"}
  KSI-08: {section: "4. The smallest amendment (for the designer; not written into the live documents)", kind: requirement, tracked_by: [E37], statement: "The amendment text to adopt: ADR-0005 gains a fourth credential kind `service` with the properties above, one closed transaction family per principal enforced at commit, and the Lead's custody rules; ADR-0009 gains one sentence that a harness run never receives a service credential and the broker refuses `service issue`; ADR-0013 D9 is reworded accordingly and states that a service transaction archives nothing; oracle rule 28 becomes an enforced property"}
  KSI-09: {section: "5. Decisions the spike made that the designer may reverse", kind: open-question, tracked_by: [E37], statement: "Reversible choices: the closure is a static table in the store, not data in the credential's scope; a service transaction never archives; `actor_txn` routes by credential kind; the knowledge block and its counters are the whole hot surface the service may touch; rotation is Lead re-issuance with no self-rotation and no expiry. Open: whether a service credential should expire (`expires_at` exists and is unused) so a forgotten principal dies on its own"}
  # ---- CXS: C/C++ semantic extraction (S1) --------------------------------------------------------------------------
  CXS-01: {section: "2. Results [probe]", kind: evaluation, tracked_by: [F22.2], statement: "The acceptance oracle for a C extractor is the build's own objects: `llvm-nm` for definitions and linkage, `llvm-objdump -d -r` for direct call edges, `clang -M` for includes, `clang -dM -E` for macros; libclang under the compile database reproduced 100% of definitions and linkage, 100% of includes and 99.4 to 99.5% of direct call edges on zlib and curl, with parse quality measurable per translation unit; execution coverage (`llvm-cov`) joins by symbol name as run-bound evidence"}
  CXS-02: {section: "3. The boundary, exactly [probe → inference]", kind: requirement, tracked_by: [F22.2], statement: "Every fact a semantic extension emits carries one of three tiers: compiler-known (declared symbols, definitions, linkage, includes, macros in effect, build defines, direct call sites with their callee, indirect sites with the pointer they go through, where function pointers are stored, coverage from a run), partial static inference (full caller sets, full callee sets with the memcpy and constant-folding exceptions, dead code), unsupported (who calls through a pointer, unbuilt configurations, units that did not parse); every discrepancy class is named: compiler-synthesized calls, builtin-inlined libc, constant-folded branches, asm-label renames, unused statics, indirect calls, dispatch tables, macro-mediated calls, configuration scope"}
  CXS-03: {section: "4. Facts about scale and shape that bear on S2–S4 [probe]", kind: requirement, tracked_by: [F22.2], statement: "Per-unit dumps are about 100× redundant, so the artifact must be a deduplicated symbol table by USR plus per-unit membership and facts; the same source file is several translation units with their own defines, so facts are per unit and a file-level answer names its configuration; header fan-out from `clang-scan-deps` (median 21 units, a handful reach every unit) is the input-sensitivity data for incremental freshness; the Python walk dominates cost at about 0.1 s per unit"}
  CXS-04: {section: "5. Recommendations for the design [rec]", kind: requirement, tracked_by: [F22.2], statement: "Use libclang or clangd's index as the extractor and write no parser; record three edge kinds (calls, calls_through, holds_pointer_to) and never a merged list that pretends completeness; label memcpy-class and builtin edges codegen-variable; every fact carries its unit and that unit's configuration identity; mark parse quality per unit and propagate it to every answer; coverage is an optional run-bound overlay joined by symbol name"}
  CXS-05: {section: "6. Not shown [hyp]", kind: open-question, tracked_by: [F22.2], statement: "Not measured here: C++ (answered by the C++ contract check), optimized builds (extraction unaffected, the objdump oracle is not), scale beyond 1,400 units (extrapolated in the large-repository benchmark), and whether `clang-scan-deps` sets equal libclang's include sets path by path"}
  # ---- CXP: the C++ contract check (S1b) ----------------------------------------------------------------------------
  CXP-01: {section: "2. The designer's nine items, each with what the probe showed and what the contract needs", kind: requirement, tracked_by: [F22.2], statement: "The identity, provenance, coverage, freshness, evidence and relation model holds for C++ templates and instantiations, overloads, namespaces, inline and ODR definitions, class methods and special members, virtual dispatch, member-function pointers, template-heavy headers and cross-TU identity, with two shared additions and no language-specific hack: `symbol.instances[]` (emitted mangled symbols realizing a template or inline definition, with their units) and the edge kinds `dependent` (resolved per instantiation) and `virtual` (interface known, implementation a vtable lookup), plus `overrides` as a compiler-known relation"}
  CXP-02: {section: "2. The designer's nine items, each with what the probe showed and what the contract needs", kind: requirement, tracked_by: [F22.2], statement: "Toolchain identity is mandatory in the extractor identity, derived from the compiler (gcc toolchain or sysroot, resource directory digest): a mismatch between libclang's driver and the build's compiler produced 50% include disagreement until aligned, after which includes agree at 99.2% with the residual named"}
  CXP-03: {section: "3. What libclang's cursor API cannot give for C++ [probe → inference]", kind: requirement, tracked_by: [F22.2], statement: "libclang's cursor API does not expose implicit template instantiations, implicitly-defined members or compiler-generated symbols, so the C++ edge extractor reads a codegen-adjacent source (LLVM IR at -O0 or the object's relocations) and demangles instances back to the template's identity, while the AST walk keeps declarations, scopes, source ranges, overrides, virtual and dependent call sites and evidence locators: two extractor identities, one artifact, inside the contract. Known probe limitation: friend functions defined inside a class body were not surfaced"}
  CXP-04: {section: "4. Decision for the consolidation [rec]", kind: requirement, tracked_by: [F22.2], statement: "Freeze the semantic-extension contract with exactly these language-neutral additions: `symbol.instances[] {mangled, units[]}`, `reference.kind += dependent | virtual | overrides`, mandatory `extractor.toolchain {tool, version, gcc_toolchain|sysroot, resource_dir_sha256}`, and `fact.source += codegen` beside ast for facts with no source range; the C++ production extractor is an implementation item with this oracle, not a research question"}
  # ---- SEF: the semantic-extension contract, query surface, incremental freshness and the architecture-map bridge (S2–S5)
  SEF-01: {section: "1. Capability", kind: requirement, tracked_by: [F22.2], statement: "An extension declares the fact kinds it emits, each with a tier (compiler_known | static_inference | unsupported), from a closed shared vocabulary: symbol, containment, reference (calls, calls_through, holds_pointer_to, imports, includes, uses_type, expands_macro), configuration, quality and the optional coverage overlay; which kinds a language fills and at which tier is data, so a pack or query can say no call facts exist for a language instead of returning an empty list that reads as no callers"}
  SEF-02: {section: "2. Source and build inputs", kind: requirement, tracked_by: [F22.2], statement: "Every extension names its input set per unit (source, transitively read files, configuration, generated inputs, toolchain identity) because freshness is computed from it; the unit is the translation unit, not the file; facts are keyed by (unit_id, symbol_id) where unit_id hashes the input set's identity, and a file is a view over its units"}
  SEF-03: {section: "3. Extractor identity", kind: requirement, tracked_by: [F22.2], statement: "Every artifact carries `extractor: {name, version, toolchain {tool, version, resource_dir_hash}, options}`; facts from two extractor identities are never merged into one record, a new identity produces a new artifact version, and the old one stays readable"}
  SEF-04: {section: "4. Freshness", kind: requirement, tracked_by: [F22.2], statement: "Freshness is per unit from the unit's input set, with CURRENT, STALE and UNKNOWN as `engine/freshness.py` has them plus PARTIAL for a unit whose last extraction had errors; the artifact's freshness is the worst of its units plus the count of stale units, never a single flag; only the input-set computation is language-specific"}
  SEF-05: {section: "5. Coverage", kind: requirement, tracked_by: [F22.2], statement: "Two coverages kept apart: extraction coverage (of the units the build names, how many were extracted at what quality, so every answer can be qualified) and execution coverage (which symbols a recorded run executed), an optional overlay bound to a run that joins by symbol identity and is never a property of the static map"}
  SEF-06: {section: "6. Artifact identity", kind: requirement, tracked_by: [F22.2], statement: "The artifact is an immutable, content-addressed derived record pinned by a manifest entry with source_revision, extractor identity, the configuration identities it covers and its input-set digest, one per (revision, extractor, configuration set), rebuilt incrementally and published atomically; deduplication by stable symbol identity (USR for C/C++, module-qualified name for Python) is the artifact, not an optimization. Whether it is an ADR-0013 `reference` knowledge record or a derived artifact outside admission is left to project maps v0.3 §7.4, which makes it a derived artefact"}
  SEF-07: {section: "7. Queries", kind: requirement, tracked_by: [F22.2], statement: "Extensions add facts, never queries; the shared query surface answers over the shared fact kinds, and a fact kind an extension cannot fill makes the answer say so for that language"}
  SEF-08: {section: "8. Limitations", kind: requirement, tracked_by: [F22.2], statement: "A limitations block in the artifact, echoed in answers, generated from the capability matrix and the quality facts rather than hand-written"}
  SEF-09: {section: "What must stay language-specific, named", kind: decision, tracked_by: [F22.2], statement: "Language-specific by design: the extractor, the unit definition, the input-set computation, the symbol identity scheme, which reference kinds exist, and the tier exceptions; everything else is shared, and the C run needed no shared field Python would break"}
  SEF-10: {section: "`map.semantic.*` shape (candidate, not decided)", kind: requirement, tracked_by: [F22.2], statement: "A candidate `aew/semantic-map/v1` shape: source_revision, extractor, configurations, units with quality, deduplicated symbols with definition and declaration locators, references with kind, tier and sites, the capability matrix, generated limitations and optional coverage overlays; a few MB for curl's library and never a pack item"}
  SEF-11: {section: "S3. The agent-facing code-intelligence surface", kind: requirement, tracked_by: [F22.2], statement: "A typed surface of map.symbol, map.callers, map.callees, map.includers, map.configuration, map.evidence, map.neighborhood (radius 1 free; radius 2 only under an explicit budget, measured at 6,700 to 10,800 tokens against 55 to 450 for single-hop answers) and map.search (a candidate generator, never an answer), with five rules: every answer carries its boundary generated from fact tiers; evidence is a locator resolvable at L3; disclosure follows L0 to L3; the semantic map is not in packs by default beyond L0 and the Ticket's declared subject symbols; configuration is a parameter, never a surprise"}
  SEF-12: {section: "S4. Incremental freshness and rebuild", kind: requirement, tracked_by: [F22.2], statement: "Freshness and rebuild are per unit from the unit's input set, with a known invalidation scope per change (source, header fan-out, compile command, define, generated header, toolchain, the last producing a new artifact version); the header-to-units dependency index is persisted first; units are re-extracted incrementally but the artifact is published atomically per revision; a query answer carries the staleness of the units it touched and a stale semantic fact is navigation to be re-verified at L3"}
  SEF-13: {section: "S5. Architecture-map augmentation from semantic evidence", kind: requirement, tracked_by: [F22.2, F30], statement: "The bridge deterministic map → semantic extension → investigator synthesis: the investigator receives L1 and L2 answers (module boundaries, public surfaces, dispatch-table implementers, cross-directory call density, configuration variants, platform headers), never the graph; every architecture-map statement binds to a map answer or source range or is labelled inference; the architecture map stays a discovery record whose observed inputs include the semantic artifact's revision; the F19 K-arm compares an investigator with map queries against one with grep"}
  SEF-14: {section: "Decisions for the designer [Q]", kind: open-question, tracked_by: [F22.2], statement: "For the contract freeze: confirm the three-tier vocabulary and the seven reference kinds (Python declares imports only); unit identity as (source, compile-command hash, toolchain) with a file as a view; the v1 extractor language (Python bindings suffice to tens of thousands of units with parallelism); whether `map.neighborhood` radius 2 exists on the agent surface or only radius 1 plus explicit steps (the designer settled radius 1 by default, radius 2 budgeted, in the project-understanding note §10); whether semantic facts may enter packs beyond L0 and the declared subject symbols"}
  # ---- QRC: query routing and retrieval classification (S6) ---------------------------------------------------------
  QRC-01: {section: "1. A small taxonomy: six task classes, by binding and answer shape", kind: requirement, tracked_by: [F21, F22.2], statement: "Classify an information need by what it binds to and what answer shape it needs, not by topic: six classes (exact lookup, relation fact, local explanation, neighbourhood trace, discovery/unanchored, judgement), each with its cheapest sufficient path; the classes compose by escalation, and the class is observable before any model call"}
  QRC-02: {section: "2. The staged routing model", kind: requirement, tracked_by: [F21], statement: "Five stages (bind, exact, local, expand, discover, then judge), each with a budget and a coverage check; every stage ends in exactly one of SATISFIED, EXHAUSTED_BUDGET or NOT_FOUND, plus NOT_SUPPORTED when the substrate emits no such facts for that language, and the state is part of the answer; escalation triggers are measured gaps (unresolved anchor, empty result on a covered relation, substrate disagreement, unconnected radius-1 subgraph, flat discovery scores), never estimates of difficulty"}
  QRC-03: {section: "3. Signals each decision can observe cheaply", kind: requirement, tracked_by: [F21], statement: "The routing inputs are cheap, deterministic signals from the request binding and the indexes: anchors total and resolved, relation named, shape requested, substrate coverage, result size and fan-in/out, freshness of touched units, substrate agreement, candidate separation, request mode and remaining budget; question difficulty, user intent and the model's future needs are not routing inputs"}
  QRC-04: {section: "4. Should classification be deterministic, model-assisted or staged?", kind: invariant, tracked_by: [F21], statement: "Staged, with the model confined to three roles: never the first decision, choosing an expansion when the deterministic rule stalls (logged as a routing decision, never adding an edge), and synthesis grounded only in retrieved facts; the router selects which deterministic queries run and never produces a fact; similarity yields candidates only, omission is visible with its reason, provenance survives every route, and the router cannot widen permissions or visibility"}
  QRC-05: {section: "5. Failure and fallback", kind: requirement, tracked_by: [F21], statement: "Defined behaviour per weakness: an unresolved anchor returns NOT_FOUND with candidates named as candidates; an empty covered relation returns SATISFIED with the coverage statement; an uncovered relation returns NOT_SUPPORTED with no model guess; budget exhaustion returns the connected part, the frontier and one next expansion; substrate disagreement returns both facts with tiers; flat discovery falls back to the structural map; stale units label the answer; a synthesis citing a fact outside its grounding set fails the citation check and the facts are returned without it"}
  QRC-06: {section: "6. Evaluation plan", kind: evaluation, tracked_by: [F19, F21], statement: "Per-substrate query sets with deterministic ground truth generated from the artifacts (exact and relation questions, local explanations, traces with known paths, discovery with known anchors), negative controls for nonexistent symbols, uncovered relations and stale units, cost accounting that penalizes unnecessary spend, and ablations against deterministic-only, always-RAG and always-agent baselines; two arms belong to F19 and share its harness"}
  QRC-07: {section: "7. Implications for AEW's T5/S2–S3 design", kind: requirement, tracked_by: [F22.2, F21], statement: "The typed map surface is the router's exact stage (an agent calling a relation operation has classified its own question); radius is the budget dial with the measured cliff between 1 and 2; coverage statements make empty answers meaningful and belong in the contract; discovery about a codebase starts from the structural map, then lexical search, with vector search optional and candidates-only; one router over all substrates takes the recall design's request binding as input; pack preparation runs the exact and local stages only within the budget order and never traces or judges"}
  QRC-08: {section: "8. What is reusable, and what is not", kind: decision, tracked_by: [F21], statement: "Reusable as a pattern: the binding-by-shape taxonomy, staged routing with measured-gap escalation, the terminal states, the router-selects-queries rule and cost-aware evaluation; not transferable without re-measurement: budgets and cliffs, anchor grammars and the stored-relation vocabulary; a learned classifier earns a place in front of the exact stage only if evaluation shows deterministic signals misroute at a cost above its latency"}
  # ---- LRB: large-repository benchmark (S7) --------------------------------------------------------------------------
  LRB-01: {section: "1. Structural map [probe]", kind: requirement, tracked_by: [F22.1], statement: "The structural map needs no sharding or derived index at 100,000 files (2.1 s, 162 KB; `ls-tree` 0.3 s; a change-proportional diff of 18 ms); the record grows with directory count, so the directories section is capped at two levels plus a per-top-level summary to stay in tens of KB at any size; tree-bound freshness is one `git diff --name-status` between commits"}
  LRB-02: {section: "2. C semantic map [extrapolation from S1's constants; marked hyp where it is more than arithmetic]", kind: requirement, tracked_by: [F22.2], statement: "From the measured per-unit constants, a first C extraction is minutes at 1,400 units, about two hours single-core at 50,000 and about a day at 500,000, with incremental rebuilds after a median header edit at seconds to an hour; therefore sharding is a packaging choice that falls out of unit identity, incremental caches with per-unit input sets are required from the first version, and a dedicated derived rebuildable index (symbols, edges, membership, fan-out in SQLite, on the ADR-0011 `history.sqlite` pattern) answers queries as lookups, never as file scans"}
  LRB-03: {section: "3. Where behaviour changes, not just cost [inf]", kind: requirement, tracked_by: [F22.2], statement: "At scale behaviour changes: per-unit dumps stop being storable so deduplication is mandatory from the first version; a whole-repository first extraction becomes a scheduled job with a receipt (the outbox and capture-job shape) while `aew map generate` stays synchronous for the structural map only; query answers stay small because they are per symbol, only budgeted neighbourhoods grow; freshness becomes the common state, so artifact status is a count of stale units and answers carry the staleness of the units they touched"}
  LRB-04: {section: "4. Not shown [hyp]", kind: open-question, tracked_by: [F22.2], statement: "Not measured: a real 50,000-file repository with includes and a build, memory for assembling hundreds of thousands of units (a streaming build into the derived index), and Windows timings for the Git primitives at 100,000 files (expect a constant factor from slower process spawns)"}
  # ---- PUI: project understanding, the Project Profile and requirement impact analysis (S8) ---------------------------
  PUI-01: {section: "0. The probe, because the rest leans on it [probe]", kind: evaluation, tracked_by: [F30], statement: "Baseline from three real changes scored from Git objects: a seed-and-radius-1 surface is complete for localized requirements (recall 1.00) and about half complete for cross-cutting ones (0.54), at 10 to 20% precision; constraints (oracle rules, schema keys, ADR mentions, error codes) surface without a model as locators into authority; created files cannot be predicted by any location-based method and are reported separately; the deterministic pass costs about two seconds per requirement on AEW"}
  PUI-02: {section: "1. Recommended architecture (deliverable 1, question 15)", kind: requirement, tracked_by: [F30], statement: "The layered chain: authoritative sources → structural map → semantic extensions → Project Profile (KC §8 maps plus WC §16.15 guardrails as evidence-bound records with per-claim freshness) → a deterministic impact surface at Story or Epic creation and on demand → plan assurance's first pass → investigator when a load-bearing premise lacks evidence → planning → Tickets inheriting the Story's surface; nothing above the sources is authority, one record family and one freshness mechanism (ADR-0008 records for claims, ADR-0013-style derived records for maps, the surface a projection recorded only when the Lead binds it), and impact analysis has no record kind of its own beyond plan assurance's slots"}
  PUI-03: {section: "2. Part A — what an agent needs, and from which layer (questions 6, 13)", kind: requirement, tracked_by: [F30, F22.2], statement: "Each capability is assigned a layer, a storage mode and a confidence: structural map and build/test facts stored and deterministic; translation units and configurations stored per unit; symbol, call, include and configuration lookups on demand through the typed surface at a few hundred tokens; component membership, flows, boundaries and ownership as Profile records mixing deterministic candidates with labelled synthesis; the query surface is the map surface plus `profile.component` and `profile.owner`. Not attempted: stored whole-repository model summaries, uncited ownership, call graphs for languages without a compiler-grade extractor, unmetricated importance scores"}
  PUI-04: {section: "What it is [rec]", kind: decision, tracked_by: [F30], statement: "The Project Profile is a small set of structured records (KC §8.1 to §8.5 realized in the ADR-0008 record shape, stored as immutable manifest-pinned derived records with dispositions when challenged), with human projections rendered from them; a GSD-style set of prose documents is rejected as the representation (one freshness per file, no per-claim evidence, invites editing as authority) and allowed only as a rendering"}
  PUI-05: {section: "Fields that earn their place, with their source class", kind: requirement, tracked_by: [F30], statement: "Profile records and their source classes: overview (pointers deterministic, one synthesized paragraph bound to evidence), stack, build_test and boundaries (deterministic from the maps and files read), components[] and flows[] (directories, surfaces and edge counts deterministic; names, boundaries and flows synthesized by an investigator with evidence per claim), ownership[] (deterministic writer sets plus an authority reference), contracts (pointers only to the spec pins, amendment index, invariant index and requirements ledger), guardrails (declared by project policy, pointed at and checked, never derived), navigation (deterministic candidates plus a few evidenced hints); freshness scope is the files or units each claim read"}
  PUI-06: {section: "Rejected fields, and why [rec]", kind: decision, tracked_by: [F30], statement: "Rejected as Profile sections: stable project constraints as prose (constraints live in authority or are requirement-relative), a global concerns record (a concern is relative to a goal and computed), roadmap, current state and handoff (control state and decisions already durable elsewhere), importance rankings without a metric, and anything a model wrote about code it did not cite; the glossary stays a discovery record pending the K-arm evaluation"}
  PUI-07: {section: "Representation (question 4) [rec]", kind: requirement, tracked_by: [F30], statement: "One `aew/profile/v1` record per section so sections version and age independently: schema, id, version, section, source_revision, extractor or author, claims[] each with statement, evidence[] (file, symbol, edge, record or contract locators with digests), source_class and observed_paths, and freshness; deterministic sections regenerated by map-generation jobs, synthesized sections as investigator discovery records accepted by the Lead and pointed at by the Profile; one human projection renders them all"}
  PUI-08: {section: "Provenance and freshness at claim level (question 5) [rec]", kind: requirement, tracked_by: [F30], statement: "Freshness and provenance per claim: each claim carries observed_paths and unit ids and is CURRENT or STALE by the existing record-freshness computation, a section reports counts never one flag; source class per claim reuses the knowledge vocabulary (ENGINE_OBSERVED, ROLE_ATTESTED, EXTERNAL_UNTRUSTED) and packs render it; invalidation is per claim and cheap, deterministic sections regenerate in seconds while synthesized claims stay STALE until re-verified or accepted with a disposition; a claim's evidence is fixed at authoring and still true is a new version or a disposition, never an edit"}
  PUI-09: {section: "The contract [rec]", kind: requirement, tracked_by: [F30, F14], statement: "Impact analysis produces two outputs into existing slots: (a) the deterministic impact surface, a projection computed at Story creation and on demand (`aew impact <work-id>`) from the requirement text, declared subject refs and the maps, with seeds and how they resolved, affected units at radius 1 with reason, evidence and tier, tests, constraint locators into authority, configurations, ownership candidates, a coverage statement of how it was computed, and the not-found list, recorded as a decision input only when the Lead binds it; (b) the judgement part written into plan assurance v0.4's first-pass artefact and premise list, every line citing surface entries"}
  PUI-10: {section: "Epic versus Story (question 1) [rec]", kind: requirement, tracked_by: [F30], statement: "An Epic's surface is computed at component granularity (Profile components, directory roles, configurations) and its judgement output is the likely Story subjects and cross-component constraints, with no file-level surface; a Story's surface is at file, symbol and unit granularity and is where the premise list is written; the two differ in granularity and in what they feed, not in mechanism"}
  PUI-11: {section: "Tickets (question 2) [rec]", kind: requirement, tracked_by: [F30], statement: "Tickets inherit the Story's surface and premises; a Ticket's own pass is a narrowing (declared scope ∩ Story surface) plus a staleness check, computed not re-analysed; a fresh analysis runs only when the Ticket's scope leaves the Story surface (itself a plan-lint finding, SCOPE_OUTSIDE_STORY_SURFACE) or when the Story's surface is stale beyond a threshold"}
  PUI-12: {section: "Deterministic versus judgement (questions 3, 4, 9) [probe-grounded]", kind: decision, tracked_by: [F30], statement: "Deterministic: seeds, affected units at radius 1, tests, constraints as locators, configurations, writer sets, coverage and not-found. Judgement: trimming the surface, semantic couplings with no edge, risk statements, which premises are load-bearing, what the probe should be, and what will be created; the line sits exactly where the probe's recall stopped"}
  PUI-13: {section: "When an investigator is launched before planning (questions 5, 10) [rec]", kind: requirement, tracked_by: [F30, F14], statement: "Deterministic investigator triggers: a load-bearing premise with absent or stale evidence; a seed that resolved to nothing while the requirement names a thing; a surface spanning a language or component without call facts; an ownership question with several writers and no authority reference; an Epic-to-Story split touching more than one component's contract; otherwise the Lead plans, and the discovery record becomes evidence for the premise and, if general, a Profile claim. (Advisory during the evaluation phase by the designer's decision in §10)"}
  PUI-14: {section: "Staleness and amendment (questions 7, 8, 12) [rec]", kind: requirement, tracked_by: [F30], statement: "The surface is stale when its observed paths changed, the requirement revision changed, or the maps were regenerated under a different extractor identity; recompute is seconds and the judgement lines are re-read and re-affirmed or revised in a recorded step; an unexpected implementation finding triggers a recorded premise outcome (EXECUTION_PREMISE_CONTRADICTION), an amendment of the Story's premises or a Ticket revision, and the delta between surface versions is what the Lead reads"}
  PUI-15: {section: "Promotion to the Profile (question 9) [rec]", kind: requirement, tracked_by: [F30, F21], statement: "A local finding becomes a Profile claim only through the existing path (an investigator's discovery record or an implementer's attested finding as a K1 Case, Lead acceptance, a new record version with the finding's evidence); repetition is detectable but generality with evidence is the criterion, and a finding true only for the Story stays with the Story"}
  PUI-16: {section: "Challenging the brief's equation [inf]", kind: decision, tracked_by: [F30], statement: "Impact analysis is requirement × maps, qualified by the Profile: the surface comes from symbols, edges, tests and constraint locators, and the Profile contributes component membership, ownership records and guardrails; design the surface against the maps first"}
  PUI-17: {section: "5. Part D — context delivery (question 13; deliverable 6)", kind: requirement, tracked_by: [F30, E29], statement: "Per consumer, what arrives in the pack automatically (a Lead gets the Story's surface summary, touched components and the premise template; an investigator the structural map, Profile L0 and the premise to discriminate; an implementer its Ticket's narrowed surface with constraints and tests; a reviewer the diff mapped onto the surface with outside-the-surface as a finding; a verifier the intended change, preservation obligations and the tests and gates named), what comes through deferred typed tools under budget, and what never arrives (the graph, other components' flows, the Lead's preferred answer); a pack section built from the surface stays at a few hundred tokens per subject symbol"}
  PUI-18: {section: "6. Part E — evaluation (question 14; deliverable 7)", kind: evaluation, tracked_by: [F30, F19], statement: "Codebase understanding is measured by the extraction oracle per extractor identity, directory-role classification against hand labels, architectural claim support and inter-rater agreement, the K-arm retrieval comparison and refresh cost; impact analysis by affected-area recall and false-positive expansion at seeds, radius 1 and radius 2 on 20 to 30 real changes with created files reported separately, missed constraints, supported versus hallucinated risk statements, investigations correctly requested and correctly not requested, planning quality and rework in a two-arm dogfood, and token cost; the primary metric is how often a Lead or implementer confidently pursued an incomplete or incorrect surface with the analysis present versus absent"}
  PUI-19: {section: "7. Tool and data surface for the impact analyser (question 8; deliverable 4)", kind: requirement, tracked_by: [F30, F22.3], statement: "Inputs: the requirement and its refs, parent obligations, the structural map, the semantic artefacts, the test index, the constraint locators (oracle rules, invariant index, schema keys, guardrails, ADR index, amendment index, requirements ledger), Profile records with freshness and the history index; tools: the map surface, `profile.*`, history links and show, knowledge search, and `aew impact` with `--radius`, `--configuration` and `--explain <entry>`"}
  PUI-20: {section: "8. Implications for T5 v0.4 (deliverable 8)", kind: requirement, tracked_by: [F22.1, F22.2, F22.3], statement: "As corrected by the designer: the base structural record changes only in reading the commit's tree and in its freshness rule (project maps v0.3 decision 4 binds freshness to the whole tree, which supersedes this note's listing-plus-config suggestion) and stays generatable from Git objects with no semantic dependency; the semantic-extension contract carries the tiers, unit identity, per-unit freshness, holds_pointer_to and the C++ additions; the test index, public-surface counts per directory and the constraint locator index are sibling derived indexes composed when their inputs exist and declared in the surface's coverage, never fields of the structural record; the Profile record family, `aew impact`, plan-assurance slot filling, investigator triggers, the Ticket narrowing rule and the evaluation corpus belong to a later Profile/Impact design"}
  PUI-21: {section: "9. Contradictions with the hypothesis (deliverable 9)", kind: decision, tracked_by: [F30], statement: "Rejected from the brief's hypothesis: a Profile layer distinct from KC §8 and WC §16.15; impact analysis as its own artefact; the equation profile × requirement; full-profile invalidation; separate generated documents as representation; stable constraints and concerns as Profile sections. Confirmed: the three-layer base, the flow into investigation and planning, on-demand queries over graph dumps, partial beats convincing, and the primary metric"}
  PUI-22: {section: "10. Designer decisions (2026-10-05), closing the questions this note left open", kind: decision, tracked_by: [F30], statement: "The designer's decisions: `aew impact` is one deterministic operation with two consumers (an inspectable Lead command and Plan Assurance at Story creation); radius 1 by default and radius 2 only when explicitly requested and budgeted; Epics run on structural directory roles with declared reduced coverage before components[] exist; impact-derived investigator triggers are advisory during the evaluation phase while Plan Assurance's hard requirements stay hard; a 20 to 30 case stratified real-change corpus decides the first promotion. Program state: D9 to ADR amendments then a later capture service; T5 plus the semantic research consolidate into T5 v0.4 and the contract; project understanding uses existing KC machinery, the impact surface feeds existing Plan Assurance, and evaluation precedes mandate"}
  # ---- DCQ: the designer's decisions of 2026-10-01 on containment and the integration queue (copied from the research)
  DCQ-01: {section: "1. Containment and process ownership (Q3, F2, E13; research §8)", kind: decision, tracked_by: [F2, E13, Q3], statement: "Strong OS/runtime filesystem containment is required before any personal real-repository dogfood as well as internal alpha; the unprivileged bubblewrap boundary suffices for personal dogfood once the named Rocky 8 probes pass, internal alpha also needs isolation performance and operability acceptance; POSIX process ownership closes through the same PID-namespace boundary with no separate subreaper, and process-group mode is never represented as complete ownership until the PID-namespace test passes", status: "done: built in M4-B (2026-10-03), ADR-0009 amendment"}
  DCQ-02: {section: "1. Containment and process ownership (Q3, F2, E13; research §8)", kind: decision, tracked_by: [Q7, F19, F2], statement: "Real-project provenance does not by itself trigger F2: a sanitized or disposable SPT-derived fixture is scratch only when the run's host-level reach has no writable non-disposable project state or secrets, a disposable clone on the normal development host is not scratch, and F19 follows the same rule; F2 moved to early M4 with its probes run immediately and F2 and E13 implemented together"}
  DCQ-03: {section: "2. The integration queue (F10, D4; research §7)", kind: decision, tracked_by: [F10, D4], statement: "M4 uses parallel Ticket execution with a single serial integration lease; runnable COMMIT_READY entries are FIFO by default with dependency legality owned by the work graph and explicit Lead reorder or defer; no batching and no shared post-integration evidence in M4; D4 is a policy-selectable deterministic integration-validation path with existing verifier policy as the default; a merge conflict releases the lease and returns to the Lead, never resolved automatically or sent to an Implementer; no head-of-line blocking; every integration attempt recomputes the dispatch predicate and binds to the current head"}
  DCQ-04: {section: "2.1 Follow-up dispositions (designer, 2026-10-01; research §7.1)", kind: decision, tracked_by: [F10], statement: "The lease is owned durably by the queue entry (not the replaceable candidate or attempt) with a live invocation as custodian, a dead custodian is reconciled before transfer or release and no timeout alone releases it; one automatic rebuild and revalidation on a moved head is allowed while holding the lease after proving no publication, a second movement, conflict, failed validation or changed legality returns to the Lead; DEFERRED and AWAITING_DISPOSITION are queue states that never grant eligibility; conflict resolution is a new attempt whose effective gates rerun while a plain head move does not invalidate unchanged Ticket-scope evidence; batching is out of scope for M4, not forbidden"}

