  # ---- OBX: ADR-0012, the transaction outbox -------------------------------------------------------------------
  OBX-01: {section: "Decision", kind: decision, tracked_by: [E18], statement: "The outbox is the transition log: no second store and no second record of a commit; the log becomes a derived, complete, bounded, consumable copy of what the commit point records"}
  OBX-02: {section: "D1. Completeness is a stated guarantee", kind: invariant, tracked_by: [E18], statement: "For every revision r <= revision exactly one logical transition record exists, unsealed (state/log/<r>.yaml, optional immutable overflow sidecar) or in a sealed segment; transient coexistence must be byte/hash-equivalent, and any disagreement is corruption that fails audit and reading closed"}
  OBX-03: {section: "D1. Completeness is a stated guarantee", kind: invariant, tracked_by: [E18], statement: "control.yaml stays the single workflow authority and last_transition the authoritative description of the newest transition; the log is complete and consumable but never workflow authority; recovery's repair of a missing log record becomes a consumer guarantee and extends to staged overflow payloads"}
  OBX-04: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "last_transition gains bounded events plus an optional event_overflow descriptor, derived by ControlStore._commit from the committed before/after states plus operation-declared facts, in the store and not a finalizer, so direct Session.commit sites are covered"}
  OBX-05: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "Derived kinds by comparing hot collections only: lead.generation, work.state, invocation.status, run.added, credential.revoked, history.appended, unit.archived, and queue.entry/queue.lease (M4-D), with the fields of the table"}
  OBX-06: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "Operation-declared kinds (decision.recorded, handoff.recorded, evidence.ingested, audit.recorded) are appended through TxnContext.events by the authoritative Engine operation only; callers and consumers never invent events; op, actor, summary, reason and refs stay"}
  OBX-07: {section: "Bounded hot representation", kind: invariant, tracked_by: [E18], statement: "last_transition.events holds at most 64 events; above 64 it holds the first 64 and event_overflow {path, sha256, event_count, counts_by_kind}; consumers are never told to reconstruct truncated events by diffing historical control states"}
  OBX-08: {section: "Complete overflow payload", kind: requirement, tracked_by: [E18], statement: "An overflow transition's complete event list is written as immutable state/log/<rev>.events.yaml, prepared as a normal staged transaction write and named/digested by the committed descriptor; redo publishes or verifies the identical payload; a mismatch fails closed; nothing regenerates the set after commit"}
  OBX-09: {section: "Schema and hash coverage", kind: requirement, tracked_by: [E18], statement: "transition.schema.json (aew/transition/v1) validates the bounded record and descriptor, closed at every level, referenced by control.schema.json; every log record carries its schema; the overflow payload has its own closed JSON-only schema; the transition hash commits to the overflow digest and count"}
  OBX-10: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "One reader surface: aew history log --since R [--follow] [--kind ...] [--json] yields logical transitions R+1..revision in order, resolving and verifying overflow payloads so the consumer sees the complete event set; the cursor is the revision number whatever the physical representation"}
  OBX-11: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "Readers take no control lock and are race-safe against lockless sealing: try unsealed, refresh the sealed view, require equivalence when both exist, and after a bounded retry report corruption/incomplete history rather than a false gap"}
  OBX-12: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "A reader finds the current revision through the authority-file identity/cached parse; a long-lived waiter does not repeatedly parse control.yaml (H3); --follow blocks on the wake signal; a consumer behind the window walks sealed segments transparently"}
  OBX-13: {section: "D4. One wake signal, advisory", kind: decision, tracked_by: [E18, E1], statement: "local/wake is bumped by the store after each commit's log write (after txn.after_log) and by the supervisor after each run.json write; waiters stat it every 20 to 50 ms with a coarse full check every 2 s; waking is advisory (a missed wake costs latency, never correctness); OS notification may replace the stat behind the same interface; the M4 plan's 'wake file or pipe' is decided as the file"}
  OBX-14: {section: "D5. Observed run facts stay outside the outbox", kind: decision, tracked_by: [E18, E1, Q12], statement: "run.json and events.jsonl are observations, not committed facts, and never enter the outbox; harness wait --any combines both lanes on each wake; F15 section 16 revocation on run end lands as a commit; whether a supervisor may commit is an ADR-0005/ADR-0009 authority decision not made here"}
  OBX-15: {section: "D6. Bounding: a 4,096-revision unsealed window, sealed segments, no discard", kind: requirement, tracked_by: [E18], statement: "Transition history is never discarded; LOG_WINDOW is 4,096 revisions; older records are sealed 256 at a time into state/log/seg-NNNNNN.yaml carrying overflow payloads, written create-if-absent, fsynced, re-read, schema-validated and hash-verified (overflow digest/count recomputed) before any unsealed file is removed; pruning is idempotent and never leaves neither representation"}
  OBX-16: {section: "D6. Bounding: a 4,096-revision unsealed window, sealed segments, no discard", kind: requirement, tracked_by: [E18], statement: "Compaction is off the commit path: aew history compact is the v1 mechanism, doctor reports an unsealed window above LOG_WINDOW + 256, a future background service may call the same primitive, and no finalizer seals synchronously; the control lock may serialize pruning but is not what makes readers safe"}
  OBX-17: {section: "D7. The records are hash-chained", kind: requirement, tracked_by: [E18], statement: "Each transition record carries h = SHA-256(bytes.fromhex(prev_h) || canonical_json(record without h)) with ADR-0011's genesis convention; last_transition.h is the committed head; overflow records hash the descriptor; one hash per commit; a repaired record hashes identically; segments preserve and verify the chain; the chain is tamper evidence, not authority"}
  OBX-18: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E1, E18], statement: "E1 wait-any (M4-D): aew harness wait --any blocks on local/wake, checks both lanes and returns the first run to end with its next action; the 0.2 s poll goes, the coarse fallback stays"}
  OBX-19: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18], statement: "Supervisor and Lead broker watchdogs may keep their identity stat and react to lead.generation and credential.revoked events instead of re-parsing on every change"}
  OBX-20: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F20], statement: "Dashboard: the backend keeps a cursor and serves GET /api/v1/events?since=R as a bounded long poll (SSE later over the same service); notifications name changed kinds/ids and the frontend refetches projections with ETags; a contract addition that renews the C0 review; no poll takes the control lock"}
  OBX-21: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F21], statement: "Knowledge capture: a durable knowledge-domain cursor (never local/), job identity (project_id, revision, event_index), duplicate capture returns the prior receipt, knowledge_event_seq stays its own sequence with the outbox position recorded on receipts, read-only service identity on the outbox"}
  OBX-22: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F11, F15], statement: "The scheduler and F15 section 16 consume queue.*, work.state, run.added, credential.revoked and lead.generation and react on the event; the ActionProjection behind /attention is recomputed when an affecting kind lands, not per poll"}
  OBX-23: {section: "D9. Crash semantics under ADR-0001", kind: requirement, tracked_by: [E18], statement: "events, event_overflow and h commit atomically inside control.yaml; overflow payloads are staged, named and hashed, published or verified by recovery from staging, never reconstructed; fault points for an unpublished overflow payload, log.seal.after_segment and log.seal.mid_prune; every committed transition keeps at least one valid representation; migration/mass-transition tests exceed 64 events"}
  OBX-24: {section: "D10. Downgrade safety", kind: sequencing, tracked_by: [E18], statement: "The fields are additive but older engines refuse the file (additionalProperties false); ship them with M4-D under that phase's schema decision (v2 additive with refusal, or v3 with a no-op migrate step), never separately"}
  OBX-25: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "One commit point (ADR-0001): nothing new is staged beyond fields of a record already inside it"}
  OBX-26: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "History independence (ADR-0011 H1, H2, invariant 13): derivation compares hot collections only, hot events are capped at 64, overflow bytes do not stay hot, the commit path does no sealing"}
  OBX-27: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Nothing in local/ is authority: the wake file is advisory and resume after deleting local/ is unchanged"}
  OBX-28: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Readers take no control lock; the log is immutable once written"}
  OBX-29: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "The log is never discarded: sealing changes the physical representation, never drops a logical transition or overflow payload"}
  OBX-30: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Observed facts are not committed facts: a run record is telemetry until the Lead ingests it"}
  OBX-31: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 24, logical log completeness: exactly one logical transition resolvable per revision; equivalent copies may coexist transiently; the newest equals last_transition"}
  OBX-32: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 25, event fidelity: the complete events of r equal the derivation over (state r-1, state r) plus operation-declared facts wherever the model test retains them"}
  OBX-33: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 26, hot-state bound: len(last_transition.events) <= 64; above it event_overflow exists, matches the immutable payload, and the reader returns the complete set"}
  OBX-34: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 27, segment fidelity: 256 logical transitions per segment, overflow payloads preserved and digest-verified, chain continuity across segment boundaries"}
  OBX-35: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 28, reader race safety: under every modelled sealing/crash interleaving a lockless reader resolves the transition or reports explicit corruption/incomplete history, never a false gap"}
  OBX-36: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "H2 budget: derivation plus hash add at most 10 ms per commit at 20 open / 3,000 completed, flat along the history series (tools/perf/control_plane.py, reference Windows machine and Rocky 8)"}
  OBX-37: {section: "Completion criteria", kind: gate, tracked_by: [E18, E1], statement: "Wake latency: commit to waiter wake across two processes, median under 50 ms on both platforms"}
  OBX-38: {section: "Completion criteria", kind: gate, tracked_by: [E18, E1, F20], statement: "No parse while waiting: harness wait --any makes zero control.yaml parses between wakes, and the dashboard event endpoint none per request"}
  OBX-39: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "Git cost: with 60,000 revisions compacted behind the window, git status at most 0.15 s on the reference machine"}
  OBX-40: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "Coverage: crash matrix and seeded walks include overflow publication recovery, both sealing fault points, lockless reader/compaction races and repaired logs; mass transitions exceed 64 events; rules 24 to 28 in the oracle; earlier tests unchanged except for the transition schema"}
  OBX-41: {section: "Completion criteria", kind: process, tracked_by: [E18], statement: "Reviewed like a store change (ADR-0011 'Review'): a brief states what changed in ADR-0001's model"}
  OBX-42: {section: "Test sketch", kind: evaluation, tracked_by: [E18], statement: "Unit (table-driven derivation for every kind incl. >64 overflow, both schemas, hash covers overflow), store model (event fidelity, overflow and log.seal.* fault points, the repaired-log regression), integration (two-process wake, wait --any over two fake runs, missed-wake fallback, lockless reader during compaction, overflow across sealing), regression (rules 24 to 28, downgrade), perf (commit delta, git status at 60,000 revisions)"}
  OBX-43: {section: "Alternatives considered", kind: decision, tracked_by: [E18], statement: "Rejected: a separate state/outbox ring, commits as history-manifest entries, SQLite in local/ as the record, OS notification alone; a SQLite reader index may come later as a locator only; supervisor-committed run events deferred to the authority decision"}
  OBX-44: {section: "Consequences", kind: process, tracked_by: [E18, E1], statement: "The register gets the outbox row (E18) and E1 points at it; the dashboard API gets a new endpoint and a renewed C0 review; older engines refuse the file (D10)"}
