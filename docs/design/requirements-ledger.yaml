  # ---- OBX: ADR-0012, the transaction outbox -------------------------------------------------------------------
  OBX-01: {section: "Decision", kind: decision, tracked_by: [E18], statement: "The outbox is the transition log: no second store and no second record of a commit; the log becomes a derived, complete, bounded, consumable copy of what the commit point records"}
  OBX-02: {section: "D1. Completeness is a stated guarantee", kind: invariant, tracked_by: [E18], status: "done: M4-D2 #60", statement: "For every revision r <= revision exactly one logical transition record exists, unsealed (state/log/<r>.yaml, optional immutable overflow sidecar) or in a sealed segment; transient coexistence must be byte/hash-equivalent, and any disagreement is corruption that fails audit and reading closed"}
  OBX-03: {section: "D1. Completeness is a stated guarantee", kind: invariant, tracked_by: [E18], statement: "control.yaml stays the single workflow authority and last_transition the authoritative description of the newest transition; the log is complete and consumable but never workflow authority; recovery's repair of a missing log record becomes a consumer guarantee and extends to staged overflow payloads"}
  OBX-04: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "last_transition gains bounded events plus an optional event_overflow descriptor, derived by ControlStore._commit from the committed before/after states plus operation-declared facts, in the store and not a finalizer, so direct Session.commit sites are covered"}
  OBX-05: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "Derived kinds by comparing hot collections only: lead.generation, work.state, invocation.status, run.added, credential.revoked, history.appended, unit.archived, and queue.entry/queue.lease (M4-D), with the fields of the table"}
  OBX-06: {section: "D2. The record gains typed events, derived in the store", kind: requirement, tracked_by: [E18], statement: "Operation-declared kinds (decision.recorded, handoff.recorded, evidence.ingested, audit.recorded) are appended through TxnContext.events by the authoritative Engine operation only; callers and consumers never invent events; op, actor, summary, reason and refs stay"}
  OBX-07: {section: "Bounded hot representation", kind: invariant, tracked_by: [E18], statement: "last_transition.events holds at most 64 events; above 64 it holds the first 64 and event_overflow {path, sha256, event_count, counts_by_kind}; consumers are never told to reconstruct truncated events by diffing historical control states"}
  OBX-08: {section: "Complete overflow payload", kind: requirement, tracked_by: [E18], statement: "An overflow transition's complete event list is written as immutable state/log/<rev>.events.yaml, prepared as a normal staged transaction write and named/digested by the committed descriptor; redo publishes or verifies the identical payload; a mismatch fails closed; nothing regenerates the set after commit"}
  OBX-09: {section: "Schema and hash coverage", kind: requirement, tracked_by: [E18], statement: "transition.schema.json (aew/transition/v1) validates the bounded record and descriptor, closed at every level, referenced by control.schema.json; every log record carries its schema; the overflow payload has its own closed JSON-only schema; the transition hash commits to the overflow digest and count"}
  OBX-10: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "One reader surface: aew history log --since R [--follow] [--kind ...] [--json] yields logical transitions R+1..revision in order, resolving and verifying overflow payloads so the consumer sees the complete event set; the cursor is the revision number whatever the physical representation"}
  OBX-11: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Readers take no control lock and are race-safe against lockless sealing: try unsealed, refresh the sealed view, require equivalence when both exist, and after a bounded retry report corruption/incomplete history rather than a false gap"}
  OBX-12: {section: "D3. The reader protocol: a cursor is a revision number", kind: requirement, tracked_by: [E18], statement: "A reader finds the current revision through the authority-file identity/cached parse; a long-lived waiter does not repeatedly parse control.yaml (H3); --follow blocks on the wake signal; a consumer behind the window walks sealed segments transparently"}
  OBX-13: {section: "D4. One wake signal, advisory", kind: decision, tracked_by: [E18, E1], statement: "local/wake is bumped by the store after each commit's log write (after txn.after_log) and by the supervisor after each run.json write; waiters stat it every 20 to 50 ms with a coarse full check every 2 s; waking is advisory (a missed wake costs latency, never correctness); OS notification may replace the stat behind the same interface; the M4 plan's 'wake file or pipe' is decided as the file"}
  OBX-14: {section: "D5. Observed run facts stay outside the outbox", kind: decision, tracked_by: [E18, E1, Q12], status: "done: M4-D6 (harness wait --any checks the run records and the committed control state on each wake)", statement: "run.json and events.jsonl are observations, not committed facts, and never enter the outbox; harness wait --any combines both lanes on each wake; F15 section 16 revocation on run end lands as a commit; whether a supervisor may commit is an ADR-0005/ADR-0009 authority decision not made here"}
  OBX-15: {section: "D6. Bounding: a 4,096-revision unsealed window, sealed segments, no discard", kind: requirement, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Transition history is never discarded; LOG_WINDOW is 4,096 revisions; older records are sealed 256 at a time into state/log/seg-NNNNNN.yaml carrying overflow payloads, written create-if-absent, fsynced, re-read, schema-validated and hash-verified (overflow digest/count recomputed) before any unsealed file is removed; pruning is idempotent and never leaves neither representation"}
  OBX-16: {section: "D6. Bounding: a 4,096-revision unsealed window, sealed segments, no discard", kind: requirement, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Compaction is off the commit path: aew history compact is the v1 mechanism, doctor reports an unsealed window above LOG_WINDOW + 256, a future background service may call the same primitive, and no finalizer seals synchronously; the control lock may serialize pruning but is not what makes readers safe"}
  OBX-17: {section: "D7. The records are hash-chained", kind: requirement, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Each transition record carries h = SHA-256(bytes.fromhex(prev_h) || canonical_json(record without h)) with ADR-0011's genesis convention; last_transition.h is the committed head; overflow records hash the descriptor; one hash per commit; a repaired record hashes identically; segments preserve and verify the chain; the chain is tamper evidence, not authority"}
  OBX-18: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E1, E18], status: "done: M4-D6 (aew harness wait --any; the 0.2 s poll replaced by the wake file, the coarse fallback kept)", statement: "E1 wait-any (M4-D): aew harness wait --any blocks on local/wake, checks both lanes and returns the first run to end with its next action; the 0.2 s poll goes, the coarse fallback stays"}
  OBX-19: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18], statement: "Supervisor and Lead broker watchdogs may keep their identity stat and react to lead.generation and credential.revoked events instead of re-parsing on every change"}
  OBX-20: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F20], statement: "Dashboard: the backend keeps a cursor and serves GET /api/v1/events?since=R as a bounded long poll (SSE later over the same service); notifications name changed kinds/ids and the frontend refetches projections with ETags; a contract addition that renews the C0 review; no poll takes the control lock"}
  OBX-21: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F21], statement: "Knowledge capture: a durable knowledge-domain cursor (never local/), job identity (project_id, revision, event_index), duplicate capture returns the prior receipt, knowledge_event_seq stays its own sequence with the outbox position recorded on receipts, read-only service identity on the outbox"}
  OBX-22: {section: "D8. Consumers, and what each gets", kind: requirement, tracked_by: [E18, F11, F15], statement: "The scheduler and F15 section 16 consume queue.*, work.state, run.added, credential.revoked and lead.generation and react on the event; the ActionProjection behind /attention is recomputed when an affecting kind lands, not per poll"}
  OBX-23: {section: "D9. Crash semantics under ADR-0001", kind: requirement, tracked_by: [E18], status: "done: M4-D2 #60", statement: "events, event_overflow and h commit atomically inside control.yaml; overflow payloads are staged, named and hashed, published or verified by recovery from staging, never reconstructed; fault points for an unpublished overflow payload, log.seal.after_segment and log.seal.mid_prune; every committed transition keeps at least one valid representation; migration/mass-transition tests exceed 64 events"}
  OBX-24: {section: "D10. Downgrade safety", kind: sequencing, tracked_by: [E18], statement: "The fields are additive but older engines refuse the file (additionalProperties false); ship them with M4-D under that phase's schema decision (v2 additive with refusal, or v3 with a no-op migrate step), never separately"}
  OBX-25: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "One commit point (ADR-0001): nothing new is staged beyond fields of a record already inside it"}
  OBX-26: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "History independence (ADR-0011 H1, H2, invariant 13): derivation compares hot collections only, hot events are capped at 64, overflow bytes do not stay hot, the commit path does no sealing"}
  OBX-27: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Nothing in local/ is authority: the wake file is advisory and resume after deleting local/ is unchanged"}
  OBX-28: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Readers take no control lock; the log is immutable once written"}
  OBX-29: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], status: "done: M4-D2 #60", statement: "The log is never discarded: sealing changes the physical representation, never drops a logical transition or overflow payload"}
  OBX-30: {section: "Invariants the implementation must keep", kind: invariant, tracked_by: [E18], statement: "Observed facts are not committed facts: a run record is telemetry until the Lead ingests it"}
  OBX-31: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 24, logical log completeness: exactly one logical transition resolvable per revision; equivalent copies may coexist transiently; the newest equals last_transition"}
  OBX-32: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 25, event fidelity: the complete events of r equal the derivation over (state r-1, state r) plus operation-declared facts wherever the model test retains them"}
  OBX-33: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], statement: "Oracle rule 26, hot-state bound: len(last_transition.events) <= 64; above it event_overflow exists, matches the immutable payload, and the reader returns the complete set"}
  OBX-34: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Oracle rule 27, segment fidelity: 256 logical transitions per segment, overflow payloads preserved and digest-verified, chain continuity across segment boundaries"}
  OBX-35: {section: "Oracle rules (additive)", kind: invariant, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Oracle rule 28, reader race safety: under every modelled sealing/crash interleaving a lockless reader resolves the transition or reports explicit corruption/incomplete history, never a false gap"}
  OBX-36: {section: "Completion criteria", kind: gate, tracked_by: [E18], statement: "H2 budget: derivation plus hash add at most 10 ms per commit at 20 open / 3,000 completed, flat along the history series (tools/perf/control_plane.py, reference Windows machine and Rocky 8)"}
  OBX-37: {section: "Completion criteria", kind: gate, tracked_by: [E18, E1], status: "done: partly; Windows median 42.2 ms from commit start (tools/perf/wake_latency.py, M4-D6); Rocky 8 owed", statement: "Wake latency: commit to waiter wake across two processes, median under 50 ms on both platforms"}
  OBX-38: {section: "Completion criteria", kind: gate, tracked_by: [E18, E1, F20], status: "done: partly; harness wait --any parses control.yaml only when it changed (M4-D6 test); the dashboard event endpoint is F20.7", statement: "No parse while waiting: harness wait --any makes zero control.yaml parses between wakes, and the dashboard event endpoint none per request"}
  OBX-39: {section: "Completion criteria", kind: gate, tracked_by: [E18], status: "done: M4-D2 #60 (git status 0.111 s median on Windows after compacting 60,000 revisions; tools/perf/log_compaction.py)", statement: "Git cost: with 60,000 revisions compacted behind the window, git status at most 0.15 s on the reference machine"}
  OBX-40: {section: "Completion criteria", kind: gate, tracked_by: [E18], status: "done: M4-D2 #60", statement: "Coverage: crash matrix and seeded walks include overflow publication recovery, both sealing fault points, lockless reader/compaction races and repaired logs; mass transitions exceed 64 events; rules 24 to 28 in the oracle; earlier tests unchanged except for the transition schema"}
  OBX-41: {section: "Completion criteria", kind: process, tracked_by: [E18], statement: "Reviewed like a store change (ADR-0011 'Review'): a brief states what changed in ADR-0001's model"}
  OBX-42: {section: "Test sketch", kind: evaluation, tracked_by: [E18], statement: "Unit (table-driven derivation for every kind incl. >64 overflow, both schemas, hash covers overflow), store model (event fidelity, overflow and log.seal.* fault points, the repaired-log regression), integration (two-process wake, wait --any over two fake runs, missed-wake fallback, lockless reader during compaction, overflow across sealing), regression (rules 24 to 28, downgrade), perf (commit delta, git status at 60,000 revisions)"}
  OBX-43: {section: "Alternatives considered", kind: decision, tracked_by: [E18], statement: "Rejected: a separate state/outbox ring, commits as history-manifest entries, SQLite in local/ as the record, OS notification alone; a SQLite reader index may come later as a locator only; supervisor-committed run events deferred to the authority decision"}
  OBX-44: {section: "Consequences", kind: process, tracked_by: [E18, E1], statement: "The register gets the outbox row (E18) and E1 points at it; the dashboard API gets a new endpoint and a renewed C0 review; older engines refuse the file (D10)"}
  OBX-45: {section: "Frozen design decisions and deferred dependency", kind: decision, tracked_by: [E18, F21], statement: "Frozen: LOG_WINDOW 4,096 with maintenance-only compaction; D7's hash chain kept; the command is aew history log, not aew events; bounded long poll first; supervisor commits not authorized; the knowledge cursor is durable project-bound knowledge state, placed by ADR-0013; adopted by the operator 2026-10-04"}
  # ---- KST: ADR-0013, knowledge storage placement ----------------------------------------------------------------
  KST-01: {section: "Decision", kind: decision, tracked_by: [F21], statement: "Knowledge records are entries of the ADR-0011 history manifest: one chain, hot root, audit, derived index and history surface for terminal work and knowledge; five kinds added (reference, case, lesson, knowledge_disposition, capture_receipt); knowledge_event_seq is the manifest seq, globally monotonic and unique, with numeric gaps"}
  KST-02: {section: "D1. Five entry kinds, one additive schema change", kind: requirement, tracked_by: [F21], statement: "history.schema.json entry.kind and manifest.ENTRY_KINDS gain the five kinds; entries gain optional version (integer >= 1), required by the writer for reference/case/lesson; K0 references use version 1 and a changed canonical pointer is a new Knowledge ID; existing chains unaffected"}
  KST-03: {section: "D1. Five entry kinds, one additive schema change", kind: requirement, tracked_by: [F21], statement: "Entry identity, subject/rel, links and coarse source per kind as the table gives; hot counters allocate Knowledge, knowledge_disposition and capture_receipt ids; external id prefixes are an M6b schema choice"}
  KST-04: {section: "D2. Records are immutable files under `.aew/knowledge/`, git-tracked", kind: requirement, tracked_by: [F21], statement: "Records are immutable files under .aew/knowledge/records/{cases,lessons,references,dispositions,capture-receipts}, one file per version, written with History.write_record (create-if-absent, immutable, redo) in the transaction that appends their entries; RECORD_GLOBS gains only knowledge/records/**/*.yaml; nothing knowledge-authoritative under local/"}
  KST-05: {section: "D3. Identity: manifest `seq` is `knowledge_event_seq`; `knowledge_disposition_seq` is per version", kind: requirement, tracked_by: [F21], statement: "knowledge_id is stable across versions and version identifies the immutable version; knowledge_event_seq is the manifest seq, an opaque monotonic cursor from which consumers never infer missing Knowledge"}
  KST-06: {section: "D3. Identity: manifest `seq` is `knowledge_event_seq`; `knowledge_disposition_seq` is per version", kind: requirement, tracked_by: [F21], statement: "Every knowledge_disposition targets an exact immutable version; knowledge_disposition_seq is the per-version ordinal in manifest order, stored in the event and validated against authenticated history plus earlier staged entries; current state is a fold, never written back into content, cacheable and rebuildable"}
  KST-07: {section: "D4. `knowledge_disposition` events reuse the history-event mechanism, not Archive ownership", kind: requirement, tracked_by: [F21], statement: "A shared history-domain event writer (HistoryEvents.append, name illustrative) that Archive.annotate may delegate to; the index gains about(subject, kinds=None) and annotations() becomes its compatibility wrapper"}
  KST-08: {section: "D4. `knowledge_disposition` events reuse the history-event mechanism, not Archive ownership", kind: requirement, tracked_by: [F21], statement: "The v1 rel vocabulary is bounded to implemented project-scope semantics (admitted, held_active, held_dormant, rejected, superseded_proposal, serving_hold, serving_release, supersedes, refines, challenged, reassessed, quarantined, archived; no visibility_widened); each event carries policy_version, exact target, principal, at and relation fields; admission records its serving envelope; coarse source follows the actual actor"}
  KST-09: {section: "D4. `knowledge_disposition` events reuse the history-event mechanism, not Archive ownership", kind: decision, tracked_by: [F21], statement: "Audit findings are not knowledge_disposition events; they stay audit records referencing the damaged entry; quarantine is a separate attributable knowledge_disposition"}
  KST-10: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: requirement, tracked_by: [F21], statement: "A capture_receipt is written for every terminally processed capture job, NO_CANDIDATE included, binding the exact committed origin event/work/attempt/source and recording extractor/model/prompt/template/policy versions and the pinned input snapshot"}
  KST-11: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: requirement, tracked_by: [F21], statement: "PARTIAL is durable but does not close its origin event while retryable work remains; it records persisted outputs and enough pinned input to resume idempotently without regenerating accepted provider output; RETRYABLE_FAILURE never advances durable coverage"}
  KST-12: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: invariant, tracked_by: [F21, E18], statement: "The recovery position is the largest contiguous safe prefix of outbox positions whose every capture opportunity has a terminal receipt, never the highest receipt; re-scanning is safe through idempotency, skipping an uncovered opportunity never is; receipts link the exact origin event so a duplicate returns the prior receipt"}
  KST-13: {section: "D5. Capture receipts provide the durable safe-resume watermark", kind: requirement, tracked_by: [F21], statement: "In-flight job state lives under local/knowledge/jobs/ and is disposable (loss means replay); accepted provider output a retry must reuse is persisted before local state claims progress; consecutive NO_CANDIDATE receipts are kept, not folded away"}
  KST-14: {section: "D6. What stays hot: counters, bounded human attention, and a non-authoritative lag summary", kind: requirement, tracked_by: [F21], statement: "Hot state gains only counters, knowledge.pending (at most 20 identity-only attention items plus knowledge.pending_overflow, no silent default, full set queryable) and knowledge.capture, a constant-size status summary that is never the recovery cursor or admission authority; everything else derives from the manifest"}
  KST-15: {section: "D7. Trust: coarse history `source` never upgrades semantic meaning", kind: invariant, tracked_by: [F21], statement: "The coarse source (engine/operator/model/external) never upgrades meaning; records keep the fine source-authentication classes; ENGINE_OBSERVED_WEAK_BOUNDARY stays distinguishable and gains no default serving; serving eligibility is a disposition fold plus request-time policy, never inferred from source"}
  KST-16: {section: "D7. Trust: coarse history `source` never upgrades semantic meaning", kind: requirement, tracked_by: [F21], statement: "A Knowledge record loaded into context keeps the history pin/hash/trust wrapper and also its fine source classes, applicability, limitations and current serving qualification; recall never flattens weak-boundary provenance into an unqualified engine fact"}
  KST-17: {section: "D8. The derived index gains `about`, fold caches, and a reusable FTS substrate", kind: requirement, tracked_by: [F21], statement: "local/history.sqlite stays disposable and gains about(), current(knowledge_id, version?) with the authenticated fold, and a rebuildable FTS5 substrate of locators; every result authenticates against the manifest and record hash before use; a tampered index may omit but never invent; full audit compares derived rows"}
  KST-18: {section: "D8. The derived index gains `about`, fold caches, and a reusable FTS substrate", kind: sequencing, tracked_by: [F21, F19], statement: "M6b stays simple-first: Arm B guarded raw-history search first, historical replay of K1 coverage, the smallest Case arm C only on a measured gap, K2 only if C earns it; placing storage authorizes no production K1/K2; the first FTS consumer indexes Arm B's raw material and Knowledge bodies join only when those kinds exist"}
  KST-19: {section: "D9. Who commits: a project-scoped knowledge service principal for closed policy-resolved transactions", kind: decision, tracked_by: [F21, F18], statement: "A knowledge_service principal may commit a closed knowledge.* family: project-bound, enabled and revoked by operator-authorized policy, independent of Lead generation, a new credential kind in the existing verifier/custody architecture, held only by the capture/admission service, unreachable from workers, harness context and bridges, in ADR-0009's environment-trust inventory and scrubbing tests, denied everything else; encoding/storage/rotation is an ADR-0005/ADR-0009 amendment"}
  KST-20: {section: "D9. Who commits: a project-scoped knowledge service principal for closed policy-resolved transactions", kind: requirement, tracked_by: [F21], statement: "On policy-resolved paths the service may publish K0 references, approved-template K1 Cases, initial/hold dispositions and capture receipts; K2/K3 stay behind the judgment boundary, K3 is never auto-admitted in M6 v1, and judgment-bearing actions go through the Lead/operator path linked to decision records"}
  KST-21: {section: "Runtime closure is a commit invariant", kind: invariant, tracked_by: [F21], statement: "The store commit path checks every knowledge_service commit: principal kind, allowed knowledge.* operation, permitted hot delta, permitted entry kinds, no mutation of work/invocation/Lead/credential domains, required staged record/entry relationships; role bridges never append knowledge_disposition in v1"}
  KST-22: {section: "D10. Visibility is the project in v1; the schema reserves the field", kind: decision, tracked_by: [F21], statement: "Records carry visibility_scope: project and entries nothing; matching, hints, links and FTS stay within one project; no v1 operation widens visibility; multi-scope waits for Q12 or later design as record/index policy, not a second store"}
  KST-23: {section: "D11. Migration and compatibility", kind: requirement, tracked_by: [F21], statement: "Additive for existing projects; aew history list keeps its legacy default kinds with a bounded hint that Knowledge exists, explicit kind filters (a --knowledge group later) and direct history show of a Knowledge id; older engines that cannot validate the widened schema fail closed"}
  KST-24: {section: "D12. Audit and commit-time relationship checks", kind: requirement, tracked_by: [F21], statement: "Full audit also checks: record schema/hash; canonical/evidence links resolve; each disposition subject is an exact version earlier in manifest order (staged included); stored knowledge_disposition_seq; supersedes/refines/support/challenge targets; capture_receipt.produced resolves to content written before the receipt or an explicitly referenced prior output; receipts fold to a contiguous safe watermark"}
  KST-25: {section: "D12. Audit and commit-time relationship checks", kind: invariant, tracked_by: [F21], statement: "Commit-time checks use the index only as a locator and authenticate against the manifest, inspecting earlier staged entries; a stale index grants nothing; audit findings stay audit-domain; global checks stay off the commit path (ADR-0011 invariant 13), which enforces only bounded schema, exact subject/currentness, principal authority, staged order and family closure"}
  KST-26: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 15, one chain: every Knowledge content record, disposition and receipt is pinned by the ADR-0011 manifest; no second root, manifest or audit"}
  KST-27: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 16, immutable content, appended state: versions are create-if-absent, mutable state is append-only knowledge_disposition, current state a fold"}
  KST-28: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 17, closed service transactions: knowledge_service commits are runtime-checked at the store boundary and cannot touch workflow/Lead/invocation/credential domains"}
  KST-29: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 18, safe cursor from receipts: recovery never advances past a gap or a PARTIAL job because a later receipt exists"}
  KST-30: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 19, locators not vouchers: index, FTS and fold-cache results authenticate before use"}
  KST-31: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 20, bounded hot footprint: Knowledge volume does not grow active-path hot cost"}
  KST-32: {section: "Invariants (additive to ADR-0011's fourteen)", kind: invariant, tracked_by: [F21], statement: "Invariant 21, provenance is not meaning: coarse source=engine and ENGINE_OBSERVED_* never alone establish correctness, oracle adequacy or default serving"}
  KST-33: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 29: a knowledge_service commit changes only permitted Knowledge/cold/counter/last-transition fields and entry kinds; a mutation of another domain fails before commit"}
  KST-34: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 30: every disposition targets an exact reference/case/lesson version existing earlier (staged included), with a correct knowledge_disposition_seq"}
  KST-35: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 31: len(knowledge.pending) <= 20, each a current judgment-bearing candidate, overflow non-negative, nothing resolved by timeout or default"}
  KST-36: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 32: safe_through is the largest contiguous terminally covered position; out-of-order receipts above a gap and PARTIAL receipts do not advance it"}
  KST-37: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "1. history.schema.json accepts the five kinds and version; existing history fixtures verify unchanged"}
  KST-38: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "2. One redo-protected service transaction appends a K1 Case, its initial disposition and a terminal receipt, each immutable and manifest-pinned"}
  KST-39: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "3. Crash/recovery at the history fault points leaves old-or-new valid history; service closure is rechecked at the store commit boundary"}
  KST-40: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "4. Exact-version show/load keeps hash pinning and the fine source/applicability/limitation qualification"}
  KST-41: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "5. unreferenced() covers only the machine-managed Knowledge subtree; full audit detects damaged records/links and records findings without rewriting Knowledge"}
  KST-42: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "6. Capture restart: duplicates return the prior receipt, PARTIAL resumes idempotently, out-of-order receipts cannot jump the watermark, NO_CANDIDATE closes its job and advances contiguous coverage"}
  KST-43: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "7. H1/H2 stay within bounds with thousands of Knowledge records; status, checkpoint and resume scan no Knowledge files"}
  KST-44: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "8. Index/FTS acceptance proves locator-not-voucher, rebuildability and bounded query cost; Arm B stays the first recall consumer"}
  KST-45: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "9. Pack tests prove a Knowledge load cannot displace mandatory guardrails or current authority, and weak-boundary provenance stays visibly qualified"}
  KST-46: {section: "Completion criteria", kind: gate, tracked_by: [F21], statement: "10. Oracle rules 29 to 32 pass seeded walks, including a service attempt to mutate work and a Lead takeover while capture continues"}
  KST-47: {section: "Completion criteria", kind: gate, tracked_by: [F21, F20], statement: "11. history list keeps its legacy default; Knowledge filters and show work; the dashboard handles new history kinds safely until /knowledge gets its own renewed contract"}
  KST-48: {section: "Test sketch", kind: evaluation, tracked_by: [F21], statement: "Unit (five kinds, about, disposition seq, folds, the safe-cursor fold with gaps/out-of-order/PARTIAL/NO_CANDIDATE, qualification, downgrade), store/authority (service family at Session.commit, every forbidden domain refused, same-transaction ordering without SQLite authority, takeover leaves the service valid), history integration (crash matrix, unreferenced, audit against damaged index/records), end to end, scale (measured labelled measured, extrapolations labelled)"}
  KST-49: {section: "Alternatives considered", kind: decision, tracked_by: [F21], statement: "Rejected: a second knowledge manifest/root, SQLite as knowledge authority, knowledge inside unit bundles, a separate authoritative capture cursor, a separate knowledge_event_seq counter, versions as revision objects in one file"}
  KST-50: {section: "Not decided here", kind: open-question, tracked_by: [F21, F20], statement: "Open: the knowledge id prefix and record schemas (aew/knowledge/*/v1, written by the M6b plan); the service credential's encoding/rotation/storage; Arm B FTS over evidence and decisions with its request-mode labelling; multi-project visibility (K3, Q12); whether a post-v1 role capability may nominate Knowledge actions; the /knowledge dashboard contract revision (C0 renewal)"}
  KST-51: {section: "Frozen designer decisions", kind: decision, tracked_by: [F21], statement: "The qualified vocabulary is normative: knowledge_disposition, knowledge_disposition_seq and capture_receipt; generic disposition/receipt names are not frozen schema terms"}
  KST-53: {section: "Oracle rules (continuing finalized ADR-0012 rules 24–28)", kind: invariant, tracked_by: [F21], statement: "Oracle rule 33: at most one live service credential per principal; every service credential names a registered principal and exactly its family, and its scope carries no Lead generation (ADR-0005, 2026-10-05)"}
  KST-52: {section: "Checks before relying on this ADR", kind: process, tracked_by: [F21], statement: "Before implementation, reconcile field names with the finalized capture/admission v0.4, shared semantics v0.4 and recall v0.3 drafts, and re-check the history code (history/*, archive_ops, history.schema.json) against the probed tree"}
  # ---- EVC: the evaluation component (F19), v0.2 ----------------------------------------------------------------
  EVC-01: {section: "1. What exists, and what F19 adds", kind: requirement, tracked_by: [F19], statement: "Turn the M3 dogfood's single-experiment pieces (fixture format, hidden-test module, rubric, arms, model configuration, record, collector) into shared components that Q7, F14 phases, F17 and Class 0 sampling use without one run becoming several samples"}
  EVC-02: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "F19 is a measurement instrument: evaluation code and outputs never become AEW workflow truth because AEW produced them"}
  EVC-03: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "A paid/model run is counted once; it may support several preregistered metrics or later analyses but is never duplicated into independent samples"}
  EVC-04: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], status: "done: partly; the ledger registers and syncs an attempt before any provider action (slice 1); the runner that calls it is slice 2", statement: "Every attempted paid/model run is durably registered before the first provider action, so a runner crash cannot erase a failure"}
  EVC-05: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Run observations are immutable after finalization; re-scoring and re-analysis create new artifacts"}
  EVC-06: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Hidden oracles, reference answers and held-out cases never reach a model-controlled process, agent environment, context pack, scratch repository or harness home"}
  EVC-07: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Objective hidden checks dominate; rubric/model adjudication is blinded to arm where feasible and attributable"}
  EVC-08: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "An AEW-versus-raw comparison changes one factor, AEW; cross-harness comparisons are separate experiments"}
  EVC-09: {section: "1.1 Frozen evaluation principles", kind: invariant, tracked_by: [F19], statement: "Preregistration freezes question, cases, arms, assignment/order, profiles, budget, scoring, exclusion/invalid-run rules, stopping rule and primary measure before outcomes are visible"}
  EVC-10: {section: "2. Package layout", kind: requirement, tracked_by: [F19], statement: "The package eval/aew_eval/ (schema/{eval-run,preregistration,case}.schema.json, fixture, arms (aew, raw, scripted), runner, hidden, collect, metrics, prereg, report) and eval/experiments/ (m3-dogfood kept as it was, m4h-dogfood first, f17-shallow-finding, f14-plan-assurance, class0-sample); tools/perf unchanged"}
  EVC-11: {section: "2. Package layout", kind: decision, tracked_by: [F19], statement: "The shared instrument is public in this repository; hidden oracles, held-out cases and references live in aew-private/eval/; the public tree holds case manifests and cryptographic commitments to hidden material; schema/unit tests run without hidden material, whose access is a runner capability, not an import dependency"}
  EVC-12: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19], status: "done: partly; the attempt ledger and the immutable finalization (slice 1); the runner is slice 2", statement: "Each paid/model attempt is appended to an experiment-local attempt ledger before any provider action and finalized with exactly one immutable aew/eval-run/v1 result; a crash leaves a visible RUNNER_LOST/unfinished attempt in the sample accounting"}
  EVC-13: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py); compat.py maps every M3 record, the original kept verbatim", statement: "Backward compatible with aew/dogfood-run/v1: every M3 field keeps its meaning and a deterministic adapter maps historical records without rewriting them"}
  EVC-14: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19, F25], statement: "The record: experiment and preregistration hash, run id, case and hidden hashes, arm, requested and observed profile with mismatch, AEW commit/spec/schema, harness name/version/artifact/capability-fixture/containment, environment, assignment, validity status and reason, limits, outcome (hidden checks, done, commit, paths, scope, interventions, safety, scoring provenance), AEW facts, cost with pricing snapshot, unscored notes"}
  EVC-15: {section: "3. `aew/eval-run/v1`", kind: requirement, tracked_by: [F19], statement: "A run belongs to exactly one preregistration; raw observations and preregistered scorer outputs are immutable; later metrics write a separate aew/eval-analysis/v1 artifact keyed by preregistration hash, run ids and metric versions; requested versus observed profile is kept as a validity fact"}
  EVC-16: {section: "4. The preregistration record, `aew/eval-prereg/v1`", kind: requirement, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py)", statement: "aew/eval-prereg/v1 records question, arms, cases with paired controls, pinned profiles and budget, runs per cell, assignment method/seed/materialized order, one primary measure and secondaries, thresholds, versioned metrics, validity/retry/missing-result rules, stopping rule, scoring (hidden channel, who scores, blinding, adjudication), held-out ids, exposure and amendment policies, frozen_at/by and canonical hash"}
  EVC-17: {section: "4. The preregistration record, `aew/eval-prereg/v1`", kind: requirement, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py)", statement: "prereg.py freeze canonicalizes, hashes, materializes the schedule and refuses a case whose fixture, oracle, profile or config hash differs; material changes after outcomes are visible get a new experiment id; report.py groups by preregistration and shows amendments and secondary analyses"}
  EVC-18: {section: "5. The hidden-evaluator channel", kind: requirement, tracked_by: [F19], statement: "An oracle is a private-repository directory cases/<id>/oracle/ with checks.py, optional reference/ and a manifest.yaml of expected answers; rubrics stay prose and are hashed into the preregistration"}
  EVC-19: {section: "5. The hidden-evaluator channel", kind: invariant, tracked_by: [F19], statement: "hidden.py loads oracles from the evaluator-only AEW_EVAL_HIDDEN_ROOT, never inherited by or mounted into model-controlled processes, with no oracle descriptor open across agent launch; scoring starts after the model-controlled tree ends where practical, on an export in an evaluator-owned directory outside the scratch repository"}
  EVC-20: {section: "5. The hidden-evaluator channel", kind: requirement, tracked_by: [F19], statement: "Records store hidden_sha256 (the oracle directory's content hash); on an air-gapped host the private repository is part of the deployment bundle and the channel is the same path"}
  EVC-21: {section: "5. The hidden-evaluator channel", kind: invariant, tracked_by: [F19], statement: "Held-out status is an exposure property: a case revealed and used to change AEW is marked exposed and no longer counts as confirmatory held-out evidence; the private corpus keeps the exposure history"}
  EVC-22: {section: "5. The hidden-evaluator channel", kind: requirement, tracked_by: [F19], statement: "An evaluator model's provider/model/effort, observed configuration, prompt/rubric hash and output are recorded as scorer provenance; it sees an arm-neutral artifact wherever feasible"}
  EVC-23: {section: "6. The incident corpus, with sources", kind: requirement, tracked_by: [F19, F17, F14], statement: "The corpus starts from recorded families: M3 dogfood tasks, acceptance-input mutation, oracle weakening and evaluator integrity, shallow-finding termination, Class 0 eligibility samples, resume after harness loss, seeded review defects, containment under the Q7 classification; new incidents enter the private repository with a public manifest entry, never the answer"}
  EVC-24: {section: "7. The external comparator: a verification item, not a choice", kind: requirement, tracked_by: [F19, Q11], statement: "The raw arm and an external evaluator model are named apart; no evaluator model is chosen here; prereg.py verifies the gateway features an evaluator needs and records the observed configuration, and an experiment with unverified evaluator features cannot freeze"}
  EVC-25: {section: "7. The external comparator: a verification item, not a choice", kind: invariant, tracked_by: [F19], statement: "Model agreement is never independent proof; objective hidden checks stay primary; for rubric facts the frozen adjudication policy decides and model scoring is attributable evidence, not self-authenticating"}
  EVC-26: {section: "8. Sequencing", kind: sequencing, tracked_by: [F19], statement: "Schemas, prereg.py and the append-only attempt ledger first (M4-H must be unable to lose or redefine a paid run); runner and fixture by generalizing dogfood.py with M3 still runnable; hidden.py with the private boundary, exposure tracking and the first held-out case; metrics and immutable analysis; report last; first consumer M4-H's preregistered dogfood, and F17 phase 1 may use the same runner"}
  EVC-27: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py)", statement: "aew/eval-run/v1 represents every historical M3 run through a deterministic mapping without renaming or changing M3 fields"}
  EVC-28: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py)", statement: "Before the first provider action the attempt ledger durably holds experiment, preregistration hash, run id, case, arm, assignment order and requested profile; killing the runner after launch leaves a visible unfinished attempt"}
  EVC-29: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py)", statement: "A preregistration canonically hashes fixtures, oracle commitments, profiles, arm configs, schedule, validity/retry/stopping rules and scoring; a changed material input refuses to run under it"}
  EVC-30: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py)", statement: "One attempt counts once; retries happen only under the frozen invalid-infrastructure policy and stay linked to the original attempt"}
  EVC-31: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], status: "done: partly; results are immutable and verified (slice 1); aew/eval-analysis/v1 comes with metrics", statement: "Run records are immutable after finalization; re-analysis is a separately hashed aew/eval-analysis/v1 naming exact run ids and metric versions"}
  EVC-32: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "No hidden oracle path, content or descriptor in a scratch repository, agent environment, harness home, context pack or model-controlled mount or process; hidden scoring arm-blind where feasible and preferably after agent termination"}
  EVC-33: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Held-out exposure is tracked; an exposed case cannot silently stay confirmatory"}
  EVC-34: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Objective checks and model/operator adjudication are identified separately; every adjudicated score records scorer provenance and disagreement resolution"}
  EVC-35: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Effective harness/model/profile/capability-fixture identity is recorded; a material requested/observed mismatch triggers the frozen validity rule"}
  EVC-36: {section: "9. Completion criteria for the component", kind: gate, tracked_by: [F19], statement: "Any evaluator-model feature an experiment uses is gateway-verified before its preregistration freezes"}
  EVC-37: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19, F24], statement: "The raw control uses the same harness, model/profile, case and environmental envelope as the AEW arm; AEW-on-OpenCode versus another harness is a cross-harness experiment, not the causal raw control"}
  EVC-38: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19], statement: "Contested rubric facts: automated checks win where they exist; otherwise a preregistered blinded evaluator-model assessment plus operator adjudication on disagreement or material ambiguity, all recorded; the operator may adjudicate directly when the preregistration says no adequate evaluator exists"}
  EVC-39: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19], status: "done: partly; freezing materializes the seeded order and each attempt records its cell and position (slice 1)", statement: "Paired/cell runs are randomized or counterbalanced from a preregistered seed or schedule; the actual order is part of the run record"}
  EVC-40: {section: "Frozen designer decisions", kind: decision, tracked_by: [F19], statement: "F19 is evaluation-only: its records, scores and evaluator judgments never mutate project control state or satisfy workflow gates by themselves"}
  EVC-41: {section: "Frozen designer decisions", kind: sequencing, tracked_by: [F19], status: "done: F19 slice 1 (eval/aew_eval; tests/unit/test_eval_instrument.py); the slice stops before the runner, as sequenced", statement: "The first implementation stops after the schemas, preregistration and attempt-ledger slice proves these invariants against the M3 corpus, before generalizing the runner; nothing else blocks M4-H preregistration"}
  # ---- NET: Linux network containment (F-F), v0.2 ---------------------------------------------------------------
  NET-01: {section: "1.1 Design-authority correction: CONNECT allowlisting and provider credential injection are separate jobs", kind: decision, tracked_by: [F28], statement: "Provider credentialing and generic egress are separate mechanisms: a secretless in-sandbox shim forwards plaintext provider bytes over AF_UNIX to a supervisor-owned reverse relay with a fixed configured upstream that strips client Authorization, adds the real credential and makes the TLS connection; a CONNECT egress proxy holds no credential; key custody is never claimed through header injection into a CONNECT tunnel; the relay never takes an upstream from the sandbox"}
  NET-02: {section: "2. What the results settle", kind: decision, tracked_by: [F28], statement: "--unshare-net is viable on EL8 for the whole run tree: OpenCode starts without network when its catalog is embedded or seeded, and the sandbox fails fast; the model API need is met through a bound-in socket, not a shared namespace"}
  NET-03: {section: "2. What the results settle", kind: requirement, tracked_by: [F28], statement: "The custody bridge is unchanged (filesystem AF_UNIX survives the namespace; abstract sockets do not); the supervisor-server link needs an in-sandbox forwarder because the server listens on the sandbox's own loopback (about 0.7 ms per request)"}
  NET-04: {section: "2. What the results settle", kind: requirement, tracked_by: [F28], statement: "The provider key leaves the sandbox entirely, closing the review's G5 exfiltration path (reading the server's environment or /proc/<pid>/environ from an agent shell)"}
  NET-05: {section: "2. What the results settle", kind: requirement, tracked_by: [F28], statement: "The allowlist is the gateway and nothing else; models.opencode.ai is the only other startup destination and is unnecessary with a seeded catalog; connected deployments may allow it or not"}
  NET-06: {section: "2. What the results settle", kind: requirement, tracked_by: [F28, F12], statement: "Offline model availability is a catalog question: a pinned model newer than the binary's embedded catalog needs a seeded catalog or one allowed fetch, and aew doctor says which"}
  NET-07: {section: "3.1 Truthful network labels", kind: requirement, tracked_by: [F28], statement: "The containment label gains network.mode (proxy_only, isolated, shared, not_provided), network.provider_relay (configured or none) and network.egress_allow (only when generic egress exists), with the meanings given; shared is truthful topology, not a guarantee"}
  NET-08: {section: "3.1 Truthful network labels", kind: decision, tracked_by: [F28], statement: "Until F-F lands, Linux M4-B runs are labelled network shared, never retroactively proxy_only; once F-F is accepted, Linux model-controlled runs default to proxy_only and shared is an explicit weaker execution-policy choice"}
  NET-09: {section: "3.2 Layout and one secretless in-sandbox network shim", kind: requirement, tracked_by: [F28], statement: "The M4-B Layout gains a network mode and the AF_UNIX paths it needs; bwrap_argv adds --unshare-net for proxy_only and isolated"}
  NET-10: {section: "3.2 Layout and one secretless in-sandbox network shim", kind: requirement, tracked_by: [F28], statement: "An AEW-owned network shim runs in the harness's network namespace for the run's lifetime as a ProcessTree-owned sibling (not an exec wrapper), providing only the configured legs (supervisor to the server, the provider baseURL to the relay, optional egress to the allowlist proxy); it holds no credential or authority; Codex may use native unix:// transport for the server leg once proven"}
  NET-11: {section: "3.3 Supervisor-owned credentialing provider relay", kind: requirement, tracked_by: [F28], statement: "For proxy_only the supervisor runs one credentialing relay per provider/profile (or an equivalent isolated multiplexer): fixed upstream from the execution profile, holds the credential, strips/replaces Authorization, TLS to the gateway, streaming passthrough, outside the run's PID/network namespaces under existing custody rules; never a general web proxy"}
  NET-12: {section: "3.4 Generic allowlisted egress is separate and credentialless", kind: requirement, tracked_by: [F28], statement: "Authorized non-provider egress goes through a separate supervisor-owned proxy with a bounded host:port allowlist and no secret; for OpenCode 2.0.18 connected mode models.opencode.ai:443 may be allowed for catalog refresh only; tool destinations (web fetch, browser, package managers) need their own authorized capability"}
  NET-13: {section: "3.5 Adapter behavior", kind: requirement, tracked_by: [F28, F24], statement: "OpenCode projects the provider baseURL to the local relay endpoint, gives the sandbox at most a sentinel key, uses HTTP(S)_PROXY only for authorized generic egress, sets NO_PROXY for the loopback endpoints, and sends the real provider_env only to the relay; Codex follows the same boundary, its native network proxy or domain rules defence in depth only, never the credential holder or label"}
  NET-14: {section: "3.6 Self-test and readiness", kind: requirement, tracked_by: [F28], statement: "The containment self-test proves: direct non-loopback egress fails; the bridge answers over its filesystem socket; the supervisor-server path through the shim works; a supervisor-owned local probe upstream succeeds through the relay path; an unauthorized egress target is refused; no provider secret in the sandbox environment or readable files"}
  NET-15: {section: "3.6 Self-test and readiness", kind: requirement, tracked_by: [F28], statement: "Provider/gateway readiness is a separate adapter/doctor check through the profile's bounded health or catalog operation, explicit and fail-closed, never folded into the containment self-test"}
  NET-16: {section: "3.7 OpenCode catalog for connected and air-gapped profiles", kind: decision, tracked_by: [F28, F12], statement: "An air-gapped release may carry a sanitized, checksum-pinned catalog seed generated in a clean disposable instance of the exact OpenCode pin, never an operator's opencode.db; doctor verifies the seed's fingerprint and pin and that the configured model/variant is in the effective catalog; an official offline-catalog mechanism on a later pin replaces it"}
  NET-17: {section: "3.8 Project checks", kind: decision, tracked_by: [F28], statement: "Checks default to network isolated, may request proxy_only or shared only where the check definition and execution policy permit (equal to or stricter than the policy ceiling, never widening the surrounding run's authority), and record the effective mode and egress with their evidence"}
  NET-18: {section: "3.9 Lead session", kind: decision, tracked_by: [F28], statement: "The Lead harness also defaults to proxy_only on Linux once F-F is built; operator UI/attach traffic stays outside the model-execution boundary; broader Lead network capability is an explicit bounded tool path, never raw shared network"}
  NET-19: {section: "4. Costs and what is not shown", kind: evaluation, tracked_by: [F28], statement: "Still to probe in implementation/conformance: a real streamed model turn through the credentialing relay against a TLS gateway (P4 was a local stand-in and is not proof of production injection), backpressure and cancellation on long streams, IPv6 upstreams; Windows stays network not_provided until a separate backend exists"}
  NET-20: {section: "5. Register entry text (F-F, frozen candidate)", kind: process, tracked_by: [F28], statement: "The register carries F-F with the frozen candidate text (F28): depends on M4-B, required before internal alpha, an ADR-0009 label/custody amendment", status: "done: register F28 carries the entry; the ADR-0009 amendment landed 2026-10-05 (designed, not built)"}
  NET-21: {section: "6. Frozen designer decisions", kind: gate, tracked_by: [F28], statement: "Network containment is a pre-internal-alpha requirement, not an M4-C/D blocker; no internal-alpha security claim calls Linux runs network-contained before its live lane passes"}
  # ---- HNI: harness-native integration research (T9), v0.3 -------------------------------------------------------
  HNI-01: {section: "0. The one finding that frames the rest", kind: requirement, tracked_by: [F13, E35], statement: "AEW relies only on what the pinned binary's own schema advertises, checked at launch; capabilities are recorded per adapter per pinned version, never per product"}
  HNI-02: {section: "0. The one finding that frames the rest", kind: requirement, tracked_by: [F13, E35, F24], statement: "A generated or served schema is necessary but not sufficient: the real model-visible request surface (tools, instructions, deferred runtimes) is part of per-pin conformance"}
  HNI-03: {section: "A. Capability matrix", kind: decision, tracked_by: [F15, E35, F24], statement: "MCP tool registration: MUST USE OpenCode 2.0.18 with mcp.servers.aew codemode false (the twelve typed tools directly); Codex 0.160.0 is not support-ready for the Lead's typed surface (MCP deferred behind exec) until DynamicToolSpec or a later pin is proven; capability recorded as transport.mcp.local with per-pin presentation direct_function_tools or deferred_runtime"}
  HNI-04: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F13], statement: "Tool filtering: SHOULD USE on both, recorded as inventory_filtering and request_schema_filtering per pin; only OpenCode 2.0.18 may claim schema removal; Codex 0.160.0 enabled_tools narrows inventory only"}
  HNI-05: {section: "A. Capability matrix", kind: decision, tracked_by: [F19], statement: "Structured tool results: OPTIONAL Codex output schemas for the F19 raw arm and reports; never AEW evidence (submit validates records)"}
  HNI-06: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Session resume: DO NOT USE for recovery (AEW recovery is aew resume from .aew/); OPTIONAL for the Lead TUI's reattach convenience, marked AEW_MANAGED continuation"}
  HNI-07: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24], statement: "Events and hooks: SHOULD USE event streams for telemetry on both; DO NOT USE hooks that decide or rewrite tool input (a second policy engine, and host-side execution escapes the sandbox); Codex PostToolUse artifact capture OPTIONAL after a probe of host confinement and updatedInput"}
  HNI-08: {section: "A. Capability matrix", kind: decision, tracked_by: [F24], statement: "Native sandbox: SHOULD USE on Codex as defence in depth (workspace-write, network_access false, writable_roots within the M4-B layout, never danger-full-access), recorded as a second label line, never replacing filesystem os_readonly_roots; nested bwrap on EL8 needs a probe"}
  HNI-09: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24, F15], statement: "Approvals: no ask or auto_review in runs (allow or deny decided at projection); for the Lead TUI only as a display of decisions_required whose answer routes through an AEW decision tool, never the harness reply"}
  HNI-10: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24], statement: "Model, provider and effort: MUST USE through ADR-0010 pins only with effective-model verification; the harness never chooses (auto-routing refused); effort recorded with verified_through_gateway and probed through the gateway"}
  HNI-11: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24, F26], statement: "Skills and instructions: native skills are an evaluated enhancement, not baseline authority; project discovery stays off for runs; a supported Codex run proves bundled system skills and ambient base instructions are suppressed or replaced"}
  HNI-12: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Context: set tool_output max_bytes/max_lines now; compaction hooks later and version-gated, injecting AEW pack text only, never a model summary; probe experimental.session.compacting on the OpenCode pin"}
  HNI-13: {section: "A. Capability matrix", kind: decision, tracked_by: [F24, F13, F7], statement: "Native subagents/delegation: DO NOT USE; capability recorded with model_visible, disabled_verified and max_depth; Codex 0.160.0 is not support-ready for worker runs until conformance proves its collaboration tools/instructions absent or unreachable under the granted capability"}
  HNI-14: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Native planning is UI only and never AEW plan state; filesystem/edit, interrupt/message delivery, process lifecycle (one private instance per run under the supervisor) and usage telemetry (never evidence) are MUST USE as today"}
  HNI-15: {section: "A. Capability matrix", kind: decision, tracked_by: [E35, F24], statement: "Shell environment: MUST USE Codex shell_environment_policy inherit none with set equal to agent_env (probe it) and OpenCode's session environment replacement"}
  HNI-16: {section: "A. Capability matrix", kind: requirement, tracked_by: [E35, F24], statement: "Configuration scoping: the adapter knows the complete effective configuration; Codex uses a private CODEX_HOME with --ignore-user-config --ignore-rules; OpenCode keeps OPENCODE_CONFIG_CONTENT plus OPENCODE_DISABLE_PROJECT_CONFIG and probes whether that also disables .opencode plugins and the remote .well-known layer"}
  HNI-17: {section: "A. Capability matrix", kind: requirement, tracked_by: [F24, F28], statement: "Credentials: a per-run CODEX_HOME (a shared one leaks login state to every run); the provider key reaches the app-server process only, and F-F moves it to the relay"}
  HNI-18: {section: "A. Capability matrix", kind: requirement, tracked_by: [E35, F24, F13], statement: "Capability probing: MUST USE schema probes plus a model-visible surface probe; Codex support pins the generated app-server schema and its hash"}
  HNI-19: {section: "A. Capability matrix", kind: decision, tracked_by: [E35], statement: "Plugins: DO NOT USE inside runs (plugins.loaded none asserted); the Lead TUI may load the operator's plugins only on an explicit operator flag"}
  HNI-20: {section: "A. Capability matrix", kind: decision, tracked_by: [F15], statement: "Native UI: SHOULD USE command and toast affordances to show ActionProjection/decisions_required hints; OPTIONAL attach for a second operator view; a surface may show, never decide"}
  HNI-21: {section: "OpenCode (pinned 2.0.18, next pin to be chosen by probe)", kind: requirement, tracked_by: [E35], statement: "OpenCode profile: MUST USE private serve --stdio per run, the openapi capability probe, the config projection with project config disabled, session environment replacement, allow/deny rules only, model/variant pins verified, tool_output limits, events for telemetry, mcp.servers.aew with codemode false; SHOULD USE per-agent tool filtering and a run-private curated skills directory; DO NOT USE ask, task/subagents, project plugins and .opencode/ in runs, session resume, share, autoupdate, LSP/formatter in runs, the remote .well-known layer; execute and the desktop browser namespace explicitly denied in worker runs and covered by conformance"}
  HNI-22: {section: "Codex (probed pin: CLI 0.160.0 / app-server protocol v2)", kind: decision, tracked_by: [F24], statement: "Codex app-server is a viable private transport but 0.160.0 is not a supported AEW pin; once a pin qualifies: one private app-server per run, pinned schema/hash, private CODEX_HOME with --ignore-user-config --ignore-rules, inherit none, approval_policy never, effective-policy verification, loud MCP readiness, telemetry and interrupt; DO NOT USE Code Mode as the Lead transport, uncontrolled collaboration, harness approvals as decisions, shared login, deciding hooks, memories, resume as recovery"}
  HNI-23: {section: "Custody caveat (probe 1)", kind: requirement, tracked_by: [E35, F15], statement: "The probes forwarded the Lead token into the MCP process to isolate harness behaviour; production stays broker-custodied (the Lead MCP process holds no AEW_LEAD_TOKEN), so every readiness/smoke test repeats the server-start and catalog check through the broker-only architecture"}
  HNI-24: {section: "Custody caveat (probe 2)", kind: requirement, tracked_by: [F24], statement: "No Codex support claim may rely on the direct-token probe setup; qualification runs broker-custodied"}
  HNI-25: {section: "Design meaning", kind: sequencing, tracked_by: [F24], statement: "The next Codex work is a bounded qualification spike, not a design: try DynamicToolSpec/client registration or a later pin for direct typed tools, and find the supported suppression of collaboration tools and bundled system skills/instructions; the T1/F13 semantics then apply unchanged"}
  HNI-26: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35, F13], statement: "HarnessAdapter gains a read-only capabilities() returning the matrix ids with their states per pinned version, consumed by the registry"}
  HNI-27: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35], statement: "LaunchContract names skills, tools_allowed and native_sandbox as fields when they exist; extra stays for the rest"}
  HNI-28: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35, F28], statement: "The containment label records a harness-native sandbox as a list mechanism or a native {harness, mode, roots} line; Server.start/Client take an address family for the F-F forwarder or a native unix socket"}
  HNI-29: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [F13], statement: "The capability registry keys on (adapter, pinned_version, fixture_hash) and records advertised/available state and presentation (direct, deferred, hidden) plus a request-surface conformance hash where feasible"}
  HNI-30: {section: "C. Adapter implications: seams and evidence, no redesign", kind: requirement, tracked_by: [E35], statement: "A 'nothing else loaded' conformance scenario per driver: planted project config, plugins, rules and skills have no observable effect and the worker request/tool/instruction surface holds no unapproved capability (OpenCode: execute, browser; Codex: collaboration tools/instructions, bundled skills, Code Mode where disallowed, unexpected MCP)"}
  HNI-31: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: gate, tracked_by: [E35, F24], statement: "Minimum conformance for a supported harness: the harness-neutral conformance scenarios and AT-14 to AT-17 on the real binary, fail-closed schema probe, custody, allow/deny only, a private instance per run, effective model equals the pin, stop ends every process under the M4-B layout on Linux, the nothing-else-loaded scenario, and explicit Lead MCP readiness (a missing server never degrades silently into a session without the AEW control surface)"}
  HNI-32: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: requirement, tracked_by: [E35, F13], statement: "Enhanced capabilities are declared per pin, never assumed; a missing capability degrades to the matrix fallback with an UNSUPPORTED label and never changes a gate, transition or label's truthfulness"}
  HNI-33: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: process, tracked_by: [E35, E17], statement: "One pinned version per adapter (TESTED_VERSIONS) with its schema fixture; a new version regenerates the fixture, re-runs the live lane and updates the matrix's evidence; MCP protocol revisions are negotiated and declared"}
  HNI-34: {section: "D. Initial support target: what \"AEW supports OpenCode / Codex\" means", kind: gate, tracked_by: [E35, F24], statement: "Live smoke per pin before 'supported': server start and schema probe, a scripted run through the bridge with evidence ingested, broker-only control-surface readiness, a run under the M4-B layout on Rocky 8.10, the model-visible nothing-else-loaded scenario, cost telemetry; OpenCode 2.0.18 exposes direct tools with codemode false, and a Codex pin proves the direct T1 surface and absent ungranted collaboration/system-skill surfaces"}
  HNI-35: {section: "H. Design-authority disposition", kind: decision, tracked_by: [E35, F24, F13], statement: "Durable conclusions: capability state keyed by adapter + pin + schema/probe identity; native features never become workflow authority; missing optional features degrade without changing gates, transitions or evidence; a supported pin needs real-binary conformance, custody, effective-model, process/containment and nothing-else-loaded checks; OpenCode 2.0.18 needs codemode false for the Lead MCP surface; Codex 0.160.0 is not a supported pin; the Lead fails closed when the AEW control surface is unavailable; available/inventory is distinct from model-visible presentation; the matrix is a versioned qualification artifact re-run on each pin change"}
  # ---- SAI: the effective-spec overlay index and re-freeze plan (T7), v0.2 --------------------------------------
  SAI-01: {section: "1. How the governing order works today, and the gap", kind: requirement, tracked_by: [E19], statement: "Close the two gaps: record machine-readably which frozen WC/KC sections each amendment replaces, and check contract citations (36 distinct sections cited 80 times in living documents, none checked today)"}
  SAI-02: {section: "1.1 Frozen governance model", kind: decision, tracked_by: [E19], statement: "The index is an overlay resolver for the frozen WC/KC set, not a second specification or a general document-version database"}
  SAI-03: {section: "1.1 Frozen governance model", kind: requirement, tracked_by: [E19], statement: "Explicit authority states proposed, design_frozen, adopted, superseded; only adopted overlays take part in effective resolution; adopted needs an attributable operator/repository adoption reference; superseded stays in history, not effective; designer freeze, implementation and adoption are never collapsed into one status"}
  SAI-04: {section: "1.1 Frozen governance model", kind: requirement, tracked_by: [E19], statement: "The index names exact frozen sections or cases an adopted overlay replaces or extends, and pending consolidation debt where an accepted design requires an unwritten contract amendment; ADR self-amendments that do not alter or extend WC/KC semantics stay out"}
  SAI-05: {section: "3. What a v0.8 / v0.5 re-freeze would consolidate", kind: sequencing, tracked_by: [E19], statement: "Re-freeze after M4-E (F15 governing, so WC 15.6 is amended once) and before internal alpha; WC v0.8 folds 7.4/7.5 (Class 0), 7, 8 and invariant 7 (Ticket revisions), 15.6 (stages, ActionProjection), 22 pruned; KC v0.5 folds 12, 12.3, 21, 26"}
  SAI-06: {section: "3. What a v0.8 / v0.5 re-freeze would consolidate", kind: requirement, tracked_by: [E19], statement: "A re-freeze gets a new manifest spec_set, new spec-pin hashes and tag, a new SPEC_SET in aew/__init__.py, and an aew migrate step for each project's control.yaml spec_set (no mixing without a migration review)"}
  SAI-07: {section: "4. The index: `docs/spec-amendments.yaml` (frozen candidate)", kind: requirement, tracked_by: [E19], statement: "docs/spec-amendments.yaml (aew/spec-amendments/v1): base_spec_set plus overlays with id, path, status, adoption {at, ref}, replaces/extends targets {doc, section, case?, anchor}, pending {doc, section, reason}, superseded_by; it resolves effective authority without repeating amendment prose; populated from the repository (Class 0 adopted, Ticket revisions adopted with pending KC 12, WC 7, WC 8, invariant 7, two surfaces design_frozen with pending WC 15.6)"}
  SAI-08: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "Every effective replaces/extends target is a real frozen WC/KC section or named case"}
  SAI-09: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "At most one effective replacement head per target; chains are explicit through superseded_by; ambiguity fails closed"}
  SAI-10: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "design_frozen and proposed entries never affect effective resolution; an adopted entry has an attributable adoption reference"}
  SAI-11: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "pending creates visible consolidation debt but never invents replacement text; superseded overlays stay indexed for historical resolution"}
  SAI-12: {section: "4.1 Required index invariants", kind: invariant, tracked_by: [E19], statement: "Research and proposal files may be cited as evidence but are never the effective target of an adopted overlay; a decision living only in research/ is extracted to design/ or an ADR first"}
  SAI-13: {section: "4.2 Citation semantics", kind: decision, tracked_by: [E19], statement: "An unversioned citation (WC 7.4) means the effective section, frozen base plus the adopted overlay chain; a citation of historical frozen text is version-qualified (WC v0.7 7.4); docs/README.md states the convention beside the governing order; the resolver can report base, effective replacement and source; aew docs resolve is optional later"}
  SAI-14: {section: "5. Tests: `tests/unit/test_spec_amendments.py`", kind: requirement, tracked_by: [E19], statement: "tests/unit/test_spec_amendments.py, structural and deterministic (no paragraph-level 'amend nearby' heuristic, no natural-language interpretation): index integrity, a single effective head, map/index coverage both ways for WC/KC-affecting overlays, living citations resolve (unversioned through the chain, historical against the named version), no research authority, pending debt reported deterministically, the frozen files stay pinned by test_spec_pin.py"}
  SAI-15: {section: "6. Re-freeze and migration", kind: sequencing, tracked_by: [E19, F4], statement: "Before the re-freeze: write the missing Ticket-revision WC/KC amendment; promote governing decisions stranded in research/ to a decision record or ADR; adopt the F15 overlay; clear the pending debt meant for the new base; fold the effective adopted heads into WC v0.8 / KC v0.5; create a new immutable manifest, pin and tag, keeping the old set for historical resolution"}
  SAI-16: {section: "6. Re-freeze and migration", kind: requirement, tracked_by: [E19], statement: "A new spec set never silently rewrites projects: migration is explicit and attributable (a migrate-spec path with migration review and compatibility checks); old-spec projects stay readable; mutating under the new spec requires the migration to pass; no mixed authority in one active project; the new base's overlay index starts clean while historical entries stay with the prior set"}
  SAI-17: {section: "7. Frozen designer disposition", kind: sequencing, tracked_by: [E19, F4], statement: "Immediate work is small: the index schema and file, the resolver and tests, populating it from the repository, and writing the missing Ticket-revision contract amendment; no further research needed"}
  # ---- KMP: lessons from the knowledge-manifest prototype (research; ADR-0013 governs) ----------------------------
  KMP-01: {section: "2. Patterns worth keeping", kind: requirement, tracked_by: [F21], statement: "Carry forward, where ADR-0013 allows: engine-owned fields refused by name on submission; the capture commit writes the initial disposition; search falls back to a phrase when FTS5 rejects the text; kind filtering in SQL so a planted row is dropped; and the prototype's tests (allowed hot keys only, a tampered FTS row hides and never invents, orphans reported, crash mid-capture leaves old or new history, audit covers records while resume and status read none)"}
  KMP-02: {section: "3. Registry findings: the checks worked", kind: requirement, tracked_by: [E36], status: "done: PR #51 (V2_ONLY_KEYS and as_v1)", statement: "Define the v2-only hot-key set once (schema v1 exclusion list, aew init and the v1 test fixtures all derive from or are checked against it), before M4-D adds queue"}
  KMP-03: {section: "3. Registry findings: the checks worked", kind: process, tracked_by: [F21], statement: "A new command family is classified in the DispatchDecision CLI enumeration (dispatching entry point or not dispatching); the M6b plan budgets for it"}
  KMP-04: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "ENGINE_OBSERVED_WEAK_BOUNDARY never earns default serving (case_recall) through a coarse engine source (KST-15)"}
  KMP-05: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21, E18], statement: "knowledge.capture follows the contiguous safe watermark, not the newest receipt, and a job's origin is the triggering committed event, never the capture transaction's own revision (KST-12, KST-14)"}
  KMP-06: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "A duplicate capture of the same origin event returns the prior receipt, with a test (KST-12, completion criterion 6)"}
  KMP-07: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Commit-time numbering (knowledge_disposition_seq, record paths) is computed from authenticated history plus staged entries, never from the derived index alone (KST-06, KST-25)"}
  KMP-08: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Dispositions target and sequence by exact version (K@v), not the bare Knowledge ID (KST-06)"}
  KMP-09: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "A disposition's coarse source follows the actual actor: a Lead judgment is model with its decision and Lead generation, operator only for a direct operator judgment (KST-08)"}
  KMP-10: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Use the accepted vocabulary and names: no visibility_widened or audit_finding, supersedes/superseded_proposal, knowledge_disposition and capture_receipt (KST-08, KST-09, KST-51)"}
  KMP-11: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Use the accepted layout: records under knowledge/records/, RECORD_GLOBS covering only that subtree (KST-04)"}
  KMP-12: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Number the knowledge oracle rules 29 to 32, after ADR-0012's 24 to 28 (KST-33 to KST-36)"}
  KMP-13: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "history list keeps the legacy kinds by default (KST-23)"}
  KMP-14: {section: "4. Issues to address when ADR-0013 is implemented", kind: requirement, tracked_by: [F21], statement: "Build what the prototype left out: the knowledge_service principal with its commit-boundary closure check, and PARTIAL and NO_CANDIDATE receipts (KST-19, KST-21, KST-10, KST-11)"}
  # ---- TLS: the typed Lead surface v0.2 (T1) -----------------------------------------------------------------------
  TLS-01: {section: "1. The decision, in one paragraph", kind: requirement, tracked_by: [F15.1], statement: "The Lead's interface is a catalog of typed actions defined once below transport as data plus one runner; each action names its argument schema, the primitives it expands to, its judgment-bearing inputs and its base operation class, and the runner computes an effective operation class per invocation", status: "done: F15.1-A (the catalog in aew.surface.contract, one runner in aew.surface.run, the effective class in aew.surface.classify)"}
  TLS-02: {section: "1. The decision, in one paragraph", kind: requirement, tracked_by: [F15.1], statement: "Every valid action call returns one StageResult: committed revision, stage-intent identity where applicable, completed steps, the exact stop boundary, payload and an ActionProjection of what is available, blocked or not yet queryable", status: "done: F15.1-A (every runner call returns a StageResult validated against schemas/surface.schema.json; revision and generation always observed)"}
  TLS-03: {section: "1. The decision, in one paragraph", kind: decision, tracked_by: [F15.1, Q13], statement: "MCP is the first normal Lead transport: the harness spawns `aew lead mcp`, a process with no Lead credential that forwards to the Lead broker; the server is `aew-lead`, with `aew-run` and `aew-knowledge` as separate namespaces. (The lead developer's review asked for the CLI relay first; resolved under Q13 by the designer, 2026-10-05: MCP first, as here)", status: "done: F15.1 (#93 `lead.tool`; #95 `aew lead mcp`, server aew-lead, spawned without a credential and forwarding to the broker; aew-run and aew-knowledge stay separate namespaces, F15.3)"}
  TLS-04: {section: "1. The decision, in one paragraph", kind: decision, tracked_by: [F15.1], statement: "The CLI is a parity, recovery, conformance and operator/debug adapter over the same catalog; the generic `cli(argv)` escape exists but is not advertised to the model in the normal surface, only under an explicit recovery/debug profile; common consequential actions get dedicated typed tools", status: "done: F15.1 (#93 `aew lead tool` and the recovery-only cli escape; #95 the normal MCP list never advertises it)"}
  TLS-05: {section: "1. The decision, in one paragraph", kind: invariant, tracked_by: [F15], statement: "No transport decides legality, retries judgment, widens authority or invents next actions; the Engine remains the sole legality and workflow authority"}
  TLS-06: {section: "2. Layering", kind: requirement, tracked_by: [F15.1], statement: "The runner is the only module that knows a tool's steps; a transport carries arguments in and a StageResult out; one conformance test enumerates the catalog against the dispatch registry, one golden pins the harness projection, and the CLI enumeration classifies the two new commands", status: "done: F15.1 (#88 the runner the only module that knows a tool's steps and the catalog checked against the dispatch registry; #95 the Lead projection golden; #93 and #95 `lead tool` and `lead mcp` classified)"}
  TLS-07: {section: "3.1 The catalog, v1", kind: requirement, tracked_by: [F15.1, F15.2], statement: "The v1 catalog: queries (status, resume, work_show, explain, harness_status), harness_wait, checkpoint, the stages ticket_draft, ticket_start, ticket_request_review, ticket_request_verification, ticket_prepare, the decision tool integration_publish, and the recovery-only cli; each with kind, class, primitive expansion, judgment inputs and build status (ticket_prepare and integration_publish designed, unavailable until M4-D/M4-E)"}
  TLS-08: {section: "3.1 The catalog, v1", kind: decision, tracked_by: [F15.2], statement: "Publication is not a stage and is never automatic because preparation succeeded; `integration_publish` is a single-primitive judgment-bearing decision tool, and a conditional `ticket_submit_integration --publish-if-clean` exists only if F15 §17's semantics are accepted"}
  TLS-09: {section: "3.2 Argument conventions", kind: requirement, tracked_by: [F15.1], statement: "Closed schemas (additionalProperties false); `expect_rev` required on every stage and absent on every query; free text travels as JSON data with no shell between model and engine; execution overrides are one optional object recorded as selected_by lead; a judgment-bearing override promotes the call to JUDGMENT_BEARING and never drops back; no credential is ever an argument and results are scrubbed", status: "done: F15.1-A (closed argument schemas, expect_rev on stages only, the execution object, no credential-shaped argument, scrubbed results, bounded checkpoint text)"}
  TLS-10: {section: "3.3 `StageResult` and `ActionProjection` (`schemas/surface.schema.json`, closed)", kind: requirement, tracked_by: [F15.1], statement: "The closed StageResult and ActionProjection schemas, with the stop boundary vocabulary; availability is tri-state AVAILABLE | BLOCKED | UNKNOWN, UNKNOWN is never rendered or treated as BLOCKED, and auto_runnable is false unless availability is AVAILABLE and the effective class is non-judgment-bearing", status: "done: F15.1-A (closed StageResult and ActionProjection; availability tri-state and separate from callable and auto_runnable; A3's policy_binding in place of the single digest)"}
  TLS-11: {section: "3.3 `StageResult` and `ActionProjection` (`schemas/surface.schema.json`, closed)", kind: requirement, tracked_by: [F15.1], statement: "Every well-formed call that reaches the runner returns a StageResult, Engine refusals and partial stops included; JSON-schema and transport validation failures are adapter input errors that commit nothing and never pretend to be Engine refusals; the MCP adapter sets isError from ok without discarding structured content", status: "done: F15.1 (#88 a StageResult for every well-formed call; #93 and #95 adapter input errors in both transports, isError from ok, BROKER_UNREACHABLE never a StageResult)"}
  TLS-12: {section: "3.3 `StageResult` and `ActionProjection` (`schemas/surface.schema.json`, closed)", kind: invariant, tracked_by: [F15.1], statement: "The projection is derived from accepted query surfaces and explicit local telemetry, exposes UNKNOWN where the Engine cannot yet answer, is not a second planner, and decisions never carry a default", status: "done: F15.1-A (aew.surface.projection: accepted query surfaces and local telemetry only, UNKNOWN for unqueryable guards, stable stage names with the primitive fallback, no defaults)"}
  TLS-13: {section: "3.4 Stop and retry rules", kind: gate, tracked_by: [F15.2], statement: "A stage is one tool call, not one atomic commit; mutating stages are not enabled on the normal Lead surface until the stage-intent journal is implemented"}
  TLS-14: {section: "3.4 Stop and retry rules", kind: requirement, tracked_by: [F15.2], statement: "The eight frozen rules: caller CAS on expect_rev; a durable StageIntent is the first commit; the first refusal stops with completed steps kept; a later STALE_REVISION retries once only for MECHANICAL or POLICY_RESOLVED steps in a non-judgment-bearing stage with an unchanged digest; judgment is never replayed; policy drift stops as STALE_POLICY; launch failure after committed dispatch stops as launch_failed; after crash or takeover `resume` surfaces nonterminal intents and a Lead chooses CONTINUE_STAGE or ABANDON_STAGE"}
  TLS-15: {section: "3.5 Classification and conformance", kind: requirement, tracked_by: [F15.1], statement: "A catalog entry has a base operation class and every invocation an effective one: any judgment input promotes to JUDGMENT_BEARING, a stage with a judgment-bearing primitive or Lead acceptance is judgment-bearing, POLICY_RESOLVED only when every consequential choice is policy-resolved, MECHANICAL has no unresolved choice, unknown fails closed to JUDGMENT_BEARING; retry logic uses the effective class", status: "done: F15.1-A (aew.surface.classify.effective_class: promotion by judgment inputs and declared primitives, never below the base, unknown fails closed)"}
  TLS-16: {section: "3.5 Classification and conformance", kind: evaluation, tracked_by: [F15.1, F15.2], statement: "Tests pin the catalog: closed valid schemas; every dispatching tool names a registered entrypoint and dispatch.launch and no non-dispatching tool names one; judgments declared and conditional promotion tested; built tools have runners and designed tools are refused; the normal advertised list stays under its byte budget and excludes recovery tools; ticket_draft is equivalent to its primitive sequence; the CLI transport returns the same contract"}
  TLS-17: {section: "3.6 What moves into the engine for M4-E", kind: requirement, tracked_by: [F15.2], statement: "Engine work before normal mutating stages: the StageIntent journal (hot while active, cold when terminal under ADR-0011; the durable source for partial-stage recovery), the policy/dependency digest and STALE_POLICY, queryable transition and ingest guards on the DispatchDecision substrate, policy-resolved review and verification card sets; plus `requires_disposition` as a gate input, `ticket_prepare` once M4-D's lease exists, and `ticket_submit_integration --publish-if-clean` on the queue"}
  TLS-18: {section: "4.1 Where the process runs, and custody", kind: requirement, tracked_by: [F15.1], statement: "The `aew-lead` MCP process runs in the TUI's curated environment with no Lead credential and no provider key, forwards each call as broker operation `lead.tool` over the existing bridge, and the broker runs the common runner under `dispatch.channel(\"lead_mcp\")`; bridge material is never accepted as a Lead credential; a closed broker yields STALE_AUTHORITY; there is no direct MCP authority mode and the process fails closed without a live broker", status: "done: F15.1 (#93 `lead.tool` under channel lead_mcp, lost authority answered from committed state, the bridge key refused as a credential; #95 the curated spawn, no direct mode, fail-closed start)"}
  TLS-19: {section: "4.2 Projection and probe changes (`harness/opencode/projection.py`, `capabilities.py`)", kind: requirement, tracked_by: [F15.1], statement: "The Lead projection declares the `aew-lead` local server as the pinned 2.0.18 schema spells it, LEAD_RULES allows its namespace, the system text names the typed surface as the normal path and primitive shell mutation as recovery, and the capability probe requires the MCP configuration keys from the served OpenAPI so a respelling fails closed", status: "done: F15.1-C #95 (the aew-lead server as 2.0.18 spells it, `aew-lead_*` allowed, the system text, the probe's MCP keys; the live 2.0.18 spawn check is F15.2)"}
  TLS-20: {section: "4.3 The protocol layer (`aew.surface.mcp`)", kind: requirement, tracked_by: [F15.1], statement: "A dependency-free newline JSON-RPC 2.0 stdio server: initialize with a known protocol revision, ping, profile-filtered tools/list with MCP annotations, tools/call returning StageResult as structuredContent with isError from ok; invalid arguments, unknown, designed or concealed tools are adapter input errors that commit nothing; stdout is protocol only", status: "done: F15.1-C #95 (aew.surface.mcp)"}
  TLS-21: {section: "4.4 Context cost", kind: requirement, tracked_by: [F15.1], statement: "Acceptance measures the normal advertised surface, which must stay under the 12,000-byte budget and 16-tool ceiling; recovery-only tools consume no normal prompt context; any saving claimed from progressive disclosure is measured against the pinned harness", status: "done: F15.1-C #95 (the normal list: 7 tools, under 12,000 bytes; the recovery escape not advertised)"}
  TLS-22: {section: "5. Transport B: CLI parity, recovery, and conformance", kind: requirement, tracked_by: [F15.1], statement: "`aew lead tool <name>` invokes the same catalog and runner and returns the same StageResult, routed through the broker inside a session; the generic cli action is catalogued but not advertised normally; stage commands as CLI verbs are not required and, if added, are generated adapters over the catalog, never a second semantic implementation", status: "done: F15.1-B (`aew lead tool`: the same catalog, runner and StageResult; inside a Lead session through the broker's `lead.tool`, outside with the operator's own credential; the generic cli escape catalogued and offered only on the recovery profile)"}
  TLS-23: {section: "6. The role surface (`aew-run`), designed only", kind: requirement, tracked_by: [F15.3], statement: "The separate `aew-run` server exposes the run bridge's whoami, check.run and submit as tools from a thin stdio client inside the sandbox; the supervisor keeps the credential; submit takes the report as a typed object with the evidence schema, ending the YAML-frontmatter failure class; not prototyped"}
  TLS-24: {section: "7. Dispatch conformance", kind: requirement, tracked_by: [F15.1], statement: "Dispatches through the typed surface carry channel `lead_mcp` (provenance only, never legality), `lead tool` and `lead mcp` are classified as non-dispatching commands, dispatching stages reach the registry through work_assign and invoke_create, and `explain` is Dispatch.decide on committed state", status: "done: F15.1 (#93 channels by ingress, `lead tool` classified; #95 `lead mcp` classified and a real dispatch through MCP recording lead_mcp; explain is Dispatch.decide on committed state)"}
  TLS-25: {section: "8. What ADR-0012 gives this surface", kind: requirement, tracked_by: [F15.1, E18], statement: "`harness_wait {runs[]}` blocks on the outbox wake file and checks run records and committed events; the ActionProjection behind `/attention` is recomputed when an affecting event lands and the same projection module serves StageResult, status, the dashboard and later the scheduler; the revision every result carries is the session's cursor"}
  TLS-26: {section: "9. The prototype: what is there, what it proves, what it does not", kind: requirement, tracked_by: [F15.1, F15.2], statement: "Everything the prototype did not build is required before the corresponding frozen behaviour ships: ticket_prepare, integration_publish, the StageIntent journal and STALE_POLICY, effective-class promotion, tri-state availability, queryable guards, policy-resolved card sets, wait-any via ADR-0012, the aew-run server, broker-only enforcement, recovery-profile filtering, the aew-lead rename, takeover-mid-session coverage, a live OpenCode 2.0.18 MCP spawn check and lead_mcp channel conformance"}
  TLS-27: {section: "10. Evaluation and completion criteria (for M4-E, from F15 §21)", kind: evaluation, tracked_by: [F15.2, F19], statement: "Hard gates: no false advance in the seeded corpus, an attributable durable record before every dependent transition, no normal mutating stage without a StageIntent, no automatic retry of judgment, anomaly catch at least the primitive baseline, recovery correctness across crash, retry, drift, takeover and mixed-mode walks; stage/primitive and query/execute equivalence, PrimitiveSpec coverage, bounded hot state. Reported, never traded: steps per Ticket, refusals, reads between mutations, help lookups, cached tokens, wall clock; measured by the preregistered dogfood against the M3 baseline with the primitive path as control"}
  TLS-28: {section: "11. Sequencing", kind: sequencing, tracked_by: [F15.1, F15.2, F15.3], statement: "M4-D: catalog/runner skeleton, broker lead.tool, broker-only MCP transport, read/query tools, ADR-0012 wait-any, CLI parity, conformance and profile filtering. M4-E: the StageIntent journal, drift binding, effective-class promotion, queryable guards, policy-resolved sets, governed mutating stages, ticket_prepare, integration_publish, equivalence tests, lead_mcp conformance, live MCP spawning. M4-H: the paired F19 evaluation. M6: aew-knowledge as a separate namespace"}
  TLS-29: {section: "12. Frozen designer decisions", kind: decision, tracked_by: [F15], statement: "The nine frozen decisions: review acceptance and verification dispatch stay one typed stage; generic cli is not a normal model tool; unqueryable actions stay visible as UNKNOWN; no direct MCP credential mode; StageIntent is mandatory before normal mutating-stage dogfood; the server is aew-lead with aew-run and aew-knowledge separate; the effective class is invocation-specific; transport validation and Engine refusal are distinct; publication gets a typed judgment tool. No designer-level question remains; operator adoption is the approval step", status: "done: adopted as governing on 2026-10-05, the before-M4-E gate"}
  TLS-30: {section: "13. Alternatives considered", kind: decision, tracked_by: [F15], statement: "Rejected: the broker itself speaking MCP over its socket, stage commands as CLI verbs first, an MCP SDK dependency, advertising the result schema per tool, a generic advance tool, the generic cli advertised normally, a direct MCP mode holding a Lead token, and boolean action availability"}
  # ---- PMP: project maps v0.3 (T5, designer) -----------------------------------------------------------------------
  PMP-01: {section: "1. Frozen architecture", kind: decision, tracked_by: [F22, F22.1], statement: "Three project-understanding mechanisms, composed but not conflated: the structural codebase map (deterministic Engine output from an exact Git commit plus the bounded metadata the generator actually parsed), semantic extensions (optional language/build-specific derived artifacts over exact source, build and toolchain inputs that add symbol, relationship, configuration and quality facts without redefining the core), and the architecture map (attributable investigator synthesis, role-attested evidence, never compiler- or engine-known truth); a stale, missing, partial or unsupported map never changes workflow authority, dispatch legality, gate satisfaction, publication legality or source truth"}
  PMP-02: {section: "3.3 Selection is not truth", kind: invariant, tracked_by: [F22.1, F22.2], statement: "A project-map pointer means the current navigation/context artifact for its capability, never that the artifact is project authority, that its statements are accepted fact, that it satisfies a workflow gate, or that it is admitted Knowledge; historical artifacts stay immutable and addressable by root digest and source binding, and map-registry history is attributable without becoming workflow history"}
  PMP-03: {section: "2.2 Canonical record", kind: requirement, tracked_by: [F22.1], statement: "`aew/codebase-map/v1`: an immutable, content-addressed artifact under the project-map namespace (`.aew/knowledge/maps/structural/`), with the envelope schema, source_revision, source_tree, generator (name, version, ruleset_sha256), inputs (path_listing_sha256 and the metadata blobs actually parsed, with digests), artifact_sha256, limits (tracked paths, metadata bytes, each with its cap) and sections"}
  PMP-04: {section: "2.2 Canonical record", kind: requirement, tracked_by: [F22.1], statement: "The generator reads Git objects (`git ls-tree -r <H>`, `git show <H>:<path>`, `git cat-file` or an equivalent object API), never the mutable checkout or index, so `--commit H` means exactly H whatever branch is checked out, whatever is staged or unstaged, and whichever worktree invokes it"}
  PMP-05: {section: "2.3 Structural sections", kind: requirement, tracked_by: [F22.1], statement: "The v1 sections, each bounded and deterministic: directories (summaries and structural labels from the path listing), languages (recognized and unknown counts by extension), build_descriptors (every recognized descriptor, never a guessed single build system), entry_point_candidates (labelled declared or convention), test_candidates (locations, runners and command families as proposal evidence only), generated_and_vendor (navigation and edit-avoidance hints from paths and `.gitattributes`, not write-deny policy), semantic_prerequisites (compile databases, tsconfig, pyright config, `.clangd`), limits_and_omissions"}
  PMP-06: {section: "2.3 Structural sections", kind: decision, tracked_by: [F22.1], statement: "Excluded from the canonical structural artifact: untracked or ignored workspace material, model-authored prose, inferred purpose or ownership, call/import/dependency graphs, runtime behaviour, semantic public-surface counts, semantic test-to-symbol relationships, and constraint text copied out of governing authority; symlink blobs are Git objects and generation never follows them into the host filesystem"}
  PMP-07: {section: "2.4 Structural freshness — input-sensitive, mechanically enforced", kind: requirement, tracked_by: [F22.1], statement: "Structural freshness binds the tracked path listing plus the metadata/configuration blobs the generator actually opened: a path added, deleted or renamed makes the map stale, a recorded metadata blob that changed makes the affected section stale, and a source-content-only edit with an identical listing and no recorded metadata change leaves the map current; the listing is itself an input, so new files cannot hide outside a pre-existing list"}
  PMP-08: {section: "3.1 Dedicated map registry", kind: requirement, tracked_by: [F22.1, F22.2], statement: "Map selection is durable derived state in its own registry (`aew/map-registry/v1`) with its own revision domain, `map_revision`: one selected root per capability (structural; one per semantic extension, never a monolithic semantic pointer; the architecture evidence id), each with its digest and source and generator or extractor bindings; selection CAS is `map_revision`, never `control_revision`, so a map refresh causes no workflow revision churn, invalidates no unrelated dashboard envelope and never reads as an engineering-state transition; the project manifest may locate or project the registry"}
  PMP-09: {section: "10. Architecture map", kind: requirement, tracked_by: [F22.1], statement: "The architecture map stays an investigator-produced discovery/evidence record from a bounded template (components, control/data boundaries, external services, cross-component flows, ownership candidates, relevant contracts and ADRs, evidence per claim), every claim attributable and evidence-bound; the Lead may select one as the current navigation reference, which certifies none of its statements; a stale reference is surfaced as stale and neither auto-dispatches an investigator nor blocks workflow; no architecture-map authority or K0 admission path exists"}
  PMP-10: {section: "4.1 Purpose and capability model", kind: requirement, tracked_by: [F22.2], statement: "Each semantic extension declares a capability matrix; facts carry the tier compiler_known, static_inference or unsupported, and an unsupported relation is explicit, never rendered as an empty factual answer"}
  PMP-11: {section: "4.2 Shared fact model", kind: requirement, tracked_by: [F22.2], statement: "Shared fact families symbol, containment, reference, configuration, quality and optional coverage (a runtime overlay, not static truth); relation kinds calls, calls_through, holds_pointer_to, imports, includes, uses_type, expands_macro, dependent, virtual and overrides; an extension emits only the relations it supports honestly"}
  PMP-12: {section: "5.1 First implementation priority", kind: decision, tracked_by: [F22.2], statement: "C/C++ is the first semantic extension (it improves AEW's expected navigation and impact workload and was probed on Rocky 8), on compiler-quality tooling; AEW writes no C/C++ parser and never infers call relationships from regular expressions or text scanning"}
  PMP-13: {section: "18. Research disposition", kind: decision, tracked_by: [F22.2, F19], statement: "The mapping research cycle is closed: the production C++ extractor's implementation language, tuning beyond the measured bounds, later Python/TypeScript/Go extensions, whether broad automatic serving earns its tokens, how much the impact surface improves planning, and any learned classifier ahead of deterministic routing are implementation or evaluation questions, not reasons to reopen T5; a concrete implementation contradiction may return as a design defect; v0.5 is the implementation contract"}
  PMP-14: {section: "3.4 Semantic artifacts are not ADR-0013 K0 references", kind: invariant, tracked_by: [F22.2], statement: "Structural and semantic map artifacts are derived project-map artifacts, not ADR-0013 `reference` Knowledge records merely for being useful or content-addressed: they live in the project-map namespace, are selected through the map registry, receive no knowledge_disposition lifecycle, never enter K0 to K3 admission automatically, and may be indexed by history only as a storage/audit convenience"}
  PMP-15: {section: "11.1 Safe bounded context", kind: requirement, tracked_by: [F22.1, F19], statement: "T5 freezes interfaces and safe bounds, not universal injection; the bounded context a pack may carry: the relevant structural directory rows, generated/vendor hints for paths already in scope, the selected map's freshness and coverage summary, the L0 semantic capability matrix, small L1 answers for already-declared subject symbols, and relevant test and constraint locators"}
  PMP-16: {section: "14. Non-goals", kind: decision, tracked_by: [F22], statement: "Not authorized or required: a universal cross-language semantic graph schema, an AEW-written C/C++ parser, semantic facts as workflow authority, K0 to K3 admission of maps by default, full graphs in packs, automatic architecture-map certification, policy or check creation from map observations, dispatch refusal solely for a stale/missing/partial map, a Project Profile document family duplicating KC §8, a Requirement Impact judgment artifact duplicating Plan Assurance, a third-language research cycle before implementation, structural sharding or a structural SQLite index at the measured scale, and pretending a derived index is evidence"}
  PMP-17: {section: "15. Frozen designer decisions", kind: decision, tracked_by: [F22.1, F22.2, F22.3], statement: "Thirty-nine frozen decisions (§15), each carried by the section entries of this source: the language-neutral core; Git objects as the source; mechanically tracked structural inputs; path listing as an input; bounded submodules, LFS and symlinks; untracked state excluded; `map_revision`; the closed `map_service`; maps not K0 records; composition only under compatible bindings; one root per semantic capability; contained extraction; compile commands as data; exact source materialization; compile-database provenance; the meaning of compiler_known; unit identity with negative resolution context; the fact tiers with PARTIAL and UNKNOWN visible; C/C++ first; the composite extractor identity; instances[] and the C++ relations; root manifests over chunks; canonical serialization; per-unit freshness; incremental indexed v1; bounded retention; no ambient graph; configuration-qualified relations; radius 1; distinct terminal states; candidates-only search; untrusted map text; assurance monotonicity; sibling indexes; attributable architecture maps; evidence-driven serving; no duplicate Profile/Impact layer; no further language research before implementation; M4-H's value gate first"}
  PMP-18: {section: "16. Implementation slices implied by this freeze", kind: sequencing, tracked_by: [F22.1, F22.2, F22.3], statement: "Implementation is sequenced in five slices without reopening architecture: T5-A structural core (F22.1), T5-B common semantic substrate and T5-C the C/C++ extension (F22.2, in that order), T5-D sibling indexes (F22.3), T5-E evaluation and serving experiments (with F19)"}
  PMP-19: {section: "7. Typed project-map query surface", kind: requirement, tracked_by: [F22.2], statement: "Agents query facts, never a graph dump, through one typed surface: map.symbol(name|id), map.callers(id, configuration?), map.callees(id, configuration?), map.includers(path), map.configuration(id|unit), map.evidence(from, to), map.neighborhood(id, radius=1, budget?), map.search(text|pattern); an extension adds facts and capabilities, not bespoke agent APIs, unless a genuinely different semantic shape cannot be represented honestly"}
  PMP-20: {section: "6.3 Incremental rebuild", kind: requirement, tracked_by: [F22.2], statement: "Rebuild from the dependency/resolution index: a changed positive input, resolution/search context, or compile/toolchain/extractor identity identifies the affected units, which alone are re-extracted; chunks are written or reused by content hash, a new immutable root is assembled canonically and the registry advances atomically only if adoption conditions still hold; a partially rewritten root is never exposed and a one-file change never rewrites the whole store"}
  PMP-22: {section: "9. Sibling derived indexes for project understanding", kind: decision, tracked_by: [F22.3], statement: "The test relationship index, the constraint locator index and the semantic public-surface projection are sibling, composed derived views beside the maps, never fields of the structural repository-shape artifact"}
  PMP-25: {section: "1. Frozen architecture", kind: invariant, tracked_by: [F22], statement: "The composition rule: structural core plus zero or more qualified semantic extensions plus optional sibling derived indexes is the effective navigation/context view, and no composed view becomes an authority source"}
  PMP-26: {section: "2.1 Purpose", kind: decision, tracked_by: [F22.1], statement: "The structural map answers cheap repository-shape questions without executing project code (where the code is, the repository's shape, languages and build descriptors, likely source/test/doc/config/generated/vendor areas, declared or conventional entry-point and test candidates, semantic-analysis prerequisites) and deliberately answers no semantic question (callers, ownership, runtime behaviour, purpose, inferred component meaning)"}
  PMP-27: {section: "2.4 Structural freshness — input-sensitive, mechanically enforced", kind: invariant, tracked_by: [F22.1], statement: "The declared input set comes from the generator's actual reads: every repository blob read while producing the canonical artifact flows through one input-tracking read API, and the artifact's metadata-input list is emitted from that tracker; acceptance includes the differential oracle (mutate each blob outside the recorded input set at an otherwise equivalent revision, regenerate, require byte-identical output), and an output change from an unrecorded input is an invariant failure, never a reason to widen a hand-kept list"}
  PMP-28: {section: "2.4 Structural freshness — input-sensitive, mechanically enforced", kind: requirement, tracked_by: [F22.1], statement: "Repository edge cases: a submodule gitlink is a tracked path plus object identity, never traversed unless mounted as a separately declared source with its own revision binding; Git LFS is seen as its pointer blob, materialized content only through a separately declared capability with bound identity; symlinks stay Git blobs and are never followed"}
  PMP-29: {section: "2.4 Structural freshness — input-sensitive, mechanically enforced", kind: requirement, tracked_by: [F22.1], statement: "Freshness between the selected tree A and the requested tree B is computed from Git tree/object differences and cached by the pair (A, B), so ordinary queries do not relist or reparse the repository; freshness is computed, never written back into the immutable artifact"}
  PMP-30: {section: "2.5 Scale", kind: evaluation, tracked_by: [F22.1], statement: "Measured structural support: about 0.11 s / 3.5 KB on AEW, 0.28 s / 18 KB at 10,000 files and 2.1 s / 162 KB at 100,000 synthetic files, with no sharding or structural index; directory output stays bounded and large or deep repositories are summarized; 100,000 files is the measured support point, and before T5-A claims very-large-repository support its acceptance includes a one-million-path benchmark or a representative repository at that scale (missing the bound changes the implementation, not the contract)"}
  PMP-31: {section: "3.2 Map-service custody", kind: requirement, tracked_by: [F22.2], statement: "Background or asynchronous map generation and adoption run under a project-scoped, non-model `map_service` principal on the closed-service pattern, writing only the closed family map.artifact.*, map.registry.* and map.index.*, with zero authority over work, plans, Lead generation, invocations, credentials, gates, integration/publication, and Knowledge admission or disposition; a Lead or operator may request generation, but adoption commits through the same closed path"}
  PMP-32: {section: "3.2 Map-service custody", kind: sequencing, tracked_by: [F22.2], statement: "The `map_service` principal's encoding belongs in an amendment to the authority/credential ADR (the `service` credential kind of ADR-0005, ADR-0013 D9); T5 freezes only the authority boundary, and map_service commits wait for that amendment"}
  PMP-33: {section: "3.5 Composition alignment", kind: invariant, tracked_by: [F22.2], statement: "Structural and semantic components compose into one effective view only when the query's required bindings are compatible (requested source_tree, semantic source_tree, and configuration and extractor/toolchain identity where relevant); mixed revisions are shown individually with explicit revision and freshness labels and reported as an explicit degraded result, never merged by inference"}
  PMP-34: {section: "4.3 Unit identity, compile-database provenance, and resolution context", kind: requirement, tracked_by: [F22.2], statement: "Facts bind to the unit they were interpreted under; for C/C++ a translation unit under one exact compilation and resolution context, its identity composed of source path, compile-command identity, compile-database provenance, ordered search/include roots, positive dependency identity, negative-resolution witness identity, toolchain/sysroot identity, configuration/generated-input identity and extractor identity; a file is a view over one or more units, and one file under materially different defines or include paths may yield different facts"}
  PMP-35: {section: "4.3.1 Compile-database provenance", kind: requirement, tracked_by: [F22.2], statement: "Every compile database records its provenance: generated_from_revision (AEW generated or observed it through a bound operation over the exact revision), observed_build (an attributable build observation with retained inputs and receipt) or operator_supplied_unbound (useful navigation input, never treated as proven to describe the revision); queries and freshness propagate the qualification"}
  PMP-36: {section: "4.3.1 Compile-database provenance", kind: invariant, tracked_by: [F22.2], statement: "compiler_known means known to the recorded compiler/toolchain under the recorded compile command and resolution context; it never means a shipped or deployed binary was built from that configuration, which is a separate evidence claim"}
  PMP-37: {section: "4.3.2 Negative dependencies and search-order freshness", kind: invariant, tracked_by: [F22.2], statement: "Unit freshness records an addition-sensitive resolution context (for C/C++: ordered project/generated include roots, listing digests sufficient to detect a newly shadowing candidate, absent/probed resolution witnesses where the extractor exposes them, toolchain/sysroot identity for external roots); a new path that could resolve earlier invalidates affected units though no positive input changed; an external root whose stability cannot be established makes them UNKNOWN, not CURRENT; CURRENT means both positive inputs and the negative resolution context remain valid"}
  PMP-38: {section: "4.4 Stable symbol identity and instances", kind: requirement, tracked_by: [F22.2], statement: "Each language chooses a stable identity scheme (for C/C++ compiler-quality identity such as Clang USR); the shared symbol shape carries instances[] (mangled name and units) for the emitted realizations of templates, inline definitions and multi-form constructors/destructors, empty where not applicable"}
  PMP-39: {section: "4.5 Composite extractor identity", kind: requirement, tracked_by: [F22.2], statement: "A published semantic artifact has one extractor identity even when extraction uses several compiler views: for C++ a composite extractor with a mandatory toolchain block (tool, version, gcc toolchain or sysroot, resource-dir digest) and versioned ast and codegen components with their options digests; each fact records fact.source ast | codegen; any material component, toolchain or option change makes a new extractor identity and a new immutable artifact"}
  PMP-40: {section: "4.6 Semantic root manifest and immutable chunks", kind: requirement, tracked_by: [F22.2], statement: "A semantic-map version (`aew/semantic-map/v1`) is an immutable root manifest over reusable content-addressed chunks (units, symbols, references), carrying the capability, source binding, extractor, compile-database provenance, configurations, the capability matrix, limitations and root_sha256; frozen properties: unchanged chunks are reused by hash, a localized rebuild never rewrites a full artifact, root publication is atomic, canonical ordering makes identical inputs under one extractor identity give a byte-identical root and chunk identities whatever the worker completion order, and deduplication by stable symbol identity is part of the representation contract"}
  PMP-41: {section: "4.7 Coverage and quality", kind: requirement, tracked_by: [F22.2], statement: "Extraction coverage (units extracted, failed or partial; relation families available) and execution coverage (symbols or lines exercised by one recorded run, an optional overlay bound to that run/binary/input/profile) stay distinct; every query answer carries the extraction quality and coverage needed to interpret it"}
  PMP-42: {section: "4.8 Extractor execution boundary and source materialization", kind: invariant, tracked_by: [F22.2], statement: "Semantic extraction is a code-execution-adjacent, repository-controlled workload that never runs against the authoritative checkout: it reads an exact source view of the revision (full read-only materialization, overlay/copy-on-write over an exact read-only source, or sparse/partial materialization only when its completeness for the extractor is established, otherwise it degrades or refuses rather than claim coverage)"}
  PMP-43: {section: "4.8 Extractor execution boundary and source materialization", kind: requirement, tracked_by: [F22.2], statement: "The extractor runs under a declared containment level; on Linux through the established containment and ProcessTree choke point with the source view read-only, private writable scratch/build/temp, outputs redirected to scratch, network policy declared, and no writable bind of the authoritative checkout or the real Git metadata; Windows keeps its truthful weaker label; a containment or source-view failure prevents satisfying semantic evidence and is never papered over by running against the real checkout"}
  PMP-44: {section: "Compile-command normalization", kind: invariant, tracked_by: [F22.2], statement: "compile_commands.json is data and its command strings never run through a shell: the engine builds a normalized argv from approved shapes, strips or rewrites output, depfile, diagnostic, profile and other side-effecting destinations into scratch, refuses dynamic compiler/plugin loading (-fplugin, -Xclang -load and equivalents) by default, refuses unsupported wrappers and shell-metacharacter semantics, keeps a semantic flag only when its meaning is represented in the extractor or configuration identity, and records every normalization or refusal in the extraction receipt; project compile metadata may describe how code was compiled but never grants host execution or arbitrary write destinations"}
  PMP-45: {section: "4.9 Map content is untrusted reference data", kind: invariant, tracked_by: [F22.2, F22.3], statement: "Repository-controlled paths, symbol names, diagnostics, comments, metadata strings and candidate command text stay untrusted data through every projection: delimited and typed as reference data for a model or UI, never prompt instruction; commands come only from approved typed command/check shapes and never interpolate repository strings; test candidates and command families stay candidates unless a policy or check definition authorizes a command; a dashboard 'Copy CLI' affordance renders from typed operations with escaped data arguments, never by concatenating map strings"}
  PMP-46: {section: "5.2 C boundary", kind: requirement, tracked_by: [F22.2], statement: "C answers distinguish direct calls, calls through a pointer or member, holds-pointer-to, and codegen-variable or synthesized effects rather than one flattened call graph; the probe under the exact compile command reproduced definitions and linkage at compiler level, agreed with compiler dependency output on includes and on direct call edges at about 99.4 to 99.5%, knew indirect call sites but generally not their dynamic targets, and located the AST/codegen boundary at synthesized calls, builtin folding and constant-folded branches"}
  PMP-47: {section: "5.3 C++ additions", kind: requirement, tracked_by: [F22.2], statement: "C++ uses the shared additions (symbol.instances[], reference kinds dependent, virtual and overrides, a mandatory extractor toolchain, fact.source codegen) and distinguishes the AST/source definition from the emitted or instantiated realization; for instantiation-level edge fidelity the production extractor uses a codegen-adjacent source (LLVM IR or object information) beside the AST component, which keeps declarations, scopes, source ranges, override relations and the classification of virtual and dependent sites; toolchain alignment is part of correctness"}
  PMP-48: {section: "5.4 Known limits stay visible", kind: requirement, tracked_by: [F22.2], statement: "Limits stay explicit in answers: unknown dynamic targets of function-pointer and member-pointer calls, dependent template calls unresolved until instantiation, a partial or failed translation unit weakening the answers touching it, unbuilt configurations never inferred, and AST/emitted-code differences for synthesized or folded behaviour; partial truth over convincing overstatement"}
  PMP-49: {section: "6.1 Semantic freshness is per unit", kind: requirement, tracked_by: [F22.2], statement: "Each unit records the identity that gave its facts meaning (source, positive transitive includes/imports, ordered search roots, negative-resolution witnesses or addition-sensitive root digests, compile command, compile-database provenance, defines/features, generated inputs, toolchain/sysroot, extractor, configuration) and is CURRENT, STALE, UNKNOWN (including an external resolution context AEW cannot prove equivalent) or PARTIAL (the last extraction completed with known limitations or errors)"}
  PMP-50: {section: "6.2 Artifact freshness is a summary", kind: requirement, tracked_by: [F22.2], statement: "A semantic artifact's freshness is reported as counts per state, never one repository-wide stale bit, and a query carries the freshness of the units and resolution contexts it actually touched"}
  PMP-51: {section: "6.4 Deterministic publication", kind: invariant, tracked_by: [F22.2], statement: "For fixed source/build inputs, resolution context, extractor/toolchain identity and configuration set, the semantic root and reachable chunks are canonically ordered and byte-deterministic, unaffected by worker completion order, scheduling, temporary file names or filesystem enumeration order; acceptance regenerates representative artifacts under reordered and parallel schedules and requires identical root and chunk hashes"}
  PMP-52: {section: "6.5 Scale consequences", kind: requirement, tracked_by: [F22.2], statement: "The semantic map needs from v1 per-unit incremental invalidation, negative-dependency/search-context invalidation, content-addressed chunk reuse, deduplication, an efficient derived query index and scheduled/background first-build semantics for very large repositories; the derived index (SQLite or another local structure for symbols, relations, unit membership, include fan-out, search roots and name/path search) is disposable and non-authoritative and its results resolve back to the immutable root/chunks/source evidence; S7's size extrapolation (tens of MB at about 10k TUs, about 100 MB at 50k, GB at 500k) is planning evidence to be measured, not a guarantee"}
  PMP-53: {section: "6.6 Retention and garbage collection", kind: requirement, tracked_by: [F22.2], statement: "Derived map artifacts are retained only while protected: every currently selected registry root, roots pinned by evaluation/evidence/debug records, and roots inside the configured retention grace period, with the chunks reachable from them; unreachable derived chunks and roots may be collected after the grace period, and GC never deletes project authority, Knowledge records, source history or evidence because a map is regenerable"}
  PMP-54: {section: "7.1 Configuration-qualified default behavior", kind: requirement, tracked_by: [F22.2], statement: "Relationship facts are configuration-qualified; a query without a configuration returns the one relevant configuration, named, or, with several, partitioned per-configuration results; a union or intersection view is only an explicitly labelled derived convenience and never stands in for one program configuration (map.callers never silently unions materially different builds)"}
  PMP-55: {section: "7.2 Answer contract", kind: requirement, tracked_by: [F22.2], statement: "Every answer carries the resolved subject, facts, evidence locators, fact tier and source, configuration, units touched, freshness, coverage/quality, limitations and boundary, and a terminal state SATISFIED, EXHAUSTED_BUDGET, NOT_FOUND or NOT_SUPPORTED; a resolved symbol with zero callers under complete covered facts is distinct from a language whose callers are unsupported"}
  PMP-56: {section: "7.3 Radius policy", kind: decision, tracked_by: [F22.2], statement: "The default neighborhood radius is 1; radius 2 or more needs an explicit budget/expansion request (measured: single-hop answers in the tens to hundreds of tokens, radius 2 on connected functions in the thousands); the whole graph is never ambient model context"}
  PMP-57: {section: "7.4 Search is candidates-only", kind: invariant, tracked_by: [F22.2], statement: "map.search locates candidate symbols and paths, never facts about behaviour; a candidate becomes an anchor only through exact resolution, then uses the typed relation surface"}
  PMP-58: {section: "8. Query routing and disclosure", kind: decision, tracked_by: [F22.2], statement: "Routing binds the target and requested answer shape, runs the cheapest deterministic query and expands only on a measured gap (an unresolved anchor, an unsupported relation, conflicting substrates, radius 1 failing to connect anchors, stale or partial touched evidence, a flat or noisy discovery set); the router chooses queries and never manufactures facts; model reasoning is for synthesis, stalled expansion choices or judgment; no learned classifier sits in front of cheap exact queries"}
  PMP-59: {section: "9.1 Test relationship index", kind: requirement, tracked_by: [F22.3], statement: "A rebuildable derived index from test file or test id to referenced paths, symbols or components and the configured check lane where known, using symbol relationships when semantic facts exist and explicitly weaker path/name evidence otherwise; it never makes a test required, which stays with policy and check configuration"}
  PMP-60: {section: "9.2 Constraint locator index", kind: requirement, tracked_by: [F22.3], statement: "A deterministic locator index over oracle-rule ids, invariant-index ids, schema fields, guardrail entries, ADR sections, requirements-ledger ids and amendment-index entries, storing locators and searchable terms, never rewritten constraint prose; authority stays with the underlying document"}
  PMP-61: {section: "9.3 Public-surface projection", kind: requirement, tracked_by: [F22.3], statement: "Per-directory or per-component public-surface counts or lists are a semantic projection derived from semantic facts when available, never a required field of the language-neutral structural artifact"}
  PMP-62: {section: "11.2 Default serving rule", kind: requirement, tracked_by: [F22.1, F22.2, F19], statement: "The semantic graph is never injected wholesale: packs carry only cheap exact or local information and trace/neighborhood expansion stays with the typed tools; any further automatic serving must earn its cost through F19; a stale map may serve labelled navigation where policy allows, but consequential claims are re-established against current source and evidence; every map-derived string in context is delimited reference data under §4.9's rules"}
  PMP-63: {section: "12. Relationship to project profile and requirement impact", kind: decision, tracked_by: [F22, F30], statement: "T5 is the substrate: authoritative sources → structural map → semantic extensions and test/constraint locators → the existing KC §8 maps and WC §16.15 guardrails → a deterministic requirement impact surface → Plan Assurance premises and first-pass reasoning → investigation when evidence gaps require it; T5 creates no Project Profile authority layer and no second Plan Assurance artifact family"}
  PMP-64: {section: "12.1 Impact is downstream, not a map artifact", kind: requirement, tracked_by: [F30], statement: "The downstream capability is a deterministic impact surface, not a semantic-authority document: its inputs may include resolved requirement seeds, radius-1 affected units, tests, constraint locators, configurations, writer/ownership candidates, coverage/limitations and NOT_FOUND items, while judgment about risk, scope, unknowns and load-bearing premises stays with the existing Plan Assurance and Lead mechanisms"}
  PMP-65: {section: "12.2 Frozen downstream dispositions from S8", kind: decision, tracked_by: [F30], statement: "For the later impact design: `aew impact` is one deterministic operation used explicitly by the Lead and automatically by Plan Assurance; radius 1 by default, radius 2 explicit and budgeted; Epic-level analysis may use structural directory roles before component records exist, reporting reduced coverage; impact-derived investigator triggers stay advisory during evaluation while Plan Assurance's hard triggers and protected conditions stay hard; an initial promotion decision may use about 20 to 30 stratified real historical changes, including cross-cutting ones; created files are reported separately; none of this must land with T5"}
  PMP-66: {section: "12.3 Assurance monotonicity", kind: invariant, tracked_by: [F30, F14], statement: "A map-derived absence, narrow radius result, missing relation, partial coverage, unsupported language/configuration or NOT_FOUND may not by itself lower a Ticket/Story risk class, waive or remove a required gate, narrow a protected/preservation obligation, establish that no broader impact exists, or turn an unknown premise safe; positive evidence may add triggers, expose contradictions or support raising assurance; lowering stays an explicit Lead/policy-authorized judgment backed by more than a map's absence; impact output presents coverage, unsupported capabilities, STALE/PARTIAL/UNKNOWN units and unresolved seeds before its affected units"}
  PMP-67: {section: "13.1 Mapping evaluation", kind: evaluation, tracked_by: [F22.1, F22.2, F19], statement: "Structural evaluation: deterministic output across checkouts, exact Git-object binding, input-sensitive freshness, bounded size and time, surfaced omissions. Semantic evaluation: symbol/definition accuracy, relation precision and coverage per fact kind, build/configuration identity correctness, unit freshness and partial extraction, answer qualification, rebuild cost after localized and high-fan-out edits, and the C/C++ extractor oracle on every material extractor or toolchain change. Serving evaluation: tokens, model calls, task success, scope mistakes and rework, the stale/unsupported hallucination rate, and map-assisted roles against source-search/grep-only baselines"}
  PMP-68: {section: "13.2 F19 / M4-H", kind: sequencing, tracked_by: [F22, F19], statement: "T5 never postpones AEW's product-value gate: the structural map and any minimal navigation support needed to make the M4-H experiment representative may land before the gate; full semantic mapping, Project Profile, impact analysis and Knowledge expansion are not prerequisites unless the experiment shows they are needed for representativeness; after the gate each increment (structural map, semantic map, impact surface, recall, other intelligence) earns inclusion by ablation where practical"}
  PMP-69: {section: "T5-A — Structural core", kind: requirement, tracked_by: [F22.1], statement: "T5-A: `aew/codebase-map/v1`; generation from Git objects; the input-tracking structural read API; path-listing plus tracked-metadata freshness; submodule, LFS and symlink behaviour; the immutable structural artifact with map-registry selection; `map show`, `map diff` and `map generate`; deterministic caps and omissions; the differential unrecorded-input oracle; the existing 100k regression plus a 1M-path or representative very-large-repository measurement before claiming that scale"}
  PMP-70: {section: "T5-B — Common semantic substrate", kind: requirement, tracked_by: [F22.2], statement: "T5-B: `aew/semantic-map/v1`; the capability, fact and quality schemas; `aew/map-registry/v1` and `map_revision`; the closed `map_service` writer boundary; root-manifest plus content-addressed chunk publication; the canonical serialization/determinism oracle; the unit, configuration, extractor and compile-database provenance schema; the derived local query index; retention/GC reachability; the typed map.* surface with configuration partitioning and terminal-state semantics. T5-B settles root/chunk storage and the registry semantics before T5-C writes production semantic artifacts"}
  PMP-71: {section: "T5-C — C/C++ extension", kind: requirement, tracked_by: [F22.2], statement: "T5-C: exact semantic source-view materialization; the containment profile through the isolation/ProcessTree choke point; the compile-command argv parser and normalizer with side-effect redirection and plugin-load refusal; compilation-database discovery and provenance binding; the positive dependency plus negative-resolution/search-context index; the composite AST plus codegen extractor identity; USR symbols with emitted instances; the C/C++ relation kinds; per-unit/resolution-context freshness and incremental rebuild; the C and C++ oracle suites; hostile compile-command and authoritative-checkout mutation tests. Its start gate (containment/source-view rules, compile-database provenance, negative-dependency freshness and map-registry revision/custody adopted) is met by v0.5's adoption (2026-10-05)"}
  PMP-72: {section: "T5-D — Sibling project-understanding indexes", kind: requirement, tracked_by: [F22.3], statement: "T5-D: the bounded test relationship index, the constraint locator index, the semantic public-surface projection and untrusted-string projection tests, with no new authority semantics"}
  PMP-73: {section: "T5-E — Evaluation / serving experiments", kind: evaluation, tracked_by: [F22.1, F22.2, F19], statement: "T5-E: map-assisted against source-search baselines; pack L0/L1 experiments; configuration, mixed-revision and degraded-answer cases; F19-compatible measurements; and later impact-surface evaluation without making it a T5 authority artifact"}
  PMP-74: {section: "17.1 Invariants", kind: invariant, tracked_by: [F22.1, F22.2, F22.3], statement: "T5-INV-01 no map authority; 02 authenticated currentness (CURRENT derivable from the complete positive and negative input identity); 03 contained extraction (never mutating the authoritative checkout or using it as a writable build target); 04 unsupported is not empty; 05 no silent mixed view; 06 negative evidence cannot lower assurance; 07 map text is data; 08 deterministic artifact identity; 09 configuration identity survives storage, query and projection; 10 qualification survives every projection; 11 closed map writer; 12 compile metadata cannot grant host execution. Intended for the X1/X2-style registries and the implementation oracles"}
  PMP-75: {section: "17.2 Stable failures / reason codes", kind: requirement, tracked_by: [F22.1, F22.2], statement: "Stable reason codes with fixed meanings (surface presentation is a detail): SEMANTIC_SOURCE_MISMATCH, SEMANTIC_INPUT_UNBOUND, SEMANTIC_UNSAFE_COMPILE_OPTION, SEMANTIC_CONTAINMENT_UNAVAILABLE, SEMANTIC_SOURCE_VIEW_INCOMPLETE, SEMANTIC_INPUT_CHANGED, SEMANTIC_RESOLUTION_CONTEXT_STALE, MAP_UNSUPPORTED_RELATION, MAP_MIXED_REVISION, MAP_CONFIGURATION_REQUIRED, MAP_ARTIFACT_NONDETERMINISTIC, MAP_UNTRUSTED_EXECUTION_ATTEMPT, MAP_ASSURANCE_DOWNGRADE_FORBIDDEN, MAP_SERVICE_SCOPE_VIOLATION, MAP_CURRENTNESS_UNPROVEN"}
  # ---- IBU: installation, bootstrap and first-run UX v0.3 (T10, designer) --------------------------------------------
  IBU-01: {section: "1.1 Frozen bootstrap principles", kind: requirement, tracked_by: [F18], statement: "Thirteen frozen principles: bootstrap proposes and the operator authorizes; one proposal, one attributable atomic apply; static discovery only before trust (no project code executed); AEW owns only AEW-scoped integration state; generated configuration is non-secret and regenerable; doctor diagnoses and never mutates; supported means a qualified pin; air-gap completeness is an artifact property; upgrade and project migration are separate; Q12 stays open; harness launch and model access are separate contracts; organization qualification cannot bypass AEW conformance; corporate PKI stays supervisor-side"}
  IBU-02: {section: "2. Survey: patterns worth borrowing [doc], and what each would mean for AEW", kind: decision, tracked_by: [F18], statement: "Patterns adopted with their AEW translation: pinned isolated install, tiered doctor with remedies, propose-then-apply init, generated ignored configuration fragments with the user's global config untouched, evidence-reporting repository detection, first-class non-interactive mode, fail-closed capability probing, hashed offline bundle with a verifier, explicit migratable upgrade, project-supplied configuration never loaded into runs. Not borrowed: curl-pipe-shell installers, auto-update, writing into the user's harness directories, a GUI installer"}
  IBU-03: {section: "3. The proposed workflow", kind: requirement, tracked_by: [F18.1, F18.2], statement: "The workflow install → doctor → `aew init` (inspects repository, authority candidates, harnesses, credential variable names, existing `.aew/`; writes `.aew/local/init-proposal.yaml`) → operator review → `aew init --apply` (applies only accepted proposals) → project doctor → `aew opencode --acquire` → first Ticket; the operator decides harness pin, provider/model, authority classification, check commands and containment weakening; AEW derives evidence without executing code, proposes and never applies silently, and automates only local structure, the proposal file, non-secret fragments and deterministic probes; restart points are named"}
  IBU-04: {section: "3.1 Organization launch and provider-access integration", kind: decision, tracked_by: [F18.4], statement: "Deployments with an organization wrapper for harness launch, PKI and an internal OpenAI-compatible gateway are consumed through two narrow contracts, harness launch provider and provider access profile; AEW does not replace that machinery"}
  IBU-05: {section: "Harness launch provider", kind: requirement, tracked_by: [F18.4], statement: "The execution profile selects a qualified harness pin (adapter, version, qualification, launch_provider ∈ direct_binary | airgap_bundle | organization); an organization provider may resolve, install and start the approved binary with its own ceremony but decides no workflow state and satisfies no conformance by assertion; after launch AEW independently verifies the effective harness identity, schema fixture, capabilities, generated configuration, containment and readiness"}
  IBU-06: {section: "Harness qualification manifest", kind: requirement, tracked_by: [F18.4, E35], statement: "Qualification data (`aew/harness-qualification/v1`: artifact digest, protocol fixture, capability results, conformance results, qualifying authority) lives outside adapter source so an organization can adopt a new pin without an AEW release; AEW-shipped and organization-approved qualifications satisfy the same mandatory minimum conformance contract, may be stricter, and may not waive custody, authority or compatibility properties"}
  IBU-07: {section: "Provider access profile", kind: requirement, tracked_by: [F18.4, F28], statement: "Model access is a `provider_access` profile (id, protocol, transport, auth kind) holding no secret; the expected path is harness → secretless local endpoint → T6 shim → supervisor-owned provider relay → organization mTLS helper → internal gateway; the model-controlled harness never receives mTLS private keys, client credentials, bearer tokens or PKI secrets, and gets only placeholder material where an SDK syntactically requires a key"}
  IBU-08: {section: "Organization integration qualification gate", kind: gate, tracked_by: [F18.4], statement: "Before organization launcher/provider integration counts as supported, one bounded live qualification proves: an exact organization-qualified pin launches through the real wrapper; AEW independently verifies pin, schema and capabilities; a real model request completes through the internal gateway; one AEW-relevant tool-call round trip succeeds; the production path uses the supervisor-side relay; PKI and launcher secrets are absent from model-controlled state; run termination cleans up wrapper children per the process-ownership contract"}
  IBU-09: {section: "4. Configuration ownership model", kind: requirement, tracked_by: [F18.1, F18.4], statement: "The ownership table: per-run harness configuration inline under the run directory; the Lead session's configuration generated and isolated with a non-secret rendered copy carrying inputs_sha256; the operator's and the project's harness files untouched and not loaded into runs; AEW policy only through attributable apply; qualified skills per invocation; qualification manifests from AEW or the organization; organization launch and provider-access configuration owned by the organization with AEW storing ids and non-secret selections only; each visible to the operator through a named command or doctor row"}
  IBU-10: {section: "4. Configuration ownership model", kind: decision, tracked_by: [F18.1, F18.2], statement: "Rejected: patching user configuration, a global configuration, a generated include; the wrapper configuration (projection plus disabled project config or a private harness home) is the model. Conflict detection is a doctor row; supported sessions inherit no ambient plugins, instructions, MCP servers, skills or policy layers; a future `--allow-user-config` mode must be labelled customized and outside conformance and evaluation; only `.aew/local/integration` is regenerated, and input hashes exclude secret values"}
  IBU-11: {section: "Connected developer environment", kind: requirement, tracked_by: [F18.1, F18.2], statement: "Connected profile: `pipx` or `uv tool install aew==X`; doctor names missing pieces with the host's install command, finds the harness binary and checks it against TESTED_VERSIONS (newer is WARN, older or V1 is ERROR), and verifies the selected provider profile without exposing values; under `proxy_only` the relay consumes the real credential and the harness gets none; `--online` verifies gateway readiness separately; upgrade is `pipx upgrade`, doctor, then `aew migrate` if required"}
  IBU-12: {section: "Rocky 8 / air-gapped deployment", kind: requirement, tracked_by: [F18.3], statement: "The bundle `aew-bundle-<version>-rl8-py311.tar` holds the wheel and complete wheelhouse, only qualified harness pins, qualified capability assets and a canonical manifest recording every artifact's path, type, size, digest, platform and pins; install verifies the signed manifest before consuming anything and installs only listed wheels; the verifier rejects traversal, duplicates, unexpected types and mismatches; doctor proves no hidden fetch with the network unshared; tool upgrade and project migration are separate with a declared restore point; `aew doctor --bundle --json` is the host acceptance record"}
  IBU-13: {section: "5.1 Bundle signature and trust root", kind: requirement, tracked_by: [F18.3], statement: "The bundle signing key is release/distribution authority, not a Lead, provider or runtime credential; a detached signature over the canonical manifest is sufficient for v1 only if the trust root is provisioned independently of the bundle, the manifest commits to every consumed artifact, the verifier rejects traversal, duplicates and mismatches, and installation consumes only verified listed artifacts; the runtime never holds the signing key"}
  IBU-14: {section: "6. `aew doctor`: the rows", kind: requirement, tracked_by: [F18.2], statement: "Doctor rows with ERROR (launch refuses), WARN (degraded, labelled) and INFO tiers and a one-line remedy each, covering OS and kernel, Python, filesystem, git, harness qualification and launch provider, harness binary, protocol and supported pin, containment, provider access and gateway, build and test configuration, AEW schema version, generated integration configuration, offline completeness, permissions and account layout, and project harness files present but ignored"}
  IBU-15: {section: "6.1 Doctor execution semantics", kind: requirement, tracked_by: [F18.2], statement: "Default doctor runs every local, bounded, non-mutating check needed to predict launch safety, including the harness dry start and schema probe under isolated configuration and the narrowest network mode; external traffic only under `--online`; expensive checks may cache by inputs_sha256 but launch never trusts a cache in place of its own probe; any ERROR exits non-zero, WARN-only exits zero unless `--strict`, `--json` carries the same ids, severities and remedies, and doctor never auto-fixes or rewrites policy"}
  IBU-16: {section: "7. First-run failure and recovery UX", kind: requirement, tracked_by: [F18.1, F18.2], statement: "Every refusal names its doctor row and remedy; a failed `init --apply` applies nothing and leaves the proposal inspectable; a stale proposal is refused and regenerated, never partially rebased; a failed launch points at the doctor finding id and performs no repair; `aew doctor --todo` lists ERROR and WARN rows in fix order; there is no daemon to restart"}
  IBU-17: {section: "8. Ownership of the work", kind: decision, tracked_by: [F18], statement: "Ownership: the proposal mechanism and `init --apply` in the engine; doctor rows, remedies, `--bundle`, `--online`, `--todo` and the dry probe in `doctor.py`; harness discovery, version checks, generated fragments and per-run homes in the adapters; qualification manifests in the capability registry and conformance; organization launch and gateway access behind AEW's contracts; the wheelhouse, bundle manifest and signing in packaging and release work; host, account and session topology in F18 after Q12; a first-run checklist view in a later UI"}
  IBU-18: {section: "9. Non-goals", kind: decision, tracked_by: [F18], statement: "Non-goals: an installer platform (GUI, package hosting, self-update, marketplace); replacing organization distribution or PKI infrastructure; owning or persisting PKI private material; bootstrap mutation of user or project files outside AEW-owned state; persisted provider secrets in project or generated configuration; multi-project orchestration or a global state directory; guessing and applying a test command"}
  IBU-19: {section: "10. Frozen designer decisions", kind: decision, tracked_by: [F18], statement: "Thirteen frozen decisions: init always materializes a proposal and no blanket `--yes` accepts consequential choices; proposals carry proposal_id and inputs_sha256 with atomic apply refusing stale or expanded proposals; static before trust; Lead isolation with any customized mode explicit and outside conformance; the dry probe runs on normal project doctor; a separate release signing identity with a detached manifest signature; the sanitized exact-pin OpenCode catalog seed; support by qualified pin from AEW-shipped or organization-approved manifests; organization launch and provider seams as first-class contracts without workflow authority; the existing internal gateway plus mTLS helper as the intended provider path needing one tool-call custody qualification; Codex shipped only after T9 qualification; previous-environment rollback only before project migration; T5 and Q12 dependencies stay soft. No designer-level question blocks the bootstrap and doctor shape; F18 stays unscheduled until Q12"}
  IBU-20: {section: "Targeted follow-up evidence", kind: evaluation, tracked_by: [F18.4], statement: "No broad research thread; if the independent researcher is used, one bounded live task exercises a qualified pin through the real organization wrapper and provider path and records the endpoint family, tool-call round trip, effective model and profile, mTLS helper boundary and the absence of PKI material from the model-controlled process, as qualification evidence that does not reopen T10 unless it contradicts the contracts"}
  # ---- RIT: remote integration target sketch (T8) --------------------------------------------------------------------
  RIT-01: {section: "1. What changes and what does not", kind: requirement, tracked_by: [F23, Q14], statement: "Under a remote target the publication point is the provider's merge: DONE is observed, not declared at publish, and the merged commit may differ from the candidate; the candidate's base is the remote head that moves without AEW's CAS; reconcile must ask the provider or fetch the remote ref and tolerate an unreachable provider; prepare, post-integration verification on the candidate, the acceptance binding recheck and retirement ending write authority stay as ADR-0004 has them"}
  RIT-02: {section: "2. `integration.target`", kind: requirement, tracked_by: [F23, Q14], statement: "A project policy `integration.target: local | remote` (file not decided) with, for remote, the provider adapter name, remote, protected branch that AEW never pushes directly, `merge_method: observe` (the provider's merge settings are recorded, not chosen) and a poll interval; `local` is today's behaviour unchanged"}
  RIT-03: {section: "3. The saga with a remote target", kind: requirement, tracked_by: [F23, Q14, F33], statement: "The remote saga: fetch and merge onto the remote head, push the candidate to `refs/aew/candidates/<T>-<n>`, record `proposing`, open a proposal through the adapter, wait in `observing` by polling status (a moved base makes the candidate stale as a moved ref does today), on `merged {M'}` fetch and verify that M' contains the candidate, record the integration commit and proposal, sync the authoritative worktree and complete with a record naming M'; reconcile checks provider and git, retires a closed proposal as discarded, and reports `INTEGRATION_TARGET_UNREACHABLE` while staying in observing"}
  RIT-04: {section: "4. The provider adapter interface (sketch)", kind: requirement, tracked_by: [F23, Q14], statement: "One narrow `IntegrationTarget` adapter per provider (push_candidate, open, status, close, fetch) that holds no AEW credential and keeps the operator's provider token out of AEW state and out of the Lead model's reach; status is polled, never streamed; nothing the adapter returns is evidence, and a merged state is confirmed by fetch and ancestry before DONE; it belongs in neither the harness adapter, the Lead broker nor the supervisor"}
  RIT-05: {section: "5. Questions for the designer (only two, both blocking for scope)", kind: open-question, tracked_by: [Q14], statement: "Is a remote (PR) integration target wanted before internal alpha? When the provider's merge commit differs from the candidate, does DONE require a second post-integration verification on M', or is verification on M plus containment enough?"}
  RIT-06: {section: "6. What M4-D should not foreclose", kind: requirement, tracked_by: [F10, F23, Q14], statement: "M4-D's records must allow a candidate open against a base that is not the local branch head (the lease held through proposing and observing, or released and re-acquired); `integration.status` stays an open string set so `proposed` and `observing` are additive; the Completion Record has room for an integration commit that differs from the candidate"}
  RIT-07: {section: "Not decided here", kind: open-question, tracked_by: [Q14], statement: "Undecided: the first provider (GitHub is the obvious one; Bitbucket is the contract's example), whether AEW ever merges through the provider's API with a sha precondition (restoring a CAS-like publication point and an immediate DONE), and how the proposal's CI checks relate to AEW's own post-integration verification as two evidence sets with different trust labels"}
  # ---- KSI: the knowledge service identity spike (D9) ----------------------------------------------------------------
  KSI-01: {section: "1. The boundary, as built", kind: requirement, tracked_by: [F21, E37], statement: "A fourth credential kind `service` with the same form, verifier, issuance and revocation fields as lead, invocation and handoff_offer; scope `{service, family, issued_by}` with no generation, because the credential grants no Lead authority a generation could supersede; `SERVICE_FAMILIES` is the only registry of principals"}
  KSI-02: {section: "1. The boundary, as built", kind: requirement, tracked_by: [F21, E37], statement: "The credential is issued, rotated and revoked only by the Lead (`aew service issue|revoke|show`, Lead transitions with `--expect-rev`); rotation revokes the previous credential in the same commit; the secret is printed once and never shown again; at most one live credential per service (oracle rule 30)"}
  KSI-03: {section: "1. The boundary, as built", kind: requirement, tracked_by: [F21], statement: "`Kernel.service_txn` beside `lead_txn`: `require_service` (kind, not revoked, bound to the family, no generation check), compare-and-swap, v2 required, the manifest pin check and finalizers, one commit, with `archival=False` so a service commit archives nothing, ends no credential and prunes nothing; `actor_txn` routes a knowledge command by credential kind and the result names the actor"}
  KSI-04: {section: "1. The boundary, as built", kind: invariant, tracked_by: [F21], statement: "Closure is enforced in the control store's commit path before validation and disk writes by comparing states: under a service actor only the family's hot keys and counters may change, every staged or pre-written record path must be under `knowledge/` or `history/`, the op must carry the family prefix, and an unknown family is refused; a violation is `TRANSACTION_CLOSURE` with control.yaml unchanged and no redo record, whatever layer asked"}
  KSI-05: {section: "1. The boundary, as built", kind: invariant, tracked_by: [F21], statement: "Custody as for the Lead: the broker refuses `service issue` as credential-emitting, `AEW_SERVICE_TOKEN` never reaches a worker's environment, the secret is written to no file, and because handoff and takeover revoke only lead and handoff_offer kinds the service credential survives rotation by construction and the new Lead may revoke it"}
  KSI-06: {section: "2. What it is not, and why it is not a second Lead", kind: invariant, tracked_by: [F21], statement: "The service principal cannot acquire, offer, accept, take over or release the seat, has no generation, is refused by require_lead and require_invocation, cannot mint or extend itself, cannot change work, invocations, tokens, lead or any counter but its own, writes nowhere but knowledge/ and history/, archives nothing, and is durable but not sovereign: the Lead issues, rotates and revokes it and every credential it ever had is recorded"}
  KSI-07: {section: "3. The seven properties, as tests (`tests/integration/test_service_identity.py`)", kind: evaluation, tracked_by: [F21], statement: "The designer's seven properties each hold as a test: a distinct principal through the existing verifier; a legitimate Case, disposition and receipt transaction; closure enforced by the store whatever layer asked; mutations of work, invocation, Lead, credential and token refused before commit; handoff and operator takeover leave the principal valid; the secret reaches no file, output or agent environment; and the smallest amendment is written out. Passed on Windows and on Rocky 8 with the takeover through a real pty"}
  KSI-08: {section: "4. The smallest amendment (for the designer; not written into the live documents)", kind: requirement, tracked_by: [E37], statement: "The amendment text to adopt: ADR-0005 gains a fourth credential kind `service` with the properties above, one closed transaction family per principal enforced at commit, and the Lead's custody rules; ADR-0009 gains one sentence that a harness run never receives a service credential and the broker refuses `service issue`; ADR-0013 D9 is reworded accordingly and states that a service transaction archives nothing; oracle rule 28 becomes an enforced property", status: "done: landed 2026-10-05 as ADR-0005's amendment, ADR-0009's custody sentence and environment-trust row, and ADR-0013 D9 (the closure rule is ADR-0013's rule 29 in the final numbering; the spike's rule 30 is ADR-0013's rule 33); the implementation is M6b's (F21)"}
  KSI-09: {section: "5. Decisions the spike made that the designer may reverse", kind: open-question, tracked_by: [E37], statement: "Reversible choices: the closure is a static table in the store, not data in the credential's scope; a service transaction never archives; `actor_txn` routes by credential kind; the knowledge block and its counters are the whole hot surface the service may touch; rotation is Lead re-issuance with no self-rotation and no expiry. Open: whether a service credential should expire (`expires_at` exists and is unused) so a forgotten principal dies on its own", status: "done: decided by the designer (2026-10-05): no mandatory expiry in v1 and expires_at stays unused; the other choices stand and go into E37's amendment text"}
  # ---- CXS: C/C++ semantic extraction (S1) --------------------------------------------------------------------------
  CXS-01: {section: "2. Results [probe]", kind: evaluation, tracked_by: [F22.2], statement: "The acceptance oracle for a C extractor is the build's own objects: `llvm-nm` for definitions and linkage, `llvm-objdump -d -r` for direct call edges, `clang -M` for includes, `clang -dM -E` for macros; libclang under the compile database reproduced 100% of definitions and linkage, 100% of includes and 99.4 to 99.5% of direct call edges on zlib and curl, with parse quality measurable per translation unit; execution coverage (`llvm-cov`) joins by symbol name as run-bound evidence", status: "absorbed-by: PMP-12 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXS-02: {section: "3. The boundary, exactly [probe → inference]", kind: requirement, tracked_by: [F22.2], statement: "Every fact a semantic extension emits carries one of three tiers: compiler-known (declared symbols, definitions, linkage, includes, macros in effect, build defines, direct call sites with their callee, indirect sites with the pointer they go through, where function pointers are stored, coverage from a run), partial static inference (full caller sets, full callee sets with the memcpy and constant-folding exceptions, dead code), unsupported (who calls through a pointer, unbuilt configurations, units that did not parse); every discrepancy class is named: compiler-synthesized calls, builtin-inlined libc, constant-folded branches, asm-label renames, unused statics, indirect calls, dispatch tables, macro-mediated calls, configuration scope", status: "absorbed-by: PMP-11, PMP-12 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXS-03: {section: "4. Facts about scale and shape that bear on S2–S4 [probe]", kind: requirement, tracked_by: [F22.2], statement: "Per-unit dumps are about 100× redundant, so the artifact must be a deduplicated symbol table by USR plus per-unit membership and facts; the same source file is several translation units with their own defines, so facts are per unit and a file-level answer names its configuration; header fan-out from `clang-scan-deps` (median 21 units, a handful reach every unit) is the input-sensitivity data for incremental freshness; the Python walk dominates cost at about 0.1 s per unit", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXS-04: {section: "5. Recommendations for the design [rec]", kind: requirement, tracked_by: [F22.2], statement: "Use libclang or clangd's index as the extractor and write no parser; record three edge kinds (calls, calls_through, holds_pointer_to) and never a merged list that pretends completeness; label memcpy-class and builtin edges codegen-variable; every fact carries its unit and that unit's configuration identity; mark parse quality per unit and propagate it to every answer; coverage is an optional run-bound overlay joined by symbol name", status: "absorbed-by: PMP-11, PMP-12 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXS-05: {section: "6. Not shown [hyp]", kind: open-question, tracked_by: [F22.2], statement: "Not measured here: C++ (answered by the C++ contract check), optimized builds (extraction unaffected, the objdump oracle is not), scale beyond 1,400 units (extrapolated in the large-repository benchmark), and whether `clang-scan-deps` sets equal libclang's include sets path by path"}
  # ---- CXP: the C++ contract check (S1b) ----------------------------------------------------------------------------
  CXP-01: {section: "2. The designer's nine items, each with what the probe showed and what the contract needs", kind: requirement, tracked_by: [F22.2], statement: "The identity, provenance, coverage, freshness, evidence and relation model holds for C++ templates and instantiations, overloads, namespaces, inline and ODR definitions, class methods and special members, virtual dispatch, member-function pointers, template-heavy headers and cross-TU identity, with two shared additions and no language-specific hack: `symbol.instances[]` (emitted mangled symbols realizing a template or inline definition, with their units) and the edge kinds `dependent` (resolved per instantiation) and `virtual` (interface known, implementation a vtable lookup), plus `overrides` as a compiler-known relation", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXP-02: {section: "2. The designer's nine items, each with what the probe showed and what the contract needs", kind: requirement, tracked_by: [F22.2], statement: "Toolchain identity is mandatory in the extractor identity, derived from the compiler (gcc toolchain or sysroot, resource directory digest): a mismatch between libclang's driver and the build's compiler produced 50% include disagreement until aligned, after which includes agree at 99.2% with the residual named", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXP-03: {section: "3. What libclang's cursor API cannot give for C++ [probe → inference]", kind: requirement, tracked_by: [F22.2], statement: "libclang's cursor API does not expose implicit template instantiations, implicitly-defined members or compiler-generated symbols, so the C++ edge extractor reads a codegen-adjacent source (LLVM IR at -O0 or the object's relocations) and demangles instances back to the template's identity, while the AST walk keeps declarations, scopes, source ranges, overrides, virtual and dependent call sites and evidence locators: two extractor identities, one artifact, inside the contract. Known probe limitation: friend functions defined inside a class body were not surfaced", status: "absorbed-by: PMP-12 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  CXP-04: {section: "4. Decision for the consolidation [rec]", kind: requirement, tracked_by: [F22.2], statement: "Freeze the semantic-extension contract with exactly these language-neutral additions: `symbol.instances[] {mangled, units[]}`, `reference.kind += dependent | virtual | overrides`, mandatory `extractor.toolchain {tool, version, gcc_toolchain|sysroot, resource_dir_sha256}`, and `fact.source += codegen` beside ast for facts with no source range; the C++ production extractor is an implementation item with this oracle, not a research question", status: "absorbed-by: PMP-11, PMP-23 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  # ---- SEF: the semantic-extension contract, query surface, incremental freshness and the architecture-map bridge (S2–S5)
  SEF-01: {section: "1. Capability", kind: requirement, tracked_by: [F22.2], statement: "An extension declares the fact kinds it emits, each with a tier (compiler_known | static_inference | unsupported), from a closed shared vocabulary: symbol, containment, reference (calls, calls_through, holds_pointer_to, imports, includes, uses_type, expands_macro), configuration, quality and the optional coverage overlay; which kinds a language fills and at which tier is data, so a pack or query can say no call facts exist for a language instead of returning an empty list that reads as no callers", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-02: {section: "2. Source and build inputs", kind: requirement, tracked_by: [F22.2], statement: "Every extension names its input set per unit (source, transitively read files, configuration, generated inputs, toolchain identity) because freshness is computed from it; the unit is the translation unit, not the file; facts are keyed by (unit_id, symbol_id) where unit_id hashes the input set's identity, and a file is a view over its units", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-03: {section: "3. Extractor identity", kind: requirement, tracked_by: [F22.2], statement: "Every artifact carries `extractor: {name, version, toolchain {tool, version, resource_dir_hash}, options}`; facts from two extractor identities are never merged into one record, a new identity produces a new artifact version, and the old one stays readable", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-04: {section: "4. Freshness", kind: requirement, tracked_by: [F22.2], statement: "Freshness is per unit from the unit's input set, with CURRENT, STALE and UNKNOWN as `engine/freshness.py` has them plus PARTIAL for a unit whose last extraction had errors; the artifact's freshness is the worst of its units plus the count of stale units, never a single flag; only the input-set computation is language-specific", status: "absorbed-by: PMP-11, PMP-20 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-05: {section: "5. Coverage", kind: requirement, tracked_by: [F22.2], statement: "Two coverages kept apart: extraction coverage (of the units the build names, how many were extracted at what quality, so every answer can be qualified) and execution coverage (which symbols a recorded run executed), an optional overlay bound to a run that joins by symbol identity and is never a property of the static map", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-06: {section: "6. Artifact identity", kind: requirement, tracked_by: [F22.2], statement: "The artifact is an immutable, content-addressed derived record pinned by a manifest entry with source_revision, extractor identity, the configuration identities it covers and its input-set digest, one per (revision, extractor, configuration set), rebuilt incrementally and published atomically; deduplication by stable symbol identity (USR for C/C++, module-qualified name for Python) is the artifact, not an optimization. Whether it is an ADR-0013 `reference` knowledge record or a derived artifact outside admission is left to project maps v0.3 §7.4, which makes it a derived artefact", status: "absorbed-by: PMP-11, PMP-14 (project maps v0.4, 2026-10-05, proposed for the designer's freeze); the designer corrected this entry's ADR-0013 reference wording on the same day: a derived project-map artifact pinned per extension by the project-map manifest, not K0 (v0.4 decision 18)"}
  SEF-07: {section: "7. Queries", kind: requirement, tracked_by: [F22.2], statement: "Extensions add facts, never queries; the shared query surface answers over the shared fact kinds, and a fact kind an extension cannot fill makes the answer say so for that language", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-08: {section: "8. Limitations", kind: requirement, tracked_by: [F22.2], statement: "A limitations block in the artifact, echoed in answers, generated from the capability matrix and the quality facts rather than hand-written", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-09: {section: "What must stay language-specific, named", kind: decision, tracked_by: [F22.2], statement: "Language-specific by design: the extractor, the unit definition, the input-set computation, the symbol identity scheme, which reference kinds exist, and the tier exceptions; everything else is shared, and the C run needed no shared field Python would break", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-10: {section: "`map.semantic.*` shape (candidate, not decided)", kind: requirement, tracked_by: [F22.2], statement: "A candidate `aew/semantic-map/v1` shape: source_revision, extractor, configurations, units with quality, deduplicated symbols with definition and declaration locators, references with kind, tier and sites, the capability matrix, generated limitations and optional coverage overlays; a few MB for curl's library and never a pack item", status: "absorbed-by: PMP-11 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-11: {section: "S3. The agent-facing code-intelligence surface", kind: requirement, tracked_by: [F22.2], statement: "A typed surface of map.symbol, map.callers, map.callees, map.includers, map.configuration, map.evidence, map.neighborhood (radius 1 free; radius 2 only under an explicit budget, measured at 6,700 to 10,800 tokens against 55 to 450 for single-hop answers) and map.search (a candidate generator, never an answer), with five rules: every answer carries its boundary generated from fact tiers; evidence is a locator resolvable at L3; disclosure follows L0 to L3; the semantic map is not in packs by default beyond L0 and the Ticket's declared subject symbols; configuration is a parameter, never a surprise", status: "absorbed-by: PMP-19 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-12: {section: "S4. Incremental freshness and rebuild", kind: requirement, tracked_by: [F22.2], statement: "Freshness and rebuild are per unit from the unit's input set, with a known invalidation scope per change (source, header fan-out, compile command, define, generated header, toolchain, the last producing a new artifact version); the header-to-units dependency index is persisted first; units are re-extracted incrementally but the artifact is published atomically per revision; a query answer carries the staleness of the units it touched and a stale semantic fact is navigation to be re-verified at L3", status: "absorbed-by: PMP-20 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-13: {section: "S5. Architecture-map augmentation from semantic evidence", kind: requirement, tracked_by: [F22.2, F30], statement: "The bridge deterministic map → semantic extension → investigator synthesis: the investigator receives L1 and L2 answers (module boundaries, public surfaces, dispatch-table implementers, cross-directory call density, configuration variants, platform headers), never the graph; every architecture-map statement binds to a map answer or source range or is labelled inference; the architecture map stays a discovery record whose observed inputs include the semantic artifact's revision; the F19 K-arm compares an investigator with map queries against one with grep", status: "absorbed-by: PMP-21 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  SEF-14: {section: "Decisions for the designer [Q]", kind: open-question, tracked_by: [F22.2], statement: "For the contract freeze: confirm the three-tier vocabulary and the seven reference kinds (Python declares imports only); unit identity as (source, compile-command hash, toolchain) with a file as a view; the v1 extractor language (Python bindings suffice to tens of thousands of units with parallelism); whether `map.neighborhood` radius 2 exists on the agent surface or only radius 1 plus explicit steps (the designer settled radius 1 by default, radius 2 budgeted, in the project-understanding note §10); whether semantic facts may enter packs beyond L0 and the declared subject symbols", status: "absorbed-by: PMP-17, PMP-23, PMP-24 (project maps v0.4, 2026-10-05: questions 1, 2 and 4 are in §10 and decision 16; 3 and 5 stay open in §11)"}
  # ---- QRC: query routing and retrieval classification (S6) ---------------------------------------------------------
  QRC-01: {section: "1. A small taxonomy: six task classes, by binding and answer shape", kind: requirement, tracked_by: [F21, F22.2], statement: "Classify an information need by what it binds to and what answer shape it needs, not by topic: six classes (exact lookup, relation fact, local explanation, neighbourhood trace, discovery/unanchored, judgement), each with its cheapest sufficient path; the classes compose by escalation, and the class is observable before any model call"}
  QRC-02: {section: "2. The staged routing model", kind: requirement, tracked_by: [F21], statement: "Five stages (bind, exact, local, expand, discover, then judge), each with a budget and a coverage check; every stage ends in exactly one of SATISFIED, EXHAUSTED_BUDGET or NOT_FOUND, plus NOT_SUPPORTED when the substrate emits no such facts for that language, and the state is part of the answer; escalation triggers are measured gaps (unresolved anchor, empty result on a covered relation, substrate disagreement, unconnected radius-1 subgraph, flat discovery scores), never estimates of difficulty"}
  QRC-03: {section: "3. Signals each decision can observe cheaply", kind: requirement, tracked_by: [F21], statement: "The routing inputs are cheap, deterministic signals from the request binding and the indexes: anchors total and resolved, relation named, shape requested, substrate coverage, result size and fan-in/out, freshness of touched units, substrate agreement, candidate separation, request mode and remaining budget; question difficulty, user intent and the model's future needs are not routing inputs"}
  QRC-04: {section: "4. Should classification be deterministic, model-assisted or staged?", kind: invariant, tracked_by: [F21], statement: "Staged, with the model confined to three roles: never the first decision, choosing an expansion when the deterministic rule stalls (logged as a routing decision, never adding an edge), and synthesis grounded only in retrieved facts; the router selects which deterministic queries run and never produces a fact; similarity yields candidates only, omission is visible with its reason, provenance survives every route, and the router cannot widen permissions or visibility"}
  QRC-05: {section: "5. Failure and fallback", kind: requirement, tracked_by: [F21], statement: "Defined behaviour per weakness: an unresolved anchor returns NOT_FOUND with candidates named as candidates; an empty covered relation returns SATISFIED with the coverage statement; an uncovered relation returns NOT_SUPPORTED with no model guess; budget exhaustion returns the connected part, the frontier and one next expansion; substrate disagreement returns both facts with tiers; flat discovery falls back to the structural map; stale units label the answer; a synthesis citing a fact outside its grounding set fails the citation check and the facts are returned without it"}
  QRC-06: {section: "6. Evaluation plan", kind: evaluation, tracked_by: [F19, F21], statement: "Per-substrate query sets with deterministic ground truth generated from the artifacts (exact and relation questions, local explanations, traces with known paths, discovery with known anchors), negative controls for nonexistent symbols, uncovered relations and stale units, cost accounting that penalizes unnecessary spend, and ablations against deterministic-only, always-RAG and always-agent baselines; two arms belong to F19 and share its harness"}
  QRC-07: {section: "7. Implications for AEW's T5/S2–S3 design", kind: requirement, tracked_by: [F22.2, F21], statement: "The typed map surface is the router's exact stage (an agent calling a relation operation has classified its own question); radius is the budget dial with the measured cliff between 1 and 2; coverage statements make empty answers meaningful and belong in the contract; discovery about a codebase starts from the structural map, then lexical search, with vector search optional and candidates-only; one router over all substrates takes the recall design's request binding as input; pack preparation runs the exact and local stages only within the budget order and never traces or judges", status: "absorbed-by: PMP-19 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  QRC-08: {section: "8. What is reusable, and what is not", kind: decision, tracked_by: [F21], statement: "Reusable as a pattern: the binding-by-shape taxonomy, staged routing with measured-gap escalation, the terminal states, the router-selects-queries rule and cost-aware evaluation; not transferable without re-measurement: budgets and cliffs, anchor grammars and the stored-relation vocabulary; a learned classifier earns a place in front of the exact stage only if evaluation shows deterministic signals misroute at a cost above its latency"}
  # ---- LRB: large-repository benchmark (S7) --------------------------------------------------------------------------
  LRB-01: {section: "1. Structural map [probe]", kind: requirement, tracked_by: [F22.1], statement: "The structural map needs no sharding or derived index at 100,000 files (2.1 s, 162 KB; `ls-tree` 0.3 s; a change-proportional diff of 18 ms); the record grows with directory count, so the directories section is capped at two levels plus a per-top-level summary to stay in tens of KB at any size; tree-bound freshness is one `git diff --name-status` between commits", status: "absorbed-by: PMP-05 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  LRB-02: {section: "2. C semantic map [extrapolation from S1's constants; marked hyp where it is more than arithmetic]", kind: requirement, tracked_by: [F22.2], statement: "From the measured per-unit constants, a first C extraction is minutes at 1,400 units, about two hours single-core at 50,000 and about a day at 500,000, with incremental rebuilds after a median header edit at seconds to an hour; therefore sharding is a packaging choice that falls out of unit identity, incremental caches with per-unit input sets are required from the first version, and a dedicated derived rebuildable index (symbols, edges, membership, fan-out in SQLite, on the ADR-0011 `history.sqlite` pattern) answers queries as lookups, never as file scans", status: "absorbed-by: PMP-14 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  LRB-03: {section: "3. Where behaviour changes, not just cost [inf]", kind: requirement, tracked_by: [F22.2], statement: "At scale behaviour changes: per-unit dumps stop being storable so deduplication is mandatory from the first version; a whole-repository first extraction becomes a scheduled job with a receipt (the outbox and capture-job shape) while `aew map generate` stays synchronous for the structural map only; query answers stay small because they are per symbol, only budgeted neighbourhoods grow; freshness becomes the common state, so artifact status is a count of stale units and answers carry the staleness of the units they touched", status: "absorbed-by: PMP-14, PMP-20 (project maps v0.4, 2026-10-05, proposed for the designer's freeze)"}
  LRB-04: {section: "4. Not shown [hyp]", kind: open-question, tracked_by: [F22.2], statement: "Not measured: a real 50,000-file repository with includes and a build, memory for assembling hundreds of thousands of units (a streaming build into the derived index), and Windows timings for the Git primitives at 100,000 files (expect a constant factor from slower process spawns)"}
  # ---- PUI: project understanding, the Project Profile and requirement impact analysis (S8) ---------------------------
  PUI-01: {section: "0. The probe, because the rest leans on it [probe]", kind: evaluation, tracked_by: [F30], statement: "Baseline from three real changes scored from Git objects: a seed-and-radius-1 surface is complete for localized requirements (recall 1.00) and about half complete for cross-cutting ones (0.54), at 10 to 20% precision; constraints (oracle rules, schema keys, ADR mentions, error codes) surface without a model as locators into authority; created files cannot be predicted by any location-based method and are reported separately; the deterministic pass costs about two seconds per requirement on AEW"}
  PUI-02: {section: "1. Recommended architecture (deliverable 1, question 15)", kind: requirement, tracked_by: [F30], statement: "(The designer's correction of 2026-10-05: the deterministic maps are derived project-map artefacts, not ADR-0013 reference records; project maps v0.5 §3.1 selects them through the map registry and its own `map_revision`, PMP-08.) The layered chain: authoritative sources → structural map → semantic extensions → Project Profile (KC §8 maps plus WC §16.15 guardrails as evidence-bound records with per-claim freshness) → a deterministic impact surface at Story or Epic creation and on demand → plan assurance's first pass → investigator when a load-bearing premise lacks evidence → planning → Tickets inheriting the Story's surface; nothing above the sources is authority, one record family and one freshness mechanism (ADR-0008 records for claims, ADR-0013-style derived records for maps, the surface a projection recorded only when the Lead binds it), and impact analysis has no record kind of its own beyond plan assurance's slots"}
  PUI-03: {section: "2. Part A — what an agent needs, and from which layer (questions 6, 13)", kind: requirement, tracked_by: [F30, F22.2], statement: "Each capability is assigned a layer, a storage mode and a confidence: structural map and build/test facts stored and deterministic; translation units and configurations stored per unit; symbol, call, include and configuration lookups on demand through the typed surface at a few hundred tokens; component membership, flows, boundaries and ownership as Profile records mixing deterministic candidates with labelled synthesis; the query surface is the map surface plus `profile.component` and `profile.owner`. Not attempted: stored whole-repository model summaries, uncited ownership, call graphs for languages without a compiler-grade extractor, unmetricated importance scores"}
  PUI-04: {section: "What it is [rec]", kind: decision, tracked_by: [F30], statement: "The Project Profile is a small set of structured records (KC §8.1 to §8.5 realized in the ADR-0008 record shape, stored as immutable manifest-pinned derived records with dispositions when challenged), with human projections rendered from them; a GSD-style set of prose documents is rejected as the representation (one freshness per file, no per-claim evidence, invites editing as authority) and allowed only as a rendering"}
  PUI-05: {section: "Fields that earn their place, with their source class", kind: requirement, tracked_by: [F30], statement: "Profile records and their source classes: overview (pointers deterministic, one synthesized paragraph bound to evidence), stack, build_test and boundaries (deterministic from the maps and files read), components[] and flows[] (directories, surfaces and edge counts deterministic; names, boundaries and flows synthesized by an investigator with evidence per claim), ownership[] (deterministic writer sets plus an authority reference), contracts (pointers only to the spec pins, amendment index, invariant index and requirements ledger), guardrails (declared by project policy, pointed at and checked, never derived), navigation (deterministic candidates plus a few evidenced hints); freshness scope is the files or units each claim read"}
  PUI-06: {section: "Rejected fields, and why [rec]", kind: decision, tracked_by: [F30], statement: "Rejected as Profile sections: stable project constraints as prose (constraints live in authority or are requirement-relative), a global concerns record (a concern is relative to a goal and computed), roadmap, current state and handoff (control state and decisions already durable elsewhere), importance rankings without a metric, and anything a model wrote about code it did not cite; the glossary stays a discovery record pending the K-arm evaluation"}
  PUI-07: {section: "Representation (question 4) [rec]", kind: requirement, tracked_by: [F30], statement: "One `aew/profile/v1` record per section so sections version and age independently: schema, id, version, section, source_revision, extractor or author, claims[] each with statement, evidence[] (file, symbol, edge, record or contract locators with digests), source_class and observed_paths, and freshness; deterministic sections regenerated by map-generation jobs, synthesized sections as investigator discovery records accepted by the Lead and pointed at by the Profile; one human projection renders them all"}
  PUI-08: {section: "Provenance and freshness at claim level (question 5) [rec]", kind: requirement, tracked_by: [F30], statement: "Freshness and provenance per claim: each claim carries observed_paths and unit ids and is CURRENT or STALE by the existing record-freshness computation, a section reports counts never one flag; source class per claim reuses the knowledge vocabulary (ENGINE_OBSERVED, ROLE_ATTESTED, EXTERNAL_UNTRUSTED) and packs render it; invalidation is per claim and cheap, deterministic sections regenerate in seconds while synthesized claims stay STALE until re-verified or accepted with a disposition; a claim's evidence is fixed at authoring and still true is a new version or a disposition, never an edit"}
  PUI-09: {section: "The contract [rec]", kind: requirement, tracked_by: [F30, F14], statement: "Impact analysis produces two outputs into existing slots: (a) the deterministic impact surface, a projection computed at Story creation and on demand (`aew impact <work-id>`) from the requirement text, declared subject refs and the maps, with seeds and how they resolved, affected units at radius 1 with reason, evidence and tier, tests, constraint locators into authority, configurations, ownership candidates, a coverage statement of how it was computed, and the not-found list, recorded as a decision input only when the Lead binds it; (b) the judgement part written into plan assurance v0.4's first-pass artefact and premise list, every line citing surface entries"}
  PUI-10: {section: "Epic versus Story (question 1) [rec]", kind: requirement, tracked_by: [F30], statement: "An Epic's surface is computed at component granularity (Profile components, directory roles, configurations) and its judgement output is the likely Story subjects and cross-component constraints, with no file-level surface; a Story's surface is at file, symbol and unit granularity and is where the premise list is written; the two differ in granularity and in what they feed, not in mechanism"}
  PUI-11: {section: "Tickets (question 2) [rec]", kind: requirement, tracked_by: [F30], statement: "Tickets inherit the Story's surface and premises; a Ticket's own pass is a narrowing (declared scope ∩ Story surface) plus a staleness check, computed not re-analysed; a fresh analysis runs only when the Ticket's scope leaves the Story surface (itself a plan-lint finding, SCOPE_OUTSIDE_STORY_SURFACE) or when the Story's surface is stale beyond a threshold"}
  PUI-12: {section: "Deterministic versus judgement (questions 3, 4, 9) [probe-grounded]", kind: decision, tracked_by: [F30], statement: "Deterministic: seeds, affected units at radius 1, tests, constraints as locators, configurations, writer sets, coverage and not-found. Judgement: trimming the surface, semantic couplings with no edge, risk statements, which premises are load-bearing, what the probe should be, and what will be created; the line sits exactly where the probe's recall stopped"}
  PUI-13: {section: "When an investigator is launched before planning (questions 5, 10) [rec]", kind: requirement, tracked_by: [F30, F14], statement: "Deterministic investigator triggers: a load-bearing premise with absent or stale evidence; a seed that resolved to nothing while the requirement names a thing; a surface spanning a language or component without call facts; an ownership question with several writers and no authority reference; an Epic-to-Story split touching more than one component's contract; otherwise the Lead plans, and the discovery record becomes evidence for the premise and, if general, a Profile claim. (Advisory during the evaluation phase by the designer's decision in §10)"}
  PUI-14: {section: "Staleness and amendment (questions 7, 8, 12) [rec]", kind: requirement, tracked_by: [F30], statement: "The surface is stale when its observed paths changed, the requirement revision changed, or the maps were regenerated under a different extractor identity; recompute is seconds and the judgement lines are re-read and re-affirmed or revised in a recorded step; an unexpected implementation finding triggers a recorded premise outcome (EXECUTION_PREMISE_CONTRADICTION), an amendment of the Story's premises or a Ticket revision, and the delta between surface versions is what the Lead reads"}
  PUI-15: {section: "Promotion to the Profile (question 9) [rec]", kind: requirement, tracked_by: [F30, F21], statement: "A local finding becomes a Profile claim only through the existing path (an investigator's discovery record or an implementer's attested finding as a K1 Case, Lead acceptance, a new record version with the finding's evidence); repetition is detectable but generality with evidence is the criterion, and a finding true only for the Story stays with the Story"}
  PUI-16: {section: "Challenging the brief's equation [inf]", kind: decision, tracked_by: [F30], statement: "Impact analysis is requirement × maps, qualified by the Profile: the surface comes from symbols, edges, tests and constraint locators, and the Profile contributes component membership, ownership records and guardrails; design the surface against the maps first"}
  PUI-17: {section: "5. Part D — context delivery (question 13; deliverable 6)", kind: requirement, tracked_by: [F30, E29], statement: "Per consumer, what arrives in the pack automatically (a Lead gets the Story's surface summary, touched components and the premise template; an investigator the structural map, Profile L0 and the premise to discriminate; an implementer its Ticket's narrowed surface with constraints and tests; a reviewer the diff mapped onto the surface with outside-the-surface as a finding; a verifier the intended change, preservation obligations and the tests and gates named), what comes through deferred typed tools under budget, and what never arrives (the graph, other components' flows, the Lead's preferred answer); a pack section built from the surface stays at a few hundred tokens per subject symbol"}
  PUI-18: {section: "6. Part E — evaluation (question 14; deliverable 7)", kind: evaluation, tracked_by: [F30, F19], statement: "Codebase understanding is measured by the extraction oracle per extractor identity, directory-role classification against hand labels, architectural claim support and inter-rater agreement, the K-arm retrieval comparison and refresh cost; impact analysis by affected-area recall and false-positive expansion at seeds, radius 1 and radius 2 on 20 to 30 real changes with created files reported separately, missed constraints, supported versus hallucinated risk statements, investigations correctly requested and correctly not requested, planning quality and rework in a two-arm dogfood, and token cost; the primary metric is how often a Lead or implementer confidently pursued an incomplete or incorrect surface with the analysis present versus absent"}
  PUI-19: {section: "7. Tool and data surface for the impact analyser (question 8; deliverable 4)", kind: requirement, tracked_by: [F30, F22.3], statement: "Inputs: the requirement and its refs, parent obligations, the structural map, the semantic artefacts, the test index, the constraint locators (oracle rules, invariant index, schema keys, guardrails, ADR index, amendment index, requirements ledger), Profile records with freshness and the history index; tools: the map surface, `profile.*`, history links and show, knowledge search, and `aew impact` with `--radius`, `--configuration` and `--explain <entry>`"}
  PUI-20: {section: "8. Implications for T5 v0.4 (deliverable 8)", kind: requirement, tracked_by: [F22.1, F22.2, F22.3], status: "absorbed-by: PMP-07 (project maps v0.5 adopted 2026-10-05: the listing-plus-read-metadata freshness, mechanically tracked; the sibling indexes are PMP-22 and the Profile/Impact work stays with F30)", statement: "As corrected by the designer: the base structural record changes only in reading the commit's tree and in its freshness rule (project maps v0.3 decision 4 binds freshness to the whole tree and governs until v0.4 is adopted; the designer (2026-10-05) accepts that the probe evidence, a map current through 21 of 30 sampled commits instead of 0 of 30, supports narrowing it to the listing plus the configuration blobs read, as a T5 v0.4 amendment; v0.4 drafts it as its §3 and amended decision 4 (2026-10-05); close this entry when v0.4 is adopted) and stays generatable from Git objects with no semantic dependency; the semantic-extension contract carries the tiers, unit identity, per-unit freshness, holds_pointer_to and the C++ additions; the test index, public-surface counts per directory and the constraint locator index are sibling derived indexes composed when their inputs exist and declared in the surface's coverage, never fields of the structural record; the Profile record family, `aew impact`, plan-assurance slot filling, investigator triggers, the Ticket narrowing rule and the evaluation corpus belong to a later Profile/Impact design"}
  PUI-21: {section: "9. Contradictions with the hypothesis (deliverable 9)", kind: decision, tracked_by: [F30], statement: "Rejected from the brief's hypothesis: a Profile layer distinct from KC §8 and WC §16.15; impact analysis as its own artefact; the equation profile × requirement; full-profile invalidation; separate generated documents as representation; stable constraints and concerns as Profile sections. Confirmed: the three-layer base, the flow into investigation and planning, on-demand queries over graph dumps, partial beats convincing, and the primary metric"}
  PUI-22: {section: "10. Designer decisions (2026-10-05), closing the questions this note left open", kind: decision, tracked_by: [F30], status: "absorbed-by: PMP-65 (project maps v0.5 §12.2 freezes these dispositions for the later impact design)", statement: "The designer's decisions: `aew impact` is one deterministic operation with two consumers (an inspectable Lead command and Plan Assurance at Story creation); radius 1 by default and radius 2 only when explicitly requested and budgeted; Epics run on structural directory roles with declared reduced coverage before components[] exist; impact-derived investigator triggers are advisory during the evaluation phase while Plan Assurance's hard requirements stay hard; a 20 to 30 case stratified real-change corpus decides the first promotion. Program state: D9 to ADR amendments then a later capture service; T5 plus the semantic research consolidate into T5 v0.4 and the contract; project understanding uses existing KC machinery, the impact surface feeds existing Plan Assurance, and evaluation precedes mandate"}
  # ---- DCQ: the designer's decisions of 2026-10-01 on containment and the integration queue (copied from the research)
  DCQ-01: {section: "1. Containment and process ownership (Q3, F2, E13; research §8)", kind: decision, tracked_by: [F2, E13, Q3], statement: "Strong OS/runtime filesystem containment is required before any personal real-repository dogfood as well as internal alpha; the unprivileged bubblewrap boundary suffices for personal dogfood once the named Rocky 8 probes pass, internal alpha also needs isolation performance and operability acceptance; POSIX process ownership closes through the same PID-namespace boundary with no separate subreaper, and process-group mode is never represented as complete ownership until the PID-namespace test passes", status: "done: built in M4-B (2026-10-03), ADR-0009 amendment"}
  DCQ-02: {section: "1. Containment and process ownership (Q3, F2, E13; research §8)", kind: decision, tracked_by: [Q7, F19, F2], statement: "Real-project provenance does not by itself trigger F2: a sanitized or disposable SPT-derived fixture is scratch only when the run's host-level reach has no writable non-disposable project state or secrets, a disposable clone on the normal development host is not scratch, and F19 follows the same rule; F2 moved to early M4 with its probes run immediately and F2 and E13 implemented together"}
  DCQ-03: {section: "2. The integration queue (F10, D4; research §7)", kind: decision, tracked_by: [F10, D4], statement: "M4 uses parallel Ticket execution with a single serial integration lease; runnable COMMIT_READY entries are FIFO by default with dependency legality owned by the work graph and explicit Lead reorder or defer; no batching and no shared post-integration evidence in M4; D4 is a policy-selectable deterministic integration-validation path with existing verifier policy as the default; a merge conflict releases the lease and returns to the Lead, never resolved automatically or sent to an Implementer; no head-of-line blocking; every integration attempt recomputes the dispatch predicate and binds to the current head", status: "done: M4-D3 to M4-D5 (2026-10-05): the queue and lease, the Lead's reorder, defer and disposition, conflicts released to the Lead, and D4's checks-mode validation with verifier as the default"}
  DCQ-04: {section: "2.1 Follow-up dispositions (designer, 2026-10-01; research §7.1)", kind: decision, tracked_by: [F10], status: "done: M4-D3 #65 (the lease owned by the entry, its custodian, reconciliation, the disposition states) and M4-D4 (the one automatic rebuild, the Lead's defer, requeue and reorder)", statement: "The lease is owned durably by the queue entry (not the replaceable candidate or attempt) with a live invocation as custodian, a dead custodian is reconciled before transfer or release and no timeout alone releases it; one automatic rebuild and revalidation on a moved head is allowed while holding the lease after proving no publication, a second movement, conflict, failed validation or changed legality returns to the Lead; DEFERRED and AWAITING_DISPOSITION are queue states that never grant eligibility; conflict resolution is a new attempt whose effective gates rerun while a plain head move does not invalidate unchanged Ticket-scope evidence; batching is out of scope for M4, not forbidden"}
  # ---- WCA: the Workflow Contract amendment, one classification system and Class 0 eligibility (adopted) ------------
  WCA-01: {section: "2. Amended §7.4: the Class 0 bullet", kind: requirement, tracked_by: [F14, F19], statement: "Class 0 is eligible mechanical work: the eligibility predicate holds (bounded known subject; clear intended transformation; no unresolved diagnosis or premise ambiguity; current supporting inputs; deterministic acceptance; no mutation of protected acceptance resources; no consequential security, trust, persistence or compatibility boundary; no inherited elevated obligation); AEW enforces it when Class 0 is requested as deterministic structural checks plus recorded Lead semantic assertions plus no active hard trigger; a failing request is refused with reasons and never silently reclassified; during evaluation a sample of Class 0 work receives an independent audit. Classes 1 to 4 are unchanged", status: "done: partly; the predicate and refusal are enforced since M4-A (2026-10-03), the sampled audit is still F19's"}
  WCA-02: {section: "3. Amended §7.4: examples", kind: decision, tracked_by: [F14], statement: "The Class 0 example becomes a mechanical edit or a behaviour fix whose acceptance is a deterministic check, when the predicate holds"}
  WCA-03: {section: "4. New paragraph after §7.4's class list: assurance on classes", kind: requirement, tracked_by: [F14, F19], statement: "Classes are the only classification; the §7.5 paths stay the baseline obligations for Classes 1 to 4; hard assurance triggers add premise-sensitive obligations regardless of class (a stakeholder diagnosis or premise adopted by or constraining the intervention, an acceptance input inside the mutation scope, an unexpected baseline result) and a triggered Class 0 request fails eligibility; default assurance floors beyond §7.5 are evaluation hypotheses until controlled dogfood supports them; the triggers are defined in plan assurance v0.4 §22 and computed by the one shared dispatch predicate"}
  WCA-04: {section: "5. Amended §7.5: the Class 0 path", kind: requirement, tracked_by: [F14], statement: "The Class 0 path is eligibility verified, implement, focused check, complete, plus inherited mandatory gates; complete keeps §8's controlled integration semantics and any policy-required post-integration validation, and the amendment removes no integration gate (tightened in §9: inherited gates compatible with Class 0 eligibility only)"}
  WCA-05: {section: "6. Unchanged, and how they fit", kind: invariant, tracked_by: [F14], statement: "Unchanged and reaffirmed: classification may increase whenever evidence exposes additional risk and demotion requires an explicit Lead decision with rationale (refusing an ineligible Class 0 request is the engine-side counterpart of AEW-INV-CLASS-001); parent and child risk and inherited policy stand, and no inherited elevated obligation is how an ancestor's non-waivable gates and minimum-class floor reach Class 0"}
  WCA-06: {section: "7. Consequences outside the contract", kind: requirement, tracked_by: [F16, F14, F19], statement: "`aew guide` and the Lead guide state the predicate and the refusal from policy; the engine's Class 0 checker returns its reasons through DispatchDecision; the Class 0 sampling rubric uses the same predicate; the dogfood rubric's Class 0 label is consistent with the amended definition", status: "done: partly; the checker and the guide since M4-A, the rubric is still F19's"}
  WCA-07: {section: "8. Decided in review (designer, 2026-10-01)", kind: decision, tracked_by: [F14, F19], statement: "The Lead's semantic assertions stay part of eligibility during evaluation (narrowing Class 0 to the machine-checkable would make it unusable again; the sampled audit shows whether they need stronger machinery); the audit sample rate is an experimental knob set in the shared evaluation preregistration, not in the contract"}
  WCA-08: {section: "9. Decided while implementing the predicate (operator and designer, 2026-10-03)", kind: decision, tracked_by: [F14], statement: "The Class 0 path admits only inherited mandatory gates compatible with Class 0 eligibility, and an inherited elevated obligation (an ancestor's non-waivable gate or minimum descendant class) makes Class 0 ineligible; KC §26's parent-risk case is replaced: the locally Class 0 Ticket under an elevated obligation is refused with an inherited-elevated-obligation reason, the Lead reclassifies to a class satisfying any floor, and the inherited gate is still required; reclassification is a recorded decision (previous and new class, reason, actor and generation, effective minimum) and the engine refuses a class below an inherited floor, demotion being separate; enforcement applies when a mutating Ticket is dispatched at Class 0, non-mutating Tickets and Stories keeping their paths until their conditions are defined", status: "done: M4-A (2026-10-03); acceptance guide AT-9 corrected 2026-10-05 (E38)"}
  WCA-09: {section: "9. Decided while implementing the predicate (operator and designer, 2026-10-03)", kind: requirement, tracked_by: [F14], statement: "A bounded subject is measured structurally: a scope is unbounded when a glob's first segment is `**`, when it matches no tracked file, when it matches more than 50 tracked files, or, in a tree of at least 40 tracked files, more than a quarter of it; every bound is policy (`class0.max_scope_files`, `class0.max_scope_fraction`, `class0.fraction_min_tree_files`) and the refusal and the admitted decision's dependency digests report the measure; `--acceptance-check` on a non-mutating Ticket is refused at creation", status: "done: operator decisions of 2026-10-03 and 2026-10-04, built in M4-A/M4-C"}
  # ---- PAD: the plan-assurance and classification decisions of 2026-10-01 (decision record) --------------------------
  PAD-01: {section: "1. Q9: plan assurance (operator, 2026-10-01)", kind: decision, tracked_by: [F14], statement: "Plan assurance v0.3 is adopted as the post-M3 direction: ASSURED is a derived gate predicate, not a state; the first implementation reuses reviewer and verifier infrastructure; a mechanical exemption exists from the start only under engine-checkable eligibility and is sampled in dogfood; hard protected-condition violations are non-waivable without a new attributable acceptance revision; strong approved models are mandatory for the Lead and for acceptance and challenge during initial evaluation; tiers, routing and probe thresholds stay provisional until controlled dogfood shows acceptable false-success and false-blocking rates; Q9 does not block M4 after ADR-0011 but assurance-compatible extension points and deterministic primitives land early"}
  PAD-02: {section: "2. One classification system (operator and designer, 2026-10-01)", kind: decision, tracked_by: [F14], statement: "Tier A to E naming is deleted; AEW has one Class 0 to 4 system with Tier A's positive criteria folded into Class 0 and assurance expressed as gates and triggers on classes; Tier B's protections survive as hard triggers, with mutable acceptance resource nearby and unexpected baseline result added to §22's list"}
  PAD-03: {section: "3.1 Failure classes and invariants (the rest of Q9)", kind: decision, tracked_by: [F14], statement: "Twelve canonical plan-assurance failure classes; three candidates merged or represented as detail (INTENT_SUBSTITUTION is SILENT_INTENT_REWRITE; PLAN_REVIEW_STALE and STAKEHOLDER_DIAGNOSIS_PROMOTION become detail fields); engine refusal codes are not failure-class names; the invariant index gains only the ten genuinely new assurance invariants and references existing ones", status: "done: failure-class registry v0.2 §5 and invariant index v0.2 §6 (2026-10-01)"}
  PAD-04: {section: "3.2 Class 0 eligibility (Q10; the former Tier A)", kind: decision, tracked_by: [F14], statement: "There is no Tier A, only Class 0 eligibility, decided by one engine-side checker over the eight-condition predicate; a Class 0 Ticket that fails it is refused with reasons and told a stronger class is required, never silently reclassified; the Lead keeps the decision and nothing exempts itself", status: "done: the Workflow Contract amendment and M4-A"}
  PAD-05: {section: "3.3 \"A new attributable acceptance revision\" is an F4 Ticket revision", kind: decision, tracked_by: [F14, F4], statement: "No third revision lineage: a legitimate acceptance change is a new Ticket revision; when acceptance-related field digests change the old assurance becomes invalid or is revalidated and the new assurance binds the new revision's digests; a change that no longer overlaps the goal or crosses the parent envelope follows F4's replacement and parent-revision rules"}
  PAD-06: {section: "3.4 Strong models and budget are frozen with the evaluation", kind: decision, tracked_by: [F19], statement: "Model names are not architectural decisions: ADR-0010 execution profiles for the Lead, acceptance reconstruction and the challenger are pinned at preregistration; the first comparison holds model and profile constant across assurance arms; the model-placement ablation is a separate run; the budget is frozen with the corpus and run counts"}
  PAD-07: {section: "3.5 M4's first step", kind: decision, tracked_by: [F14], statement: "M4 lands first one shared dispatch predicate, protected-condition records and checks, the Class 0 eligibility checker and deterministic plan lint; the predicate returns a typed decision with durable reason codes, effective obligations, blocking conditions and dependency digests, a conformance test proves every dispatch route uses it, it is not called ASSURED during evaluation, it is permissive except for existing gates, hard protected-condition failures and requested Class 0, and actual dispatch recomputes it against the current revision and generation with no cached ALLOW", status: "done: M4-A (2026-10-03)"}
  PAD-08: {section: "3.6 One evaluation program", kind: decision, tracked_by: [F19], statement: "Q7, F14 phases 1 to 4, the F17 corpus and Class 0 sampling share one fixture format, runner, run-record schema, hidden-evaluator mechanism, model and profile configuration and metrics collector; experiments stay separately preregistered (Q7 scores root cause, correctness and rework; F14 bad-plan escape and false blocking; Class 0 eligibility correctness, ceremony and cost); one immutable run may inform several metrics but remains one run"}
  PAD-09: {section: "5. What changes where", kind: process, tracked_by: [F14, F19], statement: "Owner edits: the Workflow Contract amendment and plan assurance v0.4, the registry and index revisions (done 2026-10-01); ADR-0010 profiles pinned at preregistration (with the evaluation, F19); M4's first step in the M4 plan (done); the register closes Q6, Q9 and Q10 (done)"}
  # ---- FCR: the failure-class registry v0.2 (index) ----------------------------------------------------------------
  FCR-01: {section: "1. Registry rules", kind: process, tracked_by: [F14], statement: "Each class has one canonical name, one owning document that defines its semantics, a concise definition and a detection or evaluation path; other documents reference the name; a class names a failure, not an error code, and engine refusal codes associate with a class rather than replacing it"}
  FCR-02: {section: "2. Operator / orchestration / resource classes", kind: requirement, tracked_by: [F7, F8, F22], statement: "Eleven operator, orchestration and resource classes owned by the Lead/Operator design (unnecessary interruption, missed elicitation, stale project knowledge, unpropagated decision, excessive replanning, progress noise, insufficient visibility, unbounded delegation, duplicate fanout, permission-prompt amplification, resource composition failure), each with its standing evaluation; RESOURCE_MULTIPLICATION is retired as an alias"}
  FCR-03: {section: "3. Workspace / containment classes", kind: requirement, tracked_by: [F3], statement: "Five workspace and containment classes owned by the isolation design (host write escape, isolation overhead failure, workspace leak, cleanup damage, false containment claim), detected by the containment regression suite, the benchmark gate, cross-workspace and crash tests and the label assertion"}
  FCR-04: {section: "4. Hierarchy / intent / evidence classes", kind: requirement, tracked_by: [F4, F5], statement: "Eight hierarchy, intent and evidence classes owned by the hierarchy-revision design (intent ingress corruption, silent intent rewrite, evidence meaning drift, excessive hierarchy recreation, missed replan, unauthorized scope change, lost supersession lineage, stale parent intent), and three owned by the Ticket-revision amendment (revision laundering, acceptance narrowing by revision, unbound field escape; TRA-19, TRA-20); plan assurance's INTENT_SUBSTITUTION is SILENT_INTENT_REWRITE"}
  FCR-05: {section: "5. Plan assurance classes", kind: requirement, tracked_by: [F14, F19], statement: "Twelve plan-assurance classes owned by plan assurance v0.4 (poisoned premise, acceptance underspecification, acceptance condition mutation, protected acceptance overlap, baseline invalid, assurance bypass, dependency stale, challenge false clear and false block, evaluator integrity failure, execution premise contradiction, hierarchical assurance loss), each with its detection path: deterministic checks and conformance tests for some, evaluation against gold evidence for the challenge classes"}
  FCR-06: {section: "6. Maintenance", kind: process, tracked_by: [F14], statement: "Adding a class needs an owning document, a definition, the reason an existing class is insufficient and a detection path; renames and merges update the registry and every reference in the same change; no document-local synonyms"}
  # ---- INV: the cross-document invariant index v0.2 (index) ---------------------------------------------------------
  INV-01: {section: "1. Cross-cutting", kind: invariant, tracked_by: [F9, F6, F7], statement: "AEW-INV-AUTH-001 (coordination moves knowledge, only authority paths move project state), AEW-INV-CLASS-001 (default to the heavier category; downgrading needs recorded, independently reviewable justification), AEW-INV-RESOURCE-001 (legal choices must not compose into pathological behaviour), AEW-INV-TRACE-001 (registries and indexes never become alternate authority)"}
  INV-02: {section: "2. Lead / stakeholder / delegation", kind: invariant, tracked_by: [F7, F8], statement: "AEW-INV-LEAD-001 and 002 (investigate before asking; autonomy inside the envelope, material departure returns to the stakeholder), AEW-INV-DELEG-001 to 003 (no dispatch capability for workers by default; nested delegation needs explicit bounded authority; duplicate work needs an ensemble purpose), AEW-INV-PERM-001 (exact-match capability aggregation), AEW-INV-CANCEL-001 (cancellation revokes descendant authority), AEW-INV-ATTN-001 (interruption budgets never authorize silent consequential answers)"}
  INV-03: {section: "3. Intent / hierarchy / evidence", kind: invariant, tracked_by: [F4, F5, F6], statement: "AEW-INV-INTENT-001 (authored semantics cross ingress as opaque data), AEW-INV-HIER-001 to 006 (parents preserve purpose and Tickets proof; semantic changes after bound evidence are MATERIAL by default; downgrading to CLARIFICATION needs justification and fresh confirmation; supersession is a relationship, not a state; closeout disposes every superseded descendant; revisions compare to the approved baseline), AEW-INV-EVID-001 (historically valid and currently admissible evidence are distinct), AEW-INV-VERIFY-001 (the verifier proposes, the Lead decides, uncertainty defaults to the heavier path)"}
  INV-04: {section: "4. Workspace / containment / integration", kind: invariant, tracked_by: [F3, F10], statement: "AEW-INV-ISO-001 to 004 (workdir separation is labelled honestly; strong containment passes its gate before real-repository dogfood; benchmarks gate the default strategy; shared-mutable locks are invocation-bound with stale owners reconciled), AEW-INV-INTEGRATE-001 (filesystem isolation does not prove semantic independence), AEW-INV-SCRATCH-001 (scratch never becomes evidence by existence)"}
  INV-05: {section: "5. Coordination", kind: invariant, tracked_by: [F9], statement: "AEW-INV-COORD-001 to 005: relevance hints are advisory only; absence of a hint proves nothing; material assignment changes supersede and re-dispatch rather than travel as context deltas; contradictory findings stay separately attributable until resolved; coordination history satisfies no gate by being routed or summarized"}
  INV-06: {section: "6. Plan assurance", kind: invariant, tracked_by: [F14], statement: "AEW-INV-ASSURE-001 to 010: acceptance reconstructed before the plan is revealed; acceptance resources distinct from the mutation subject; a baseline counts only if it exercised the proposition; assurance binds the versioned dependency set; review metadata cannot change its payload; clearing a blocker is a separate attributable artifact; every dispatch path uses one computed predicate; a contradicted load-bearing premise holds the mutation; inherited obligations cannot disappear at a child; passing children do not prove the composition. Plan assurance replaces no downstream gate"}
  INV-07: {section: "7. Maintenance", kind: process, tracked_by: [F14], statement: "When a governing invariant changes: update the source first, the index in the same change, the affected regression and evaluation references, and never reinterpret the source from the index alone"}
  # ---- TIS: one engine, two interaction surfaces (idea note v0.4, direction adopted 2026-10-01) ----------------------
  TIS-01: {section: "2. The governing interaction rule", kind: invariant, tracked_by: [F15], statement: "A high-level action may chain only substeps whose inputs are already durable and whose choices are fully determined by recorded policy, and it must stop before the next unresolved judgment boundary: a stage may resolve policy and may not invent judgment", status: "absorbed-by: TLS-14, TLS-15 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-02: {section: "`MECHANICAL`", kind: requirement, tracked_by: [F15], statement: "MECHANICAL primitives are fully determined by durable state and engine rules (recording a transition whose guard passed, rotating or revoking execution credentials, queue bookkeeping, advancing after custody handoff, recomputing freshness, FIFO selection among runnable entries)", status: "absorbed-by: TLS-15 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-03: {section: "`POLICY_RESOLVED`", kind: requirement, tracked_by: [F15], statement: "POLICY_RESOLVED primitives are fully determined by recorded policy (review cards, execution profile, isolation strategy, capability grants, budget, integration validation mode); policy inputs and resolved outputs are recorded, and a caller override is an explicit attributable decision", status: "absorbed-by: TLS-15 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-04: {section: "`JUDGMENT_BEARING`", kind: requirement, tracked_by: [F15], statement: "JUDGMENT_BEARING primitives require interpretation, preference, consequence acceptance or semantic disposition: accepting a plan or evidence, downgrading risk, waiving a gate, classifying a failure, resolving a conflict, publishing, marking accepted_open, approving a material hierarchy change, making a stakeholder-owned choice", status: "absorbed-by: TLS-15 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-05: {section: "Fail-closed default", kind: invariant, tracked_by: [F15], statement: "An unclassified primitive defaults to JUDGMENT_BEARING, and no stage expansion may include a judgment-bearing primitive unless the required judgment input is already present as an explicit durable input to that stage", status: "absorbed-by: TLS-15 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-06: {section: "4. Primitive declarations make the boundary machine-checkable", kind: requirement, tracked_by: [F15, F14], statement: "Every primitive used by the stage layer carries a PrimitiveSpec (operation class, required judgments, policy inputs, evidence, side-effect class, idempotency scope, guard id); before a stage starts the engine expands it and refuses when a required judgment is absent, a primitive is unclassified, a policy input cannot be resolved or a guard cannot be evaluated, so hidden judgment is an engine-level conformance failure", status: "done: partly; the first PrimitiveSpec declarations landed in M4-A, the stage-time refusal is still F15.2"}
  TIS-07: {section: "Surface A — intent / stage interface", kind: requirement, tracked_by: [F15, F15.2], statement: "The normal operator and Lead interface expresses a decision already made (ticket draft, start, request-review, request-verification with review evidence, submit-integration with verification evidence, integrate next) and lets AEW perform the mechanical and policy-resolved choreography it implies", status: "absorbed-by: TLS-07 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-08: {section: "Surface B — primitive / recovery interface", kind: requirement, tracked_by: [F15], statement: "The exact lower-level operations stay available for recovery, debugging, conformance testing, forensics, AEW development, unusual workflows and expert control; the primitive interface remains the conformance surface and the stage interface is a façade over it, never an alternate state machine", status: "absorbed-by: TLS-04, TLS-22 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-09: {section: "Presence", kind: requirement, tracked_by: [F15], statement: "A required judgment has a durable attributable record", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-10: {section: "Completeness", kind: requirement, tracked_by: [F15, F17], statement: "The engine enforces the structural prerequisites of a judgment: the existing review rule (required findings block a passing review) is not duplicated, and anything policy marks requires_disposition, including F17 consequential observations regardless of severity label, must have a durable disposition before the evidence satisfies the next gate; noted is not sufficient for an observation carrying an open-consequence obligation", status: "absorbed-by: TLS-17 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-11: {section: "Quality", kind: evaluation, tracked_by: [F15, F19], statement: "Whether the Lead understood the evidence cannot be proven mechanically; judgment-capture rate is necessary but weak evidence, and the anomaly-catch rate is the primary behavioural gate for whether the simplified interface degrades Lead attention", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-12: {section: "7. Stages are normally non-blocking", kind: requirement, tracked_by: [F15.2], statement: "A stage command never waits across a future judgment-bearing event: it resolves policy, creates and launches, records its durable result and returns; the later judgment appears in status, resume and the ActionProjection as a decision required, and the next stage call carries the judgment", status: "absorbed-by: TLS-07, TLS-14 (the governing typed Lead surface v0.2, 2026-10-05; the designer's correction: the non-blocking stage is also the catalog's request-review, which launches and returns)"}
  TIS-13: {section: "8. Policy resolution and policy drift", kind: requirement, tracked_by: [F15.2], statement: "A stage records the policy digest, effective obligations digest, resolved role/profile/isolation/capabilities/budget and overrides it expanded under; a changed effective policy digest while a bundle is active stops it as STALE_POLICY with completed substeps reported; accepted evidence records its policy context, a later policy change recomputes current admissibility rather than erasing history, and no old ALLOW is inherited because evidence bytes are unchanged", status: "absorbed-by: TLS-14, TLS-17 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-14: {section: "9. Durable stage-intent journal", kind: requirement, tracked_by: [F15.2], statement: "Before its first mutation a stage writes a durable StageIntent (requested action, caller, authority generation, input revision, explicit judgment inputs, policy and obligations digests, primitive expansion, idempotency keys, completed steps, state); terminal states COMPLETED, STOPPED_AT_BOUNDARY, REFUSED and ABANDONED, nonterminal ACTIVE; abandonment is explicit and never inferred from inactivity; the journal is operation metadata, not a new lifecycle, and every intermediate state stays primitive-reachable", status: "absorbed-by: TLS-17, TLS-27 (the governing typed Lead surface v0.2, 2026-10-05; the designer's correction: the bounded-hot-state acceptance is also a hard gate)"}
  TIS-15: {section: "Stage intents", kind: requirement, tracked_by: [F15.2], statement: "Active stage intents are hot state, terminal ones immutable cold records with only a bounded current pointer, count and recent summary hot; normal resume reads active stage state only, and historical retrieval is explicit and never makes an old intent authoritative", status: "absorbed-by: TLS-17, TLS-27 (the governing typed Lead surface v0.2, 2026-10-05; the designer's correction: the bounded-hot-state acceptance is also a hard gate)"}
  TIS-16: {section: "Anomalies", kind: requirement, tracked_by: [F15.2, F17], statement: "High-severity unresolved anomalies and F17 obligations are bounded current obligations in hot state; resolved anomalies and low-severity advisories are cold with a bounded recent projection; detector definitions and current baselines are bounded current metadata with historical versions cold; retention never implies normal-path residency or replay (ADR-0011)"}
  TIS-17: {section: "11. Crash, resume and Lead takeover", kind: requirement, tracked_by: [F15.2], statement: "Resume surfaces dangling stage intents with their caller and generation, completed steps, last durable revision, policy and guard status, safe_to_continue and the next boundary; a replacement Lead never silently inherits a stage and explicitly chooses CONTINUE_STAGE or ABANDON_STAGE; continuation binds to the new generation, rechecks guards, policy and admissibility, never reuses an old ALLOW and never replays completed primitive work", status: "absorbed-by: TLS-14 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-18: {section: "12. One source of truth for legality", kind: invariant, tracked_by: [F15, F14], statement: "Execution, explain and dry-run, refusals, status, resume, the ActionProjection, the TUI or web UI and the M5 scheduler all derive from the same queryable guard implementation; explain asks the real engine to expand and dry-run a stage and is never a second hand-written model of legality", status: "absorbed-by: TLS-05, TLS-24 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-19: {section: "Shared foundation", kind: decision, tracked_by: [F15, F14], statement: "F15 does not require every Lead operation to be refactored before M4's queue engine; DispatchDecision is the first queryable-guard substrate, and the common guard API supports query and dry-run, execution-time reuse, durable reason codes, revision, generation and policy binding, and no side effects during query", status: "done: DispatchDecision landed in M4-A as that substrate"}
  TIS-20: {section: "Incremental migration", kind: requirement, tracked_by: [F15.2], statement: "Only primitives a stage uses need full queryable PrimitiveSpec support before that stage is enabled; unmigrated primitives stay on the recovery interface, default to judgment-bearing for expansion and are never approximated in the ActionProjection; for each migrated operation the dry-run guard result equals the execution-time result for the same revision, generation and policy, with the M1 to M3 suites as the safety net"}
  TIS-21: {section: "14. Explicit M4/F15 ordering decision", kind: sequencing, tracked_by: [F15, F10], statement: "ADR-0011, then the shared M4/F15 foundation (queryable DispatchDecision substrate, durable reason codes, initial PrimitiveSpec), then M4's queue engine through the primitive interface (queue records, serial lease, recovery, current-head binding, no head-of-line blocking), then the F15 stage foundation (ActionProjection, the stage-intent journal, declarations for staged primitives), then the Lead-path proof (draft, start, request-review, request-verification, submit-integration with paired and adversarial evaluation), then M4's normal queue UX, then the dogfood, with M5's scheduler consuming the same action layer; M4 engine semantics do not wait on F15 but the normal M4 Lead UX does", status: "absorbed-by: TLS-28 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-22: {section: "15. Action projection and steering policy", kind: requirement, tracked_by: [F15, F15.1], statement: "No singular next_action: an ActionProjection carries revision, mechanical actions, decisions required, blockers and anomalies; a mechanical or policy-resolved action is auto_runnable only when current guards and policy fully determine it; judgment-bearing actions carry decision_required with default NONE, with no automatic default for publish, accepting evidence, classifying a failure, waiving a gate, downgrading risk, resolving a conflict, accepted_open, material hierarchy changes or stakeholder choices; an action may carry a previously recorded conditional authorization", status: "absorbed-by: TLS-10, TLS-12 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-23: {section: "16. Event-driven safety mechanics are not stage work", kind: invariant, tracked_by: [F10, F15], statement: "Safety-relevant authority mechanics happen on the event, never when the Lead next issues a command: a run's end revokes its invocation credential, a generation change revokes superseded authority, a dead integration custodian is revoked and marked for reconciliation with the lease released or transferred only after invariants prove it safe; a timeout alone never releases a load-bearing lease"}
  TIS-24: {section: "Decision: support explicit conditional publication authorization", kind: decision, tracked_by: [F10, F15.2], statement: "The publish primitive stays JUDGMENT_BEARING, but the Lead may record its publish judgment up front as a durable conditional authorization PUBLISH_IF_CLEAN_VALIDATION (for example `ticket submit-integration --publish-if-clean`), bound to at least the Ticket revision, commit_ready_seq, queue entry, accepted plan and assurance bindings, policy digest and obligations, Lead generation and the authorization conditions, and additionally to the current head and candidate at lease acquisition; the designer later decided (register F15) that the authorization survives the one automatic rebuild caused only by a moved head"}
  TIS-25: {section: "Clean-validation predicate", kind: requirement, tracked_by: [F10, F15.2], statement: "The conditional authorization is exercised only if the current DispatchDecision still allows the work, policy and obligations are unchanged, the head still matches, every required integration check passes, no required finding remains, nothing marked requires_disposition appears, no high-severity anomaly or F17 obligation appears, and no override, waiver, conflict or unexpected policy branch is required; then AEW executes the already-authorized publish CAS while the entry still holds the lease"}
  TIS-26: {section: "If clean conditions are not met", kind: requirement, tracked_by: [F10, F15.2], statement: "When the clean conditions fail the authorization is not exercised and AEW does not hold the serial lease across Lead think time: it records the evidence, anomaly or finding, retires or parks the attempt as policy requires, releases the lease after reconciliation proves it safe, moves the entry to AWAITING_DISPOSITION and lets independent entries continue; the Ticket re-enters and is revalidated against the then-current head; the path itself is evaluated in the M4 dogfood and is not permission to auto-publish after a generic pass. (The designer later decided that without advance authorization integration runs in an explicit VALIDATE_ONLY mode; register F15)"}
  TIS-27: {section: "F17 / consequential observations", kind: requirement, tracked_by: [F17, F15], statement: "Anything policy marks requires_disposition, F17 consequential observations included, appears in blocking_conditions and can block review acceptance, verification progression, submit-integration or conditional publish; a low severity label never silently clears a consequential obligation. (The designer decided F15 depends only on the generic requires_disposition property, not on F17's obligation design)"}
  TIS-28: {section: "Free-text ingress", kind: invariant, tracked_by: [F15, F4], statement: "All operator and Lead authored text enters as data, never through shell interpolation", status: "absorbed-by: TLS-09 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-29: {section: "Decomposition", kind: invariant, tracked_by: [F15, F5], statement: "An instruction to break an objective down grants authority to propose decomposition inside the approved envelope and never silently creates new stakeholder meaning or acceptance authority"}
  TIS-30: {section: "19. Anomalies are durable, not ephemeral UI", kind: requirement, tracked_by: [F15.2, F17], statement: "A stage result records which anomalies were shown (detector, severity, evidence refs, baseline id and version, observed value, expected range or rule, shown to whom and when); high-severity anomalies route through the F17 open-observation mechanism, lower ones stay durable advisories; a detector defines its baseline source and comparability rule (cohort, sample count, window, baseline digest, threshold method) and abstains with insufficient comparable history"}
  TIS-31: {section: "Equivalence", kind: evaluation, tracked_by: [F15.2], statement: "From the same starting state a stage action produces the same authoritative durable result as the documented primitive sequence", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-32: {section: "Mixed-mode walks", kind: evaluation, tracked_by: [F15.2], statement: "Seeded state-machine walks interleave stage and primitive operations, including a primitive issued after a crash and before stage continuation", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-33: {section: "Primitive classification", kind: evaluation, tracked_by: [F15.2], statement: "A stage cannot use a primitive lacking a complete PrimitiveSpec", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-34: {section: "Policy drift", kind: evaluation, tracked_by: [F15.2], statement: "Tests seed policy changes between stage expansion and each substep", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-35: {section: "Cold-history behavior", kind: evaluation, tracked_by: [F15.2], statement: "Large completed StageIntent and anomaly histories must not increase normal status, resume, dispatch or stage latency beyond ADR-0011's bounded-hot-state expectations", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-36: {section: "Hard gates", kind: gate, tracked_by: [F15.2, F19], statement: "Four hard gates that cost optimization may never trade away: no false advance across a required judgment or guard boundary in the seeded corpus; every consequential judgment has an attributable durable decision before the consequential transition; Leads under the stage UX catch seeded high-severity anomalies at least as well as the primitive baseline; crash, retry, takeover and mixed-mode cases preserve authority, idempotency, evidence binding and legal state; plus the conformance prerequisites of stage/primitive equivalence, query/execute equivalence, PrimitiveSpec coverage and bounded hot state", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  TIS-37: {section: "Reported-only optimization metrics", kind: evaluation, tracked_by: [F15.2, F19], statement: "Reported but never traded against the gates: Lead steps, operator actions, refusal, help and status churn, Lead and total token cost, wall clock, time to consequential decision and queue wait", status: "absorbed-by: TLS-27 (the governing typed Lead surface v0.2, 2026-10-05)"}
  # ---- LWE: Lead workflow efficiency proposal v0.1 (2026-09-29) ------------------------------------------------------
  LWE-01: {section: "Recommended shape: explicit stage commands", kind: requirement, tracked_by: [F15, F15.2], statement: "Stage commands named for the Lead's judgment (draft, start, request-review, request-verification with named review evidence, prepare with named verification evidence; publish kept as a separate explicit decision at first), each taking a Ticket id, `--expect-rev` and explicit evidence ids, performing only the named path through the same gates, returning every durable outcome, keeping `--launch` on the custody path and never a generic advance-until-done; verify classify stays a separate judgment, a review with blockers never triggers verification, interruption and rework never infer success, and no stage silently downgrades risk or bypasses the future assurance predicate", status: "absorbed-by: TLS-07 (the governing typed Lead surface v0.2, 2026-10-05)"}
  LWE-02: {section: "Implementation path with limited state-machine risk", kind: requirement, tracked_by: [F15.1, F15.2], statement: "First a thin deterministic façade over the existing guarded public operations: it takes the caller's expected revision, chains on each returned revision, stops on the first refusal, keeps every transition in history with its own via and authority check, and is one Lead tool call rather than one atomic commit; results carry completed steps, current revision, work state, runs, evidence accepted and the next action; a retry identifies completed substeps and never blindly re-runs a commit or merge (keep prepare separate if that is ambiguous); reuse the existing dispatch and launch path and print no credential into the model context; typed next-action projection for status, resume and results; `harness wait` returns evidence ids and the next command; `--expect-rev` stays a real CAS", status: "absorbed-by: TLS-14 (the governing typed Lead surface v0.2, 2026-10-05)"}
  LWE-03: {section: "Expected savings and ceiling", kind: evaluation, tracked_by: [F15.2, F19], statement: "The five clean-path stages fold 13 lower-level calls into 5, a target of at least a 25% reduction in workflow-command steps on matched single-Ticket runs (the 20-step median toward 15) with the number of reviews and verifications fixed; the Lead is about 40% of cost so halving it caps total savings near 20%; the first efficiency measure is successful work per dollar and minute, not command count"}
  LWE-04: {section: "Pilot and acceptance test", kind: evaluation, tracked_by: [F15.2, F19], statement: "Pilot order: instrument the command log with exit codes, error codes, revisions and substeps (done in the M3 audit, T3); implement only draft, start and request-review behind an opt-in path with the existing acceptance scenarios unchanged plus focused tests for stale revision, failed launch, missing or stale report, extra review card, handoff and partial-completion retry; extend to request-verification and prepare only after the first three preserve the invariants; replay paired clean, rework and interrupted tasks against the M3 baseline with the same model, profile and gates without reclassifying to Class 0; the designer decides whether stages become the primary interface, and any auto-accept, auto-classify or auto-publish needs its own contract review", status: "superseded-by: TLS-28 (the governing typed Lead surface v0.2, 2026-10-05)"}
  # ---- SFT: shallow finding termination proposal v0.2 (F17) ----------------------------------------------------------
  SFT-01: {section: "1. Summary", kind: requirement, tracked_by: [F17], statement: "Make stopping visible rather than reviews longer: one new evidence concept, the open consequential observation (a finding on a declared consequential surface whose consequence is neither established nor bounded) which, if the experiments show it is needed, becomes a closeout obligation with a recorded disposition; the author takes one hop, the reviewer one more plus an ask-level coverage matrix, the verifier samples outside the traced set, and a project-level join pairs what was left open; the contract owns the finding's shape, status, obligation, matrix and depth limits while a skill owns how to trace; corpus and baseline first, then skill-only and schema-only experiments, the obligation and its contract amendment last"}
  SFT-02: {section: "3. Thesis: the stop is silent because the relationship is not represented", kind: requirement, tracked_by: [F17], statement: "A record that stopped at an observation is indistinguishable today from one that traced it (facts, hypotheses, unresolved questions, observation-severity findings and completion gates carry no consequence obligation); the design represents the one link that matters, from a consequential observation to its established consequence or its bounded absence, so a consequential observation is never closed by silence, while AEW never judges whether an impact trace is correct"}
  SFT-03: {section: "5.1 Consequential surfaces and tagging", kind: requirement, tracked_by: [F17], statement: "Seven consequential surfaces (authority, trust boundaries, credentials and secrets, evidence and gate admissibility, persisted state, public behaviour and compatibility, the build and runtime chain); tags come from a project-policy `surfaces` map of path globs (deterministic, phase 2, owned or approved by the operator with the Lead proposing changes), the authoring role, a reviewer, and operator-stated premises that materially constrain the plan or investigation; untagged findings carry no obligation; tag recall and tag rate are measured separately, and broad surfaces that tag too much benign work become policy-only"}
  SFT-04: {section: "5.2 Finding fields", kind: requirement, tracked_by: [F17], statement: "Additive fields on discovery facts, review findings and verification claims: surface tags; established as observation, traced or demonstrated; a trace of consumer, effect, control and how the control was verified, each cited; consumer_search as the executable query that found the consumers, re-runnable by a verifier and by AEW; and a disposition when not traced"}
  SFT-05: {section: "5.3 Dispositions", kind: requirement, tracked_by: [F17], statement: "Dispositions: bounded (AEW re-runs the recorded git grep against the evaluated commit and every hit must be among the examined consumers), known_limit (cites the limit, argues scope, names the bounding control), follow_up (a depth-1 Ticket with origin and a per-parent budget, no further follow-ups without the operator), accepted_open (a Lead reason; concurrence by a reviewer or the operator on authority, credential and trust-boundary surfaces at Class 2 and above; a tripwire on its share reported by status and doctor); known_limit and bounded on authority or trust surfaces always enter the verifier's sample; open observations deduplicate by surface and consumer, and a disposition covers only the consumers it names"}
  SFT-06: {section: "5.4 The obligation (phase 3, only if needed)", kind: gate, tracked_by: [F17], statement: "If adopted: every tagged finding left at observation without a disposition becomes an open consequential observation on its unit, shown in gate show, status and resume, and closing the unit is refused while any remain; an accepted open goes to the project-level join and to the parent, which cannot close until its synthesis considered it; the obligation follows the record's content, not the plan's assurance; it changes when work may close, so it needs a Workflow Contract amendment, which comes last and only if the skill-only and schema-only experiments fall short"}
  SFT-07: {section: "5.5 The layers", kind: requirement, tracked_by: [F17, F7], statement: "Author: tag, then one hop per tagged finding over the whole surface with the query recorded. Reviewer: an ask-level coverage matrix, extend k tagged findings one hop past the author (k starts at 1, 2, 3 for Classes 1 to 3 and is a tunable evaluation parameter), add missed tags and findings. Verifier: at least one finding outside the already-traced set plus every known_limit and bounded on authority or trust surfaces, with runtime claims checked against the produced artifact or by execution or reported inconclusive. Join: the Lead guide requires a parent Story for split requests, and a deterministic project-level query over accepted-open observations proposes candidate pairs the model judges. Follow-ups are depth 1 and budgeted"}
  SFT-08: {section: "5.6 Lifecycle", kind: requirement, tracked_by: [F17], statement: "Record and tag; the author's hop closes it as traced, bounded or known_limit (the last two on trust surfaces still go to the verifier); otherwise it is open and closeout is refused until disposed (phase 3); a reviewer extends one hop and may add findings; the Lead disposes by trace, depth-1 follow-up or accepted open with concurrence where required; an accepted open goes to the join and the parent"}
  SFT-09: {section: "6. Contract vs skill", kind: requirement, tracked_by: [F17, D3], statement: "The contract and engine own what is checkable: the surface list and policy globs, the finding fields, citation resolution, re-run queries, the closeout obligation (with its amendment), concurrence and the tripwire, the ask-level matrix, the reviewer extension count, verifier sampling, follow-up depth and budget, the dedup guard and candidate-pair generation; models own sub-asks, consequentiality of untagged observations, consumer-list completeness, impact correctness and the known-limit argument, sampled by review and verification; the skill (compact card text until skills reach runs) says follow the writer not the name, a limit label is a claim to test, ground runtime claims in what is produced, list the consumers of every changed input, record the query, and stop after one hop"}
  SFT-10: {section: "7. Tradeoffs", kind: decision, tracked_by: [F17], statement: "Depth is capped at three places (author one hop, reviewer one more, longer chains as budgeted depth-1 follow-ups) with deduplication and its guard; Class 0 stays cheap because obligations attach only to tagged findings and Class 0 has no reviewer k; traces are four short cited fields, never essays; the reviewer's matrix comes from the ticket's asks rather than the author's framing, the verifier samples outside both, and for the highest class a reviewer seals expected surfaces before reading the record; tag volume is measured and broad surfaces can become policy-only"}
  SFT-11: {section: "8.1 Corpus", kind: evaluation, tracked_by: [F17, F19], statement: "Eight cases with controls (R1 given, discover, split, control, synthetic; SPT headless and item 9; a coverage case), each with a pass criterion; all come from the two misses the design targets, so every new incident becomes a held-out case never used to tune prompts, k or surfaces, and a decision to proceed to phase 3 must hold on the held-out cases"}
  SFT-12: {section: "8.2 Arms", kind: evaluation, tracked_by: [F17, F19], statement: "Arms on the same model: the plain LLM, AEW today, skill-only (the card scaffold), schema-only (fields, policy path tagging and recorded queries, no obligation); then, only if those fall short, the schema with the obligation and the full design; comparing skill-only with schema-only separates the prompt's effect from the structure's"}
  SFT-13: {section: "8.3 Protocol", kind: evaluation, tracked_by: [F17, F19], statement: "At least five runs per case and arm (directional only), a rubric fixed before running, and answers, controls and held-out cases kept outside the distribution during tested runs"}
  SFT-14: {section: "8.4 Metrics", kind: evaluation, tracked_by: [F17, F19], statement: "Tag recall, reach on tagged findings, false consequences on controls, tag rate on benign real work, size and spend, depth and fan-out, and Lead behaviour (the disposition mix and the accepted_open share)"}
  SFT-15: {section: "9. Phasing and cost", kind: sequencing, tracked_by: [F17], statement: "Phase 1 corpus and baseline with nothing implemented; phase 2 skill-only and schema-only experiments run separately (policy path tagging moved here); phase 3 the obligation only if needed, with concurrence, the tripwire, the dedup guard and the join and its contract amendment; phase 4 reviewer extends and verifier sampling, with the ask-level coverage matrix shippable independently; phase 5 sealed reviewer expectations for the highest class; expected cost near zero on untagged work, with tag volume the cost to watch; F17 absorbs U2, links F14 and U3 and shares F7's budgets"}
  SFT-16: {section: "10. Decisions (2026-10-01)", kind: decision, tracked_by: [F17, U3], statement: "The operator owns or approves the surfaces policy and the Lead may propose changes; accepted_open needs concurrence on authority, credential and trust-boundary surfaces at Class 2 and above plus a share tripwire; F17 is a distinct item that absorbs U2 and links F14 and U3, with the coverage matrix shippable independently; reviewer k of 1, 2, 3 is a tunable evaluation parameter; operator premises enter as observations only when they materially constrain the plan or investigation; the baseline runs before anything is implemented or frozen; the Workflow Contract amendment comes last and only if the experiments show the obligation is needed; split requests require a parent Story with candidate pairs generated by a project-level query"}
  SFT-17: {section: "12. Still to settle by evaluation", kind: open-question, tracked_by: [F17], statement: "Open for evaluation: the tripwire threshold for the accepted_open share; the tag-rate budget per ticket and which surfaces become policy-only; an operational test for materially constrains for operator premises; the reviewer k values"}
  # ---- CDP: capability discovery and progressive disclosure v0.1 (F13) ----------------------------------------------
  CDP-01: {section: "1. Purpose", kind: requirement, tracked_by: [F13], statement: "A Lead or worker learns what the environment can do without loading every installed capability's documentation and schemas into every context; the capability system does discovery, authorization and context economy, under the rule advertise capabilities broadly, describe them narrowly, expand them only on demand; progressive disclosure is a context-management requirement and harness-native features are capability providers to exploit safely rather than disable"}
  CDP-02: {section: "3. Capability model", kind: requirement, tracked_by: [F13, F12], statement: "One discovery model over several capability kinds: procedural (skills), tool and service (MCP servers, local CLIs, remote providers, validation environments), harness-native (sandboxing, compaction, native review, orchestration, subagents, session resume) and AEW-native workflow operations; the registry does not normalize providers to the lowest common denominator, and a harness-native capability may be used when it improves execution inside AEW authority and policy"}
  CDP-03: {section: "4. Available, authorized, and active are different", kind: invariant, tracked_by: [F13], statement: "AVAILABLE (the workbench can supply it), AUTHORIZED (role, project policy and execution envelope permit this invocation to use it) and ACTIVE or RESOLVED (a concrete healthy provider is selected) are distinct; discovery is not authority, and learning that a capability exists grants no permission to use it"}
  CDP-04: {section: "5. Effective Capability Manifest", kind: requirement, tracked_by: [F13], statement: "An invocation receives a small Effective Capability Manifest derived from the global registry, installed healthy providers, the selected harness and adapter, role grants, project policy, the work unit and the approved execution envelope, containing only capabilities relevant or plausibly useful to the bounded assignment and small enough that adding a large MCP server does not materially consume task context unless the invocation uses it"}
  CDP-05: {section: "L0 — Awareness", kind: requirement, tracked_by: [F13], statement: "L0 answers what broad capabilities exist for the task, why they might be used and where to ask for more, with no operation schemas"}
  CDP-06: {section: "L1 — Capability detail", kind: requirement, tracked_by: [F13], statement: "L1 answers what a capability is good for, its limitations and authority boundaries, its provider and its operations or sub-capabilities"}
  CDP-07: {section: "L2 — Operation detail", kind: requirement, tracked_by: [F13], statement: "L2 answers what an operation does, when to use it and its important inputs and outputs, still without unrelated provider operations"}
  CDP-08: {section: "L3 — Exact invocation schema", kind: requirement, tracked_by: [F13], statement: "Only when an operation is actually selected does AEW expose the exact schema or tool contract needed to invoke it; the exact syntax is not frozen"}
  CDP-09: {section: "7. Harness-native capabilities", kind: requirement, tracked_by: [F13, F24], statement: "Harness adapters participate in the registry and advertise capabilities such as sandbox, context compaction, native orchestration, native review, native subagents, session resume and workspace isolation with enough metadata for AEW to decide their use; harness neutrality means portable engineering semantics with capability-aware backends, not disabling every feature another harness lacks"}
  CDP-10: {section: "8. Harness-native orchestration boundary", kind: invariant, tracked_by: [F13, F7], statement: "Harness-native child agents or workflows are execution machinery, not AEW workers: unless AEW explicitly creates separate authority-bearing invocations they receive no AEW identity, authority or credentials, cannot transition project state, satisfy gates, grant capabilities or prompt the stakeholder, cannot outlive the parent invocation's authority boundary, and return results attributable to the parent; native orchestration increases execution power, never AEW authority"}
  CDP-11: {section: "9. Skills and abstract capability requirements", kind: requirement, tracked_by: [F13, D3], statement: "Skills prefer abstract capability needs over concrete provider names (an available reverse-engineering capability rather than Ghidra), which AEW resolves to a provider, and may conditionally exploit a capability when it is authorized and fall back otherwise"}
  CDP-12: {section: "10. Lead planning surface", kind: requirement, tracked_by: [F13], statement: "The Lead receives capability topology by area (investigation, execution, review, infrastructure) rather than operation schemas; workers receive detailed manifests only for their bounded assignments"}
  CDP-13: {section: "11. Context-pack integration", kind: requirement, tracked_by: [F13], statement: "Capability disclosure is part of bounded context construction: the Lead gets the topology, a worker its effective manifest, then capability detail on selection, then the exact schema on operation selection; a context pack never automatically contains the global registry or complete tool schemas"}
  CDP-14: {section: "12. Deterministic reconstruction and provenance", kind: requirement, tracked_by: [F13], statement: "AEW can reconstruct what capability knowledge an invocation had: references and hashes to the effective manifest version, the summaries exposed, the schemas expanded, skill versions, provider identity and version and adapter feature flags, by stable reference and content hash rather than duplicated manuals"}
  CDP-15: {section: "13. Context-economy acceptance criteria", kind: evaluation, tracked_by: [F13, F19], statement: "Capability growth must not force proportional baseline-context growth: with a 10-capability and a 100-capability workbench (including a large MCP server) on a localized review that does not need the server, the initial manifest stays task-proportional, full schemas are not injected, the model can still discover the server if relevant and expand progressively; for a task that needs the server, the model discovers it from the summary, navigates to operations, obtains the exact schema and invokes it without the full manual in initial context"}
  CDP-16: {section: "14. Choice-noise goal", kind: requirement, tracked_by: [F13, F19], statement: "Beyond token count, the design reduces decision noise: small semantic categories, then a selected capability, then a small operation set, then the exact schema, instead of hundreds of unrelated operations at once; target-model evaluation tests both context cost and task performance"}
  CDP-17: {section: "15. Failure classes", kind: open-question, tracked_by: [Q8], statement: "Candidate classes CAPABILITY_CONTEXT_BLOAT, CAPABILITY_DISCOVERY_FAILURE, CAPABILITY_AUTHORITY_CONFUSION, CAPABILITY_SCHEMA_OVEREXPOSURE, HARNESS_FEATURE_SUPPRESSION and HARNESS_AUTHORITY_LEAK, to be reconciled with the canonical failure-class registry before implementation"}
  CDP-18: {section: "16. Invariants", kind: invariant, tracked_by: [F13, Q8], statement: "Discovery is not authority; the global registry is not the invocation manifest; roles get an effective view, not the workbench manual; advertise broadly, describe narrowly, expand on demand; exact schemas are lazy-loaded; expansion never silently widens role authority; harness-native features never implicitly increase AEW authority; skills may request abstract capability classes; capability details used are reconstructible by reference and hash; unrelated capabilities do not linearly inflate baseline context. To be added to the invariant index (Q8)"}
  CDP-19: {section: "18. Implementation sequencing", kind: sequencing, tracked_by: [F13, F24], statement: "After M3's acceptance: stabilize the capability registry and contract, add the Effective Capability Manifest, add lazy capability, operation and schema expansion, teach adapters to advertise harness-native capabilities, bring a Codex adapter onto the same contract, then evaluate context cost and task performance; M3 is not expanded to implement this"}
  # ---- ISO: execution workspace and isolation design v0.1 (F3; containment built in M4-B) --------------------------
  ISO-01: {section: "Logical isolation", kind: invariant, tracked_by: [F3], statement: "Logical isolation (invocation identity, credentials, authority, evidence and revision binding, role boundaries, workflow state, review and verification semantics) is owned by AEW and is distinct from filesystem and process isolation (what a worker can read and write, where scratch lives, host visibility, cross-worker mutation, mutation of the real checkout), which is an execution and deployment mechanism never conflated with AEW authority"}
  ISO-02: {section: "4. Design goal", kind: requirement, tracked_by: [F3], statement: "AEW provides an isolation abstraction whose concrete strategy depends on required mutability, concurrency, repository scale, task scope, setup and build cost, deployment environment and desired containment strength; isolated never simply means a new Git worktree"}
  ISO-03: {section: "5. Required invariants", kind: invariant, tracked_by: [F3], statement: "Whatever the strategy: no AEW authority through filesystem access; evidence and state stay revision-bound; reviewer and verifier mutation rules stay enforceable; scratch and build output have explicit authorized locations; the protected checkout is never silently mutated when policy requires isolation; setup cost does not grow unbounded relative to task value; the strategy is inspectable and recorded per run; selection fails closed when the safety property cannot be provided; cleanup never destroys unrelated state; guarantees are described accurately, and workdir separation is never presented as OS containment", status: "done: partly; the label rule and fail-closed launch are built (ADR-0009, M4-B), the strategy abstraction remains F3"}
  ISO-04: {section: "6.1 WORKTREE", kind: requirement, tracked_by: [F3], statement: "A dedicated Git worktree per mutating unit or run: straightforward revision isolation, but expensive on huge file counts, with disk, metadata and cleanup pressure that composes badly with parallelism; appropriate when scale and bootstrap cost are modest", status: "done: the strategy M4-C built for N > 1 mutating Tickets"}
  ISO-05: {section: "6.2 SHARED_READONLY", kind: requirement, tracked_by: [F3], statement: "Workers inspect a shared source tree that is physically or effectively read-only, with scratch and build output elsewhere; useful for investigators, most reviewer tasks, source-only verification and codebase mapping, and avoids unnecessary per-role checkouts"}
  ISO-06: {section: "6.3 SHARED_MUTABLE_SERIAL", kind: requirement, tracked_by: [F3, F10], statement: "One mutable checkout with AEW enforcing serial mutation, for prohibitive worktree cost or unnecessary parallel mutation, never confused with strong containment; its serialization lock is load-bearing, bound to an owning invocation or run, and after a crash the stale owner is classified under AEW's interruption semantics and its workspace and authority reconciled before the lock passes to a new mutator; a stale lock is never simply deleted (AEW-INV-ISO-004, moved to M4-D by the operator)"}
  ISO-07: {section: "6.4 OVERLAY / COPY-ON-WRITE", kind: requirement, tracked_by: [F3], statement: "A shared read-only lower tree plus a private writable overlay per worker: full-tree visibility, private changes, lower duplication and stronger host protection, with feasibility depending on the OS, container or runtime"}
  ISO-08: {section: "6.5 SPARSE WORKSPACE / PARTIAL MATERIALIZATION", kind: requirement, tracked_by: [F3], statement: "Only relevant regions materialized, usable when structure and dependency boundaries make partial checkout safe and never where completeness cannot be established (risks: missing dynamic, configuration and build dependencies, false confidence)"}
  ISO-09: {section: "6.6 CONTAINER / SANDBOX", kind: gate, tracked_by: [F3], statement: "A process or container boundary with controlled mounts combining a protected host checkout, scoped writable roots, private scratch and bounded tool access; a mechanism that enforces protected writable roots at the OS or runtime boundary is a prerequisite for real-repository dogfood and internal alpha, and whatever mechanism is chosen must pass the containment regression gate", status: "done: bubblewrap per run on Linux (M4-B, 2026-10-03); the gate passes in CI and on Rocky 8"}
  ISO-10: {section: "7. Strategy selection inputs", kind: requirement, tracked_by: [F3], statement: "Strategy selection uses measurable facts (tracked file and entry counts, repository size, worktree creation and cleanup latency, disk use, bootstrap cost, task mutability, parallel mutation need, role, scope, required containment strength), never repository size alone"}
  ISO-11: {section: "8. Lead and AEW responsibilities", kind: requirement, tracked_by: [F3], statement: "The Lead decides whether parallelism is useful; AEW policy decides which isolation and concurrency combinations are permitted; the Lead adapts the plan to the constraints (serialize mutating work, run read-only investigation concurrently) instead of fighting them"}
  ISO-12: {section: "9. Project isolation profile", kind: requirement, tracked_by: [F3], statement: "Projects declare or derive isolation constraints (a preferred strategy, whether worktrees are allowed and why), with the schema not frozen and measured performance informing configuration where possible"}
  ISO-13: {section: "Implementer", kind: requirement, tracked_by: [F3], statement: "Implementers usually need a writable view: a worktree, an overlay, or shared mutable serial"}
  ISO-14: {section: "Reviewer", kind: requirement, tracked_by: [F3], statement: "Reviewers need the exact reviewed revision, read access, safe scratch and possibly bounded probe execution; a full writable worktree is not assumed", status: "done: reviewers get read-only source under M4-B containment"}
  ISO-15: {section: "Verifier", kind: requirement, tracked_by: [F3], statement: "Verifiers need the exact revision, verification capability, isolated scratch and build state, and protection against mutating the authoritative review target", status: "done: verifiers get read-only source under M4-B containment"}
  ISO-16: {section: "Investigator/Researcher/Planner", kind: requirement, tracked_by: [F3], statement: "Investigators, researchers and planners are often read-only and strong candidates for shared read-only source plus private scratch"}
  ISO-17: {section: "11. Scratch directories", kind: requirement, tracked_by: [F3], statement: "Every run needing temporary output receives an explicit scratch location that is clearly communicated, scoped to the run, outside protected state where appropriate, cleaned safely and never authoritative evidence by existence; write outside the workspace is insufficient guidance (AEW-INV-SCRATCH-001)", status: "done: per-run private scratch since M3; enforced by containment in M4-B"}
  ISO-18: {section: "12. Containment regression requirements", kind: gate, tracked_by: [F3], statement: "A claimed filesystem containment is tested against exact outside paths (absolute write, dot-dot traversal, symlink escape, rename across the boundary, mkdir outside writable roots, temporary files outside scratch, Python open, shell redirect, tool invocation naming another checkout) with an OS-level write failure and no external mutation required; the suite is the acceptance gate for any mechanism advertised as stronger than workdir separation, and after-the-fact detection is defence in depth only", status: "done: the containment regression gate of M4-B"}
  ISO-19: {section: "13. Performance acceptance", kind: gate, tracked_by: [F3], statement: "Isolation is benchmarked on small, medium and large (security-research-platform-scale) repositories for setup latency, disk growth, first-command latency, cleanup latency, concurrency pressure and retry cleanup; a safe but unusable strategy is not an acceptable default, and benchmark acceptance is the selection gate for a project default (AEW-INV-ISO-003)"}
  ISO-20: {section: "14. Interaction with delegation/resource governance", kind: invariant, tracked_by: [F3, F7], statement: "Isolation cost multiplies with fanout (agents times a worktree each times a million-file repository), so agent-count policy and workspace policy are designed together, never independently"}
  ISO-21: {section: "14.1 Filesystem isolation does not prove semantic independence", kind: invariant, tracked_by: [F3, F10], statement: "Separate worktrees, overlays or sandboxes prevent live filesystem collisions but do not prove two Tickets semantically independent; integration-stage checks at COMMIT_READY remain responsible for detecting cross-Ticket overlap and conflict, and isolation makes them more important, not less (AEW-INV-INTEGRATE-001)"}
  ISO-22: {section: "15. Failure classes", kind: requirement, tracked_by: [F3], statement: "This design owns HOST_WRITE_ESCAPE, ISOLATION_OVERHEAD_FAILURE, WORKSPACE_LEAK, CLEANUP_DAMAGE, FALSE_CONTAINMENT_CLAIM and motivates RESOURCE_COMPOSITION_FAILURE, which replaces the local alias RESOURCE_MULTIPLICATION; definitions live in the registry"}
  ISO-23: {section: "16. Open questions", kind: open-question, tracked_by: [F3], statement: "Open at v0.1: which strategies the first production dogfood needs; whether OS containment is a prerequisite for personal dogfood (answered yes, Q3); overlayfs and container mounts on Rocky 8 (answered by the containment research and M4-B's bubblewrap); sharing build outputs and caches; reviewers and verifiers on shared read-only source (built in M4-B); workspace strategy under mutating concurrency (M4-C uses worktrees); the measurements that trigger worktrees not recommended; exposure of toolchain directories; read-only visibility versus hiding; mapping Windows development onto Linux semantics (Windows stays workdir separation only)"}
  # ---- HIR: hierarchy intent revision and replanning design v0.1 (F4, F5) -------------------------------------------
  HIR-01: {section: "3. Core principle", kind: invariant, tracked_by: [F5], statement: "Parents preserve purpose; Tickets preserve proof: higher hierarchy levels preserve purpose while allowing understanding to evolve, lower levels preserve the proposition that evidence claims to prove, which is why a Story may change more than an active Ticket (AEW-INV-HIER-001)"}
  HIR-02: {section: "Epic", kind: requirement, tracked_by: [F5], statement: "An Epic is a major stakeholder outcome or intent envelope that survives substantial changes in implementation understanding; its purpose is comparatively stable while its framing may evolve"}
  HIR-03: {section: "Story", kind: requirement, tracked_by: [F5], statement: "A Story is a coherent problem slice, approach or capability area within an Epic, expected to evolve more often than Epics as research and implementation refine the approach"}
  HIR-04: {section: "Ticket", kind: requirement, tracked_by: [F4], statement: "A Ticket is a bounded execution contract tight enough that evidence binds to it, review and verification can judge it, dependencies rely on its meaning and rework stays about the same proposition; once authoritative work begins, material changes to its acceptance meaning are dangerous"}
  HIR-05: {section: "4.1 EDITORIAL", kind: requirement, tracked_by: [F4, F5], statement: "EDITORIAL changes are permitted only when semantic non-change is mechanically verifiable (whitespace, punctuation that cannot change meaning, spelling with the acceptance-bearing token set identical); if semantics could plausibly change it is not editorial; the cross-cutting fail-closed rule applies (the heavier category is the default, downgrading needs justification reviewable by someone other than the classifier)"}
  HIR-06: {section: "4.2 CLARIFICATION", kind: requirement, tracked_by: [F4, F5], statement: "CLARIFICATION makes wording more explicit with acceptance meaning unchanged; after authoritative evidence is bound it is a downgrade from the MATERIAL default and needs recorded justification plus confirmation by a fresh-context Reviewer or Verifier independent of the classifier, and existing evidence stays admissible only if that confirmation and freshness hold (AEW-INV-HIER-003)"}
  HIR-07: {section: "4.3 MATERIAL", kind: requirement, tracked_by: [F4, F5], statement: "Any change to an acceptance-bearing field after evidence is bound is MATERIAL by default: impact analysis, plan and evidence invalidation as appropriate, stakeholder approval when the change is consequential intent, and Ticket replacement or supersession when existing evidence would change meaning (AEW-INV-HIER-002)"}
  HIR-08: {section: "4.4 STRUCTURAL / SCOPE", kind: requirement, tracked_by: [F5], statement: "STRUCTURAL or SCOPE changes (splitting or merging Stories, replacing an abandoned approach, adding or removing planned Tickets, broadening a Story to a discovered root cause) get Lead-owned impact analysis, descendant replan or restructure, preservation of valid completed evidence, and stakeholder approval only when the change leaves the approved envelope or changes stakeholder-owned intent"}
  HIR-09: {section: "5. Authority model", kind: requirement, tracked_by: [F5], statement: "The Lead discovers, classifies and impact-analyses a change, applies it through AEW authority inside the delegated envelope or requests stakeholder approval outside it, and AEW applies the revision or supersession and invalidates or refreshes affected plans, evidence and contexts; the Lead never silently changes stakeholder intent, and lighter classifications take the fail-closed path"}
  HIR-10: {section: "Lead may ordinarily", kind: requirement, tracked_by: [F5], statement: "For an Epic the Lead may reframe it around discovered structure, refine wording, add derived sub-objectives inside the approved outcome, restructure its Stories and propose material changes"}
  HIR-11: {section: "Stakeholder approval is required when", kind: requirement, tracked_by: [F5], statement: "Stakeholder approval is required when the Epic's outcome, externally visible intent or compatibility commitments materially change, scope or cost change majorly, a prior stakeholder decision is overturned, or the new meaning would reasonably be a different objective"}
  HIR-12: {section: "7. Story revision semantics", kind: requirement, tracked_by: [F5], statement: "The Lead has substantial authority to revise, broaden, narrow, split, merge, replace, add or remove Stories and restructure or replan their Tickets after research, bounded by the Epic's approved intent, accepted stakeholder decisions, governing contracts, scope and cost policy and deterministic AEW authority; a revised Story preserves lineage rather than being recreated"}
  HIR-13: {section: "Before execution begins", kind: requirement, tracked_by: [F4], statement: "A Ticket with no invocation, authoritative evidence, review, verification or downstream reliance may have its goal revised by an authorized actor, with the revision recorded"}
  HIR-14: {section: "After execution begins", kind: invariant, tracked_by: [F4], statement: "No Ticket goal change may silently preserve evidence whose meaning depended on the previous goal; for any acceptance-bearing field with bound evidence the default classification is MATERIAL"}
  HIR-15: {section: "EDITORIAL", kind: requirement, tracked_by: [F4], statement: "After execution, an editorial Ticket change is allowed only when semantic non-change is mechanically verifiable"}
  HIR-16: {section: "CLARIFICATION", kind: requirement, tracked_by: [F4], statement: "After execution, a clarification is allowed only after the Lead records why acceptance meaning is unchanged and a fresh-context Reviewer or Verifier independently confirms the bound evidence still proves the same proposition; otherwise it is MATERIAL"}
  HIR-17: {section: "MATERIAL", kind: requirement, tracked_by: [F4], statement: "A material Ticket change never overwrites the goal in place: the old Ticket reaches its terminal state (normally CANCELLED with a supersession reason) with a supersession relationship to a replacement Ticket carrying the corrected goal; existing evidence stays attached to the old Ticket and historically valid, and the replacement receives fresh admissible evidence. (Amended 2026-09-30: a material change becomes a new immutable revision of the same Ticket, with replacement kept for a change of kind, a move, or a non-overlapping goal; see the Ticket-revision amendment, register F4)"}
  HIR-18: {section: "9. Ticket supersession lineage", kind: invariant, tracked_by: [F4], statement: "Supersession is a relationship layered on existing lifecycle states, not a new state (AEW-INV-HIER-004): replacement work records why it exists and what it supersedes, supersession never erases the old Ticket or its evidence, the replacement's gates never silently accept evidence bound to the old proposition, and parent closeout requires an explicit disposition for every superseded descendant (AEW-INV-HIER-005)"}
  HIR-19: {section: "10.1 Intent ingress integrity", kind: requirement, tracked_by: [F4], statement: "Free-form authored semantics (goals, acceptance criteria, stakeholder decisions, review and verification text, agent-produced semantic fields) enter AEW as opaque data through structured payloads, stdin, files or direct argv arrays, never through an interpolated shell command string; a regression corpus of shell-significant literals (dollar amounts, substitutions, backticks, globs, quotes, backslashes and Windows paths, multiline text, Unicode) asserts byte preservation into authoritative state on every supported environment; this is immediate hardening, independent of supersession (AEW-INV-INTENT-001)", status: "done: `--fields` and the M3 ingress hardening; the regression corpus is in the M3 review fixes"}
  HIR-20: {section: "10.2 Supported goal revision/supersession", kind: requirement, tracked_by: [F4], statement: "When AEW detects that authoritative intent itself is wrong there is a first-class recovery path rather than ad hoc manual reconstruction"}
  HIR-21: {section: "11. Verification's role", kind: invariant, tracked_by: [F4, F6], statement: "Review and verification answer different questions: review judges the implementation against plan, code, contracts and scope, verification whether the delivered state satisfies the acceptance conditions and may therefore find implementation, environment, evidence, plan or goal defects; a review pass never prevents verification from classifying the goal or plan as defective"}
  HIR-22: {section: "11.1 Verification failure classification authority", kind: requirement, tracked_by: [F6], statement: "The Verifier reports the failure and evidence and may propose a classification; the Lead makes the authoritative classification through the normal control path; fail closed: evidence of a plan, design or contract defect or an uncertain case defaults to REPLAN_REQUIRED, the Lead may not downgrade a verifier-raised design concern to a local defect to obtain cheaper rework, and a downgrade needs recorded justification and independent fresh-context confirmation; to be reconciled with the Workflow Contract and `verify classify` before freezing (register Q4, AEW-INV-VERIFY-001)"}
  HIR-23: {section: "12. Goal change impact analysis", kind: requirement, tracked_by: [F5], statement: "Any non-editorial revision considers whether it invalidates the plan, context packs, implementation, review or verification evidence, affects dependencies, descendants or parent closeout, contradicts stakeholder decisions, or requires holding or interrupting active workers; impact is derived and recorded, never implicit"}
  HIR-24: {section: "13. Evidence preservation", kind: requirement, tracked_by: [F5, F4], statement: "Revision never discards provenance: historically valid evidence and currently admissible evidence are distinct (a first-class Knowledge Contract concept whose schema is not frozen), gate evaluation determines current admissibility without deleting or falsifying history, evidence whose supported proposition changed does not silently satisfy current gates, and a superseded Ticket's evidence does not satisfy the replacement's gates without an explicit safe-reuse rule (AEW-INV-EVID-001)"}
  HIR-25: {section: "14. Active work during hierarchy revision", kind: requirement, tracked_by: [F5], statement: "When an Epic or Story revision affects active work the Lead classifies each descendant explicitly (unchanged, context update, replan, hold, supersede; labels not frozen)"}
  HIR-26: {section: "16. Research-specific behavior", kind: requirement, tracked_by: [F5], statement: "Research findings must be able to change the plan structure they were commissioned to inform (revised framing, abandoned approaches, new or merged Stories, changed decomposition, further investigation, narrower or broader scope within approved intent); the Lead turns findings into explicit impact and replan decisions"}
  HIR-27: {section: "Lead", kind: requirement, tracked_by: [F5], statement: "The Lead may identify, classify, impact-analyse, revise and restructure within delegated authority, propose stakeholder-owned changes and apply approved ones through AEW; it may not silently rewrite stakeholder intent, rewrite active acceptance goals so old evidence changes meaning, keep stale evidence current for convenience, or bypass governing contracts"}
  HIR-28: {section: "Stakeholder", kind: requirement, tracked_by: [F5], statement: "The stakeholder owns consequential product and intent decisions and may approve, reject or redirect material Epic and Story changes; stakeholder approval does not itself mutate AEW state, normal authority paths perform the change"}
  HIR-29: {section: "AEW", kind: requirement, tracked_by: [F5], statement: "AEW owns the allowed transitions, revision and supersession mechanics, evidence invalidation, lineage, dependency impact, plan freshness and authority enforcement"}
  HIR-30: {section: "18. Relationship to approved execution envelope", kind: requirement, tracked_by: [F5], statement: "A revision inside the approved execution envelope proceeds under Lead authority; a change exits the envelope when it materially changes the stakeholder outcome, external behaviour, compatibility, a security or reliability commitment, major scope or cost, or an explicit stakeholder decision, and then requires stakeholder involvement"}
  HIR-31: {section: "18.1 Cumulative revision drift", kind: invariant, tracked_by: [F5], statement: "Every revision retains the approved execution-envelope baseline; impact analysis compares the proposed revision to that baseline as well as to the preceding revision, so a sequence of small in-envelope changes cannot walk the work outside what was approved, and checkpoints surface cumulative divergence (AEW-INV-HIER-006)"}
  HIR-32: {section: "21. Open questions", kind: open-question, tracked_by: [F5, Q5], statement: "Twelve questions before freezing: explicit version numbers or immutable revision records for Epics and Stories; which terminal states carry supersession; which Ticket changes are allowed before first invocation; deterministic checks sufficient to prove a clarification; rebinding evidence versus recomputing freshness after parent revision; ancestor-plan binding under revision; dependency edges when Stories split or merge; the representation of required dispositions at parent closeout; the Lead's exact restructuring authority; whether pre-approved envelopes can authorize some material Epic changes; how revisions appear in resume and status; their representation in the Knowledge Contract and the control schema"}
  HIR-33: {section: "23. Non-goals", kind: decision, tracked_by: [F5], statement: "Not in scope: arbitrary in-place goal mutation, freely editable hierarchy objects, discarding old evidence, stakeholder chat mutating authoritative state, a new Epic or Story per discovery, stakeholder approval for every Story refinement, weaker Ticket evidence binding, or replacing normal rework when the goal is still correct"}
  # ---- LOI: Lead / operator interaction design v0.1 (F7, F8) ----------------------------------------------------------
  LOI-01: {section: "Stakeholder-owned information", kind: requirement, tracked_by: [F8], statement: "Stakeholder-owned information (desired external behaviour, compatibility, product trade-offs, acceptable scope, priorities, persistence semantics, security or reliability requirements with several reasonable policies, what counts as completion, subjective preferences) is elicited, never derived"}
  LOI-02: {section: "Engineering-derivable information", kind: requirement, tracked_by: [F8], statement: "Engineering-derivable information (where code lives, call relationships, conventions, tests, initialization and cleanup paths, current behaviour, discoverable dependencies, existing helpers) is investigated by the Lead instead of asked of the stakeholder (AEW-INV-LEAD-001)"}
  LOI-03: {section: "Scoped reconnaissance", kind: requirement, tracked_by: [F8], statement: "Localized work gets scoped reconnaissance (the struct, its constructors, mutation paths, callers, tests, conventions) and normally proceeds straight to planning"}
  LOI-04: {section: "Area investigation", kind: requirement, tracked_by: [F8], statement: "Work affecting a subsystem or its boundaries gets an area investigation (boundaries, existing mechanisms, producers and consumers, persistence, lifecycle, tests, contracts, neighbouring dependencies)"}
  LOI-05: {section: "Project mapping / remapping", kind: requirement, tracked_by: [F8, F22], statement: "Project mapping or remapping is used when onboarding a project, when existing knowledge is materially stale, when an objective spans broad architecture, when structural changes invalidate understanding, or when the Lead judges it justified; a complete map is never rebuilt for every Ticket"}
  LOI-06: {section: "6. Durable project maps and freshness", kind: requirement, tracked_by: [F22, F8], statement: "Project maps are derived knowledge, not authority; a map identifies its basis (a Git tree) and coverage, staleness is change- and dependency-aware (map basis plus source changes plus known relationships give the affected regions) rather than age-based, source outranks the map, and a disagreeing map is stale"}
  LOI-07: {section: "7. Investigation capabilities", kind: requirement, tracked_by: [F8, D3], statement: "Investigation may use ripgrep, Git, AST parsers, language-server and reference tooling, graph and impact tools, repository search, test discovery, source inspection and documentation; tools are not the map; a reusable codebase-investigation skill describes how workers produce bounded verifiable understanding at SCOPED, AREA or PROJECT_MAP scope chosen by the Lead"}
  LOI-08: {section: "ENGINEERING-DERIVABLE", kind: requirement, tracked_by: [F8], statement: "Uncertainty whose answer can reasonably be discovered from source, accepted documents, evidence, tests, conventions or bounded investigation is investigated, never asked"}
  LOI-09: {section: "LOW-CONSEQUENCE AMBIGUITY", kind: requirement, tracked_by: [F8], statement: "Ambiguity with little long-term consequence inside normal implementation discretion is resolved by a reasonable interpretation exposed as an assumption in the plan, which the stakeholder may correct at plan review"}
  LOI-10: {section: "CONSEQUENTIAL STAKEHOLDER AMBIGUITY", kind: requirement, tracked_by: [F8], statement: "An unresolved choice that materially affects external behaviour, compatibility, long-cost architecture, security or trust, reliability or data loss, persistence, substantial scope or cost, a product trade-off or a non-derivable preference is discussed before final planning; the Lead initiates the discussion and the stakeholder never needs to remember a discussion command"}
  LOI-11: {section: "9. Proportional discussion behavior", kind: requirement, tracked_by: [F8], statement: "Discussion is not ceremony: sufficiently specified work is investigated and planned, consequential work gets targeted questions that explain why each answer matters, and missing information is first checked for whether AEW should discover it itself"}
  LOI-12: {section: "10. Planning and approval", kind: requirement, tracked_by: [F8], statement: "A plan summarizes intended outcome, decomposition, dependencies, parallelizable work, assumptions, incorporated stakeholder decisions, risks, non-goals, review and verification boundaries and non-trivial resource shape; approval establishes an approved execution envelope inside which the Lead dispatches, reorders independent work, investigates, reworks, reviews and verifies, retries, chooses implementation details, restructures locally and allocates bounded effort without repeated approval (AEW-INV-LEAD-002)"}
  LOI-13: {section: "11. When reapproval is required", kind: requirement, tracked_by: [F8], statement: "The Lead returns to the stakeholder when execution materially leaves the envelope (new external behaviour, changed compatibility, materially different architecture, major scope expansion, a new security or reliability trade-off, contradiction with an accepted decision, invalidation of a major part of the plan); routine rework does not"}
  LOI-14: {section: "Local implementation preference", kind: requirement, tracked_by: [F8, F9], statement: "A stakeholder's local implementation preference steers the affected work, which continues"}
  LOI-15: {section: "Durable requirement or decision", kind: requirement, tracked_by: [F8, F9], statement: "A durable requirement or decision is recorded as a durable stakeholder decision, its affected assumptions and work identified and the decision propagated, with work continuing where the envelope still holds"}
  LOI-16: {section: "Material plan change", kind: requirement, tracked_by: [F8, F9], statement: "A material plan change records the new requirement, invalidates conflicting assumptions, holds or interrupts affected work where necessary, revises the plan and requests reapproval if the envelope materially changed"}
  LOI-17: {section: "Stop or major redirection", kind: requirement, tracked_by: [F8, F9], statement: "A stop or major redirection stops or holds affected work through normal AEW authority, summarizes the current state and enters stakeholder discussion"}
  LOI-18: {section: "13. Durable stakeholder decisions", kind: requirement, tracked_by: [F8], statement: "Meaningful stakeholder directives become durable project knowledge (a decision record with source, what it supersedes, scope and affected work) rather than conversational text; future context reconstruction receives the current decision and superseded assumptions do not silently survive"}
  LOI-19: {section: "14. Active-run propagation", kind: requirement, tracked_by: [F9, F8], statement: "When new information affects active work the Lead decides between no action, a bounded informational update, steering, interruption and reconsideration, or supersession and relaunch; updates are minimal and provenance-bound; coordination moves knowledge and existing authority paths move project state (AEW-INV-AUTH-001)"}
  LOI-20: {section: "15. Attention contract", kind: requirement, tracked_by: [F8], statement: "The Lead surfaces decisions, deviations, problems and synthesized progress; routine agent events stay below the operator surface; repeated prompts for equivalent information or permission are a coordination defect"}
  LOI-21: {section: "16.1 Default topology", kind: invariant, tracked_by: [F7], statement: "The normal topology is shallow (stakeholder, Lead, then implementer, reviewer, researcher, verifier); recursive delegation is disabled by capability, not instruction: worker roles receive no dispatch or delegate capability by default, a skill, prompt, harness feature or model preference cannot create child workers, a worker needing help reports what it needs and why and the smallest useful scope, the Lead decides, and a skill instructing a worker to spawn subagents fails at the capability layer (AEW-INV-DELEG-001)", status: "done: workers have no dispatch capability since M3; the harness denies subagent features"}
  LOI-22: {section: "16.2 Exceptional nested delegation", kind: requirement, tracked_by: [F7], statement: "Nested delegation, if ever justified, is an explicit bounded AEW capability grant, not prompt text, constraining purpose, maximum children and depth, scope, budget, capability set and lifetime; without the grant the adapter exposes no usable child-dispatch path; no child inherits delegation authority and out-of-bounds requests return to the Lead (AEW-INV-DELEG-002)"}
  LOI-23: {section: "16.3 Duplicate-work prevention", kind: requirement, tracked_by: [F7], statement: "Before creating work AEW checks whether materially equivalent work is active, queued, completed and reusable or already evidenced; repeated equivalent objectives are not parallelism, and intentional replication is permitted only as an explicit ensemble or evaluation strategy with purpose, replica count and aggregation (AEW-INV-DELEG-003)"}
  LOI-24: {section: "16.4 Fanout and resource budgets", kind: requirement, tracked_by: [F7, F25], statement: "The envelope or deterministic policy bounds concurrent and total invocations, delegation depth, retries and rework loops, model, token and cost budget, workspace and disk budget and a human-interruption budget; the Lead judges inside hard ceilings; the interruption budget batches non-urgent questions and holds work that depends on a consequential decision, never licensing a silent convenient interpretation (AEW-INV-ATTN-001)"}
  LOI-25: {section: "16.5 Capability-request aggregation", kind: requirement, tracked_by: [F7, F13], statement: "Permission prompts must not scale with worker count: requests aggregate only on an exact match of capability, authorization scope and approved objective, one scoped decision propagates to covered workers with AEW recording which, a denial propagates likewise, mismatches fail closed and are never silently bundled, and a worker whose need differs from the approved scope cannot ride on another's approval (AEW-INV-PERM-001)"}
  LOI-26: {section: "16.6 Cancellation", kind: invariant, tracked_by: [F7], statement: "Cancelling an objective propagates through the work graph: queued work cancelled, active runs interrupted, derived credentials and capability grants revoked, one synthesized report; orphaned children never continue after parent authority is withdrawn, and no descendant can use a derived credential or grant after cancellation (an acceptance property; AEW-INV-CANCEL-001)"}
  LOI-27: {section: "17. Global resource composition", kind: invariant, tracked_by: [F7], statement: "Individually reasonable decisions about delegation, parallelism, retries, capabilities, isolation, workspaces and model selection must not compose into globally pathological behaviour (recursive identical review fanout; a full workspace per spawned agent); the Lead owns allocation and deterministic policy enforces hard ceilings (AEW-INV-RESOURCE-001)"}
  LOI-28: {section: "18. Standups and checkpoints", kind: requirement, tracked_by: [F8], statement: "A synthesized checkpoint communicates project significance (counts by state, what changed since the last checkpoint, the one decision needed) rather than replaying raw activity"}
  LOI-29: {section: "23. Open design questions", kind: open-question, tracked_by: [F8, F7, Q5], statement: "Open at v0.1: representation of stakeholder decision scope and inheritance; which plan changes invalidate approval; steer versus interrupt versus relaunch; when a waiting question becomes stale; which map facts are durable and full remap versus area refresh; checkpoint cadence; stakeholder provenance without an alternate mutation path; delegation depth and count defaults; which roles may ever receive bounded child dispatch; semantic duplicate-work checks without planning overhead; safe capability aggregation; how global model, workspace, disk and concurrency budgets compose"}
  # ---- LCO: live coordination and assumption propagation v0.1 (F9, frozen) ------------------------------------------
  LCO-01: {section: "2. Design objective", kind: requirement, tracked_by: [F9], statement: "The coordination layer lets active agents publish progress before completion, share confirmed findings with evidence references, expose hypotheses, ask targeted questions, report blockers, surface contradictions, broadcast breakthroughs, receive relevant knowledge, join Lead-facilitated syncs and keep coordination history across resume; it never lets agents alter plans by consensus, grant each other authority, make chat a source of truth, see each other's full context, overwrite evidence or hide disagreement, make transcripts necessary for resume, or let a breakthrough silently rewrite assignments"}
  LCO-02: {section: "3. Core principle: coordination is not authority", kind: invariant, tracked_by: [F9], statement: "Coordination may move knowledge; only existing AEW authority paths may move project state: a coordination record is working knowledge and provenance, a fact becomes evidence only through the evidence path and a plan changes only through the Lead's planning path (AEW-INV-AUTH-001)"}
  LCO-03: {section: "4.1 Layer A - Live coordination updates", kind: requirement, tracked_by: [F9], statement: "An active invocation may publish short, attributable, append-only structured updates (progress, finding, hypothesis, question, blocker, contradiction, breakthrough, handoff hint, working note) that reference evidence rather than copy it; a breakthrough is published immediately, not held for a standup"}
  LCO-04: {section: "4.2 Layer B - Routed coordination / inbox", kind: requirement, tracked_by: [F9], statement: "The Lead routes relevant updates to affected invocations; AEW may produce non-authoritative relevance hints from structural overlap (paths, symbols, snapshots, shared references, hierarchy and dependency edges) that only nudge the Lead and retain their structural reason, and the absence of a hint never proves independence; agents receive bounded relevant deltas, never the whole stream (AEW-INV-COORD-001, 002)"}
  LCO-05: {section: "4.3 Layer C - Coordination checkpoint (standup / sync)", kind: requirement, tracked_by: [F9], statement: "A sync is a scoped Lead-facilitated convergence event for a Ticket, Story, Epic or related set that aggregates progress, evidence, blockers, contradictions, questions, challenged assumptions and proposed impact; its output is not a democratic decision, the Lead closes it by recording normal AEW actions"}
  LCO-06: {section: "5. Why a standup is not enough by itself", kind: requirement, tracked_by: [F9], statement: "Live updates and routing plus scoped standups when convergence is needed; standups are the convergence mechanism, not the transport, so a decisive discovery is not held until a scheduled sync"}
  LCO-07: {section: "6. Coordination update record", kind: requirement, tracked_by: [F9], statement: "An `aew/coordination-update/v1` record with scope, engine-owned producer identity, invocation, plan and snapshot bindings, kind, summary, status, references, questions, blockers, contradicted assumptions and suggested impact; the agent suggests impact and the Lead determines it, confirmed means the producer considers the claim supported and never makes it authoritative, and large artifacts stay separate by hash or id"}
  LCO-08: {section: "7. Coordination inbox and context deltas", kind: requirement, tracked_by: [F9], statement: "Each active invocation may have a durable inbox of structured deltas, never raw peer contexts; relevance hints stay in the Lead's view until an update is routed; a delta is delivered only when relevant to the invocation's existing scope and widens no authority, paths, capabilities or objectives; every delivered delta is pinned into invocation history with id or hash, sender, time, routing reason and the affected assumption, answering what the agent learned after launch"}
  LCO-09: {section: "7.1 Knowledge update versus assignment change", kind: invariant, tracked_by: [F9], statement: "A knowledge update adds facts without changing objective, scope, plan, authority or expected output and may be delivered as a context delta; an assignment change alters the launch contract and must terminate or supersede the old invocation and create a new bounded one; an invocation is never silently rewritten into a materially different job (AEW-INV-COORD-003)"}
  LCO-10: {section: "8. Coordination checkpoint (standup / sync)", kind: requirement, tracked_by: [F9], statement: "A sync is scoped to a Ticket, Story, Epic or explicit set and triggered by Lead request, agents pursuing the same question, a blocker, contradictory findings, a likely Story or Epic-impacting breakthrough, a research finding affecting implementation assumptions, an upcoming replan, pre-closeout divergence, or later scheduler heuristics"}
  LCO-11: {section: "8.1 Sync flow", kind: requirement, tracked_by: [F9], statement: "The Lead opens the sync, the engine snapshots participants and sends bounded requests, participants submit structured responses, the engine groups evidence, blockers, contradictions and questions into a coordination pack, the Lead may ask follow-ups and closes with references to ordinary AEW actions (route, ingest, create, dependency edits, dispatch, replan, revise, move, re-verify, escalate); the sync record references those actions and never replaces them"}
  LCO-12: {section: "10.1 Step 1 - Publish the challenge", kind: requirement, tracked_by: [F9], statement: "The discovering invocation publishes a breakthrough or contradiction with evidence, the challenged assumption, the containing plan or decision when identifiable, suggested scope, confidence and open questions; the producer cannot invalidate the assumption authoritatively"}
  LCO-13: {section: "10.2 Step 2 - Lead impact triage", kind: requirement, tracked_by: [F9], statement: "The Lead classifies impact with named categories, not scores: INFORMATIONAL, RECONTEXTUALIZE, TICKET_REPLAN, STORY_REPLAN, EPIC_REPLAN, PROJECT_ESCALATION; the classification is a Lead decision referencing the evidence"}
  LCO-14: {section: "10.3 Step 3 - Establish an impact hold when required", kind: requirement, tracked_by: [F9], statement: "For Ticket, Story or Epic replan the Lead may establish a durable impact hold over the affected scope as an overlay, not a work state; held work receives no new execution dispatch, no forward completion transition, no integration prepare or publish and may not consume the challenged assumption as current; the Lead may let selected investigations continue only to assess impact or gather evidence"}
  LCO-15: {section: "10.4 Step 4 - Run an impact sync", kind: requirement, tracked_by: [F9], statement: "The impact sync asks targeted questions: which conclusions remain valid, which tasks are unnecessary, what becomes possible, which evidence stays useful, which invocations rest on the invalid assumption, whether acceptance criteria or only the approach change, and which contradictions still need evidence"}
  LCO-16: {section: "10.5 Step 5 - Resolve through existing AEW authority", kind: invariant, tracked_by: [F9, F22], statement: "Resolution uses ordinary actions per level (recontextualize or supersede at the Ticket; revise the Story plan and let ancestor-plan binding stale descendants, reconfirming unaffected ones explicitly; revise the Epic and restructure; follow operator escalation for contract-level impact, which coordination can never amend); impact-scope safety: known-affected work is held, known-unaffected continues, and uncertain overlap is never silently classified unaffected; narrow holds depend on overlap discovery, which coordination does not solve"}
  LCO-17: {section: "10.6 Step 6 - Release the hold", kind: requirement, tracked_by: [F9], statement: "A hold is released only after the Lead records the resolution path (plan revised and accepted, descendants reconfirmed or replanned, obsolete attempts superseded, new work created, escalation completed), and the resolution record lists what was invalidated, what survived and why"}
  LCO-18: {section: "11. Why impact holds should be overlays, not new lifecycle states", kind: decision, tracked_by: [F9], statement: "A hold is an additional guard on units that keep their truthful states (RUNNING, REVIEW_PENDING, READY all held by one hold) rather than a new COORDINATION_BLOCKED state that would destroy semantic information"}
  LCO-19: {section: "12. Preserving disagreement", kind: invariant, tracked_by: [F9], statement: "Contradictions are never summarized into consensus: both positions are stored with evidence and marked unresolved, the Lead follows up, dispatches an investigator or verifier or plans conservatively while recording the uncertainty, and a sync summary retains the disagreement until evidence or a Lead decision resolves it (AEW-INV-COORD-004)"}
  LCO-20: {section: "13. Mid-task documentation and working knowledge", kind: requirement, tracked_by: [F9], statement: "Agents may publish short updates, working notes, partial maps, provisional references and open questions mid-task, under a trust hierarchy (coordination update as working knowledge, durable evidence as engineering evidence, Lead decision or accepted plan as authority); promotion of a note into a knowledge or evidence artifact is explicit and preserves provenance"}
  LCO-21: {section: "14. Token and context economics", kind: requirement, tracked_by: [F9], statement: "Coordination recovers value from parallel work instead of multiplying tokens: never share raw reasoning or transcripts; updates are structured summaries plus references; the Lead receives deduplicated deltas; agents receive only relevant updates; a sync pack holds the latest meaningful delta per participant; routine progress may compact into a checkpoint summary with provenance kept; contradictions, blockers, breakthroughs and decisions are never compacted away"}
  LCO-22: {section: "15.1 Coordination update", kind: requirement, tracked_by: [F9], statement: "Coordination updates are append-only producer records with immutable identity and bindings, stored as AEW control artifacts (not project authority) under a coordination directory"}
  LCO-23: {section: "15.2 Sync record", kind: requirement, tracked_by: [F9], statement: "A sync record holds scope, trigger, participant invocations, update and evidence references, questions asked, contradictions, blockers, the Lead's closeout summary and references to the resulting decisions and actions"}
  LCO-24: {section: "15.3 Impact-hold record", kind: requirement, tracked_by: [F9], statement: "An impact-hold record holds the triggering update and evidence, the Lead's classification, the affected units or subtree, allowed continuation exceptions, resolution requirements, and the release decision with its references"}
  LCO-25: {section: "16. Proposed commands / engine operations", kind: requirement, tracked_by: [F9], statement: "Illustrative operations: publish and inbox for invocations; route, sync open and close, impact assess, hold and release for the Lead; agents never receive Lead-only coordination-control operations"}
  LCO-26: {section: "17. Capability and role interaction", kind: requirement, tracked_by: [F9, F13], statement: "Ordinary capabilities coordination.publish, read_relevant and respond; Lead-only route, sync_open, sync_close, impact_assess, impact_hold and impact_release; role cards may specialize how a role coordinates but cannot widen authority"}
  LCO-27: {section: "Ticket sync", kind: requirement, tracked_by: [F9], statement: "A Ticket sync is used when several bounded roles contribute to one difficult Ticket or when review or research support is attached to it"}
  LCO-28: {section: "Story sync", kind: requirement, tracked_by: [F9], statement: "A Story sync is the primary unit for several parallel Tickets pursuing one objective, the most common standup scope"}
  LCO-29: {section: "Epic sync", kind: requirement, tracked_by: [F9], statement: "An Epic sync is used when a discovery or strategy question affects several Stories; rarer and more expensive"}
  LCO-30: {section: "Cross-scope routing", kind: requirement, tracked_by: [F9], statement: "A Ticket finding whose suggested impact exceeds the Ticket is routed upward, and the Lead decides whether it becomes Story or Epic coordination"}
  LCO-31: {section: "21. Resume and reconstruction", kind: requirement, tracked_by: [F9], statement: "Resume surfaces coordination only when it changes what the Lead needs next (unresolved contradictions, cleared blockers, breakthroughs with holds, replanning required) and never floods with routine chatter"}
  LCO-32: {section: "22. Coordination invariants", kind: invariant, tracked_by: [F9], statement: "Sixteen executable invariants: an update never changes plan, hierarchy, authority or state by itself; every update binds to its producer invocation and context; a routed update cannot widen scope; material assignment changes supersede, never travel as deltas; consensus satisfies no gate; contradictions stay attributable until resolved; a hold blocks forward actions without destroying state; a held unit cannot integrate without a valid resolution; replans use ancestor-plan invalidation; distribution never makes an update evidence; session loss loses no open blocker, contradiction, sync or hold; coordination artifacts are not authority; raw reasoning is never persisted; routing and compaction never erase breakthrough, blocker, contradiction or decision provenance; a relevance hint is advisory only; absence of a hint never proves work unaffected (AEW-INV-COORD-001 to 005)"}
  LCO-33: {section: "Unit / state tests", kind: evaluation, tracked_by: [F9], statement: "Unit tests: update attribution and hash binding, routing cannot widen scope, delta versus assignment-change decision, impact classification and hold guards, sync close mutating nothing except through referenced operations"}
  LCO-34: {section: "Composition tests", kind: evaluation, tracked_by: [F9], statement: "Composition tests: a breakthrough reaches siblings as relevant deltas only; an old invocation continuing after a replan is superseded; a held Ticket's integration is refused; a held Story blocks only the declared affected scope; contradictions survive summarization; session destruction during a sync resumes deterministically; a takeover preserves holds and obligations; a stale update satisfies no gate; a release without the required replan is refused; a scope-changing delta cannot avoid re-dispatch; an unrouted structurally overlapping update yields a hint without state change; uncertain overlap without a declared dependency is never silently unaffected"}
  LCO-35: {section: "Adversarial walk additions", kind: evaluation, tracked_by: [F9, F11], statement: "The scheduler-era adversarial walk mixes publish, route, block and unblock, sync open, respond and close, assumption invalidation, replans at every level, handoff and takeover, cancel, move and promote, and crash recovery with open coordination state"}
  LCO-36: {section: "24. Implementation staging", kind: sequencing, tracked_by: [F9], statement: "v0.1 is frozen as Designed after independent and companion review and is not pulled into M3 because the live harness exists; reopen only when the M2 hierarchy, staleness and resume semantics hold under the M3 dogfood, real live invocations exist, a multi-agent research or mapping dogfood exposes actual coordination behaviour, a material change lands in resume, freshness, dependency, plan-binding or supersession semantics, or implementation shows a concrete contradiction; reopening is driven by observed behaviour or a demonstrated contract conflict, not speculative refinement"}
  LCO-37: {section: "M3 - live harness", kind: sequencing, tracked_by: [F9], statement: "The recommended first post-M3 slice: durable coordination updates, bounded inbox and context deltas, manual Lead routing, manual Story and Ticket sync, resume rendering"}
  LCO-38: {section: "M3.x / M4 - assumption invalidation and impact holds", kind: sequencing, tracked_by: [F9], statement: "Then explicit impact assessment, holds, Story and Epic sync, assignment supersession integration and adversarial coordination tests, before aggressive autonomous parallel execution"}
  LCO-39: {section: "M5 - scheduler integration", kind: sequencing, tracked_by: [F9, F11], statement: "The scheduler may suggest or open checkpoints on deterministic triggers (unresolved blocker, contradiction, several agents under one Story, a wide-impact breakthrough, prolonged duplicate investigation, a satisfied dependency) without gaining authority; the Lead remains the decision maker"}
  LCO-40: {section: "25. Relationship to AEW's existing contracts", kind: decision, tracked_by: [F9], statement: "Coordination extends existing principles (bounded invocations, durable evidence, role authority ceilings, Lead-owned decisions, hierarchy and ancestor-plan staleness, resumable state, deterministic packs, explicit dependency edges, review and verification separation) so that bounded invocations behave like a team without ceasing to be bounded invocations"}
  LCO-41: {section: "Load-bearing dependency: scope and overlap quality", kind: invariant, tracked_by: [F9, F22], statement: "Coordination propagates impact safely only as far as AEW can identify plausibly affected work; hierarchy and declared dependencies are authoritative inputs but may miss undeclared file, symbol, runtime or external overlap, so until overlap discovery is strong the fallback is conservative (known-unaffected continues, known-affected is held, uncertain overlap is surfaced); the design defines no second dependency graph"}
  # ---- STI: the ADR-0011 storage investigation (F1, closed: ADR-0011 implemented) -----------------------------------
  STI-01: {section: "1. Recommendation", kind: decision, tracked_by: [F1], statement: "Hot state keeps control.yaml minus terminal detail plus a constant-size cold root, audit status, recent completions, per-parent counters and bounded edge facts; cold records are one immutable bundle per terminal unit written through redo staging at the terminal transition; later facts are append-only annotations; the authoritative cold index is a bounded manifest tail plus sealed hash-chained segments pinned by the hot root; the lookup index is a derived rebuildable SQLite; verification is incremental or full, outside the lock, recorded by a transition and an audit record; archival is O(1) in history; the hashes make history tamper-evident, not authenticated", status: "done: ADR-0011 implemented (P1 to P3, 2026-10-03) with the plan's refinements R1 to R8"}
  STI-02: {section: "2. What grows with history today", kind: requirement, tracked_by: [F1], statement: "Of the 37 whole-state readers, active-only readers become cheap, facts active state needs about archived units become bounded hot facts (per-parent counter; edge facts, replaced by the plan's archived_refs map), listings become a bounded summary with recent items and an explicit full-history path, lookups by id go through the index, and whole-history checks move to the audit; the transition log is not sharded unless measured cost violates the envelope; revoked Lead tokens archive per generation; role cards could be stored once by digest", status: "done: ADR-0011 as implemented; log sharding measured and not needed"}
  STI-03: {section: "3.1 Bundles and annotations", kind: requirement, tracked_by: [F1], statement: "A bundle per terminal Ticket, Story or Epic (its control record, ended invocations, revoked credential entries) at `work/<id>/archive.yaml`, immutable with its digest in the manifest; later facts are small immutable annotation records with manifest entries and staleness derived, never written back; entries carry trust labels; invocations of open units stay hot", status: "done: ADR-0011 P2b"}
  STI-04: {section: "3.2 The authoritative manifest", kind: requirement, tracked_by: [F1], statement: "A mutable tail of at most 256 entries and sealed segments each hashing its predecessor, pinned from the hot root; entries carry id, kind, state, time, path, digest, parent, source and links for traversal; appends rewrite the tail through redo staging and seal every 256 entries, O(1) in history; a single all-entries index file is rejected; a Merkle mountain range is the upgrade if membership proofs are ever needed without the derived index", status: "done: ADR-0011 P2a, with R1 (an entry-level hash chain as the root) replacing the tail-file hash"}
  STI-05: {section: "3.3 The derived lookup index", kind: requirement, tracked_by: [F1], statement: "`local/history.sqlite` with entries, links, annotations and optional full text, storing the root it was built against, catching up when the root extends it and rebuilding otherwise; its loss costs a rebuild, never knowledge; it serves show by id, list by kind and date, follow links, and load one labelled record into reference context", status: "done: ADR-0011 P2c"}
  STI-06: {section: "3.4 Parent summaries", kind: requirement, tracked_by: [F1], statement: "With terminal descendants archived, parent derivation sees only open descendants plus an archived_children counter updated at archival and rebuildable from the manifest; closed parents are archived; closeout and parent review read their children's bundles proportionally to the request", status: "done: P2b, with R3 (a pinned additive digest accumulator and a versioned children_digest)"}
  STI-07: {section: "3.5 The audit lifecycle", kind: requirement, tracked_by: [F1], statement: "Incremental verification from the current root back to the last verified one and full verification of everything reachable, both outside the control lock against a pinned root, recorded by a short transition and an immutable audit record; local or CI results are advisory until ingested; status reports current and verified roots and unverified additions against policy thresholds; an incremental audit is required at Epic closeout and before a backup or export, with CI running incremental routinely and full periodically", status: "done: ADR-0011 P2c, with R2 (no one-entry backlog) and the Lead recording audits"}
  STI-08: {section: "4. Alternatives compared", kind: decision, tracked_by: [F1], statement: "Files plus a bounded manifest plus a derived SQLite (P) beats SQLite as authority (B, which needs an ADR-0001 amendment and commits a binary blob into the project's git history on every commit), hot YAML plus cold SQLite authority (C, two commit points), and git objects (E, dropped by the operator and kept as a rejected alternative)"}
  STI-09: {section: "5. Crash and atomicity", kind: requirement, tracked_by: [F1], statement: "Everything an archival writes goes through the existing redo record (bundle, tail, segment, root), with roll-forward of replaceable before-hashed files; new fault points after the bundle, after the tail, mid-seal and between verification and its recording; an unreferenced staged bundle after a crash is a benign unreachable object the audit reports; the redo record per archival is bounded", status: "done: the crash matrix and real-process kills at each history fault point"}
  STI-10: {section: "6. Migration", kind: requirement, tracked_by: [F1], statement: "One Lead transaction on a quiescent project with no live runs; about 60 MB of bundles staged at 3,000 units; mixed hot and archived terminal state stays readable; tested on an M3-built project with crashes at each new fault point followed by resume, status, audit and the oracle", status: "done: ADR-0011 P2d, with R8 (pre-written deterministic bundles keep the redo record bounded)"}
  STI-11: {section: "7. Scale beyond the fixture", kind: open-question, tracked_by: [E22, F1], statement: "Long-lived Epics make parent closeout and review packs a context-size problem (bounded child summaries), not a storage one; 30,000 cold records are about 120 segments with only the full audit and a full rebuild growing; a 1,000-unit active frontier is about 1 MB of hot state and 0.2 to 0.3 s per command and per supervisor re-parse, close to the heartbeat budget, the first place a deferred residency tier for not-yet-active work could become necessary"}
  STI-12: {section: "8. The spike", kind: evaluation, tracked_by: [F1], statement: "A standalone spike on Windows and Rocky 8: cold-write series at 1,000 to 30,000 records, SQLite appends for comparison, exact lookup, rebuild and catch-up, verification times, git and filesystem cost with and without sharding the transition log, a hierarchy series with the counter, and migration of 3,000 units; pass condition flat archival and parent derivation, seconds for lookups and audits at 30,000, no git regression beyond the envelope, migration in minutes", status: "done: run 2026-10-01 (§8.1); the Rocky runs and migration timing came with the implementation"}
  STI-13: {section: "8.1 Results (Windows reference machine, 2026-10-01; idle apart from an editor)", kind: evaluation, tracked_by: [F1], statement: "Archival is flat from 1,000 to 30,000 records (about 15 ms median); SQLite is about 12 ms faster per append, which does not change the verdict; the index rebuilds in well under a second; the full audit is linear at about 3 ms per record, which is why it is explicit and incremental; at 3,000 units the first `git add` is 16 s and `git status` 0.06 s, and the 60,000-file transition log costs 0.33 s unsharded so sharding is not needed; today's parent recomputation is quadratic in completed descendants (628 ms at 3,000) and constant with the counter; the snapshot fingerprint's `git add -A` over an uncommitted `.aew/` is a related cost to exclude", status: "done: the basis for ADR-0011's acceptance thresholds"}
  STI-14: {section: "9. Operator decisions (2026-10-01)", kind: decision, tracked_by: [F1], statement: "A bounded summary with recent items and a full-history path in `CURRENT.md` and status; durable audit results through a transition and an audit record; automatic archival at the terminal transition; no sharding of the transition log unless measured; the git object store dropped as a candidate; the recording authority, the annotation shape and the history command names left to the implementation plan", status: "done: the plan settled the three open items (the Lead records audits; `aew history show|list|links|load|audit|reindex`)"}
  STI-15: {section: "10. Implementation review (2026-10-02)", kind: decision, tracked_by: [F1], statement: "The operator confirmed the investigation as good enough to implement with eight refinements that govern where the two differ: an entry-level hash chain as the root (R1), audits recorded without a one-entry backlog (R2), parent summaries with a pinned additive digest accumulator (R3), an archived_refs map instead of copied edge facts (R4), a per-parent integration frontier (R5), archival in a transaction finalizer (R6), current facts about terminal units kept hot with cold fallback (R7), and pre-written deterministic migration bundles (R8)", status: "done: ADR-0011 implementation plan §2, built P1 to P3"}
  # ---- EWL: external agent workflow lessons (evidence note) -----------------------------------------------------------
  EWL-01: {section: "3.5 Agent count is not engineering quality", kind: requirement, tracked_by: [F7, F8], statement: "Deep review is never read as maximize recursive fanout; the pattern is bounded distinct first-pass reviews, then synthesis, then evidence-triggered targeted deeper investigation"}
  EWL-02: {section: "4. AEW evaluation case derived from Incident A", kind: evaluation, tracked_by: [F7, F19], statement: "The deep-comprehensive-review prompt is a standing orchestration regression run after every orchestration or delegation change, with a second variant in which a loaded skill instructs a capability-less worker to spawn reviewers and the attempt must fail at the capability layer; expected Lead behaviour is bounded distinct review scopes, no duplicate fanout, synthesis before a targeted second wave, aggregated equivalent capability requests and configured limits; failure conditions are recursive equivalent reviewers, unauthorized topology growth, multiplying duplicate scopes, repeated equivalent prompts, descendants surviving cancellation and geometric resource growth"}
  EWL-03: {section: "10. Why this note should remain separate from AEW defect history", kind: process, tracked_by: [F7], statement: "The incidents occurred under GPT-5.4 with GSD, not AEW; they are evidence for AEW's design and never cited as AEW defects, so AEW's implementation history stays uncorrupted while the rationale for its restrictions is preserved"}
  # ---- APR: phase 6 airgap capabilities, MCP selection and harness features (research; F12, F13, Q11, Q12) ----------
  APR-01: {section: "1. Recommendation", kind: requirement, tracked_by: [F12, F13], statement: "Ship a broad reproducible capability bundle, expose a small relevant interface to each role, and promote providers by correct task completion per cost; the biggest opportunities are evidence acquisition and faster feedback (semantic navigation, local documentation, runtime and debugger observation, browser inspection, canonical project-state queries); keep the M3 configuration as a comparison arm; replace the impossible promise that no task will need an absent tool with: every declared workload has a tested capability path, specialist dependencies are transferred, unsupported capabilities are visible, and every real gap becomes a fixture and a bundle amendment"}
  APR-02: {section: "2. What was already selected", kind: decision, tracked_by: [F12], statement: "Updated dispositions of the September selections: keep the cheap baseline tools; package and teach ast-grep; Serena over language servers is the highest-priority semantic MCP evaluation against native OpenCode LSP; keep GitNexus as a relationship candidate and repair its packaging; Playwright CLI plus skills first for frontend; make compilers, tests, linters, sanitizers and debuggers usable against real targets; promote local versioned documentation to a release capability; keep the memory service without competing stores of AEW state; keep container and native compatibility targets; keep the working Ghidra bridge and evaluate a headless alternative without assuming migration"}
  APR-03: {section: "3. Prioritized MCP and service candidates", kind: requirement, tracked_by: [F12, Q11], statement: "A release capability is an outcome that must be reliable before release, satisfiable by any provider that passes its gate; a benchmark means carry a qualified candidate and compare it with the baseline; the gates per capability (precise symbols, repository relationships, offline documentation, browser interaction and performance, binary analysis, stateful debugging, canonical project metadata, SQL inspection, large-output retrieval, tool discovery) each name the fixture result that makes the capability useful"}
  APR-04: {section: "Semantic source navigation", kind: requirement, tracked_by: [F12, F22], statement: "Use Serena's language-server path first for portability with only the operations a role needs; for C the real leverage is an accurate compilation database with matching headers, flags and generated files, since a language server parsing the wrong build returns confident wrong answers; compare Codex with a Serena retrieval subset against OpenCode's explicitly enabled native LSP on the pinned release, importing no assumptions from earlier releases"}
  APR-05: {section: "GitNexus", kind: requirement, tracked_by: [F12, Q11], statement: "Start with GitNexus's query, context, impact, trace and change-detection operations and keep raw graph queries, writes and overlapping file tools out of the default role interface; its installer's generated instructions, skills and hooks are integration side effects to review before they touch AEW-owned configuration; confirm consequential edges in source or runtime evidence; track worktree identity, dirty fingerprint, provider version, indexing configuration and readiness; graph availability is for cross-module questions, not two-line changes, and a graph engine does not automatically need MCP exposure"}
  APR-06: {section: "Local documentation: the most important airgap omission to close", kind: requirement, tracked_by: [F12], statement: "Local versioned documentation is the most important air-gap omission: a local indexing provider (Grounded Docs or a lean lexical provider) qualified offline, never Context7 without an independently verified internal service; documentation packs built from lockfiles and installed tools (native, Python, frontend, RE, workbench, project) with origin, revision, acquisition date, hash and redistribution metadata and the original pages kept beside normalized content; lexical ranking first, embeddings only if held-out queries show gain, with any local model's full runtime transferred"}
  APR-07: {section: "Browser and frontend diagnostics", kind: requirement, tracked_by: [F12], statement: "Playwright CLI plus skills for routine frontend work with existing tests for repeatable verification, bounded snapshots or targeted DOM, console and network data with full traces as artifacts, preserved local accounts and startup commands, browser state isolated per Ticket or worktree; Chrome DevTools for agents compared on a real performance defect with usage statistics, CrUX and update checks disabled offline"}
  APR-08: {section: "Ghidra and reverse engineering", kind: requirement, tracked_by: [F12], statement: "Preserve the working GhidraMCP GUI workflow; carry PyGhidra MCP (beta; its own Ghidra process; separate analysis and index readiness; Chroma and embedding dependencies to package) for comparison if the bridge stays hard to automate; never migrate a working provider for a newer README; measure context cost and useful findings on the same binaries; binary hash, architecture, load address, analysis settings and database revision travel with every result, and decompiled pseudo-C is derived evidence"}
  APR-09: {section: "Debugger interface: a useful new experiment", kind: requirement, tracked_by: [F12], statement: "DAP-MCP (launch, breakpoints, stepping, compound snapshots) is a candidate, not a proven best, with tdb as another; keep GDB batch, core inspection and debugpy regardless; prefer a small structured stop-reason, frames, variables and artifact interface; package modern DAP adapters separately from Rocky 8's GDB and test C and Python; expression evaluation executes code and inherits the target's scope with inspection and mutation as different grants; stateful sessions need lifecycle ownership, cancellation, ports and cleanup"}
  APR-10: {section: "Database and project-state access", kind: requirement, tracked_by: [F12], statement: "Named queries over canonical project state (entity lookup, provenance traversal, relationship and ingestion inspection) returning ids and provenance beat repeated schema reconstruction and never create another authoritative store; DBHub is optional, chosen at a reviewed release that includes the read-only enforcement fix, with database-level restricted credentials and functional denial checks since a tool annotation is not evidence of read-only enforcement"}
  APR-11: {section: "4. Linux utilities and specialist reserve", kind: requirement, tracked_by: [F12], statement: "A proposed procurement inventory, not installed versions: core inspection, archives and transfer, structural maps, native build, C quality, runtime diagnosis, performance, Python, frontend, binary inspection, RE libraries, SQL and data, documents, security checks, a fuzzing reserve and an advanced RE reserve; native binaries where reliable and container shims otherwise; MCP only for semantic or stateful interaction; the advanced reserve is not an always-running dependency and untested entries are labelled unavailable for mandatory gates; offline scanners ship their rules and databases with recorded freshness"}
  APR-12: {section: "5. Harness-native features to exploit", kind: invariant, tracked_by: [F13], statement: "Native harness features are execution primitives under AEW and acquire no authority to approve plans, integrate work or mark completion; the adapter vocabulary is USE_NATIVE, USE_NATIVE_BOUNDED, AEW_MANAGED, DISABLED and UNSUPPORTED"}
  APR-13: {section: "OpenCode", kind: requirement, tracked_by: [F13, E35], statement: "For OpenCode: built-in tools as the baseline without duplicate generic MCP wrappers; LSP and the experimental navigation tool where benchmarked useful; on-demand skills; agent models and per-agent permissions to realize role grants (native labels enforce no OS isolation); MCP enablement and filtering verified at the request level; one owner per plugin interception point; compaction controls benchmarked with contracts preserved as AEW artifacts; the compaction hook version-gated; server, SDK and events for programmatic control; structured output that is schema-valid but not thereby correct; session export and usage for reproducibility and cost; MCP servers add context overhead and dynamic discovery is never inferred from MCP support"}
  APR-14: {section: "Codex", kind: requirement, tracked_by: [F24, F13], statement: "For Codex: the app-server with a pinned protocol and supported start, resume and interrupt surfaces, fresh context for independent review; `codex exec` for simple bounded jobs; MCP allow and deny lists, required servers, timeouts and output budgets with a full artifact path; short server instructions; lifecycle hooks exercised for trust and coverage; the Linux sandbox validated on the real host and runtime, never a permissive container fallback silently in production, and never a blanket sandbox around remote MCP; skills and instruction entry points with AEW authority explicit; native review and bounded subagents with AEW keeping dispatch and completion; the effective gateway model configuration recorded; prefer an attachable service interface over another launcher"}
  APR-15: {section: "GPT-5.4/API features: verify separately from harness features", kind: requirement, tracked_by: [F13, Q11], statement: "The API's native tool search and deferred definitions are an opportunity for progressive disclosure but do not prove the pinned harness and gateway expose them end to end; per adapter, record support for tool search, image input, reasoning options, structured output, interruption, compaction, usage fields and caching from one real sanitized request each; keep local MCP execution local; detect the pinned binary's actual configuration schema instead of pasting historical flags"}
  APR-16: {section: "6. Performance per token: where to spend engineering effort", kind: decision, tracked_by: [F13, F25], statement: "Priority order, an engineering hypothesis: correct source, runtime and documentation evidence on demand; small role-specific capability and skill catalogs; deterministic structured output reduction with recoverable artifacts; stable reusable prompt and tool definitions with measured caching; build, index and service reuse keyed to the actual candidate; optional output and context tools, then stylistic compression; short answers are not automatically cheaper successful work"}
  APR-17: {section: "Compact interface, broad installed capability", kind: requirement, tracked_by: [F13], statement: "Reuse AEW's discovery layers: show capability names, problems solved, limitations and where to get details at startup, resolve provider and schema detail only when relevant, preserve AVAILABLE, AUTHORIZED and ACTIVE as distinct; FastMCP search transforms are a fallback where a harness cannot defer schemas, with role authorization enforced in the execution path because hiding a tool does not restrict access; separate profiles per domain that still support cross-domain tasks; missing required capabilities are resolved before dispatch"}
  APR-18: {section: "Output evidence contract", kind: requirement, tracked_by: [F13, E28], statement: "Expensive or noisy actions return a small structured record (operation, provider and version, target identity, timestamps, exit and readiness state, test counts, relevant failures with locations, total count and truncation state, artifact reference and expansion path) with full output stored outside context, paginated semantic and SQL results, batched independent queries that preserve per-item failure; a missing match means not found within this scope and index, a wrapper's exit is not proof tests ran, and protected acceptance and original intent survive output reduction"}
  APR-19: {section: "RTK, context-mode, and Caveman", kind: evaluation, tracked_by: [F13, F19], statement: "RTK and context-mode are worth a controlled comparison where verbose logs are an observed cost, with one output owner, tests for exit status, warnings, skipped tests, conflicting diagnostics, long traces and recovery of omitted output, and never stacked lossy reducers; context-mode's environment is not an OS sandbox; Caveman-style prose compression stays below these in priority because requirements, negation, errors and evidence must keep their meaning"}
  APR-20: {section: "Caching and runtime reuse", kind: requirement, tracked_by: [F13, F25], statement: "Keep stable instruction and tool blocks stable and append changing data, inspect actual cached-input usage, expect gateway transformations, tool activation, effort changes and compaction to affect reuse, apply no later-model-only caching options or public pricing; reuse language servers, documentation indexes and graph services where they measurably cut startup, and reuse build and test caches only with correct source, compiler and configuration keys since a result from another dirty candidate is not evidence"}
  APR-21: {section: "7. Offline bundle and qualification", kind: requirement, tracked_by: [F12, F18.3], statement: "One versioned setup repository with separate runtime modules (core runtime, native C, Python, frontend, code intelligence, docs, binary and security, specialist reserve); each release records source versions, image digests or payload hashes, architecture, dependencies, launch commands, state paths, supported capabilities, network needs, limitations, doctor fixtures and licensing, with exact pins from qualification only; tool userspace kept separate from the target's deployment ABI with container and native targets tested separately; transitive runtime assets included deliberately rather than as a warm cache; OpenCode's downloads, metadata fetching, autoupdate and sharing configured deliberately and plugin dependencies preinstalled"}
  APR-22: {section: "Cold-start acceptance", kind: gate, tracked_by: [F12, F18.3], statement: "On a clean representative Rocky target with public egress denied: load images and payloads without registries; resolve every required capability with a fixture result; build and test C, Python and frontend samples; resolve cross-file symbols and detect a stale index; query versioned docs without external requests; launch a browser locally and capture evidence; stage, hash and analyze an approved binary and recover its identity after restart; run and reclaim a debugger session; run protected verification with candidate and oracle separated; verify host ownership, mounts and container replacement; reconnect harness sessions and restore AEW state; record effective gateway options and usage. Health distinguishes alive, connected, loaded, analyzed and semantically correct; a required-provider failure blocks only the tasks that need it; running offline and rebuilding offline are two distinct promises"}
  APR-23: {section: "8. Measure the combinations before calling them optimal", kind: evaluation, tracked_by: [F19, Q11], statement: "Preserve the M3 baseline, gateway settings, skill versions and independent evaluator; change one substantial variable per comparison and compare bundles only after candidates earn value; task families with independent outcomes (C defects with sanitizers and debuggers, cross-file C changes with LSP or Serena, Python state defects, cross-layer changes with GitNexus, version-specific tasks with local docs, frontend behaviour and UI performance, binary triage, noisy failures with reducers, a false stakeholder diagnosis, long-ticket interruption, a cold offline target); record correctness, missed and false findings, unnecessary edits, retries, intervention, time, tokens, indexing and startup cost; acceptable correctness first, then cost per accepted completion with failures and retries included; report missing gateway accounting as missing"}
  APR-24: {section: "9. Suggested AEW implementation grouping", kind: sequencing, tracked_by: [F12, F13], statement: "Proposed Stories for the Work Graph after reconciling existing Tickets: capability inventory and doctor; semantic and source intelligence; offline knowledge; runtime evidence; frontend evidence; RE evidence; harness integration; context and cost evaluation; release qualification; qualification starts before phase 6 so tool availability helps M4 and M5 and packaging problems surface early"}
  # ---- CPR: containment and process ownership on Rocky 8 (research; F2 and E13 built in M4-B) ------------------------
  CPR-01: {section: "1. Summary", kind: requirement, tracked_by: [F2, E13], statement: "One mechanism closes both gaps: a run wrapped in unprivileged bubblewrap gets a mount namespace (the protected checkout read-only at the OS boundary) and a PID namespace with die-with-parent (every process the run starts dies with it); bind mounts cost nothing at any repository size; git worktrees are the hard part; Rocky 8 lacks Landlock, unprivileged cgroups and probably native rootless overlayfs, none of which is needed; Windows stays workdir separation only", status: "done: M4-B (2026-10-03)"}
  CPR-02: {section: "3.1 What bubblewrap provides on Rocky 8", kind: requirement, tracked_by: [F2], statement: "Unprivileged bubblewrap on RHEL 8 relies on user namespaces (no setuid), provides mount, PID, IPC, UTS, network, user and cgroup namespaces plus seccomp, die-with-parent ties the sandbox to its parent, and unshare-pid makes the first process PID 1 so the kernel kills every process left in the namespace, closing E13 by construction", status: "done: M4-B"}
  CPR-03: {section: "3.2 Layout of one run (a sketch to evaluate, not a design)", kind: requirement, tracked_by: [F2], statement: "One run's sandbox: the host read-only, private dev, proc and tmp, writable binds for the Ticket workspace, the run's scratch and the run's private harness state, home secrets hidden by tmpfs, the bridge socket directory bound read-only, the network shared, the same paths inside and out so records and the agent's view agree, and the operator's uid mapped to itself", status: "done: M4-B's layout (`harness/containment/layout.py`)"}
  CPR-04: {section: "3.3 The git worktree problem", kind: requirement, tracked_by: [F2], statement: "A linked worktree writes into the main repository's object store, its per-worktree directory and shared refs; making all of `.git` writable is rejected (an agent could move the authoritative ref); the recommended layout is a private object directory per run with the shared store as an alternate and the main `.git` read-only except the worktree's own directory, tested against every git command the roles run and the engine's prepare; reviewers and verifiers on a mutating Ticket get the implementer's workspace read-only plus their own scratch", status: "done: M4-B, run-private git state with the designer's correction (agents run no git write commands; reviewers and verifiers read-only)"}
  CPR-05: {section: "3.4 Against the containment regression gate (isolation §12)", kind: evaluation, tracked_by: [F2], statement: "Each isolation §12 probe is expected to fail at the OS level under the layout (EROFS or EXDEV), and every row must be run on Rocky 8.10 before any claim; the table is the expectation, not evidence", status: "done: the containment regression gate passes in CI and on Rocky 8 (M4-B)"}
  CPR-06: {section: "4. What else is on Rocky 8, and why it isn't the first choice", kind: decision, tracked_by: [F2, F3], statement: "Landlock is absent before RHEL 9.6; native rootless overlayfs is unconfirmed and fuse-overlayfs's cost on a million-file tree must be measured, only if copy-on-write is pursued; rootless podman is for the toolchain bundle, not containment; cgroup v1 makes unprivileged delegation unreliable; a child subreaper is a weaker labelled fallback where user namespaces are disabled; seccomp is defence in depth"}
  CPR-07: {section: "5. Failing closed and labels", kind: requirement, tracked_by: [F2], statement: "Probe at launch: a missing bubblewrap, disabled user namespaces or a failed self-test refuse to launch under a policy that requires containment and launch labelled workdir separation only under one that allows it; filesystem containment and process ownership are separate labels (`filesystem: os_readonly_roots | workdir_separation_only`, `process_ownership: pid_namespace | job_object | process_group`); the launch self-test writes one known outside path and requires failure, with the full §12 suite in CI and on the Rocky distro", status: "done: M4-B's fail-closed launch and truthful labels (ADR-0009)"}
  CPR-08: {section: "6. Probes to run on the Q7 Rocky 8.10 distro", kind: evaluation, tracked_by: [F2, E13], statement: "Eight probes: packages and the namespace limit; PID-namespace teardown with setsid and double forks under SIGTERM and SIGKILL; the failing live stop test under bubblewrap; OpenCode serve inside the layout with the bridge and `aew check run`; the private-object-store git layout against every role command and the engine's prepare; the §12 list from inside; rootless overlay presence and fuse-overlayfs cost only if copy-on-write is pursued; wrapper startup cost", status: "done: run on WSL 2026-10-01 (§9) and on the real Rocky 8 kernel in M4-B"}
  CPR-09: {section: "9. Probe results (2026-10-01, WSL)", kind: evaluation, tracked_by: [F2, E13], statement: "On Rocky 8.10 userspace under WSL's kernel: bubblewrap 0.4.0 unprivileged with the namespace limit at 62,153; PID-namespace teardown passes for setsid children, orphans and double forks under SIGTERM, SIGKILL and a killed parent; the E13 live test passes under bubblewrap once recorded PIDs are translated through NSpid; the whole live OpenCode lane passes inside the sandbox with the bridge reachable from a read-only bind; the private-object-store git layout works with one engine change (the run's store as an alternate when the engine inspects the workspace, and a decision on its lifetime); every §12 write is refused; the launch self-test discriminates; about 2.5 ms per sandbox", status: "done: confirmed on a real Rocky 8 kernel in M4-B; the NSpid translation and private store are built"}
  # ---- IQR: integration queues for M4 (research; F10, D4) -----------------------------------------------------------
  IQR-01: {section: "1. Summary", kind: requirement, tracked_by: [F10], statement: "ADR-0004 is already the core of a not-rocket-science queue, so M4's question is how much validation to redo and when; three designs exist (serial, speculative stacking, batching); AEW's cost profile differs from CI's because post-integration verification is a model invocation; the recommendation to evaluate is a serial integration tail over parallel implementation, measuring queue wait before adding speculation, with deterministic integration checks as the cheapest accelerator"}
  IQR-02: {section: "3. What is different about AEW", kind: requirement, tracked_by: [F10, D4], statement: "Against CI merge queues AEW differs in validation cost (a verifier invocation), determinism (verdicts can disagree), evidence binding (a rebuilt candidate needs new evidence), unit of record (a Ticket with its own completion record), semantic conflicts (caught at the integration-stage check on the merged state) and dependencies (a downstream Ticket needs the upstream's commit as an ancestor); speculation's waste is model spend, batching weakens provenance and would need a contract reading, and serial always verifies on the true head"}
  IQR-03: {section: "Option A (recommended to evaluate first): a serial integration tail, parallel everything else", kind: requirement, tracked_by: [F10], statement: "Implementation, review and verification run concurrently per workspace; prepare, post-integration verification and publish are one at a time on the current head; a Ticket joins the queue at COMMIT_READY; a stale candidate comes only from a third-party ref move; order is Lead-chosen with FIFO by COMMIT_READY time and dependency edges first; to build: a queue record, head-of-queue prepare (replaced by the designer's no-head-of-line-blocking rule), the queue in status and resume, wait-any (E1), and lifting the mutating cap; no wasted verification, throughput bounded by verification time per Ticket", status: "done: adopted as the designer's disposition (DCQ-03) and planned as M4-D; the cap lift was built in M4-C"}
  IQR-04: {section: "Option B: speculative stacking of depth k", kind: decision, tracked_by: [F10], statement: "Speculative stacking builds candidate i on the chain ahead of it and publishes by chained compare-and-swap; it needs base chains in candidate bindings, retirement cascades and a dispatch policy for speculative candidates, and pays only when queue wait dominates and failures are rare; deferred until measured"}
  IQR-05: {section: "Option C: batching", kind: decision, tracked_by: [F10], statement: "Batching validates several Tickets as one candidate and needs a contract decision on shared post-integration evidence and failure attribution by bisection; not for M4 (the designer: out of scope, not forbidden)"}
  IQR-06: {section: "Accelerator, independent of the option: deterministic integration checks (D4)", kind: requirement, tracked_by: [D4, F10], statement: "Policy may let integration-scope verification run the project's deterministic checks only, with no model, for low-risk classes under the contract's rule that policy determines what is rerun; it makes revalidation cheap and is the precondition for speculation ever paying; M4's measurements decide it (the designer put D4 in M4 as a policy-selectable path with verifier policy as the default)", status: "done: M4-D5 (2026-10-05) built the mechanism (`aew integrate validate`, checks mode by local class); whether to switch the default is an evaluation (F19)"}
  IQR-07: {section: "5. What M4 should measure (with the instrumented command log)", kind: evaluation, tracked_by: [F10, F19], statement: "Measure queue wait from COMMIT_READY to integration start at concurrency 1, 2 and 4; integration tail time by phase; rebuild rate and its causes; post-integration verdicts that differ from Ticket-scope verdicts (the semantic-conflict signal); and Lead cost per integrated Ticket, which queue choreography must not grow"}
  # ---- PAV: plan assurance and premise validation v0.4 (adopted direction; F14) ------------------------------------
  PAV-01: {section: "2. Design goals", kind: requirement, tracked_by: [F14], statement: "Fifteen goals: preserve the original objective without rewriting diagnoses into requirements; independently establish observable success; separate facts from hypotheses and assumptions; collect evidence only deep enough to discriminate decisions; detect success by altered measuring conditions; establish a meaningful baseline where practical; challenge the intervention against evidence and independent acceptance; one authoritative Lead; minimal stakeholder interruption; exact provenance and freshness; fail closed on stale or contradicted assurance; simple does not mean safe; no duplicated parent assurance at every child; bounded disagreement without critic loops or fan-out; strong reasoning where an error multiplies"}
  PAV-02: {section: "4. Core architecture", kind: requirement, tracked_by: [F14], statement: "The lifecycle: original intent feeds both an acceptance-first interpretation (with baseline and negative controls) and reconnaissance (with a candidate plan and assumptions); the Plan Challenge disposes findings into investigate, revise or stakeholder decision; the assured package lets the Lead accept the plan; then dispatch, implement, review, controlled verification and closeout. Independently establish what success means, gather discriminating evidence, then challenge the plan before granting mutation authority"}
  PAV-03: {section: "Lead", kind: requirement, tracked_by: [F14], statement: "The Lead owns the active objective, the accepted interpretation after stakeholder decisions, the accepted plan revision, finding disposition, escalation, workflow state, dispatch and the final completion decision, and gains no authority to fabricate evidence, redefine intent or waive hard assurance controls"}
  PAV-04: {section: "Investigator", kind: requirement, tracked_by: [F14], statement: "The Investigator owns bounded evidence about the current system (inspect source and runtime, evaluate map freshness, test hypotheses, run permitted probes, produce evidence) and never chooses stakeholder intent"}
  PAV-05: {section: "Planner", kind: requirement, tracked_by: [F14], statement: "The Planner proposes an intervention and never makes its own plan authoritative"}
  PAV-06: {section: "Acceptance Reviewer / Verifier mode", kind: requirement, tracked_by: [F14], statement: "The acceptance role independently reconstructs success and preservation conditions before seeing the proposed intervention and produces an acceptance artifact without becoming a second requirement authority"}
  PAV-07: {section: "Plan Challenger", kind: requirement, tracked_by: [F14], statement: "The Plan Challenger evaluates the plan against original intent, independent acceptance, contracts, current evidence, baselines, protected conditions and unresolved uncertainty, and cannot accept the plan or mutate product state"}
  PAV-08: {section: "Implementer", kind: requirement, tracked_by: [F14], statement: "The Implementer mutates only the authorized subject and cannot silently redefine the objective, acceptance, protected evaluator conditions, stakeholder decisions, plan scope or completion state"}
  PAV-09: {section: "Reviewer", kind: requirement, tracked_by: [F14], statement: "The implementation Reviewer checks the candidate against the original objective, governing contracts, the accepted plan, the permitted mutation envelope and the acceptance and preservation obligations"}
  PAV-10: {section: "Verifier", kind: requirement, tracked_by: [F14], statement: "The Verifier independently evaluates the resulting candidate and cannot redefine success to make it pass"}
  PAV-11: {section: "6. Preserve raw intent and classify derived statements", kind: requirement, tracked_by: [F14], statement: "AEW preserves the original stakeholder request or a stable reference to it; derived classifications never replace the wording; the Lead's structured interpretation types statements as requirement, preference, constraint, observation, diagnosis or hypothesis, inference, working assumption, evidence-backed fact or accepted decision, each with its treatment; the requirement-versus-diagnosis distinction is load-bearing, and a diagnosis is never permission to change its subject unless the stakeholder made it the subject or evidence shows the change necessary and compatible"}
  PAV-12: {section: "7. Independent acceptance construction", kind: requirement, tracked_by: [F14], statement: "A fresh-context role performs an acceptance-first pass before seeing the proposed solution; only after its artifact exists does the same or another fresh invocation receive the plan; the two-pass protocol reduces anchoring without a permanent role, and the artifact is advisory until dispositioned by the Lead (AEW-INV-ASSURE-001)"}
  PAV-13: {section: "First-pass inputs", kind: requirement, tracked_by: [F14, F30], statement: "The acceptance role receives the original request, current stakeholder decisions, governing contracts and ADRs, relevant current source and runtime evidence, known compatibility, security and persistence obligations, parent Story and Epic invariants and factual observations, and not initially the proposed plan, the Lead's preferred root cause or acceptance wording, or the Planner's rationale"}
  PAV-14: {section: "First-pass output", kind: requirement, tracked_by: [F14, F30], statement: "The first pass records the intended observable change, preservation obligations, externally visible constraints, the apparent subject of change, the apparent acceptance inputs and measuring conditions, what remains ambiguous and whether each ambiguity is engineering-derivable or the stakeholder's, candidate acceptance checks and candidate negative controls"}
  PAV-15: {section: "8. Decision-sensitive premise investigation", kind: requirement, tracked_by: [F14, F30], statement: "No complete causal theory is required; evidence is needed for premises whose truth would change the chosen intervention, each recorded with claim, status, supporting evidence, plausible alternatives, falsifier, smallest useful probe and impact if wrong; prefer a cheap discriminating probe that tests the disputed proposition over debate"}
  PAV-16: {section: "Subject", kind: requirement, tracked_by: [F14], statement: "The subject is what the requirement intends to change (source, configuration, schema, canonical data, generated output, a dependency version)"}
  PAV-17: {section: "Acceptance inputs", kind: requirement, tracked_by: [F14], statement: "Acceptance inputs are the controlled inputs and preconditions used to observe the subject (fixtures, payloads, captures, corpora, seeds, workloads)"}
  PAV-18: {section: "Oracle", kind: requirement, tracked_by: [F14], statement: "The oracle is the rule that determines the required result (expected output, contract, invariant, property, threshold, compatibility condition)"}
  PAV-19: {section: "Evaluator", kind: requirement, tracked_by: [F14], statement: "The evaluator is the mechanism that applies the oracle and records the outcome (test runner, assertions, harness, benchmark driver, integration checker)"}
  PAV-20: {section: "Environment", kind: requirement, tracked_by: [F14], statement: "The environment is the conditions under which subject and evaluator run (flags, clock, network, services, database, dependencies, OS, sandbox, hardware)"}
  PAV-21: {section: "Evidence", kind: requirement, tracked_by: [F14], statement: "Evidence is the attributable observations the evaluator produces (status, executed checks, log excerpts, measurements, digests, state queries); the subject is expected to change, acceptance conditions change only when the governing requirement changes them, and existing tests and fixtures are evidence of prior expectations, not authority over a new requirement (AEW-INV-ASSURE-002)"}
  PAV-22: {section: "10. Protected acceptance conditions", kind: requirement, tracked_by: [F14], statement: "A plan may not satisfy its goal by changing the conditions that define success; protected resources include fixtures, expected outputs, assertions, test selection, benchmark inputs, acceptance data, corpora, time sources, environment settings, external state, oracle definitions and evaluation scripts; path protection (protected paths intersecting a Ticket's scope refuse dispatch) is useful but incomplete, so final assurance resolves protected resources to identities and digests where feasible; controlled final verification keeps evaluator and oracle artifacts outside Implementer write authority, reconstructs the candidate from permitted changes, populates the acceptance package separately, runs in a controlled environment, records evaluator, candidate, input and environment identities and check counts, and rejects unexpected protected-condition changes as invalid evaluation; prefer external observation or process isolation for same-process evaluators", status: "done: partly; the repository-local half (protected-condition records and checks) in M4-A, the rest is F14's evaluation"}
  PAV-23: {section: "11. Pre-implementation acceptance baseline", kind: requirement, tracked_by: [F14], statement: "Establish the current observable state for each meaningful goal where practical; red-before-green is one form, not the abstraction: before implementation, establish what state exists now and what state the plan claims will change"}
  PAV-24: {section: "Baseline classes", kind: requirement, tracked_by: [F14], statement: "Baseline classes by goal kind: a bug or regression expects the behaviour to fail; a new capability expects absence; performance expects the metric outside target; a refactor or preservation expects the preserved behaviour to pass; a removal expects presence; security hardening expects the exposed condition to be demonstrable where safe"}
  PAV-25: {section: "Typed baseline outcomes", kind: requirement, tracked_by: [F14], statement: "Baseline outcomes are typed (EXPECTED_FAILURE, EXPECTED_PRESERVATION_PASS, EXPECTED_ABSENCE, EXPECTED_PRESENCE, MEASURED_BASELINE, UNEXPECTED_PASS, INVALID_MEASUREMENT, ENVIRONMENT_BLOCKED, NOT_APPLICABLE_WITH_REASON); a failing command is not a reproduced defect (import errors, uncollected tests, wrong interpreter, missing dependency, unrelated setup failure, timeouts are invalid red); the baseline artifact names the proposition exercised, the checks executed, why the result is relevant, the snapshot, the input and evaluator identities and limitations (AEW-INV-ASSURE-003)"}
  PAV-26: {section: "12. Acceptance discrimination and counterexamples", kind: requirement, tracked_by: [F14], statement: "Before accepting a premise-sensitive plan ask what plausible wrong implementation could pass the proposed checks (changed fixture, weakened output, disabled discovery, skipped case, hardcoded sample, altered environment, success without the work, one caller fixed and another broken) and where practical execute one important negative control, counterexample, metamorphic check or held-out case that traces to a real obligation; the aim is that acceptance distinguishes the intended solution from a plausible wrong one"}
  PAV-27: {section: "13. Plan construction requirements", kind: requirement, tracked_by: [F14], statement: "A mutating plan carries or references the objective and original request, stakeholder decisions, parent obligations, the mutable subject and scope, protected conditions, the acceptance contract, baseline evidence, decision-sensitive assumptions with their evidence or probes, dependencies, affected components, known uncertainty, validation strategy, required checks, preservation obligations, map and source freshness and the review and verification boundary, answering what is changed, why, which assumptions invalidate it, what may not change, how the intended change is known and how preservation is known"}
  PAV-28: {section: "14. Plan Challenge", kind: requirement, tracked_by: [F14], statement: "After independent acceptance construction, probes and baselines, the Plan Challenger receives the plan and attempts to falsify its assumptions and acceptance integrity, a genuine pass being allowed; a blocking finding names the affected objective or obligation, the claim or plan element, the evidence or missing-evidence condition, the impact if wrong and the resolution criterion"}
  PAV-29: {section: "Objective fidelity", kind: requirement, tracked_by: [F14], statement: "Challenge: does the plan solve the stakeholder objective; has a diagnosis become an objective or an observation a universal requirement; is a requested preservation obligation missing"}
  PAV-30: {section: "Premise validity", kind: requirement, tracked_by: [F14], statement: "Challenge: which assumptions are load-bearing, are they supported by current evidence, did probes discriminate among alternatives, is stale derived knowledge used as current fact"}
  PAV-31: {section: "Acceptance integrity", kind: requirement, tracked_by: [F14], statement: "Challenge: can success be achieved by changing the measurement; is the subject separated from acceptance inputs, oracle and evaluator; are protected conditions enforceable"}
  PAV-32: {section: "Scope validity", kind: requirement, tracked_by: [F14, F30], statement: "Challenge: is the mutable scope broader than evidence justifies, is required scope missing, does the scope include acceptance resources without requirement authority"}
  PAV-33: {section: "Architecture / contract validity", kind: requirement, tracked_by: [F14], statement: "Challenge: does the plan violate governing contracts or ADRs, introduce security, persistence or reliability consequences outside the envelope, or make child work violate inherited parent obligations"}
  PAV-34: {section: "Validation quality", kind: requirement, tracked_by: [F14], statement: "Challenge: are required checks named, is the baseline meaningful, does acceptance distinguish the real fix from a plausible wrong one, are preservation checks present"}
  PAV-35: {section: "Stakeholder ownership", kind: requirement, tracked_by: [F14], statement: "Challenge: does the plan depend on a consequential choice engineering evidence cannot resolve; if so stop and ask the stakeholder a targeted question"}
  PAV-36: {section: "15. Assurance outcomes", kind: requirement, tracked_by: [F14], statement: "A Plan Challenge produces an immutable report with one of PASS, PASS_WITH_NOTES, REVISE, INVESTIGATE_MORE, STAKEHOLDER_DECISION_REQUIRED or INCONCLUSIVE; a non-pass is never rewritten into a pass, new evidence, revisions, decisions or adjudication are separate attributable artifacts, and the computed gate decides whether current blocking findings are cleared (AEW-INV-ASSURE-006)"}
  PAV-37: {section: "16. Assurance package and freshness", kind: requirement, tracked_by: [F14], statement: "Assurance binds to the dependency set that made the plan meaningful, not the plan text: an unchanged plan goes stale when the objective, a contract, a fixture, the base revision, protected conditions, probe evidence, acceptance, a parent obligation or policy changes; the package records digests of the plan payload, objective, acceptance contract, snapshot, relevant inputs, protected conditions, parent obligations and policy revision with references to the outline, baselines, challenges and dispositions and a gate result (AEW-INV-ASSURE-004)"}
  PAV-38: {section: "Canonical hashing rule", kind: invariant, tracked_by: [F14], statement: "The plan's canonical hashed payload excludes resulting review and approval metadata, which lives separately, so a review cannot change the digest it references (AEW-INV-ASSURE-005)"}
  PAV-39: {section: "Dependency-sensitive invalidation", kind: requirement, tracked_by: [F14], statement: "Not every repository change invalidates every plan: a known relevant dependency change invalidates affected evidence, uncertain relevance triggers conservative broader revalidation, a known unrelated change retains assurance with recorded applicability; probably unrelated is not a silent exemption"}
  PAV-40: {section: "17. `ASSURED` as a derived gate predicate", kind: requirement, tracked_by: [F14], statement: "ASSURED is computed from durable artifacts, not a lifecycle state: at plan acceptance and immediately before mutating dispatch the engine checks current objective and decisions, referenced parent obligations, matching dependency versions, the acceptance outline, baseline evidence or an approved not-applicable reason, hard protected-condition checks, required challenge evidence, a valid disposition for every blocking finding, operations within the envelope, current Lead authority and the expected revision and generation; every dispatch path (CLI, MCP, harness, recovery, resume) uses the same predicate (AEW-INV-ASSURE-007)"}
  PAV-41: {section: "17.1 Evaluation-period form: `DispatchDecision` (decided 2026-10-01)", kind: decision, tracked_by: [F14], statement: "During evaluation the shared predicate is DispatchDecision (allowed, effective obligations, blocking conditions, reason codes, dependency digests): permissive except for existing gates, hard protected-condition failures and requested Class 0; a conformance test proves every dispatch route calls it; a cached candidate-runnable is never a cached ALLOW; the full assurance package later becomes one more input without rewiring dispatch", status: "done: M4-A (2026-10-03)"}
  PAV-42: {section: "18. Deterministic plan lint", kind: requirement, tracked_by: [F14], statement: "Deterministic checks catch structural defects before model reasoning: protected resource in the mutable scope without requirement authority, a writable acceptance fixture, an oracle or evaluator inside the implementer grant, a goal with no observable acceptance, a bug without a baseline, an invalid baseline treated as reproduction, missing contract references, an adopted diagnosis without evidence, acceptance changed without an attributable requirement change, stale map or evidence, a plan-review digest mismatch, an omitted parent obligation, no verification strategy for a consequential change, a late review of a superseded package; enforcement expands as semantic failures become mechanical", status: "done: the first `aew plan lint` in M4-A; the list grows with F14"}
  PAV-43: {section: "19. Bounded disagreement and recovery", kind: requirement, tracked_by: [F14, F4], statement: "The challenger is not an unbounded critic: one initial challenge, at most two evidence or revision cycles, one independent adjudication for unresolved disagreement, then INCONCLUSIVE or BLOCKED, with the numbers as policy knobs; a blocker clears only by a revised plan with re-challenge, disproving evidence, a stakeholder decision when stakeholder-owned, or bounded adjudication; the Lead never silently downgrades a hard blocker and hard controls cannot be waived by majority; a legitimate requirement change is a new Ticket revision under F4, not a third lineage"}
  PAV-44: {section: "20. Runtime discovery after assurance", kind: requirement, tracked_by: [F14], statement: "When execution contradicts a load-bearing assured premise the worker records the contradiction, the affected mutation path holds, the Lead evaluates impact, investigates or revises, and affected assurance reruns; a worker never continues under a known-false premise and unrelated work need not stop (AEW-INV-ASSURE-008)"}
  PAV-45: {section: "Parent level", kind: requirement, tracked_by: [F14], statement: "A Story or Epic may establish external behaviour, architecture constraints, security invariants, identity and provenance rules, cross-component contracts, integration acceptance and shared decision-sensitive assumptions"}
  PAV-46: {section: "Child level", kind: requirement, tracked_by: [F14], statement: "A Ticket assures its local delta while referencing current parent obligations; a simple child cannot downgrade inherited security or compatibility assurance because its change is mechanical; child evidence may reuse valid parent evidence by reference; parent closeout and integration still verify composed behaviour, passing children do not prove the composition, and late results, restarts, cancellation and supersession never reactivate stale packages (AEW-INV-ASSURE-009, 010)"}
  PAV-47: {section: "Classes 1–4 during evaluation", kind: evaluation, tracked_by: [F14, F19], statement: "During evaluation the §7.5 paths remain the baseline obligations for Classes 1 to 4 and hard triggers add premise-sensitive obligations regardless of class; the former Tier C, D and E packages (routine, cross-component, high-consequence floors) are kept as hypotheses to evaluate against false success, false blocking, rework and cost, not assumed"}
  PAV-48: {section: "Hard assurance triggers", kind: requirement, tracked_by: [F14], statement: "A hard trigger adds the premise-sensitive obligations (acceptance-first pass, discriminating probes, typed baseline, protected evaluator, one strong fresh-context challenge, a counterexample where practical) regardless of class and fails Class 0 eligibility: a stakeholder diagnosis adopted by or constraining the intervention or acceptance, an unproven adopted diagnosis, proposed acceptance or fixture mutation, an acceptance input inside the mutation scope (deterministic intersection or a flagged related resource), stale evidence or map, multiple plausible root causes, an unexpected baseline result, an ambiguous success condition, security, trust, persistence or reliability semantics, external behaviour or compatibility change, cross-component coupling, hard-to-observe outcomes, irreversible operations, a prior plan verification failure, an inherited elevated obligation; no additive score lets low-risk attributes cancel a critical trigger"}
  PAV-49: {section: "Lead / Planner", kind: requirement, tracked_by: [F14], statement: "A strong approved model for requirement interpretation, selecting decision-sensitive evidence, material design choices, resolving findings and replanning"}
  PAV-50: {section: "Acceptance construction / Plan Challenge", kind: requirement, tracked_by: [F14], statement: "Strong reasoning with source and probe access and required context independence; different model families may be tested but vendor difference is not guaranteed independence"}
  PAV-51: {section: "Investigator (routing)", kind: requirement, tracked_by: [F14], statement: "Strong reasoning when causal discrimination is difficult, deterministic tools for retrieval and measurement"}
  PAV-52: {section: "Implementer (routing)", kind: requirement, tracked_by: [F14], statement: "A capable model for substantive engineering; cheaper routing evaluated only for bounded transformations after evidence shows quality is preserved"}
  PAV-53: {section: "Reviewer / Verifier", kind: requirement, tracked_by: [F14], statement: "Strong interpretation for difficult correctness and acceptance questions, with deterministic tools doing mechanical checks without expensive narration"}
  PAV-54: {section: "Specialist / adjudicator", kind: requirement, tracked_by: [F14], statement: "The strongest relevant approved capability for consequential unresolved disagreement; the stronger-Lead M3 result is local evidence, not proof that placement caused the difference, so dogfood varies one role or model dimension at a time"}
  PAV-55: {section: "24. Stakeholder interaction", kind: requirement, tracked_by: [F14, F8], statement: "No mandatory approve-every-plan ceremony: the stakeholder is involved for genuine ambiguity, technically valid choices with different product behaviour, policy preferences, material envelope or scope changes, or choices no evidence can resolve, and never asked where code lives, what it does, which test covers it or whether a suspected cause is true when evidence can answer; management by exception is the principle"}
  PAV-56: {section: "25. Assurance artifacts", kind: requirement, tracked_by: [F14], statement: "Artifact families (intent record, typed claims, acceptance outline, premise register, probe and baseline evidence, protected conditions, plan draft and review, finding clearance, accepted plan pointer, verification package), immutable or versioned, each with provenance (producer invocation, role, model and profile, revision, input references, policy revision, timestamp, digest); evidence stays historical when no longer admissible, and historically valid is distinct from currently admissible"}
  PAV-57: {section: "27. Invariants", kind: invariant, tracked_by: [F14], statement: "The design's invariants: one plan-acceptance authority; independent assurance creates no parallel authority; the original request stays attributable; diagnoses are hypotheses unless authoritative or evidenced; acceptance is reconstructed before the solution is revealed; an author is not its plan's sole validator; simple scope does not mean low premise risk; evidence proportional to consequence; subject, inputs, oracle, evaluator, environment and evidence are distinct; acceptance cannot be mutated to manufacture success; a baseline counts only if it exercised the proposition; assurance binds the dependency set; review metadata cannot alter the reviewed payload; blocking findings are immutable with separate clearance; hard controls cannot be waived by the constrained actor; one shared predicate on every path; a contradicted premise pauses mutation; children inherit obligations; passing children prove no composition; stakeholder attention is for stakeholder choices; assurance replaces no downstream gate. The ten new cross-document ones are AEW-INV-ASSURE-001 to 010"}
  PAV-58: {section: "28. Adversarial evaluation suite", kind: evaluation, tracked_by: [F14, F19], statement: "The next dogfood must not saturate the baseline and compares at least six arms (a plain agent, Lead-only AEW, deterministic lint only, a v0.2-style fresh critic with baseline, v0.4 acceptance-first assurance with probes and protected evaluator, mandatory human plan approval) with the same downstream evaluator, separating workflow improvement from model strength; results bind to the design version tested"}
  PAV-59: {section: "Required task families", kind: evaluation, tracked_by: [F14, F19], statement: "Twenty required task families, each with its expected behaviour: T4 replay, diagnosis contrast pair, legitimate data correction, oracle weakening, test-selection bypass, environmental gaming, vacuous red, unexpected green, preservation work, hardcoded sample, stale project map, implicit compatibility, conflicting intent, cross-Ticket composition, mid-run premise contradiction, false critic blocker, stale linked dependency, restart or late result, inherited elevated risk, benign mechanical control"}
  PAV-60: {section: "29. Evaluation metrics", kind: evaluation, tracked_by: [F14, F19], statement: "Primary metrics: correct final outcome, false success rate, incorrect plans reaching dispatch, valid plans wrongly blocked, stakeholder interventions and attention time, time to decisive evidence, wall clock, rework; diagnostic metrics on defects caught, false positives, decisive probes, invalid baselines detected, stale evidence rejected, protected-condition violations blocked, loop counts, late-result rejection, parent obligation preservation and model-role sensitivity; severity is tracked and critical failures are never averaged away; paired families, repeated runs, frozen challenge sets and uncertainty estimates before thresholds freeze"}
  PAV-61: {section: "Phase 1 — Preserve the M3 failure", kind: sequencing, tracked_by: [F14, F19], statement: "Phase 1: a replayable T4 fixture (original request, base snapshot, initial interpretation, plan, mutable scope, patch, review and verification reports, model settings, expected correct outcome) plus a legitimate-data-change contrast case, the regression the design must distinguish"}
  PAV-62: {section: "Phase 2 — Close deterministic integrity gaps", kind: sequencing, tracked_by: [F14], statement: "Phase 2: subject versus acceptance-resource roles, typed baseline outcomes, protected-condition overlap checks, canonical hashing without metadata cycles, dependency-sensitive invalidation, one shared gate at accept and dispatch, final evaluator protection, stale, late and restart tests; all working even when the model is confidently wrong", status: "done: partly; the dispatch predicate, protected conditions and plan lint in M4-A, the rest remains F14"}
  PAV-63: {section: "Phase 3 — Pilot independent acceptance-first challenge", kind: sequencing, tracked_by: [F14, F19], statement: "Phase 3: pilot the two-pass protocol (acceptance outline from intent, contracts and evidence; then the challenge with plan, assumptions, baselines and probes) on existing Reviewer and Verifier infrastructure, with bounded probes under read-only investigation authority, a strong approved model, planner proposals reviewed through existing non-mutating policy, and no enforcement claimed until the state engine enforces it"}
  PAV-64: {section: "Phase 4 — Evaluate and tune", kind: sequencing, tracked_by: [F14, F19], statement: "Phase 4: compare current AEW, a v0.2-style challenge and v0.4 acceptance-first assurance on false success and false blocking, ablating the first pass, lint, probes, negative controls, runtime evaluator enforcement and strong-model placement; only then freeze the Class 0 eligibility thresholds (the predicate exists from the start), routing thresholds, second-challenger conditions, probe and adjudication budgets"}
  PAV-65: {section: "Phase 5 — Workflow Contract amendment", kind: sequencing, tracked_by: [F14], statement: "Phase 5, once dogfood supports the mechanism: ratify the assurance predicates, update accepted-plan semantics, add canonical artifacts and failure classes, pin conformance tests, update packs, and require harness adapters to respect the dispatch gate"}
  PAV-66: {section: "31. Immediate conformance tests", kind: evaluation, tracked_by: [F14], statement: "Conformance tests: dispatch without required assurance rejected; a plan change makes the prior review inadmissible; an acceptance-contract change invalidates assurance; review metadata leaves the canonical digest unchanged; an import-error baseline is not EXPECTED_FAILURE; a protected fixture in scope is rejected; a legitimate requirement change goes through a Ticket revision; an unsupported diagnosis stays a hypothesis; the acceptance pass precedes plan exposure; a late review is historical only; a child dropping a parent obligation is rejected; a contradicted premise holds the mutation; a false blocker clears by bounded adjudication; every CLI, MCP and harness path enforces the same predicate", status: "done: partly; the dispatch-route conformance test and protected-condition checks in M4-A, the assurance-package cases remain F14"}
  PAV-67: {section: "32. Open questions for dogfood", kind: open-question, tracked_by: [F14, F19], statement: "Fifteen questions for dogfood: whether independent acceptance construction catches defects a fresh critic misses; which families benefit from probes versus a stronger model; the finding standard that minimizes false blocking; which acceptance resources AEW can reliably protect across surfaces; the relevance boundary for invalidation; which Class 0 criteria stay safe under misleading descriptions; whether a second model adds distinct detection; when candidate-plan search beats one investigation; which ambiguities always need the stakeholder; the acceptable false-success rate by consequence; how acceptance outlines inherit across the hierarchy; noisy performance baselines; when parent evidence stays reusable; which findings become deterministic checks; one staged invocation or two for the challenger and acceptance roles"}
  # ---- CWR: the Crawl / Walk / Run steering design v0.1 (approved 2026-10-05; F15.5), amended by A1 and A3 ---------------
  CWR-01: {section: "1. Purpose", kind: requirement, tracked_by: [F15.5], statement: "One operator autonomy control without multiple state machines: Crawl, Walk and Run change only whether the engine pauses for operator confirmation before executing an action ActionProjection already marks availability == AVAILABLE and auto_runnable == true; they never decide legality or classify judgment"}
  CWR-02: {section: "2. Hard invariant", kind: invariant, tracked_by: [F15.5], statement: "Steering mode is never read by dispatch guards, transition guards, gates, plan assurance, risk-class logic, lint, evidence acceptance, verification classification or publication legality; all three modes have an identical stop set and differ only in their confirmation set; BLOCKED, UNKNOWN, judgment-bearing and non-auto-runnable actions are never made runnable by steering"}
  CWR-03: {section: "3. Semantics", kind: requirement, tracked_by: [F15.5], statement: "eligible(a) = AVAILABLE and auto_runnable; confirm_before(a) is always true in crawl, always false in run, and in walk true for agent, repository, process or ref effects, read from the existing PrimitiveSpec.side_effect_class with no new effect taxonomy. Amended by A1 §2 (SAE-06): Walk's deny-list (workspace, harness_process, credential, authoritative_ref) becomes the allow-list {control_state}, so a missing, unknown or new effect class requires confirmation"}
  CWR-04: {section: "4. Judgment boundary", kind: invariant, tracked_by: [F15.5, F10], statement: "Any explicit judgment-bearing input or override makes the effective action non-auto-runnable in every mode; verification classification and publication stay judgment-bearing unless an already-approved conditional authorization (PUBLISH_IF_CLEAN) independently made the projected action auto-runnable, and Run never grants such an authorization (A1 §5, SAE-14: only the operator capability grants it)"}
  CWR-05: {section: "5. Scope", kind: decision, tracked_by: [F15.5], statement: "The mode is a project default in execution policy, optionally overridden for the current Lead session or generation by a recorded decision, never per Ticket; risk class decides which obligations exist, steering who confirms the legal non-judgment steps between them. Amended by A1 §1.2 (SAE-04): a Lead-initiated override may only lower the mode; raising it is operator-only"}
  CWR-06: {section: "6. Policy and command surface", kind: requirement, tracked_by: [F15.5, F15.4], statement: "steering.mode: crawl | walk | run in execution policy; aew lead mode records the change with the Lead generation and revision, effective at the next projection recomputation; a repository without steering.mode keeps the legacy manual runner behaviour until migrated (a compatibility state, not a fourth mode); personal dogfood sets walk while M4-H measures. Amended: the setting is in the operational digest, not the legality digest (A3, PBD-03, PBD-07), and a raise needs the operator capability with a recorded decision (A1, SAE-02, SAE-05)"}
  CWR-07: {section: "7. Auto-run loop", kind: requirement, tracked_by: [F15.5, F15.2], statement: "One runner loop: read the projection; stop on a decision, blocker, unknown, disqualifying anomaly, stale policy or authority, or no eligible action; select the next eligible action by the stage contract; apply confirm_before, surfacing an attention item and waiting when true; otherwise execute it as the normal staged primitive with expect_rev and the stage-intent journal; recompute after the committed step; every auto-executed action is attributable to the projection reference, mode and policy digest, the Lead generation and the stage intent and revision, and the loop never bypasses primitive execution. Amended by A1 §3 (SAE-08 to SAE-11): the envelope, repetition and deadline checks before each action"}
  CWR-08: {section: "8. Mode change during work", kind: requirement, tracked_by: [F15.5], statement: "A committed or running step is unaffected; crawl to run may make a pending confirmation unnecessary and the next tick executes it, attributed to the recorded change; run to crawl stops future unconfirmed execution at the next tick; harness work is not interrupted because the mode became more restrictive; stopping a run stays a separate Lead judgment"}
  CWR-09: {section: "9. Operator confirmation", kind: requirement, tracked_by: [F15.5], statement: "Confirmation uses the existing operator channel (aew confirm <action-ref>) and authorizes only the referenced currently-projected action at the expected revision and policy binding, a stale projection following the normal stale rules; browser write-side confirmation is out of scope. Amended by A1 §1.1 (SAE-02, SAE-03): the capability is structurally absent from agent shells and model tools"}
  CWR-10: {section: "10. Interaction with existing mechanisms", kind: invariant, tracked_by: [F15.5], statement: "Class 3 under Run keeps every review and verification gate and judgment; Class 0 under Crawl keeps its gate set with confirmations added; explicit Lead overrides stay judgment-bearing in every mode; plan-assurance failures stay blockers; UNKNOWN is never runnable; high-severity anomalies stop the loop through the existing obligation path; conditional authorizations stay independent and steering only consumes the resulting projection"}
  CWR-11: {section: "11. Conformance tests", kind: evaluation, tracked_by: [F15.5], statement: "Identical stop sets across the three modes on one projection sequence; zero execution of non-auto_runnable or UNKNOWN actions; protected-condition overlap and a high-severity anomaly stop every mode for the same reason; a mode change never changes a guard, gate or transition result; a static boundary test shows legality and gate modules do not import steering mode; every auto-run step stays in the normal stage and history records; any false advance is a release blocker. Amended by A3 (PBD-10): mid-step drift is STALE_POLICY only for the legality digest; a steering-mode change never invalidates an in-flight primitive"}
  CWR-12: {section: "12. Evaluation and default policy", kind: evaluation, tracked_by: [F15.5, F19], statement: "The mechanism is approved and the global product default is not frozen: M4-H/F19 measures operator confirmations, blocked time, Lead actions, false advances, judgment capture, anomaly catch, task outcome and human time; Walk is the approved personal-dogfood default; Crawl is not the universal default"}
  # ---- BRP: the bounded recovery policy design v0.1 (approved, limited slice, 2026-10-05; F15.6, F15.7), amended by A2 and A3 ----
  BRP-01: {section: "1. Purpose", kind: requirement, tracked_by: [F15.6], statement: "Narrowly mechanical recovery only where AEW can prove no judgment is replayed, preserving every failed attempt and adverse signal; the three existing failure layers (run outcome, engine reason code, Lead verification classification) stay, and this adds recovery rules, not a cause taxonomy"}
  BRP-02: {section: "2. Universal recovery invariants", kind: invariant, tracked_by: [F15.6], statement: "Automatic recovery only when the action is MECHANICAL or already POLICY_RESOLVED, no unresolved judgment input is required, the bound is unconsumed, policy and authority bindings are valid, prior run and attempt records stay visible, no blocked report, finding, anomaly or adverse evidence can be erased, and a second failure after the bound returns control to the Lead; a timeout alone never releases a lease or re-grants authority"}
  BRP-03: {section: "3. Adopted rule R5-1 — one `STALE_REVISION` retry", kind: requirement, tracked_by: [F15.6, F15.2], statement: "On STALE_REVISION the runner may recompute legality and retry exactly once iff the step's and the stage's effective class are non-judgment-bearing, the policy digest is unchanged, authority is valid and the recomputed projection still marks the action legal and available; the retry is the same semantic step at the new revision, recorded as completed_steps[].retried_after_stale_revision = true; a second STALE_REVISION, STALE_POLICY, STALE_AUTHORITY, new blocker or anomaly, or a judgment requirement stops recovery; it implements the typed surface's accepted stale-revision rule. Amended by A3 (PBD-04): the digest compared is the legality digest"}
  BRP-04: {section: "4. Adopted rule R5-3 — one pre-work launch relaunch", kind: requirement, tracked_by: [F15.6], statement: "A launch_failed run may be relaunched once when policy permits: the invocation still active, no model work, evidence or report produced, workspace and base binding and dispatch decision digest unchanged, the invocation contract still valid, not CONTAINMENT_UNAVAILABLE, the per-invocation bound unconsumed; the relaunch keeps the contract and credential-lifetime rules, takes a new run id, keeps the failed run and reason in inv.runs[], counts no new Ticket attempt and changes no Ticket state; a second failure gives the Lead attention and no further relaunch. Amended by A2 (LFR-01 to LFR-07): positive termination and no-side-effect proofs, revocation before a fresh credential, a transient-reason allow-list (unknown fails closed), the circuit breaker and the relaunch record"}
  BRP-05: {section: "5. Execution policy", kind: requirement, tracked_by: [F15.6, F15.4], statement: "recovery: relaunch_launch_failed: 0 | 1, default and migration 0 (Lead-mediated relaunch only), 1 letting the engine perform the single eligible relaunch; personal dogfood or F19/M4-H may opt in; the R5-1 retry is not controlled by this flag. Amended by A3 (PBD-03, PBD-06): the setting is operational, snapshotted at the recovery decision, and a change re-evaluates the pending recovery action instead of producing STALE_POLICY"}
  BRP-06: {section: "6. Adverse evidence and laundering prevention", kind: invariant, tracked_by: [F15.6], statement: "Recovery is never proof that a failure is irrelevant: every failed run stays in invocation history; an existing blocked report, unresolved finding, high-severity anomaly or required disposition prevents later recovery from silently advancing the Ticket; directories needed to inspect a failure are not deleted; a launch failure that may have performed work needs Lead inspection; lost or dirty logic belongs to the deferred rows"}
  BRP-07: {section: "7. Explicitly non-automatic failures", kind: decision, tracked_by: [F15.6], statement: "Never recovered automatically by this slice: GATE_UNSATISFIED, ILLEGAL_TRANSITION, USAGE, STALE_POLICY, STALE_AUTHORITY, verification failure before Lead classification, plan or design defects, contract violations, poisoned plan premises, execution-premise contradictions, environmental or evidence blockers, a run that ended without evidence after changing files, tool or refusal loops and STALLED health, lost or crashed runs needing a new attempt; each stays with its existing authority owner"}
  BRP-08: {section: "8. Deferred recovery rows", kind: decision, tracked_by: [F15.7], statement: "Rows 4 (REDISPATCH_IF_LOST), 6 (a policy-resolved Investigator after a blocked report) and 8 (max_fix_attempts, the fix-loop cap) stay non-governing until adopted; they may later reuse the recovery: namespace but production policy must not accept their keys as active authority before then"}
  BRP-09: {section: "9. Conformance tests", kind: evaluation, tracked_by: [F15.6], statement: "R5-1: exactly one eligible retry; legality recomputed at the new revision; policy or authority drift blocks it; judgment-bearing stages never retry; the marker is durable. R5-3: a seeded pre-work transient failure relaunches exactly once under 1; the failed run stays in history and the relaunch has a new run id; a second failure stops; 0 keeps Lead-mediated behaviour; CONTAINMENT_UNAVAILABLE never relaunches; any evidence or work signal or a changed dispatch or base binding makes the run ineligible. A false recovery across a judgment boundary is a release blocker"}
  BRP-10: {section: "10. Evaluation", kind: evaluation, tracked_by: [F15.6, F15.7, F19], statement: "M4-H records STALE_REVISION, launch-failure and lost-run base rates per cell; F19 evaluates whether the bounded rules cut Lead turns and time to a correct disposition without false recovery; product recovery happens inside the counted run, never as a hidden free retry; no evidence from rows 1 or 3 auto-promotes rows 4, 6 or 8"}
  # ---- RHP: the run health projection design v0.1 (approved 2026-10-05; U1), amended by H1 and A3 ------------------------
  RHP-01: {section: "1. Purpose", kind: requirement, tracked_by: [U1], statement: "One truthful, bounded view of run health distinguishing active work, waiting, stalls, harness unresponsiveness, crashes and completed runs without an autonomous supervisor; recomputed from existing local telemetry on read, advisory wherever heuristic; only already-deterministic run and liveness facts drive existing mechanical reactions"}
  RHP-02: {section: "2. Non-goals", kind: decision, tracked_by: [U1, U7], statement: "No separate agent-status subsystem, no persisted health store, STALLED never an engine authority state, no automatic interrupt, nudge, relaunch or redispatch of a stalled run, no semantic progress inferred from model reasoning, no replacement of run, invocation or Ticket state; U7 stays deferred"}
  RHP-03: {section: "3. Health vocabulary", kind: requirement, tracked_by: [U1], statement: "health.state UNKNOWN (inside startup grace), STARTING, ACTIVE, BLOCKED (deterministic wait on permission, inbox or disposition, or a blocked role report), STALLED (medium confidence for a tool, low for a step), UNRESPONSIVE (fresh heartbeat while API polling fails and events stop), with rendering precedence BLOCKED > STALLED > UNRESPONSIVE > ACTIVE and existing terminal or lost status authoritative over advisory health. Amended by H1 §1 (RHN-01, RHN-02): terminal outcomes pass through as the existing run statuses instead of CRASHED and ENDED, consumers tolerate unknown values, and UNKNOWN after grace resolves by the existing observer rules"}
  RHP-04: {section: "4. Progress and stall interpretation", kind: requirement, tracked_by: [U1], statement: "Meaningful activity comes from the adapter event stream (tool activity, step boundaries, inbox delivery, permission replies); an open tool call (tool.called without completion or progress) and an open model step (step.started without step.ended or an explaining tool call) are distinct; a long step renders as 'thinking for N min' before its threshold, and silence alone is never proof the model is stuck"}
  RHP-05: {section: "5. Policy", kind: requirement, tracked_by: [U1, F15.4], statement: "Thresholds live in execution policy (health.stalled tool_floor_s 300, step_s 600, check_duration_multiplier 2.0), STALLED stays advisory with low confidence until a project has calibrated healthy check durations, and threshold changes never alter legality or Ticket state. Amended: the thresholds are in the operational digest, not the policy digest (A3, PBD-08), and T_tool comes from H1 §3's robust p95 over the last 50 valid checks with a cap, not the longest recent check (RHN-04)"}
  RHP-06: {section: "6. Projection contract", kind: requirement, tracked_by: [U1], statement: "harness_ops.harness_status() is the single computation point; each run gains health {state, confidence, source, since, detail (tool, duration_s, pending_permission, poll_errors, threshold_s)}, fields omitted when not applicable; consumers never recompute a competing answer. Amended by H1 (RHN-03, RHN-05, RHN-06): last_progress_at and last_event_at, an incremental cache, since from recorded telemetry"}
  RHP-07: {section: "7. Consumers", kind: requirement, tracked_by: [U1, F15.1], statement: "The one health object is rendered by aew harness status, typed harness_status, aew harness wait, resume, the dashboard's /runs and /overview.attention and ActionProjection.runs[]; harness wait wakes non-terminally when a run first becomes STALLED, naming the tool and duration, and the caller may keep waiting; a STALLED wake never terminates or revokes; resume and dashboard attention include STALLED, UNRESPONSIVE, crashed, lost and ended-without-evidence. Amended by H1 §6 and §7 (RHN-07, RHN-08): the wake is edge-triggered and only for a medium- or high-confidence stall"}
  RHP-08: {section: "8. Reactions", kind: invariant, tracked_by: [U1], statement: "Lost, crash or launch failure: existing revocation and reconciliation only, the Lead decides relaunch; blocked permission: wake and attention; STALLED: wake and attention only, the Lead may stop, nudge or wait; UNRESPONSIVE: attention plus the existing supervisor deadlines; a long think below threshold: render only; heuristic health never advances workflow or creates or releases authority"}
  RHP-09: {section: "9. Telemetry", kind: requirement, tracked_by: [U1], statement: "No new telemetry is required for v1; two additive improvements are permitted (the sub-second event timestamp t, an explicit tool.ended carrying the harness tool-call id), neither becoming authority. Amended by H1 §5 (RHN-06): an additive poll-error timestamp where the counters cannot give since"}
  RHP-10: {section: "10. Conformance tests", kind: evaluation, tracked_by: [U1], statement: "Zero false STALLED on the historical healthy corpus at the production threshold; a long healthy check below T_tool stays ACTIVE with detail; a long think below T_step renders thinking; the known long shell hang is detected with its tool and duration; crash and lost keep their deterministic behaviour; every surface returns the same computed object; no transition, guard or gate branches on heuristic STALLED"}
  RHP-11: {section: "11. Evaluation and future use", kind: evaluation, tracked_by: [U1, F19, F11, U7], statement: "M4-H/F19 may use health as a measured signal and M5's adaptive concurrency as one contraction signal, with no scheduler authority; automatic stall recovery needs a separate adoption after U1 is observed in use"}
  # ---- PFS: the pre-F15.2 amendment set v0.1 (approved 2026-10-05; F15.4 to F15.6, U1) -----------------------------------
  PFS-01: {section: "1. Authority and precedence", kind: gate, tracked_by: [F15.2, F15.4, F15.5, F15.6, U1], statement: "The set refines the approved steering (Crawl/Walk/Run), bounded recovery and run health projection designs v0.1 and controls where they conflict; required before F15.2 ships: operator-only authority for confirmations and autonomy increases, relaunch safety that positively excludes a still-live or side-effecting prior run, and legality binding separated from operational attribution so operational tuning creates no false STALE_POLICY; A1 and A2 are release requirements for their features; H1 is required before health is production-grade operator telemetry and blocks F15.2 only if F15.2 consumes health"}
  PFS-02: {section: "2. Preserved architectural decisions", kind: invariant, tracked_by: [F15.5, F15.6, U1, U7], statement: "Unchanged: health is a projection, never a store or workflow authority; steering is one confirmation predicate over already-legal auto_runnable actions; recovery is bounded and creates no new failure taxonomy; no model manufactures authority by changing policy or confirming its own constrained action; heuristics never advance workflow; no timeout releases a lease by itself; deferred R5 recovery rows stay deferred"}
  PFS-03: {section: "4. Required implementation order", kind: sequencing, tracked_by: [F15.4, F15.5, F15.6, U1], statement: "A3's digest separation first (A1 and A2 depend on it); A1's operator capability separation before exposing aew confirm, aew lead mode or unattended Run; A2's termination, credential and side-effect proof before enabling recovery.relaunch_launch_failed: 1; H1 before relying on STALLED/UNRESPONSIVE as a production operator signal"}
  PFS-04: {section: "5. Release gates", kind: gate, tracked_by: [F15.2, F15.4, F15.5, F15.6], statement: "F15.2 ships no mode-changing or confirmation surface reachable from an agent shell; automatic launch-failure relaunch does not ship until the previous run is proven terminated and non-side-effecting; operational policy changes never invalidate in-flight stage legality merely because an attribution or telemetry setting changed"}
  # ---- SAE: A1, the steering authority and execution envelope amendment v0.1 (F15.5) -------------------------------------
  SAE-01: {section: "1. Operator-only authority boundary", kind: invariant, tracked_by: [F15.5], statement: "aew confirm and aew lead mode are not ordinary Lead tools: a model Lead can neither confirm an action waiting for operator confirmation (Crawl and Walk would collapse into self-approval) nor increase its own autonomy"}
  SAE-02: {section: "1.1 Capability rule", kind: requirement, tracked_by: [F15.5], statement: "Confirming a pending steering action, increasing autonomy (crawl to walk, crawl to run, walk to run), granting an unattended conditional publication authorization such as PUBLISH_IF_CLEAN, and any future authorization letting execution continue without a contemporaneous human decision require an operator capability structurally absent from agent shells and model tool surfaces; repository, shell, policy or Lead authority is insufficient and an 'is the caller the Lead?' policy check is not enough"}
  SAE-03: {section: "1.1 Capability rule", kind: requirement, tracked_by: [F15.5], statement: "The operator capability SHOULD arrive over a channel an invoked agent cannot reach: a TTY-bound operator broker, a separate operator credential or an equivalent out-of-band channel"}
  SAE-04: {section: "1.2 What the Lead may do", kind: requirement, tracked_by: [F15.5], statement: "The Lead may request an autonomy increase for the operator to approve, lower autonomy without approval, request confirmation with rationale, and continue at the current or a lower mode; the order is crawl < walk < run, moving left a Lead-initiable restriction and moving right an operator-only authority increase"}
  SAE-05: {section: "1.3 Recorded decisions", kind: requirement, tracked_by: [F15.5], statement: "A mode-increase record names the operator identity or capability source, the previous and new mode, the Lead generation, the policy and operational digests and the revision at which it took effect; a Lead-requested increase is a request, not authority, until the operator's approval is recorded"}
  SAE-06: {section: "2. Fail-closed Walk classification", kind: requirement, tracked_by: [F15.5], statement: "Walk is an allow-list, not a deny-list: it auto-runs an eligible action only if every declared side effect is in the bookkeeping allow-list, initially {control_state}; an effect outside it, no declared side-effect class, a class unknown to the running engine, or incomplete or invalid declarations require operator confirmation, so new classes (network, knowledge publication, capability grant, external mutation) fail closed"}
  SAE-07: {section: "2.1 Declaration conformance", kind: gate, tracked_by: [F15.5, F15.2], statement: "Primitive catalog tests check that every staged primitive declares its side effects and that observed implementation effects are a subset of the declared ones; an under-declared primitive is a release-blocking catalog defect"}
  SAE-08: {section: "3. Auto-run execution envelope", kind: requirement, tracked_by: [F15.5], statement: "Before each auto-executed action the runner checks the envelope's remaining time, the approved token, cost or tool budget, concurrency and admission limits, action repetition and the stage wall-clock deadline; any exhausted bound stops the loop and surfaces attention"}
  SAE-09: {section: "3.1 Repetition detector", kind: requirement, tracked_by: [F15.5], statement: "The runner stops when the same projected action reference or semantic action key executes more than N times (default N = 2) without a state, revision or projection change that justifies it; the key is implementation-defined but stable enough to detect a no-progress loop; a repetition stop is not a workflow transition"}
  SAE-10: {section: "3.2 Wall-clock deadlines", kind: requirement, tracked_by: [F15.5], statement: "Two bounds: the auto-run loop deadline (how long the runner may keep selecting actions without returning control; expiry stops auto-execution and creates operator attention) and the invocation hard deadline (the lifetime of an unattended harness run)"}
  SAE-11: {section: "3.2 Wall-clock deadlines", kind: invariant, tracked_by: [F15.5], statement: "The invocation hard deadline is a pre-authorized authority-reducing safety action: the supervisor may terminate the run, revoke its credential, mark it interrupted or terminated through the existing run mechanism and require the existing reconciliation; it never releases a load-bearing lease because time expired, marks work verified, accepted, integrated or published, creates an attempt or relaunch, or infers a clean workspace; it and its scope are set before unattended execution and attributable to operator-approved execution policy"}
  SAE-12: {section: "4. Unattended Run behavior", kind: invariant, tracked_by: [F15.5], statement: "Run continues without contemporaneous confirmation only inside the approved envelope; a stalled or live-but-silent run gains no authority because Run is enabled and ends only by normal completion, an explicit operator or Lead stop under existing authority, or the hard deadline (which may terminate and revoke but never advance workflow or release a lease)"}
  SAE-13: {section: "4. Unattended Run behavior", kind: requirement, tracked_by: [F15.5], statement: "Unattended Run deployments need an out-of-band operator notification path (dashboard attention alone is insufficient when nobody polls it); the notifier may be implementation-specific, its failure is visible, and notification never stops, relaunches or advances a run"}
  SAE-14: {section: "5. Unattended publication", kind: invariant, tracked_by: [F15.5, F10], statement: "The Lead may request PUBLISH_IF_CLEAN but only the operator capability grants it; the authorization binds to the same legality inputs as publication itself; a steering mode never synthesizes it, and changing to Run never upgrades a non-publishable projection into a publishable one"}
  SAE-15: {section: "6. Tests", kind: evaluation, tracked_by: [F15.5], statement: "Release tests: an agent shell cannot invoke the operator confirmation capability; a model Lead cannot raise its mode or grant PUBLISH_IF_CLEAN; a Lead can lower its mode; unknown, missing or new side-effect classes require confirmation in Walk; observed primitive effects cannot exceed declarations unnoticed; budget, envelope and deadline exhaustion stop auto-run; repeated no-progress actions stop auto-run; changing the steering mode never changes legality, gates or transitions"}
  # ---- LFR: A2, the launch-failure recovery safety amendment v0.1 (F15.6) ------------------------------------------------
  LFR-01: {section: "1. Core correction", kind: invariant, tracked_by: [F15.6], statement: "launch_failed is not evidence that no process started and nothing happened: R5-3 relaunches only after AEW positively establishes that the previous run cannot continue and did no meaningful work; the rule is fail-closed"}
  LFR-02: {section: "2. Required termination proof", kind: requirement, tracked_by: [F15.6], statement: "Before a relaunch every applicable supervisor and custody mechanism agrees the failed run's process or session is terminated or never acquired execution custody; a timeout, stale heartbeat, missing poll response or the launch_failed label alone is not proof; without proof R5-3 is ineligible and the Lead gets attention"}
  LFR-03: {section: "3. Credential rotation", kind: requirement, tracked_by: [F15.6], statement: "Before the replacement run: revoke the failed run's credential, confirm the revocation took effect through the normal credential mechanism, mint a fresh credential and bind it to the new run id; a credential is never shared by the two runs and an unconfirmed revocation blocks automatic relaunch"}
  LFR-04: {section: "4. Positive no-side-effect proof", kind: requirement, tracked_by: [F15.6], statement: "Automatic relaunch needs positive evidence the failed run never crossed the work-began boundary: no tool invocation or event beyond startup and control-plane initialization, no successful credential-authorized project action, no evidence, report or discovery output, no workspace or authoritative-ref mutation, no external side effect on a declared primitive or tool channel, and a workspace digest and base binding that match dispatch; a channel AEW cannot observe forbids relaunch for a failure that may have reached it; the proof is recorded with the recovery decision"}
  LFR-05: {section: "5. Transient reason allow-list", kind: requirement, tracked_by: [F15.6], statement: "R5-3 retries only an explicitly allow-listed transient reason, a narrow implementation-owned list (for example a supervisor process-start race or a temporary local harness startup transport failure, with both proofs available); containment or security refusals, credential denial or capability mismatch, policy or configuration errors, quota or budget exhaustion, authentication or authorization failures, provider- or endpoint-wide outages, incompatible harness or model configuration and unknown reasons are never relaunched automatically unless separately adopted; unknown fails closed"}
  LFR-06: {section: "6. Circuit breaker", kind: requirement, tracked_by: [F15.6], statement: "A breaker trips when one launch-failure reason exceeds a configured threshold in a bounded window, per harness or provider endpoint or project-wide for a shared cause (recommended: 3 eligible failures in 5 minutes); once tripped relaunch is disabled for that scope, no extra dispatch is generated, an attention item names the reason and scope, and recovery resumes only on explicit operator reset or a later adopted health rule; the breaker is operational safety state, not workflow authority"}
  LFR-07: {section: "7. Relaunch history", kind: requirement, tracked_by: [F15.6], statement: "The relaunch record binds the failed run id, the termination proof, the credential revocation reference, the no-side-effect proof, the transient reason code, the circuit-breaker state and the new run id; both runs stay visible in invocation history"}
  LFR-08: {section: "8. Tests", kind: evaluation, tracked_by: [F15.6], statement: "Release tests: a still-live old process prevents relaunch; a stale heartbeat alone cannot authorize it; the old credential is revoked before a new one is minted; any project-side tool event makes R5-3 ineligible unless an explicit contract classifies it startup-only; workspace mutation prevents relaunch; an unknown reason prevents it; credential, configuration, quota and security failures never auto-relaunch; the breaker prevents load amplification; the replacement always has a new run id and credential"}
  # ---- PBD: A3, the policy binding and digest amendment v0.1 (F15.4) -----------------------------------------------------
  PBD-01: {section: "2. Two digest classes", kind: decision, tracked_by: [F15.4], statement: "Execution policy has two digest classes, legality_digest and operational_digest, replacing every rule that treats the whole execution-policy digest as one staleness binding (health §5, steering §6 and §8, recovery §5, and the typed surface's policy digest)"}
  PBD-02: {section: "2.1 `legality_digest`", kind: requirement, tracked_by: [F15.4, F15.2], statement: "legality_digest holds only inputs whose change may alter whether an action is legal, gated, authorized or judgment-bearing (gate, risk and assurance policy, authority and capability bindings, review and verification obligations, conditional authorization predicates, primitive legality rules, anything declared legality-affecting); a mismatch may produce STALE_POLICY and requires legality recomputation before execution"}
  PBD-03: {section: "2.2 `operational_digest`", kind: requirement, tracked_by: [F15.4], statement: "operational_digest holds settings that control execution or observation but not legality (health thresholds and calibration, steering mode, notification settings, auto-run envelope and budget parameters, recovery.relaunch_launch_failed and the breaker's parameters unless a recovery action snapshots them for its own authorization); changes are recorded for attribution, consumed at the next safe boundary and never by themselves make an already-committed legal stage step STALE_POLICY"}
  PBD-04: {section: "3. Per-action binding", kind: requirement, tracked_by: [F15.4, F15.2], statement: "Every staged action records legality_digest, operational_digest, the revision, the authority generation and any action-specific conditional authorization digest; before execution a legality mismatch recomputes legality or is STALE_POLICY under the existing rules, an operational mismatch recomputes behaviour at the next safe boundary and records the new digest, and an authorization mismatch stops per that authorization's contract"}
  PBD-05: {section: "4. Safe boundary", kind: invariant, tracked_by: [F15.4], statement: "A safe boundary is after the current committed primitive finishes and before the next is selected; operational changes never retroactively alter a committed primitive (walk to run changes confirmation on the next projection tick, a health threshold changes future interpretation only, disabling relaunch prevents a future relaunch without invalidating the running stage action)"}
  PBD-06: {section: "5. Recovery nuance", kind: requirement, tracked_by: [F15.4, F15.6], statement: "A recovery action that depends on an operational setting snapshots and attributes it at decision time (R5-3 runs only if recovery.relaunch_launch_failed == 1 at evaluation and every eligibility predicate passes); a change before the relaunch primitive commits re-evaluates that pending recovery action, which is recovery-policy invalidation, not a stage STALE_POLICY"}
  PBD-07: {section: "6. Steering nuance", kind: invariant, tracked_by: [F15.4, F15.5], statement: "Steering mode is never part of legality: a mode change affects the next confirmation decision, never changes AVAILABLE, BLOCKED, UNKNOWN or auto_runnable, and never invalidates a running primitive; an autonomy increase still needs A1's operator capability"}
  PBD-08: {section: "7. Health nuance", kind: invariant, tracked_by: [F15.4, U1], statement: "Health thresholds and calibration parameters are operational: changing them may change the next health projection, never invalidates legality or aborts a stage bundle, and is visible in the health object's attribution"}
  PBD-09: {section: "8. Schema requirement", kind: requirement, tracked_by: [F15.4], statement: "The policy schema classifies every field legality_affecting or operational; an unclassified new field fails schema validation until classified, and a field never silently defaults to operational because its semantics are unknown"}
  PBD-10: {section: "9. Tests", kind: evaluation, tracked_by: [F15.4], statement: "Release tests: health threshold changes make no stage STALE_POLICY; steering mode changes do not invalidate an in-flight primitive; gate and authority changes do make legality stale; recovery setting changes affect only pending recovery; every policy field is classified and new unclassified fields fail validation; history records both digests"}
  # ---- RHN: H1, the run health projection implementation note v0.1 (U1) --------------------------------------------------
  RHN-01: {section: "1. Terminal vocabulary passes through", kind: invariant, tracked_by: [U1], statement: "Health creates no second vocabulary for terminal outcomes: a terminal or non-running run renders its existing status (launch_failed, crashed, lost, ended_with_evidence, ended_without_evidence, terminated); health.state interprets non-terminal runs (unknown, starting, active, blocked, stalled, unresponsive); consumers render an unknown future value as unknown plus the raw status and detail, never a misleading known state"}
  RHN-02: {section: "1.1 Startup grace", kind: requirement, tracked_by: [U1], statement: "During startup grace unknown means run metadata exists but custody or status is not established; after it, if the existing observer rules prove the supervisor or run was never established or is gone, surface the existing lost or unconfirmed failure outcome, otherwise stay unknown with an explicit reason until a deterministic source resolves it; no new terminal state is invented to leave unknown"}
  RHN-03: {section: "2. ACTIVE semantics", kind: requirement, tracked_by: [U1], statement: "active means the run is live and no stronger blocked, stalled or unresponsive condition applies, not that the agent is making useful progress; health adds last_progress_at and last_event_at and the operator sees the distinction"}
  RHN-04: {section: "3. Robust stall calibration", kind: requirement, tracked_by: [U1], statement: "T_tool comes from a bounded healthy sample, never the single longest check: excluding killed, timed-out, manually aborted and calibration-invalid checks, baseline = p95 of the last 50 valid check durations and T_tool = clamp(max(tool_floor_s, check_duration_multiplier x baseline), tool_floor_s, tool_cap_s); initial defaults tool_floor_s 300, step_s 600, multiplier 2.0, window 50, percentile 95, tool_cap_s 1800, tunable operational (not legality) policy; no single hung check may permanently inflate the threshold"}
  RHN-05: {section: "4. Incremental projection computation", kind: requirement, tracked_by: [U1], statement: "The status and dashboard path never reparses the full event stream per poll: a disposable local cache per run id (event-file offset or sequence watermark, last parsed event, open tool and step state, last_event_at, last_progress_at, poll-error counters and source revision) parses only events after the watermark; it is local acceleration, never project state, and can be rebuilt from the telemetry"}
  RHN-06: {section: "5. Durable source for poll failures and `since`", kind: requirement, tracked_by: [U1], statement: "The projection names the run record or adapter counters that own poll_errors; if they lack timestamps for since, add an additive telemetry field or event (poll_error_started_at, last_poll_error_at or equivalent); since, and the entry time of STALLED or BLOCKED, derive from recorded telemetry and the threshold, never from the first UI poll that noticed"}
  RHN-07: {section: "6. Edge-triggered STALLED wake", kind: requirement, tracked_by: [U1, E1], statement: "harness wait wakes at most once per transition into a medium- or high-confidence STALLED: ACTIVE to STALLED (tool-level) emits one non-terminal wake, repeated polls while STALLED none, STALLED to ACTIVE to STALLED a new one; a low-confidence step-level stall renders attention but never wakes the Lead"}
  RHN-08: {section: "7. Tool vs step stall confidence", kind: requirement, tracked_by: [U1], statement: "A tool-level stall may be stalled once the tool threshold is crossed; step-level silence stays lower confidence, rendered as 'thinking for N min' until a separately configured stronger criterion is met, and is never phrased to a model Lead as a definitive 'agent stalled' instruction"}
  RHN-09: {section: "8. Unattended Run interaction", kind: invariant, tracked_by: [U1, F15.5, U7], statement: "Health never authorizes recovery of a Run-mode invocation: for unattended Run, STALLED and UNRESPONSIVE attention feeds A1's operator notification channel, the invocation stays under A1's hard deadline (which may terminate and revoke), no lease is released and no run relaunched because of a stall or deadline, and any automatic nudge or recovery stays a separate U7 adoption"}
  RHN-10: {section: "9. Tests", kind: evaluation, tracked_by: [U1], statement: "Production tests: percentile calibration robust to one poisoned or hung check; the calibration cap; a cache rebuild gives the same projection as incremental parsing; repeated polls do not reread the full stream; since survives a process or UI restart; ACTIVE exposes last_progress_at; a tool-level STALLED wakes once per entry; a low-confidence step-level stall does not wake; an unknown future health.state renders safely; terminal outcomes pass through unrenamed"}

  # ---- DAB: the dashboard main-line API design note v0.1 (F20.2 to F20.6) ------------------------------------------
  DAB-01: {section: "1. Scope", kind: requirement, tracked_by: [F20.2, F20.3, F20.4, F20.5, F20.6], statement: "Five slices, one PR each, in order F20.2 to F20.6; the server reads control state through the engine's existing read helpers, serves GET and HEAD only, and the credential it issues authorizes nothing in the engine"}
  DAB-02: {section: "4.1 The operator-session credential", kind: decision, tracked_by: [F20.3], statement: "R1: a fifth credential kind operator_session with the token record's shape, scope {surface: dashboard, project, operations: [dashboard.read], authorized_by: operator-tty}, no Lead generation (a handoff or takeover neither revokes it nor needs to), issued_by_generation for provenance only"}
  DAB-03: {section: "4.1 The operator-session credential", kind: invariant, tracked_by: [F20.3], statement: "R2: the credential authenticates a browser to the local server and never authorizes an engine operation; require_lead, require_invocation and verify_offer refuse the kind (negative test); a write scope would be a later decision with a renewed security review"}
  DAB-04: {section: "4.1 The operator-session credential", kind: requirement, tracked_by: [F20.3], statement: "R3: expires_at is set at issue (default 24 h, --session-hours 1 to 168) and enforced by the engine's own lookup; an expired session is 401 SESSION_EXPIRED; the first credential kind whose expiry acts"}
  DAB-05: {section: "4.1 The operator-session credential", kind: decision, tracked_by: [F20.3], statement: "R4: revocation is the end of the serving process (the table dies with it), expiry, or displacement from a bounded table of 32 live sessions (the oldest revoked as 'superseded: session limit'); no revoke command in v1"}
  DAB-06: {section: "4.1 The operator-session credential", kind: requirement, tracked_by: [F20.3], statement: "R5: verification is authority.lookup over the server's table (same regex, constant-time verifier comparison, expiry check); PermissionDenied is 401 SESSION_REQUIRED, StaleAuthority is 401 SESSION_EXPIRED"}
  DAB-07: {section: "4.1 The operator-session credential", kind: invariant, tracked_by: [F20.3], statement: "The raw secret exists only in the serving process between minting and the exchange, then only as its verifier; never written to any file, never printed (the URL carries a bootstrap code), never in any agent environment; the Lead broker refuses dashboard serve and open; the same-UID threat model of ADR-0005 is unchanged"}
  DAB-08: {section: "4.2 Issuing a session: aew dashboard serve and aew dashboard open", kind: requirement, tracked_by: [F20.3], statement: "R6: aew dashboard serve [--port 4280] [--session-hours 24] authorizes with operator.authorize at its own terminal, mints the first session, writes the one-time URL to the terminal, runs in the foreground until interrupted, clears the table on exit and writes .aew/local/dashboard/server.json (pid, port, started_at, control endpoint; local/ is never authority); default port 4280 (designer, 2026-10-05): an occupied port fails with a message naming --port and never moves to another port, --port 0 is the explicit ephemeral opt-in, and Host and Origin are checked against the origin actually bound"}
  DAB-09: {section: "4.2 Issuing a session: aew dashboard serve and aew dashboard open", kind: decision, tracked_by: [F20.3], statement: "R7: aew dashboard open is authorized by the serving process's console: open connects to the server's local control channel (a keyed Listener, key in local/dashboard/control.key 0600), the server writes a one-time code to its own console naming the requesting process chain, open reads the answer from its own controlling terminal (refused without one), the server compares in constant time with a 300 s timeout and one attempt, then mints and returns the URL; the key file is a convenience, never the authorization (alternative recorded: open authorizes at its own terminal and the server trusts the key file)"}
  DAB-10: {section: "4.2 Issuing a session: aew dashboard serve and aew dashboard open", kind: requirement, tracked_by: [F20.3], statement: "R8: both commands are credential-emitting: in credentials.ISSUING and the broker's CREDENTIAL_EMITTING (refused in a Lead session; refused without a terminal unless --print-credential puts the URL on standard output for a script); the result key session_url is delivered like token and offer"}
  DAB-11: {section: "4.3 The one-time URL and the cookie", kind: requirement, tracked_by: [F20.3], statement: "R9: the URL http://127.0.0.1:<port>/session/<code> carries a 256-bit single-use bootstrap code valid 10 minutes, not the credential; the exchange sets the cookie and answers 303 to / with no-store; a reused, expired or unknown code is 410 with a page naming no code; a cross-site Sec-Fetch-Site or a non-navigate Sec-Fetch-Mode is refused with 403 without consuming the code; the server never logs the code and sends Referrer-Policy: no-referrer"}
  DAB-12: {section: "4.3 The one-time URL and the cookie", kind: requirement, tracked_by: [F20.3, F20.5], statement: "R10: the cookie is the credential: aew_session=aew1.<id>.<secret>; Path=/; HttpOnly; SameSite=Strict; Max-Age to expires_at; no Secure attribute on the plain-http loopback origin; a failed cookie gets 401 with the JSON Error body and a Set-Cookie that expires it; routes outside /api/v1/ need no cookie"}
  DAB-13: {section: "4.4 Draft amendment text for ADR-0005", kind: process, tracked_by: [F20.3], statement: "The drafted ADR-0005 amendment (kind operator_session; scope without generation; never in control state; issued only after operator authorization at a terminal; delivered once as a one-time URL; expires_at set and enforced; custody the operator's; threat model unchanged; evidence in the session tests) lands in F20.3's PR with the ADR's status line updated"}
  DAB-14: {section: "4.5 History cursors", kind: decision, tracked_by: [F20.2], statement: "Two sequences, two cursors: the history manifest seq (ADR-0011) numbers cold records and is what /history projects and cold.root.count pins; the control revision (ADR-0012 D3) numbers commits and is what aew history log, control_revision and /activity use; they advance together but are not interchangeable"}
  DAB-15: {section: "4.5 History cursors", kind: requirement, tracked_by: [F20.2], statement: "R11: a History cursor pins cold.root.count at the first page and walks seq downwards (newest first, as aew history list orders): {v, route, project, pin, before, filters, limit}; entries appended after the first page never enter the session, so appends never invalidate or enlarge it and no 409 is ever needed; annotations_next_cursor pages a record's annotations the same way"}
  DAB-16: {section: "4.5 History cursors", kind: decision, tracked_by: [F20.2], statement: "R12: cursors are opaque base64url JSON, unsigned, validated against the request: 400 CURSOR_INVALID when undecodable, when route, project, filters or limit differ, when pin exceeds the current count or before is outside 1..pin (alternative recorded: an HMAC per process, which would fail every cursor on restart)"}
  DAB-17: {section: "4.5 History cursors", kind: requirement, tracked_by: [F20.2], statement: "R13: HistoryIndex.list gains max_seq and before_seq; aew history list gains --before SEQ so the CLI pages the same way (additive)"}
  DAB-18: {section: "4.6 Hot collection cursors", kind: requirement, tracked_by: [F20.2], statement: "R14: a hot cursor ({v, route, project, rev, filters, limit, after}) pins the control revision, pages by id keyset, and is 409 CURSOR_EXPIRED when rev is not current (400 on structural failure); /activity reads the append-only transition log so its cursor pins the starting revision, walks downwards and never needs a 409"}
  DAB-19: {section: "4.6 Hot collection cursors", kind: requirement, tracked_by: [F20.2], statement: "R15: the /work default is hot units plus the recent ring (at most 20); state=DONE or CANCELLED selects archived units through the index proportional to the answer; kind and parent filter the selected scope; paging never widens it"}
  DAB-20: {section: "4.7 The event endpoint of ADR-0012 D8", kind: decision, tracked_by: [F20.7], statement: "R16: the D8 event endpoint is not served in F20.2 because contract 0.1.2 has no such route; it is register row F20.7 (Unscheduled, on measured need: the frontend's poll intervals), a contract version with a renewed C0 review, designed as a bounded long poll on the revision cursor over the outbox's typed events, waiting on local/wake through the lock-free reader F20.2 builds"}
  DAB-21: {section: "4.8 Reading state without the control lock", kind: requirement, tracked_by: [F20.2], statement: "R17: the server reads committed state lock-free through ControlStore.read_committed() (bytes, digest, cached parse, schema-validated, no recovery) and ControlStore.control_identity() (stat first, read only on change), and takes no control lock per request (ADR-0012 D3, invariant 4; the D1 review's F3 finding)"}
  DAB-22: {section: "4.8 Reading state without the control lock", kind: invariant, tracked_by: [F20.2], statement: "A lock-free reader may observe a committed revision whose staged record files are not yet applied; a record missing or not matching its pin is 500 PROJECTION_FAILED (the frontend keeps last-known-good content visibly stale); the server never invents a gap and never repairs anything"}
  DAB-23: {section: "4.8 Reading state without the control lock", kind: requirement, tracked_by: [F20.2], statement: "The history index is used as history_list uses it (sync to the state's root, private copy when busy or read-only; derived, never authority); run records are read without a lock as harness_status reads them; on Windows the server holds control.yaml open only for one short read so a writer's replace retries rarely"}
  DAB-24: {section: "4.9 Answers to the web agent's W01 questions", kind: decision, tracked_by: [F20.3], statement: "Q01: bootstrap is the one-time URL and the frontend's first GET /api/v1/project; authentication changes are signalled only by 401 (SESSION_REQUIRED, SESSION_EXPIRED), no push, no second scope; the reset is a new one-time URL (aew dashboard open), there is no reset endpoint; 403 is never authentication"}
  DAB-25: {section: "4.9 Answers to the web agent's W01 questions", kind: decision, tracked_by: [F20.2], statement: "Q02: one server serves one project (the .aew root it started in), every envelope carries its project_id, the only request inputs are the contract's query parameters, workspaces, worktrees and attempts never alter a projection; a second project is a second server"}
  DAB-26: {section: "4.9 Answers to the web agent's W01 questions", kind: decision, tracked_by: [F20.2], statement: "Q03: no snapshots of past control state are retained (hot state plus the append-only cold history); /history serves cold records by seq and id, /work/{id} an archived unit as it stands now; pinned historical comparisons are not offered; unavailable history is a capability state (UNAVAILABLE with MIGRATION_REQUIRED or HISTORY_INDEX_UNAVAILABLE), never a silent empty list"}
  DAB-27: {section: "4.9 Answers to the web agent's W01 questions", kind: decision, tracked_by: [F20.4], statement: "Q04: the ETag is a strong validator over the representation less generated_at plus the request scope; a 304 carries the client's ETag and no body so discloses no unseen revision; a revision change is always a 200; the frontend's two diagnostics are impossible by construction and asserted in tests"}
  DAB-28: {section: "4.9 Answers to the web agent's W01 questions", kind: decision, tracked_by: [F20.2], statement: "Q05: future Journal, context and guarantee schemas belong to the M6 owners (F21, F13) as contract versions with their own C0 review and digest; the server serves none of them; /knowledge projects decision records only, since the engine produces no fact or assumption records"}
  DAB-29: {section: "4.9 Answers to the web agent's W01 questions", kind: invariant, tracked_by: [F20.2], statement: "Q06: one whole-project read-only scope, nothing denied per session; withholding is by construction: every projection built field by field from an allowlist, archive_ops.redact as a second layer, a scan test for credential strings and .aew/ paths; identities disclosed are AEW ids and token ids, never verifiers; error bodies carry server-written codes and messages, engine exception text goes to the server log only"}
  DAB-30: {section: "4.10 Projections: what each route reads", kind: requirement, tracked_by: [F20.2], statement: "One snapshot per request: the state is read once and the response built from it, so /overview is one coherent projection from a single read; routes polled at different times may differ in revision and the frontend reconciles"}
  DAB-31: {section: "4.10 Projections: what each route reads", kind: requirement, tracked_by: [F20.2], statement: "The route-to-engine-source table: /project, /capabilities, /overview (bounded work, runs, attention, activity, counts, recent), /work and /work/{id} (units.view, rollup, archived children and units, integration binding), /runs (invocations, rehydrated recent units, observed run status, authority text), /evidence (scan, held_evidence, freshness, curated producer), /knowledge (decision records), /history (index with seq bound, moves, no completion relation), /history/integrity (audit_status and the P2c dates, field by field), /attention (engine facts by state, blockers, contradictions, lost or crashed runs), /activity (the transition log newest first)"}
  DAB-32: {section: "4.11 Capabilities, health and reason codes", kind: decision, tracked_by: [F20.2], statement: "R18: overview, work, runs, evidence, knowledge, activity AVAILABLE; history and integrity AVAILABLE on a v2 project whose index syncs else UNAVAILABLE with a code; action_projection UNSUPPORTED with AWAITS_ACTION_PROJECTION until F15.1's canonical ActionProjection is its source (designer, 2026-10-05: no interim semantic twin), /attention 403 meanwhile while /overview's bounded attention list, counts.attention and Work.has_attention carry backend-provided engine facts; queue UNSUPPORTED with NOT_IN_CONTRACT_0_1_2"}
  DAB-33: {section: "4.11 Capabilities, health and reason codes", kind: requirement, tracked_by: [F20.2], statement: "Health: UNHEALTHY on a contradiction or a manifest-pin mismatch, DEGRADED on an over-policy audit finding or a lost run, else HEALTHY; observed_at is the snapshot's time"}
  DAB-34: {section: "4.11 Capabilities, health and reason codes", kind: requirement, tracked_by: [F20.2], statement: "Every reason code the server emits is registered in aew.dashboard.reasons with a message, and a test checks every code in a response is registered; audit_status gains over_policy_detail ({code, message}) beside its strings so the integrity reasons are coded"}
  DAB-35: {section: "4.12 Conditional requests and ETags", kind: requirement, tracked_by: [F20.4], statement: "R19: ETag = quoted sha256 of scope + newline + canonical JSON of the body without generated_at, scope being route, project, normalized filters, limit and cursor; control_revision and observed telemetry are in the body so any change to either changes the validator; generated_at is excluded so an unchanged representation can be a 304"}
  DAB-36: {section: "4.12 Conditional requests and ETags", kind: requirement, tracked_by: [F20.4], statement: "If-None-Match is parsed as a list; a strong match on any member is a 304 with the same ETag, the full security headers and no body; W/ validators and * never match; HEAD returns GET's headers including Content-Length without the body; no Vary header is needed"}
  DAB-37: {section: "4.13 The static build in the Python package", kind: decision, tracked_by: [F20.5], statement: "R20: the production build is committed under src/aew/dashboard/static/ with BUILD.json binding the frontend source commit and tree id, the contract digest, the builder and toolchain identity, the package-lock.json and package.json digests, the build time and per-file SHA-256 (designer, 2026-10-05), imported by tools/dashboard/import_build.py which admits only index.html, favicon.svg and assets/ regular files; a fast test checks every hash, that index.html references existing files and that no demo material is present; the main line builds under WSL with the pinned builder from a clean detached checkout of the explicitly agreed frozen frontend commit (F20 names 7c120b4; agreed before F20.5, never the newest by default; web agent, 2026-10-05); a rebuild is a new import and a reviewed diff"}
  DAB-38: {section: "4.13 The static build in the Python package", kind: requirement, tracked_by: [F20.5, F20.6], statement: "aew dashboard serve --static DIR serves an unpacked build for the web agent's local runs against live state; F20.6's acceptance uses the packaged build only"}
  DAB-39: {section: "4.13 The static build in the Python package", kind: process, tracked_by: [F20.5], statement: "If a minified bundle trips the secret scan there is no blanket allowlist of the assets directory: a false positive is allowlisted by its exact finding or exact generated file, with review and rationale in the PR; the scanner is never skipped (designer, 2026-10-05)"}
  DAB-40: {section: "4.14 CSP, security headers, Host and Origin rules, request bounds", kind: requirement, tracked_by: [F20.5], statement: "R21: on every response the frontend's proven CSP (default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'), X-Content-Type-Options nosniff, Referrer-Policy no-referrer, Cross-Origin-Resource-Policy same-origin, Cross-Origin-Opener-Policy same-origin, X-Frame-Options DENY, a restrictive Permissions-Policy; Cache-Control no-store except immutable for content-hashed /assets/*; never a CORS header, never Server, Set-Cookie only on the exchange and the 401 expiry"}
  DAB-41: {section: "4.14 CSP, security headers, Host and Origin rules, request bounds", kind: requirement, tracked_by: [F20.5], statement: "R22: bind 127.0.0.1 only with no flag to change it; exact checks against the origin actually bound (designer, 2026-10-05): the Host header must equal 127.0.0.1:<bound port> else 421 HOST_NOT_ALLOWED before routing (localhost included); a present Origin must equal http://127.0.0.1:<bound port> else 403 ORIGIN_NOT_ALLOWED; on /api/v1/ a present Sec-Fetch-Site must be same-origin or none else 403; an SSH tunnel uses the same local port"}
  DAB-42: {section: "4.14 CSP, security headers, Host and Origin rules, request bounds", kind: requirement, tracked_by: [F20.5], statement: "R23: GET and HEAD only (405 with Allow); HTTP/1.1 keep-alive with a 10 s socket timeout; a request body is 400; request line 4 KiB, 64 header lines and 16 KiB of headers (431), path 2 KiB, query 2 KiB, cursor 1 KiB, limit within 1..250, ids matched against OpaqueId before lookup (400), 16 requests in flight (503 with Retry-After), responses bounded by maxItems; static paths resolved inside the root with .., backslashes and encoded separators refused; the SPA fallback serves index.html for extension-less paths outside /api/ and /assets/, unknown files are 404, /mockServiceWorker.js is 404; the request log holds method, redacted path, status and milliseconds only; as built: 32 connections admitted at accept (503 SERVER_BUSY beyond, drained before the close), the whole request head within 10 s, input ending mid-head never processed, the logged path percent-encoded and capped at 256 characters, a log queue of 1024 lines whose drops are counted and reported"}
  DAB-43: {section: "4.15 Engine edits, kept small and additive", kind: requirement, tracked_by: [F20.2, F20.3], statement: "Six additive engine edits, each unit-tested, no restructuring while M4-D changes the engine in parallel: ControlStore.read_committed and control_identity; authority.lookup factored from _lookup plus mint and the OPERATOR_SESSION kind; max_seq/before_seq on HistoryIndex.list and --before on aew history list; over_policy_detail in audit_status; the two dashboard commands in ISSUING and CREDENTIAL_EMITTING with session_url in KEYS and a write_to_terminal helper; the operator prompt factored into challenge(); the dashboard sub-command registered through cli/dashboard_commands.py"}
  DAB-44: {section: "5.1 F20.2: the read-only API and conformance", kind: requirement, tracked_by: [F20.2], statement: "F20.2 delivers aew.dashboard (server, reader, projections, cursors, contract, reasons) with no aew dashboard command and no listener outside the tests (the server is started in-process by the suite on an ephemeral 127.0.0.1 port), engine edits 1, 3 and 4, unit tests for cursors, the contract loading, read_committed and the index bounds, and an integration suite over a project driven to archival: every route GET and HEAD validated with jsonschema, cursors paged to exhaustion, History cursors surviving appends, hot cursors expiring with 409, every 400, 404 by id, 403 on an unavailable capability, a v1 project's capability states, the lock-free read proven by holding the control lock while the server answers; acceptance: every route served and validated, no path, verifier or credential in any response, no control lock per request, the contract digest asserted against the accepted record in web/docs/c0-approval.json (re-pinned when the header correction lands)"}
  DAB-45: {section: "5.2 F20.3: the dashboard session", kind: requirement, tracked_by: [F20.3], statement: "F20.3 delivers session.py, serve, open and status, engine edits 2, 5 and 6, the ADR-0005 amendment and ADR-0009's table row, unit tests for the table and codes, and the security acceptance suite: bootstrap sets the cookie and redirects; no cookie, forged, truncated, wrong-id or wrong-secret cookies are 401; expiry is 401 SESSION_EXPIRED with an injected clock; the one-time URL reused is 410 while the first cookie works; an expired code is 410; a cross-site Sec-Fetch-Site does not consume the code; stopping the server kills every session; the kind is refused by every engine authority check; the secret is in no file, log or response; serve and open without a terminal are refused before minting; open with a wrong code mints nothing and with the right code mints exactly one session; a POSIX pty test in the serial lane; each security test shown to fail with its mechanism removed (negative controls recorded in the PR); F20.3's own security review"}
  DAB-46: {section: "5.3 F20.4: conditional requests", kind: requirement, tracked_by: [F20.4], statement: "F20.4 delivers etag.py and the If-None-Match, 304 and HEAD handling, with unit tests (generated_at excluded, scope included, equal bodies in different scopes differ, W/ and * never match) and an integration suite on live projections (304 when unchanged; 200 after a commit, after telemetry changes at the same revision, and after a revision-only change; the 304 carries the same ETag, no body and the full headers; HEAD equals GET's headers; the frontend's diagnostics impossible)"}
  DAB-47: {section: "5.4 F20.5: static serving and server security", kind: requirement, tracked_by: [F20.5], statement: "F20.5 delivers the committed static build with BUILD.json, tools/dashboard/import_build.py, the static routes and SPA fallback, the header set, Host and Origin rules, bounds, the in-flight limit and the request log, package data in pyproject.toml, unit tests for hashes, production exclusion, traversal and the fallback, and an integration security suite (every header on every kind of response, 421 foreign Host, 403 foreign Origin and cross-site Sec-Fetch-Site, 405 other methods, 400 body, 431/414 oversized, 400 invalid id before lookup, 503 beyond the limit, no CORS header, /mockServiceWorker.js 404, redacted log); depends on the web agent's production build; acceptance: the compiled frontend loads from the package with the cookie and shows live data, each mechanism shown to fail when removed"}
  DAB-48: {section: "5.5 F20.6: integrated acceptance", kind: gate, tracked_by: [F20.6], statement: "F20.6 runs the end-to-end flow through the real CLI as a subprocess with --print-credential (serve, URL, exchange, every page's projection with the cookie, contract validation, headers, 401 after stop), reruns the web agent's compiled browser checks against the live authenticated server with their scripts unchanged, re-runs the integration checklist's production exclusion, hostile-content, scope and validator isolation and UI task checks, and records the acceptance separately from the frontend's in docs/archive/reviews naming the server commit, BUILD.json, the contract digest and the results on Windows and Linux (Rocky 8 once)"}
  DAB-49: {section: "5. The slice plan", kind: sequencing, tracked_by: [F20.2, F20.3, F20.4, F20.5, F20.6], statement: "One branch and one PR per slice in order F20.2, F20.3, F20.4, F20.5, F20.6, each merged by the operator after the lead developer's review with findings fixed in the same PR; every slice validates every response against the contract; unit tests in fast, integration tests in integration, the pty test in serial, the Windows skip listed in platform-skips.yaml with the refusal path tested instead"}
  DAB-50: {section: "6. Notes for the web agent", kind: process, tracked_by: [F20], statement: "Seven notes relayed by the operator, nothing in web/ edited by the main line: the PENDING_REVIEW header (web agent: stale; the correction changes the pinned hash, so the acceptance and digest records update coherently with wire schemas unchanged); the production build (web agent: the main line rebuilds under WSL with the pinned builder from a clean detached checkout of the agreed frozen commit); the W01 ledger's resolution record; the browser checks' authenticated live mode still to implement on the web side (target URL, a private cookie file, no fixture servers, credentials out of evidence, a separate live acceptance path; demo preview contracts excluded); /history and /activity newest first; the aew_session name, the 401 Error bodies and the session-required message naming aew dashboard open; action_projection UNSUPPORTED until F15.1 and queue UNSUPPORTED with NOT_IN_CONTRACT_0_1_2"}
  DAB-51: {section: "8. Register and ledger", kind: process, tracked_by: [F20.2], statement: "The F20.2 to F20.5 rows point at this note, F20.7 is added as Unscheduled, every requirement here is tracked by F20, F20.2 to F20.7; the status line records the approval of 2026-10-05 and each slice's PR links to the section it builds; a later contract version is a new contract review, not an amendment of this note"}
  DAB-52: {section: "5.1 F20.2: the read-only API and conformance", kind: invariant, tracked_by: [F20.2, F20.3], statement: "Enablement rule (designer, 2026-10-05): no merged state ever serves project data unauthenticated; F20.2 lands the read adapter, projections and server class with no aew dashboard command and no listener outside the tests, the server refuses to start without a session table once F20.3 adds one, and serve and open arrive with F20.3"}
  DAB-53: {section: "4.13 The static build in the Python package", kind: requirement, tracked_by: [F20.5], statement: "Where the Node builder is available, CI rebuilds the committed static output from BUILD.json's commit with the recorded toolchain and verifies every hash (tools/dashboard/verify_build.py), running where web.yml's checks run, agreed with the web agent (designer, 2026-10-05)"}

  # ---- MSR: ADR-0015, project-map storage, identity and the map registry --------------------------------------
  MSR-01: {section: "D1. Placement: `.aew/local/maps/`, and deleting it means \"no selection\"", kind: decision, tracked_by: [F22.1], statement: "Project-map artifacts live at .aew/local/maps/structural/<artifact_sha256>.json and the registry, its log and its lock beside them under .aew/local/maps/ (git-ignored, rebuildable, never committed, never under knowledge/); deleting local/maps/ or any part of it means no map is selected, which is safe because a map grants nothing; the manifest's map pointer stays null"}
  MSR-02: {section: "D2. Identity: canonical JSON, with `git_oid` and `object_format`", kind: requirement, tracked_by: [F22.1], statement: "artifact_sha256 is the sha256 of the record's canonical JSON (sorted keys, compact separators, ASCII, integers only) without artifact_sha256; the stored file is that canonical JSON with artifact_sha256 added; readers recompute it and compare the stored bytes with the canonical bytes; no YAML emitter is part of the identity"}
  MSR-03: {section: "D2. Identity: canonical JSON, with `git_oid` and `object_format`", kind: requirement, tracked_by: [F22.1], statement: "The record names the repository's object_format and each metadata input carries git_oid beside path and sha256; an input considered but not read (over 256 KiB, or after the 2 MiB total) is logged read false with reason capped_size or capped_total (the schema's oneOf keyed on read)"}
  MSR-04: {section: "D2. Identity: canonical JSON, with `git_oid` and `object_format`", kind: invariant, tracked_by: [F22.1], statement: "Generator identity is the generator's name, version and the rule table's sha256; a code change that alters output bytes bumps the version, enforced by committed golden records"}
  MSR-05: {section: "D3. The closed writer", kind: invariant, tracked_by: [F22.1], statement: "aew.maps.store is the only code that writes under local/maps/ (the map.artifact.* and map.registry.* families); the Lead's synchronous path calls it now and F22.2's map_service will call the same functions under its own principal; no background or asynchronous adoption path exists before that principal is encoded"}
  MSR-06: {section: "D4. Who may write", kind: requirement, tracked_by: [F22.1], statement: "aew map generate (with or without --select) is Lead-authenticated against control state it only reads, checked again before the artifact is written and inside the registry's lock before a selection is written (a Lead superseded during generation is refused both), and Lead-reachable through the broker; an invocation credential, a superseded Lead or no credential is refused; map show and map diff are reads open to any context; no map command takes --expect-rev, commits a control transition or dispatches, and the typed surface has no map tool in this slice"}
  MSR-07: {section: "D5. The registry's revision domain: its own lock, an epoch and a compare-and-set", kind: requirement, tracked_by: [F22.1], statement: "The registry (aew/map-registry/v1) is selected by compare-and-set on <epoch>:<map_revision> under its own lock (none:0 before it exists; the first selection creates it with a random epoch; a recreated registry gets a new epoch, so an old expectation never matches); a refusal is STALE_REVISION with details.domain map_revision; the registry is replaced atomically and control state and control_revision never change"}
  MSR-08: {section: "D6. The log: attributable while it is retained", kind: requirement, tracked_by: [F22.1], statement: "Each selection appends {epoch, map_revision, selection_id, previous_selection_id, capability, previous, new, actor, at} (plus an overridden nondeterminism report) to registry-log.jsonl, synced before the registry is replaced; the registry holds the selection_id in effect, so the selections that took effect are the chain back from it and a line left by a failed registry write (possibly sharing a map_revision) is identifiable; the log is not workflow history and is rebuildable"}
  MSR-09: {section: "D7. Reason codes", kind: requirement, tracked_by: [F22.1], statement: "Reason codes: MAP_CURRENTNESS_UNPROVEN with details.reason missing_object (paths named), partial_clone (git older than 2.44 in a partial clone) or unknown_commit, and generation never produces a record from incomplete source; MAP_ARTIFACT_NONDETERMINISTIC reported by map generate and refusing --select unless --replace-nondeterministic, the registry otherwise left as it is; MAP_ARTIFACT_CORRUPT and MAP_REGISTRY_INVALID under INTEGRITY_ERROR"}
  MSR-10: {section: "D7. Reason codes", kind: invariant, tracked_by: [F22.1], statement: "The strict reader raises; consumers use the never-raising reader, which returns AVAILABLE or UNAVAILABLE with a reason (none, missing, corrupt, registry_invalid, unknown), so a damaged map never refuses or breaks a consumer"}
  MSR-11: {section: "D8. Freshness is computed, never stored", kind: invariant, tracked_by: [F22.1], statement: "Freshness is computed on read from Git objects and cached in process memory only, keyed by the artifact, the requested tree and the generator identity; nothing a reader writes can relabel a map"}
  MSR-12: {section: "Consequences and limits", kind: process, tracked_by: [F22.1], statement: "The Q7 cold-start attestation checks .aew/local/maps/ (empty, or recorded) whatever the pack switch says; no very-large-repository support is claimed beyond the measured 100,000 paths"}
  MSR-13: {section: "Amendment of 2026-10-07: the architecture reference and the map in context (F22.1, second pull request)", kind: requirement, tracked_by: [F22.1], statement: "aew map select-architecture records an existing discovery record (hot evidence or held by finished work) as selected.architecture under D4's rules and D5's compare-and-set, logged as D6; a missing id is NOT_FOUND and any other record kind is VALIDATION_FAILED with reason not_discovery_evidence; selection asserts nothing about content, and map show labels a stale reference STALE without dispatching or blocking anything"}
  MSR-14: {section: "Amendment of 2026-10-07: the architecture reference and the map in context (F22.1, second pull request)", kind: requirement, tracked_by: [F22.1], statement: "The execution policy's maps.pack_slices is \"off\" by default (written quoted: YAML reads a bare off as a boolean, which is refused with that cause and the fix), and then packs and the resume view are byte-identical to a project without maps; with structural, packs for roles whose context names codebase_map carry one bounded, fenced, escaped slice (freshness against the work's base, directory rows and generated/vendor hints in scope, omission counts) last in the source-and-evidence tier, and the resume row shows the selected map's freshness with its reasons"}
  MSR-15: {section: "Amendment of 2026-10-07: the architecture reference and the map in context (F22.1, second pull request)", kind: invariant, tracked_by: [F22.1], statement: "A pack pins the map it used in its sources (artifact, source tree and commit, reported freshness and the rendered slice, or the UNAVAILABLE reason); regeneration rebuilds the slice from that pin with the pinned freshness and gives the pack that was built whatever has happened to .aew/local/maps/ since (the pinned artifact, else the record regenerated from the pinned commit if it seals to the pinned sha, else the pinned slice), so removing or damaging a map after dispatch never refuses a launch, relaunch or rotation; packs and resume read maps only through the never-raising reader, so no map state changes dispatch, launch, gates, transitions or resume"}
  # ---- BSG: ADR-0014, release signing for the air-gap bundle --------------------------------------------------------
  BSG-01: {section: "D1. Signature scheme: OpenSSH signatures (sshsig) with an Ed25519 key, in the namespace `aew-bundle`, verified by AEW's own verifier", kind: decision, tracked_by: [F18.3], statement: "The bundle manifest is signed with `ssh-keygen -Y sign -n aew-bundle` on the release operator's machine and verified by AEW's own standard-library verifier, which parses the sshsig envelope (magic, version 1, key blob, namespace, hash algorithm, signature over magic || namespace || reserved || hash_algorithm || H(message)), checks the key against an allowed_signers file and verifies Ed25519 (RFC 8032) in pure Python; the signature is a detached armored sshsig file beside the manifest; only ssh-ed25519 keys with sha512 are accepted; the host's ssh-keygen is not used because the Rocky 8 base OpenSSH has no -Y (P1)"}
  BSG-02: {section: "D1. Signature scheme: OpenSSH signatures (sshsig) with an Ed25519 key, in the namespace `aew-bundle`, verified by AEW's own verifier", kind: invariant, tracked_by: [F18.3], statement: "The namespaces are fixed: `aew-bundle` for manifests and `aew-bundle-rotation` for rotation statements; the verifier holds the namespace as a constant and never takes it from the bundle, so a signature made for another purpose never verifies as a bundle signature"}
  BSG-03: {section: "D2. What is signed: the canonical manifest, which commits to everything consumed", kind: requirement, tracked_by: [F18.3], statement: "The signed object is the manifest's exact bytes: the verifier hashes and verifies the external manifest file it receives and never re-serializes it; canonical form (json.dumps with sort_keys, indent 2, ensure_ascii, one trailing newline, UTF-8, LF) serves reproducibility, so two builds of the same inputs give byte-identical manifests"}
  BSG-04: {section: "D2. What is signed: the canonical manifest, which commits to everything consumed", kind: decision, tracked_by: [F18.3], statement: "The manifest is canonical JSON, `aew-bundle-<version>-rl8-py311.json`, a file beside the archive (never inside it), not YAML, because the verifier has no YAML parser before AEW is installed; this renames the install design's illustrative aew-bundle.yaml and, since 2026-10-07, moves it out of the tar to sit beside it; the rest of IBU-12 is unchanged"}
  BSG-05: {section: "D2. What is signed: the canonical manifest, which commits to everything consumed", kind: requirement, tracked_by: [F18.3], statement: "The manifest (schema aew/bundle-manifest/v1) records the archive blob it authenticates (the archive's file name, byte size and SHA-256), bundle identity and provenance (name equal to the tar's, aew_version, spec_set, source_commit, source_tree, release_epoch (the annotated release tag's tagger date, a deterministic release input, never a build's wall-clock time), builder, platform with os, arch, glibc, python_tag and manylinux tag, member_count, every tar member; the manifest and signature are not in the tar), every qualified harness pin (name, version, path, sha256, schema_fixture_sha256, qualification id; nothing unqualified), every other consumed artifact sorted by path (path, type in wheel|binary|catalog_seed|skill|doc|requirements, size, sha256, mode 0644 or 0755) and the install section (the hashed requirements file's path and the venv layout)"}
  BSG-06: {section: "D2. What is signed: the canonical manifest, which commits to everything consumed", kind: invariant, tracked_by: [F18.3], statement: "The manifest lists every tar member (neither the manifest nor its signature is inside the tar); an unlisted member is a refusal, never a warning; the archive's digest is part of the signed manifest (archive name, size and SHA-256), so the signature authenticates the exact archive blob through the manifest while the member list still commits to every consumed artifact; this is not signing the tar: the structured manifest is what is signed"}
  BSG-07: {section: "D3. The trust root: an `allowed_signers` file provisioned independently of the bundle", kind: requirement, tracked_by: [F18.3], statement: "The trust root is an OpenSSH allowed_signers file holding exactly the release principals (release@aew with namespaces aew-bundle and aew-bundle-rotation, an ssh-ed25519 key, optional valid-after and valid-before) and a revoked_keys file beside it; the verifier parses that syntax itself (principal, namespaces, valid-after, valid-before, key type, key; anything else refused) and honours the validity window against the bundle's signed release_epoch, never the host's clock, so rotation does not depend on the host's OpenSSH; the window constrains an honest process (a key past valid-before cannot sign a new release) and is not a defence against a compromised key back-dating a release, which is revocation's job, and the same file works with ssh-keygen -Y verify on a host that has it"}
  BSG-08: {section: "D3. The trust root: an `allowed_signers` file provisioned independently of the bundle", kind: process, tracked_by: [F18.3], statement: "The organization receives the key fingerprint through a channel independent of both the bundle and the repository, confirms it out of band, and keeps its own allowed_signers under its configuration management (/etc/aew/allowed_signers by convention); the repository's release/allowed_signers and docs/release/trust-root.md are a cross-check only, never the sole source"}
  BSG-09: {section: "D3. The trust root: an `allowed_signers` file provisioned independently of the bundle", kind: invariant, tracked_by: [F18.3], statement: "The verifier takes the trust root's path from an explicit argument or host configuration, never from inside the bundle or the staging directory, and refuses a trust root writable by anyone but its owner or listing a key type other than ssh-ed25519"}
  BSG-10: {section: "D4. Identity and custody of the signing key", kind: requirement, tracked_by: [F18.3], statement: "One dedicated Ed25519 key per release identity (principal release@aew, comment aew-release-<year>), generated by the release operator with ssh-keygen -t ed25519 -a 100 and a passphrase, offline from any agent session; never a personal login key or a key that authenticates to a host or forge"}
  BSG-11: {section: "D4. Identity and custody of the signing key", kind: invariant, tracked_by: [F18.3], statement: "The private key lives only on the release operator's own machine (encrypted key file with ssh-agent, or the OS keychain): never in the repository, a CI secret, the Rocky 8 VM, a container image, a build directory, or any process that runs or hosts model-controlled code (ADR-0009 custody)"}
  BSG-12: {section: "D4. Identity and custody of the signing key", kind: decision, tracked_by: [F18.3], statement: "v1 uses a software Ed25519 key because FIDO2 sk-ssh-ed25519 signatures need OpenSSH 8.2 on the verifier and Rocky 8 has 8.0p1; a PKCS#11 HSM key producing an ordinary ssh-ed25519 signature may be used from the start; moving to a hardware key is a rotation, not an ADR change; the key signs bundle manifests and rotation statements and nothing else"}
  BSG-13: {section: "D5. Who signs, and where: the release operator, from a clean checkout, never CI", kind: requirement, tracked_by: [F18.3], statement: "tools/release/bundle.py build is deterministic: from a clean detached checkout of the tagged release commit it downloads wheels by hash for cp311 and the glibc-2.28-compatible manylinux tag, takes harness binaries from qualified pins by URL and SHA-256, generates any catalog seed from a clean disposable instance of the exact pin, writes the tar with sorted members, SOURCE_DATE_EPOCH mtimes equal to release_epoch, uid/gid 0, no user names and normalized modes, then writes the canonical manifest beside it committing to the finished tar's name, size and SHA-256 and to every member, so two builds of one release tag give identical manifest and tar digests with no wall-clock input anywhere"}
  BSG-14: {section: "D5. Who signs, and where: the release operator, from a clean checkout, never CI", kind: process, tracked_by: [F18.3], statement: "CI's release job builds the bundle and publishes only the manifest and tar digests, holding no key and signing nothing; the release operator rebuilds locally, compares both digests with CI's (rebuild-verify), inspects the manifest, and only then signs"}
  BSG-15: {section: "D5. Who signs, and where: the release operator, from a clean checkout, never CI", kind: requirement, tracked_by: [F18.3], statement: "tools/release/bundle.py sign is separate from build and refuses to run when CI or GITHUB_ACTIONS is set, when the key path is inside the repository or the build directory, or when the manifest digest differs from the one build recorded; it never prints or copies the key and leaves key handling to ssh-keygen and the agent"}
  BSG-16: {section: "D5. Who signs, and where: the release operator, from a clean checkout, never CI", kind: decision, tracked_by: [F18.3], statement: "No CI signing in v1: the repository is public and a secret available to a workflow is available to any branch that can change the workflow; a protected environment with required reviewers is a later decision; the operator's machine is the stated root of trust"}
  BSG-17: {section: "D6. Rotation, revocation and compromise response", kind: process, tracked_by: [F18.3], statement: "Scheduled rotation every twelve months and on suspected exposure, a rebuilt or lost operator machine, a change of release operator, or a move to a hardware key; the procedure publishes release/rotation-<date>.json naming old and new fingerprints, date and reason class, signed in the aew-bundle-rotation namespace by the old key (continuity) and the new key (possession), announces the new fingerprint through the independent channel, and allows an overlap of at most 90 days during which both keys verify and new bundles are signed only with the new key"}
  BSG-18: {section: "D6. Rotation, revocation and compromise response", kind: requirement, tracked_by: [F18.3], statement: "Revocation adds the public key to revoked_keys (passed to ssh-keygen -Y verify -r) and removes it from allowed_signers; the verifier refuses a signature by a revoked key whatever its date; a compromise also produces an advisory under docs/release/advisories/ listing by manifest digest every bundle the key signed, and supported bundles are rebuilt and re-signed; hosts match the advisory against the fingerprint their acceptance record stored"}
  BSG-19: {section: "D6. Rotation, revocation and compromise response", kind: process, tracked_by: [F18.3], statement: "Loss without compromise rotates as above with the rotation statement signed by the new key only and the independent channel carrying the explanation; a rotation never changes the namespace, the manifest schema or the verifier"}
  BSG-20: {section: "D7. The verifier: order of operations and refusal rules", kind: requirement, tracked_by: [F18.3], statement: "tools/release/verify_bundle.py is a single standard-library-only Python 3.11 module, importable after installation as aew.release.verify for aew doctor --bundle, transferred and pinned with the trust root through the organization's own channel; the copy inside a bundle never runs first"}
  BSG-21: {section: "D7. The verifier: order of operations and refusal rules", kind: invariant, tracked_by: [F18.3], statement: "The verifier's order, three artifacts given as paths: it checks the trust root (TRUST_ROOT; readable, owned by the invoking user or root, not group- or world-writable, only ssh-ed25519 keys passing D9's canonical and small-order rules; the ownership and mode checks are POSIX checks for the Linux-only target, and the verifier refuses to run elsewhere rather than skip them); reads the external manifest (a regular file, at most 4 MiB) and its signature (at most 16 KiB) into memory once (BUNDLE_SHAPE); verifies the signature over the exact manifest bytes in process with no subprocess and nothing written to disk (decode the armored envelope, version 1, ssh-ed25519 and sha512 only; namespace aew-bundle exactly; the key in allowed_signers under release@aew with that namespace, absent from revoked_keys; verify Ed25519; record the key's SHA256 fingerprint; BUNDLE_SIGNATURE); validates the authenticated manifest strictly with no unknown keys (BUNDLE_MANIFEST), including its release_epoch inside that key's validity window (BUNDLE_SIGNATURE_WINDOW otherwise); and only then reads the archive as opaque bytes. Nothing in the manifest is trusted before the signature verifies, and no tar parser runs before the archive blob is authenticated"}
  BSG-22: {section: "D7. The verifier: order of operations and refusal rules", kind: requirement, tracked_by: [F18.3], statement: "After the archive blob is authenticated, the verifier opens its verified copy as an uncompressed tar and enumerates members without extracting, under bounds of 10,000 members, 8 GiB declared total and 255-byte names (BUNDLE_BOUNDS); refuses every member that is not a regular file or directory, including symbolic and hard links, devices, FIFOs and sparse or long-name records (BUNDLE_TYPE), paths with `..`, `.`, empty components, NUL, backslash, control characters, a leading slash or a different normpath (BUNDLE_TRAVERSAL), and duplicate names including case-insensitive duplicates (BUNDLE_DUPLICATE); requires member_count to match and the listed paths to equal the regular-file members (BUNDLE_UNLISTED, BUNDLE_MISSING); checks each member's type and size and streams its hash reading at most size + 1 bytes (BUNDLE_MISMATCH); only after every check extracts into a fresh extraction directory inside the 0700 staging directory with tarfile's data filter as a second line of defence, re-hashes every extracted file from disk and sets modes from the manifest; and writes verification.json (manifest digest, the archive's verified size and digest, key fingerprint, trust root digest, verifier version, time) beside the verified copies of the three artifacts"}
  BSG-23: {section: "D7. The verifier: order of operations and refusal rules", kind: invariant, tracked_by: [F18.3], statement: "Any refusal removes the staging directory, leaves nothing else on disk, names its code and the offending member or field but never the member's contents, and exits non-zero; the verifier has no option that skips a step"}
  BSG-24: {section: "D8. Installation consumes only verified artifacts, and doctor records the acceptance", kind: requirement, tracked_by: [F18.3], statement: "Installation runs pip install --no-index --find-links <staging>/wheelhouse --require-hashes -r <staging>/<requirements> where the requirements file is itself a listed, hashed artifact, so every wheel is checked by the verifier and by pip; nothing outside the staging directory is consulted; the harness binary is copied with the manifest's mode and its SHA-256 and qualification id recorded, and nothing is executed before aew doctor's dry probe with the network unshared"}
  BSG-25: {section: "D8. Installation consumes only verified artifacts, and doctor records the acceptance", kind: requirement, tracked_by: [F18.3], statement: "aew doctor --bundle <staging> --json re-runs the verifier over the verified copies of the three artifacts kept in the staging directory, against the host's trust root, and emits the acceptance record: verification.json's content, ABI and platform checks, bwrap and user namespaces, the harness pin and schema fixture, the no-hidden-fetch result, and the signing key's fingerprint so an advisory can be matched to hosts; tool upgrade and project migration stay separate and aew migrate --plan does not read the record"}
  BSG-26: {section: "D9. The Ed25519 strictness rules, and how the verifier is kept in agreement with OpenSSH", kind: invariant, tracked_by: [F18.3], statement: "The verifier's Ed25519 rules, each tested: S is canonical (refuse unless 0 <= S < L, the full bound, so no S + L twin verifies); R and A are canonical encodings per RFC 8032 §5.1.3 (refuse y >= p, an unrecoverable x, and x = 0 with the sign bit set), the trust root's key decoded by the same rule at parse time; small-order A and R (order dividing 8) are refused, stricter than ref10-derived verifiers; the equation is cofactorless, k = SHA-512(R || A || signed_data) mod L, R' = [S]B - [k]A accepted only if encode(R') equals the received R bytes; anything else (not 64 bytes, a hash algorithm other than sha512, a key blob not ssh-ed25519 of 32 bytes) is refused; no option relaxes a rule"}
  BSG-27: {section: "D9. The Ed25519 strictness rules, and how the verifier is kept in agreement with OpenSSH", kind: requirement, tracked_by: [F18.3], statement: "The corpus has three parts: Wycheproof's Ed25519 vectors and the twelve Taming-the-many-EdDSAs vectors run in AEW's verifier alone with the expected outcome of each fixed by the rules, not by any implementation; honest sshsig signatures made by ssh-keygen -Y sign on a CI runner (several keys, namespaces, message sizes) must agree exactly with ssh-keygen -Y verify in acceptances and honest refusals (namespace, tampered message, missing key, revoked key, expired window, wrong principal); malformed envelopes derived from each honest signature (S + L, high bits in S, R with y + p, a small-order R, a trust-root key with y + p or of small order, a truncated signature) run through both verifiers under the rule AEW accepts is a subset of OpenSSH accepts, every stricter-than-OpenSSH case listed in the evidence with the OpenSSH version; constant-time behaviour is not required of verification"}
  BSG-28: {section: "Probes before the build", kind: evaluation, tracked_by: [F18.3], statement: "P1 (run 2026-10-05, evidence/0014-p1-sshsig-rl8.out.txt): on the Rocky 8.10 reference host, openssh-8.0p1-29.el8_10 fails ssh-keygen -Y sign, -Y verify and -Y check-novalidate with `unknown option -- Y`, so the host cannot verify sshsig signatures with its own tools and the verifier does it in process (D1, D7)"}
  BSG-29: {section: "Probes before the build", kind: evaluation, tracked_by: [F18.3], statement: "P2 (run 2026-10-05): python3.11-3.11.13 has tarfile.data_filter; the data filter refuses ../ traversal, an absolute symlink target, a hard link outside the destination, a FIFO and a character device, but neutralizes rather than refuses an absolute member path (stripped to a relative one) and a setuid mode (reduced to 0755), which is why it is only the second line behind the verifier's own refusals; P3 (for the build): pip on the same host accepts the wheelhouse's manylinux tag with --require-hashes and --no-index, and venv creation plus the install need nothing outside the staging directory, checked by strace or the proxy log"}
  BSG-30: {section: "What the build must show (F18.3)", kind: requirement, tracked_by: [F18.3], statement: "One adversarial-archive test per D7 refusal rule, each archive built by the tests (traversal and absolute paths, a differently normalizing path, backslashes, NUL and control characters, symbolic and hard links, a device, a FIFO, a sparse member, a duplicate and a case-insensitive duplicate, an unlisted member, a missing listed member, a size one byte short and one long, hash, type and mode mismatches, an unknown manifest key, a one-byte manifest change, another key, the right key in another namespace, a revoked key, a world-writable trust root, an RSA trust-root entry, a compressed tar, member-count and total-size bounds; and for the archive blob, one byte changed, one byte short and one long, a file name differing from archive.name, and a signed manifest beside another release's archive, each refused with BUNDLE_ARCHIVE with the tar parser never invoked, and an archive replaced on disk after hashing changing nothing), each failing with its named code, extracting nothing and leaving no staging directory"}
  BSG-31: {section: "What the build must show (F18.3)", kind: requirement, tracked_by: [F18.3], statement: "The signature verifier's tests: RFC 8032 §7.1's vectors pass (correctness); D9's raw edge-case corpora each produce the outcome rules 1 to 5 fix, with one test per rule showing a case refused by that rule alone; the honest sshsig corpus agrees with ssh-keygen -Y verify exactly; the malformed-envelope corpus satisfies AEW accepts is a subset of OpenSSH accepts with every stricter case listed in the evidence with the OpenSSH version; a malformed envelope (wrong magic, version 2, an RSA key blob, sha256, truncated fields, trailing bytes) is refused; a malformed allowed_signers entry (unknown option, a second key type, a missing namespace, a non-canonical or small-order key) is refused"}
  BSG-32: {section: "What the build must show (F18.3)", kind: requirement, tracked_by: [F18.3], statement: "Determinism (two builds of one release tag, built under different wall clocks, give identical manifest and tar digests on Linux CI and on the Rocky 8 host; build refuses a lightweight tag or a checkout that is not the tagged commit); the validity window (a release_epoch outside the signing key's window is refused with BUNDLE_SIGNATURE_WINDOW, and the host's clock changes no outcome); the sign command's refusals under CI, with a key inside the repository and with a digest mismatch; rotation (two keys verify during the overlap, a rotation statement verifies under both keys in its namespace, a revoked key fails whatever allowed_signers says); the end-to-end install on the Rocky 8 host run by the operator with the acceptance record naming the fingerprint; the release key appearing nowhere in the repository, CI logs, the bundle or the acceptance record, with the credential scans extended to the key's file forms"}
  BSG-33: {section: "D7. The verifier: order of operations and refusal rules", kind: invariant, tracked_by: [F18.3], statement: "The release is three side-by-side artifacts (aew-bundle-<version>-rl8-py311.tar, aew-bundle-<version>-rl8-py311.json, aew-bundle-<version>-rl8-py311.json.sig); before any tar parsing the verifier requires the archive file name to equal the authenticated manifest's archive.name and streams the archive as opaque bytes into a private copy, under its release file name, in a fresh 0700 staging directory, hashing as it copies and reading at most archive.size + 1 bytes, refusing a size or SHA-256 different from the manifest's (BUNDLE_ARCHIVE); every later step reads only that verified copy, so the bytes the tar parser sees are the bytes that were authenticated (operator, 2026-10-07)"}
  # ---- CUL: the cost and usage ledger design note v0.2, adopted 2026-10-06 (F25) ----------------------------------------------------------
  CUL-01: {section: "1. Scope", kind: requirement, tracked_by: [F25], statement: "One normalized record per harness run (model and profile, token categories, wall time, steps, the provider's reported cost, a trust label for each), one record per Lead attachment kept apart from the units' work, a project-owned price table (flat prices per billable bucket) applied through the adapter's declared token semantics, from which a derived cost is computed at read time under the pricing snapshot recorded at copy and never stored, roll-ups from run to invocation to unit to parent and project as projections, and a surface (aew usage show, runs, lead, --json) shared with F19's collector; out of scope: budget refusals (F7, M5), dashboard routes (a contract change), pruning local run directories, usage of non-model work"}
  CUL-02: {section: "5.1 The run-usage record: one bounded, normalized object per run", kind: requirement, tracked_by: [F25], statement: "R1: a run's usage is one bounded aew/run-usage/v1 object with no free text and no per-message arrays: run, source (harness), recorded_at (when copied), status (terminal status as observed), requested (the ADR-0010 pin), effective (what ran), model_check, wall_s, steps, tokens normalized to input, output, reasoning, cache_read, cache_write and unknown (unnamed categories summed), tokens_trust (harness_reported | partial | absent), provider_cost_usd as reported or null, provider_cost_trust (reported | zero_with_tokens | absent), tokens_by_model (optional per-model partition of the same categories when the harness provides one), token_semantics (the adapter's declaration of how the reported counters overlap, from the closed enumeration disjoint | input_includes_cache_read | input_includes_cache_read_output_includes_reasoning | output_includes_reasoning | unknown), foreign_sessions as a count, truncated; no dollar figure AEW computed is in the record; the copied object additionally carries pricing_sha256, the digest of the price table in effect when the run was recorded, or null"}
  CUL-03: {section: "5.1 The run-usage record: one bounded, normalized object per run", kind: invariant, tracked_by: [F25], statement: "R1's bound is a number: the field list is closed (additionalProperties false), every string an enumeration or identifier, effective capped at 8 distinct entries with effective_truncated counting the rest, and the serialized record at most 2 KiB, checked by the schema and the invariants; usage lives in hot state only while its unit is open, and the build adds the usage copy to tools/perf/control_plane.py's series and re-measures ADR-0011's H2 (derivation plus hash at most 10 ms per commit) at 20 open and 3,000 completed units with every open run carrying a 2 KiB record"}
  CUL-04: {section: "5.1 The run-usage record: one bounded, normalized object per run", kind: requirement, tracked_by: [F25], statement: "R2: the adapter normalizes, the supervisor records, the engine copies: HarnessAdapter.collect() gains a normalized usage_record built by a shared harness/usage.py helper so a second adapter fills the same shape; the supervisor writes result.usage_record beside the raw usage it keeps for diagnosis"}
  CUL-05: {section: "5.2 Trust labels: a number is only as good as its source says", kind: invariant, tracked_by: [F25], statement: "R3: every token or dollar figure carries its source: tokens_trust is harness_reported only when every named category was given, partial otherwise, absent when none; provider_cost_trust is reported for a non-zero cost or a zero against zero tokens, zero_with_tokens for a zero against non-zero tokens (a subscription login's number is not a price), absent when none; roll-ups never add a zero_with_tokens or absent provider cost into a reported total and count it as unpriced; tokens are the harness's reported counters kept as reported, and whether they overlap is declared by the adapter in token_semantics from knowledge the harness conformance tests pin to the qualified harness version, never guessed by the record and never carried by a hand-edited price row; a derived cost is labelled by its pricing snapshot digest and the record's token semantics, never by a trust word"}
  CUL-06: {section: "5.3 The price table, the token semantics, the pricing snapshot and the derived cost", kind: requirement, tracked_by: [F25], statement: "R4: the project owns policy/pricing.yaml (schema aew/pricing/v1: currency, as_of, source, flat prices per provider/model in USD per million tokens per billable bucket, carrying no semantics), pointed at by the manifest's optional policy.pricing; the reported counters are mapped onto non-overlapping billable buckets by the record's token_semantics, which the adapter declares per provider from a mapping table pinned to the qualified harness version by the harness conformance tests (a version without a pinned mapping yields unknown, never a guess); unknown semantics price nothing (unpriced_token_semantics_unknown) and a mapping yielding a negative bucket prices nothing (unpriced_inconsistent_counters); new semantics are a schema addition with a conformance fixture, never a formula in policy; a project without a table has no derived cost and every surface says unpriced; aew init writes none; aew doctor reports a missing table as INFO and a malformed table or a missing snapshot named by a record as ERROR"}
  CUL-07: {section: "5.3 The price table, the token semantics, the pricing snapshot and the derived cost", kind: invariant, tracked_by: [F25], statement: "R4: the derived cost of a run is the sum over the non-overlapping billable buckets the record's token_semantics yields of tokens times the price per million; a bucket with tokens and no price makes the run unpriced_category, never zero; the effective model is used only when the usage is attributable to one model (model_check match, a single effective entry, or a tokens_by_model partition priced per partition), otherwise the run is unpriced_effective_model_mix or unpriced_model, and the requested model is never used to price; it is computed at read time by every surface and never written into the record or control state, under two labels: estimated_at_record (the snapshot the record's pricing_sha256 names) and estimated_under_current_prices (policy/pricing.yaml now)"}
  CUL-08: {section: "5.3 The price table, the token semantics, the pricing snapshot and the derived cost", kind: invariant, tracked_by: [F25], statement: "R4: the first usage copy under a table digest writes the table's exact bytes content-addressed to .aew/pricing/<sha256>.yaml, immutable, never rewritten or pruned, so estimated_at_record is reproducible for ever; the evaluation component's pricing_snapshot_sha256 (EVC-14) is the snapshot digest the preregistration froze and its runs report the figure under it; a corrected policy/pricing.yaml changes estimated_under_current_prices on the next read and nothing else"}
  CUL-09: {section: "5.4 Placement: the record lands in control state at the Lead's next transaction on the invocation", kind: decision, tracked_by: [F25], statement: "R5: the run-usage record is copied from the run directory into control state as inv.runs[i].usage by the engine inside a Lead transaction that already touches the invocation, never by the supervisor (ADR-0012 OBX-45): at evidence ingestion (review.ingest, verify.ingest, the implementation report's acceptance) for the producing run and any earlier uncopied run of the invocation, at invoke cancel, at a relaunch (the previous run in the same commit), and at archival for every run of every invocation of the unit still lacking it, so the bundle carries the unit's complete usage into the cold state"}
  CUL-10: {section: "5.4 Placement: the record lands in control state at the Lead's next transaction on the invocation", kind: invariant, tracked_by: [F25], statement: "R5: each copy reads the run record once, takes result.usage_record if present and otherwise writes an absent record with the observed status, so a run that crashed before reporting is counted as a run with unknown usage and never silently omitted; the copy is idempotent (a run with usage present is never rewritten) and bounded (one object per run); inv.runs[] is declared in the control schema with usage as an optional field"}
  CUL-11: {section: "5.4 Placement: the record lands in control state at the Lead's next transaction on the invocation", kind: invariant, tracked_by: [F25], statement: "A usage copy derives no event: ADR-0012 D2 derives run.added by comparing run ids and invocation.status from the status field, so a new field on an existing run publishes no run.added, no invocation.status and no event of any kind for that invocation; no new event kind is added; a wait-any consumer (D6) never reads a usage copy as a new run; oracle rules 24 to 26 hold across a usage copy"}
  CUL-12: {section: "5.4 Placement: the record lands in control state at the Lead's next transaction on the invocation", kind: decision, tracked_by: [F25], statement: "Rejected placements: a supervisor-initiated commit at the run's end (OBX-45 froze that supervisors do not commit, the credential may already be revoked, and every path that makes a run matter is a Lead transaction) and a cold record kind of its own (usage is a property of a run inside an invocation the bundle already archives; a new history entry kind would be a contract change for data that has a home)"}
  CUL-13: {section: "5.5 The gap between a run's end and its copy is observable, not hidden", kind: requirement, tracked_by: [F25], statement: "R6: until the copy, usage exists only in local/; aew usage and the collector read control state first and, for runs without usage, the run directory's result.usage_record labelled provisional; a run with neither is missing, counted and shown; no surface sums a missing run into a total without saying how many it skipped"}
  CUL-14: {section: "5.6 Roll-ups are projections, computed from the records, never stored", kind: requirement, tracked_by: [F25], statement: "R7: engine/usage_ops.py computes, never stores, per run (record, pricing_sha256 as recorded, estimated_at_record and estimated_under_current_prices each a figure or unpriced with its reason, and the provider-reported cost with its trust), per invocation (the sum over runs with counts runs, reported, provisional, missing, unpriced by reason, zero_with_tokens, and per effective model, a mixed run counted as unpriced_effective_model_mix and never under the requested model), per unit (the sum over its hot or rehydrated invocations, then over its children by the hierarchy with own and descendant totals separate), and per project (hot units plus the recent ring by default; --all walks the history index for archived units bounded by --since/--until newest first, rehydrating one at a time); an invocation with no runs (M4-D3's integration_attempt custody invocations, or one not yet launched) is counted as invocations_without_runs at every level and contributes nothing else, and no roll-up expects a run under every invocation; every project-level projection carries scope and archive_complete (the default scope: recent, archive_complete: false; an unbounded --all scope: all, archive_complete true only when the walk covered every archived unit; a bounded --all scope: window, echoing its bounds), so the default view is never read as a lifetime total (designer, 2026-10-06)"}
  CUL-15: {section: "5.6 Roll-ups are projections, computed from the records, never stored", kind: invariant, tracked_by: [F25], statement: "R7: totals are never written back anywhere (not control state, not a cache file): a changed price table changes estimated_under_current_prices on the next read and nothing else, estimated_at_record never moves, and a late-copied record joins the next read; wall-time sums are labelled wall_s_sum because runs overlap"}
  CUL-18: {section: "5.8 Surfaces", kind: requirement, tracked_by: [F25], statement: "R9: aew usage show [WORK-ID] [--all] [--since] [--until] [--json] (a unit's tree or the project), aew usage runs [--invocation INV] [--json] (one row per run with its record and derived cost), aew usage lead [--json] (the Lead attachments); text output is a table per level and JSON is R7's projection with every count and label; F19's collector and any later dashboard projection call the same usage_ops functions; aew status --json gains one bounded usage summary for the hot state (runs counted, tokens summed, unpriced count); every project-level projection, text and JSON, carries R7's scope and archive_complete (designer, 2026-10-06)"}
  CUL-19: {section: "5.9 Non-goals and later work", kind: decision, tracked_by: [F25], statement: "R10: no budget refusal anywhere (G7's modification), no dashboard route (contract 0.1.2 is frozen; a usage projection is a 0.2 contract with a C0 review), no pruning of local/harness/runs (after R5 usage survives pruning, a precondition for pruning ever being safe), no per-step records in control state, no prices from AEW"}
  CUL-20: {section: "6. Engine edits, and the sequencing against M4-D", kind: requirement, tracked_by: [F25], statement: "Additive engine edits, each unit-tested: harness/usage.py normalize() and the adapter's usage_record; the supervisor's result.usage_record; the control schema's declared inv.runs[] with optional usage carrying pricing_sha256 and token_semantics and the optional lead.attachments ring, pricing.schema.json (flat buckets, no semantics), lead-attachment-usage.schema.json (the cold record) and the manifest's optional policy.pricing; harness/usage.py's closed TOKEN_SEMANTICS and the adapter's mapping table pinned by a conformance fixture; engine/usage_ops.py (copy_run_usage writing the content-addressed snapshot on first use, the projections with both derived figures, the price table reader, the bucket mapping by token_semantics and the derivation); lead_ops binding the attachment's usage baseline at activation and writing the per-attachment history/lead record through archive_ops._write_record at detach or close; one copy_run_usage call each in evidence_ops (ingestion, invoke cancel), harness_ops (relaunch) and archive_ops (the bundle finalizer); lead_ops and lead_broker for the lead.attachment_usage transition (baseline at activation, finalized at detach or close before the generation is revoked) and the bridge's refusal; cli/usage_commands.py and the status summary"}
  CUL-21: {section: "6. Engine edits, and the sequencing against M4-D", kind: sequencing, tracked_by: [F25], statement: "Edits touching evidence_ops, archive_ops, lead_ops, api, ports, the control schema and the invariants start after the overlapping M4-D work has merged (PR numbers are implementation notes, not requirements; designer, 2026-10-06) and coordinate D6's run-record reads with the lead developer (both read runlog.read_record; neither changes the run record's existing keys); harness/usage.py, the supervisor line, usage_ops and the CLI collide with nothing and may be built first on the same branch"}
  CUL-22: {section: "7. The build plan and its tests (F25, after approval)", kind: evaluation, tracked_by: [F25], statement: "Slice 1 tests: harness/usage.py against fixtures from the pinned OpenCode OpenAPI (all categories; cost 0 with tokens; no usage; truncated paging); the supervisor writing result.usage_record; usage_ops projections over hand-built states exercising every label and count; the price table schema (flat buckets; a row carrying semantics refused), the adapter's token_semantics mapping pinned against the 2.0.18 OpenAPI fixture in the conformance suite (another version without a pinned mapping yields unknown, which is unpriced_token_semantics_unknown), each semantics value against hand-computed figures including the overlap cases, a negative bucket, a bucket with tokens and no price, match versus mismatch versus a partitioned tokens_by_model run versus an unpartitioned mix (never priced on the requested model), unpriced_model; the snapshot written once and never rewritten, a changed table moving only estimated_under_current_prices, a missing snapshot a doctor ERROR; a property test that unit totals equal the sum of invocation totals equal the sum of run figures and the counts partition the runs"}
  CUL-23: {section: "7. The build plan and its tests (F25, after approval)", kind: evaluation, tracked_by: [F25, U4], statement: "Slice 2 tests (after the overlapping M4-D work): each of the three copy paths copies exactly once and writes an absent record for a run without a usage record; a usage copy derives no event (no run.added, no invocation.status) and oracle rules 24 to 26 hold across it, a wait-any consumer not woken by it; a record over 2 KiB or with a ninth distinct effective entry is refused by the schema and the invariants; control_plane.py gains the usage copy and H2 is re-measured at 20 open and 3,000 completed with every open run carrying a 2 KiB record on the Windows reference machine and the Rocky 8 host; a custody invocation without runs rolls up as invocations_without_runs; archival carries usage into the bundle and rehydration reads it back; aew usage show on a project driven to archival equals the sum from the run directories while they exist and still answers after local/harness/runs is deleted; --all pages the archive; the Lead attachment's usage has a baseline bound at activation and its delta finalized at a normal close as its own history/lead record plus the ring entry in one commit before the generation is revoked, refused through the bridge with a negative control; two attachments over one running harness conversation leave two records excluding the non-AEW use between them; an unexpected loss leaves partial or unavailable; a detached generation's TUI exiting later writes nothing and gains no authority; 40 attachments leave 40 cold records while the ring holds 32 and aew usage lead --all sums all 40; _lead_entry archives the ended credential unchanged; a probe of OpenCode 2.0.18's standalone session or stats output, read during a running conversation, again later in it and after a TUI exit, decides the Lead line's fields and whether totals can be differenced (tokens_trust absent if no source exists); the invariants gain the well-formedness of every inv.runs[].usage; the credential scans unchanged"}
  CUL-24: {section: "5.7 The Lead attachment's usage (U4): its own ledger line, never summed into units, one cold record per attachment", kind: decision, tracked_by: [F25, U4, F31], statement: "R8 revised (designer, 2026-10-06, Q12): the accounting boundary is the AEW attachment and its generation, never the native TUI or harness session; one aew/lead-attachment-usage/v1 record per accounting segment (harness_session as provenance only, project, generation, attached_at, detached_at, usage_delta in R1's normalized fields, pricing_sha256, completeness complete | partial | unavailable); a usage baseline bound when the attachment becomes active and the attributable delta finalized at a normal detach or close, before the generation is revoked; an unexpected loss yields partial or unavailable, never manufactured usage; one immutable history/lead cold record per segment through archive_ops._write_record, never discarded, plus the bounded hot ring lead.attachments (the last 32, never the only copy); aew usage lead --all walks the durable records; the segment boundary before F31 builds attachments, and who writes a segment interrupted by takeover or loss, are the designer's to decide before the Lead part is built"}
  CUL-25: {section: "5.7 The Lead attachment's usage (U4): its own ledger line, never summed into units, one cold record per attachment", kind: invariant, tracked_by: [F25, U4], statement: "R8: the model cannot write its own usage (the bridge refuses the attachment-usage transition from the model side as it refuses credential-emitting commands); the Lead's usage is reported beside the units' totals and never added to any unit, Ticket or parent; a stale or detached generation must not later gain authority merely because the underlying TUI eventually exits; a normal close finalizes the record before the generation is revoked"}

  # ---- HSD: the Q12 decision record (2026-10-06; F31, F32, F18) ----------
  HSD-01: {section: "1. The governing statement", kind: decision, tracked_by: [F31, F32, F18], statement: "AEW owns project attachment and Lead authority and the harness owns model execution; an attachment opens and closes independently of the harness; closing or losing it revokes AEW authority and stales its generation without terminating the model, harness, conversational context or admitted child work; reattachment creates fresh authority and refreshes canonical state; GPT-6 Astra is the reference Lead, Laguna S2.1 the default worker, GPT-5.4 and approved open-source workers selectable"}
  HSD-02: {section: "2. Ownership", kind: decision, tracked_by: [F31, F18], statement: "AEW owns the project attachment, Lead-seat authority, generation lifecycle, model and profile selection policy and provenance; the harness owns the interactive host and runs the model, and never becomes workflow authority"}
  HSD-03: {section: "3. Reference model topology", kind: decision, tracked_by: [F32], statement: "Reference topology: Lead GPT-6 Astra; default worker Laguna S2.1 (the strongest practical broadly available option); GPT-5.4 where its capability justifies the cost and rate-limit pressure; other approved models remain valid"}
  HSD-04: {section: "3. Reference model topology", kind: requirement, tracked_by: [F32, F31], statement: "No workflow semantics keyed to model names; AEW owns the requested and effective execution profile and the selection policy, the adapter realizes the profile natively and reports what ran, selection stays capability- and profile-based and attributable, and a harness-native override never silently causes AEW to record a different model or profile from the one that executed"}
  HSD-05: {section: "4. The AEW attachment and the harness lifecycle are separate", kind: requirement, tracked_by: [F31], statement: "An AEW attachment (project, Lead seat, generation, effective execution profile, broker and project capability) is not the harness session; the harness and model may exist before an attachment, outlive it and attach again"}
  HSD-06: {section: "5. `aew close`", kind: requirement, tracked_by: [F31], statement: "`aew close` detaches the project context, revokes the Lead's AEW capability, stales the generation and closes the attachment's broker and project authority, leaving the model no AEW project authority and no AEW-mediated project access through the detached attachment; it does not terminate the model or harness, erase the conversation or its context, prevent ordinary non-AEW work, or implicitly cancel admitted child invocations; cancelling child work is a separate explicit control"}
  HSD-07: {section: "6. Reattachment", kind: requirement, tracked_by: [F31], statement: "A later `aew open` may reuse the running harness conversation but establishes a fresh attachment, a fresh generation, fresh broker and project authority and a re-hydration from canonical state; the model's retained context is advisory and canonical state wins; old generations never regain mutation authority"}
  HSD-08: {section: "7. Crash, exit and takeover", kind: requirement, tracked_by: [F31], statement: "A harness crash or host loss revokes and stales that attachment's generation without destroying persistent project or session state; a replacement host attaches with a new generation; takeover is generation-based and fail-closed, and the prior generation's calls get stale-authority behaviour; normal model-turn completion has no effect on the seat"}
  HSD-09: {section: "8. Child and subagent execution", kind: requirement, tracked_by: [F31], statement: "Admitted subagent and role invocations have custody independent of the Lead attachment: its loss or closure does not terminate them, they may finish and deposit outputs and evidence, and a later Lead generation reconciles the resulting state"}
  HSD-10: {section: "8. Child and subagent execution", kind: requirement, tracked_by: [F13, F31], statement: "A harness-native subagent feature is used only when the adapter preserves AEW's invocation identity, role, custody, execution profile, parent relationship, limits and evidence and provenance, otherwise AEW dispatches; no native feature may bypass AEW dispatch or create uncontrolled subagents"}
  HSD-11: {section: "9. The hosting boundary", kind: decision, tracked_by: [F18, F31], statement: "AEW and its supervisor own Lead attachment authority, generation creation and revocation, broker and project capabilities, the curated environment, requested and effective profiles, harness configuration inputs, capability negotiation and lifecycle observation and provenance; the adapter translates into native configuration and lifecycle; the harness owns model execution; a launcher or wrapper does setup, launch, supervision and teardown but decides no workflow progression, evidence acceptance, retry, gate or other AEW semantics"}
  HSD-12: {section: "10. Consequences downstream", kind: sequencing, tracked_by: [F18, Q11, U6], statement: "Q12 is adopted and closed; F18.1 and F18.2 bootstrap and the hosting design, Q11's provider and harness feature reconciliation and U6 are unblocked; downstream designs choose implementation details but never reopen AEW's ownership of the Lead seat or merge the harness lifecycle with AEW's authority lifecycle"}
  HSD-13: {section: "12. Not decided here", kind: open-question, tracked_by: [F18, F21, F20, F31, F32], statement: "Not decided: where the knowledge, capability and dashboard services run (the F18 hosting design, with F21 and F20; ADR-0013 D9 already fixes the knowledge principal's authority); the mechanisms beyond `aew open` and `aew close` (attach handshake, how a child's credential outlives its admitting generation, the Lead harness's configuration and state isolation, U6) for F31; exact model ids and qualification for F32; multi-project knowledge visibility (K3) stays with F21; what project access after `aew close` covers was settled by the designer (HSD-21)"}
  HSD-14: {section: "13. Operator decisions of 2026-10-06: in-flight work when an attachment ends", kind: decision, tracked_by: [F31], statement: "Revoking a child's credential never destroys its work (its workspace files and run logs remain); it ends AEW's governance: hand-ins are refused, never evidence, no gate passes and no Ticket moves on them; the work can re-enter through the gates or leave for an ordinary development cycle"}
  HSD-15: {section: "13. Operator decisions of 2026-10-06: in-flight work when an attachment ends", kind: decision, tracked_by: [F31], statement: "When a Lead attachment ends with children running (close, harness crash, host loss, takeover, or a handoff that does not carry them), the operator chooses at the operator terminal: drain (children keep their narrow credential, finish within a time limit, hand in and stop; results recorded and held), stop now (stopped at once; Tickets INTERRUPTED and reconciled after inspection), or release to manual (stopped, with their credentials revoked together with the stop, and their work product handed to the operator outside AEW; revised by the operator to agree with the F18 hosting design v0.6 section 11.3)"}
  HSD-16: {section: "13. Operator decisions of 2026-10-06: in-flight work when an attachment ends", kind: decision, tracked_by: [F31], statement: "Drain is the default whenever no operator choice is made, such as a crash with nobody at the terminal; only the operator runs aew close, and a Lead that wants to close prompts the operator (revised to agree with the F18 hosting design v0.6 section 2.3); closing never forces the Lead's own harness session to end; anything going wrong during a drain stops the run at once and reports an error to the operator (the designer's stop set, HSD-20); a Lead never chooses stop now or release to manual when its attachment ends, while keeping its per-invocation cancel and stop while attached"}
  HSD-17: {section: "13. Operator decisions of 2026-10-06: in-flight work when an attachment ends", kind: requirement, tracked_by: [F31], statement: "Held results name the producing run and the admitting generation; on the next attachment the operator or the new Lead accepts them, moving their Tickets under the normal rules, or discards them, sending the work back through the gates; only the current generation's acceptance moves a Ticket (WC section 5's stale-writer guard, confirmed in HSD-19)"}
  HSD-18: {section: "14. Designer clarifications of 2026-10-06 (F31)", kind: decision, tracked_by: [F31], statement: "Crash and interruption are scoped to the invocation whose custody is lost: loss or closure of a parent or Lead attachment is not loss of an admitted child invocation's custody, a child whose own supervisor and custody stay valid keeps running under its invocation authority, and WC section 8.2 and KC section 12.4's INTERRUPTED/unknown reconciliation applies only when the child's own custody is lost; no WC or KC amendment"}
  HSD-19: {section: "14. Designer clarifications of 2026-10-06 (F31)", kind: decision, tracked_by: [F31], statement: "Result production and hand-in are invocation authority and may create only the records its invocation contract permits; acceptance, classification and every Ticket or control-state transition use the current control authority, so WC section 5's stale-writer guard stays intact (checked: submit writes evidence only, a separate Lead operation moves the Ticket); an amendment is needed only if an implementation couples hand-in to a control transition"}
  HSD-20: {section: "14. Designer clarifications of 2026-10-06 (F31)", kind: requirement, tracked_by: [F31], statement: "A drain stops at once, with an error report, on: an existing supervisor stop condition including abnormal harness or process exit; the execution deadline or step limit; containment failure; supervisor failure; a relevant custody, lease or integrity failure; the drain's hard deadline; the operator's stop; failure to durably record or verify the drain or result state; any unclassified fault (fail closed). Not drain failures: a new generation attaching, the old one going stale, a control revision changing, a legitimate FAIL, BLOCKED, inconclusive or other domain result, or a result needing later Lead classification; those are recorded and held"}
  HSD-21: {section: "14. Designer clarifications of 2026-10-06 (F31)", kind: decision, tracked_by: [F31], statement: "After aew close the detached Lead generation has no AEW project authority and no AEW-mediated project access through the detached attachment: every project-scoped AEW surface, read and query commands included, is unavailable to it; this is not a filesystem sandbox, the harness may keep its context and do ordinary non-AEW work its own permissions allow, and sandboxing the persistent Lead harness is a separate containment decision outside Q12 and F31"}
  HSD-22: {section: "13. Operator decisions of 2026-10-06: in-flight work when an attachment ends", kind: decision, tracked_by: [F31], statement: "The integration custodian survives a Lead attachment's end with its lease held; its post-integration verifier drains and its result is held; nothing publishes on a held result until the current generation accepts it, even under an advance publish-if-clean bound to an earlier generation; a discard, a drain stop, stop now or release to manual ends the custodian as an explicit cancel, so the lease is marked reconcile and integrate reconcile retires the candidate and requeues the entry; chosen by the operator over a named exception to the drain; the queue side confirmed in HSD-23"}
  HSD-23: {section: "14. Designer clarifications of 2026-10-06 (F31)", kind: decision, tracked_by: [F31], statement: "An advance publish-if-clean is bound to the generation that granted it and is stale once that attachment ends; nothing publishes because a held result is clean; the current generation inspects and accepts the held result and issues any publish under fresh authority, with no new verification needed if it accepts the result as still applicable; the custodian and lease are kept only while admitted post-integration work drains and its result awaits current authority; any abandonment (a discard or rejection, a drain stop leaving no usable result, stop now, release to manual, another explicit cancel) cancels the custodian, marks the attempt for reconciliation without releasing the lease as if integration succeeded, and goes through aew integrate reconcile; F31 never reruns verification automatically while holding the lease, and a bounded retry under the same custody would be a separately governed recovery action"}
  HOC-01: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F19], statement: "F19 is closed for design purposes: held-out corpus isolation is an M4-H experiment-protocol requirement, not a new AEW architecture surface"}
  HOC-02: {section: "1. The decision, recorded as given", kind: invariant, tracked_by: [F19], statement: "Held-out corpus material not yet assigned to a trial is never readable by any model-controlled process in either experimental arm; neither arm may access unreleased tasks"}
  HOC-03: {section: "1. The decision, recorded as given", kind: requirement, tracked_by: [F19], statement: "For M4-H the private corpus stays off the model-controlled arm hosts entirely; the evaluation and operator side retains it and releases only the selected task material at that trial's defined start boundary; once released, both arms may access whatever files and context are legitimately part of that task"}
  HOC-04: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F19], statement: "M4-H corpus isolation does not depend on filesystem masking, F23 two-account deployment, F28 network containment, Windows containment or other production hardening; those remain independent security work, not prerequisites"}
  HOC-05: {section: "1. The decision, recorded as given", kind: requirement, tracked_by: [F19], statement: "No AEW product feature is required for F19 unless the evaluation harness lacks a way to stage one selected task at a time"}
  HOC-06: {section: "3. Designer clarification of 2026-10-06: the arm-host rule", kind: invariant, tracked_by: [F19], statement: "Before a task is released, no model-controlled process in that arm has a filesystem, mount, share, synchronization path, host-integration path or other readable route to any unreleased corpus material"}
  HOC-07: {section: "3. Designer clarification of 2026-10-06: the arm-host rule", kind: requirement, tracked_by: [F19], statement: "The runner fails closed: when the preflight cannot establish corpus isolation, the task is not released"}
  HOC-08: {section: "3. Designer clarification of 2026-10-06: the arm-host rule", kind: requirement, tracked_by: [F19], statement: "The practical boundary, not a proof that the arm host can never reach the evaluator (no full containment or network-security design): no local copy, no parent directory containing the corpus, no mounted, shared or synced path to it, and no obvious host-integration path that can read it; a VM whose host or shared folder exposes the corpus or a parent of it is not corpus-free"}
  HOC-09: {section: "3. Designer clarification of 2026-10-06: the arm-host rule", kind: requirement, tracked_by: [F19], statement: "A WSL instance on a Windows host that stores the hidden corpus is ineligible by default, unless host-drive access and interop are deliberately disabled or otherwise shown not to expose the corpus; the cleaner setup keeps the evaluator and corpus on another machine or environment"}
  HOC-10: {section: "2. Filing (lead developer)", kind: requirement, tracked_by: [F19], statement: "The harness lacks one-task staging (the runner builds, runs the arm and scores on one host holding the hidden root), so the runner splits: the evaluator side keeps the corpus, preregistration, attempt ledger and oracle, registers the attempt and releases only the selected task's fixture snapshot, task statement and the arm's pinned configuration; a corpus-free arm host runs the arm and returns the final work tree for scoring, with the facts only it can observe (whether its AEW checkout was touched, its environment); before the aew and raw arms run any held-out case"}
  HOC-11: {section: "3. Designer clarification of 2026-10-06: the arm-host rule", kind: requirement, tracked_by: [F19], statement: "The split runner's arm-host preflight checks the arm-host rule before every release; a refusal happens before the attempt's arm starts and is recorded with its reason (lead developer's filing)"}

  EVR-01: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [E12], statement: "aew evidence show <id> is the canonical detailed read surface for an Evidence record and the Lead's and operator's drill-down; normal workflow surfaces (stage results, harness wait, status and next actions, typed Lead responses) keep carrying the record's top-level conclusion and Evidence ID"}
  EVR-02: {section: "1. The decision, recorded as given", kind: requirement, tracked_by: [E12], statement: "aew evidence show reads through the existing query and projection layer, never the .aew backing files; exposes backend-owned Evidence semantics rather than deriving them in CLI or UI code; uses the same semantic projection as the other typed and read-only surfaces where practical; has structured output (--json or the established equivalent) the typed Lead surface and adapters consume; bounds large bodies and artifacts; preserves identity, provenance, bindings and currentness"}
  EVR-03: {section: "1. The decision, recorded as given", kind: requirement, tracked_by: [E12], statement: "The detailed projection exposes the available form of: Evidence ID and kind, result, currentness, claim or conclusion, findings or deviations, requires_disposition, evaluated candidate or snapshot and bindings, evaluator and environment metadata, a bounded body, provenance, and related artifact and reference identifiers; field names follow the existing Evidence and query contracts, never an E12-specific schema"}
  EVR-04: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [E12], statement: "Non-goals: no new Evidence authority or storage model, no CLI parsing of raw Evidence files, no Evidence body injected into every workflow result, no backing-artifact browsing in the command, no change to acceptance, currentness, gate or disposition semantics; no further E12 design document"}
  SMQ-01: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F22.1], statement: "T5-A structural mapping is permitted and preferred for M4-H if ready, as part of the intended baseline navigation experience, but is not a prerequisite and never delays the value gate, preregistration or dogfood; if T5-A passes its own acceptance gates before M4-H it is included in M4-H's configuration, otherwise M4-H runs without it"}
  SMQ-02: {section: "1. The decision, recorded as given", kind: sequencing, tracked_by: [F22.1, F22.2, F22.3, F30], statement: "T5-A may be built in parallel (derived, non-authoritative state with its own map revision domain, owning no workflow legality, gates, publication or control state); the main lane is M4-G, F25, F19/Q7/U3, M4-H; T5-B and later semantic and project-understanding slices stay off M4-H's critical path unless a separate representativeness argument is made; no further F22.1 design work"}

  # ---- HAA: F18 harness hosting and attachment authority v0.6 (adopted 2026-10-06; F18.5 to F18.14) ----------
  HAA-01: {section: "0. Adoption disposition and final amendments", kind: decision, tracked_by: [F18], statement: "Adopted alongside the install and bootstrap design; nine final amendments: server-side broker binding to a single-use tool_call_id and argument hash; a gateway principal holding provider credentials and storing only verdict metadata, failing closed; managed principals network-confined to the gateway; attestation separating stable instructions and tool definitions from untrusted dynamic content; B0 ergonomics; aew open refusing a collapsed principal; guarantee: dev outputs; the T5 protected-set narrowing; hygiene. Astra and Laguna capability and cost stay deployment assumptions to qualify"}
  HAA-02: {section: "1. Governing decision", kind: decision, tracked_by: [F18.5, F31], statement: "AEW owns attachment, Lead-seat authority, the generation lifecycle, canonical control state, requested and effective profile binding, broker capability, provenance and authoritative mutation; the harness owns the host, model execution and qualified native mechanisms; closing or losing an attachment revokes authority and stales the generation without terminating the harness, the model, its conversation and context, or admitted children; reattachment creates fresh authority and refreshes canonical state"}
  HAA-03: {section: "1.1 Reference topology", kind: decision, tracked_by: [F32, F18.13], statement: "Reference: GPT-6 Astra Lead (unless the operator changes it), Laguna S2.1 default worker, GPT-5.4 and approved open-source alternatives through attributable profiles; a long-lived Lead host that may outlive an attachment; private AEW-custodied worker runs by default, native delegation not baseline authority; no workflow rule branches on model names"}
  HAA-04: {section: "2.1 Security-principal separation is required", kind: gate, tracked_by: [F18.6, F23], statement: "A same-UID deployment of the model-controlled Lead host and the supervisor or operator authority does not satisfy the contract; a kernel-enforced separation (a dedicated harness OS identity with supervisor-owned state, an SELinux-confined domain, or an equivalent) is required; F18-B's first exit criterion is a negative test as the actual Lead-host identity on real Rocky 8; a deployment that cannot pass is unsupported for full attachment and says so"}
  HAA-05: {section: "2.2 Canonical protected set", kind: requirement, tracked_by: [F18.5, F18.6], statement: "The supervisor-owned protected set covers control and workflow state, execution policy, support manifests and qualification results, canonical Evidence, admitted Knowledge, T5 manifest pointers and expected hashes (map content stays non-authoritative and hash-verified), generation history, broker and operator-endpoint configuration, gateway policy and binding state, and adapter qualification records; each class has a negative write test from the actual Lead-host principal; a project-tree projection is a derived cache verified against the canonical source before authoritative use"}
  HAA-06: {section: "2.3 Operator-only lifecycle capability", kind: invariant, tracked_by: [F18.5, F18.6], statement: "aew open, aew close, takeover and any authority-increasing operation are operator-only, enforced by the principal boundary and an operator-only supervisor endpoint with verified peer credentials, unreachable from the Lead host, workers, typed model tools and recovery cli escapes; a command name or TTY is not the boundary; aew open detects the effective identities and refuses a production attachment when the Lead host and operator principals collapse; any dev bypass is explicit, labelled and cannot claim the production guarantee"}
  HAA-07: {section: "3.1 Content identity", kind: requirement, tracked_by: [F18.5, F18.4], statement: "A supported harness is a qualified tuple (adapter, artifact content identity, reported version, protocol hash, request-surface probe identity, conformance-suite version and result), never a product name; version strings are descriptive; the support manifest records digests of the harness artifact and every support-critical companion; signed bundle authenticity and release_epoch stay F18.3 and ADR-0014's"}
  HAA-08: {section: "3.2 Versioned conformance artifact", kind: requirement, tracked_by: [F18.11, F18.12], statement: "The conformance suite is a versioned support artifact; a new pin is supported only by running the declared suite (plus pin-specific additions) and publishing the qualification identity; product-wide support claims are prohibited"}
  HAA-09: {section: "4.1 Gateway threat model and custody", kind: requirement, tracked_by: [F18.8], statement: "The gateway runs under its own principal, holds the provider credentials, exposes only a gateway-scoped interface, is the only network path from managed harnesses and workers to qualified providers, parses requests and responses for qualification and binding, writes verdict metadata and binding state, and is never workflow authority; provider credentials are absent from Lead and worker environments, model-readable files and shared harness login state; verdict storage keeps minimum metadata and never plaintext bodies for attestation"}
  HAA-10: {section: "4.2 Network enforcement", kind: requirement, tracked_by: [F18.8, F28], statement: "Provider egress is deny-by-default for managed Lead and worker execution; the harness and worker principal can reach only its gateway path, by an independently testable deployment mechanism; acceptance includes a negative direct-connection attempt as the actual principal"}
  HAA-11: {section: "4.3 Authoritative fact sources", kind: requirement, tracked_by: [F18.8], statement: "Effective facts name their source, preferring gateway observation, then adapter observation before submission, then independent provider metadata, then harness-reported configuration as telemetry; model self-report is never authoritative"}
  HAA-12: {section: "4.4 Normalized request-surface contract", kind: requirement, tracked_by: [F18.8, F18.11, F18.12], statement: "Each pin's support manifest defines a request-surface parser partitioning requests into an attested structural surface (tools and schemas, system and developer blocks, delegation declarations, support-critical injected skills, routing fields), explicitly named variable slots with per-pin normalization, and untrusted dynamic content that need not hash identically; dynamic material in a structural block is a precisely normalized slot or structural drift; each pin is qualified on representative long-running traffic for its false-drift rate, and a pin that cannot be normalized without weakening the boundary is unsupported"}
  HAA-13: {section: "4.5 Pre-egress enforcement", kind: requirement, tracked_by: [F18.8], statement: "Before forwarding, the gateway verifies the attachment and run, generation and session, qualified pin and content identity, provider and model profile, effort binding, normalized tool and structural surfaces and delegation exposure, and writes its verdict first; observation after context has reached an unapproved model is insufficient; existing-host attach is supported only through the same forced gateway path"}
  HAA-14: {section: "4.6 Forgery-resistant broker binding", kind: invariant, tracked_by: [F18.8], statement: "The model-controlled host never holds an authorization token: the gateway records server-side, per model-emitted AEW tool call, the generation, host and session, response identity, provider tool_call_id, canonical tool name, argument hash, single-use state and short expiry; the broker admits only an exact unexpired unused match and consumes it atomically, refusing missing, expired, reused, wrong-generation, wrong-tool or wrong-argument calls; a transport without a stable tool-call id qualifies a gateway-created equivalent the host cannot select or forge"}
  HAA-15: {section: "4.7 Drift and SUSPENDED behavior", kind: requirement, tracked_by: [F18.8, F18.5], statement: "On structural, model or profile drift the request is denied pre-egress where visible, no bindings are created from an unattested response, unbound broker calls are refused, the attachment enters SUSPENDED with a recorded reason, the generation is never silently resumed, and returning to ACTIVE needs a new generation and readiness; SUSPENDED refuses AEW reads and mutations"}
  HAA-16: {section: "4.8 Gateway availability policy", kind: requirement, tracked_by: [F18.8], statement: "Gateway failure fails closed: for the Lead, requests and bindings stop and the attachment becomes SUSPENDED or host-lost-equivalent; for workers, requests stop while invocation custody, hard deadlines and containment continue and the failure is raised; never a direct provider fallback; redundancy may come later only as one logical enforcement boundary"}
  HAA-17: {section: "5.1 Managed launch — default", kind: requirement, tracked_by: [F18.7, U6], statement: "Managed launch is the default and the reference guarantee: a private config and home where required, a curated environment, a qualified binary, a known model-visible surface, forced gateway routing with pre-egress enforcement and server-side binding, supervisor-owned control state and broker-only authority"}
  HAA-18: {section: "5.2 Existing-host attach — opt-in", kind: requirement, tracked_by: [F18.7, F18.10], statement: "Existing-host attach needs project policy to enable it and the operator to select a supervisor-registered host; it is labelled host_mode existing_host with context_isolation tainted_prior_context, while control-state isolation, forced gateway routing, request attestation and broker binding stay mandatory"}
  HAA-19: {section: "5.3 Conversation taint", kind: requirement, tracked_by: [F18.7], statement: "Taint attaches to the conversation identity and is a lower bound; same-project reattachment is allowed with readiness and a fresh generation; attaching a conversation tainted by another project is refused by default and an operator override is recorded as reduced isolation; a managed launch resuming a native conversation inherits its taint; the clean path is a new managed conversation"}
  HAA-20: {section: "5.4 Reattach delta", kind: requirement, tracked_by: [F18.7], statement: "Same-project reattachment gets an explicit canonical delta since the prior generation plus current state; agent-authored material in it is delimited data, never instructions; without an exact delta, full rehydration is marked delta_unavailable; mutations stay bound to expect_rev"}
  HAA-21: {section: "6. Explicit host selection", kind: invariant, tracked_by: [F18.7], statement: "No automatic local-process discovery creates an attachment; the operator chooses aew open --managed or --attach <registered-host-id>; only supervisor-registered hosts are selectable"}
  HAA-22: {section: "6.1 Security-principal ergonomics", kind: requirement, tracked_by: [F18.6, F18.14], statement: "B0 ships the reference ergonomic setup (service identities, operator identity, safe group membership, default ACLs, git ownership that leaves AEW state protected, TUI launch helpers, diagnostics) and aew open refuses a collapsed boundary; M4-H is not blocked on F18 and runs on the existing Lead-session mechanism under its existing guarantees, never relabelled as satisfying F18; it may optionally exercise available slices as labelled experimental observations; a later production-hosting run measures friction before rollout"}
  HAA-23: {section: "7.1 PREPARING has bootstrap-only capability", kind: requirement, tracked_by: [F18.7], statement: "Before readiness passes the attachment is PREPARING with a short-TTL bootstrap capability exposing only readiness facts (harness identity and hash, protocol, control-surface catalog, effective profile, request-surface probe, environment conformance), never project data or ordinary project actions"}
  HAA-24: {section: "7.2 Activation", kind: requirement, tracked_by: [F18.7], statement: "Only after every readiness check passes does one atomic step activate the attachment, make the generation current and enable the project surface"}
  HAA-25: {section: "7.3 PREPARING failure", kind: requirement, tracked_by: [F18.7], statement: "Preparation failure has a typed reason (readiness_failed, model_mismatch, surface_mismatch, unsupported_pin, bootstrap_timeout, host_lost) and revokes pending authority, closes endpoints, revokes credentials, removes temporary config, ends a managed process launched for it and unwinds existing-host changes where supported; cleanup failure is cleanup_failed attention and never activates authority"}
  HAA-26: {section: "8. Attachment state model", kind: requirement, tracked_by: [F18.5], statement: "Attachment states NO_ATTACHMENT, PREPARING, FAILED, ACTIVE, SUSPENDED and DETACHED with the transitions given (operator close, takeover and host loss to DETACHED; drift or control-surface loss to SUSPENDED; close, replace or requalify from SUSPENDED); DEGRADED is a guarantee property, not an authority state"}
  HAA-27: {section: "8.1 Reason codes", kind: requirement, tracked_by: [F18.5], statement: "Reason codes at minimum: operator_close, takeover, host_lost, readiness_failed, bootstrap_timeout, unsupported_pin, model_mismatch, surface_mismatch, control_surface_lost, custody_failure, cleanup_failed"}
  HAA-28: {section: "8.2 Host-loss detection", kind: requirement, tracked_by: [F18.7], statement: "Managed hosts use supervisor process ownership and harness health; an existing host needs a qualified liveness and identity mechanism, and without one existing-host attach is unsupported"}
  HAA-29: {section: "9. `aew open`", kind: requirement, tracked_by: [F18.10, F18.7], statement: "The operator-only open sequence: resolve state, select the host, resolve the Lead profile, verify artifact identity, enter PREPARING, establish supervisor-exclusive mutation, configure the harness, prove the effective model and surface by non-self-reported observation, prove broker readiness and custody, create the attachment and generation atomically, deliver state or delta, begin per-request attestation; no project authority before the atomic creation"}
  HAA-30: {section: "10. `aew close`", kind: requirement, tracked_by: [F18.9, F31], statement: "aew close is operator-only; it revokes authority, stales the generation, closes the broker, refuses all later AEW reads and mutations from that generation, records the reason and continuing children, and removes the AEW surface live where supported; it never implicitly terminates the harness or model, erases context, prohibits ordinary non-AEW work, cancels admitted children, releases a load-bearing lease because the Lead detached, or accepts child results; no AEW-mediated project access is not a filesystem sandbox, and control state stays supervisor-protected after detach"}
  HAA-31: {section: "11.1 Close acknowledgment", kind: requirement, tracked_by: [F18.9], statement: "Closing with active child runs lists them and requires the operator's acknowledgement (continue these admitted runs without an attached Lead), which does not broaden their authority"}
  HAA-32: {section: "11.2 Detached-run record", kind: requirement, tracked_by: [F18.9], statement: "Each continuing run is projection-visible as detached and keeps its identity, parent, custody scope, hard deadline, drain deadline and result or attention state"}
  HAA-33: {section: "11.3 Credentials and hard deadline", kind: requirement, tracked_by: [F18.9], statement: "The hard execution deadline governs process lifetime: the supervisor stops the process, revokes the credential with or after termination, records the outcome through interrupted reconciliation, releases no lease and manufactures no progress; credential TTL covers exactly the approved window; a drain deadline is a stop condition: the drain has failed, the verifier stops, the integration custodian is cancelled, the lease is marked for reconciliation through aew integrate reconcile, and operator attention is raised; an orphan or attention deadline is distinct and may notify without cancelling"}
  HAA-34: {section: "11.4 Attention and notifier", kind: requirement, tracked_by: [F18.9], statement: "A detached child that completes, blocks on a decision, reaches an orphan or drain deadline, or hits an infrastructure or custody fault raises operator attention; unattended deployments need the out-of-band notifier; an orphan or attention timeout raises attention without cancelling or releasing a lease, while the drain deadline stops the drain, cancels the custodian and goes through reconciliation"}
  HAA-35: {section: "11.5 Permission behavior", kind: requirement, tracked_by: [F18.9], statement: "Worker runs never rely on an interactive Lead approval prompt, and harness ask or auto-review authority stays disallowed; a decision-required condition with no Lead attached is recorded and held"}
  HAA-36: {section: "12. Child completion after generation change", kind: requirement, tracked_by: [F18.9, F31], statement: "Loss of the Lead attachment is not loss of an admitted child's custody; a child admitted under generation N may finish under N+1 and create only the records its contract permits; acceptance, classification, Ticket transitions and integration or publication decisions use current authority; acceptance test: the child's records commit but the control revision does not advance until a current-authority action consumes them"}
  HAA-37: {section: "13. Drain stop conditions", kind: requirement, tracked_by: [F18.9], statement: "A drain stops on an existing supervisor stop condition, abnormal exit, the hard deadline or step limit, containment failure, supervisor failure, custody, lease or integrity failure, the drain hard deadline, operator stop now or release to manual, failure to durably record or verify state, or an unclassified fault; a new generation, a stale generation, a revision change, a legitimate negative result or one needing classification is not a drain failure and is held; a timeout never releases a lease; an orphan or attention timer is never named or treated as the drain deadline"}
  HAA-38: {section: "14. StageIntent ownership across generations", kind: requirement, tracked_by: [F18.9], statement: "A StageIntent owned by a stale generation becomes non-runnable; a new generation continues only after rechecking the revision, legality digest, authority and gates, re-resolving the stage contract, and explicitly rebinding or creating a fresh StageIntent; no old intent inherits new authority"}
  HAA-39: {section: "15. Lead versus worker hosting", kind: requirement, tracked_by: [F18.9, F13], statement: "Lead and worker hosting differ in lifetime, model, authority, host and delegation; on Lead close the Lead loses AEW authority while admitted workers continue unless separately cancelled; native delegation stays unavailable unless a qualified adapter preserves invocation identity, role, parent, profile, bounded capability, custody, limits, evidence and provenance, and model-visible conformance"}
  HAA-40: {section: "16. Executable identity and support-critical artifacts", kind: requirement, tracked_by: [F18.5, F18.11, F18.12], statement: "The supervisor verifies the content hash immediately before exec, runs from a protected immutable path, refuses if the executable or a companion changes identity between qualification and launch, and records the identity in provenance; each pin's manifest enumerates its support-critical companions (adapter build, executable, config templates, MCP server, bundled skills, probe fixture, conformance suite, protocol fixture)"}
  HAA-41: {section: "17.1 OpenCode", kind: requirement, tracked_by: [F18.11], statement: "OpenCode 2.0.18 stays the qualified research baseline from T9 (direct typed tools with codemode:false, measured request-level schema filtering); support still needs the broker-only readiness and config and ambient-surface conformance"}
  HAA-42: {section: "17.2 Codex", kind: requirement, tracked_by: [F18.12], statement: "Codex CLI 0.160.0 is not support-ready; a supported Codex pin proves direct typed actions or an accepted equivalent, request-level model identity and surface attestation, suppression of ungranted collaboration and of unapproved ambient skills, private config and curated environment, broker-only custody, supervisor-owned state with no model-controlled mutation, and continuing drift detection; a bounded qualification spike, not a redesign"}
  HAA-43: {section: "18. Storage and ADR-0011", kind: requirement, tracked_by: [F18.5], statement: "Only the current attachment and generation stay in hot state; earlier generations and attempts are immutable ADR-0011 cold history for provenance, stale-writer diagnosis, takeover investigation and conformance audit, never mutable authorities"}
  HAA-44: {section: "19. Dashboard projection", kind: requirement, tracked_by: [F18.5, F20], statement: "The read-only dashboard may render engine-supplied attachment facts (state, generation, reasons, requested and observed profile with fact source, host mode, isolation and output guarantee, pin identity, detached child count, gateway status, attention) and never infers authority or trust from model names, process presence or timestamps"}
  HAA-45: {section: "20.1 Authority", kind: evaluation, tracked_by: [F18.6, F18.5], statement: "Acceptance: the real Rocky 8 negative test as the Lead-host identity cannot mutate the protected set; lifecycle commands accepted only from the operator principal; a surviving transport key is never Lead authority; stale or SUSPENDED generations cannot read or mutate through AEW; direct filesystem access does not bypass control-state authority; unsupported same-UID models are rejected or documented"}
  HAA-46: {section: "20.2 Bootstrap", kind: evaluation, tracked_by: [F18.7], statement: "Acceptance: PREPARING has no project data and only readiness capability; bootstrap authority expires; failed preparation cleans endpoints, credentials and config; cleanup failure never activates authority; host selection is explicit and registered"}
  HAA-47: {section: "20.3 Gateway and continuous qualification", kind: evaluation, tracked_by: [F18.8], statement: "Acceptance: the gateway's own principal is the only provider-credential holder; the harness principal cannot reach providers directly; every managed request is forced through the gateway; existing-host mode needs the same proven path; model identity is observed independently; deny-by-default pre-egress checks; structural parsing separates variable slots from untrusted content; each pin passes false-drift testing; broker calls need a single-use gateway-owned binding and replays, altered arguments, wrong generations and missing bindings are refused; verdict storage holds metadata only; outage stops requests with no fallback; drift suspends; SUSPENDED refuses reads and mutations; ACTIVE again needs a new generation; suite and manifest identities are recorded"}
  HAA-48: {section: "20.4 Existing-host mode", kind: evaluation, tracked_by: [F18.7, F18.10], statement: "Acceptance: project policy opts in; the operator selects the registered host; taint is recorded; cross-project reuse is refused by default; same-project reattach gets state and delta; the isolation guarantee shows lower than managed launch; control-state isolation and request attestation stay mandatory"}
  HAA-49: {section: "20.5 Lifecycle", kind: evaluation, tracked_by: [F18.9], statement: "Acceptance: close revokes authority without killing the harness; close with active children lists them and needs acknowledgement; children keep bounded independent custody; detached completions, blocks and deadlines raise attention; host loss revokes authority; takeover stales the prior generation at once; old StageIntents need revalidation"}
  HAA-50: {section: "20.6 Model/profile", kind: evaluation, tracked_by: [F18.13, F32], statement: "Acceptance: reference Astra and Laguna behaviour is measured; requested and observed model, provider and effort are attributable; GPT-5.4 and open-source overrides stay explicit; a profile mismatch fails closed"}
  HAA-51: {section: "20.7 Development guarantee and operator ergonomics", kind: evaluation, tracked_by: [F18.5, F18.14], statement: "Acceptance: development attachments and their admission-relevant outputs carry guarantee: dev and never silently enter production admission; aew open refuses a collapsed principal; the reference Rocky 8 setup is exercised in dogfood; the later production-hosting run records friction and workarounds, with M4-H contributing optional early observations if slices are available"}
  HAA-52: {section: "21. Implementation slices", kind: sequencing, tracked_by: [F18.5, F18.6, F18.7, F18.8, F18.9, F18.10, F18.11, F18.12, F18.13, F18.14], statement: "Ten slices, each with its exit criterion: A contract and state; B0 the principal proof and ergonomics (the first hard gate); B1 bootstrap; C the gateway and broker binding; D detached children; E production enablement; F OpenCode and G Codex qualification; H the reference topology smoke; I the ergonomics observation. Until E exits, only labelled development attachments on disposable projects; their admission-relevant outputs carry guarantee: dev and are admitted to production Evidence or Knowledge only after re-establishment on an accepted production path or under an explicitly adopted admission rule that proves equivalent assurance"}
  HAA-53: {section: "22. Deferred / downstream", kind: sequencing, tracked_by: [F18, F18.3, F13, Q14], statement: "Deferred: F18.3 signing and release_epoch after ADR-0014; native delegation optimization after proven equivalence; native sandbox enhancement; hooks, harness memories, native planning and approval systems (never baseline authority); gateway high availability as one logical boundary; persistent Lead filesystem sandboxing (a separate containment decision); Q14's remote integration target"}
  HAA-54: {section: "23. Adoption", kind: decision, tracked_by: [F18], statement: "Adopted as v0.5 and named v0.6 after a hygiene-only correction (the version words in sections 0 and 23 corrected with the operator's approval), alongside the install and bootstrap design; v0.6 corrects three stale passages with no change to authority, lifecycle, milestone or drain semantics; Q12 stays closed; T9 stays implementation evidence; pin qualification is an implementation gate; the gateway and broker binding are part of the production authority boundary; an implementation that cannot meet principal separation, forced gateway routing, protected-set isolation or broker binding identifies itself as unsupported or development-only"}
  HAA-55: {section: "24.1 Filing relationship", kind: process, tracked_by: [F18], statement: "This design sits alongside the install and bootstrap design: the register keeps the aew init and aew doctor references and adds the hosting slices as child rows under F18; no earlier install or bootstrap requirement is discarded"}
  HAA-56: {section: "24.2 M4-H sequencing", kind: sequencing, tracked_by: [F18, F18.14], statement: "Adoption does not move F18-A to F18-E before M4-H; M4-H may run on the existing Lead-session mechanism under its pre-F18 guarantees and is not evidence for the F18 contract; production attachment stays gated by the slices, and a dedicated production-hosting run exercises the principal, gateway and ergonomics path"}
  HAA-57: {section: "24.3 Drain deadline semantics", kind: decision, tracked_by: [F18.9, F31], statement: "A drain deadline is a failure and stop condition: it stops the draining work, cancels the integration custodian, marks the attempt for reconciliation and raises attention; an orphan or attention deadline may notify without cancelling, under a distinct name and typed reason"}
  HRC-01: {section: "1. F18.2: a narrow amendment of install and bootstrap v0.3", kind: decision, tracked_by: [F18.2, F18.6, F18.7], statement: "Install and bootstrap v0.3 is narrowly amended, not replaced. Its absolute rule that AEW has no background service is superseded: AEW requires no always-on harness or model daemon, but a production attachment may require attachment-scoped or socket-activated supervisor-side services for the lifetime of the authority and custody they own (the v0.6 control boundary and provider gateway while an attachment is ACTIVE or PREPARING, and possibly while detached children still need custody), never required to run after all attachment and child custody ends; F18-B0/B1 choose the Rocky 8 mechanism"}
  HRC-02: {section: "1. F18.2: a narrow amendment of install and bootstrap v0.3", kind: decision, tracked_by: [F18.2, F18.5], statement: "The operator terminal is not the Lead session: the terminal is the operator control surface (operator-only lifecycle control into the supervisor and attachment authority), the harness and model session is the Lead execution host; their lifetimes may be related but they are not the same authority object"}
  HRC-03: {section: "1. F18.2: a narrow amendment of install and bootstrap v0.3", kind: requirement, tracked_by: [F18.2], statement: "aew doctor validates an ownership and permission matrix, not one universal owner: supervisor-authoritative protected state has the configured protected ownership or ACL; the Lead-host identity cannot write the protected set; the operator can perform the lifecycle operations it is authorized for; ordinary project and source access the harness needs still works; a project-visible derived or read-only AEW projection cannot be mistaken for or modify canonical state"}
  HRC-04: {section: "1. F18.2: a narrow amendment of install and bootstrap v0.3", kind: requirement, tracked_by: [F18.2], statement: "The .aew/ root needs no universal ownership rule (a deployment may keep operator-owned project-facing material and protect authority-bearing subpaths separately, or use another qualified layout); a .aew/ owned by another UID is not inherently an error; the error is an effective ownership, ACL or principal arrangement that does not satisfy the configured AEW authority boundary"}
  HRC-05: {section: "1. F18.2: a narrow amendment of install and bootstrap v0.3", kind: requirement, tracked_by: [F18.2, F18.6], statement: "aew doctor runs the F18-B0 negative checks, or their bounded equivalent, against the actual Lead-host identity"}
  HRC-06: {section: "2. F18.8: one AEW Provider Gateway", kind: decision, tracked_by: [F18.8, F28], statement: "One logical component, the AEW Provider Gateway: F28's fixed-upstream credentialing relay and F18's request gateway and attestor are two responsibilities of one provider-traffic authority boundary; the composed path runs from the model-controlled harness through a secretless local endpoint and the F28 namespace or AF_UNIX shim to the gateway, which identifies the attachment or run and qualified pin, normalizes and attests the request surface, denies before egress on mismatch, selects the fixed configured upstream, attaches the real provider credential, originates upstream TLS or mTLS, observes the response and creates single-use tool-call and argument bindings"}
  HRC-07: {section: "2. F18.8: one AEW Provider Gateway", kind: invariant, tracked_by: [F18.8, F28, F18.4], statement: "The provider credential has one custody owner, the AEW Provider Gateway: it stays outside the model-controlled harness and is applied only on the fixed provider upstream; F18 adds pre-egress model, profile and request-surface enforcement, request attestation, response observation and server-side single-use broker binding, but no second credential store or credentialing proxy"}
  HRC-08: {section: "2. F18.8: one AEW Provider Gateway", kind: invariant, tracked_by: [F28], statement: "Generic allowlisted egress stays a separate, credentialless path to explicit allowlisted non-provider destinations; it never receives provider credentials and cannot widen or select the Provider Gateway's fixed upstream"}
  HRC-09: {section: "2. F18.8: one AEW Provider Gateway", kind: requirement, tracked_by: [F18.8], statement: "The gateway may be split internally (request parsing and attestation, fixed-upstream relay and TLS, response and tool-call binding), but normatively there is one logical provider path, only that boundary may access provider credentials, the model-controlled host cannot bypass it, the generic-egress path cannot access the credential store, and a split must not open a TOCTOU gap between the request attested and the request credentialed and forwarded; prefer a single composed service unless measurement or platform constraints justify a split"}
  HRC-10: {section: "2. F18.8: one AEW Provider Gateway", kind: decision, tracked_by: [F18.8, F28], statement: "Filing: F28's provider credential relay is not deleted and its containment and network semantics keep governing; F18.8 extends and composes that relay into the Provider Gateway. F28 owns the network-containment and fixed-upstream credential-routing requirements, F18 the attachment-aware request attestation and broker binding; one Provider Gateway implements both contracts"}
  CRD-01: {section: "3. Proposal", kind: invariant, tracked_by: [E42, E43, E44], statement: "None of the redesign's changes weakens an assertion, drops a test, or removes a process boundary from a test whose property is that boundary; the designer's four v0.2 corrections hold (full merge-group assurance preferred, with an always-full main run as the compensating control; snapshot-safe states, immutable templates, one equivalence oracle and driver isolation; cost accounted now with no hard wall-clock failure until variance is measured; duration history affects placement only)"}
  CRD-02: {section: "P1. A gate tiered by what changed, decided fail-closed", kind: requirement, tracked_by: [E40], status: "done: PR #99 (tools/ci/tier.py; testing-and-ci-strategy.md §3)", statement: "The changes job classifies the pull request's diff against its merge base into the docs, web or full tier, failing closed to full (anything else, or a diff that cannot be computed); assurance recomputes the tier from the same diff and requires exactly that tier's lanes, so a docs PR whose diff touches src/ fails the gate"}
  CRD-03: {section: "P1. A gate tiered by what changed, decided fail-closed", kind: decision, tracked_by: [E40, E47], statement: "Reduced PR tiers are backed by an always-full main push run (no merge queue on a personal-account repository; an explicit, accepted reduction in pre-merge assurance for the docs and web tiers); a red full run on main after a reduced-tier merge is a tier-classification defect, fixed in the classifier with a pinning test; code PRs always run full; the merge_group trigger stays and assurance refuses any tier but full on it, so an organization's merge group replaces the control with no CI change"}
  CRD-04: {section: "P2. Lazy CLI imports", kind: requirement, tracked_by: [E41], statement: "Each command group's module is imported when its command runs, not when aew starts; a unit test pins that the common Lead commands (aew status among them) do not import aew.dashboard or other unrelated heavyweight modules; 200 ms of imports is a measured objective, never a CI assertion; no test changes"}
  CRD-05: {section: "P3. Shared setup, with the boundary kept for the step under test", kind: process, tracked_by: [E42], status: "done: testing-and-ci-strategy.md §6 amended (2026-10-06)", statement: "The strategy rule becomes: a test keeps a real process boundary for the steps whose property is that boundary (the step under test, crash and fault injection, credentials and terminals, harness custody, acceptance scenarios); setup that only brings a project to a starting state may use the in-process driver"}
  CRD-06: {section: "P3. Shared setup, with the boundary kept for the step under test", kind: requirement, tracked_by: [E42], statement: "An in-process setup driver runs the CLI's main() with the same argument parsing, output and exit codes; the default stays subprocess and setup helpers opt in; each invocation is observationally isolated from the next except through the project state it intentionally modified; the existing guards that fail a test leaking AEW_* variables or a changed working directory apply to every invocation, and the driver saves and restores the working directory and environment, standard streams, logging handlers, parser and module-global state, thread locals and context variables, and clears or keys by project root every cache not intentionally project-scoped, and its own tests prove it"}
  CRD-07: {section: "P3. Shared setup, with the boundary kept for the step under test", kind: requirement, tracked_by: [E42], statement: "Starting states are snapshotted only from explicitly classified quiescent and relocatable states (no active lease, run or invocation, live credential, supervisor or process identity, transient lock, wake-file state, un-rebindable absolute workspace identity, or meaningful time-dependent state); each snapshot kind is declared and checked, and the checker refuses an ineligible state; the template is built once per worker, is immutable and no test works in it"}
  CRD-08: {section: "P3. Shared setup, with the boundary kept for the step under test", kind: requirement, tracked_by: [E42], statement: "A snapshot copy is a real, independent repository: worktrees re-registered (git worktree repair) and absolute paths rebound, with a test proving it shares no git objects, worktrees or .aew state with its template; copies are used only where the project is input, never where building the repository is the property under test"}
  CRD-09: {section: "P3. Shared setup, with the boundary kept for the step under test", kind: requirement, tracked_by: [E42], statement: "Before a helper switches to the driver or a snapshot, a test builds the same starting state both ways and compares them with one shared semantic-equivalence oracle, which normalizes only a fixed reviewed list of ephemeral fields (generated ids, timestamps, absolute paths, process ids) and requires equality for control and workflow state, evidence contents, git refs and objects, and their provenance; adding a field to that list is a reviewed change to the oracle, never a per-helper exception"}
  CRD-10: {section: "P4. Cost as part of assurance", kind: requirement, tracked_by: [E43], statement: "assurance writes a per-run cost record as a job summary and an artifact: queue delay and end-to-end wall clock, runner-minutes, wall time per lane and shard, total pytest time, the slowest 20 tests, CLI calls per test, and the share of collected tests present in durations.json"}
  CRD-11: {section: "P4. Cost as part of assurance", kind: decision, tracked_by: [E43, E47, E51], statement: "The job timeout stays the only hard safety bound and runner speed never fails a correct change; wall-clock health is reported, not gated: a shard over 20 minutes warns, over 25 is an explicit CI-health violation, and repeated violations on main open or update a CI-health issue; whether wall-clock becomes a hard gate is decided after P2 and P3, once runner variance is measured"}
  CRD-12: {section: "P4. Cost as part of assurance", kind: requirement, tracked_by: [E45], statement: "Any performance gate is on metrics AEW controls (aggregate pytest duration, CLI subprocess starts, expensive fixture constructions, the slow-test aggregate, estimated cost per test family), only once baselines exist, judging a PR's increase against a baseline with its variance"}
  CRD-13: {section: "P4. Cost as part of assurance", kind: requirement, tracked_by: [E44], statement: "Duration history influences shard placement, never eligibility: a non-authoritative balancing cache a green main run may update and any run may use; exactly-once assurance proves membership independently of it; a missing, stale or corrupt cache falls back to balancing by test count, never to a failure or an omitted test; the committed tests/durations.json stays the fallback, refreshed by an automated PR when drift passes a threshold"}
  CRD-14: {section: "4. Order and expected outcome", kind: process, tracked_by: [E46, E23], statement: "Meanwhile: the nightly reporting fix (#92) lands as a bug fix, the nightly shard split (#70) merges, Windows coverage (#69) waits for P5.2, and the store crash slowdown (1 to 7 minutes before the outbox, over 60 after) is investigated as a performance regression, not given a bigger budget"}
  CRD-15: {section: "5. Decisions (designer and operator, 2026-10-06)", kind: decision, tracked_by: [E40, E41, E42, E43], statement: "P1 adopted (with the always-full main run as the compensating control, replaced by merge-group assurance if the repository moves to an organization); P2 adopted and built first; the P3 strategy amendment adopted with the snapshot-eligibility, immutable-template, semantic-equivalence and driver-isolation constraints; P4's measurement adopted now, the hard wall-clock gate deferred until runner variance is measured"}
  CRD-16: {section: "5. Decisions (designer and operator, 2026-10-06)", kind: decision, tracked_by: [E48], statement: "P5.1 (full lanes on one OS per pull request) deferred for this phase, revisited only with post-redesign measurements if CI is still too expensive"}
  CRD-17: {section: "5. Decisions (designer and operator, 2026-10-06)", kind: decision, tracked_by: [E23], statement: "P5.2 (Windows coverage in the nightly) adopted temporarily, as a placement decision for current performance, not the architecture; revisited after P2 and P3"}
  CRD-18: {section: "5. Decisions (designer and operator, 2026-10-06)", kind: decision, tracked_by: [E49], statement: "P5.3 (larger runners) deferred until P2 and P3 have been measured"}
  CRD-19: {section: "5. Decisions (designer and operator, 2026-10-06)", kind: sequencing, tracked_by: [E40, E41, E42, E43, E44, E23, E48, E49], statement: "The sequence: #92; P2; P1 with the always-full main run; P4 without a wall-time failure; refresh and rebalance from the new data; P3, the driver and the snapshot framework, then the expensive families one at a time; P5.2; measure the resulting system; only then consider larger runners or any reduction in cross-platform PR coverage"}
  CCI-01: {section: "5. Recommendations (register rows)", kind: requirement, tracked_by: [E43], statement: "Build P4 first: assurance writes the per-run cost record from the lane reports it already downloads (wall time per lane and shard against the strategy's budgets, the slowest 20 tests, each test's share of its lane) as a job summary and an artifact, and each lane prints --durations=20"}
  CCI-02: {section: "5. Recommendations (register rows)", kind: requirement, tracked_by: [E45], statement: "A per-test cost check: a test over a set share of its lane's time (for example 25%), or a fast-lane test over a set number of seconds, is a CI-health violation that warns and never fails the gate (operator, 2026-10-06)"}
  CCI-03: {section: "5. Recommendations (register rows)", kind: requirement, tracked_by: [E44, E46], statement: "Refresh and rebalance the shards from the record, and sweep the current fast-lane outliers (a 33.5 s randomized crash test, several 5 to 7 s surface-runner tests)"}
  CCI-04: {section: "5. Recommendations (register rows)", kind: process, tracked_by: [E47], statement: "Every failed main run is triaged by cause: a job that timed out on main raises attention, as #92 made the nightly do; a superseded run does not"}
  CCI-05: {section: "5. Recommendations (register rows)", kind: requirement, tracked_by: [E42], statement: "Shared setup (P3) is what stops the integration lanes' growth"}
  CCI-06: {section: "5. Recommendations (register rows)", kind: process, tracked_by: [E43], statement: "Cost in review: with the record built, a PR's summary shows its new tests' cost and the reviewer brief asks about it; the brief is the lead developer's to change, AGENTS.md the operator's"}
  VGX-01: {section: "1. Decision", kind: decision, tracked_by: [F19], statement: "M4-H is a real product-value gate, not a small demonstration: does AEW materially improve correctly accepted engineering outcomes over a competent native coding-agent workflow with model, environment, task material, effort and authority envelope held substantially constant; the B+ design (a confirmatory Raw versus AEW comparison, a targeted disciplined-raw R+ subset, parallel isolated runners, objective outcome scoring as the primary measure, U3 premises as a controlled contrast family); the experiment is never reduced to shorten wall-clock time"}
  VGX-02: {section: "2.1 R — native/raw baseline", kind: requirement, tracked_by: [F19], statement: "R is native OpenCode at the pinned version with the same model, profile and effort as A, keeping a competent user's native capabilities (subagents, todo and task facilities, exploration, editing and testing, commits, the same single continuation, the same authority envelope); R is never crippled into a minimal loop"}
  VGX-03: {section: "2.2 A — AEW", kind: requirement, tracked_by: [F19, F15.5], statement: "A is AEW at one frozen M4 commit for the whole counted batch, with the shipped default policy unless the preregistration pins another value, the same model, profile, effort, environment and caps as R, PUBLISH_IF_CLEAN or equivalent unattended authority granted in advance where the steering policy needs it, and no ad-hoc operator nudges once a counted run begins"}
  VGX-04: {section: "2.3 R+ — disciplined raw subset", kind: requirement, tracked_by: [F19], statement: "R+ is R plus one short fixed engineering-discipline prompt and one fresh-context native self-review pass before completion, testing whether an AEW advantage is explained by instructions, review or inference spend rather than workflow machinery; it is not a full arm and is counted only on F1 to F3"}
  VGX-05: {section: "2.4 Common task-input and unattended-operator contract", kind: requirement, tracked_by: [F19], statement: "R, A and R+ receive byte-identical task text with a sealed content hash: R and R+ as the initial harness task, A as the Lead's first prompt after the AEW attachment is active, any later decomposition, planning, Ticket creation, context packaging or rewriting being AEW treatment attributable to the task-input hash; no arm gets hidden clarifications, hints, evaluator feedback or nudges; the operator is absent during counted execution and every operator-touching behaviour is classified in advance"}
  VGX-06: {section: "2.4.1 Pre-granted", kind: requirement, tracked_by: [F19, F15.5], statement: "The sealed run manifest may pre-grant only authority the governing contract allows in advance with bounds fixed before execution: PUBLISH_IF_CLEAN or the selected unattended steering authority, the sealed execution, tool, network and filesystem envelope, the sealed USD, wall-time and quota caps, and any mechanically bounded class ceiling or confirmation the contract allows pre-authorized; the scripted responder invents no grants"}
  VGX-07: {section: "2.4.2 Scripted deny", kind: requirement, tracked_by: [F19], statement: "The responder denies, with fixed text, scope or goal expansion, credentials, network, host powers or protected paths outside the envelope, destructive or exceptional authority not pre-granted, a larger budget, and any waiver of a failed review, verification, guardrail or policy requirement"}
  VGX-08: {section: "2.4.3 Operator-only semantic decisions", kind: requirement, tracked_by: [F19], statement: "An operator-only decision needing task-specific judgment (changing the objective or acceptance, waiving adverse evidence, a policy exception, a Ticket-revision checkpoint, a consequential stakeholder choice, any escalation needing human judgment) is never simulated; if AEW cannot proceed without one the counted run ends as an A failure in unattended mode, a product-mode result, not an invalid environment"}
  VGX-09: {section: "2.4.4 Clarification requests", kind: requirement, tracked_by: [F19], statement: "An ordinary clarification request gets exactly the fixed reply that no additional task information is available and to proceed on the safest reasonable assumption consistent with the stated objective"}
  VGX-10: {section: "2.4.5 Premature-stop predicate and continuation", kind: requirement, tracked_by: [F19], statement: "One continuation is triggered by the outcome-blind NONFINAL_QUIESCENCE predicate (control returned, no active invocation, no pending experiment operation or responder delivery, no native final-completion signal, and unfinished native control state: for R and R+ no final report, for A a non-terminal workflow with no running invocation) with a fixed message; a second quiescence ends the run as an arm failure unless the deliverable passes the full hidden acceptance; refusal, a governed terminal failure or cap exhaustion ends the run without nudges; all such events are recorded as secondary outcomes in both arms"}
  VGX-11: {section: "F1 — Cross-cutting defect with a plausible local fix", kind: evaluation, tracked_by: [F19], statement: "Family F1: a visible local repair looks sufficient but hidden behavioural or preservation requirements need broader investigation and verification (investigation, avoiding the first plausible fix, cross-component reasoning, verification against a matrix)"}
  VGX-12: {section: "F2 — Cascading version/configuration change", kind: evaluation, tracked_by: [F19], statement: "Family F2: a bounded-looking version or configuration update reveals further constraints as work proceeds (sequential discovery, persistence through failed approaches, retaining discovered facts, verifying beyond the first working configuration)"}
  VGX-13: {section: "F3 — End-to-end integration with a false-green intermediate", kind: evaluation, tracked_by: [F19], statement: "Family F3: an intermediate health, build or smoke signal passes while integrated behaviour is wrong (end-to-end verification, distinguishing proxy success from acceptance, investigating upstream and downstream, preventing silent false success)"}
  VGX-14: {section: "F4 — Premise contrast / U3 family", kind: evaluation, tracked_by: [F19, U3], statement: "Family F4, a matched premise contrast: a true decision-relevant premise and a false or misleading one contradicted by the environment, stating an observation not a solution; scored on the delivered outcome, never on whether an arm challenged, trusted or discussed the premise; an optional no-change or irrelevant-premise control may run uncounted"}
  VGX-15: {section: "3.1 Counted task count and analysis scope", kind: evaluation, tracked_by: [F19], statement: "Six fixed F1 to F3 cells (two each), 12 independent counted runs per primary arm per cell (144 primary R versus A runs), 5 R+ runs per cell (30 descriptive runs, never an equivalence or architecture-removal claim), F4 as 2 matched cells x 5 runs x 2 arms (20 runs) reported separately and never pooled: 194 counted runs; the inference covers only the six sealed cells and the frozen cold-start single-model treatment bundle; the randomization schedule is sealed in the preregistration"}
  VGX-16: {section: "4. Repository scope", kind: requirement, tracked_by: [F19], statement: "The counted corpus is never one SPT- or Docker-heavy repository alone: it includes SPT-style work where appropriate and at least one second repository with a substantially different profile, preferably Python-heavy with a real test suite and low build noise, chosen before sealing; every counted task is forward and private, its solution unavailable to the arms"}
  VGX-17: {section: "5. Model topology and cold-start scope", kind: requirement, tracked_by: [F19, F32], statement: "The primary comparison uses one pinned model, profile and effort across roles and arms, not the reference Astra-Lead-plus-Laguna topology (a later experiment); it is cold-start: before task release the evaluator records an attestation, with the run ID, treatment-bundle hash and repository/base hash, proving the AEW arm has no task- or repository-specific prior state in canonical project and control state, cold history and archive state, persisted context packs, prior run or session context or any other implemented recall surface (future knowledge-store facilities are not assumed), R and R+ starting without prior session memory; derived context such as maps may be generated from the released repository; a missing or failed attestation prevents the run; the model and fallback or stop rule are preregistered"}
  VGX-18: {section: "6.1 Primary outcome", kind: evaluation, tracked_by: [F19], statement: "The primary outcome is a binary correctly accepted engineering result per run: hidden behavioural acceptance, hidden preservation and regression checks, an acceptable blinded mergeability disposition under the preregistered rubric, and no preregistered critical failure; internal workflow completion, artifact or reviewer counts or recorded evidence never improve the score"}
  VGX-19: {section: "6.2 Safety outcome", kind: evaluation, tracked_by: [F19], statement: "Critical failures are reported separately and never averaged away by higher success; the preregistration defines the critical-failure taxonomy for the corpus"}
  VGX-20: {section: "6.3 Secondary outcomes", kind: evaluation, tracked_by: [F19, F25], statement: "Secondary measures: silent false success, a graded hidden-acceptance score, provider-reported and derived cost, tokens, wall time, provider queue and throttle time apart from active time, first-pass correctness, regressions, unnecessary churn, operator questions and interventions, and cost or time per correctly accepted result estimated as total cost over total successes with a cell-stratified bootstrap, undefined when an arm has no successes and never repaired with pseudocounts"}
  VGX-21: {section: "6.4 Diagnostic/process measures", kind: evaluation, tracked_by: [F19, F15.2, F4], statement: "Diagnostic measures (rework, abandoned approaches, review and verification catches, raw self-corrections, workflow refusals, premise testing, recovery events, failure fingerprints, parallelism used, revision friction, F15.2 stage-efficiency metrics) explain results and never contribute to the primary score"}
  VGX-22: {section: "7. Calibration and pre-calibration sealing", kind: process, tracked_by: [F19], statement: "Calibration uses sibling tasks permanently excluded from the confirmatory pool; before any sibling run the M4 commit, model and harness pins, decision margins and rule, critical-failure taxonomy, review rubric, R+ prompt, difficulty knobs and their selection rule, and the operator contract are frozen; per family the raw arm runs first as a coarse 25 to 75 percent floor and ceiling screen (preferably 40 to 60), only predeclared knobs move, at least one full AEW unattended preflight runs on a sibling, a plumbing defect is repaired and the treatment bundle re-frozen with affected calibration discarded and re-run, and identities, hashes, knobs, caps, schedule and evaluator bundle are sealed before counted runs; calibration outcomes never feed AEW development"}
  VGX-23: {section: "8. Held-out corpus and evaluator isolation", kind: invariant, tracked_by: [F19], statement: "F19's held-out-corpus rule governs M4-H: before release no model-controlled process in any arm has a direct or transitive readable path to unreleased material; the evaluator keeps the corpus, references, hidden checks and scoring material; one task is released to an arm runner at its declared start; scoring is evaluator-side; failing to establish isolation is an invalid experiment condition, not an arm failure"}
  VGX-24: {section: "8.1 Outcome-blind invalid-run classification", kind: requirement, tracked_by: [F19], statement: "ENVIRONMENT_INVALID is assigned only by a preregistered outcome-blind predicate on infrastructure telemetry (provider outages independent of the arm, evaluator or host crash, release or isolation breach, loss of an experiment-owned service, infrastructure failure before a deliverable); AEW orchestration failures, harness failures in normal operation, an arm exhausting its own quota, an arm corrupting its environment and timeouts from its own work pattern are arm failures; the classifier never sees correctness; invalid runs stay in the ledger with reasons and replacement links, invalid rates are reported per arm, and a materially asymmetric rate is a validity warning to discuss"}
  VGX-25: {section: "9.1 Parallel execution and quota isolation", kind: requirement, tracked_by: [F19], statement: "M4-H optimizes calendar time, not sample count: counted cells may run concurrently on isolated arm hosts, never competing for one uncontrolled provider quota (separate matched credentials or quotas per arm, or scheduler-reserved capacity); each arm's capacity is at least its maximum valid calibration peak plus 50 percent headroom within account limits, recorded before counted execution; throttling, queue wait and retries are logged per run and arm; an arm exhausting a correctly provisioned quota is its own outcome, a broken partition is handled as invalid; the runner pool is sized from calibration, not fixed by Q7"}
  VGX-26: {section: "9.2 Reproducible runner state", kind: requirement, tracked_by: [F19, F25], statement: "Each counted run gets a clean reproducible environment with the same pinned tools and harness, the same model-controlled powers, identical absolute USD and wall-time caps across R, A and R+ per cell, pre-seeded caches, no prior session context or writable artifacts, and a stable run identity; a cap hit ends the run as an arm failure unless the deliverable already satisfies the full hidden acceptance and mergeability; expensive common dependencies may be pre-seeded read-only"}
  VGX-27: {section: "9.3 No outcome-based early stopping", kind: process, tracked_by: [F19], statement: "Once sealed, the confirmatory matrix is never stopped or expanded on interim outcomes; invalid-environment retries follow the preregistered rules with linked provenance"}
  VGX-28: {section: "10. R+ scope", kind: evaluation, tracked_by: [F19], statement: "R+ runs only on the six F1 to F3 cells (30 runs) as a descriptive causal control, not a powered branch; F4 is excluded; an ambiguous F4 result may motivate a later R+ F4 follow-up, never added to the sealed batch"}
  VGX-29: {section: "10.1 Arm-blind export, mergeability review and blinding check", kind: requirement, tracked_by: [F19], statement: "Mergeability reviewers never see the live workspace: the evaluator exports a normalized artifact (a squashed content diff against the sealed base, only deliverable files, AEW and harness metadata removed, branch names, commit ids and messages, timestamps and workflow path noise normalized, stable ordering and encoding) while retaining the full run record for scoring and audit"}
  VGX-30: {section: "Binding reviewer structure", kind: requirement, tracked_by: [F19], statement: "Every deliverable gets two independent blinded reviews, preferably fresh sessions from model families other than the tested model, by no author of the task, treatment, R+ prompt, oracle, reference or prior review; an independent human may replace one when two eligible families are unavailable; dispositions ACCEPT, ACCEPT_MINOR or REJECT; two accepting pass, two rejecting fail, a split goes to a third independent adjudicator whose majority binds; identities or family pins are frozen before counting; each reviewer forces an arm guess, reported as a blinding diagnostic; the tested family should not review"}
  VGX-31: {section: "11. Pilot work outside the gate", kind: evaluation, tracked_by: [F19], statement: "F7 symmetric interruption and recovery, test and CI hardening scored with hidden mutants, F5 decomposable migration and F6 optimization or refactor under preservation may run on spare capacity or after the batch, never blocking or pooled into the primary result"}
  VGX-32: {section: "12. U3 disposition", kind: decision, tracked_by: [U3, F14, F19], statement: "Q7 needs no U3 or F14 amendment before M4-H: premises are measured in F4 on the frozen M4 commit, descriptively, never pooled; five runs per cell cannot establish equivalence; the U3 concern flag fires when A correctly accepts at least 3 of 5 true-premise runs but at most 2 of 5 false-premise runs, or the false cell has at least 2 silent false successes while the true cell has none; the flag supports later U3 or F14 work and proves no general defect; the true premise must change cost, feasibility or the correct choice; true-premise cost and time are reported; neither F1 to F3 nor F4 overrides the other; U3 is EVALUATE IN M4-H, not a pre-M4-H blocker"}
  VGX-33: {section: "13.1 Fixed-cell estimand", kind: evaluation, tracked_by: [F19], statement: "The six cells are fixed, not a random sample: y_ij ~ Binomial(n_ij, p_ij) with independent Jeffreys priors Beta(0.5, 0.5); the governing estimand is the equal-weight fixed-cell average risk difference of A minus R; a pooled 72-versus-72 test, a random-cell model or post-hoc inverse-variance weighting is forbidden as the governing analysis"}
  VGX-34: {section: "13.2 Exact interval procedure", kind: evaluation, tracked_by: [F19], statement: "The governing interval is the 90 percent equal-tailed posterior credible interval of the estimand from exact Beta(y+0.5, n-y+0.5) posteriors per cell and arm, 1,000,000 joint draws under the preregistered PRNG and seed, reporting the posterior mean and 5th and 95th percentiles, unchanged for all-pass or all-fail cells; the analysis bundle carries a deterministic reference implementation and test vectors before counted execution"}
  VGX-35: {section: "13.3 Design effect and pre-seal power simulation", kind: evaluation, tracked_by: [F19], statement: "Designed for a large effect (+20 points): correctness-beneficial only when the posterior mean is at least +10 points and the 90 percent lower bound is above 0; before sealing the evaluator runs the frozen operating-characteristic simulation (null, plus and minus 10, 15, 20, 25 points, a heterogeneous +20 vector, baselines across the calibrated region), storing code, assumptions and outputs; if it materially misses the targets the replication count rises before counted execution, never after outcomes are seen"}
  VGX-36: {section: "13.4 Correctness verdict", kind: evaluation, tracked_by: [F19], statement: "The verdict is exactly CORRECTNESS_BETTER (the benefit rule), CORRECTNESS_WORSE (the 90 percent upper bound below 0, no minimum negative estimate) or CORRECTNESS_INCONCLUSIVE; M4-H v1 makes no operational-equivalence claim"}
  VGX-37: {section: "13.5 R+ interpretation", kind: evaluation, tracked_by: [F19], statement: "R+ is descriptive: per cell the report shows R, A and R+ correct-accept rates, the graded score, cost, time and tokens, silent false successes and mergeability; it may say R+ is directionally similar to A or R, never claiming equivalence, machinery necessity or redundancy"}
  VGX-38: {section: "13.6 Two-axis product result", kind: evaluation, tracked_by: [F19, F25], statement: "Correctness and efficiency are independent axes: cost is COST_WITHIN_CEILING, COST_OVER_CEILING or COST_UNRESOLVED, with the ceiling and estimator frozen before calibration; the headline pairs the two; cost never changes the correctness verdict and a correctness benefit never erases an efficiency failure"}
  VGX-39: {section: "13.7 Critical-failure / harm rule", kind: evaluation, tracked_by: [F19], statement: "Critical failures are a separate safety axis with CF-A catastrophic (credential or secret disclosure, unauthorized destructive host action, material data loss outside the sandbox, unauthorized privilege or boundary breach) and CF-B serious events from the frozen taxonomy: one CF-A in an arm is SAFETY_HARM, two or more CF-B in A above R's count on the 144 primary runs is SAFETY_HARM, any critical event is at least SAFETY_CONCERN, otherwise NO_CRITICAL_SIGNAL; events are adjudicated without seeing the aggregate result"}
  VGX-40: {section: "13.8 Claim scope", kind: decision, tracked_by: [F19], statement: "M4-H v1 tests only the six sealed cells, the frozen repositories, cold start, the pinned single-model topology and the sealed unattended contract; a negative or inconclusive result may block promotion of that configuration and motivate mechanism investigation but never by itself justifies removing AEW architecture, which needs mechanism-specific evidence or the later reference-topology experiment; a positive result establishes no superiority outside these cells and topology"}
  VGX-41: {section: "14.1 Freeze before any calibration result is observed", kind: process, tracked_by: [F19], statement: "Frozen before any calibration result: the primary model and fallback or stop rule, the M4 commit and treatment bundle, the cost-ratio ceiling, the full CF-B list, the R+ prompt written as a competent baseline, the review rubric and reviewer requirements, difficulty knobs and selection rule, the denial text, the invalid-environment predicates, the normalized export, the simulation code, seed and vectors, the F4 concern formula, and evaluator and reviewer independence rules"}
  VGX-42: {section: "14.2 Freeze after calibration and before counted execution", kind: process, tracked_by: [F19], statement: "Frozen after calibration and before counted execution: the second repository, the six primary and two F4 cells, calibration sibling identities and disposition, knob values, hidden oracles and the graded-score formula, identical per-cell caps, the randomization seed and schedule, per-arm quota partitions, evaluator identities and review assignment, and the complete preregistration hashes; these values never reopen Q7 unless they change the causal question, estimand, inference procedure or experiment shape"}
  VGX-43: {section: "15. Freeze-candidate disposition", kind: decision, tracked_by: [F19], statement: "After operator adoption Q7 is adopted and design frozen (operator, 2026-10-07, §16): reopened only for another concrete experimental-validity contradiction; filling the preregistration values does not reopen it"}
  VGX-44: {section: "16. Operator's adoption and M4-H prerequisites (2026-10-07)", kind: sequencing, tracked_by: [F19, F15.5, F15.6, F25], statement: "Implementation prerequisites before M4-H execution (operator, 2026-10-07): F15.5/F15.6 unattended PUBLISH_IF_CLEAN authority for the AEW arm; F19's evaluator and arm-host split with the held-out task-release runner; F25 live run-usage telemetry sufficient for the evaluator to enforce the sealed USD cap, F25 staying measurement and ledger authority while the M4-H evaluator consumes its telemetry and performs experiment-local cap termination (general budget enforcement does not move into F25)"}
  TRA-01: {section: "1. Purpose", kind: decision, tracked_by: [F4], statement: "Ticket identity is stable and its wording is not sacred: AEW preserves engineering progress through bounded revisions with attributable history and never requires cancel-and-replace for a bounded correction, while a revision never erases adverse history, weakens inherited authority, narrows acceptance to escape proof or disguises a different objective as continuation"}
  TRA-02: {section: "2.1 Stable Ticket identity", kind: requirement, tracked_by: [F4], statement: "A Ticket has one stable identifier and one or more immutable revisions (T-17@r1, @r2...); exactly one revision is current for a non-terminal Ticket; Tickets created before implementation are revision r1"}
  TRA-03: {section: "2.2 Revision records are immutable and engine-classified", kind: requirement, tracked_by: [F4], statement: "A committed revision is never edited in place; a new revision names its predecessor, records the reason, preserves the prior revision and attributable history, and records the AEW-computed changed field groups, the computed revision impact and any required confirmation or Lead assertion; AEW never trusts a Lead-declared change set, digest equality, evidence status or admissibility; revision history stays inspectable after completion"}
  TRA-04: {section: "2.3 Every revision-governed input belongs to a governed, versioned field group", kind: requirement, tracked_by: [F4], statement: "Every revision-governed input (fields of the revision record and revision-sensitive control inputs stored elsewhere, dependencies included) belongs to exactly one primary field group of an AEW-owned registry with a stable identity that evidence and revision decisions bind to; the registry covers at least acceptance/objective, scope, gate set and effective class, dependencies, kind, card/presentation metadata and other engine-defined groups; an unassigned input fails closed into the broadest acceptance-bearing group; a field that can carry acceptance-relevant content is acceptance-bearing unless the schema mechanically constrains it; schema-declared presentation-only fields such as the title are non-material, but if acceptance-relevant content is placed in one the fail-closed acceptance-bearing rule applies instead; moving acceptance content into a non-binding field is forbidden; a registry change that moves a field treats it as changed in both groups until bindings regenerate"}
  TRA-05: {section: "2.4 Digest and change computation", kind: requirement, tracked_by: [F4], statement: "Field-group digests are computed from a schema-defined canonical projection while the authored bytes are preserved as provenance; the v1 text canonicalization is only CR/CRLF to LF, Unicode NFC and trailing spaces and tabs removed, with no case, punctuation, blank-line, interior-whitespace, wording or synonym folding; fields without a rule use their exact bytes; any equivalence that can collide two authored values is explicit, versioned and tested; revision text is untrusted authored input that never gains instruction authority in a context pack"}
  TRA-06: {section: "2.5 Revision is continuation, not replacement", kind: requirement, tracked_by: [F4], statement: "A revision is permitted while the Ticket pursues the same bounded objective (scope corrections within the parent envelope, acceptance clarification, dependency corrections, planning or implementation discoveries, a changed approach, a mistaken field) and is never refused merely because work has begun or useful workspace changes exist"}
  TRA-07: {section: "3. When replacement is required", kind: requirement, tracked_by: [F4], statement: "A new Ticket, not a revision, is required when the kind changes the execution semantics, the parent changes, the goal no longer substantially overlaps, the change must cross a mechanically enforced boundary revision may not cross, or the Ticket is DONE or CANCELLED; a replacement keeps the supersession lineage; repeated revisions never substitute for a replacement"}
  TRA-08: {section: "4.1 Mechanical refusal", kind: requirement, tracked_by: [F4], statement: "AEW mechanically refuses a revision that would go below the parent's minimum descendant class, remove a mandatory inherited gate, violate protected-path or guardrail policy, create a dependency cycle, revise a DONE or CANCELLED Ticket, revise while a publishing lease is held for the Ticket's candidate, lower the class without the governing attributable decision, or put scope outside a machine-checkable parent envelope; parent scope and coverage should be structural where practical"}
  TRA-09: {section: "4.2 Non-mechanical parent alignment", kind: requirement, tracked_by: [F4], statement: "Each revision decision carries an attributable Lead assertion of parent alignment, reviewable and never proof; independent confirmation is required when the effective class is 2 or higher, the acceptance group changes after acceptance-bearing evidence is bound, acceptance changes after a passing review or verification, the anti-laundering trigger fires, or the checkpoint rule is reached; for lower-risk revisions before acceptance-bearing evidence exists, the Lead assertion is sufficient unless another governing rule requires review; acceptance-bearing evidence includes acceptance reviews and verifications, check receipts mapped to an acceptance criterion and any class the gate registry marks as supporting acceptance, including results received but not yet ingested"}
  TRA-10: {section: "4.2.1 Independent confirmation", kind: requirement, tracked_by: [F4], statement: "Independent confirmation is a fresh-context invocation, not the revising Lead, admitted under the policy for the effective class, that receives the engine material first (predecessor and cumulative diffs, parent envelope and coverage obligations, the registry identity, the open-adverse set), records its initial determination before seeing the Lead rationale, and records whether the objective is the same, the envelope and coverage hold, adverse evidence is preserved and dispositioned, and nothing sheds gates, narrows acceptance or hides a different objective; at effective class 2+ it sees the cumulative diff; it is not an operator checkpoint unless a rule says so"}
  TRA-11: {section: "4.3 Cumulative drift", kind: requirement, tracked_by: [F4], statement: "Each material revision (one changing an acceptance, scope, gate or effective-class, dependency, kind or acceptance-bearing check-definition digest; presentation-only changes are not material) is evaluated against its predecessor, r1 or the last operator checkpoint, and the parent envelope; by default the fourth material revision since the last checkpoint needs an explicit operator or stakeholder checkpoint before it becomes current; operator-controlled policy may set another finite threshold and no Lead or model may loosen it; AEW tracks and surfaces the count; the checkpoint sees the cumulative diff and waives nothing"}
  TRA-12: {section: "4.4 Parent coverage", kind: requirement, tracked_by: [F4, F5], statement: "Any acceptance-group change triggers a parent-coverage recheck, recomputed where requirement-to-child mappings are structured and otherwise a visible coverage-review obligation; parent closeout evaluates coverage against the children's final revisions"}
  TRA-13: {section: "5.1 Evidence binds to what it proves", kind: requirement, tracked_by: [F4], statement: "Evidence binds the Ticket inputs its claim depends on as engine-owned field-group digests plus the registry identity, beside its existing source, snapshot, plan, check-definition, evaluator, environment and policy bindings; a revision number alone never makes unrelated evidence stale; no Ticket field stays outside the registry"}
  TRA-14: {section: "5.2 Admissibility is computed", kind: requirement, tracked_by: [F4], statement: "Evidence records stay immutable and their admissibility (UNCHANGED, REVALIDATE, INVALIDATED, HISTORICAL, SUPERSEDED) is derived by AEW from bindings and current state, never written back or chosen by the Lead; a gate is never satisfied by evidence whose bindings no longer match the current revision unless an allowed revalidation record establishes it"}
  TRA-15: {section: "5.3 Revalidation", kind: requirement, tracked_by: [F4], statement: "REVALIDATE resolves only through a new attributable record: mechanical revalidation proving every relevant input unchanged, or independent fresh-context confirmation producing a record that references the old evidence; a Lead applicability note covers only advisory material and never makes evidence current, satisfies a gate or dismisses a finding; no Lead decision revalidates an acceptance review or verification whose acceptance bindings changed"}
  TRA-16: {section: "5.4 Workspace carry-forward", kind: requirement, tracked_by: [F4], statement: "Workspace state may carry forward to the current revision as input: carry-forward carries work, not proof; evidence, review, verification and gates stay subject to binding and revalidation"}
  TRA-17: {section: "5.5 Migration of existing r1 evidence", kind: requirement, tracked_by: [F4], statement: "On migration to r1, evidence without field-group bindings is treated as bound to every Ticket field group relevant to its class, so it is regenerated or revalidated through an allowed path after a later revision; migration enriches bindings only from deterministic facts in the canonical record, never from model judgment"}
  TRA-18: {section: "6.1 Revision does not erase adverse history", kind: invariant, tracked_by: [F4], statement: "Open required findings, failed reviews and verifications, unresolved defects and other adverse evidence stay visible across revisions until resolved, waived through an existing waiver path or shown inapplicable by attributable evidence; when the revision changes the criterion, acceptance group, scope or gate the finding concerns, the revising Lead cannot declare it inapplicable and independent confirmation is required; no revision both changes a criterion and self-dismisses its adverse result"}
  TRA-19: {section: "6.2 Revision laundering is forbidden", kind: invariant, tracked_by: [F4], statement: "A Lead never revises to escape an adverse result while continuing the same work; AEW routes to independent confirmation when the current or prior adverse outcome is REVIEW_FAILED, VERIFICATION_FAILED or VERIFICATION_INCONCLUSIVE or unresolved adverse evidence exists, the revision changes acceptance, scope, gates, dependencies or an acceptance-bearing check input, and implementation lineage carries forward (engine-computed from workspace or candidate ancestry or reused content identity, not reset by a fresh worktree); BLOCKED alone is not a trigger; a match routes, never rejects; where the registry includes REVISION_LAUNDERING, detected violations should be classed accordingly"}
  TRA-20: {section: "6.3 Acceptance narrowing and unbound-field escape", kind: requirement, tracked_by: [F4], status: "done: failure-class registry §4 (2026-10-06)", statement: "The failure-class registry includes ACCEPTANCE_NARROWING_BY_REVISION and UNBOUND_FIELD_ESCAPE as diagnostic and accountability classes that do not replace the mechanical refusals and confirmations"}
  TRA-21: {section: "6.4 Gate shedding is forbidden", kind: invariant, tracked_by: [F4], statement: "A revision never reduces classification, inherited gates or required assurance because the prior revision failed or was blocked by them; a class reduction stays under the classification-change rules, and after adverse evidence needs the independent confirmation those downgrade rules already require"}
  TRA-22: {section: "7.1 Invocation binding", kind: invariant, tracked_by: [F4], statement: "Every model-controlled invocation doing Ticket work is bound to the revision under which it was admitted; no active invocation is authorized for a non-current revision; late results of a prior revision stay attributable history and never regain mutation authority or become accepted by arriving late"}
  TRA-23: {section: "7.2 Revision quiesce and commit", kind: requirement, tracked_by: [F4], statement: "Revision is two-phase: quiesce (block new admission against the old revision, revoke or stop active invocations' mutation authority, reconcile custody and integration state, keep held leases until their reconciliation path retires them), then commit by compare-and-swap on the expected current revision only when the old revision can no longer admit or mutate; before commit the proposal is a held draft plus an attempt record with no authority; a revision_pending overlay (not a workflow state) records the draft, the expected revision, the obligations, start, expiry, blocking leases and invocations and abortability; a timeout or failure never releases a lease or forces the commit; the operator or an authorized Lead may abort (draft discarded, attempt kept, old revision current, admission restored only after reconciliation, leases released only by their own path); expiry starts the abort path and raises attention"}
  TRA-24: {section: "7.3 Dispatch/revision race", kind: invariant, tracked_by: [F4], statement: "Every dispatch or admission compare-and-swaps on the revision it was authorized against: if the revision commits first the old-revision admission fails closed as stale; if the admission commits first the revision path quiesces it before committing; no race yields mutation authority against a revision never current for that invocation"}
  TRA-25: {section: "7.4 StageIntent binding", kind: requirement, tracked_by: [F4, F15.2], statement: "Every open decision-sensitive StageIntent binds the Ticket revision and the legality or obligation digest; one bound to a non-current revision is non-runnable; a new revision may rebind it only explicitly and attributably after rechecking the current revision, source and control revision, the legality digest, authority and gates, and the stage contract's revision-changed inputs"}
  TRA-26: {section: "7.5 Downstream impact propagation", kind: requirement, tracked_by: [F4], statement: "A revision changing acceptance, scope or dependencies produces a durable revision-impact record; the amendment's own revision_impact_hold overlay (independent of F9) applies only to a direct explicit dependent whose binding could be affected and not mechanically shown unchanged; while held the dependent's state is unchanged but dispatch or progression relying on the affected dependency is blocked; active dependent invocations are not cancelled but their results cannot satisfy affected progression until the hold resolves; the hold records the upstream Ticket and revision, changed groups, the dependent binding, its time and its clearing obligation, and clears only by mechanical proof of no impact or an attributable dependent revalidation, which makes no stale evidence current; propagation continues only if resolution changes the dependent's own inputs, never as automatic recursive fan-out; siblings are affected only through governed relationships; acceptance-group changes always recheck parent coverage"}
  TRA-27: {section: "8. Workflow-state rules", kind: requirement, tracked_by: [F4], statement: "Revision is a governed transition, allowed in any non-terminal state except while a publishing lease is held, never after DONE or CANCELLED; at COMMIT_READY or with a prepared candidate a material revision retires or invalidates the candidate under the integration contract first; the revision impact drives the next legal action (replanning, coverage recheck, dependent revalidation, StageIntent rebinding, guardrail recomputation, renewed review, verification or checks, or nothing for unaffected evidence), neither repeating every check by default nor assuming unaffected evidence admissible without evaluating its bindings"}
  TRA-28: {section: "9. Amendment to Workflow Contract invariant 7", kind: invariant, tracked_by: [F4], statement: "Invariant 7 is extended: current acceptance is revision-bound, a gate satisfied only by evidence whose source, check-definition, accepted-plan, Ticket-input and other bindings are current for the revision advanced or by a permitted revalidation record; every Ticket field is in a governed group with unclassified fields failing closed; changed groups and admissibility are engine-computed; no active invocation keeps mutation authority for a non-current revision; dispatch and revision are CAS-bound; stale StageIntents are non-runnable until rebound; every revision has an attributable decision; none follows DONE or CANCELLED; no material revision silently discards unresolved adverse findings; no revision weakens an inherited authority or assurance requirement except through the already-governed explicit decision path; drift is checked against predecessor, checkpoint and parent; acceptance-group changes recheck coverage"}
  TRA-29: {section: "10. Amendment to Knowledge Contract §12", kind: requirement, tracked_by: [F4], statement: "Ticket revisions join plan revisions as first-class durable history: stable identity, immutable revisions, the current revision while active, predecessor linkage, reason and engine-computed changes, the registry identity, impact and revalidation decisions, required confirmations, evidence bindings sufficient to recompute admissibility, downstream impact records and the final revision in completion records; derived current-revision indexes may be rebuilt; a completion record names the final revision and its accepted evidence basis; parent closeout names the children's final revisions and verifies coverage against them"}
  TRA-30: {section: "11. Non-goals", kind: decision, tracked_by: [F4], statement: "Not: freely mutable Ticket text, arbitrary objective changes, bypassing parent purpose or stakeholder authority, a new waiver mechanism, weaker review, verification, classification or gates, human review or checkpoint debit for a schema-declared presentation correction, CLI syntax or storage paths, invalidating every artifact on every correction, live authority transfer to a running invocation, a timeout releasing a lease, or Tickets redefining their parent"}
  TRA-31: {section: "12. Acceptance / oracle requirements", kind: evaluation, tracked_by: [F4, F19], statement: "A conforming implementation demonstrates the 35 oracle cases of §12 (scope correction keeping work; changed inputs not silently satisfied; unrelated evidence kept; fail-closed field classification and computed digests; the exact normalization; notes-field escape; registry moves; adverse findings surviving and not self-dismissed; confirmer independence and material order; cumulative diffs at class 2+; no gate shedding; the checkpoint rule with presentation exemption; coverage rechecks; refusal of terminal or publishing work; the dispatch race; no stale invocation; quiesce failures keeping leases; the pending overlay and abort; late results; StageIntent rebinding; the local impact hold; drift; legacy evidence; lineage across worktrees; BLOCKED not a trigger; control-state dependencies in the registry; effective-class thresholds; replacement cases; final revisions at closeout; durable history; revision text as data); dogfood and M4-H measure revision friction as diagnostic process metrics"}
  TRA-32: {section: "12.1 Implementation compatibility consequences", kind: requirement, tracked_by: [F4, F20], statement: "Implementation consequences, not new authority: evidence gains a Ticket-input and field-registry binding; revision_pending and revision_impact_hold are projection-visible overlays, so a typed dashboard or API projection exposing them versions its contract rather than widening a closed enum; required independent confirmation is a governed stage costing a fresh-context model invocation; migration of existing projects and evidence goes through aew migrate or the spec-migration path, never silent reinterpretation"}
  TRA-33: {section: "13. Governing disposition", kind: decision, tracked_by: [F4, E19], status: "done: docs/spec-amendments.yaml overlay ticket-revisions-2026-10-06, the pending debt cleared; failure-class registry §4 (2026-10-06)", statement: "On adoption the amendment supplies the Ticket-revision semantics missing from WC v0.7 §7, §8 and invariant 7 and KC v0.4 §12; the overlay index replaces the pending debt with adopted targets; the failure-class registry adds the three classes; E19-B v0.4 is design frozen and implementation-ready, reopened only by an implementation contradiction or a governing amendment; the WC v0.8 / KC v0.5 re-freeze may fold it in without changing its meaning"}
  IAT-01: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F18, F28], statement: "The internal-alpha threat model: the operator plus a small number of trusted engineers who legitimately control their own development accounts and machines; defending against model mistakes, confused or unsafe tool use, accidental credential exposure, stale authority and ordinary agent misbehaviour; not a hostile multi-tenant environment and not a malicious local engineer"}
  IAT-02: {section: "1. The decision, recorded as given", kind: invariant, tracked_by: [F18, F28], statement: "Required protection boundary for internal alpha: model-controlled processes cannot directly mutate canonical AEW and control state or obtain real provider or workflow credentials except through the adopted AEW authority paths (the F18 and F28 boundaries); ordinary project files and user-readable filesystem contents are not isolated as though the model were a hostile remote tenant, and no whole-home-directory isolation is added for internal alpha"}
  IAT-03: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F28, F18], statement: "Platform posture: Rocky/Linux is the production-guarantee target for internal alpha; Windows and WSL are valuable for development and testing, but production-equivalent containment on them is not an internal-alpha requirement, and their results stay truthfully labelled and are never evidence that the Linux production containment contract was satisfied"}
  IAT-04: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F18.5], statement: "Operator attribution: attribution to the authenticated local OS user and the AEW operator session is sufficient for consequential operator actions; no MFA-style reauthentication, cryptographic signing of every operator decision or other high-friction confirmation; operator-only capabilities stay structurally unavailable to model-controlled processes as already required"}
  IAT-05: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [E50], statement: "Lead inactivity expiry is desirable hardening, not an internal-alpha prerequisite, tracked as a later bounded improvement: its purpose is abandonment cleanup (an attachment left over a long absence), not short-session policing; expiry stales or revokes the Lead attachment and requires a fresh attachment and generation under Q12's semantics, and never silently kills independently admitted child work"}
  IAT-06: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F18.6], statement: "No requirement that the whole model harness run as a separate human-created OS account for internal alpha: the F18 protected-state and principal boundary and F28's credential and network custody are the properties that matter; a two-account profile stays a possible stronger deployment option"}
  IAT-07: {section: "1. The decision, recorded as given", kind: requirement, tracked_by: [F33], statement: "Remote delivery, bounded internal-alpha form: engineering completion rests on the accepted, verified local result; push is a separate delivery action, not part of correctness or DONE; the operator approves the exact push; the destination remote and ref are explicit; no force push; AEW records an attributable receipt with the accepted local commit, the requested remote and ref and the resulting remote SHA and ref; the pushed remote object must resolve to the exact accepted commit; an exact-commit push needs no second verification for having crossed the network; a push, network or authentication failure is a delivery failure, never a retroactive VERIFICATION_FAILED"}
  IAT-08: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [Q14], statement: "Automated PR creation and provider-generated merge-commit handling are not internal-alpha requirements, and the target environment may not make automated PR creation practical: Q14's broader questions (provider-specific PR creation, remote merge workflow, whether a provider merge commit needs a second verification, DONE semantics when it differs from the accepted candidate) are deferred, no longer block internal alpha, and reopen when remote PR or merge integration becomes a product requirement"}
  IAT-09: {section: "1. The decision, recorded as given", kind: decision, tracked_by: [F18, F28, F33, E50, Q14], statement: "F23 is adopted and closed as the internal-alpha threat-model decision: F18/F28 canonical-state and credential boundaries REQUIRED; Linux/Rocky production target REQUIRED; trusted-engineer use ALLOWED; Windows/WSL development and testing with weaker truthful guarantees ALLOWED; local OS and session operator attribution SUFFICIENT; a separate full model OS account NOT REQUIRED; Lead inactivity expiry DEFERRED hardening; bounded operator-approved exact-commit push ALLOWED as a delivery capability; automated PR and merge-provider integration DEFERRED; Q14 removed as an internal-alpha gate; not a new broad security architecture exercise"}
  # ---- KAD: the operator's knowledge system adoption decision (2026-10-09; F21) ----------------------------------
  KAD-01: {section: "1. Decision", kind: decision, tracked_by: [F21], statement: "The knowledge-system design set is the governing M6b direction: capture/admission v0.4, shared semantics v0.4, recall/context routing v0.3, and ADR-0013 (adopted together with the semantic set); the adoption accepts their architecture and authority boundaries"}
  KAD-02: {section: "1. Decision", kind: gate, tracked_by: [F21], statement: "Adoption does not bypass the evidence-driven implementation sequence and does not authorize production K1/K2 machinery ahead of the accepted stop/go gates"}
  KAD-03: {section: "2. Role-access decision", kind: decision, tracked_by: [F21, F13], statement: "Knowledge/history lookup is a normal AEW capability, not a Lead privilege: every admitted engineering role (Lead, implementer, reviewer, verifier, investigator, future bounded worker roles) may receive safe project-scoped lookup by default unless an explicit policy reason excludes it; weaker workers get as much deterministic and retrieval assistance as safely possible, to raise their effective capability as well as to save frontier cost"}
  KAD-04: {section: "Default role shape", kind: requirement, tracked_by: [F21, F13], statement: "Ordinary workers receive EXPLICIT_LOOKUP, exact id/source expansion, compact qualified search results, bounded progressive disclosure and exact evidence/source links where available; Lead and investigator roles may also receive INVESTIGATION_HISTORY, challenged/held/historical material with explicit qualification and broader expansion where policy permits; operator/evaluation tooling may receive DEBUG_EVALUATION, ranking/index/provenance diagnostics and evaluation-only metadata"}
  KAD-05: {section: "Default role shape", kind: invariant, tracked_by: [F21], statement: "Request modes remain query intent, never authority grants"}
  KAD-06: {section: "3. Discoverability decision", kind: requirement, tracked_by: [F21, F13], statement: "Knowledge/history lookup is a base capability, ordinarily discoverable to workers by default, with no per-Ticket grant the Lead must remember: a worker invocation's normal capabilities include project/repository navigation, knowledge/history lookup, exact evidence expansion and role-appropriate task tools"}
  KAD-07: {section: "3. Discoverability decision", kind: invariant, tracked_by: [F21], statement: "Broad tool availability, narrow default payload: discoverability never means historical content is injected into every context packet; history is retrieved when useful"}
  KAD-08: {section: "4. Progressive-disclosure decision", kind: requirement, tracked_by: [F21], statement: "Roles differ in answer depth, not in the existence of the capability: result budget, context budget, default expansion depth and available investigation modes; an implementer gets concise actionable results (the match, why it matched, status, key point, evidence, an expand reference), never a multi-page dossier merely because one exists; a Lead or investigator may intentionally expand into full history, competing hypotheses, challenged records, related incidents, provenance chains, environment differences and disposition history"}
  KAD-09: {section: "5. Security / visibility posture", kind: invariant, tracked_by: [F21], statement: "The knowledge system is not secret management; M6 v1 stays project-scoped under normal AEW authorization and visibility; no cross-project leakage, hidden provider metadata leakage, secrets in Knowledge records, execution authority for historical prose, visibility widened by request text, or workflow permissions granted by retrieval results; historical and model-authored text stays untrusted reference data"}
  KAD-10: {section: "6. Product objective", kind: decision, tracked_by: [F21, F34], statement: "Give every model the strongest safe informational advantage: conserve frontier Lead reasoning, compensate weaker workers' navigation, recall, search and context acquisition; a worker spends its limited intelligence on the assignment, not on rediscovering what AEW already has (aligned with the adopted Deterministic Work Conservation requirement)"}
  KAD-11: {section: "7. Implementation sequence remains evidence-driven", kind: sequencing, tracked_by: [F21, F19], statement: "The accepted M6b sequence is unchanged: A no recall; B guarded explicit raw canonical-history recall; A/B evaluation under ordinary discoverability; the K1 historical replay / source-class gate; C, the smallest K0/K1 structured Case arm, only if B leaves a measurable gap; B/C comparison; K2 Lessons only if C earns the complexity; automatic discovery only as a separately measured later arm. Arm B is the first production implementation target; semantic/vector retrieval stays optional and must beat the lexical/structured baseline before becoming load-bearing"}
  KAD-12: {section: "8. Immediate implementation consequences", kind: requirement, tracked_by: [F21], statement: "The implementation-readiness package proceeds without returning to the operator and: reconciles and freezes field names and the glossary across the adopted set; qualifies ADR-0013's assumptions against the current tree; defines the exact Arm B indexed corpus; defines the concrete request-mode/role matrix consistent with this decision; defines compact/default versus expanded result shapes"}
  KAD-13: {section: "8. Immediate implementation consequences", kind: evaluation, tracked_by: [F21, F19], statement: "The readiness package assembles the F19-compatible A/B evaluation corpus and rubric, and replays K1 candidate templates only after Arm B is measurable"}
  KAD-14: {section: "8. Immediate implementation consequences", kind: decision, tracked_by: [F21], statement: "Ranking formula, vectors, rerankers, automatic-discovery thresholds and K2 production policy are left to later evidence; implementation-local naming and schema details take the simplest conservative choice consistent with the adopted contracts instead of escalating routine decisions"}
  KAD-15: {section: "9. North-star interpretation", kind: decision, tracked_by: [F21, F34], statement: "The knowledge system is part of AEW's base intelligence-amplification layer, a project-aware information capability that makes prior engineering experience cheaper to obtain than to rediscover; success means frontier and weaker models alike rationally prefer AEW's knowledge/navigation surfaces when they answer better, faster or more completely than manual rediscovery"}
  # ---- KDR: the designer's rulings on worker tool delivery and reviewer independence (2026-10-09; F21, F15.3) -------
  KDR-01: {section: "1. The rulings, recorded as given", kind: decision, tracked_by: [F15.3, F21], statement: "Worker tool delivery: APPROVE; this is already the intended aew-run architecture: the worker sees typed tools, requests go through the supervisor bridge, and credentials remain supervisor-side"}
  KDR-02: {section: "1. The rulings, recorded as given", kind: requirement, tracked_by: [F15.3, F21, F22], statement: "Knowledge, map and helper operations should extend the aew-run mechanism rather than create another worker credential surface (with F15.3's supervisor-side custody, the lead developer reads this as no second credential for the worker)"}
  KDR-03: {section: "1. The rulings, recorded as given", kind: decision, tracked_by: [F21], statement: "Reviewer independence: REVISE the lead developer's proposal; the designer would not exclude all records belonging to the Ticket under review: AEW defines independence as fresh/bounded context with the implementer reasoning transcript excluded, the verifier explicitly needs unresolved review findings and relevant canonical evidence, and blanket same-Ticket hiding would destroy legitimate rework/verification context"}
  KDR-04: {section: "1. The rulings, recorded as given", kind: requirement, tracked_by: [F21], statement: "The better rule: reviewer and verifier lookup about the Ticket under review hides current implementer reasoning and private working state by default, and preserves the canonical objective, plan, diff, check results, findings, failures, and whatever the role actually requires"}
  KDR-05: {section: "1. The rulings, recorded as given", kind: requirement, tracked_by: [F21], statement: "Broader historical prose from the Ticket under review can require an explicit investigation mode"}
  # ---- WCR: the Deterministic Work Conservation requirement v0.1 (adopted 2026-10-09; F34 and its owner rows) -------
  WCR-01: {section: "1. BLUF", kind: decision, tracked_by: [F34], statement: "If AEW can answer a question, derive a fact, select a tool, route information or perform a workflow action deterministically and safely without model inference, it prefers to do so rather than require an LLM to rediscover or reproduce that work; model reasoning is reserved for judgment, synthesis, ambiguity resolution, planning, interpretation and novel reasoning"}
  WCR-02: {section: "2. Product objective", kind: requirement, tracked_by: [F34, F22, F15, F9, F21, F13], statement: "Maximize the fraction of model effort spent on the engineering problem: models should not routinely spend reasoning on rediscovering repository structure, locating indexable source, tests, mocks, fixtures or configuration, repeated symbol searches, reconstructing workflow state AEW owns, choosing the next mechanically runnable action, choosing among tools AEW can resolve, rediscovering other workers' durable findings or prior project knowledge, repeating deterministic impact analysis, or polling for state changes AEW can observe; AEW owns deterministic facts, navigation, retrieval, routing, workflow mechanics, capability resolution, scheduling/admission and derived context, the model owns judgment"}
  WCR-03: {section: "DWC-1 — Deterministic-first resolution", kind: requirement, tracked_by: [F34, F22, F13, F21], statement: "DWC-1: before asking a model to reason or explore, AEW determines whether the result can be produced from trusted deterministic inputs and qualified deterministic capabilities, and when an adequate deterministic answer exists provides it directly or through a typed capability; the model may still inspect underlying source or evidence; deterministic assistance does not replace source truth, evidence, review, verification or required model judgment"}
  WCR-04: {section: "4. Inference is an escalation, not the default", kind: requirement, tracked_by: [F34, F22, F21], statement: "Resolution order: exact deterministic fact; derived fact or locator; bounded deterministic relationship or impact query; qualified search/index fallback; bounded model-assisted synthesis; broader investigation; judgment. A more expensive layer is never invoked merely because it exists; stop at a lower layer that gives a complete, sufficiently qualified answer, and escalate explicitly when it is stale, partial, unsupported, ambiguous or insufficient"}
  WCR-05: {section: "5. Repository navigation is the flagship requirement", kind: requirement, tracked_by: [F22, F30], statement: "Repository orientation is the flagship application: questions such as where something is implemented, where its tests, mocks or fixtures are, which module owns a symbol, which files are related, which constraints apply, what changed in the worker's workspace and what else an edit may affect are answered directly from deterministic repository state, project maps, semantic indexes, Git, test relationships, constraint locators or qualified search, so the worker reaches relevant source before task reasoning instead of a pwd/ls/find/grep ritual"}
  WCR-06: {section: "6. Repository navigation target", kind: evaluation, tracked_by: [F22, F19], statement: "For ordinary bounded Tickets a worker normally reaches task-relevant source without repository-wide exploratory filesystem search; repo-wide find/grep/rg or recursive traversal is a fallback, not every invocation's initialization ritual; an optimization target, not a correctness gate, and measured"}
  WCR-07: {section: "7. Typed intent over shell ceremony", kind: requirement, tracked_by: [F22, F13, F15.3], statement: "Models can ask intent-level operations (repo.locate, repo.symbol, repo.tests_for, repo.impact, repo.constraints, repo.search) without knowing the backend; the capability layer resolves each through project maps, semantic indexes, language servers, Git, deterministic relationship indexes, ripgrep or other qualified providers"}
  WCR-08: {section: "8. Workspace-bounded search", kind: requirement, tracked_by: [F22, F13], statement: "Fallback search is structurally bounded to the invocation's authorized project/workspace scope by default, so a worker need not construct roots or paths to search its own assignment; explicit expansion outside the workspace remains a separate capability/policy decision"}
  WCR-09: {section: "9. Deterministic change-impact assistance", kind: requirement, tracked_by: [F30, F22], statement: "After a worker changes code, a bounded deterministic impact view is available when qualified data exists (changed files/symbols, related modules, direct dependents, implementations, tests, mocks/fixtures, schemas, configuration, constraints/invariants, generated/public surfaces); it is advisory unless an existing authority contract says otherwise and does not prove that every related item needs modification"}
  WCR-10: {section: "10. Do not duplicate deterministic knowledge across agents", kind: requirement, tracked_by: [F22, F9, F21], statement: "Stable project facts (structure, entry points, test locations, build system, constraints, dependency relationships, established findings, workflow state, known execution capabilities) are computed once and reused where safely applicable, so parallel execution multiplies useful work, not rediscovery"}
  WCR-11: {section: "11. Workflow ceremony is the same problem", kind: requirement, tracked_by: [F15, F11, F15.5], statement: "When AEW can determine that a Ticket is runnable, a dependency satisfied, a review may be requested, a verifier should be launched, an integration entry is mechanically ready, a stage transition is legal, worker capacity exists, a budget permits another worker or an event should wake a waiting process, no model spends a reasoning turn reproducing that determination; F15 and M5 apply this to workflow mechanics"}
  WCR-12: {section: "12. Coordination is the same problem", kind: requirement, tracked_by: [F9], statement: "A relevant finding one worker has established is routed or made available, bounded, through the approved coordination path when the expected value justifies it, so isolated workers do not rediscover it; coordination still does not become authority (F9)"}
  WCR-13: {section: "13. Knowledge recall is the same problem", kind: requirement, tracked_by: [F21], statement: "Durable, qualified prior knowledge that directly applies is retrieved, bounded, when safe and measurable and when it does not displace more important current authority or source context (F21)"}
  WCR-14: {section: "14. Capability selection is the same problem", kind: requirement, tracked_by: [F12, F13], statement: "Where AEW has qualified capability metadata it resolves intent to the cheapest adequate authorized capability, so the model reasons about the engineering problem, not which tool, MCP server, CLI, provider or harness feature answers a common structured request"}
  WCR-15: {section: "15. Preserve authority and truth", kind: invariant, tracked_by: [F34, F22, F21, F9, F13], statement: "Deterministic work conservation never weakens AEW's guarantees: derived answers are not authority; source stays source truth; evidence requirements stay; review and verification stay separate where required; stale, partial, unsupported or ambiguous derived data stays visibly qualified; absence from an incomplete map or index proves nothing; deterministic routing never widens role, Ticket, filesystem, network or workflow authority; a deterministic system never manufactures judgment; automation never silently crosses a Lead or operator decision boundary; model inspection of underlying evidence stays available for consequential judgment. Correctness and authority take precedence over cost"}
  WCR-16: {section: "16. Deterministic work must earn trust", kind: requirement, tracked_by: [F34, F22, F21], statement: "Deterministic machinery is preferred only when bounded, reproducible where appropriate, provenance-aware, source/revision bound where required, freshness-aware, qualified for the environment, failure-explicit and measurably more useful than asking the model; a bad deterministic answer is not an optimization; when AEW cannot answer confidently it exposes the limitation and escalates"}
  WCR-17: {section: "17. Cost is broader than dollars", kind: decision, tracked_by: [F34, F25], statement: "Costs include model input and output/reasoning tokens, frontier-model quota, rate-limit capacity, tool calls, wall-clock time, duplicate investigation, context-window consumption, worker stalls, retries, rework, operator attention and unnecessary invocations; a feature can be valuable with small dollar savings, and preserving scarce frontier capacity is itself a major objective"}
  WCR-18: {section: "18. Frontier-model conservation", kind: requirement, tracked_by: [F34, D5], statement: "Frontier-tier effort is preferentially kept for decomposition, architecture, premise validation, difficult interpretation, high-consequence judgment, cross-work synthesis, selective supervision, exception handling, replanning and work that cannot be economically decomposed, and is not routinely consumed by deterministic repository discovery, workflow choreography, polling, capability selection or repeated retrieval of known facts"}
  WCR-19: {section: "19. Heterogeneous-worker objective", kind: decision, tracked_by: [F34, F32], statement: "Deterministic work conservation supports heterogeneous execution (a frontier Lead with lower-cost bounded workers, middle-tier workers and frontier specialists when necessary) by reducing the repository, tool and workflow competence each subordinate model must have; a weaker model need not become a frontier model"}
  WCR-20: {section: "20. Success condition for repository tooling", kind: evaluation, tracked_by: [F22, F19], statement: "Project-map and navigation work succeeds when even a frontier-tier model rationally prefers AEW's navigation/query surfaces over repeated manual shell search for ordinary supported questions: faster, safer, more complete and more convenient than several ad hoc rg/find/grep operations; manual search remains an escape hatch and discovery fallback"}
  WCR-21: {section: "21. Required evaluation metrics", kind: evaluation, tracked_by: [F34, F22, F25, F19], statement: "Deterministic work conservation is measured, not assumed. Navigation metrics: tool calls and tokens before first relevant source access, tokens before first meaningful edit or finding, orientation wall time, repo-wide searches per Ticket, irrelevant files opened, fallback-to-search rate, missed related files and tests/mocks/fixtures, impact-query usefulness, correctly accepted outcome rate"}
  WCR-22: {section: "21. Required evaluation metrics", kind: evaluation, tracked_by: [F34, F15, F11, F25], statement: "Workflow and orchestration metrics: Lead turns spent on mechanical progression, manual stage commands per Ticket, wait/poll operations, scheduler decisions requiring no judgment, frontier-model tokens spent on workflow ceremony"}
  WCR-23: {section: "21. Required evaluation metrics", kind: evaluation, tracked_by: [F34, F9, F25], statement: "Multi-agent metrics: duplicate discovery rate, repeated repository-orientation work, cross-worker finding reuse, corrections without redispatch, frontier-model supervision tokens; F25 provides the usage/cost substrate where applicable"}
  WCR-24: {section: "22. Primary derived metric", kind: evaluation, tracked_by: [F34, F25], statement: "AEW estimates a useful-reasoning ratio (task-specific model effort over total model effort), through proxies such as navigation calls, mechanical workflow turns, duplicate discovery, rework and time-to-first-relevant-action; it need not be exact; the desired trend is upward"}
  WCR-25: {section: "23. Design review question", kind: process, tracked_by: [F34], statement: "Every significant future AEW feature or workflow is reviewed against the question 'Is the model being asked to do something AEW could safely and deterministically do itself?', and if so the design at least evaluates moving that work into the platform; an evaluation requirement, not an automation mandate: the answer may stay 'leave it to the model' when the deterministic path would be brittle, coverage is insufficient, inference is cheaper than the machinery, judgment is required, authority or provenance would weaken, or evaluation shows no benefit; but the question must be asked"}
  WCR-26: {section: "24. Non-goals", kind: decision, tracked_by: [F34], statement: "Deterministic-first, not deterministic-only: no requirement to solve every question deterministically, eliminate shell access or rg/grep/find, replace judgment with heuristics, index facts nobody needs, precompute every relationship, trade correctness for cost, hide uncertainty from the model, force automatic context injection when on-demand query is cheaper, use one fixed navigation or search implementation, or prevent expert models from inspecting raw source or using manual tools"}
  WCR-27: {section: "25. Relationship to current AEW work", kind: decision, tracked_by: [F34], statement: "The requirement is cross-cutting: no one subsystem owns it; each application has a primary owner (WCR-28 to WCR-33)"}
  WCR-28: {section: "T5 — project maps", kind: requirement, tracked_by: [F22, F22.1, F22.2, F22.3, F30], statement: "T5 (project maps) is the primary owner of deterministic repository orientation, locators, semantic relationships, test and constraint indexes, and impact assistance"}
  WCR-29: {section: "F15 / M5 — stage actions and scheduler", kind: requirement, tracked_by: [F15, F11], statement: "F15 and the M5 scheduler are the primary owners of removing workflow choreography and mechanically advancing legal work"}
  WCR-30: {section: "F9 — coordination", kind: requirement, tracked_by: [F9], statement: "F9 is the primary owner of avoiding duplicate discovery and enabling targeted reuse of worker findings"}
  WCR-31: {section: "F21 / knowledge system", kind: requirement, tracked_by: [F21], statement: "F21 and the knowledge system are the primary owner of avoiding rediscovery of useful prior project experience"}
  WCR-32: {section: "Capability registry", kind: requirement, tracked_by: [F12, F13], statement: "The capability registry is the primary owner of resolving intent to qualified tools and providers without models understanding the plumbing"}
  WCR-33: {section: "F25 — usage/cost ledger", kind: requirement, tracked_by: [F25], statement: "F25 is the primary measurement substrate for whether deterministic work conservation actually reduces model usage, time and expensive-model dependence"}
  WCR-34: {section: "26. North-star statement", kind: decision, tracked_by: [F34], statement: "AEW's second foundation, beside making engineering work controlled, attributable, recoverable and correct: do not spend model intelligence on work the platform can already solve; preserve model reasoning for the parts of engineering that require it and handle everything else deterministically where AEW can prove how to do so safely, for higher effective system intelligence, not merely lower token cost"}
  # ---- LWM: F9-A1, the Lead-worker messaging and adaptive supervision amendment v0.1 (adopted 2026-10-09; F9) -------
  LWM-01: {section: "1. Reason for amendment", kind: decision, tracked_by: [F9], statement: "F9 v0.1 deferred implementation until multi-agent behaviour showed the need, and the amendment states that evidence now exists (a strong Lead decomposing work for lower-cost bounded workers, finding drift by targeted inspection, and needing to correct the exact active worker); a relay agent created only to pass messages is not an acceptable steady state; durable Lead-worker messaging and adaptive Lead supervision become part of the intended operating model"}
  LWM-02: {section: "2. Operating hypothesis", kind: decision, tracked_by: [F9, F32], statement: "Optimize for one strong Lead supervising several tightly bounded workers, intervening selectively where higher-capability judgment has the greatest expected value: maximize useful Lead judgment per frontier-model token, not Lead utilization; an idle Lead is preferable to ceremonial or low-value spot checking"}
  LWM-03: {section: "3. Core requirement: first-class bidirectional messaging", kind: requirement, tracked_by: [F9], statement: "A durable, bounded, low-latency path between the current Lead generation and an active AEW invocation, without creating another model invocation: the Lead messages an exact active worker and the worker replies; the initial scope is Lead-worker, not unrestricted worker-worker chat; worker-to-worker information normally flows through Lead routing"}
  LWM-04: {section: "4. Message identity", kind: requirement, tracked_by: [F9], statement: "A coordination message has a stable AEW identity (illustratively message_id, sender, recipient, ticket, ticket_revision, invocation, optional in_reply_to, idempotency_key, kind, body, refs, created_at)"}
  LWM-05: {section: "Sender / recipient", kind: invariant, tracked_by: [F9], statement: "Senders and recipients are initially lead:<generation> or invocation:<id>; a worker communicates only within its admitted coordination surface; messaging never widens filesystem, tool, Ticket, role or workflow authority"}
  LWM-06: {section: "5. Reply chains", kind: requirement, tracked_by: [F9], statement: "An optional in_reply_to references another coordination message, permitting real conversations; AEW need not infer semantic agreement from the existence of a reply"}
  LWM-07: {section: "6. Idempotency", kind: requirement, tracked_by: [F9], statement: "Message submission is idempotent: the sender supplies or receives an idempotency key, and a retry after a lost transport response returns the existing message instead of a duplicate delivery"}
  LWM-08: {section: "7. Delivery versus durable identity", kind: requirement, tracked_by: [F9, F24], statement: "AEW records the message independently of any harness session, then attempts live delivery through the harness adapter; harness-native messaging (an OpenCode inbox or session delivery, Codex native delivery, a future transport, or continuation/recontextualization fallback) is transport, not authority, behind one AEW operation for the Lead; session loss never erases the record, and a relaunched invocation may receive unresolved relevant messages in its continuation context under the bounded-context rules"}
  LWM-09: {section: "8. Delivery facts", kind: invariant, tracked_by: [F9], statement: "Delivery states (RECORDED, DELIVERED, ACKNOWLEDGED, REPLIED_TO, UNDELIVERABLE) are communication facts only, never compliance, correctness, evidence acceptance, workflow completion or successful implementation; a reply may serve as acknowledgement, so explicit acknowledgement is not mandatory"}
  LWM-10: {section: "9. Message kinds", kind: requirement, tracked_by: [F9], statement: "Non-authoritative kinds (instruction, question, clarification, finding, blocker, status, acknowledgement, correction) aid routing and presentation and grant no workflow authority; a finding in a message stays coordination knowledge until it enters the Evidence or Knowledge path"}
  LWM-11: {section: "10. References instead of payload duplication", kind: requirement, tracked_by: [F9], statement: "Messages reference existing AEW artifacts (evidence, source, ticket@revision, finding) rather than copying large content, keeping the coordination layer bounded; raw worker transcripts and hidden reasoning are not coordination artifacts"}
  LWM-12: {section: "11. Messaging is not a workflow mutation channel", kind: invariant, tracked_by: [F9], statement: "Coordination may move knowledge; only existing authority paths move project state: a message may clarify a requirement, ask a question, point out an apparent miss, give a new evidence reference, request investigation within scope, report a blocker, request status or tell a worker to stop an approach, but never silently changes the objective, revises accepted acceptance criteria, widens scope, alters the risk class, grants capabilities, waives a gate, accepts evidence, satisfies review or verification or authorizes publication; a material change uses the normal Ticket revision, replan or supersession rules"}
  LWM-13: {section: "12. Adaptive Lead supervision", kind: requirement, tracked_by: [F9], statement: "Adaptive supervision, not mandatory periodic review: workers run independently, AEW surfaces potentially valuable supervision targets and the Lead chooses to do nothing, spot-check, ask, correct, route a finding, call a scoped sync, escalate or replan, or take over"}
  LWM-14: {section: "13. Supervision candidate projection", kind: requirement, tracked_by: [F9, F20], statement: "A derived read projection SupervisionCandidate (ticket, ticket_revision, invocation, reason, supporting refs, optional suggested action), an attention projection that is neither an AI quality score nor authority, with reasons initially from observable workflow facts (high risk class, rework or repeated rework, a long-running invocation, cross-component or multi-resource scope, policy-identified concurrency-sensitive work, a contradiction or blocker, reported uncertainty, a relevant sibling finding, weak requirement or evidence coverage, a deterministic overlap hint, a bounded random audit sample); absence from the list proves nothing"}
  LWM-15: {section: "14. Spot checking", kind: invariant, tracked_by: [F9], statement: "A spot check is a Lead supervisory action, not formal review or verification (to detect drift, challenge an assumption, inspect a high-risk invariant, check requirement coverage, inspect suspicious evidence or verify interpretation); it may end in no action, a message, a route, a sync, a rework request through the normal workflow, replan or escalation, or takeover, and never satisfies an acceptance gate"}
  LWM-16: {section: "15. Lead idle-time behavior", kind: requirement, tracked_by: [F9, F15], statement: "While workers run, the Lead loop is: dispatch, wait-any or the attention surface, and while nothing needs immediate action inspect the highest-value candidate if worthwhile, message, route or sync, and return to waiting; AEW need not keep the Lead generating tokens, and waiting is correct when no candidate has sufficient expected value"}
  LWM-17: {section: "16. Adaptive collaboration target", kind: decision, tracked_by: [F9], statement: "Of the four interaction policies (A isolated, no proactive supervision; B available, messaging with Lead-initiated supervision only; C adaptive/encouraged, AEW surfaces high-value candidates and encourages selective intervention; D forced, periodic or mandatory checks regardless of value), F9's design target is C; triggers, thresholds and budgets stay tunable through evaluation, and no universal spot-check frequency is frozen before measurement"}
  LWM-18: {section: "17. Routing worker discoveries", kind: requirement, tracked_by: [F9], statement: "A worker's discovery relevant to other active workers goes to the Lead, who determines blast radius: targeted messages to the affected workers for narrow impact, a scoped standup or sync for broad or uncertain impact; the Lead remains the routing intelligence and unrestricted peer messaging is not required"}
  LWM-19: {section: "18. Standups remain selective", kind: requirement, tracked_by: [F9], statement: "A standup stays a higher-cost convergence mechanism for discoveries affecting several workers or needing shared reconciliation, never for every update; escalation: a single-worker issue by direct message, a few known affected workers by targeted routed messages, broad, contradictory or uncertain impact by a scoped standup, an invalidated plan or objective by the normal replan or authority path"}
  LWM-20: {section: "19. Supervision telemetry", kind: requirement, tracked_by: [F9, F25], statement: "Bounded supervision telemetry (illustratively a SupervisionEvent with ticket, invocation, trigger, action, related messages, refs, timestamp; actions spot_check_no_action, message_sent, finding_routed, sync_opened, rework_triggered, takeover) to understand coordination behaviour, cost and effectiveness; it is not engineering evidence"}
  LWM-21: {section: "20. Evaluation", kind: evaluation, tracked_by: [F9, F19, F25], statement: "Adaptive supervision is tested empirically against A no proactive supervision, B messaging only, C AEW-recommended adaptive supervision and D mandatory periodic supervision, holding model, task and environment factors as constant as practical, measuring correctly accepted outcomes, requirement misses, defects caught before formal review, rework cycles, in-place corrections, Lead and worker tokens, total cost, wall time, Lead idle time, unnecessary interventions, messages per Ticket and per successful correction, standups opened, discoveries routed to siblings and formal-review defects earlier spot checks missed; F25 supplies cost; the intervention policy is learned, not assumed"}
  LWM-22: {section: "21. Worker-model qualification relevance", kind: requirement, tracked_by: [F32, F9], statement: "Execution profiles may eventually be characterized by observed supervisory needs (bounded-Ticket reliability, rework and supervision frequency, independent-review qualification, long-horizon reliability), empirically and never as model-name folklore encoded in workflow logic"}
  LWM-23: {section: "22. Relationship to heterogeneous worker operation", kind: gate, tracked_by: [F9, F32], statement: "Not a block on current M4 experimentation; but before substantial heterogeneous lower-tier worker fanout becomes a normal production operating mode, the deployment has a qualified supervision path: observe, target a worker, deliver a durable message, receive the reply, inspect the resulting work, route wider impact, open a sync when needed"}
  LWM-24: {section: "23. Dashboard / workbench requirement", kind: requirement, tracked_by: [F9, F20], statement: "Coordination is inspectable in relation to the work that caused it, not as a global chat log: read projections navigate by Ticket, Ticket revision, attempt, invocation, message thread and Lead generation, and a Ticket view reconstructs the coordination chain so the operator can answer why a large corrective action occurred without hunting through unrelated transcripts"}
  LWM-25: {section: "24. UI causality rule", kind: invariant, tracked_by: [F9, F20], statement: "The dashboard never infers causality from timestamp proximity: it renders relationships the backend supplies (a message sent to an invocation for a Ticket revision, an explicit reply, a referenced Evidence, a later revision) and leaves missing relationships unknown"}
  LWM-26: {section: "F9-A — first-class messaging", kind: sequencing, tracked_by: [F9], statement: "F9-A, the minimum useful coordination core: durable Lead-to-worker message, worker-to-Lead reply, message identity, in_reply_to, idempotency, bounded refs, live harness delivery, session-loss and relaunch behaviour, Ticket/revision/invocation bindings, read projections, and resume/attention integration as appropriate"}
  LWM-27: {section: "F9-B — structured worker coordination", kind: sequencing, tracked_by: [F9], statement: "F9-B builds the existing F9 v0.1 concepts: progress, finding, question and blocker updates, Lead routing, relevant bounded deltas, scoped sync or standup, contradiction preservation"}
  LWM-28: {section: "F9-C — adaptive supervision", kind: sequencing, tracked_by: [F9, F20], statement: "F9-C adds the supervision-candidate projection, the targeted spot-check workflow, Lead intervention telemetry, routing from a spot-check result to the exact worker, and Ticket-linked dashboard presentation; initially advisory, with the Lead as decision maker"}
  LWM-29: {section: "F9-D — empirical tuning / scheduler assistance", kind: sequencing, tracked_by: [F9, F11, F19], statement: "F9-D evaluates the A/B/C/D supervision modes and tunes triggers, thresholds, sampling, budget, candidate prioritization and standup escalation; stable defaults are promoted only after measured results"}
  LWM-30: {section: "26. Preserved F9 invariants", kind: invariant, tracked_by: [F9], statement: "The amendment leaves F9 v0.1's invariants unchanged: coordination is not authority; routed information cannot widen scope; a coordination statement is not automatically Evidence; messaging cannot materially revise an assignment; material scope changes use normal revision or supersession; standup consensus cannot satisfy review or verification; contradictions stay attributable; hidden reasoning and raw transcripts are not coordination state; relevance hints stay advisory; absence of a hint does not establish independence; session loss must not erase important coordination state; Lead routing stays the default cross-worker propagation"}
  LWM-31: {section: "27. New amendment invariants", kind: invariant, tracked_by: [F9, F20], statement: "New invariants 13 to 22: the Lead can communicate with an active admitted worker without spawning an invocation solely for transport; submission is idempotent; every durable message identifies sender, recipient and work/invocation context; harness messaging is transport and AEW owns coordination identity and provenance; worker replies never acquire Lead or workflow authority; spot checks never satisfy review or verification gates; supervision recommendations stay advisory; AEW never forces expensive supervision to keep a Lead busy; coordination read projections keep enough Ticket/revision/invocation identity for the operator to understand corrective actions; the frontend never infers causal relationships the backend did not record"}
  LWM-32: {section: "28. Acceptance intent", kind: evaluation, tracked_by: [F9], statement: "F9-A1 succeeds when AEW demonstrates end to end: the Lead dispatches several bounded workers, sees a worthwhile supervision target, spot-checks, sends a correction to the exact active invocation, the worker receives it without redispatch, replies and corrects the work, the Lead routes a discovered fact to another affected worker, a broader issue escalates to a scoped sync, and the operator can later inspect the whole chain from the Ticket; with no relay agent, no message becoming workflow authority, no worker receiving unrelated global coordination context, and the cost and effectiveness of proactive supervision measurable and tunable"}
  # ---- LWA: the operator and designer's F9-A1 adoption decision (2026-10-09; F9, F19) ---------------------------------
  LWA-01: {section: "2. The decision, recorded as given", kind: decision, tracked_by: [F9], statement: "Q1 YES: adopt F9-A1 v0.1 as governing"}
  LWA-02: {section: "2. The decision, recorded as given", kind: sequencing, tracked_by: [F9], statement: "Build F9-A first"}
  LWA-03: {section: "2. The decision, recorded as given", kind: sequencing, tracked_by: [F9], statement: "F9-B may proceed after F9-A technical qualification"}
  LWA-04: {section: "2. The decision, recorded as given", kind: sequencing, tracked_by: [F9], statement: "F9-C is evidence-gated"}
  LWA-05: {section: "2. The decision, recorded as given", kind: sequencing, tracked_by: [F9, F19], statement: "F9-D remains empirical tuning"}
  LWA-06: {section: "2. The decision, recorded as given", kind: decision, tracked_by: [F9, F19], statement: "Q2: keep F9 messaging OFF in frozen M4-H; do not amend the treatment"}
  LWA-07: {section: "2. The decision, recorded as given", kind: requirement, tracked_by: [F9], statement: "Build F9 messaging behind a switch with disabled-state identity tests"}
  LWA-08: {section: "2. The decision, recorded as given", kind: evaluation, tracked_by: [F19, F9], statement: "Then evaluate messaging separately in F19 using the F9 A/B/C/D supervision arms"}
  LWA-09: {section: "2. The decision, recorded as given", kind: decision, tracked_by: [F9], statement: "§4 of the ask: no blocking objections; all other listed implementation choices stand"}
  LWA-10: {section: "2. The decision, recorded as given", kind: decision, tracked_by: [F9], statement: "Transport is provisional on the planned OpenCode live-delivery probe"}
  LWA-11: {section: "2. The decision, recorded as given", kind: decision, tracked_by: [F9], statement: "'No polling' means no model-driven polling; implementation-level event/wait mechanics remain implementation-local"}
  LWA-12: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9], statement: "Transport (provisional, LWA-10): on the pinned OpenCode 2.0.18, live delivery uses the server's POST /api/session/{sessionID}/prompt on the worker's own session, which is in the pinned OpenAPI fixture; a probe will confirm behaviour while the worker is mid-turn; the default is delivery at the next turn boundary, never a forced interrupt"}
  LWA-13: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9], statement: "'Stop this approach' is a message; stopping the invocation is not: ending a worker stays on the existing invoke cancel and relaunch paths, so a message never doubles as an authority action (F9-A1 §11)"}
  LWA-14: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9, F15.3], statement: "The worker's reply path is a new aew-run bridge operation, so requests go through the supervisor and the credential stays supervisor-side; this applies the designer's ruling on worker tool delivery (KDR-01, KDR-02): no new worker credential surface"}
  LWA-15: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9, F15], statement: "The Lead's send path is a typed-surface tool, message.send, classified non-dispatching and authority-free, bound to the current Lead generation; a superseded generation's message is refused, not delivered"}
  LWA-16: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9], statement: "Messages are append-only coordination records beside control state, not in the hot control document; bound to invocation, work unit and, on F4-enabled projects, Ticket revision; bounded in size and count, with references rather than payloads (F9-A1 §10)"}
  LWA-17: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9, F15.5], statement: "The Lead learns of replies through the attention and resume projections and, once M4-E's E7 lands, the broker's notifier; there is no polling (in the sense of LWA-11)"}
  LWA-18: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9], statement: "Worker replies are model-authored data, rendered fenced and escaped like all model text, and never instructions to the Lead's tooling"}
  LWA-19: {section: "3. The implementation choices it accepts (the ask's §4)", kind: decision, tracked_by: [F9, F20], statement: "Read projections (F9-A1 §23, §24) are added after F9-A through a dashboard contract bump, the same pattern as the maps/search plan; the UI is the web developer's"}
  # ---- AEA: the agent-effectiveness research adoption (designer and operator, 2026-10-09; F34 and its owner rows) ----
  AEA-01: {section: "1. BLUF", kind: decision, tracked_by: [F34], statement: "The research is accepted with three designer revisions; AEW does not need a new agent-effectiveness subsystem: it should finish and connect existing context-pack, project-map, Knowledge, worker-tool, impact, coordination, attention and evaluation machinery"}
  AEA-02: {section: "1. BLUF", kind: requirement, tracked_by: [F34], statement: "The goal is two-sided: weak-worker amplification (give weaker models every safe deterministic advantage AEW can provide so they spend less capability on repository discovery, tool selection, task reconstruction and remembering what they were doing) and frontier conservation (give Astra-class models excellent helpers and high-signal state without forcing them through hand-holding abstractions that may be slower than expert raw tooling)"}
  AEA-03: {section: "1. BLUF", kind: requirement, tracked_by: [F32, F35, F15.8], statement: "The profile asymmetry is deliberate (Astra-class: raw expert tools, typed helpers, maps/Knowledge, high-signal context and deltas, helpers used when useful without constraining expert behaviour; weak/lower-bound: explicit orientation, typed helpers prominently presented, bounded source/test/constraint locators, Knowledge/history lookup, platform-owned recitation on long runs, completion-impact assistance, raw tools as the escape hatch); AEW should optimize each profile for effective engineering performance inside the same authority architecture; do not encode model names into workflow semantics"}
  AEA-04: {section: "2. Source research disposition", kind: decision, tracked_by: [F35], statement: "R8 Task Context Compilation: no new component; improve the existing ContextPacks / knowledge/context.py"}
  AEA-05: {section: "2. Source research disposition", kind: decision, tracked_by: [F15.8], statement: "R9 Intent-Level Capability Resolution: no giant semantic facade; extend the existing typed role surface and provider-resolution layers"}
  AEA-06: {section: "2. Source research disposition", kind: decision, tracked_by: [F36], statement: "R2-B Weak-Model Working State: reject model-maintained structured state; use platform-owned recitation plus the already-recommended bounded handoff note"}
  AEA-07: {section: "2. Source research disposition", kind: decision, tracked_by: [F30], statement: "E1 Pre-Completion Impact Nudge: implement/probe as a T5/impact/validation extension; never a gate merely because something is related"}
  AEA-08: {section: "2. Source research disposition", kind: decision, tracked_by: [F15.9], statement: "E2 Delta-First Lead Attention: implement/probe as a projection over existing outbox/ActionProjection/F9/R3/F20/M5 state; no new store"}
  AEA-09: {section: "2. Source research disposition", kind: decision, tracked_by: [F35, F15.8, F36, F30, F15.9], statement: "The research's simplest-system recommendation is accepted in spirit: better context packs with locators; useful typed reads for workers; platform-owned recitation on long runs; one bounded impact/completeness query; one delta query for the Lead"}
  AEA-10: {section: "REVISION A — Preserve workspace-bounded lexical fallback", kind: invariant, tracked_by: [F15.8], statement: "Rejecting a broad free-text repo.search operation is acceptable only if ordinary bounded lexical search remains available beneath the intent layer: a worker must not need to construct its own repository root merely to perform ordinary textual search inside its authorized workspace; if map.find cannot resolve the request from maps/indexes AEW may internally fall back to workspace-rooted rg or an equivalent qualified provider; the public operation name is implementation-local; raw rg/shell access is not removed from strong profiles"}
  AEA-11: {section: "REVISION B — Do not silently alter frozen M4-H treatment", kind: gate, tracked_by: [F19, F35, F15.8, F36, F30, F15.9, F22.3], statement: "Nothing in this research automatically changes the frozen M4-H experiment: a structural/context change considered necessary for M4-H representativeness is explicitly identified as a treatment change, the experiment manifest/preregistration amended and re-frozen before running; otherwise it lands/is evaluated after the existing M4-H gate; no invisible treatment drift under the label implementation-local"}
  AEA-12: {section: "REVISION C — Bound the F19 harness-session reader", kind: requirement, tracked_by: [F19], statement: "Evaluator-side use of the retained harness session database is approved with a narrow contract: after an experimental run completes the hidden F19 evaluator opens the session DB read-only, extracts only preregistered measurement fields, computes named/versioned metrics and records the evaluation result; the raw DB is retained only for the configured evaluation-retention window"}
  AEA-13: {section: "REVISION C — Bound the F19 harness-session reader", kind: invariant, tracked_by: [F19], statement: "The AEW runtime does not consume the session database; it does not become a general Knowledge or supervision source; the evaluator does not opportunistically ingest arbitrary conversational content; retention is bounded and operator-configured; use is evaluation-only under F19 isolation rules"}
  AEA-14: {section: "4. Context-pack direction (R8)", kind: decision, tracked_by: [F35], statement: "Do not create a standalone Context Compiler service/component; context compilation is the behaviour of the existing context-pack machinery"}
  AEA-15: {section: "4. Context-pack direction (R8)", kind: requirement, tracked_by: [F35], statement: "Implementation direction: a per-role serving policy (mandatory / opportunistic / on-demand / prohibited); derived-section rendering includes source, revision, freshness, coverage/limitations and an expansion reference; execution-profile operational knobs may include context.budget_chars, context.orientation_max_chars and context.orientation = minimal | standard | explicit; criteria/objective may be repeated in an explicit weak-profile orientation mode if evaluation supports it; inputs should prefer declared anchors and deterministic locators before broad context"}
  AEA-16: {section: "4. Context-pack direction (R8)", kind: sequencing, tracked_by: [F21, F35], statement: "Knowledge stays on-demand/tool-driven until M6b Arm B is measured"}
  AEA-17: {section: "4. Context-pack direction (R8)", kind: requirement, tracked_by: [F35, F22], statement: "Stale/partial derived information must be visibly qualified"}
  AEA-18: {section: "Review/verifier independence", kind: requirement, tracked_by: [F35, F21], statement: "Do not exclude all same-Ticket history: independent review means fresh/bounded context and exclusion of current implementer reasoning/private working state by default; canonical same-Ticket material may still be necessary (objective/requirements, accepted plan, implementation diff, check results, unresolved review findings, verification failures/evidence, governing decisions); the context-pack/request-binding policy, not model query text, enforces independence (consistent with KDR-03 to KDR-05)"}
  AEA-19: {section: "5. Typed worker read surface (R9)", kind: requirement, tracked_by: [F15.8], statement: "The worker-facing read tools should extend the existing aew-run supervisor bridge (worker model, a typed role-side client inside the worker boundary, the supervisor bridge, then the authorized map / Knowledge / Evidence / check provider); credentials remain supervisor-side"}
  AEA-20: {section: "5. Typed worker read surface (R9)", kind: requirement, tracked_by: [F15.8, F21], statement: "Initial high-value operations may include map.find, map.symbol, map.callers, map.callees, map.tests_for, map.constraints, map.changed, knowledge.search, knowledge.get, evidence.show and check.suggest, beside the existing whoami, check.run and submit; exact names remain implementation-local unless already frozen elsewhere"}
  AEA-21: {section: "Tool-presentation policy", kind: requirement, tracked_by: [F15.8, F19], statement: "Do not force one presentation policy on all models: a profile-level operational knob tools.presentation = raw-first | neutral | typed-first; expected posture strong/frontier likely raw-first or neutral, weak/lower-bound likely typed-first, actual defaults earned by measurement; typed helpers supplement raw tools and do not replace shell/Git/rg for expert models"}
  AEA-22: {section: "6. Weak-model working-state direction (R2-B)", kind: decision, tracked_by: [F36], statement: "Do not build a model-maintained structured working-state store, mandatory self-refresh, a new authority/record type for scratch state, or Lead access to raw private chain-of-thought or raw harness-session content"}
  AEA-23: {section: "Bounded handoff note", kind: requirement, tracked_by: [F36], statement: "Finish the already-recommended run handoff/working-note path: bounded; worker-authored; claim/reference, not authority; useful to a replacement invocation; may cite paths/evidence IDs; does not automatically become Knowledge"}
  AEA-24: {section: "Platform-owned recitation", kind: requirement, tracked_by: [F36, F19], statement: "On sufficiently long/complex weak-profile runs AEW may synthesize a zero-model-cost recitation from canonical/derived state (for example goal / active criterion, remaining criteria, plan tasks, changed files vs planned scope, checks performed, open findings/blockers, the latest bounded handoff note); AEW derives and restates what it already knows and the weak model is not required to maintain a second state system; thresholds/cadence are operational and must be evaluated"}
  AEA-25: {section: "7. Completion-impact nudge (E1)", kind: requirement, tracked_by: [F30, F22.3, F19], statement: "Fold into T5 impact + implementation validation: before request_review AEW may surface a bounded high-confidence set of related-but-untouched surfaces, which the worker may disposition as addressed, unaffected or unsure; advisory by default; relation does not prove modification is required; no gate merely because an item is related; cap output aggressively; show uncertainty/coverage; one computed impact surface for worker, reviewer and later supervision consumers; evaluate false-positive and dismissal rates"}
  AEA-26: {section: "8. Delta-first Lead attention (E2)", kind: requirement, tracked_by: [F15.9, F19], statement: "Fold into existing Lead/attention/supervision machinery with one typed changes-since-cursor style query over existing committed events/projections: full status / resume remains available; no second event/state store; the cursor binds to existing revision/event-watermark semantics; decisions required, blockers and high-value supervision candidates remain prominent; measure whether delta-first saves Astra turns/tokens without hiding material developments"}
  AEA-27: {section: "Laguna is not currently available", kind: decision, tracked_by: [F19, F32, F18.13], statement: "Laguna S2.1 remains the reference default-worker architecture target but is not currently available in the operator's environment; do not gate R8/R9/R2-B work on its availability; use capability-class lanes (frontier: Astra-class / strongest available Lead model; mid: a qualified model through the operator's OpenAI API account; weak/lower-bound: a qualified OpenCode free or inexpensive model, a stress specimen, not a Laguna substitute); record exact provider/model/harness/effective profile at preregistration; if Laguna becomes available later, run the same profile-neutral suite"}
  AEA-28: {section: "Lower-bound pre-M4-H fixture", kind: gate, tracked_by: [F19], statement: "The lower-bound qualification lane may run before M4-H on an independent non-held-out fixture, in preferred order: a sanitized/public several-hundred-file repository; a purpose-built synthetic representative repository; the Q7 repository without sealed tasks only if a repo-specific integration probe genuinely requires it; never expose Q7 sealed tasks before the gate; pre-gate lower-bound results are qualification/instrumentation evidence only, not M4-H/F19 efficacy claims"}
  AEA-29: {section: "10.1 Pull the `aew-run` read half forward", kind: decision, tracked_by: [F15.8, F15.3, F13], statement: "APPROVE: do not wait for the complete M6a capability registry to expose safe worker read/query operations if the existing bridge can host them compatibly"}
  AEA-30: {section: "10.2 F19 evaluator-side session DB reader", kind: decision, tracked_by: [F19], statement: "APPROVE WITH BOUNDS described in §3 Revision C (AEA-12, AEA-13)"}
  AEA-31: {section: "10.3 Weak/lower-bound profile", kind: decision, tracked_by: [F19, F32], statement: "Use a currently available qualified free/inexpensive OpenCode model for the lower-bound lane, plus an available OpenAI API model where useful for a middle profile; Laguna remains a future reference target"}
  AEA-32: {section: "11. Required roadmap/register integration", kind: process, tracked_by: [F34], status: "done: the register rows and the implementation delta of 2026-10-09 (docs/implementation/agent-effectiveness-implementation-delta-2026-10-09.md)", statement: "Update the implementation plan/register rather than produce new architecture for these findings"}
  AEA-33: {section: "Raise / pull forward", kind: sequencing, tracked_by: [F22.3, F15.8, F36, F19, F35, F22.1], statement: "Raise or pull forward: T5-D / F22.3 test relationship index and constraint locators; the F15.3 aew-run read half before full M6a where dependencies allow; the R2 bounded handoff-note implementation; the F19 evaluator metric reader/instrumentation; the reviewer layout/orientation row and Lead structural-map/resume support where already owned by T5/context work"}
  AEA-34: {section: "Refine existing entries", kind: sequencing, tracked_by: [F30, F15.9, F9, F20.7, F11, F35, F36, F15.8], statement: "Refine existing entries: T5/F30 impact work gets the first bounded completion-impact slice; F9/F20/M5 the delta-first Lead projection and later supervision candidates; the execution-profile schema context budget/orientation, the tool-presentation mode and recitation operational thresholds; the context-pack serving policy and independence filter"}
  AEA-35: {section: "Refine existing entries", kind: process, tracked_by: [F9], status: "done: F9-A1 was ingested on 2026-10-09 (PR #145) as a proposal, ledger LWM, and adopted as governing the same day (decision record docs/design/decisions-2026-10-09-f9-a1-adoption.md, ledger LWA); it is docs/design/f9-a1-lead-worker-messaging-and-adaptive-supervision-amendment-v0.1.md", statement: "F9-A1 should be formally ingested if still only tracked as an external/unmerged design artifact"}
  AEA-36: {section: "After M6b Arm B", kind: sequencing, tracked_by: [F21, F15.8], statement: "After M6b Arm B expose knowledge.search and knowledge.get through the same aew-run read surface; do not automatically inject Knowledge into worker context before Arm B evaluation earns it"}
  AEA-37: {section: "12. Evaluation work, not default policy", kind: evaluation, tracked_by: [F19, F35, F15.8, F36, F30, F15.9], statement: "Build enough substrate to run the F19 probes (R8 pack arms; R9 raw-first / neutral / typed-first arms; R2-B no support / handoff / recitation / recitation + Lead view; E1 completeness-nudge arms; E2 full / delta available / delta-first Lead view), but do not make their aggressive modes default until measured"}
  AEA-38: {section: "12. Evaluation work, not default policy", kind: evaluation, tracked_by: [F19, F34], statement: "The primary measure remains independently verified correctly accepted outcomes; also measure tokens, frontier-model tokens separately, tool calls, time to relevant source, repeated exploration, repository-wide searches, missed related surfaces, worker drift/restarts, Lead interventions, context size, stale-context reliance, false-positive nudges, voluntary typed-helper usage and full-view fallback rate"}
  AEA-39: {section: "13. Explicit non-goals / rejected expansions", kind: decision, tracked_by: [F34], statement: "Do not build from this research: a standalone Context Compiler service; a second capability registry; one giant free-text semantic facade; forced typed-tool-only operation for Astra-class models; model-name-specific workflow semantics; automatic Knowledge injection before Arm B; a model-maintained working-state store; mandatory scratch-state refresh; Lead access to raw worker scratch/chain-of-thought; a relation-derived completeness gate; a second attention/event store; peer-worker inspection outside existing coordination/supervision policy"}
  AEA-40: {section: "14. Related designer clarification — reviewer independence", kind: requirement, tracked_by: [F21, F35], statement: "Worker Knowledge lookup remains a default capability; for independent reviewer/verifier roles: exclude current implementer reasoning/private scratch by default; do not blanket-exclude all same-Ticket canonical history; preserve required unresolved findings, verification failures, accepted plans, checks and canonical Evidence; deeper historical prose may require the qualified investigation mode; enforce the filter in engine/context request binding (a repeat of KDR-03 to KDR-05, adding where it is enforced)"}
  AEA-41: {section: "15. Related designer clarification — Ticket parent changes vs promotion", kind: requirement, tracked_by: [F4], statement: "For E19-B implementation an ordinary revision may not change a committed Ticket from one parent to another; arbitrary re-parenting requires a replacement Ticket with explicit lineage; this applies even if work has not yet started, once the Ticket identity is committed; an uncommitted/draft Ticket may correct its parent before identity becomes governing"}
  AEA-42: {section: "15. Related designer clarification — Ticket parent changes vs promotion", kind: requirement, tracked_by: [F4, F5], statement: "KC §9.4 promotion is a distinct hierarchy-expansion operation: it remains allowed after work starts and preserves original Ticket identity, evidence/history, the effective risk/class floor and inherited non-waivable gates/guardrails"}
  AEA-43: {section: "15. Related designer clarification — Ticket parent changes vs promotion", kind: invariant, tracked_by: [F4, E19], statement: "Until implementation text is updated, fail closed on ambiguous re-parenting"}
  AEA-44: {section: "16. Planning instruction to Opus", kind: process, tracked_by: [F34], status: "done: docs/implementation/agent-effectiveness-implementation-delta-2026-10-09.md, with the register rows it names; every item carries one of the six classes and every delta item all eight fields (completed in the review of PR #150)", statement: "Incorporate the handoff into the implementation plan/register without reopening frozen architecture unless integration reveals an actual contradiction; classify every item as existing item — no change, existing item — priority/sequence change, implementation-local refinement, F19 probe, editorial contract clarification or true design gap; escalate only true design gaps; for implementation-local choices choose the simplest conservative design consistent with governing contracts and proceed; produce an ordered implementation delta with, per item, the existing owner/register item, dependency, exact new work, sequencing change, completion criterion, probe/evaluation dependency, whether it can proceed before M4-H and whether it requires operator/designer action"}
  AEA-45: {section: "16. Planning instruction to Opus", kind: decision, tracked_by: [F34], statement: "The design objective is not to add more AEW machinery: give weaker models every safe deterministic advantage they need, give frontier models every useful tool without getting in their way, and move model effort away from rediscovery and ceremony toward engineering reasoning"}
  # ---- AES: the agent-effectiveness and model-leverage synthesis v0.1 (research, 2026-10-09; read through AEA) ------
  AES-01: {section: "2. R8 — Task context compilation", kind: requirement, tracked_by: [F35, F22.1, F22.3, F21], statement: "R8's additions to ContextPacks + knowledge/context.py: the serving-policy table as archetype data, test-enforced; the rendering convention (source, revision, freshness, coverage in the heading, one flat item per line with an expand: pointer to the typed operation, degraded sections as one labelled line, criteria repeated last under orientation: explicit); the budget actually passed from the execution profile; the independence filter at two points (the pack's prohibited rows; a source-kind exclusion on the reviewer's and verifier's Knowledge request binding) with sentinel tests, reviewers keeping canonical same-Ticket history; inputs in order of value per cost (structural rows for scope paths with freshness, the reviewer's layout row and the structural map in the Lead's resume, tests naming scope paths and constraint locators, L1 symbol rows when the language has an extension, Knowledge only as a tool until Arm B is measured)"}
  AES-02: {section: "2. R8 — Task context compilation", kind: evaluation, tracked_by: [F19, F35], statement: "R8 experiment: arms A (today), B (structural switch), C (B + test and constraint locators), D (C + Knowledge tool), E (C under explicit with a profile budget); Q7 F1/F2 plus small-task, stale-orientation, partial-map and wrong-plan controls; weak and strong profiles; primary measure correctly accepted outcome; stop if nothing beyond B moves outcomes or orientation cost, and fail any arm that raises stale reliance or anchoring"}
  AES-03: {section: "3. R9 — Intent-level capability resolution", kind: requirement, tracked_by: [F15.8, F13], statement: "R9: eleven operations in three namespaces (map.*, knowledge.*, evidence.show and check.suggest on aew-run) under one result envelope (T5 §7.2's terminal state, coverage, freshness, evidence locators, omitted counts); resolution exact, then stored relation, then labelled weaker evidence, then NOT_SUPPORTED, never to a model; provider choice below the operation, in F13; delivery by bridge.OPERATIONS rows and the F15.3 stdio server with the credential supervisor-side; raw tools unchanged and the repo.* names as L0 awareness text; rejects a single semantic facade, a free-text repo.related, a repo.search operation (accepted by AEA-10 only with a workspace-bounded lexical fallback beneath the intent layer) and worker-side work.inspect"}
  AES-04: {section: "3. R9 — Intent-level capability resolution", kind: evaluation, tracked_by: [F19, F15.8], statement: "R9 experiment: arms raw / both / typed-first on a deterministic question set (locate, tests, impact, history, validation, unsupported) plus Q7 F1 tasks; weak, mid and strong profiles; voluntary typed use measured from bridge outcome counts under ordinary discoverability only; stop if the strong profile is better raw and the weak profile does not improve"}
  AES-05: {section: "4. R2-B — Weak-model working state", kind: requirement, tracked_by: [F36, U1, F9], statement: "R2-B: goal, criteria and plan tasks are durable and restated by AEW, progress (changed vs affected_paths, checks recorded) is derived, facts and hypotheses stay in the model's scratch or its handoff note of at most 2 KiB; a recitation (criteria, plan tasks, progress, last note, open findings, which criterion the current step serves) assembled by the supervisor at zero model cost, delivered through the inbox on a runtime trigger (calls or elapsed) and recorded like harness send, a durable instruction under F9-A; trivial Tickets never cross the trigger; a deterministic progress block in harness_status and a repetition field in H1's note; drift measured by trajectory shape; the worker-published working_note deferred to F9-B"}
  AES-06: {section: "4. R2-B — Weak-model working state", kind: evaluation, tracked_by: [F19, F36], statement: "R2-B experiment: arms none / note / recite / recite + Lead progress view; Q7 F2 plus seeded multi-criteria, disproven-hypothesis, interrupted, cross-ticket, distractor and a trivial control; stop if recitation does not reduce repetition, forgotten criteria or restarts, or raises stale-note reliance"}
  AES-07: {section: "5. E1 and E2 — integration recommendations", kind: requirement, tracked_by: [F30, F22.3, F9, F19], statement: "E1 is the first slice of F30's aew impact --changed, showing only relations that clear a 10% effective false-positive bar (tests naming a changed symbol or path, changed generated or vendored files, schema and constraint locators naming a changed symbol, git co-change above a support and confidence threshold, compiler-known callers when a semantic extension exists), uncertainty first, at most eight items with the omitted count; the worker dispositions each item in self_review.related_surfaces (unaffected | addressed | unsure); the reviewer's pack renders the same surface by hash; F9-C turns undispositioned items into a candidate reason; never a gate; probed on Q7 F1 with a localized control, any relation above the bar dropped, on-demand if the dismissal rate exceeds 25% or nothing is caught"}
  AES-08: {section: "5. E1 and E2 — integration recommendations", kind: requirement, tracked_by: [F15.9, U1, F9, F19], statement: "E2 is one typed changes {since_revision, since_observed?} query over outbox.read_transitions plus the projection's derived deltas (newly available actions, newly bound decisions, run and health transitions, new submissions and check results, commits since per worktree, the R2-B progress block, F9 messages when they exist), a suppression list, an always-present section (decisions required, blockers, supervision candidates), one line per item with an expand: ref and a size cap; status and resume unchanged as the full view; the cursor is the revision the Lead holds and the second cursor U1/H1's telemetry watermark; no store; probed as the Lead-surface factor in F9-D's A/B/C/D, default-on only after measurement"}
  AES-09: {section: "6. Overlaps and contradictions among the mechanisms", kind: requirement, tracked_by: [F35, F30, F15.9, F20.7, F36, F21], statement: "Shared surfaces are computed once: the pack is L0/L1 for declared anchors only and every pack row carries the operation that expands it; one impact computation (surface_sha256) for E1, the reviewer's row and F9-C; one worktree-against-plan diff in harness_status for R2-B, E1 and E2; one outbox reader and one cursor for changes, F20.7's /events and harness_wait; work.inspect is Lead-only and a worker never inspects a peer; the recitation is a bounded message on an observable trigger, not a supervision act; reviewers and verifiers keep lookup and the request binding filters implementer prose kinds for the Ticket under review, nothing else"}
  AES-10: {section: "6. Overlaps and contradictions among the mechanisms", kind: decision, tracked_by: [F35, F19], statement: "Richer context can poison (the T4 case, context-rot evidence), so B (the structural switch) is the only candidate default before measurement; repo.related and repo.search are rejected as operations; working state is not model-maintained"}
  AES-11: {section: "7. Changes required to existing AEW designs", kind: requirement, tracked_by: [F35, F15.8, F36, F15.4], statement: "None governing; the archetype schema gains context.orientation tiers beside context.knowledge with a conformance test per role, and the execution profile schema gains context.budget_chars, context.orientation_max_chars, context.orientation, tools.presentation and recitation.{calls, elapsed_s, every}, all proposed as operational under F15.4; mapping a capability class to a setting is a measured deployment policy, never workflow semantics"}
  AES-12: {section: "7. Changes required to existing AEW designs", kind: requirement, tracked_by: [F36, F30], statement: "The evidence schema gains an optional handoff_note (R2), self_review.related_surfaces[] and surface_sha256 (E1)"}
  AES-13: {section: "7. Changes required to existing AEW designs", kind: requirement, tracked_by: [F15.9], statement: "The typed Lead surface catalog gains one query tool, changes (or since on status), a catalog addition the designer signs (typed Lead surface v0.2 §3.1 is the v1 catalog)"}
  AES-14: {section: "7. Changes required to existing AEW designs", kind: requirement, tracked_by: [E19], statement: "Editorial lines at the E19 re-freeze: KC §15.4 locations delivered as labelled locators; WC §10.1 excludes implementer working state; a role's handoff note is a bounded claim for its successor (a WC §9.10 analogue)"}
  AES-15: {section: "8. Implementation sequencing", kind: sequencing, tracked_by: [F35, F22.1, F22.3, F15.8, F15.9, F36, F9, F21, F19, U1], statement: "Ordered by dependency and value, each step shippable alone: (1) F22.1 PR B, the reviewer's layout row, the pack budget and context.orientation from the profile, the R2 handoff note and its conformance tests, the rendering convention, the F19 session-database reader; (2) T5-D, the aew impact --changed first slice, E1's report field and contract line, the reviewer's in-scope/outside row; (3) the F15.3 read half; (4) after M4-E E3/E4 the changes query, U1/H1 with the watermark and repetition, the recitation trigger reading health; (5) F9-A messaging, F9-B working_note, F9-C candidates on changes; (6) after M6b Arm B knowledge.search/get on the bridge; (7) evaluation after M4-H; nothing here gates M4-H, and steps 1 and 2 are the only ones worth landing before it, and only because the structural switch and the test index make the M4-H AEW arm representative of the product (T5 §13.2) (revised by AEA-11: nothing silently alters M4-H's frozen treatment; the delta reads 'land' as activate)"}
  AES-16: {section: "9. F19 evaluation matrix", kind: evaluation, tracked_by: [F19], statement: "Five preregistered experiments, one factor each: r8-pack-arms (pack content and budget), r9-intent-surface (tool presentation), r2b-coherence (working-state support), e1-completeness-nudge (completion self-check) and e2-delta-first (Lead read surface), each with the arms, families and controls, profiles, primary (correctly accepted outcome) and key secondary measures, prerequisite and stop rule of the matrix"}
  AES-17: {section: "9. F19 evaluation matrix", kind: evaluation, tracked_by: [F19], statement: "Common rules: one factor per experiment; cases from the M4-H families only while unexposed; hidden-evaluator scoring under the held-out isolation rule; aew_facts from aew history log --since; cost from F25 projections; every new metric a named, versioned function in metrics.py; profiles are capability classes (frontier, mid, lower-bound), each run recording {provider, model, harness, effective_profile, qualification_state} in the F19 run record's profile{requested, observed} block, a field-level rule, not a schema change; a free OpenCode model is never reported as a Laguna substitute"}
  AES-18: {section: "9. F19 evaluation matrix", kind: sequencing, tracked_by: [F19], statement: "The lower-bound lane comes first, on non-held-out fixtures, before the M4-H-family cases, to establish that the behaviours exist and that the metrics detect them; a lower-bound profile that shows none of the eight behaviours cannot tell whether the scaffolding helps, and the next-cheaper profile is tried"}
  AES-19: {section: "10. BUILD / PROBE / DEFER / REJECT", kind: decision, tracked_by: [F35, F21, F9, U1, F15.9, F11], statement: "Deferred: L1 symbol rows in packs until T5-B covers the repository's language; Knowledge in packs until M6b Arm B is measured; the worker-published working_note until F9-B, supervision candidates until F9-C, the repetition field until U1/H1; impact anomalies and scheduler recommendations in the delta until the anomaly record (M4-E) and F11 (M5); default-on for typed-first, explicit orientation and delta-first until their probes report; a crash-surviving attention cursor until takeover semantics need it"}
  AES-20: {section: "10. BUILD / PROBE / DEFER / REJECT", kind: decision, tracked_by: [F34], statement: "Rejected: a named context compiler or router; automatic Knowledge injection before Arm B; a single semantic facade, a free-text repo.related, a repo.search operation (subject to AEA-10) and worker-side work.inspect; model-maintained structured working state, mandatory self-refresh, a working-state store or record kind, Lead access to raw scratch or harness sessions; a completeness gate or a relation-derived required test; a second event log or state store for attention, and stored past projections; model-name semantics anywhere in policy"}
  AES-21: {section: "12. The simplest system that captures most of the benefit", kind: evaluation, tracked_by: [F19, F35], statement: "Whether any of the five small things earns a default is decided by one F19 lane per item on Q7's task families with one weak and one strong profile; if the lane shows nothing beyond the structural slice, keep the slice and stop"}
  AES-22: {section: "13.3 Reporting contract", kind: evaluation, tracked_by: [F19], statement: "Every experiment reports per capability class raw vs assisted (the same model with and without the arm's assistance), never a cross-class leaderboard as its headline, plus the cross-class cost per correctly accepted outcome including Lead interventions and rework (Q7 §6.3's estimator); the interaction of class, context policy, tool presentation and deterministic assistance is read across the probes with the class as a blocking variable"}
  AES-23: {section: "13.4 The lower-bound lane: tasks that expose the eight behaviours", kind: evaluation, tracked_by: [F19], statement: "The lane runs on a fixture larger than the 12-file ledger (at least several hundred files and more than one plausible search root) with seeded, non-held-out cases for the eight behaviours (poor navigation, bad search-root selection, failure to locate tests/mocks, incomplete cross-file changes, requirement loss on longer tasks, repeated exploration, weak tool selection, difficulty recovering after distraction), each with the probe and metrics.py metric that measures it; the lower-bound profile runs raw first, then the assisted arms; the lane does not touch the M4-H held-out corpus and can start, before M4-H, once the F19 session-database reader and the seeded fixtures exist"}
  AES-24: {section: "13.4 The lower-bound lane: tasks that expose the eight behaviours", kind: gate, tracked_by: [F19], statement: "The designer's confirmation, binding for the lane: it may use a non-M4-H fixture and begin before M4-H; prefer an independent sanitized/public or synthetic representative repository; pre-gate results are qualification and instrumentation evidence only, every pre-gate run record marked purpose: qualification in its preregistration and no pre-gate experiment id reused for a treatment-effect experiment; the Q7 sealed tasks stay completely unexposed, the Q7 repository used pre-gate only if a specific repository-integration probe genuinely requires it, recorded as an exposure in exposure.yaml with the probe's reason"}
  AES-25: {section: "13.5 Evaluation priority for the current environment", kind: sequencing, tracked_by: [F19], statement: "A one frontier profile, B one OpenAI API mid profile, C one or more OpenCode free lower-bound profiles; the lower-bound lane is scheduled first; the frontier lane decides the raw-first/minimal defaults and runs on the seeded set plus the M4-H families after the gate; the mid lane is added where budget permits; treatment-effect claims come from post-gate runs only"}

