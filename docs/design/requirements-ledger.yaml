requirements:
  # ---- KCA: knowledge capture and admission design v0.4 ---------------------------------------------------------
  KCA-01: {section: "2. Goals", kind: requirement, tracked_by: [F21], statement: "Retain evidence-backed Cases first, distill semantic Lessons selectively, keep raw canonical history searchable when distillation abstains or is off; the twelve goals (no model impressions as truth, exact provenance, abstention succeeds, provider-neutral, air-gap compatible, no operator curation of low-risk cases)"}
  KCA-02: {section: "3. Non-goals", kind: decision, tracked_by: [F21], statement: "Capture does not replace Evidence identity or authority paths, needs no vector/graph provider, grants knowledge text no authority, requires no lesson per unit and no human approval per case, and needs no recall system online"}
  KCA-03: {section: "3.1 Terminology collision guard", kind: decision, tracked_by: [F21], statement: "Normative fields use workflow_disposition, knowledge_disposition and evidence admissibility; unqualified 'disposition' only in prose (glossary pass, K5)"}
  KCA-04: {section: "4. Knowledge layers", kind: requirement, tracked_by: [F21], statement: "Four layers: canonical history/evidence, reusable Case, Conditional Lesson, derived recall/index state"}
  KCA-05: {section: "4.1 Canonical engineering history and evidence", kind: requirement, tracked_by: [F21], statement: "Existing work records, decisions, Evidence, attempts and references stay the root material, useful without distillation"}
  KCA-06: {section: "4.2 Reusable Case", kind: requirement, tracked_by: [F21], statement: "A Case is a bounded record of an observed situation; it may only structurally compress approved typed fields, never paraphrase untrusted prose, invent cause or generalize"}
  KCA-07: {section: "4.3 Conditional Lesson", kind: requirement, tracked_by: [F21], statement: "A Lesson is advisory, with explicit applicability, limitations, claim-level support, counterevidence and a recorded admission disposition; never a decision, requirement, permission or proof"}
  KCA-08: {section: "4.4 Derived recall/index state", kind: invariant, tracked_by: [F21], statement: "FTS, catalogs, vectors and other indexes are rebuildable; losing them never destroys durable knowledge or provenance"}
  KCA-09: {section: "5. Evidence identity is unchanged", kind: invariant, tracked_by: [F21], statement: "Knowledge references existing Evidence ids/hashes and never replaces, renames or recreates them; derived records do not create new evidential roots"}
  KCA-10: {section: "6. Authority model", kind: requirement, tracked_by: [F21], statement: "Knowledge publication is its own bounded advisory authority, distinct from project authority"}
  KCA-11: {section: "6.1 Project authority remains with its current owner", kind: invariant, tracked_by: [F21], statement: "Contracts, ADRs, source and accepted procedures keep their authority; knowledge references them by canonical identity, never copies"}
  KCA-12: {section: "6.2 Evidence producers still own their evidence content", kind: invariant, tracked_by: [F21], statement: "Capture consumes evidence and never retroactively changes what the producing role submitted"}
  KCA-13: {section: "6.3 Knowledge publication is its own bounded authority", kind: requirement, tracked_by: [F21], statement: "AEW creates advisory Knowledge records only through an explicitly authorized admission operation; canonical means within the advisory domain"}
  KCA-14: {section: "6.4 Providers have no publication authority", kind: invariant, tracked_by: [F21], statement: "Distillers, challengers, matchers and memory services return proposals only; they cannot publish, resolve contradictions, supersede, widen visibility, change workflow, decide, grant permissions or change configuration"}
  KCA-15: {section: "7. Capture triggers", kind: requirement, tracked_by: [F21, E18], statement: "Capture begins from committed AEW events or validated durable records (the trigger table), debounced into bounded bundles; NO_CANDIDATE is success; candidate caps are maximums, never quotas"}
  KCA-16: {section: "8. Capture job lifecycle", kind: requirement, tracked_by: [F21], statement: "Capture is asynchronous and never blocks completion; job status (PENDING..COMPLETE/PARTIAL/RETRYABLE/PERMANENT_FAILURE) is separate from per-candidate disposition; idempotent retries, persisted accepted provider output, recorded extractor/prompt/policy versions, recheck on source change, visible capture lag"}
  KCA-17: {section: "9. EvidenceEnvelope", kind: requirement, tracked_by: [F21], statement: "AEW, not the model, constructs a bounded, pinned, authorized, attributable, replayable EvidenceEnvelope (the field list); untrusted prose stays untrusted; applicability-critical fields keep their provenance class"}
  KCA-18: {section: "10. Safe deterministic Case projection", kind: requirement, tracked_by: [F21], statement: "K1 templates declare allowed source classes and fields, what each establishes, required authentication, default serving and excerpt size; every field records its source class (ENGINE_OBSERVED_CONTAINED, _WEAK_BOUNDARY, ROLE_ATTESTED, EXTERNAL_UNTRUSTED); source class authenticates provenance, not semantic validity; serving follows the most restrictive class; no inferred cause, intent, universality, fix or authority"}
  KCA-19: {section: "11. CandidateKnowledge contract", kind: requirement, tracked_by: [F21], statement: "Distiller output is CandidateKnowledge (the field list); abstention allowed; unknown is not a wildcard; every claim component names its basis; confidence is not support; AEW, never the producer, assigns the admission class"}
  KCA-20: {section: "12. Admission classes", kind: requirement, tracked_by: [F21], statement: "Admission classes K0 to K3 and KH, assigned by AEW from deterministic templates and policy"}
  KCA-21: {section: "K0 — Canonical Reference", kind: requirement, tracked_by: [F21], statement: "K0 pointers auto-admit from typed committed identities with exact id/hash/scope and no copied authority"}
  KCA-22: {section: "K1 — Observed Case", kind: requirement, tracked_by: [F21], statement: "K1 auto-admits only when AEW matches an approved deterministic template and its source-class requirements"}
  KCA-23: {section: "K2 — Assessed Conditional Lesson", kind: gate, tracked_by: [F21, F19], statement: "K2 automatic admission and default serving disabled initially; enabled per policy class only after held-out evaluation; grounding, applicability, challenge, conflict hold, receipt, recheck, sampled audit and disable path"}
  KCA-24: {section: "K3 — Broad or High-Impact Knowledge", kind: gate, tracked_by: [F21], statement: "M6 v1 never auto-admits K3; admission needs an attributable Lead/operator judgment plus targeted validation; no default decision; the dashboard inbox stays read-only"}
  KCA-25: {section: "KH — Held/Rejected/Quarantined", kind: requirement, tracked_by: [F21], statement: "Held material is inspectable only in investigation modes; HELD_ACTIVE may age to HELD_DORMANT with a receipt; age never means REJECTED; dormant items can reopen"}
  KCA-26: {section: "13. Deterministic validation", kind: requirement, tracked_by: [F21], statement: "Before semantic admission validate schema, sources, hashes, visibility, bindings, resolvability, tier fields, size, relation types, no authority or instruction mutation, preconditions, AEW-assigned class, source-class meaning, most-restrictive visibility; matching only within the caller's scope"}
  KCA-27: {section: "14. Duplicate and relation handling", kind: requirement, tracked_by: [F21], statement: "Exact comparisons first within the authorized scope, semantic matching only as proposal; relation vocabulary derived_from/supports/challenges/refines/supersedes/references; exact replay never republishes; supersession is a disposition, not a timestamp"}
  KCA-28: {section: "15. Anti-laundering and evidential roots", kind: invariant, tracked_by: [F21], statement: "Root evidence identity is preserved and deduplicated; a report proves only that it was said; a workflow disposition (known_limit, accepted_open, waived) is not proof of the proposition"}
  KCA-29: {section: "16. Applicability and generalization", kind: requirement, tracked_by: [F21], statement: "Start from observed conditions; broader applicability needs a recorded basis; never infer version ranges, portability or universality; broadened claims are new versions; limitations never silently removed"}
  KCA-30: {section: "17. Semantic challenge", kind: requirement, tracked_by: [F21], statement: "Challenge is selective, answers focused questions, allows INSUFFICIENT_EVIDENCE, is not proof by agreement, runs without the author's narrative where practical; targeted tests use the normal authorized workflow"}
  KCA-31: {section: "18. Admission operation", kind: requirement, tracked_by: [F21], statement: "AdmissionPolicy.decide then KnowledgeStore.commit with an atomic final recheck (valid is not latest); generation outside control-state locks; immutable versions; append-only knowledge_disposition events with disposition_seq and knowledge_event_seq; capture records outside hot state; indexed affected-record lookup, no full scans"}
  KCA-32: {section: "19. Service identity and automation", kind: requirement, tracked_by: [F21], statement: "A service identity with enumerated knowledge operations only, never a Lead credential, unreachable from worker shells; background running implies no ambient authority"}
  KCA-33: {section: "Judgment boundary / Two Surfaces", kind: requirement, tracked_by: [F21, F15], statement: "K2/K3 admission is judgment-bearing and appears in the decisions-required projection with no silent default; a timeout, confidence score or absent response never means admit"}
  KCA-34: {section: "20. Trust/lifecycle dimensions", kind: requirement, tracked_by: [F21], statement: "No single CURRENT/CONFIDENCE field; orthogonal dimensions; applicability to a request is computed at query time and receipted where consequential"}
  KCA-35: {section: "Admission", kind: requirement, tracked_by: [F21], statement: "Admission state is a projection over append-only disposition events, separate from the immutable content version"}
  KCA-36: {section: "Support", kind: requirement, tracked_by: [F21], statement: "Support is compositional; updating one support fact never discards another"}
  KCA-37: {section: "Conflict", kind: requirement, tracked_by: [F21], statement: "Conflict state none_known | possible | unresolved | disposition_recorded"}
  KCA-38: {section: "Lifecycle", kind: requirement, tracked_by: [F21], statement: "Lifecycle active | superseded_within_scope | archived | quarantined"}
  KCA-39: {section: "Serving eligibility", kind: requirement, tracked_by: [F21], statement: "Serving eligibility direct_reference | case_recall | default_lesson_eligible | explicit_investigation_only | suppressed"}
  KCA-40: {section: "Applicability", kind: requirement, tracked_by: [F21], statement: "The record stores its declared/observed applicability basis; request applicability is computed at delivery; fresh indexing never makes knowledge true"}
  KCA-41: {section: "21. Capture/delivery coupling", kind: requirement, tracked_by: [F21], statement: "Capture persists enough identity, provenance and applicability for delivery to identify the version, resolve roots, qualify applicability, honour state and explain eligibility; admission is not serving; serving never mutates admission"}
  KCA-42: {section: "22. Security and poisoning", kind: requirement, tracked_by: [F21], statement: "All candidate source prose is untrusted; the nine protections (no permission mutation, no self-defined authority, typed receipts outrank prose, no visibility widening, decisions resolved by id, no privileged remember-this, schema-constrained output, history is data, no security advice in K1 automation)"}
  KCA-43: {section: "23. Failure and recovery", kind: requirement, tracked_by: [F21], statement: "Distiller failure never blocks recovery; replayable jobs; idempotent acknowledgement; no duplicate publication after a crash; integrity failure on missing evidence; new extractor versions propose, never rewrite; queue loss never erases an admitted record"}
  KCA-44: {section: "24. Evaluation gates", kind: gate, tracked_by: [F21, F19], statement: "Adversarial corpus before automatic Lesson admission; the sixteen evaluation dimensions; Phase 1a A versus B first (Arm B is the first stop/go gate), 1b K1 replay plus a minimal C, Phase 2 only if C adds value; the K1 source-class replay report is a pre-build gate (defer K1 if the default-eligible share is small); report misses and bad admissions; critical authority, poisoning or cross-scope failures stop"}
  KCA-45: {section: "Agent-use acceptance gate", kind: gate, tracked_by: [F21, F19], statement: "Accepted only when, ordinarily discoverable and unprompted, agents find and use relevant experience, improve independently verified outcomes and abstain when history is irrelevant; if B performs about as well as C, stop and defer K1/K2"}
  KCA-46: {section: "25. Initial M6 implementation sequence", kind: sequencing, tracked_by: [F21], statement: "The 14-step order: freeze semantics and glossary names; freeze shared semantics; F19 fixtures; Arm B over FTS5 in the history SQLite; measure A/B; K1 replay; minimal C only on a measured gap; B/C comparison; full K1 and shadow candidates only after C earns it; relations and challenge; K2 classes after held-out gates; routing; providers; Journal/API projections"}
  KCA-47: {section: "26. Required M6 design changes", kind: decision, tracked_by: [F21], statement: "Capture/admission first-class in M6; Cases the safest primitive; Lessons an evaluated layer; raw search permanent; runtime receipts stop at DELIVERY_ACKNOWLEDGED (citation only when structurally observed, benefit belongs to F19); retention/admission/serving/delivery separate; candidate UI inspection-only; providers cannot bypass admission"}
  KCA-48: {section: "29. Review disposition", kind: process, tracked_by: [F21], statement: "Joint review with the research basis, shared semantics, KC v0.4, the Journal handoff, W05 and the recall design; approval is of direction only, not schemas, wire contracts or automatic K2"}
  KCA-49: {section: "28. Invariant requirements for the existing invariant index", kind: process, tracked_by: [F21], statement: "Merge these invariants into the existing invariant index, deduplicated with the shared and recall lists; no separate KINV namespace (KCA-50 to KCA-73)"}
  KCA-50: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Provider output cannot create binding decisions, completion, requirements, permissions or recovery state"}
  KCA-51: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Every admitted claim resolves to permitted pinned source evidence or an explicit assessed-interpretation basis"}
  KCA-52: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Origin/visibility claims state their actual containment/authentication level"}
  KCA-53: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Model prose is not an execution/test receipt"}
  KCA-54: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Derived repetition cannot increase independent evidential support"}
  KCA-55: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Generalization or visibility widening requires a recorded authorized basis"}
  KCA-56: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Supersession never silently deletes prior understanding or follows recency alone"}
  KCA-57: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Default delivery excludes held/quarantined/unsupported Lessons"}
  KCA-58: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Source/policy/conflict preconditions are rechecked at publication"}
  KCA-59: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Lost providers/jobs cannot change AEW truth or block recovery"}
  KCA-60: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "At-least-once capture yields idempotent admission"}
  KCA-61: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Guarded raw-history recall survives distiller abstention/outage"}
  KCA-62: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Historical text cannot alter tools, permissions, configuration or publication rules"}
  KCA-63: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Use frequency/evaluator confidence never becomes evidential truth"}
  KCA-64: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "New extractor versions do not overwrite previous admitted generated output without an attributable knowledge_disposition"}
  KCA-65: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Corrupt/missing evidence degrades eligibility rather than reconstructing proof"}
  KCA-66: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Recall/index lag and applicability uncertainty remain visible"}
  KCA-67: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Default context delivery is bounded and owned by one AEW routing authority"}
  KCA-68: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Existing Evidence identity survives capture/admission"}
  KCA-69: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "NO_CANDIDATE is successful and candidate count is never an output quota"}
  KCA-70: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Derived visibility is no broader than the most restrictive root absent authorized widening"}
  KCA-71: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "K1 default serving is constrained by source/authentication class"}
  KCA-72: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Immutable Knowledge content and mutable knowledge_disposition state remain separate"}
  KCA-73: {section: "28. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "K2/K3 judgment-bearing admission has no silent default"}

  # ---- KSS: capture-recall shared semantics v0.4 -----------------------------------------------------------------
  KSS-01: {section: "3. Core principle", kind: requirement, tracked_by: [F21], statement: "Capture decides retention, recall decides exposure; shared identity, provenance, applicability vocabulary and policy semantics; the seven corollaries (admitted is not served, served is not believed, match is not applicability, recall cannot upgrade, capture cannot predict, raw recall may bypass distillation, every delivered item traces to version and root)"}
  KSS-02: {section: "3.1 Qualified disposition vocabulary", kind: decision, tracked_by: [F21], statement: "workflow_disposition, knowledge_disposition and evidence admissibility are distinct in normative fields"}
  KSS-03: {section: "4.1 Evidence identity", kind: invariant, tracked_by: [F21], statement: "Evidence ids/hashes stay canonical; neither path creates a substitute identity"}
  KSS-04: {section: "4.2 Knowledge identity", kind: requirement, tracked_by: [F21], statement: "knowledge_id, version, content_fingerprint, record_kind, timestamps; stable across projections; changed claims are new versions; disposition is append-only events with disposition_seq and knowledge_event_seq, folded for current state"}
  KSS-05: {section: "4.3 Canonical project references", kind: invariant, tracked_by: [F21], statement: "Project-authoritative identities stay owned by their domain; knowledge references and displays them, never copies"}
  KSS-06: {section: "4.4 Subject identity", kind: requirement, tracked_by: [F21], statement: "Use existing stable subject identities; paths/symbols as locators; topic lenses never publication authority"}
  KSS-07: {section: "5. Shared durable fields", kind: requirement, tracked_by: [F21], statement: "The common Knowledge header (the field list) persisted by capture; source/authentication class is serving semantics; provenance authentication is not semantic validity"}
  KSS-08: {section: "6. RootEvidenceBinding", kind: requirement, tracked_by: [F21], statement: "Claim-level RootEvidenceBinding (evidence id/hash, snapshot, artifact, ranges, digest, field path, claim components, relation, basis) answering what exact source supports this part; the binding is not proof"}
  KSS-09: {section: "7.1 Admission", kind: requirement, tracked_by: [F21], statement: "Admission is a fold over append-only knowledge_disposition events; delivery consumes the fold plus the governing revision"}
  KSS-10: {section: "7.2 Support", kind: requirement, tracked_by: [F21], statement: "Support is orthogonal and compositional; recall never upgrades support"}
  KSS-11: {section: "7.3 Conflict", kind: requirement, tracked_by: [F21], statement: "A matcher may find possible conflict; only an accepted disposition sets durable conflict state"}
  KSS-12: {section: "7.4 Lifecycle", kind: requirement, tracked_by: [F21], statement: "Supersession is scoped; older records remain addressable"}
  KSS-13: {section: "7.5 Serving eligibility", kind: requirement, tracked_by: [F21], statement: "Admission sets the serving envelope; K1 serving constrained by source class (contained may be default case recall; role-attested/untrusted begin explicit-only); the router still judges relevance"}
  KSS-14: {section: "7.6 Applicability", kind: requirement, tracked_by: [F21], statement: "Durable record stores observed conditions, admitted applicability, exclusions, unknowns and basis; ApplicabilityAssessment is query-time and never rewrites the record"}
  KSS-15: {section: "7.7 Visibility composition", kind: invariant, tracked_by: [F21], statement: "Derived records are no more visible than the most restrictive root absent authorized widening, across publication, matching, relations, reverse projections, topics, API and recall; no leaks through counts, hints, scores or metadata (v1 is project-scoped, ARR-09)"}
  KSS-16: {section: "`derived_from`", kind: requirement, tracked_by: [F21], statement: "derived_from: origin basis, not independent confirmation"}
  KSS-17: {section: "`supports`", kind: requirement, tracked_by: [F21], statement: "supports: specified evidence supports a proposition under conditions, claim-scoped where practical"}
  KSS-18: {section: "`challenges`", kind: requirement, tracked_by: [F21], statement: "challenges: counterevidence or unresolved same-condition conflict; may trigger a serving hold"}
  KSS-19: {section: "`refines`", kind: requirement, tracked_by: [F21], statement: "refines: narrows scope or conditions without declaring the predecessor false"}
  KSS-20: {section: "`supersedes`", kind: requirement, tracked_by: [F21], statement: "supersedes: an authorized scoped disposition; never from recency, popularity or similarity"}
  KSS-21: {section: "`references`", kind: requirement, tracked_by: [F21], statement: "references: points to external canonical identity without copying it; contradicts only with a confirmed meaning"}
  KSS-22: {section: "9. Capture-side responsibilities for future delivery", kind: requirement, tracked_by: [F21], statement: "Capture owns and persists the listed fields and must not precompute future applicability, permanent scores, usefulness, benefit or budgets"}
  KSS-23: {section: "10. Recall/delivery-side responsibilities", kind: requirement, tracked_by: [F21], statement: "Recall owns query-time operations and scores, honours capture semantics, matches over the authorized corpus before top-k, or bounded over-fetch with incomplete-coverage reporting"}
  KSS-24: {section: "11. QualifiedRecallItem", kind: requirement, tracked_by: [F21], statement: "Recall results carry identity plus query-time qualification (the field list); raw canonical results are distinguishable from Knowledge records"}
  KSS-25: {section: "12. Selection does not imply delivery or use", kind: requirement, tracked_by: [F21], statement: "MATCHED, SELECTED, PREPARED, DELIVERY_ACKNOWLEDGED, CITED_OR_REFERENCED, BENEFIT_EVALUATED are distinct events"}
  KSS-26: {section: "Engine-observable delivery receipts", kind: decision, tracked_by: [F21], statement: "The backend initially builds only the four engine-observable stages as authoritative receipts"}
  KSS-27: {section: "Citation/reference observation", kind: decision, tracked_by: [F21], statement: "CITED_OR_REFERENCED is authoritative only from a structured, directly observed event; parsed model output is heuristic telemetry"}
  KSS-28: {section: "Benefit evaluation", kind: decision, tracked_by: [F21, F19], statement: "BENEFIT_EVALUATED belongs to F19 and binds independently evaluated outcomes to delivery receipts; self-report is insufficient"}
  KSS-29: {section: "13. Pinned content identity versus current serving disposition", kind: requirement, tracked_by: [F21], statement: "Preparation pins knowledge_id + version; delivery rechecks visibility, holds, eligibility and policy; receipts record both; historical packets stay reconstructable and are never rewritten; no silent latest"}
  KSS-30: {section: "14. Knowledge ↔ Evidence navigation", kind: requirement, tracked_by: [F21, F20], statement: "Knowledge to claim to RootEvidenceBinding to Evidence navigation; W05 stays the evidence reader; reverse Evidence to Knowledge is a derived, visibility-filtered index"}
  KSS-31: {section: "23. Journal implications", kind: requirement, tracked_by: [F21, F20], statement: "The Journal distinguishes Case (this happened) from Lesson (admitted bounded interpretation); compact labels are projections of the orthogonal dimensions; the Journal is never mutation authority"}
  KSS-32: {section: "15. Capture and delivery policy linkage", kind: requirement, tracked_by: [F21], statement: "One versioned knowledge-policy domain with sections; capture records the admission policy version, delivery records serving/ranking/applicability versions and the disposition revision"}
  KSS-33: {section: "Admission preconditions", kind: requirement, tracked_by: [F21], statement: "Admission rechecks pinned source and prerequisites (older is not invalid), resolvability, visibility, conflict assumptions, relation target version, required receipts"}
  KSS-34: {section: "Delivery preconditions", kind: requirement, tracked_by: [F21], statement: "Delivery rechecks visibility, eligibility, holds, index alignment and honest applicability; no cached ALLOW is trusted forever"}
  KSS-35: {section: "17. Provider boundary", kind: invariant, tracked_by: [F21], statement: "Providers may retrieve, index, extract, propose, challenge and rank; they never own identity, admission, authority, relations, serving, workflow, visibility or context permission; capture records live in cold knowledge-history structures with reverse indexes, not hot state"}
  KSS-36: {section: "18. Topic/subject linkage", kind: requirement, tracked_by: [F21], statement: "Subjects are shared anchors; topic lenses are derived aids; proposed lens tags never equal admission; no binding relation from similarity"}
  KSS-37: {section: "19. Guarded raw-history bypass path", kind: requirement, tracked_by: [F21], statement: "Raw history bypasses semantic creation, not security: unadmitted prose is explicit-mode only, with capability, visibility, integrity, bounded excerpts, untrusted framing, holds and no instruction authority; request mode is intent, not permission"}
  KSS-38: {section: "20. Telemetry and feedback", kind: invariant, tracked_by: [F21], statement: "Recall telemetry never raises support, broadens applicability, resolves conflict, supersedes or creates authority"}
  KSS-39: {section: "Capture failure", kind: requirement, tracked_by: [F21], statement: "Capture failure erases no history, blocks no raw recall, fabricates no Lesson"}
  KSS-40: {section: "Index failure", kind: requirement, tracked_by: [F21], statement: "Index failure destroys no durable Knowledge; exact expansion continues; degraded state visible"}
  KSS-41: {section: "Applicability uncertainty", kind: requirement, tracked_by: [F21], statement: "Uncertain applicability is qualified, never rendered as confirmed"}
  KSS-42: {section: "Conflict discovered after admission", kind: requirement, tracked_by: [F21], statement: "A later conflict may suppress default serving without rewriting sources or implying falsity"}
  KSS-43: {section: "Delivery provider outage", kind: requirement, tracked_by: [F21], statement: "Provider outage may reduce recall, never changes admission"}
  KSS-44: {section: "22. API/projection implications", kind: requirement, tracked_by: [F21, F20], statement: "Read APIs preserve version, authority class, references, supplied state fields, index generation and unknowns; the browser infers nothing; preview schemas are proposals"}
  KSS-45: {section: "24. MCP/CLI implications", kind: requirement, tracked_by: [F21], statement: "knowledge.search/get/related/evidence/explain_selection (names open) returning qualified expandable results; requested challenged material keeps its status"}
  KSS-46: {section: "26. Decisions intentionally left open", kind: open-question, tracked_by: [F21], statement: "Open: id prefix, storage path, version representation, endpoints, ranking, provider, budget, relation storage, UI labels, service capability names"}
  KSS-47: {section: "28. Review set and approval boundary", kind: process, tracked_by: [F21], statement: "Joint review set; approval covers shared semantics, stable Evidence identity, the Case/Lesson/reference distinction, independent paths; not schemas, wire contracts, providers, ranking, K2 rollout or implementation"}
  KSS-48: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Evidence identity is stable across capture and recall"}
  KSS-49: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Knowledge identity/version is stable across CLI/MCP/API/Journal projections"}
  KSS-50: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Every delivered item identifies exact content version plus governing knowledge-disposition/policy revision"}
  KSS-51: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Admission does not imply serving"}
  KSS-52: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Serving does not mutate admission/support/authority"}
  KSS-53: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Query-time applicability does not rewrite durable applicability"}
  KSS-54: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Retrieval scores do not establish semantic relations"}
  KSS-55: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Multiple derived records do not multiply one root evidential source"}
  KSS-56: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Supersession is scoped and attributable"}
  KSS-57: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Guarded raw-history recall remains possible without semantic distillation but is explicit-mode only for unadmitted prose"}
  KSS-58: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Canonical project references remain references, not copied authority"}
  KSS-59: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Selection/preparation/delivery/citation/benefit remain distinct"}
  KSS-60: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Capture and delivery record policy versions independently"}
  KSS-61: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Visibility is most-restrictive-root by default and enforced before matching/result limits"}
  KSS-62: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Provider outage cannot mutate durable semantics"}
  KSS-63: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Reverse Evidence to Knowledge links are derived and scope-filtered"}
  KSS-64: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Topic lenses/groupings do not establish truth or authority"}
  KSS-65: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Knowledge text cannot grant execution/workflow authority"}
  KSS-66: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Current-mode resolution records the concrete version returned"}
  KSS-67: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "A protective serving hold is not equivalent to declaring content false"}
  KSS-68: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Immutable Knowledge content and append-only knowledge-disposition state remain separate"}
  KSS-69: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Request modes never grant capabilities/visibility"}
  KSS-70: {section: "25. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Consequential post-delivery holds surface affected active/unmerged recipients via delivery receipts"}

  # ---- KRR: recall, context routing and agent use v0.3 -----------------------------------------------------------
  KRR-01: {section: "1. Purpose", kind: requirement, tracked_by: [F21], statement: "The read side owns query to receipts; relevant history must be cheaper to obtain and trust than rediscovery, and irrelevant or misleading history easy to ignore"}
  KRR-02: {section: "2. Primary acceptance objective", kind: gate, tracked_by: [F21, F19], statement: "Accepted only when, ordinarily discoverable and unprompted, agents find and use relevant experience, improve independently verified outcomes and abstain appropriately; raw, Cases and Lessons evaluated separately; automatic discovery a separate arm; primary outcome verified task correctness"}
  KRR-03: {section: "3. Design principles", kind: requirement, tracked_by: [F21], statement: "The ten principles: one owner of delivery semantics, exact before semantic, progressive disclosure, raw history first-class, admission is not serving, match is not applicability, delivery is not use, history is data, counterevidence travels, abstention can succeed"}
  KRR-04: {section: "4.1 Canonical project authority references", kind: requirement, tracked_by: [F21], statement: "Authority references are returned as references to their owner, never cloned"}
  KRR-05: {section: "4.2 Canonical engineering history/Evidence", kind: requirement, tracked_by: [F21], statement: "Canonical history and evidence are recallable through the guarded raw-history path"}
  KRR-06: {section: "4.3 Admitted K0/K1/K2/K3 Knowledge", kind: requirement, tracked_by: [F21], statement: "Admitted knowledge returned per eligibility, visibility, state and request applicability"}
  KRR-07: {section: "4.4 Held/challenged/historical material", kind: requirement, tracked_by: [F21], statement: "Held/challenged material only in authorized explicit investigation or debug modes, never mixed into default advice"}
  KRR-08: {section: "4.5 Derived indexes", kind: invariant, tracked_by: [F21], statement: "Indexes are accelerators; their loss never erases durable history or Knowledge"}
  KRR-09: {section: "5. Request binding", kind: requirement, tracked_by: [F21], statement: "Every recall has an AEW-owned RecallRequestBinding (the field list); the provider never declares visibility; request modes EXPLICIT_LOOKUP, AUTOMATIC_DISCOVERY, CONTEXT_ROUTING, INVESTIGATION_HISTORY, DEBUG_EVALUATION are intent, never permission"}
  KRR-10: {section: "6. Recall pipeline", kind: requirement, tracked_by: [F21], statement: "The staged pipeline from binding through guard, exact, lexical, optional semantic, qualification, applicability, ranking, budget, PREPARED, final recheck, DELIVERY_ACKNOWLEDGED; any stage may return nothing"}
  KRR-11: {section: "7. Access and visibility guard", kind: requirement, tracked_by: [F21], statement: "Authorization precedes exposure; no leaks of existence, titles, metadata, cross-project or cross-attempt data or similarity hints; scope before top-k, else partitioned index, bounded over-fetch with coverage_incomplete, or refuse the provider; applies to duplicates, relations, topics and reverse lookups"}
  KRR-12: {section: "8. Guarded raw-history recall", kind: requirement, tracked_by: [F21], statement: "Raw prose and rejected/held candidate text only in explicit authorized modes, never default context; default routing uses admitted Knowledge and canonical references only; the guard list applies"}
  KRR-13: {section: "9. Exact resolution and structured retrieval", kind: requirement, tracked_by: [F21], statement: "Exact ids, subjects, signatures, paths, relations before semantic search; structured query fields exposed to the agent"}
  KRR-14: {section: "10. Lexical and semantic candidate generation", kind: requirement, tracked_by: [F21], statement: "Lexical/structured recall is the required baseline; semantic retrieval optional and replaceable and never decides applicability, contradiction, supersession, support, authority or eligibility; no merges from a cosine threshold"}
  KRR-15: {section: "11. Applicability qualification", kind: requirement, tracked_by: [F21], statement: "Request-specific MATCH, QUALIFIED_MISMATCH, UNKNOWN, INAPPLICABLE with reasons; environment fields keep provenance; contained receipts are bounded observations, not conclusions; UNKNOWN is not MATCH"}
  KRR-16: {section: "12. Current serving disposition versus pinned content", kind: requirement, tracked_by: [F21], statement: "Prepared items pin the version; delivery rechecks; receipts record version and disposition revision; a consequential hold after delivery raises an attention item listing affected active invocations and unmerged work for the Lead"}
  KRR-17: {section: "13. Ranking", kind: requirement, tracked_by: [F21], statement: "Ranking uses bounded features and never treats recall count, citations, confidence, recency, derived summaries or self-reported helpfulness as truth; rare catastrophic knowledge must not disappear"}
  KRR-18: {section: "14. Ranking and policy separation", kind: requirement, tracked_by: [F21], statement: "Eligibility before ranking; a policy-suppressed item never becomes deliverable by ranking; AEW produces the final order and reasons"}
  KRR-19: {section: "15. Counterevidence and challenged knowledge", kind: requirement, tracked_by: [F21], statement: "Material challenge is visible within the bounded result; per-mode behaviour (suppress, qualify, side by side, historical); never hide a known challenge"}
  KRR-20: {section: "L0 — capability awareness", kind: requirement, tracked_by: [F21, F13], statement: "A small stable description of what knowledge holds, when lookup saves work, how to search, that results are advisory"}
  KRR-21: {section: "L1 — compact qualified hit", kind: requirement, tracked_by: [F21], statement: "Compact hits: id/version, kind, claim, conditions, qualification, source class, why matched, one next expansion"}
  KRR-22: {section: "L2 — record detail", kind: requirement, tracked_by: [F21], statement: "Record detail: applicability, limitations, roots, relations, counterevidence, admission and serving metadata"}
  KRR-23: {section: "L3 — exact source/evidence", kind: requirement, tracked_by: [F21, F20], statement: "Exact expansion through W05-style inspection or canonical readers"}
  KRR-24: {section: "17. Agent-facing operations", kind: requirement, tracked_by: [F21], statement: "search/get/related/evidence/explain_selection equivalents with structured inputs (subject, path, signature, environment, kind, state, mode); no provider syntax exposed"}
  KRR-25: {section: "18. Ordinary discoverability", kind: requirement, tracked_by: [F21, F13], statement: "Advertise through normal capability discovery; never instruct always search memory; investigate low adoption before forcing lookups"}
  KRR-26: {section: "19. Automatic discovery and context routing", kind: requirement, tracked_by: [F21], statement: "Automatic delivery is separate from voluntary lookup; triggers listed; compact ids first; the router owns selection, order, budget, expansion, counterevidence, omissions; it never widens permissions"}
  KRR-27: {section: "20. Context packet semantics", kind: requirement, tracked_by: [F21], statement: "Packet items bind identity, version, policies, applicability, reasons, qualification and expansion; the receipt ladder is conceptual and only the four engine-observable stages are built first; citation only from structured events; benefit is F19's"}
  KRR-28: {section: "21. Context budgeting", kind: requirement, tracked_by: [F21, E29], statement: "Recall never crowds out mandatory context: instructions, then work/authority/guardrails, then source/evidence, then recall; a Lesson is atomic with its caveats (omit rather than strip); truncation explicit"}
  KRR-29: {section: "22. Source expansion and W05", kind: requirement, tracked_by: [F21, F20], statement: "W05 stays the Evidence reader; recall links claims to evidence ranges without owning Evidence identity; expansion cheap enough to verify claims"}
  KRR-30: {section: "23. Security and instruction isolation", kind: requirement, tracked_by: [F21], statement: "Retrieved history is untrusted data: cannot override policy, remember-this is not authority, decisions by id, no metadata leaks, providers cannot widen visibility, default context excludes held/unadmitted prose, K1 serving honours source class, excerpts delimited, injection treated as content"}
  KRR-31: {section: "Distiller unavailable", kind: requirement, tracked_by: [F21], statement: "Raw history and admitted records remain recallable"}
  KRR-32: {section: "Semantic/vector provider unavailable", kind: requirement, tracked_by: [F21], statement: "Fall back to exact/structured/lexical and surface the degradation"}
  KRR-33: {section: "Index stale/unavailable", kind: requirement, tracked_by: [F21], statement: "Never claim complete search; exact expansion continues"}
  KRR-34: {section: "Source/evidence missing or corrupt", kind: requirement, tracked_by: [F21], statement: "Qualify or suppress; never reconstruct proof from a summary"}
  KRR-35: {section: "Protective hold appears after preparation", kind: requirement, tracked_by: [F21], statement: "Recheck at delivery; refuse or qualify"}
  KRR-36: {section: "Consequential hold appears after delivery", kind: requirement, tracked_by: [F21], statement: "Surface an attention item from delivery receipts for the Lead"}
  KRR-37: {section: "No useful result", kind: requirement, tracked_by: [F21], statement: "Explicit no-hit or insufficient-applicability state; never fabricate"}
  KRR-38: {section: "25. Performance and latency", kind: evaluation, tracked_by: [F21], statement: "Measure exact, lexical, semantic, expansion, router, index and token costs on the target air-gapped environment; no invented SLA; lookup must beat rediscovery"}
  KRR-39: {section: "26. Provider boundary", kind: invariant, tracked_by: [F21], statement: "Provider replacement never changes identity, visibility, authority, eligibility, relations, permissions or receipts"}
  KRR-40: {section: "27.1 Diagnostic stages", kind: evaluation, tracked_by: [F21, F19], statement: "Separate oracle, writer, retrieval, routing/voluntary-lookup and temporal-loop stages"}
  KRR-41: {section: "27.2 Agent-use arms", kind: evaluation, tracked_by: [F21, F19], statement: "Phase 1a A versus B (first stop/go), 1b K1 replay plus minimal C, Phase 2 D/E/O only if C adds value; ordinary discoverability, no use-memory prompts; corpus from real AEW incidents; tasks include useful, none, misleading, changed, challenged, rejected-advice, outage and rare-catastrophe history"}
  KRR-42: {section: "28. Ranking/retrieval metrics", kind: evaluation, tracked_by: [F21, F19], statement: "The fifteen retrieval metrics; never optimize unprompted lookup in isolation"}
  KRR-43: {section: "29. Harness/model conformance", kind: requirement, tracked_by: [F21], statement: "Across harness/model combinations: discoverable, disclosure works, ids and labels survive transport, denied never exposed, held excluded by default, expansion resolves, receipts distinguish prepared and delivered, history cannot become instruction"}
  KRR-44: {section: "30. API/dashboard implications", kind: requirement, tracked_by: [F21, F20], statement: "The read API exposes request binding, identity, state, revisions, applicability, reasons, index generation, omissions, expansion and receipts; the retrieval debugger is a projection"}
  KRR-45: {section: "31. Initial implementation sequence", kind: sequencing, tracked_by: [F21], statement: "Freeze the set; fixtures before providers; Arm B first; measure A/B; replay; minimal C only on a measured gap; full machinery only after C earns it; K2 and automatic discovery later; providers against the lexical baseline; Journal/API last"}
  KRR-46: {section: "32. Decisions intentionally left open", kind: open-question, tracked_by: [F21], statement: "Open: ranking formula, provider, L0-L3 budgets, trigger thresholds, SLA, operation names, query rewrite, reranker, counterevidence count, model-specific routing, endpoints"}
  KRR-47: {section: "35. Approval boundary", kind: process, tracked_by: [F21], statement: "Approval is of the read-path direction only; not ranking, vector store, budget, thresholds, schemas, automatic K2/K3 or rollout"}
  KRR-48: {section: "33. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Retrieval never upgrades authority or evidential support"}
  KRR-49: {section: "33. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Visibility/scope are enforced before concealed metadata or provider limits can affect caller-visible results"}
  KRR-50: {section: "33. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Raw-history recall bypasses semantic creation only and is explicit-mode only for unadmitted prose"}
  KRR-51: {section: "33. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Rejected/held semantic advice cannot silently re-enter automatic/default context through raw source prose"}
  KRR-52: {section: "33. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Request modes never grant capability/visibility"}
  KRR-53: {section: "33. Invariant requirements for the existing invariant index", kind: invariant, tracked_by: [F21], statement: "Match/similarity does not establish applicability or semantic relations"}
