# AEW requirements ledger (aew/requirements-ledger/v1)
#
# What this is: the hard gate that no requirement in a design or research document is lost. Every document under
# docs/design/ and docs/research/, and every ADR from ADR-0012 on, is either an ingested `source` here or a `legacy`
# document already tracked by the register. For every source, every heading is accounted for: it holds ledger
# requirements, its requirements are carried by ids elsewhere (`carried`), or it holds none (`no_requirements`, with
# the reason). Every requirement names the register rows that track its work (`tracked_by`, ids in
# docs/implementation/future-work.md).
#
# Authority: none, like the register and the invariant index. The documents govern; the ledger only proves that
# nothing in them went untracked. Never reinterpret a design from its entry here.
#
# Ingesting a new document or a new version (tests/unit/test_requirements_ledger.py enforces each step):
#   1. Add it as a source (a new version replaces the old `path`; ids keep their numbers).
#   2. Account for every heading. A heading that no longer exists fails the test until its entries are re-pointed.
#   3. Ids are contiguous per prefix. A requirement that a new version drops is never deleted: move it to `retired`
#      with its disposition (superseded by an id, absorbed, or rejected with the reason).
#   4. Every `tracked_by` id exists in the register; add or update the register row in the same change.
schema: aew/requirements-ledger/v1

kinds: [requirement, invariant, gate, decision, evaluation, sequencing, open-question, process]

# Documents tracked only at register-row level. On 2026-10-05 every earlier design and research document was ingested
# as a source; the two left here have no section headings (one is a verbatim amendment, one a YAML contract), so the
# section-by-section gate cannot apply to them. A new version of either is ingested as a source.
legacy:
  docs/design/dashboard-api-v1-provisional.yaml: [F20.2]
  docs/design/ticket-revision-amendment-2026-09-30.md: [F4]

