  - '#': F49
    Work: 'Scoped fix briefs, as a product feature. Every review finding names its class (the guarantee or invariant broken)
      as well as its site, and the known site is an example, not the task. A fix brief carries a **floor**: a sweep of that
      class over candidate sites the engine enumerates deterministically (from the structural map or symbol references),
      reported as a table that covers every site, broken or not and why, which the reviewer verifies; and a **ceiling**:
      the allowed files or areas, explicit non-goals (such as "the real fix is another Ticket") and an expected footprint,
      with anything outside it written up as a proposed follow-up. The reviewer diffs the fix commit on its own first ("what
      else did this change?"). A repeat-class detector flags a finding whose class was found and fixed before, so the next
      fix sweeps the class rather than the instance. The finding schema gains the class, its instances and the sweep scope;
      the fix attempt''s launch contract carries the sweep obligation and its structured result; the fix lands as a property
