  - '#': E3
    Work: Watch CI for load-sensitive timing
    Source: audit T2
    When: '**Unscheduled** (ongoing)'
    Notes: 'The step-3 case was a real race (M3-D11, fixed), and so was a run reported `lost` while it ended, on `main`
      after PR #7 (fixed: ADR-0009 amendment 2026-10-01, the heartbeat continues while a run ends). The launch acknowledgement
      wait (`AEW_LAUNCH_ACK_S`, 90 s) has timed out once, under two concurrent suites. `test_a_run_that_takes_long_to_end_is_not_reported_lost`
      failed once under coverage on 16 workers (M4-A, 2026-10-03): its 2 s stale window left 1 s over the 1 s beat; widened
      to 4 s, with the wait at 8 s. A run reported `lost` while it started (Windows, PR #132, 2026-10-09) was a real race
      too: its first record came before its first heartbeat (fixed: ADR-0009 amendment 2026-10-09). A single-run `aew harness
      wait` that returned a run still `running` (four CI failures in three adversarial tests, 2026-10-06 to 10-08, Linux
      and Windows) was a regression from wait-any (M4-D6, PR #79): its control lane, meant for `--any`, ended a single-run
      wait before the supervisor had written the run''s end (fixed 2026-10-09: the control lane is `--any`''s only). A supervisor
      wedged while starting kept its heartbeat fresh with no limit, so a single-run wait read `starting` until its own timeout
      (noted by the independent review of PR #147, not seen in CI). The start now has a deadline, by default the sandbox
      self-test''s and the harness adapter''s own launch bounds plus 60 s (620 s for OpenCode at its defaults; `AEW_RUN_START_S`
      overrides it), so a wedged start reads `lost` within the deadline plus 10 s and never becomes `running` (ADR-0009
      amendment 2026-10-09, a run''s start has a deadline). A failed harness test now reports and keeps its runs'' record
      and logs (testing strategy §3, 2026-10-09), so the next such failure names a stall (`lost`) or a crash. `test_a_waiter_parses_no_control_state_between_commits`
      (OBX-38) failed on a loaded Windows host, alone at `main` and once under 8 workers in PR #149''s review (2026-10-09):
      its 4 s wait closed before the Ticket''s commits landed, so only the initial read was counted. Fixed test-side: the
      commits land after the waiter''s initial read, the test waits until the waiter has parsed the last of them, then ends
      the wait through a run''s record; it counts parses against the commits'' revisions, with no time window. Raise or
      restructure test-side timing, never the product''s.'

