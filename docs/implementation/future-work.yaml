schema: aew/register/v1
title: AEW future work register
preamble: |-
  **What this is:** the one place that lists AEW's deferred work, so that nothing designed or decided is forgotten. Each entry points to its source and names the gate it must pass before, or the milestone it belongs to.

  **Authority:** none. This is an index, like `docs/design/invariant-index.md` (`AEW-INV-TRACE-001`). The governing texts are the design documents, contracts and ADRs it points to. When one of them changes, update this register in the same change. Never reinterpret a design from its entry here.

  **Keeping it current:** add an entry whenever work is deferred, whether a design is accepted, a review defers a finding, or a dogfood finding is left open. Give it a target (below). When its work is accepted, or another entry absorbs it, move it to §9 *Closed* with the date and the commit, PR or document that closed it. Never drop an entry silently. When an entry waits for a decision or a design, give it an item in [`decisions-due.yaml`](decisions-due.yaml) (what is owed, by whom, by which gate or milestone, and what it blocks); the rendered [`decisions-due.md`](decisions-due.md) is the list of what is due. **Edit the data, not this page:** this file is rendered from `future-work.yaml` by `tools/register.py render`; `tests/unit/test_register.py` fails when the two differ (E30). Append a closed row anywhere in §9: `render` sorts §9 into id order, so two changes that close different entries land in different places and merge without conflict. **Add a note, never edit a Notes cell:** what a change has to say about an existing row (a slice built, a decision, a review's outcome, a pointer to new evidence) goes in a file of its own, `notes.d/<row id>/<YYYY-MM-DD>-<branch slug>.md`, which `python tools/register.py note <id>` creates for you to write; branches whose slugs differ never write the same file, so notes never conflict; every row with an id ends with a pointer to its directory, and `python tools/register.py show <id>` prints the row with its notes oldest first ([`notes.d/README.md`](notes.d/README.md)). Edit a row's cells only when what they state changes (its work, its source, its target, its closing), and never append to them. The notes already in the cells stay there. **The Now list (§1) is the build order, and the Lead keeps it current.** A new row names its milestone (Contained, V-01 or Internal alpha) or After the trace in its target. A hold group leaves the hold only when STG-12's S12-4 trace is final and S12-5's flags are decided: the designer matches each member to the requirements it would serve; a member that serves one becomes a row again, sourced to those requirement ids and placed by the operator into a milestone, and a member that serves none is dropped, with the operator's OK, one batch per group; until then nothing in a group is built, unless the operator asks for it (the development hold's exemption).

  **At each milestone start** (operator, 2026-10-01): the milestone's ambiguity report goes through this register. It covers every entry whose *When* names that milestone or a gate before it, and any other open entry that fits the milestone's scope. It marks each one as **in scope**, **deferred** (with the reason) or **closed** (naming what closed it). Items with no fixed milestone may be pulled in where they fit. The operator and designer approve that scope at plan review, with the rest of the plan.

  **Targets.** Every open entry's *When* (or *Target and notes*) starts with one target, in bold:

  | Target | Meaning |
  |---|---|
  | **Gate: …** | Must be done before the named point (§1) |
  | **Now** | In the build queue, whose order §1 gives and the Lead keeps |
  | **Contained**, **V-01**, **Internal alpha** | Belongs to that milestone (§1) |
  | **After the trace** | Held until STG-12's requirements trace is final: a hold group (`HOLD-NN`, one per adopted position) or a row waiting on the trace |
  | **Designer** | Waits for a decision (§4); nothing is built before it |
  | **Evaluation** | Measurement with no product code, run alongside milestones |
  | **On measured need** | Only if evidence shows the cost or pain |
  | **Unscheduled** | No milestone yet; the next triage it fits may pull it in |
  | **Stage** | A build stage of the architecture map (`STG-NN`), built from the designer's hand-offs in the map's order; each slice adds a note on the stage's row |

  The targets were reset by the register rebaseline (operator, 2026-10-24).

  *History: each row carries its own dates; the file's history is `git log -- docs/implementation/future-work.yaml`. The change log kept in this line until 2026-10-05 is archived as `docs/archive/register-changelog-to-2026-10-05.md`. Nothing in this preamble changes per entry. After every sync with main, run `python tools/register.py render`, conflict or not: a clean merge can still leave §9 unsorted and the markdown stale, which `check` (and CI) refuse. When a merge conflicts, resolve `future-work.yaml` only, then render: the markdown is derived and is never merged by hand.*
sections:
- number: 1
  title: Now, the milestones and the gates (in order)
  columns:
  - Milestone or gate
  - Done when
  - Source
  rows:
  - Milestone or gate: '**Personal alpha: a recorded milestone before V-01, with no release claim**'
    Done when: '**First use:** items 1 to 11 and 16 to 18 of the Now list are done, and the operator runs their own SPT
      work on it. **The gate,** beside the oracle and reading the same ledgers: limits and recovery (the hard limits read
      held, and V2-forced reaches a result); setup and preflight (V3''s four non-stale cases pass strict, with the driver
      asserting the diagnosis); the fresh path (V1 reaches a result with exactly the plan and publish decisions, excusing
      only G3 steps not yet landed, each printed by name); the receipt (a real-model run the operator starts, on a sample
      repository with a seeded neighbour test and a lint outside the configured check, recording no-wake, validation width,
      scope, dead-end gates, the operator''s own yes or no on readability, and containment labels, with bars set after the
      first receipt); the install (the same kit from the installed package on the Rocky 8 VM; on Windows, an install check
      only). **Stated limits:** no G3 as proof, so the Lead''s token stays and "authenticate once" is not met; no assessed
      profile, so workers run on the launch self-test and masks as measured; publish moves local main with no operator step,
      and the push is the approval; a setting changed after setup goes back to adopt and the token; the 2.0.18 pin; no format-change
      safety, so no marker raises, changes are additive, and the operator snapshots `.aew/` before an upgrade; real work
      on Linux only. **It changes no gate:** the `vertical` job stays red, the V-01 line leads its report, and nothing here
      implies V-01''s completeness'
    Source: the operator's decision of 2026-11-02, a personal alpha before V-01 (design workspace `0c4ad71`), under A-02's
      `OI-FR-06`; the designer's position of the same day; the vertical sweep (0 of 17 scenarios has ever passed on Linux,
      in 104 completed runs)

  - Milestone or gate: '**Contained and reconciled**'
    Done when: '**Every agent runs contained:** CS-3b and CS-4 merged, with their live lanes on Rocky 8 (STG-05), and the
      G3 service installed (STG-03, A-37). **The rest:** the owner-only store merged, AEW''s base tools shipped (STG-15,
      CAP-1 and the bundle), and harness currency in place (E35, H-1 to H-3). **Reconciled:** the as-built reference is
      complete and the requirements trace is final, with its flags decided (STG-12: S12-2, S12-4, S12-5). Not a bar before
      the personal alpha; the Now list says what comes before first use and orders the rest'
    Source: A-33, A-37, A-35; the operator's decisions of 2026-10-24 (AEW brings its tools; OpenCode version currency);
      the register rebaseline (design workspace, `b598fdc`)

  - Milestone or gate: '**V-01, the first vertical slice: before feature work resumes, and before any release**'
    Done when: '**The operator''s outcome:** authenticate once, say "fix this", and get the published result. It is measured
      by V-01''s rebuilt oracle (STG-13) passing on Linux; Windows is outside it, as today. **The wire track** builds the
      increments the slice needs: I-6, then I-7; RX-01, K-01 and P-01 selected before I-7 (made on 2026-10-25, among its
      five choices: knowledge in V-01 is history and source lookup only, K-01''s H profile; a research claim reads `NOT_ESTABLISHED`
      until its owner qualifies it; V-01 shows the maps to agents only, with no site map view); O-02; U-01. **Research,
      PoCs and one mission:** research''s minimum slice (an inquiry as WIS work with no Ticket, an outcome by answer, and
      links between a Ticket and an inquiry in both directions, in CNI''s link vocabulary); PoCs as linked Tickets (contained
      scratch, while a PoC in the real project is an engineering Ticket linked to the inquiry); one bounded unattended mission
      (hours, an I-6 spend cap metered at CS-3b''s provider relay, a preflight, held questions and a report). The mission
      counts only where the relay meters every paid route a mission''s run can reach and R-01 qualifies the class, so its
      cap is hard there (A-42, option (a)): the relay''s meter (E97) and the qualification (E98) are V-01''s build items'
    Source: the operator's verdict of 2026-10-11; the vertical-UAT ruling of 2026-10-23; the operator's decisions of 2026-10-24
      (V-01's first row; the oracle rebuild's exemption; the first selections for RX-01, P-01 and K-01, with research, linked
      PoCs and one bounded mission in V-01, design workspace `f9f0c1a`); the register rebaseline (design workspace, `b598fdc`);
      A-40, WIS's research statements (adopted by the operator on 2026-10-25, design workspace `44156d0`), from which research's
      minimum slice is briefed; the operator's selection before I-7 of 2026-10-25 (design workspace `a8a5efc`); A-41, CNI's
      link vocabulary, and A-42, the bounded unattended mission with option (a) (both adopted by the operator on 2026-10-25,
      design workspace `b2ade18`), from which I-7 and the mission are briefed

  - Milestone or gate: '**Internal alpha**'
    Done when: '**The trace''s removals and FIX rows are done** (S12-6). **The hold groups** the operator keeps for alpha
      are re-sourced and built. **AEW is packaged for the operator''s own trial:** an install the operator can run on their
      own machine and on a managed Linux host. The trial itself follows the milestone and is the operator''s: first SPT''s
      backlog, then, if that goes well, the issues it turns up, then use on that host, with the feedback brought back'
    Source: A-35; the register rebaseline (design workspace, `b598fdc`); the operator's decision of 2026-10-25 on the triage's
      ST-46 (design workspace `0d6292f`)

  - Milestone or gate: '**Before a provider that requires a client certificate is used**'
    Done when: 'The relay (F28) holds and presents the provider''s mutual-TLS client certificate and key (E123): the pinned
      harness (OpenCode 2.0.18) speaks chat completions but cannot present a client certificate (harness probe, 2026-10-11),
      and the credential never enters a sandbox or a harness''s configuration. Applies only to such providers; for others
      Q5''s hardening milestone and its order are unchanged (designer, 2026-10-11; Q5 closed in the register rebaseline).
      The forced request fields have been qualified against the provider (operator, live; AIR-85). F18.8''s other parts
      are its own Unscheduled row (restored from HOLD-20 by the hold match, 2026-11-06), and are not prerequisites for this'
    Source: '[decision record](../design/decisions-2026-10-11-architecture-integration.md) §6.4, §6.5, §6.8 (ledger AIR-81,
      AIR-82, AIR-85); the designer''s ruling of 2026-11-02, the relay presents the certificate'

  - Milestone or gate: '**Met**'
    Done when: F2's containment regression gate and E13's process ownership (M4-B, 2026-10-03)
    Source: '`docs/design/proposals/execution-workspace-and-isolation-design-v0.1.md` §6.6 and §12; `m3-companion-review-triage.md`
      P1 and B2; E13'

  intro: |-
    **Now, in order.** The build queue, each item on the row that carries it. **The Lead keeps it current:** this register owns the build order, and the architecture map's build order points here for it. The design queue stays in the map. `python tools/register.py check` holds the list to the rows: every row it names is open and targeted **Now** or **Stage**, and every row targeted **Now** is in it. A stage is named once it is queued. A change that closes or retargets a row named here edits this list in the same change: an item whose rows have closed keeps its number, as `| <n> | closed: <row> | what it was, closed by #NNN |`, because other rows cite the numbers, and `check` holds its rows to §9.

    | # | Row | Item |
    |---|---|---|
    | 1 | closed: E115 | The scoreboard: the vertical report leads with scenarios passing, steps landed and how long each has been flat, closed by #324 |
    | 2 | closed: E116 | The vertical driver's fix for the placeholder #319 printed, closed by #325 |
    | 3 | E117 | The first real-model receipt on a seeded kit, likely red, and the personal alpha's gate |
    | 4 | closed: E112 | Every launch whose containment fails is refused, and the register of weaker contexts, closed by #321 |
    | 5 | E118 | The contained Lead's two fixes |
    | 6 | E35 | The probe of what a project can load into the harness. Only this part of E35 is before first use |
    | 7 | STG-15 | CAP-1 PR 2: the read-only ripgrep bind, Q08's rows, the fetch at first launch and the contained health check, merged as #330 (`eb38cd5f`; PR 1 merged as #272, `af951c92`). PR 3 is item 14 |
    | 8 | closed: E119 | `aew init` takes the check, model and provider names, with the oracle's row and driver in one PR, closed by #329 |
    | 9 | E120 | Validation's coverage on the record, and failure lines back to the worker |
    | 10 | E121 | A readable result: a headline per result in chat |
    | 11 | E122 | The next step while the Lead waits |
    | 12 | STG-03 | **After first use, or earlier if a builder slot is free:** G3-C with `ATTACH_LEAD`, E82 and the G3 install. G3-A, G3-B and G3-D are merged (#269, #282, #286). It never holds first use |
    | 13 | E123 | **Before the work step:** the relay presenting a client certificate, and the bundle (E99, whose design is owed) |
    | 14 | STG-15, E35 | CAP-1 PR 3, right after PR 2 and beside first use, which it doesn't hold. **After those:** H-1, H-2 and H-3 |
    | 15 | STG-14 | I-6, the resource, model and host policy (A-39), the first of the wire increments V-01 needs. Its protected rows stay held until G3 is established, and G3 is established on no host yet |
    | 16 | E125 | The local readiness surface, with the driver asserting the diagnosis. With E119, it's what V3's four non-stale cases need to pass |
    | 17 | E126 | A pre-F4 correction that F4 absorbs: the Lead adds one exact test path to a Ticket's scope |
    | 18 | closed: E127 | Delivering the first four skills, labelled unevaluated, and `optional_skills` on the card, closed by #342 |
    | 19 | closed: E130 | What the Lead is told points at its typed tools and cannot go stale, closed by #331 |
    | 20 | closed: E139 | Worker packs made true, each finding with a guard, closed by #333 (its review's follow-ons are E198) |
    | 21 | E140 | Enforcing the discovery layer's O-CMD and O-SECRET, in three PRs: the tooling merged as #332 and the rules as #335; the flip is next |
    | 22 | closed: E143 | The relay route's model-family check and its follow-on (one allowlist function, row 1's list and the check on the status line), closed by #338 and #339 |
    | 23 | E142 | Serving `security-review` and `c-review`, after E127 |
    | 24 | E136 | Serving the other eleven skills, batched, after E142 |
    | 25 | E137 | A publish that stops stale after its first commit, and the stranded stages like it |
    | 26 | closed: E156 | Refuse a launch with no provider key, close the Lead's OpenCode provider, and Lead permission tightening, closed by #340 |
    | 27 | E157 | `report_write`: the Lead writes a report itself, kept apart from evidence |
    | 28 | E158 | The consult: the Lead spawns a read-only card on a question in one call, in two PRs |
    | 29 | E164, E165 | The models the Lead may pin: the operator's allow command, and `--model` held to profiles plus the allow-list, always bounded |
    | 30 | E159, E166 | The Lead change, with the light review, requested gates and `review_triggers` levels, and first configuration proposing those levels and keyed profiles |
    | 31 | E160 | The plan assessment gate and the `plan_assessor` card, with planner staffing in the Lead's text |
    | 32 | E161 | The Lead's skills, after E127 |
    | 33 | E162, E163 | Lead text fixes, and a typed `plan accept` |
    | 34 | E167 | The `technical_writer` card, and `technical-writing` on `code_reviewer`, with E136's batches |
    | 35 | E170 | A command that prints a record's text as written |
    | 36 | E168 | A review of any branch or ref, with `branch_reviewer` |
    | 37 | E169, E155 | O-SECRET's one canonical prohibition, with E155's hand path kept |
    | 38 | E171 | The tool-consent prompt, CAP-1's follow-on, with `aew capability fetch` |
    | 39 | E182 | The systems generator: `systems.yaml` and its check (PR 1), then the rendered board (PR 2), then state read from the code with the N = 12 check (PR 3) |

    **After items 1 to 11 and 16 to 18, first use:** the operator's SPT work, image work included. CI is SPT's first ticket: AEW's workers write it and the operator pushes. SPT stays as it is until then. Later fixes come from that use.

    **In the alpha, not a condition of first use** (the operator, 2026-11-06, a new category): they follow the first-use list and never hold it. In this order: `report_write` (item 27), the consult (item 28, with the model pins of item 29 beside its second PR), the Lead change (item 30), the plan assessment gate (item 31), then the Lead's skills after E127 (item 32). Items 33 to 35 are the Lead's placements in the same category, after those, and item 36 is the designer's, last, after first use. The six designs of 2026-11-06 among them (`report_write`, the consult, the Lead change, the plan assessment gate, the Lead's skills, and branch review with document work, last, after first use) are new systems, so each starts only under the limit on half-built work.

    **The limit on half-built work** (the operator, 2026-11-06): N = 12. No new system starts building while more than 12 systems have code not fully in and are not frozen, and a new system starts only when the count, with it added, stays at most 12, so the count must first be under 12 (the operator's answer of the same day: the limit holds the new designs); the count was above 12 on 2026-11-06, and first use counts toward bringing it down. Until the systems generator's third PR (E182) computes it, the count is the build board's.

    **The systems generator** (item 39; the operator, 2026-11-06, "Now, PR 1 first"): its PR 1 takes the next free slot after the first-use one-offs in flight, and PRs 2 and 3 follow it. It doesn't delay first use.

    **Contention for a slot:** what blocks other items, starts a series or unlocks a capability that can be tested goes first, and a chain of pull requests keeps moving beside the one-offs (the operator, 2026-11-04). The Lead's placements under that rule: CAP-1 PR 2, then PR 3, hold one slot; E125 follows E119, on the way to V3's first green; E127 follows CAP-1 PR 2, since both change the same binds. Items 19 to 25 are the Lead's placements of 2026-11-05, and items 26, 37 and 38 of 2026-11-06; none of them is a condition of first use unless the operator says so. The other one-offs keep the operator's order of 2026-11-03: E121, E122, E120, with E119 alongside, then E126, E118 and E35's probe. E117 runs when the operator judges there's something new to measure, as the last step before first use. **The numbers name the items, and don't set the order.** **New design stops until the first receipt,** except what first use surfaces, SPB's adoption question, the research the operator asked for and what the operator asks for directly (the Lead's leeway, 2026-11-06), so a new ruling becomes a row only if it serves this list. **Everything moved stays in V-01,** except the plan assessment gate (V-01's item 10), which the operator placed in the alpha on 2026-11-06 (E160), and V-01 stays the gate before any release. **After I-6,** V-01's next build items are the provider relay's meter (E97), then R-01's qualification of the paid class (E98), which judges that meter (the Lead's order, as A-42's adoption leaves it). They join this list when they are queued.

    **The milestones and gates, in order.** They replace the gates this section held before the rebaseline, and the M4, M5 and M6 targets (register rebaseline, operator, 2026-10-24).
- number: 2
  title: Designed, not implemented
  columns:
  - '#'
  - Work
  - Source (governing)
  - Belongs to or gated by
  - Notes
  target_column: Belongs to or gated by
  rows:
  - '#': F3
    Work: Workspace strategy abstraction, role-sensitive isolation, repository-scale benchmarks
    Source (governing): 'Serves `HEB-09.d`, `AEW-FR-37.b`, `HEB-09.e`, `AEW-INV-ISO-004`; contributes to `AEW-INV-RESOURCE-001`
      (owned by other rows); position A-06; the operator''s decision of 2026-11-06 on the hold match, `2026-11-06-operator-hold-match-batches.md`
      (design workspace `cffb1ee`). Design inputs as held, not authority: isolation design §4 to §14; lessons note, Incident
      B'
    Belongs to or gated by: '**On measured need.** Restored from HOLD-06 by the hold match (operator, 2026-11-06); its matched
      scope is its note of that day'
    Notes: 'Isolation is a property, not a worktree. M4-B built the Linux sandbox per role (F2); still here for M4-C: the
      workspace strategy abstraction, concurrency and the benchmarks. Benchmarks gate the choice of a project default. Mutable-serial
      locks are bound to an invocation (`AEW-INV-ISO-004`). Sparse or overlay workspaces wait until a repository needs them
      (ARV-01, operator 2026-10-05).'

  - '#': F4
    Work: Ticket supersession lineage, and a first-class goal-revision path
    Source (governing): 'Serves `AEW-FR-07.b`, `AEW-FR-11.b`, `AEW-FR-14.b`, `AEW-FR-17.a`, `AEW-INV-ASSURE-004`, `AEW-INV-ASSURE-009`,
      `AEW-INV-COORD-003`, `AEW-INV-EVID-001`, `AEW-INV-HIER-001`, `AEW-INV-HIER-002`, `AEW-INV-HIER-004`, `AEW-INV-HIER-005`,
      `WIS-02.b`, `WIS-02.c`, `WIS-03.b`, `WIS-04.b`, `WIS-06.d`, `WIS-08.a`, `WIS-08.d`; position A-08; the operator''s
      decision of 2026-11-06 on the hold match, `2026-11-06-operator-hold-match-batches.md` (design workspace `cffb1ee`).
      Design inputs as held, not authority: hierarchy design §8 to §10, §20 (Scenarios A and E); [Ticket-revision contract
      amendment](../design/workflow-contract-amendment-ticket-revisions-2026-10-06.md) (E19-B v0.4, adopted by the operator
      2026-10-06; ledger TRA)'
    Belongs to or gated by: '**Unscheduled.** Frozen until the wire track''s I-5 revision and replacement commands land
      and plan v8 is re-derived against A-29 (S1 stays dormant). Restored from HOLD-08 by the hold match (operator, 2026-11-06);
      its matched scope is its note of that day'
    Notes: 'Needed Workflow Contract and Knowledge Contract amendments, adopted 2026-10-06 (below). Observed in the M3 dogfood
      (T1: a recreated Ticket with no lineage). **Adopted in design, 2026-09-30: Ticket revisions** (`docs/design/ticket-revision-amendment-2026-09-30.md`;
      review, and the designer''s decisions D1 to D7, in `ticket-revision-amendment-review-2026-09-30.md`). A material change
      becomes a new immutable revision of the same Ticket, not a replacement. Evidence binds to digests of the fields it
      depends on, and admissibility across a revision is computed. The workspace may carry forward as input only, and adverse
      findings carry forward until resolved. A replacement stays for a change of kind, a move to another parent, or a goal
      that no longer overlaps. Evidence: twice a scope mistake cost a Ticket and its correct implementation (M3-D9; `m3-dogfood-report.md`
      §6.6). **The contract amendment is adopted (operator, 2026-10-06, [E19-B v0.4](../design/workflow-contract-amendment-ticket-revisions-2026-10-06.md)):**
      it extends WC §7, §8 and invariant 7 and KC §12, and F4 is implementation-ready. Building it is of the size of M4-D
      and needs its own plan: the field-group registry and digests; revision records and the `aew migrate` step to r1; the
      evidence binding and computed admissibility (evidence today binds the snapshot and plan revision only, and the snapshot
      excludes `.aew/`, so nothing binds Ticket inputs yet); the quiesce, commit and abort lifecycle with `revision_pending`;
      independent confirmation and the operator''s checkpoint; the amendment''s own impact hold and parent coverage. StageIntent
      binding (the amendment''s §7.4) waits for F15.2. **Lead developer''s build note (the amendment''s §2.3):** the engine
      cannot prove a free-text title carries no acceptance meaning, so the schema declares the title presentation-only and
      the engine never reads acceptance from it; if acceptance content is placed in a title anyway, the amendment''s fail-closed
      rule applies: the title is treated as acceptance-bearing from that revision on, for as long as the content remains
      in it (so a change to it, its later removal included, is material and bound like acceptance), and the misuse is `UNBOUND_FIELD_ESCAPE`.
      The engine cannot detect such content mechanically, so it is review or independent confirmation that finds it. **Designer
      ruling on parent changes (2026-10-09, [agent-effectiveness adoption](../design/decisions-2026-10-09-agent-effectiveness-adoption.md)
      §15; ledger AEA-41 to AEA-43):** an ordinary revision may not move a committed Ticket from one parent to another,
      even before work starts; arbitrary re-parenting needs a replacement Ticket with explicit lineage; an uncommitted or
      draft Ticket may correct its parent before its identity becomes governing. KC §9.4 promotion is a distinct hierarchy-expansion
      operation: allowed after work starts, it preserves the original Ticket identity, evidence and history, the effective
      risk or class floor and the inherited non-waivable gates and guardrails. Until the implementation text is updated,
      ambiguous re-parenting fails closed. The F4 plan builds it; the editorial line is E19''s re-freeze. **Plan:** [the
      F4 plan v8](f4-ticket-revisions-plan.md) (review CLEAR), slices S1 to S12, recorded in [ADR-0016](adr/0016-ticket-revisions.md).
      **Built so far (S1, 2026-10-09):** the field-group registry (`schemas/ticket-field-registry.v1.json`), canonicalization
      and live digests (`engine/ticket_fields.py`; ADR-0016 §1), not yet called by the engine, so nothing changes. Every
      slice that adds a work-unit key classifies it in the registry (test_every_ticket_field_is_classified, invariant 50).
      No interim refusal stands yet. Next: S2a (enablement, the format raise, the interim hierarchy refusals). **F9-A couplings
      ([ADR-0017](adr/0017-coordination-messages.md), MS2 built 2026-10-10):** S2a''s format raise sits in `Session.commit`
      beside F9''s seal check (disjoint data; S2a''s one full Rocky 8 VM run rule applied to MS2 too), each slice adds its
      own top-level control-state key with its own downgrade test, and whichever of S2a and the slice creating the shared
