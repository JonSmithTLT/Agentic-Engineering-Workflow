schema: aew/register/v1
title: AEW future work register
preamble: |-
  **What this is:** the one place that lists AEW's deferred work, so that nothing designed or decided is forgotten. Each entry points to its source and names the gate it must pass before, or the milestone it belongs to.

  **Authority:** none. This is an index, like `docs/design/invariant-index.md` (`AEW-INV-TRACE-001`). The governing texts are the design documents, contracts and ADRs it points to. When one of them changes, update this register in the same change. Never reinterpret a design from its entry here.

  **Keeping it current:** add an entry whenever work is deferred, whether a design is accepted, a review defers a finding, or a dogfood finding is left open. Give it a target (below). When its work is accepted, or another entry absorbs it, move it to §9 *Closed* with the date and the commit, PR or document that closed it. Never drop an entry silently. When an entry waits for a decision or a design, give it an item in [`decisions-due.yaml`](decisions-due.yaml) (what is owed, by whom, by which gate or milestone, and what it blocks); the rendered [`decisions-due.md`](decisions-due.md) is the list of what is due. **Edit the data, not this page:** this file is rendered from `future-work.yaml` by `tools/register.py render`; `tests/unit/test_register.py` fails when the two differ (E30). Append a closed row anywhere in §9: `render` sorts §9 into id order, so two changes that close different entries land in different places and merge without conflict.

  **At each milestone start** (operator, 2026-10-01): the milestone's ambiguity report goes through this register. It covers every entry whose *When* names that milestone or a gate before it, and any other open entry that fits the milestone's scope. It marks each one as **in scope**, **deferred** (with the reason) or **closed** (naming what closed it). Items with no fixed milestone may be pulled in where they fit. The operator and designer approve that scope at plan review, with the rest of the plan.

  **Targets.** Every open entry's *When* (or *Target and notes*) starts with one target, in bold:

  | Target | Meaning |
  |---|---|
  | **Gate: …** | Must be done before the named point (§1) |
  | **M4**, **M5**, **M6**, **Hierarchy revision** | Belongs to that milestone; its ambiguity report takes it up |
  | **M4 candidate** | Small work that fits M4; its triage decides in or out |
  | **Designer** | Waits for a decision (§4); nothing is built before it |
  | **Evaluation** | Measurement with no product code, run alongside milestones |
  | **On measured need** | Only if evidence shows the cost or pain |
  | **Unscheduled** | No milestone yet; the next triage it fits may pull it in |

  The targets set at the post-M3 cleanup (2026-10-01) are proposals until M4's plan review ratifies or changes them.

  *History: each row carries its own dates; the file's history is `git log -- docs/implementation/future-work.yaml`. The change log kept in this line until 2026-10-05 is archived as `docs/archive/register-changelog-to-2026-10-05.md`. Nothing in this preamble changes per entry. After every sync with main, run `python tools/register.py render`, conflict or not: a clean merge can still leave §9 unsorted and the markdown stale, which `check` (and CI) refuse. When a merge conflicts, resolve `future-work.yaml` only, then render: the markdown is derived and is never merged by hand.*
sections:
- number: 1
  title: Gates on the way (in order)
  columns:
  - Gate
  - Condition
  - Source
  rows:
  - Gate: '**Before any real-repository dogfood, personal or internal alpha**'
    Condition: 'Real filesystem containment (F2) passes the containment regression gate. **Built in M4-B (2026-10-03):**
      the regression gate passes in CI and on Rocky 8 with SELinux enforcing (ADR-0009, M4-B amendment). On the Rocky 8
      host with the operator (2026-10-03), the live OpenCode lane passed contained under the real per-run layout (OpenCode
      2.0.18, free models: 23 passed, 1 skipped by design), and with user namespaces disabled every launch was refused (`CONTAINMENT_UNAVAILABLE`,
      no harness process started). The custody-hardening item from the independent review of authority and custody is closed
      (2026-10-04, Lead session custody: the Lead''s harness runs in an owned process tree, and credentials go only to the
      operator''s terminal; ADR-0009 amendment of that date). For personal dogfood, the unprivileged bubblewrap boundary
      is enough once its Rocky 8 probes pass; internal alpha also needs representative isolation performance and operability
      acceptance (Q3, designer, 2026-10-01). Real-project provenance does not by itself trigger F2. A sanitized or disposable
      SPT-derived fixture counts as scratch only when the execution environment also has no writable non-disposable project
      state or secrets within the run''s host-level reach; a disposable clone on the normal development host does not count
      as scratch (designer, 2026-10-01). Until then the guarantee is labelled `workdir separation only`, and the dogfood
      uses scratch repositories only.'
    Source: '`docs/design/proposals/execution-workspace-and-isolation-design-v0.1.md` §6.6 and §12; `m3-companion-review-triage.md`
      P1 and B2'
  - Gate: '**Before Linux runs rely on stop**'
    Condition: 'POSIX process ownership (E13): stopping a run ends every process it started, closed through F2''s bubblewrap
      PID namespace. **Met for contained runs (M4-B, 2026-10-03)**: teardown after `setsid`, a double fork and `SIGKILL`
      of bubblewrap or of the supervisor passes on Rocky 8; the live lane re-runs E13''s scenario under the real layout.'
    Source: E13
  - Gate: '**Before internal alpha**'
    Condition: 'Network containment on Linux (F28): no internal-alpha security claim calls Linux runs network-contained
      before its live lane passes (designer, 2026-10-04).'
    Source: '[network containment design v0.2](../design/network-containment-design-v0.2.md) §6'
  - Gate: '**Before internal alpha**'
    Condition: 'The F18 and F28 canonical-state and credential boundaries hold on Rocky/Linux: model-controlled processes
      cannot directly mutate canonical AEW or control state or obtain real provider or workflow credentials except through
      AEW''s authority paths (operator, 2026-10-07, the F23 decision). Windows and WSL stay development and test platforms
      with truthfully weaker labels, never evidence for this gate.'
    Source: '[F23 decision record](../design/decisions-2026-10-07-f23-internal-alpha-threat-model.md) (ledger IAT-02, IAT-03)'
- number: 2
  title: Designed, not implemented
  columns:
  - '#'
  - Work
  - Source (governing)
  - Belongs to or gated by
  - Notes
  target_column: Belongs to or gated by
  rows:
  - '#': F3
    Work: Workspace strategy abstraction, role-sensitive isolation, repository-scale benchmarks
    Source (governing): isolation design §4 to §14; lessons note, Incident B
    Belongs to or gated by: '**M4** (the concurrency part), with F2'
    Notes: 'Isolation is a property, not a worktree. M4-B built the Linux sandbox per role (F2); still here for M4-C: the
      workspace strategy abstraction, concurrency and the benchmarks. Benchmarks gate the choice of a project default. Mutable-serial
      locks are bound to an invocation (`AEW-INV-ISO-004`). Sparse or overlay workspaces wait until a repository needs them
      (ARV-01, operator 2026-10-05).'
  - '#': F4
    Work: Ticket supersession lineage, and a first-class goal-revision path
    Source (governing): hierarchy design §8 to §10, §20 (Scenarios A and E); [Ticket-revision contract amendment](../design/workflow-contract-amendment-ticket-revisions-2026-10-06.md)
      (E19-B v0.4, adopted by the operator 2026-10-06; ledger TRA)
    Belongs to or gated by: '**Hierarchy revision.** Before Leads routinely replace Tickets'
    Notes: 'Needed Workflow Contract and Knowledge Contract amendments, adopted 2026-10-06 (below). Observed in the M3 dogfood
      (T1: a recreated Ticket with no lineage). **Adopted in design, 2026-09-30: Ticket revisions** (`docs/design/ticket-revision-amendment-2026-09-30.md`;
      review, and the designer''s decisions D1 to D7, in `ticket-revision-amendment-review-2026-09-30.md`). A material change
      becomes a new immutable revision of the same Ticket, not a replacement. Evidence binds to digests of the fields it
      depends on, and admissibility across a revision is computed. The workspace may carry forward as input only, and adverse
      findings carry forward until resolved. A replacement stays for a change of kind, a move to another parent, or a goal
      that no longer overlaps. Evidence: twice a scope mistake cost a Ticket and its correct implementation (M3-D9; `m3-dogfood-report.md`
      §6.6). **The contract amendment is adopted (operator, 2026-10-06, [E19-B v0.4](../design/workflow-contract-amendment-ticket-revisions-2026-10-06.md)):**
      it extends WC §7, §8 and invariant 7 and KC §12, and F4 is implementation-ready. Building it is of the size of M4-D
      and needs its own plan: the field-group registry and digests; revision records and the `aew migrate` step to r1; the
      evidence binding and computed admissibility (evidence today binds the snapshot and plan revision only, and the snapshot
      excludes `.aew/`, so nothing binds Ticket inputs yet); the quiesce, commit and abort lifecycle with `revision_pending`;
      independent confirmation and the operator''s checkpoint; the amendment''s own impact hold and parent coverage. StageIntent
      binding (the amendment''s §7.4) waits for F15.2. **Lead developer''s build note (the amendment''s §2.3):** the engine
      cannot prove a free-text title carries no acceptance meaning, so the schema declares the title presentation-only and
      the engine never reads acceptance from it; if acceptance content is placed in a title anyway, the amendment''s fail-closed
      rule applies: the title is treated as acceptance-bearing from that revision on, for as long as the content remains
      in it (so a change to it, its later removal included, is material and bound like acceptance), and the misuse is `UNBOUND_FIELD_ESCAPE`.
      The engine cannot detect such content mechanically, so it is review or independent confirmation that finds it'
  - '#': F5
    Work: 'Hierarchy revision semantics: EDITORIAL, CLARIFICATION and MATERIAL; Story and Epic revision; approved-baseline
      drift; admissibility as a Knowledge Contract concept'
    Source (governing): hierarchy design §4 to §7, §12 to §18
    Belongs to or gated by: '**Hierarchy revision**'
    Notes: '"Parents preserve purpose. Tickets preserve proof." Open questions in §21.'
  - '#': F6
    Work: 'Fail-closed classification applied to existing classifiers: the downgrade rule for `verify classify`, and risk-class
      choice'
    Source (governing): invariant index `AEW-INV-CLASS-001` and `AEW-INV-VERIFY-001`; hierarchy design §11.1 (Scenario H)
    Belongs to or gated by: '**Designer** (Q4), with a Workflow Contract amendment'
    Notes: Changes M1 semantics. The M3 dogfood records how model Leads classify.
  - '#': F7
    Work: 'Delegation and resource governance: bounded nested-delegation grants, duplicate-work detection, fanout, retry
      and interruption budgets, exact-match permission aggregation, cancellation propagation across fanout'
    Source (governing): lead/operator design §16 and §17; lessons note, Incident A
    Belongs to or gated by: '**M5**, or any earlier milestone where a Lead fans out or workers request help (with coordination)'
    Notes: Workers already have no dispatch capability (M3). Includes the standing deep-review orchestration regression
      and its skill-instructed variant.
  - '#': F8
    Work: 'Lead and operator interaction: reconnaissance, elicitation, project maps and freshness, durable stakeholder decisions,
      checkpoints'
    Source (governing): '`docs/design/proposals/lead-operator-interaction-design-v0.1.md` §3 to §15, §18'
    Belongs to or gated by: '**Unscheduled.** Future Lead UX'
    Notes: 'Open questions in §23. ARV-04 (operator, 2026-10-05): the operator inbox this design describes is, with F15''s
      typed surface, the mechanism named to keep the operator and designer''s serial path short.'
  - '#': F9
    Work: Live coordination and assumption propagation
    Source (governing): '`docs/design/proposals/AEW_Live_Coordination_and_Assumption_Propagation_Design_v0.1.md`'
    Belongs to or gated by: '**On measured need** (frozen; ARV-01, operator 2026-10-05: not before M4-D and a multi-agent
      dogfood show the need). Revisit when dogfood evidence justifies it; staging in its §24 (M3.x or M4 holds, then the
      M5 scheduler)'
    Notes: M3 kept the extension points (runs, `send`, continuations).
  - '#': F10
    Work: 'Mutating concurrency above 1: integration queue, merge revalidation'
    Source (governing): '`m1-implementation-plan.md`; `implementation-status.md`'
    Belongs to or gated by: '**M4** (after F1, closed 2026-10-03)'
    Notes: 'Interacts with F3. Research (not governing): [`m4-integration-queue-research-2026-10-01.md`](../research/m4-integration-queue-research-2026-10-01.md),
      which compares serial, speculative and batched queues and recommends a serial integration tail over parallel implementation
      first. **Designer''s disposition (2026-10-01, research §7):** parallel Ticket execution with a single serial integration
      lease; runnable COMMIT_READY entries FIFO by default, dependency legality owned by the work graph, the Lead may reorder
      or defer; no batching or shared post-integration evidence in M4; a merge conflict releases the lease and returns to
      the Lead, never resolved automatically or sent straight to an Implementer; no head-of-line blocking; every integration
      attempt recomputes the dispatch predicate and binds to the current head. D4''s path is in M4. **Follow-ups (research
      §7.1):** the lease is owned by the queue entry (not the replaceable candidate or attempt) with a live invocation as
      custodian, a dead custodian is reconciled before release, and no timeout alone releases it; one automatic rebuild
      on a moved head while holding the lease, after proving no publication; DEFERRED and AWAITING_DISPOSITION are queue
      states that never grant eligibility; a conflict resolution is a new implementation attempt whose gates rerun; a plain
      head move does not by itself invalidate unchanged Ticket-scope evidence, which stays subject to the normal admissibility
      and binding rules; batching is out of scope for M4, not forbidden. **M4-D3 built (2026-10-05):** the queue entries,
      the lease and its `integration_attempt` custodian, FIFO among runnable entries, the dead-custodian reconcile, retirement
      with the unit, the ISO-004 checkout-sync lock and oracle rules 34 to 38 ([ADR-0004 amendment 2026-10-05](adr/0004-controlled-integration.md);
      ADR-0003 amendment of the same date for the custody invocation). **M4-D4 built (2026-10-05):** the one automatic rebuild
      under the same lease, custodian and place; a second move, changed legality, a conflicting or refused rebuild and an
      inconclusive validation release the lease to AWAITING_DISPOSITION; the Lead''s `aew integrate defer`, `requeue` and
      `reorder`; oracle rule 39 (ADR-0004 second amendment of 2026-10-05). Still open in M4-D: the `checks` validation path
      (D5, register D4).'
  - '#': F11
    Work: Dynamic scheduler
    Source (governing): Workflow Contract; `implementation-status.md`
    Belongs to or gated by: '**M5**'
    Notes: '|'
  - '#': F12
    Work: Workbench capability manifests, resolver, provider health in `doctor`, an MCP adapter over the Engine API
    Source (governing): '`m1-implementation-plan.md`; `m2-ambiguity-report.md`'
    Belongs to or gated by: '**M6**'
    Notes: 'Extended by F13. Provider selection, packaging and evaluation research (not governing): [`aew-phase6-airgap-capability-research-2026-10-01.md`](../research/aew-phase6-airgap-capability-research-2026-10-01.md);
      its fit with AEW''s custody and evidence rules is Q11, and Q12 settled hosting (2026-10-06).'
  - '#': F13
    Work: 'Capability discovery and progressive disclosure: an Effective Capability Manifest per invocation that keeps available,
      authorized and active apart; lazy expansion from L0 awareness to L3 exact schema; adapters advertising harness-native
      capabilities (sandbox, compaction, native review or orchestration, resume); skills that name abstract capability classes;
      manifests and schemas recorded by reference and hash; a context-economy acceptance test (a large, unrelated MCP server
      must not inflate baseline context)'
    Source (governing): '`docs/design/proposals/capability-discovery-and-progressive-disclosure-design-v0.1.md`'
    Belongs to or gated by: '**M6**, with or after F12. Sequence in §18: the registry and contract, then the manifest, then
      lazy expansion, then harness-native capabilities, then a Codex adapter on the same contract, then evaluation.'
    Notes: 'Does not expand M3. Today M3 gives runs no skills (reported unavailable) and denies OpenCode''s `subagent` outright.
      The design would allow bounded harness-native orchestration under a capability grant, with no AEW identity, credential
      or authority for the helpers (§8). M3''s custody bridge is the boundary that makes that safe. Candidate failure classes
      and invariants: Q8. Provider research: [`aew-phase6-airgap-capability-research-2026-10-01.md`](../research/aew-phase6-airgap-capability-research-2026-10-01.md)
      (Q11). Comprehensive native-feature integration stays here, not in F18. Harness-native research v0.3 (ledger HNI):
      capability state is keyed by adapter, pinned version and schema/probe identity, and what a harness advertises is kept
      apart from what reaches the model.'
  - '#': F14
    Work: 'Plan assurance and premise validation before mutating dispatch: raw stakeholder intent kept apart from derived
      interpretation, with statements typed (requirement, observation, diagnosis, inference, decision); acceptance reconstructed
      independently by a fresh role *before* it sees the proposed plan; decision-sensitive premises tested by discriminating
      probes; typed pre-implementation baselines (`EXPECTED_FAILURE`, `UNEXPECTED_PASS`, `INVALID_MEASUREMENT`, …); negative
      controls; subject kept apart from acceptance inputs, oracle, evaluator and environment, with protected acceptance
      conditions enforced through final verification; a Plan Challenge with bounded outcomes and disagreement budgets; assurance
      bound to the whole dependency set by canonical hash; `ASSURED` as one derived gate predicate at plan acceptance and
      at every dispatch path; deterministic plan lint; hierarchical inheritance of parent obligations; proportional tiers
      A–E with hard triggers; strong models at interpretation points'
    Source (governing): '`docs/design/plan-assurance-and-premise-validation-design-v0.4.md` (supersedes v0.3)'
    Belongs to or gated by: '**M4** for its extension points and deterministic primitives, early enough that M4 creates
      no conflicting workflow semantics (adopted as the post-M3 direction, Q9, 2026-10-01); **Evaluation** for phases 1–4
      (the T4 replay fixture, the deterministic gaps, a pilot on existing reviewer and verifier infrastructure, controlled
      dogfood). It does not block M4 after ADR-0011. Gating mutating dispatch on `ASSURED` needs its Workflow Contract amendment
      (its Phase 5). Decided: `ASSURED` is a derived gate predicate, not a state; the first implementation reuses reviewer
      and verifier infrastructure; a Tier-A mechanical exemption exists from the start, only when engine-checkable eligibility
      holds, and is sampled in dogfood; hard protected-condition violations are non-waivable without a new attributable
      acceptance revision; strong approved models are mandatory for the Lead and for acceptance and challenge during initial
      evaluation; tiers and routing and probe thresholds stay provisional until controlled dogfood shows acceptable false-success
      and false-blocking rates.. **Further decisions (designer, 2026-10-01; [`plan-assurance-and-classification-decisions-2026-10-01.md`](../design/plan-assurance-and-classification-decisions-2026-10-01.md)):**
      one Class 0–4 system, with no Tier A–E; Class 0 is an engine-enforced eligibility predicate (structural checks, recorded
      semantic assertions, no active hard trigger) (the former Tier A), and assurance is gates and triggers on classes;
      an acceptance revision is an F4 Ticket revision; M4''s first step is a typed `DispatchDecision` predicate used by
      every dispatch route (with a conformance test), protected-condition records and checks, the Class 0 checker and plan
      lint, never caching an old ALLOW. **Owner edits adopted (designer, 2026-10-01):** [`workflow-contract-amendment-class0-2026-10-01.md`](../design/workflow-contract-amendment-class0-2026-10-01.md),
      plan assurance v0.4, `failure-class-registry.md` v0.2 and `invariant-index.md` v0.2. Class 1–4 assurance floors stay
      evaluation hypotheses, and the §7.5 paths remain the baseline. **M4-A built (2026-10-03; `m4-ambiguity-report.md`,
      "M4-A as built"):** the typed `DispatchDecision` over a declared entrypoint registry, with its conformance test; durable
      reason codes; the first `PrimitiveSpec` declarations; protected-condition checks; the Class 0 eligibility predicate
      (enforced for mutating Tickets) and `aew plan lint`; `aew dispatch explain`; `aew work reclassify` (raise-only, recorded);
      the mutating cap as a guard that reads policy, clamped to 1 until M4-C. Still ahead in F14: `ASSURED`, the acceptance-first
      role, baselines and the challenge (Evaluation).'
    Notes: 'Motivated by the M3 dogfood''s T4 failure (O3). Already in the code to build on: `guardrails.yaml` `protected_paths`;
      review and verification of planner proposals by policy alone (`non_mutating_paths`); fail-closed ancestor plan bindings
      (ADR-0007); source-bound freshness of plan proposals (ADR-0008); `min_descendant_class` floors. What is new: the acceptance-first
      role, baselines, the challenge, the assurance predicate and evaluator protection. Relates to F5 (hierarchy revision:
      accepted baselines, admissibility), F6 (fail-closed classification), F8 (reconnaissance and stakeholder decisions).
      Architecture review 2026-10-04 (accepted 2026-10-05, Q13): I5, pin repository-local acceptance inputs by digest at
      plan acceptance and re-verify, as the deterministic half now.'
  - '#': F15
    Work: 'Lead workflow efficiency: stage commands named for the Lead''s judgment (`draft`, `start`, `request-review`,
      `request-verification`, `prepare`), each a guarded sequence of existing operations with its own durable records, returning
      completed steps, revision, runs and a typed next action; publish stays a separate decision; exit-code instrumentation
      of the command log; a paired replay against the M3 dogfood baseline'
    Source (governing): '[typed Lead surface v0.2](../design/typed-lead-surface-design-v0.2.md) (governing since 2026-10-05;
      ledger TLS); the idea note [`aew-two-interaction-surfaces-idea-v0.4-2026-10-01.md`](../design/aew-two-interaction-surfaces-idea-v0.4-2026-10-01.md)
      (adopted direction; governs §16, §17 and the F17 and anomaly obligations); `docs/design/proposals/lead-workflow-efficiency-design-v0.1.md`
      (superseded)'
    Belongs to or gated by: '**M4**, by the design''s §11 sequence: M4-D the read-only slice (F15.1), M4-E the stages (F15.2),
      M6 the role server (F15.3). **Direction adopted (designer, 2026-10-01):** the v0.4 interaction-surface direction.
      **Promoted to governing (designer and operator, 2026-10-05):** the typed Lead surface v0.2 is the governing design;
      the before-M4-E gate is met (§9). The sequence (§14): ADR-0011; a foundation shared with M4 (the queryable `DispatchDecision`
      guard substrate, durable reason codes, the first `PrimitiveSpec` declarations); M4''s queue engine through the primitive
      interface; the F15 stage foundation (`ActionProjection`, the stage-intent journal); `draft`, `start`, `request-review`,
      `request-verification` and `submit-integration` with their paired and adversarial evaluation; then M4''s normal queue
      commands and M4''s dogfood. Guards migrate incrementally, one staged primitive at a time.'
    Notes: 'Stage commands become the normal Lead interface; the primitives stay the conformance and recovery surface. Before
      the stage phase, the audit''s X1 and X2 (next commands in refusals and next actions) and T3 (exit codes in the dogfood
      log) land as its prerequisites. Ceiling: the Lead is about 40% of cost, so halving it saves about 20% overall. **Decided
      (designer, 2026-10-01):** F15 depends only on a generic policy-level `requires_disposition` property for findings
      and observations; it does not adopt F17''s proposed consequential-observation obligation. Current policy determines
      which existing findings require disposition; if F17 is adopted, its policy may mark more observations without changing
      the stage machinery. **Also decided (designer, 2026-10-01), on the implementer''s review of v0.4:** an advance `PUBLISH_IF_CLEAN`
      authorization survives the one automatic rebuild caused only by the authoritative head moving. Without advance authorization,
      integration runs in an explicit `VALIDATE_ONLY` mode: it finishes validation, releases the lease and waits for the
      Lead''s publication decision. Architecture review 2026-10-04 (accepted 2026-10-05, Q13): a typed action surface with
      MCP, CLI and dashboard as transports (D-AR2). **The design is [typed Lead surface v0.2](../design/typed-lead-surface-design-v0.2.md)**
      (governing since 2026-10-05; ledger TLS): a catalog of typed actions below transport, one runner, `StageResult` and
      a tri-state `ActionProjection`, MCP (`aew-lead`, broker-side, no credential in the MCP process) as the first normal
      transport and the CLI as parity and recovery, with nine frozen decisions. The lead developer''s review ([developer
      review](../archive/reviews/architecture-review-2026-10-04/developer-review.md)) asked for the CLI relay with JSON
      in and `ActionProjection` out as the first transport and MCP once spiked. **Resolved (designer, 2026-10-05, Q13):**
      MCP first, as the frozen design says, because v0.2''s broker-side custody answers the review''s second-credential-holder
      concern; the review''s recommendation is historical input. The work is F15.1 to F15.3 below. ARV-04 (operator, 2026-10-05):
      the typed surface is one of the two mechanisms named to keep the operator and designer''s serial path short; the other
      is F8''s operator inbox.'
  - '#': F15.2
    Work: 'Governed mutating stages: the `StageIntent` journal (hot while active, cold when terminal), the policy/dependency
      digest and `STALE_POLICY`, effective-class promotion, queryable transition and ingest guards, policy-resolved review
      and verification card sets, `ticket_draft`/`ticket_start`/`ticket_request_review`/`ticket_request_verification`/`ticket_prepare`
      as governed stages, the typed `integration_publish` decision tool, stage/primitive equivalence tests and a live OpenCode
      2.0.18 MCP spawn check'
    Source (governing): '[typed Lead surface v0.2](../design/typed-lead-surface-design-v0.2.md) §3.4, §3.6, §10, §11 (ledger
      TLS-13, TLS-14, TLS-17, TLS-26 to TLS-28)'
    Belongs to or gated by: '**M4-E**, after the before-M4-E gate (§1) and M4-D''s lease'
    Notes: Hard gates and reported metrics in the design's §10, measured by the preregistered M4-H dogfood (F19) against
      the M3 baseline. **Gated by the pre-F15.2 amendment set (approved 2026-10-05):** F15.4 (digest separation) and F15.5's
      operator capability before it ships; F15.6 before automatic relaunch is enabled
  - '#': F15.3
    Work: The `aew-run` role server (the run bridge's `whoami`, `check.run` and typed `submit` as tools inside the sandbox,
      the supervisor keeping the credential) and `aew-knowledge` as a separate capability namespace over the shared transport
      library
    Source (governing): '[typed Lead surface v0.2](../design/typed-lead-surface-design-v0.2.md) §6, §11 (ledger TLS-23,
      TLS-28)'
    Belongs to or gated by: '**M6** (M6a for the namespace rules, F13 decides what each role sees)'
    Notes: Designed only, not prototyped; ends the YAML-frontmatter failure class for role reports
  - '#': F15.4
    Work: 'Policy digest separation: every execution-policy field classified `legality_affecting` or `operational` (an unclassified
      field fails schema validation); each staged action records `legality_digest`, `operational_digest`, the revision,
