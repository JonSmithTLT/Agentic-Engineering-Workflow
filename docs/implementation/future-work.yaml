    Work: 'Stall detection: `stalled`, a reason on the Lead''s one wake list (A-58), delivered by a wake and returned by
      `aew harness wait`, naming the tool and how long, when a tool call has run N minutes with no events. Built as the
      run health projection: a field of `harness_status` (and `resume` and the dashboard run), never a store or authority,
      with H1''s rules: terminal statuses pass through, robust p95 calibration, an incremental cache, `since` from telemetry,
      an edge-triggered wake. Slices filed by the hold match: F41.8'
