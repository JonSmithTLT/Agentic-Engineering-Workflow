  - '#': E309
    Work: 'The IF-12 call record at the provider relay (IF12-01, IF12-03, IF12-12 to IF12-14, IF12-17). For each model call
      it keeps the original request and its effect, the exact recipient and the response, and issues no policy, budget,
      grant, accepted evidence or qualification of its own: a model call is a potentially chargeable and externally disclosive
      effect even with no write permission. The original call, each dispatch attempt, the provider''s request id where one
      is supplied, the generation, the response or stream and the eventual billing item stay separate and mapped, so a reconnect,
      a retry or an SDK substitution never recasts the same uncertain call as a fresh paid effect. The original call also
      binds IF12-02''s remaining fields, the WIS work and revision, the attachment and generation, and the selected IF-13
      snapshot, and a user-generated request id, idempotency key or lineage header is held as an alias, never a fresh intent
      or spend reset. Each call is in one provider effect state: PREPARED, ADMISSION_HELD, DISPATCHING, SENT, STREAMING,
      COMPLETED_OBSERVED, FAILED_BEFORE_SEND, OUTCOME_UNKNOWN, RECONCILING or SETTLED_OR_CLOSED; a local timeout is not
      proof of no remote effect or charge. Where K-01 or P-01 context is delivered through it, the record names the ingress
      that actually receives and qualifies that packet (the relay only where it genuinely hosts that ingress) and that ingress''s
      own stage, PREPARED, ATTEMPTED, DELIVERY_ACKNOWLEDGED or NOT_ESTABLISHED, never reading a provider''s SENT or a streamed
      reply as that acknowledgement. A SENT or unknown call is never redispatched automatically after a timeout, detach,
      cancel or relay recovery without the provider''s evidence of no effect or a separately qualified idempotent mechanism
      bound to the same original intent; it is reconciled by its original operation and provider references, and the uncertainty
      stays open. Cancel requested, local stream disconnected, upstream cancellation observed and no additional charge proven
      are four claims, never one; stop, drain or revoke fences new calls, keeps late results, and reports the provider effect
      and charge uncertainty as they are. Its logs, traces, retries, errors and live status carry no secret, no private
      work or reviewer existence and no restricted prompt derivative to a recipient or viewer not entitled to them, and
      usage and call status are shown only within AOI and D-01 rights. So a call interrupted after it was sent reads as
      unknown or reconciling, is not resent on its own, and no message says that no request was sent'
