      its object store and every checkout), the ledger and the user''s secrets masked; another copy of the corpus elsewhere
      on the host is not masked, so it lives in one place on a scoring host) and an allow-listed environment. The runner
      accepts only a clean exit with exactly one well-formed result, computes `passed` itself, and records no result or
      a timeout as a failed score, never a retryable `invalid_measurement`. Linux without bubblewrap refuses oracle-scored
      cells; Windows refuses held-out cases, and every other score there records `contained: false` (a same-user program
      could search the disk, so it is not tamper-evident). Proved in `tests/unit/test_eval_hidden.py`. **Held-out corpus
      isolation (designer, 2026-10-06, [decision record](../design/decisions-2026-10-06-f19-held-out-corpus-isolation.md)):**
      an M4-H experiment-protocol requirement, not an AEW architecture surface. Held-out material not yet assigned to a
      trial is never readable by a model-controlled process in either arm; for M4-H the private corpus stays off the arm
      hosts entirely, and the evaluator side releases only the selected task''s material at the trial''s start. Masking,
      F23 and F28 are not prerequisites. The runner as built scores and runs the arm on one host, so the next slice, with
      the `aew` and `raw` arms, splits it: the evaluator side keeps the corpus, ledger and oracle and releases one task;
      a corpus-free arm host runs the arm (designer''s arm-host rule, record §3: no copy, no parent directory, no mounted,
      shared or synced path and no obvious host-integration path to unreleased material; a WSL instance on a Windows host
      holding the corpus is ineligible by default; a preflight that cannot establish isolation releases nothing) and returns
      the final tree for scoring, with the facts only it can observe (whether the AEW checkout was touched, its environment),
      so the run record describes the arm host, not the evaluator. Next: the `aew` and `raw` arms by generalizing `dogfood.py`
      (the M3 driver still runs them). **Q7 adopted ([v0.3.1](../design/q7-m4h-value-gate-experiment-v0.3.1.md), operator,
      2026-10-07; ledger VGX):** M4-H''s experiment design is frozen. **Prerequisite before M4-H executes:** the evaluator/arm-host
      split and the held-out task-release runner (decision record of 2026-10-06 on held-out corpus isolation), the cold-start
      attestation (§5) and the preregistration values of §14. **Agent-effectiveness adoption (2026-10-09, [agent-effectiveness
      adoption](../design/decisions-2026-10-09-agent-effectiveness-adoption.md), ledger AEA; [agent-effectiveness synthesis](../research/agent-effectiveness-and-model-leverage-synthesis-2026-10-09.md),
      ledger AES):** raised: an evaluator-side reader of a completed run''s retained harness session database, approved
      by the operator with bounds (Revision C): the hidden evaluator opens it read-only after the run, extracts only preregistered
