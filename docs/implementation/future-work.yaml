      by one of two proofs: the owner-qualified lineage, versions, restrictions and allowed recipients of every material
      original or derived fragment and tool result; or the complete readable and introducible context of that invocation,
      later dynamic additions included, shown from outside the agent''s lineage to be bounded and unchanged through delivery
      or competently invalidated, every member of which is owner-qualified for that recipient and those destinations. The
      proof is current at each actual disclosure, and covers request bodies, prompt fragments, tool outputs, streamed material,
      retries, diagnostics and logs. A request of mixed or unknown composition (summaries, paraphrase, embedded references,
      tool errors, agent memory, context added in a continuing session) respects the intersection of its sources'' restrictions;
      where any reachable or newly introduced content may carry a narrower entitlement, the whole-universe proof does not
      apply, and only a per-fragment derivation qualified on its own will do. A mount list, an agent-authored index, a worker-set
