  - '#': Q12
    Was: 'Harness hosting, the operator session and native-feature integration: startup, the seat and session lifecycle,
      execution-profile resolution, wrapper ownership, hosting, and which native harness features are integrated (architecture
      review D-AR5)'
    Closed: '2026-10-06'
    By: 'The designer''s decision, adopted with the operator ([decision record of 2026-10-06](../design/decisions-2026-10-06-q12-hosting-and-lead-attachment.md)):
      AEW owns the project attachment, the Lead seat, generations, profile selection and provenance, and the harness owns
      model execution. An attachment opens and closes (`aew open`, `aew close`) independently of the harness; closing or
      losing it revokes AEW authority and stales its generation without ending the model, the harness, its context or admitted
      child work; every attachment is a fresh generation that re-hydrates from canonical state. Reference models: GPT-6
      Astra for the Lead, Laguna S2.1 the default worker, GPT-5.4 and approved open-source models selectable. Amends ADR-0004,
      ADR-0005, ADR-0009 and ADR-0010; F31 builds the lifecycle, F32 the reference profiles; F18, Q11 and U6 are unblocked.
      Where the knowledge, capability and dashboard services run goes to the F18 hosting design (record §12)'

