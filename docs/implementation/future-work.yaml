  rows:
  - '#': U1
    Work: 'Stall detection in `aew harness wait`: return `stalled`, naming the tool and how long, when a tool call has run
      N minutes with no events. Built as the run health projection: a field of `harness_status` (and `resume` and the dashboard
      run), never a store or authority, with H1''s rules: terminal statuses pass through, robust p95 calibration, an incremental
      cache, `since` from telemetry, an edge-triggered wake. Slices filed by the hold match: F41.8'
    Source: 'Serves `AEW-FR-24.a`, `R01-15`, `R01-13`, `R01-14`, `MSN-B3`; position A-15; the operator''s decision of 2026-11-06
      on the hold match, `2026-11-06-operator-hold-match-batches.md` (design workspace `cffb1ee`). Design inputs as held,
      not authority: review finding 2; run R-INV-0006-1 hung 20 minutes on a truncated PowerShell here-string; [run health
      projection design v0.1](../design/run-health-projection-design-v0.1.md) (approved 2026-10-05; ledger RHP-01 to RHP-11),
      as amended by [H1, run health projection implementation note](../design/run-health-projection-implementation-note-v0.1.md)
      (approved 2026-10-05; ledger RHN-01 to RHN-10); [pre-F15.2 amendment set v0.1](../design/pre-f15-2-amendment-set-v0.1.md)
      §1, §4 (PFS-01, PFS-03)'
