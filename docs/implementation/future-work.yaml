  - '#': V1
    Was: 'A provider key that expires mid-run: relaunch should re-read the key, or report the auth failure as its own status'
    Closed: '2026-10-10'
    By: 'The OpenCode adapter classifies a turn that failed with 2.0.18''s `provider.auth` (401, no retry) as `reason_code:
      provider_auth_failed` on the run record, in the existing `crashed` status (no new status); `harness status`, `harness
      wait` (with a headline) and the next action name the provider_env variables, never a value. AEW''s own records (the
      run record, the event log, the snapshot, and the status, wait and next-action output) drop a provider message that
      may concern a credential (an auth-like type, or 401, 403 or 407), which can quote part of the key, and redact key-shaped
      text from any other; the harness''s private state under the run''s `harness/` directory keeps what the harness itself
      stores. A relaunch starts a new server whose environment is built from the launcher''s at launch, so it reads the
      key as it is then; inside a Lead session the launcher is the session''s broker, whose environment is fixed when `aew
      opencode` starts, so the next action says to restart it with the new key first, and V5 tracks picking the key up without
      the restart (PR #165). `tests/integration/test_opencode_adapter.py`. Lands before the M4-H treatment freeze, so it
      is in the treatment: Lead guide +67 bytes; wait''s headline and exit 20; reason_code on wait and status rows; new
      next-action wording. The typed surface is unchanged.'

