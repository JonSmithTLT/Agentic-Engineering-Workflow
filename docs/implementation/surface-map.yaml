# The surface map (anti-drift guard G1): one entry per `aew` command (each leaf of the live parser) and per typed
# Lead tool (aew.surface.contract.TOOLS). docs/implementation/surface-map.md states the rule and which checks are
# enforced; tests/unit/test_surface_map.py checks this file against the live parser and surface.
#
# A new command or tool is registered here in the same change that adds it, with exactly one intentional `home`;
# who uses it; the vertical UAT journeys that exercise it (`journeys`: evidence, possibly none); whether it mutates
# (declared, with its basis, and cross-checked); for a Lead-reachable command, the door the Lead reaches it by today
# and its `lead_disposition` (the end state A2's plan decides); and the refusal codes it can raise. Bump `version`
# when an entry's meaning changes.
schema: aew/surface-map/v1
version: 1

vocabulary:
  homes:
    product: a supported normal workflow of the operator, the Lead or a worker
    operator-admin: the operator's authority, configuration or maintenance
    recovery: putting interrupted, lost or damaged work right
    diagnostic: observes or repairs implementation state for an expert or the operator, is needed by no supported
      normal workflow, and mutates nothing (its `mutates` is `no`)
    internal: started by AEW or the Lead's harness itself; not user-facing
  users:
    operator: the human, at their own terminal
    lead: the Lead, through its session (the typed surface, or its shell)
    worker: a bounded role inside a harness run, through the run's custody bridge
    internal: started by AEW or the Lead's harness itself, never typed by anyone
  journeys:
    V1: the fresh path, setup to a published one-line fix (vertical UAT; with its steering-on variant)
    V2: close and reopen with work active (vertical UAT; with its forced and steering-on variants)
    V3: preflight catches a misconfiguration before any Ticket (vertical UAT)
    V4: change a setting, then V1's path (vertical UAT)
  mutates:
    "no": changes no authority, policy, work state, evidence admissibility, publication, lifecycle or external
      system
    "yes": changes at least one of them
    with: changes one only with the flags it names
  doors:
    typed: the Lead's lifecycle use of it has a typed home (`via`); `primitive` is the step those tools run, and
      names this command
    shell-only (pending A2/A4): the Lead reaches it only by `aew` from its shell or the recovery `cli` tool;
      `partly_via` names the tools that cover some of its uses
  lead_dispositions:
    typed: the Lead genuinely needs it; it has a typed home (its door is typed)
    engine-owned: AEW does it deterministically; the Lead does not call it (it leaves LEAD_REACHABLE)
    forbidden-to-lead: operator, admin or diagnostic authority; exposed through neither Lead door (it leaves
      LEAD_REACHABLE)
    undecided: until A2's plan decides it, with its reason

# Every entry's `refusals` lists the aew.errors codes it is known to raise: the floor its arguments imply (any
# command: USAGE; a Lead credential: PERMISSION_DENIED and STALE_AUTHORITY; an expected revision: STALE_REVISION;
# a project: PROJECT_NOT_FOUND) and the codes its own handler raises. The inventory is partial until A2 (the Lead's
# typed homes and structured refusals) completes it; an entry may override this status with its own
# `refusal_status`. `owner` (operator, lead or mechanical) is what A1's projection will mark on the operation; it is
# `pending (A1)` until then.
refusal_status:
  inventory: partial
  structured: pending (A2)

# Commands the vertical UAT's ideal path names that do not exist yet (its PROPOSED rows). When one is built it moves
# to `commands`, and the test fails until it does.
proposed:
  - name: settings set
    ideal_path: [configure, change_model]
    note: "one operator action that validates and saves a setting (register F46.2, slice B3)"
  - name: preflight
    ideal_path: [preflight]
    note: "readiness before any Ticket, naming the cause and the fix (register F47.4, slice C2)"

commands:
  - name: doctor
    home: product
    users: [operator]
    journeys: [V3]
    mutates: "no"
    mutates_basis: "a read: validates the environment and the project state and reports"
    probe: [doctor]
    refusals: [USAGE]
    note: "V3's counted fallback while `aew preflight` does not exist"
  - name: init
    home: product
    users: [operator]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "creates the project's manifest and control state (Engine.initialize)"
    refusals: [USAGE]
  - name: status
    home: product
    users: [operator, lead]
    journeys: [V1, V2, V3, V4]
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [status]
    door: typed
    via: [status]
    refusals: [PROJECT_NOT_FOUND, USAGE]
    note: "the operator reads a revision from it in today's adopt and takeover fallbacks"
  - name: resume
    home: recovery
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read (its help: read-only)"
    probe: [resume]
    door: typed
    via: [resume]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: guide
    home: product
    users: [lead, operator]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [guide]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: checkpoint
    home: product
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [checkpoint]
    primitive: checkpoint
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: migrate
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead show
