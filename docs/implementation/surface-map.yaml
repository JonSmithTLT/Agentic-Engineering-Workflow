    note: "a Lead harness session for any harness; `aew opencode` is the journeys' entry"
  - name: lead tool
    home: recovery
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "relays one typed-tool call to the Lead broker, which commits for a mutating tool"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, USAGE]
    note: "the typed surface's shell transport (not relayed); the journeys' Lead reaches the surface over MCP"
  - name: lead mode raise
    home: operator-admin
    users: [operator]
    journeys: [V1, V2]
    mutates: "yes"
    mutates_basis: "asks the operator endpoint to commit a steering raise (authority)"
    refusals: [OPERATOR_AUTHORIZATION_REQUIRED, PROJECT_NOT_FOUND, USAGE]
    note: "the steering-on variants: the operator's decision"
  - name: lead mode lower
    home: product
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [steering]
    primitive: steering
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead mcp
    home: internal
    users: [internal]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "serves the typed surface over stdio; its mutating tools commit through the broker"
