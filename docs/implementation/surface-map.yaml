# The surface map (anti-drift guard G1): one entry per `aew` command (each leaf of the live parser) and per typed
# Lead tool (aew.surface.contract.TOOLS). docs/implementation/surface-map.md states the rule and which checks are
# enforced; tests/unit/test_surface_map.py checks this file against the live parser and surface.
#
# A new command or tool is registered here in the same change that adds it: who uses it, which journey needs it,
# which door the Lead reaches it by, and the refusal codes it can raise. `unmapped` means no journey uses it yet: a
# decision is owed (keep it and name its journey, or retire it). Bump `version` when an entry's meaning changes.
schema: aew/surface-map/v1
version: 1

vocabulary:
  users:
    operator: the human, at their own terminal
    lead: the Lead, through its session (the typed surface, or its shell)
    worker: a bounded role inside a harness run, through the run's custody bridge
    internal: started by AEW or the Lead's harness itself, never typed by anyone
    diagnostic: used to inspect or repair state, outside a working journey
  journeys:
    V1: the fresh path, setup to a published one-line fix (vertical UAT; with its steering-on variant)
    V2: close and reopen with work active (vertical UAT; with its forced and steering-on variants)
    V3: preflight catches a misconfiguration before any Ticket (vertical UAT)
    V4: change a setting, then V1's path (vertical UAT)
    diagnostic: a read or an inspection; no journey depends on it
    unmapped: no journey uses it yet; a decision is owed
  doors:
    typed: the Lead's lifecycle use of it has a typed home (`via`); `primitive` is the step those tools run
    shell-only (pending A2/A4): the Lead reaches it only by `aew` from its shell or the recovery `cli` tool;
      `partly_via` names the tools that cover some of its uses

# Every entry's `refusals` lists the aew.errors codes it is known to raise: the floor its arguments imply (any
# command: USAGE; a Lead credential: PERMISSION_DENIED and STALE_AUTHORITY; an expected revision: STALE_REVISION;
# a project: PROJECT_NOT_FOUND) and the codes its own handler raises. The inventory is partial until A2 (the Lead's
# typed homes and structured refusals) completes it; an entry may override this status with its own
# `refusal_status`. `owner` (operator, lead or mechanical) is what A1's projection will mark on the operation; it is
# `pending (A1)` until then.
refusal_status:
  inventory: partial
  structured: pending (A2)

# Commands the vertical UAT's ideal path names that do not exist yet (its PROPOSED rows). When one is built it moves
# to `commands`, and the test fails until it does.
proposed:
  - name: settings set
    ideal_path: [configure, change_model]
    note: "one operator action that validates and saves a setting (register F46.2, slice B3)"
  - name: preflight
    ideal_path: [preflight]
    note: "readiness before any Ticket, naming the cause and the fix (register F47.4, slice C2)"

commands:
  - name: doctor
    users: [operator, diagnostic]
    journeys: [V3]
    refusals: [USAGE]
    note: "V3's counted fallback while `aew preflight` does not exist"
  - name: init
    users: [operator]
    journeys: [V1, V2, V3, V4]
    refusals: [USAGE]
  - name: status
    users: [operator, lead]
    journeys: [V1, V2, V3, V4]
    door: typed
    via: [status]
    refusals: [PROJECT_NOT_FOUND, USAGE]
    note: "the operator reads a revision from it in today's adopt and takeover fallbacks"
  - name: resume
    users: [operator, lead]
    journeys: [diagnostic]
    door: typed
    via: [resume]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: guide
    users: [lead, operator]
    journeys: [diagnostic]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: checkpoint
    users: [lead]
    journeys: [unmapped]
    door: typed
    via: [checkpoint]
    primitive: checkpoint
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: migrate
    users: [operator]
    journeys: [unmapped]
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
