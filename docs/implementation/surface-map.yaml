# The surface map (anti-drift guard G1): one entry per `aew` command (each leaf of the live parser) and per typed
# Lead tool (aew.surface.contract.TOOLS). docs/implementation/surface-map.md states the rule and which checks are
# enforced; tests/unit/test_surface_map.py checks this file against the live parser and surface.
#
# A new command or tool is registered here in the same change that adds it, with exactly one intentional `home`;
# who uses it; the vertical UAT journeys that exercise it (`journeys`: evidence, possibly none); whether it mutates
# (declared, with its basis, and cross-checked); for a Lead-reachable command, the door the Lead reaches it by today
# and its `lead_disposition` (the end state A2's plan decides); and the refusal codes it can raise. Bump `version`
# when an entry's meaning changes.
schema: aew/surface-map/v1
version: 1

vocabulary:
  homes:
    product: a supported normal workflow of the operator, the Lead or a worker
    operator-admin: the operator's authority, configuration or maintenance
    recovery: putting interrupted, lost or damaged work right
    diagnostic: observes or repairs implementation state for an expert or the operator, is needed by no supported
      normal workflow, and mutates nothing (its `mutates` is `no`)
    internal: started by AEW or the Lead's harness itself; not user-facing
  users:
    operator: the human, at their own terminal
    lead: the Lead, through its session (the typed surface, or its shell)
    worker: a bounded role inside a harness run, through the run's custody bridge
    internal: started by AEW or the Lead's harness itself, never typed by anyone
  journeys:
    V1: the fresh path, setup to a published one-line fix (vertical UAT; with its steering-on variant)
    V2: close and reopen with work active (vertical UAT; with its forced and steering-on variants)
    V3: preflight catches a misconfiguration before any Ticket (vertical UAT)
    V4: change a setting, then V1's path (vertical UAT)
  mutates:
    "no": changes no authority, policy, work state, evidence admissibility, publication, lifecycle or external
      system
    "yes": changes at least one of them
    with: changes one only with the flags it names
  doors:
    typed: the Lead's lifecycle use of it has a typed home (`via`); `primitive` is the step those tools run, and
      names this command
    shell-only (pending A2/A4): the Lead reaches it only by `aew` from its shell or the recovery `cli` tool;
      `partly_via` names the tools that cover some of its uses
  lead_dispositions:
    typed: the Lead genuinely needs it; it has a typed home (its door is typed)
    engine-owned: AEW does it deterministically; the Lead does not call it (it leaves LEAD_REACHABLE)
    forbidden-to-lead: operator, admin or diagnostic authority; exposed through neither Lead door (it leaves
      LEAD_REACHABLE)
    undecided: until A2's plan decides it, with its reason
  # Where a `planned` row's disposition lands (the A1 slice plan, reviewed CLEAR, section 6): the slice whose change
  # builds its homes and decides it.
  lands:
    A1a-1: projection v2 and the `harness_status` fold; `ticket_rework` (blocked on the G3 budget question)
    A1a-2: "`resolve`'s `accept_plan` and `reconcile`"
    A1b: the handoff and its acknowledged cursor
    A2: the Lead's remaining typed homes, `work_amend` and the A2 debts
    A4: the shell door closed; the operator paths (after B1)
    C5b: the dead-custodian detector and the engine's own paths
    F9-A: F9-A's typed message send
    later: not in this plan; the row stays undecided and reachable, with its reason

# Every entry's `refusals` lists the aew.errors codes it is known to raise: the floor its arguments imply (any
# command: USAGE; a Lead credential: PERMISSION_DENIED and STALE_AUTHORITY; an expected revision: STALE_REVISION;
# a project: PROJECT_NOT_FOUND) and the codes its own handler raises. The inventory is partial until A2 (the Lead's
# typed homes and structured refusals) completes it; an entry may override this status with its own
# `refusal_status`. `owner` (operator, lead or mechanical) is what A1's projection will mark on the operation; it is
# `pending (A1)` until then.
refusal_status:
  inventory: partial
  structured: pending (A2)

# Commands the vertical UAT's ideal path names that do not exist yet (its PROPOSED rows). When one is built it moves
# to `commands`, and the test fails until it does.
proposed:
  - name: settings set
    ideal_path: [configure, change_model]
    note: "one operator action that validates and saves a setting (register F46.2, slice B3)"
  - name: preflight
    ideal_path: [preflight]
    note: "readiness before any Ticket, naming the cause and the fix (register F47.4, slice C2)"

# The A1 slice plan's dispositions (reviewed CLEAR, section 2.1): the typed tools and `resolve` choices planned as
# homes of still-undecided commands, before they exist. Each still-undecided command carries `planned: {disposition,
# homes, primitive, lands, reason}`. A home is a typed tool (built, or proposed here) or `R(<choice>)`, a `resolve`
# choice (built in aew.surface.contract.RESOLVE_CHOICE_PRIMITIVE, or proposed here with its (subject kind: primitive)
# pairs); `primitive: none` names none (a row that is not planned typed). These sections and the planned rows are
# digest-pinned in the test and only shrink: a proposal leaves in the change that builds it, which also decides the
# rows it homes ("home built => row decided"); a command leaves the Lead's shell door only decided ("out of the door
# => row decided").
proposed_tools:
  - name: ticket_rework
    expands_to: [work.transition, invoke.create.mutating, dispatch.launch]
    transitions: [[REVIEW_FAILED, RUNNING]]
    lands: A1a-1
    note: "the mutating rework stage, shaped like ticket_request_review; blocked on the G3 budget question"
  - name: work_amend
    expands_to: [work.move, work.promote, work.reclassify, work.depend]
    lands: A2
    note: "one decomposition tool, with `change: move|promote|reclassify|depend`"
  - name: message_send
    expands_to: [message.send]
    lands: F9-A
    note: "F9-A's typed send (the F9 steer-vs-queue decision, 2026-10-10), offered only with coordination.messaging on"
proposed_choices:
  - name: accept_plan
    pairs: {plan: plan.accept}
    lands: A1a-2
    note: "subject PLAN:<T>@<n>; arguments operator_answer (the quoted chat answer) and rationale"
  - name: reconcile
    pairs: {unit: work.reconcile}
    lands: A1a-2
    note: "subject UNIT:<T>, while INTERRUPTED; arguments to (an offered phase) and rationale"
  - name: adopt_proposal
    pairs: {plan: plan.adopt}
    lands: A2
  - name: reconfirm
    pairs: {plan: plan.reconfirm}
    lands: A2
  - name: classify
    pairs: {unit: verify.classify}
    lands: A2
    note: "while VERIFICATION_FAILED; argument class"
  - name: cancel
    pairs: {unit: work.cancel, invocation: invoke.cancel}
    transitions: [["*", CANCELLED]]
    lands: A2
    note: "a unit, or a live invocation"
  - name: close
    pairs: {unit: work.close}
    lands: A2
    note: "a Story or Epic at ACCEPTANCE_PENDING"
  - name: relaunch
    pairs: {run: harness.launch}
    lands: A2
    note: "a failed run whose invocation is active"
  - name: acknowledge_input
    pairs: {input: work.acknowledge-input}
    lands: A2
  - name: waive
    pairs: {gate: gate.waive}
    lands: A2
  - name: accept_record
    pairs: {unit: work.accept}
    lands: A2
    note: "a non-mutating unit with a record"
  - name: defer
    pairs: {queue: integrate.defer}
    lands: A2
  - name: requeue
    pairs: {queue: integrate.requeue}
    lands: A2
  # The A1-0 review's F1: escalation and its return, the A2 design item of the A1 slice plan §2.7.
  - name: escalate
    pairs: {unit: work.transition}
    transitions: [["*", ESCALATED]]
    lands: A2
    note: "a judgment with a rationale; its typed home is the A2 design item (§2.7)"
  - name: return_escalated
    pairs: {unit: work.transition}
    transitions: [[ESCALATED, RUNNING], [ESCALATED, REVIEW_PENDING], [ESCALATED, VERIFY_PENDING]]
    lands: A2
    note: "the escalation's outcome, with a rationale; the returns the phase order admits (§2.7, §3.1a)"

commands:
  - name: doctor
    home: product
    users: [operator]
    journeys: [V3]
    mutates: "no"
    mutates_basis: "a read: validates the environment and the project state and reports"
    probe: [doctor]
    refusals: [USAGE]
    note: "V3's counted fallback while `aew preflight` does not exist"
  - name: init
    home: product
    users: [operator]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "creates the project's manifest and control state (Engine.initialize)"
    refusals: [USAGE]
  - name: status
    home: product
    users: [operator, lead]
    journeys: [V1, V2, V3, V4]
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [status]
    door: typed
    via: [status]
    refusals: [PROJECT_NOT_FOUND, USAGE]
    note: "the operator reads a revision from it in today's adopt and takeover fallbacks"
  - name: resume
    home: recovery
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read (its help: read-only)"
    probe: [resume]
    door: typed
    via: [resume]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: guide
    home: product
    users: [lead, operator]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [guide]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: checkpoint
    home: product
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [checkpoint]
    primitive: checkpoint
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: migrate
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead show
    home: diagnostic
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [lead, show]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: lead acquire
    home: operator-admin
    users: [operator]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PROJECT_NOT_FOUND, STALE_REVISION, USAGE]
    note: "today's configure fallback (quickstart)"
  - name: lead handoff offer
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead handoff accept
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PROJECT_NOT_FOUND, STALE_REVISION, USAGE]
  - name: lead handoff cancel
    home: operator-admin
    users: [lead, operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: "shell-only (pending A2/A4)"
    lead_disposition: undecided
    planned:
      disposition: forbidden-to-lead
      homes: []
      primitive: none
      lands: A4
      reason: "joins OPERATOR_ONLY with the handoff family: reattach replaces the handoff (after B1)"
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead takeover
    home: operator-admin
    users: [operator]
    journeys: [V2]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PROJECT_NOT_FOUND, STALE_REVISION, USAGE]
    note: "V2's counted reopen fallback"
  - name: lead release
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead session
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "runs a Lead harness session that holds the Lead credential; with --acquire takes the seat"
    refusals: [PROJECT_NOT_FOUND, USAGE]
    note: "a Lead harness session for any harness; `aew opencode` is the journeys' entry"
  - name: lead tool
    home: recovery
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "relays one typed-tool call to the Lead broker, which commits for a mutating tool"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, USAGE]
    note: "the typed surface's shell transport (not relayed); the journeys' Lead reaches the surface over MCP"
  - name: lead mode raise
    home: operator-admin
    users: [operator]
    journeys: [V1, V2]
    mutates: "yes"
    mutates_basis: "asks the operator endpoint to commit a steering raise (authority)"
    refusals: [OPERATOR_AUTHORIZATION_REQUIRED, PROJECT_NOT_FOUND, USAGE]
    note: "the steering-on variants: the operator's decision"
  - name: lead mode lower
    home: product
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [steering]
    primitive: steering
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead mcp
    home: internal
    users: [internal]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "serves the typed surface over stdio; its mutating tools commit through the broker"
    launcher: {code: "aew.harness.opencode.projection:LEAD_MCP_COMMAND"}
    refusals: [USAGE]
    note: "spawned by the Lead's harness in every Lead session (not relayed)"
  - name: opencode
    home: product
    users: [operator]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "runs the Lead session (lead_broker.run_session); with --acquire takes the seat"
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: stage continue
    home: recovery
    users: [lead]
    journeys: [V2]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [resolve]
    primitive: stage.resolve
    via_choices: {continue: [stage_intent]}
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
    note: "V2's forced variant falls back to it from the shell"
  - name: stage abandon
    home: recovery
    users: [lead]
    journeys: [V2]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [resolve]
    primitive: stage.resolve
    via_choices: {abandon: [stage_intent]}
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
    note: "V2's forced variant falls back to it from the shell"
  - name: authority list
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [authority, list]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: authority accept
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: authority reject
    home: operator-admin
    users: [operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: manifest adopt
    home: operator-admin
    users: [operator]
    journeys: [V1, V2, V3, V4]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
    note: "today's configure and change-a-setting fallback"
  - name: work create
    home: product
    users: [lead]
    journeys: [V1, V2, V4]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [ticket_draft]
    primitive: work.create
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: work show
    home: product
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [work, show, "{ticket}"]
    door: typed
    via: [work_show]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: work list
    home: diagnostic
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe:
      - [work, list]
      - [work, list, --state, READY]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: work ready
    home: diagnostic
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [work, ready]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: work assign
    home: product
    users: [lead]
    journeys: [V1, V2, V4]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: typed
    via: [ticket_start]
    primitive: work.assign
    lead_disposition: typed
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: work roles
    home: diagnostic
    users: [operator, lead]
    journeys: []
    mutates: "no"
    mutates_basis: "a read: its handler only reads the committed state or local telemetry"
    probe: [work, roles, "{ticket}"]
    refusals: [PROJECT_NOT_FOUND, USAGE]
  - name: work staff
    home: product
    users: [lead, operator]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: "shell-only (pending A2/A4)"
    lead_disposition: undecided
    planned:
      disposition: typed
      homes: [ticket_draft]
      primitive: work.staff
      lands: A2
      reason: "a specialty choice is the Lead's judgment, with no operator attribution path (`--by` retired); `ticket_draft` staffs at creation only, so re-staffing an existing Ticket has no typed home yet (`uncovered`, the A1-0 review's F2)"
      options: {work_id: uncovered, "--execute": ticket_draft, "--review": ticket_draft, "--verify": ticket_draft, "--forbid": uncovered, "--remove": uncovered, "--by": retired, "--pin": uncovered, "--reason": ticket_draft}
      uncovered:
        lands: A2
        uses:
          - "option --forbid"
          - "option --pin"
          - "option --remove"
          - "option work_id"
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: work transition
    home: product
    users: [lead]
    journeys: [V1, V2, V4]
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: "shell-only (pending A2/A4)"
    partly_via: [ticket_start, ticket_request_review, ticket_request_verification, ticket_prepare]
    primitive: work.transition
    lead_disposition: undecided
    planned:
      disposition: typed
      homes: [ticket_rework, ticket_start, ticket_request_review, ticket_request_verification, ticket_prepare, "R(escalate)", "R(return_escalated)"]
      primitive: work.transition
      lands: A2
      reason: "the stage steps, the rework (`ticket_rework`, blocked on the G3 budget question) and escalation and its return (A2) type some of its edges, and cancelling is `work cancel`'s; the replans, the regressions and the re-verification have no typed home yet (`uncovered`, the A1-0 review's F1), so it is decided in A2 at the earliest"
      options: {work_id: homes, "--to": homes, "--reason": homes}
      uncovered:
        lands: A2
        uses:
          - "transition ASSIGNED -> REPLAN_REQUIRED"
          - "transition BLOCKED -> REPLAN_REQUIRED"
          - "transition COMMIT_READY -> REPLAN_REQUIRED"
          - "transition COMMIT_READY -> RUNNING"
          - "transition ESCALATED -> REPLAN_REQUIRED"
          - "transition INTERRUPTED -> REPLAN_REQUIRED"
          - "transition READY -> REPLAN_REQUIRED"
          - "transition REVIEW_FAILED -> REPLAN_REQUIRED"
          - "transition REVIEW_PASSED -> COMMIT_READY"
          - "transition REVIEW_PASSED -> REPLAN_REQUIRED"
          - "transition REVIEW_PASSED -> RUNNING"
          - "transition REVIEW_PENDING -> REPLAN_REQUIRED"
          - "transition REVIEW_PENDING -> RUNNING"
          - "transition RUNNING -> COMMIT_READY"
          - "transition RUNNING -> REPLAN_REQUIRED"
          - "transition RUNNING -> VERIFY_PENDING"
          - "transition VERIFICATION_INCONCLUSIVE -> REPLAN_REQUIRED"
          - "transition VERIFICATION_INCONCLUSIVE -> RUNNING"
          - "transition VERIFICATION_INCONCLUSIVE -> VERIFY_PENDING"
          - "transition VERIFIED -> REPLAN_REQUIRED"
          - "transition VERIFIED -> RUNNING"
          - "transition VERIFY_PENDING -> REPLAN_REQUIRED"
          - "transition VERIFY_PENDING -> RUNNING"
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
    note: "the stages run the transitions they own; a free transition (rework, a projection hint) has no typed home"
  - name: work dispatch
    home: product
    users: [lead]
    journeys: []
    mutates: "yes"
    mutates_basis: "takes --expect-rev: commits a control transition (compare-and-set on the control revision)"
    door: "shell-only (pending A2/A4)"
    lead_disposition: undecided
    planned:
      disposition: typed
      homes: []
      primitive: work.dispatch
      lands: A2
      reason: "policy picks the executor and the loop runs it; its non-mutating start home is A2's design item, and it stays reachable until then"
      options: {work_id: uncovered, "--card": uncovered, "--profile": uncovered, "--model": uncovered, "--effort": uncovered, "--launch": uncovered}
      uncovered:
        lands: A2
        uses:
          - "entrypoint work.dispatch"
          - "option --card"
          - "option --effort"
          - "option --launch"
          - "option --model"
          - "option --profile"
          - "option work_id"
    owner: pending (A1)
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: work redispatch
