    journeys: [unmapped]
    refusals: [PERMISSION_DENIED, PROJECT_NOT_FOUND, STALE_AUTHORITY, STALE_REVISION, USAGE]
  - name: lead handoff accept
    users: [operator]
    journeys: [unmapped]
    refusals: [PROJECT_NOT_FOUND, STALE_REVISION, USAGE]
  - name: lead handoff cancel
    users: [lead, operator]
    journeys: [unmapped]
    door: "shell-only (pending A2/A4)"
