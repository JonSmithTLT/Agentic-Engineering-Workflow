# The build board's data: one entry per AEW system, what is built, wired, switched on and used, and what is left to
# finish it (register: the systems generator). `python tools/systems.py check` holds it to its owners in the fast lane
# (tests/unit/test_systems.py); its docstring names every rule.
#
# Only hand-kept fields and ids are stored. What another file owns is named by its id and never restated: a row's
# priority is its place in the register's Now list, a pull request's state is GitHub's, and the requirement ids a
# system serves are derived from serves_claims. Cite a register row by its id, never its line. A record outside this
# repository is cited by its file name only.
#
# Who keeps what: purpose, finish_line, remaining, recommendation, who and reason by the Lead, from the designer's
# rulings; used_in_default_flow with its evidence by the Lead, after a real run; decision by the Lead, quoting the
# operator. wip_limit is the operator's N; tools/systems.py counted_systems defines the count (FORMAT.md rule 1).
# unowned lists the open Now rows that belong to no one system, each with its reason.
# wip_allowance holds the operator's words, cap and quoted date; it is stale once the count is back at or under N.
#
# First imported 2026-11-06 from the lead designer's board, draft 3 (47 entries).
