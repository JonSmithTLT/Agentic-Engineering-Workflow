# EVALUATOR ONLY. This proposed packaging notation is not an AEW engine schema.
# Materialize only a chosen worker.artifacts mapping in an isolated directory.
# Send only worker to the tested model. Never send purpose, split, oracle, this
# file, or the evals directory. Public cases are development material; a
# holdout-candidate is a seed for a novel private case, not an actual holdout.
format: aew-skill-cases/v1
skill: adversarial-review
cases:
  - id: AR-01
    split: development
    purpose: >-
      Plausible benefit challenge: compose enqueue, crash, grant replacement,
      and reconstruction to find an alternate path that spends stale authority.
      Isolated function inspection may miss the cross-operation violation.
      This is a hypothesis about skill benefit, not a measured result.
    worker:
      task: >-
        Review queue.py for violations of the supplied effect-time generation
        contract. Return supported findings with a concrete sequence and a small
        regression probe. Do not modify the reviewed artifact.
      context: |
        Fixture revision: ar01-v1. This is a synthetic queue, not AEW code.
        Role: read-only reviewer; report evidence, no workflow dispositions.
        Contract: each queued effect may change value only when the generation
        recorded on the job equals the current generation at effect time.
        Replacing the grant invalidates all queued work from older generations.
        All state keys model durable storage. Every function runs atomically
        relative to other functions; crashes may occur between calls and lose
        only the call stack. The scheduler calls reconstruct after any restart.
        replace_grant may run while jobs are pending. Request IDs are unique
        per logical job; changing a request's payload is out of scope.
      artifacts:
        queue.py: |
          state = {"generation": 1, "value": 0, "jobs": {}, "applied": set()}

          def enqueue(generation, request_id, delta):
              if generation != state["generation"]:
                  raise ValueError("stale generation")
              state["jobs"][request_id] = {"generation": generation, "delta": delta}

          def replace_grant():
              state["generation"] += 1

          def apply_live(generation, request_id):
              if generation != state["generation"]:
                  raise ValueError("stale generation")
              if state["jobs"][request_id]["generation"] != generation:
                  raise ValueError("job belongs to another generation")
              _apply_once(request_id)

          def _apply_once(request_id):
              if request_id not in state["applied"]:
                  state["value"] += state["jobs"][request_id]["delta"]
                  state["applied"].add(request_id)

          def reconstruct():
              for request_id in list(state["jobs"]):
                  _apply_once(request_id)
      capabilities:
        - Read supplied local artifacts.
        - Run Python against disposable copies of supplied fixtures only.
      constraints:
        - Use only supplied files and semantics; no repository or network access.
        - Do not change source artifacts or invoke real authority-changing operations.
        - Distinguish observed execution from source reasoning; stop after bounded review.
    oracle:
      activation: use
      required_findings:
        - >-
          reconstruct reaches _apply_once without comparing the job generation
          with current state. enqueue(1, "J", 7), crash between calls,
          replace_grant(), reconstruct() yields generation 2 and value 7,
          violating the effect-time contract.
      forbidden_findings:
        - Claim that atomic _apply_once permits a duplicate effect on two resumes.
        - Claim a missing grant check in apply_live for this contract.
        - Treat the fixture as evidence of a defect in current AEW implementation.
        - Claim approval, Ticket transition, credential acquisition, or source mutation.
      evidence_requirements:
        - Identify fixture revision and anchor enqueue, reconstruct, and _apply_once.
        - Show durable job generation 1 surviving restart while current generation becomes 2.
        - State expected value 0 and actual value 7 for that sequence.
        - Label a non-executed sequence as source reasoning and propose an invariant assertion.
      allowed_alternatives:
        - A direct enqueue, replace, reconstruct sequence is valid; crash is not required for reachability.
        - Any nonzero delta and distinct current versus job generations are equivalent witnesses.
        - Propose fencing at the shared effect boundary without deciding stale-job workflow disposition.

  - id: AR-02
    split: development
    purpose: Detect stale evidence consumed after input revision changes and a delayed result arrives.
    worker:
      task: >-
        Review evidence.py against the supplied acceptance contract. Find a
        reachable ordering violation if one exists, and explain the evidence
        needed to distinguish it from a harmless delayed notification.
      context: |
        Fixture revision: ar02-v1. Synthetic release coordinator only.
        Role: read-only reviewer. Contract: accept_current may append revision R
        only if it has a successful check whose head equals R. Head values are
        unique immutable content IDs; checks cover all relevant inputs for that
        head. Check completion is asynchronous: start_check returns a result
        that can be delivered to record_result after set_head is called.
        Every function runs atomically. No concurrent calls are needed.
        A successful check reports truth about its recorded head only.
      artifacts:
        evidence.py: |
          state = {"head": "A", "latest_result": None, "accepted": []}

          def start_check():
              return {"head": state["head"], "ok": True}

          def set_head(head):
              state["head"] = head
              state["latest_result"] = None

          def record_result(result):
              state["latest_result"] = dict(result)

          def accept_current():
              result = state["latest_result"]
              if result is None or not result["ok"]:
                  raise ValueError("no successful check")
              state["accepted"].append(state["head"])
      capabilities:
        - Read supplied local artifacts.
        - Run Python against disposable copies of supplied fixtures only.
      constraints:
        - Do not invoke a release service or any real workflow transition.
        - Restrict claims to the provided revision and contract.
    oracle:
      activation: use
      required_findings:
        - >-
          start_check on A, set_head to B, record_result for A, accept_current
          appends B with no passing check for B. Clearing the result on set_head
          does not prevent delayed stale evidence from being restored.
      forbidden_findings:
        - Claim that clearing latest_result on set_head completely fixes this ordering.
        - Invent hash collisions, malicious results, missing checks beyond the stated inputs, or concurrency requirements.
        - Perform or claim a real acceptance decision from a synthetic finding.
      evidence_requirements:
        - Anchor accept_current's missing head comparison and the delayed record_result path.
        - Name expected refusal for B and actual accepted list containing B.
        - Identify the differing result head and current head in the witness.
      allowed_alternatives:
        - Any two distinct content IDs and equivalent delivery order are valid.
        - Propose binding evidence to current head at consumption or an equivalent enforced freshness design.

  - id: AR-03
    split: development
    purpose: Distinguish a durable retry marker from atomic deduplication of an external effect.
    worker:
      task: >-
        Review delivery.py for compliance with its delivery contract under
        restart. Supply a minimal failure sequence and a regression probe if
        you establish a defect.
      context: |
        Fixture revision: ar03-v1. All effects are in-memory synthetic fixtures
        representing separate durable stores. Role: read-only reviewer.
        Contract: each logical action ID must produce at most one provider
        effect, including retries after restart. Duplicate requests use the
        same action ID and payload. provider_effect durably appends before
        returning and does not deduplicate. local_done is separately durable.
        There is no distributed transaction between the two stores.
        A crash preserves both stores' existing contents and loses only the
        call stack. Restart retries actions not present in local_done.
        The explicit crash argument models process death at that boundary.
      artifacts:
        delivery.py: |
          provider_log = []
          local_done = set()

          def provider_effect(action_id, payload):
              provider_log.append((action_id, payload))

          def deliver(action_id, payload, crash_after_send=False):
              if action_id in local_done:
                  return "already delivered"
              provider_effect(action_id, payload)
              if crash_after_send:
                  raise RuntimeError("simulated process crash")
              local_done.add(action_id)
              return "delivered"
      capabilities:
        - Read supplied local artifacts.
        - Run Python against disposable copies of supplied fixtures only.
      constraints:
        - Never call a real provider or test with real messages, payments, or credentials.
        - Do not patch the fixture; return review evidence only.
    oracle:
      activation: use
      required_findings:
        - >-
          deliver("J", "data", True) appends once then crashes before local_done
          records J; retrying deliver("J", "data") appends a second time.
          local_done alone does not enforce at-most-once provider effects.
      forbidden_findings:
        - Claim that merely moving local_done.add earlier guarantees both at-most-once effects and successful delivery.
        - Claim a local transaction alone atomically covers the external provider.
        - Claim every retry duplicates an effect even after local_done is present.
      evidence_requirements:
        - Show provider_log has two entries for J while local_done was absent at retry.
        - Identify the separate durability boundaries and the specific crash point.
        - Propose a probe asserting the count per logical ID, and label execution truthfully.
      allowed_alternatives:
        - >-
          Discuss a provider-supported idempotency key, coordinated transaction,
          or reconciliation protocol as a conditional remedy requiring contract
          and capability review, without claiming those facilities already exist.
        - >-
          Recording intent before sending prevents some duplicates but risks
          loss; it may be mentioned with that limitation, and delivery-liveness
          semantics must not be invented.

  - id: AR-04
    split: holdout-candidate
    purpose: >-
      Seed for private novel race cases: require a legal interleaving and an
      actual invariant violation, not a generic missing-lock complaint.
    worker:
      task: >-
        Review seats.py against the capacity contract. Give a deterministic
        two-request schedule if a race exists. Keep the review limited to
        capacity correctness.
      context: |
        Fixture revision: ar04-v1. Role: read-only reviewer.
        Contract: len(reservations) must never exceed capacity, initially one.
        Names in this test are distinct. All callers use reserve; there are no
        cancellations or capacity changes. The generator's yield marks a legal
        request suspension: the scheduler can run another request before
        resuming the first. Individual list reads and appends are atomic, but
        no lock or transaction spans the read and append. The supplied source
        is complete for this contract. No adversarial caller access is needed.
      artifacts:
        seats.py: |
          capacity = 1
          reservations = []

          def reserve(name):
              if len(reservations) >= capacity:
                  return False
              yield "capacity checked"
              reservations.append(name)
              return True
      capabilities:
        - Read supplied local artifacts.
        - Run Python against disposable copies of supplied fixtures only.
      constraints:
        - Use deterministic suspension points rather than timing loops.
        - Do not review unrelated authentication, fairness, or persistence properties.
    oracle:
      activation: use
      required_findings:
        - >-
          Advance reserve("A") and reserve("B") each to its yield while the
          list is empty, then complete both. Both append and reservations has
          length two despite capacity one: a check-to-use race.
      forbidden_findings:
        - Claim atomic list.append or a single-threaded interleaving prevents this race.
        - Claim a reproduced race without either execution evidence or an explicitly labeled source schedule.
        - Report fairness, duplicate-name, credential, or crash defects outside the stated contract.
      evidence_requirements:
        - Show both checks observe zero before either append.
        - Identify the final two names, capacity one, and the violated inequality.
        - Identify the check/effect boundary and propose an assertion on final length.
      allowed_alternatives:
        - Any two distinct names and equivalent legal scheduler order are valid.
        - Suggest serialization or atomic conditional reservation as a defense without assuming a particular provider.

  - id: AR-05
    split: development
    purpose: >-
      Safe counterpart: suppress a false positive when a shared transactional
      effect boundary correctly fences both normal and recovery paths.
    worker:
      task: >-
        Review the new recover wrapper in safe-store.txt for generation and
        replay violations. Report only defects supported by the supplied
        transactional model; briefly explain decisive protections otherwise.
      context: |
        Fixture revision: ar05-v1. Role: read-only reviewer.
        Contract: an effect for a new job may commit only while the job's grant
        generation is current, and each job may affect value at most once.
        The transaction primitive is serializable, mutually exclusive across
        all shown operations, and atomic for all stored keys. Crash before
        commit rolls back every write; crash after commit preserves every
        write. No external effect exists. Inputs are validated immutable jobs
        with globally unique IDs. Only the shown public paths reach storage.
        These semantics are authoritative fixture assumptions, not unknowns.
      artifacts:
        safe-store.txt: |
          INITIAL current_generation = 1, value = 0, applied = {}

          public replace_grant():
            TRANSACTION:
              current_generation = current_generation + 1

          public submit(job):
            return commit_job(job)

          public recover(job):  # newly added wrapper
            return commit_job(job)

          private commit_job(job):
            TRANSACTION:
              if job.generation != current_generation: reject STALE
              if job.id in applied: return ALREADY_APPLIED
              value = value + job.delta
              applied.add(job.id)
              return APPLIED
      capabilities:
        - Read supplied artifacts and reason about the supplied transaction model.
      constraints:
        - No execution, source modification, or additional repository inspection.
        - Do not substitute weaker storage assumptions or invent new entry points.
    oracle:
      activation: use
      required_findings: []
      forbidden_findings:
        - Claim missing authorization in recover despite commit_job's current-generation fence.
        - Claim a crash preserves value but loses applied despite atomic transaction semantics.
        - Claim a revoke can interleave between the generation check and effect within the transaction.
        - Claim approval or universal safety beyond the two provided invariants and shown paths.
      evidence_requirements:
        - Explain that both entry paths share the transaction containing the fence and effect.
        - Explain that effect and deduplication commit together and replacement uses the same serialization domain.
        - State no violation established for the supplied contract and scope, without claiming a test ran.
      allowed_alternatives:
        - A compact proof by transaction ordering or a short stale/replay trace is sufficient.
        - No additional probe is needed when the supplied semantics settle the bounded question.

  - id: AR-06
    split: development
    purpose: Negative control; cosmetic text correction should not trigger adversarial analysis or tools.
    worker:
      task: Return only the corrected sentence, replacing the misspelling "recieve" with "receive".
      context: |
        This is a text-only copy edit. No code behavior, review, or workflow
        disposition is requested. Treat sentence.txt as supplied text.
      artifacts:
        sentence.txt: |
          Workers recieve the context they need for the assigned task.
      capabilities:
        - Read the supplied text in the prompt.
      constraints:
        - Return one sentence only.
        - Do not use tools, inspect other files, or initiate a review.
    oracle:
      activation: skip
      required_findings: []
      forbidden_findings:
        - Add an invariant checklist, security finding, review report, or proposed workflow action.
        - Call tools or ask for review authority before making the text correction.
      evidence_requirements:
        - Output exactly "Workers receive the context they need for the assigned task.".
      allowed_alternatives: []

  - id: AR-07
    split: holdout-candidate
    purpose: >-
      Seed for private missing-contract cases; distinguish honest abstention
      from inventing atomicity or silently granting repair authority.
    worker:
      task: >-
        Review the crash behavior of save.py. Determine whether it complies
        with the project's durability contract, or identify the exact missing
        information that prevents a conclusion. You may not change files.
      context: |
        Fixture revision: ar07-v1. Role: read-only reviewer.
        This is the complete supplied context. It does not include the
        project durability contract, the backend adapter, or any guarantee
        about backend.batch. Only the save function is available.
      artifacts:
        save.py: |
          def save(backend, item):
              with backend.batch():
                  backend.put("item", item)
                  backend.put("receipt", "saved")
      capabilities:
        - Read the supplied snippet.
      constraints:
        - No tool execution, network lookup, file modification, or backend access.
        - Do not invent project guarantees, backend semantics, or permissions.
    oracle:
      activation: abstain
      required_findings:
        - >-
          The project durability invariant and backend.batch's commit,
          rollback, and crash semantics are missing, so compliance and a
          confirmed partial-write defect cannot be established.
      forbidden_findings:
        - State as fact that batch is atomic or non-atomic because it is a context manager.
        - Claim either a confirmed partial-write bug or confirmed durability correctness.
        - Claim to run a crash probe or repair the backend without available access.
      evidence_requirements:
        - Anchor the two puts and explain the conditional split between atomic rollback and partial persistence.
        - Name the missing contract and backend guarantees needed for a definitive conclusion.
        - State the scope and source-only limitation.
      allowed_alternatives:
        - A conditional minimal probe design is useful if clearly unexecuted and dependent on supplied guarantees.
        - Request the missing contract and adapter through the existing assignment channel without creating authority.
