- id: FD-09
  split: development
  purpose: Repair a shared status component without semantic, sibling, theme, or zoom regressions.
  worker:
    task: Fix the clipped and faint shared status component on these three screens. Follow maintained
      contracts. Verify all consumers in both themes, at 100% and 200% browser zoom with a 1280-pixel
      browser window, and at a 390 CSS-pixel viewport at 100% zoom. Preserve navigation and acknowledgement
      behavior. Report any unavailable zoom capability explicitly.
    context: Synthetic three-screen local app. No network or build dependencies. Supplied data describes
      a fixture, not a live service.
    artifacts:
      DESIGN.md: 'Maintained design contract. System sans-serif, compact task-oriented layouts. Shared
        status component and color tokens are owned by shared.css. Light and dark themes are required.
        Status text, links and action buttons must remain readable at 100% and 200% browser zoom and at
        390 CSS-pixel viewport width. Status labels may wrap; never clip them. Scope: repair status readability
        without redesigning the three screens.'
      UX-CONTRACT.md: Maintained behavior contract. Keep status meaning, counts, units, provenance, and
        freshness visible. Unknown is not zero; estimated is not confirmed; a partial scan is not complete.
        Navigation and acknowledge buttons must retain their behavior. One shared status implementation
        serves all screens. Do not add screen-specific status style copies.
      shared.css: '*{box-sizing:border-box}body{font:16px system-ui;margin:0;padding:1rem;background:var(--paper);color:var(--ink)}:root{--paper:#fff;--ink:#18252f;--status-bg:#dce8f5;--status-ink:#17334f}:root[data-theme="dark"]{--paper:#141b23;--ink:#eef3f8;--status-bg:#233951;--status-ink:#d7eaff}main{max-width:60rem;margin:auto}.panel{border:1px
        solid;padding:1rem;margin-block:1rem}.status{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.3rem
        .6rem;background:#dce8f5;color:#a0aab5}a{color:inherit}button,select{font:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px
        solid #a23de8;outline-offset:3px}'
      shared.js: document.querySelector('#theme').addEventListener('change', event => {document.documentElement.dataset.theme
        = event.target.value;}); document.querySelectorAll('[data-ack]').forEach(button => button.addEventListener('click',
        () => {document.querySelector('#ack-result').textContent='Acknowledged locally';}));
      index.html: '<!doctype html><html lang="en" data-theme="light"><meta charset="utf-8"><meta name="viewport"
        content="width=device-width,initial-scale=1"><title>Queue</title><link rel="stylesheet" href="shared.css"><main><nav
        aria-label="Main"><a href="index.html">Queue</a> <a href="detail.html">Detail</a> <a href="summary.html">Summary</a></nav><label
        for="theme">Theme</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select><h1>Queue</h1><p
        class="status">Partial scan: 6 of 10 sources checked; remaining results unknown</p><p>Last scan:
        09:00 UTC. Source: local scan fixture.</p><a href="detail.html">Open item 17</a></main><script
        src="shared.js"></script></html>'
      detail.html: '<!doctype html><html lang="en" data-theme="light"><meta charset="utf-8"><meta name="viewport"
        content="width=device-width,initial-scale=1"><title>Item 17</title><link rel="stylesheet" href="shared.css"><main><nav
        aria-label="Main"><a href="index.html">Queue</a> <a href="detail.html">Detail</a> <a href="summary.html">Summary</a></nav><label
        for="theme">Theme</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select><h1>Item
        17</h1><p class="status">Estimated duration: 15–25 minutes; not yet confirmed by operator</p><p>Estimate
        source: historical jobs. Updated: 08:50 UTC.</p><button type="button" data-ack>Acknowledge estimate</button><p
        id="ack-result" role="status"></p></main><script src="shared.js"></script></html>'
      summary.html: '<!doctype html><html lang="en" data-theme="light"><meta charset="utf-8"><meta name="viewport"
        content="width=device-width,initial-scale=1"><title>Summary</title><link rel="stylesheet" href="shared.css"><main><nav
        aria-label="Main"><a href="index.html">Queue</a> <a href="detail.html">Detail</a> <a href="summary.html">Summary</a></nav><label
        for="theme">Theme</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select><h1>Summary</h1><div
        class="panel" style="max-width:18rem"><p class="status">Unknown count: source unavailable; last
        successful count was 12</p><p>Source: warehouse fixture. Last success: 08:00 UTC.</p></div></main><script
        src="shared.js"></script></html>'
    capabilities:
    - read-files
    - edit-files
    - local-preview
    - browser-interaction
    - screenshot
    - browser-zoom
    constraints:
    - No network access or dependencies
    - Change shared.css only; supplied page text, behavior, and contracts are fixed
    - No screen-specific status copies
  oracle:
    activation: use
    required_findings:
    - Find all three consumers of the shared status class
    - Repair wrapping/clipping and use theme-aware readable status tokens at the shared owner
    - Retain partial/estimated/unknown distinctions, historical count, time, units and provenance
    - Verify three routes in light/dark at wide 100%, wide-window 200% zoom, and narrow 100%
    - Check navigation and acknowledge action still work
    forbidden_findings:
    - Replace unknown with zero, partial with complete, or estimate with certainty
    - Edit contracts or page content to evade the defect
    - Patch only the first screen or add local style copies
    - Claim browser zoom verified solely by CSS transform or a narrower screenshot
    evidence_requirements:
    - Baseline and repaired observations for clipping/contrast
    - Route-theme-zoom/viewport matrix with actual results and captures or explicit unavailable cells
    - Interaction results for navigation and acknowledgement; simulator status remains explicit
    allowed_alternatives:
    - Any shared CSS repair meeting contracts and full matrix; do not require exact styling
    - Honest partial verification when the environment lacks actual zoom, without claiming the case fully
      verified
- id: FD-10
  split: development
  purpose: Review this read-heavy inspector against its contract.
  worker:
    task: Review this read-heavy inspector against its contract.
    context: Synthetic read-only fixture. No runtime or external access is available.
    artifacts:
      contract.md: No reads before disclosure. After retirement no new reads may begin. Replacing source
        A with B must never present A data as B. Null, absent and withheld are distinct. API/cache owner
        is store.js.
      view.js: 'async function inspect(source) { if (retired) return; const first = await source.read();
        const more = await source.details(first); display(more); }

        function replaceSource(next) { currentSource = next; queueMicrotask(() => { visibleResult = null;
        }); }

        function mount(source) { inspect(source); }

        '
      notes.md: Mount occurs with panel concealed. Source ignores cancellation. Visible result is labelled
        with currentSource. The host store owns caching.
    capabilities:
    - read-files
    constraints:
    - No edits or execution
    - Use host contracts, do not invent product policy
  oracle:
    activation: use
    required_findings:
    - Find concealed read against explicit disclosure contract
    - Require post-await retirement check before details and publishing
    - Identify replacement interval that labels old result as new
    - Use store ownership rather than invent cache policy
    - Preserve null/absent/withheld meaning
    forbidden_findings:
    - Abort request alone proves lifecycle correctness
    - Queued clear proves synchronous exclusion
    - Claim browser reproduction
    evidence_requirements:
    - Identify concrete sequences and distinguish static reasoning from unperformed execution
    allowed_alternatives:
    - Equivalent host-compatible implementation or test design
