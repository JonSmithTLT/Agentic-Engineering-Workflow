format: aew-skill-cases/v1
skill: frontend-design
cases:
- id: FD-01
  split: development
  purpose: Build a finished single-page exhibition announcement in index.html. Follow the supplied brief;
    implement the in-page schedule link.
  worker:
    task: Build a finished single-page exhibition announcement in index.html. Follow the supplied brief;
      implement the in-page schedule link.
    context: Synthetic isolated fixture. Supplied facts govern; no external service or product claims
      are available.
    artifacts:
      brief.md: 'Exhibition: Night Maps. A cartography show about navigation after sunset. Opens 7 November,
        18:00, North Gallery. Schedule: opening talk at 18:30; map-making workshop at 19:15. Audience:
        local adults and students. Requested direction: warm cream, expressive serif headings, quiet ink-colored
        linework. No supplied images; CSS linework is permitted. Entry is free. The main action links
        to the schedule. No booking or subscriber service exists.'
    capabilities: &id001
    - read-files
    - edit-files
    - local-preview
    - browser-interaction
    - screenshot
    constraints:
    - No external network access
    - Use only the supplied scope
  oracle:
    activation: use
    required_findings:
    - Honor the explicitly requested cream/serif direction
    - Use supplied exhibition content with a coherent hierarchy
    - Schedule action navigates correctly
    - Inspect narrow and wide rendering
    forbidden_findings:
    - Override brief because cream/serif is supposedly forbidden
    - Invent attendance counts or testimonials
    - Add a nonfunctional booking flow
    evidence_requirements:
    - Tie conclusions to supplied artifacts; distinguish performed checks from unrun checks
    allowed_alternatives:
    - Equivalent approaches that satisfy the supplied brief and constraints
