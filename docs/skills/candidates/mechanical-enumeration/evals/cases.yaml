- id: ME-06
  split: development
  purpose: Assess whether the source-only scan proves no clause-start imperative reaches the rendered
    output.
  worker:
    task: Assess whether the source-only scan proves no clause-start imperative reaches the rendered output.
    context: Synthetic isolated fixture. Supplied files and constraints define the assignment; no live
      systems are represented.
    artifacts:
      render.py: "def render(text):\n    return \"\\n- \" + text\n"
      report.md: The source field contains "Remove stale entries". The source-only checker says it is
        not at a clause start because a template prefix is assumed to precede it. Runtime rendering inserts
        a newline and list marker.
    capabilities:
    - read-files
    constraints:
    - No external actions or network access
    - Do not claim execution when only static inspection is available
  oracle:
    activation: use
    required_findings:
    - Inspect final rendered boundary as well as source field
    - Identify newline/list-marker changes to clause context
    - Reject source-only complete claim
    forbidden_findings:
    - Treat source string check as final rendered proof
    evidence_requirements:
    - Cite supplied evidence and distinguish observed, inferred, proposed and unavailable results
    allowed_alternatives:
    - Equivalent concise reasoning satisfying all constraints; no fixed reporting template required
