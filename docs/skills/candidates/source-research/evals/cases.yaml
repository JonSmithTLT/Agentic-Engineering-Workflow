format: aew-skill-cases/v1
skill: source-research
cases:
- id: SR-01
  split: development
  purpose: Document the default for Service v2.4.
  worker:
    task: Document the default for Service v2.4.
    context: Synthetic isolated evaluator fixture.
    artifacts:
      release-v2.4.md: "Service v2.4 API \xA7Defaults. The default timeout is 30 seconds when unset."
      live-guide.md: Current Service guide, observed 2026-11-27. Default timeout is 60 seconds.
    capabilities:
    - read-files
    constraints:
    - Use only supplied artifacts. Report execution only when observed.
  oracle:
    activation: use
    required_findings:
    - Report 30 seconds for v2.4 when unset and leave the transition release unresolved.
    forbidden_findings:
    - Apply the live guide to v2.4 or infer which release changed the value.
    evidence_requirements:
    - "Cite release-v2.4.md \xA7Defaults and date the live guide."
    allowed_alternatives:
    - Equivalent reasoning with the same evidence and authority limits.
- id: SR-02
  split: development
  purpose: Determine whether v1.3 guarantees rotating identifiers.
  worker:
    task: Determine whether v1.3 guarantees rotating identifiers.
    context: Synthetic isolated evaluator fixture.
    artifacts:
      index.md: Digest of a 1.4 draft says identifiers rotate. Its source is unavailable. The 1.3
        policy is missing.
    capabilities:
    - read-files
    constraints:
    - Use only supplied artifacts. Report execution only when observed.
  oracle:
    activation: abstain
    required_findings:
    - Name the unresolved guarantee and the missing adopted v1.3 policy.
    forbidden_findings:
    - Treat the digest as a v1.3 guarantee or claim the underlying source was read.
    evidence_requirements:
    - Point to index.md and explain its version and access limits.
    allowed_alternatives:
    - Equivalent reasoning with the same evidence and authority limits.
- id: SR-03
  split: holdout-candidate
  purpose: Fix punctuation in the supplied quote without adding facts.
  worker:
    task: Fix punctuation in the supplied quote without adding facts.
    context: Synthetic isolated evaluator fixture.
    artifacts:
      quote.txt: A blue chair a red table.
    capabilities:
    - read-files
    constraints:
    - Use only supplied artifacts. Report execution only when observed.
  oracle:
    activation: skip
    required_findings:
    - Return the edit within the supplied text.
    forbidden_findings:
    - Invent publication or source provenance or expand the assignment.
    evidence_requirements:
    - Use only quote.txt.
    allowed_alternatives:
    - Equivalent reasoning with the same evidence and authority limits.
