    - Limit evidence to same-process test
    - Preserve SHOULD recommendation and missing exception justification
    - Keep contract unchanged; do not present as-built behavior as required
    forbidden_findings:
    - Relax contract to memory persistence
    - Claim restart conformance
    - Treat SHOULD as optional explanatory text or unconditional MUST
    evidence_requirements:
    - Trace obligation and status to supplied source; distinguish proposal, requirement, implementation
      and evidence
    allowed_alternatives:
    - Equivalent concise wording preserving authority and behavior
