format: aew-skill-cases/v1
skill: technical-writing
cases:
- id: TW-01
  split: development
  purpose: Explain to a product manager why cancelling an old search is insufficient to prevent stale
    results. The reader knows how a search box works but not async programming.
  worker:
    task: Explain to a product manager why cancelling an old search is insufficient to prevent stale results.
      The reader knows how a search box works but not async programming.
    context: Synthetic writing task. Supplied sources govern; no external facts or live services are available.
    artifacts:
      facts.md: Requests A and B are searches, with B started later. A may ignore cancellation. If B finishes
        first and A later, A can overwrite B unless the display accepts only the current request identity.
        The guarantee concerns displayed results; the remote request may still finish.
    capabilities:
    - read-files
    constraints:
    - No file edits, command execution or external actions
    - Return the requested text, not a writing-process report
  oracle:
    activation: use
    required_findings:
    - Lead with understandable consequence and cause
    - Follow one concrete old/new search example in completion order
    - Explain current-request identity without unexplained jargon
    - Keep cancellation limitation and display-only guarantee
    forbidden_findings:
    - Promise cancellation prevents remote completion
    - Only say use generation fencing or async orchestration
    - Compress away the example/mechanism
    - Write a long architecture tour
    evidence_requirements:
    - Preserve material facts and qualifiers; do not invent verification or authority
    allowed_alternatives:
    - Any clear wording and structure that serves the specified reader and preserves meaning
