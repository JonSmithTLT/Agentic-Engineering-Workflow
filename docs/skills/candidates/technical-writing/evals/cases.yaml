  purpose: Write an as-built note comparing implementation with the adopted contract.
  worker:
    task: Write an as-built note comparing implementation with the adopted contract.
    context: Synthetic contract-writing review. Supplied adoption records govern; no edits, execution
      or external actions are authorized.
    artifacts:
      contract.md: 'Adopted: acknowledged records MUST survive process restart. SHOULD retain diagnostic
        logs for 7 days unless documented storage limits justify less. BCP14 vocabulary.'
      implementation.md: Records are held only in process memory. Diagnostic logs retained 3 days; no exception
        rationale supplied.
      evidence.md: Same-process read-after-write test passed. No restart or log-retention checks executed.
    capabilities:
    - read-files
    constraints:
    - Return the requested review or draft only
    - Do not adopt requirements or change governing policy
  oracle:
    activation: use
    required_findings:
