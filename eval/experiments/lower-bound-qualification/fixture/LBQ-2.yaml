task: >-
  Feature request for the link policy extension (`markdown.extensions.linkpolicy`): add an option `rel_external`.
  Its default is `"nofollow noopener"`: every external link (an `http`, `https` or protocol-relative `//` link whose
  host is not one of the extension's `internal_hosts`) gets that value as its `rel` attribute. Setting `rel_external`
  to an empty string turns this off. Internal links, relative links and blocked links never get it. The option must
  work like the extension's other options (it can be passed to the extension's constructor and to `makeExtension`)
  and be documented with them, and the existing test suite must still pass. Add tests. Keep your changes to the
  extension, its tests and its documentation.


  Nobody will answer questions during this session: make reasonable decisions and finish the task.
