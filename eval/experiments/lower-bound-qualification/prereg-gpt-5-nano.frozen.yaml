primary_measure: 'behaviours_shown: how many of the eight behaviours (thresholds.behaviours; rubric.md §4) meet their threshold
  in at least one valid run. The profile is a lower bound for the lane when it is at least 1 (synthesis §13.4: a profile that
  shows none of them is not a lower bound, and the next-cheaper profile is tried).'
secondary_measures:
- the per-run value of every metric of thresholds.behaviours, and which behaviours each run shows
- task_correct per run (rubric.md §5) and per case
- charged cost, steps, wall_s, harness_outcome and truncation per run
thresholds:
  lower_bound_min_behaviours: 1
  expected_outcome: This run scores the floor and the tree-observable half of the ceiling (kind T below) when its runs are
    scored. The session-observable half (kind S) is scored later by the F19 session-database reader (delta D2) from the kept
    databases, under the definitions frozen here, before their retention window ends. A profile with a T behaviour shown is
    qualified now; otherwise its ceiling stays pending until D2 scores the S behaviours.
  floor:
    trials: 2
    passes_when: 'rubric.md §2: in a trial, the implementer run ends ended_with_evidence, its evidence includes an implementation_report,
      and its bridge recorded at least one request; at least one trial passes, and AEW''s own assertions hold in every trial'
  budget:
    total_usd: 5.0
    floor_cap_usd: 1.0
    per_run_cap_usd: 0.75
    overshoot_margin_usd: 0.05
    unknown_cost: charged at the cap (a lost run, an arm that failed before its cost was known)
  definitions:
    read:
    - read tool; shell cat
    - type
    - Get-Content
    - head
    - tail
    - more
    - less
    - sed -n
    search:
    - grep
    - glob
    - list tools; shell grep
    - rg
    - findstr
    - find
    - ls
    - dir
    - Get-ChildItem
    - Select-String
    edit:
    - edit
    - write
    - patch tools; a shell redirection into a file
    unbounded_search: a search with no path, or the repository root as its path
    finished_run: harness_outcome ended, not truncated (no deadline, cost cap, step limit or final provider error)
  path_sets:
    relevant_sources:
      LBQ-1:
      - markdown/extensions/linkpolicy/rules.py
      - markdown/extensions/linkpolicy/__init__.py
      LBQ-2:
      - markdown/extensions/linkpolicy/schema.py
      - markdown/extensions/linkpolicy/__init__.py
      - markdown/extensions/linkpolicy/rules.py
      LBQ-3:
      - markdown/extensions/linkpolicy/__init__.py
      - markdown/core.py
    test_surfaces:
      LBQ-1:
      - tests/test_syntax/extensions/test_link_policy.py
      - tests/test_syntax/extensions/linkpolicy_support.py
      LBQ-2:
      - tests/test_syntax/extensions/test_link_policy.py
      - tests/test_syntax/extensions/linkpolicy_support.py
      - tests/test_syntax/extensions/test_link_policy_docs.py
      LBQ-3:
      - tests/test_syntax/extensions/test_link_policy.py
      - tests/test_syntax/extensions/linkpolicy_support.py
    plausibly_useful:
    - markdown/extensions/linkpolicy/*
    - docs/extensions/link_policy.md
    - docs/extensions/api.md
    - markdown/core.py
    - markdown/extensions/__init__.py
    - markdown/treeprocessors.py
    - markdown/util.py
    - markdown/test_tools.py
    decoy_root:
    - tools/linkpolicy/*
    distractors:
    - tests/test_syntax/extensions/test_wikilinks_spaces.py
    - markdown/extensions/wikilinks.py
  behaviours:
    poor_repository_navigation:
      number: 1
      kind: S
      shown_when:
      - metric: tool_calls_before_first_relevant_source
        op: '>='
        value: 15
      - metric: irrelevant_files_opened
        op: '>='
        value: 8
    bad_search_root_selection:
      number: 2
      kind: T+S
      shown_when:
      - metric: wrong_root_or_unbounded_search_count
        part: decoy_edits
        kind: T
        op: '>='
        value: 1
      - metric: wrong_root_or_unbounded_search_count
        part: decoy_reads_before_real_module
        kind: S
        op: '>='
        value: 2
      - metric: wrong_root_or_unbounded_search_count
        part: unbounded_searches
        kind: S
        op: '>='
        value: 6
    failure_to_locate_tests_or_mocks:
      number: 3
      kind: S
      shown_when:
      - metric: tests_found_before_first_edit
        op: ==
        value: false
        only_if: the run edits a non-test file
    incomplete_cross_file_changes:
      number: 4
      kind: T
      cases:
      - LBQ-2
      shown_when:
      - metric: missed_required_sites
        op: '>='
        value: 1
        only_if: a finished run that changed at least one site
    requirement_loss_on_longer_tasks:
      number: 5
      kind: T
      cases:
      - LBQ-3
      shown_when:
      - metric: forgotten_criteria
        op: '>='
        value: 1
        only_if: a finished run that met at least one criterion
    repeated_exploration:
      number: 6
      kind: S
      shown_when:
      - metric: repeated_file_reads
        op: '>='
        value: 1
        note: a read of the same file and range a third time
      - metric: repeated_tool_ngrams
        op: '>='
        value: 2
    weak_tool_selection:
      number: 7
      kind: S
      shown_when:
      - metric: shell_inspection_share
        op: '>='
        value: 0.5
        only_if: at least 6 reads and searches
    difficulty_recovering_after_distraction:
      number: 8
      kind: T+S
      shown_when:
      - metric: distractor_or_stale_note_actions
        part: distractor_edits
        kind: T
        op: '>='
        value: 1
      - metric: distractor_or_stale_note_actions
        part: stale_note_followed
        kind: T
        op: '>='
        value: 1
        note: the oracle's structure check (the link policy runs after the inline processor) fails
      - metric: contradictory_edits
        kind: S
        op: '>='
        value: 1
