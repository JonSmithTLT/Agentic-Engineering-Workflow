schema: aew/eval-prereg/v1
experiment: lbq-v1-gpt-5-nano
purpose: qualification
question: Run raw through the pinned OpenCode 2.0.18 on three seeded tasks of an independent public repository, does opencode/gpt-5-nano
  at high effort (lower-bound class) show at least one of the eight weak-worker behaviours of synthesis §13.4, so that it
  can serve as the lower bound of the agent-effectiveness lanes?
arms:
- id: raw
  kind: raw
  description: 'The lower-bound profile raw: OpenCode''s own build agent, the pinned model and effort, the case''s task as
    its only message, no AEW assistance and nobody answering, contained by bubblewrap on the arm host. Its harness session
    database is kept for the F19 reader under the retention window and field allowlist below.'
  config:
    role: worker
    model: opencode/gpt-5-nano#high
    profile:
      id: lb-gpt-5-nano
      effective_profile:
        context.orientation: null
        tools.presentation: null
      qualification_state: unqualified
    harness:
      name: opencode
      version: 2.0.18
      artifact_sha256:
        win32-x64: 78f454c0a1581b66ce4f264f42bfaee6207c887053d8e4b02c4c9cfb74e90668
        linux-x64: 67d8275630aa3dfe5409c6c2e1bb44ab0cf0d9558a6593e769342b9f1dc93f4b
    contain: true
    steps: 80
    cap_usd: 0.75
    provider_env:
    - OPENCODE_API_KEY
    session_db:
      retain: true
      retention_days: 180
      fields:
      - field: session_message.seq
        transform: none
      - field: session_message.type
        transform: none
      - field: message.time.created
        transform: none
      - field: message.model
        transform: none
      - field: message.tokens
        transform: none
      - field: message.cost
        transform: none
      - field: message.error.type
        transform: none
      - field: tool.name
        transform: none
      - field: tool.state.status
        transform: none
      - field: tool.state.input.filePath
        transform: none
      - field: tool.state.input.path
        transform: none
      - field: tool.state.input.pattern
        transform: none
      - field: tool.state.input.include
        transform: none
      - field: tool.state.input.offset
        transform: none
      - field: tool.state.input.limit
        transform: none
      - field: tool.state.input.command
        transform: prefix_300
      - field: tool.state.input.oldString
        transform: sha256
      - field: tool.state.input.newString
        transform: sha256
      - field: tool.state.metadata.exit
        transform: none
      - field: tool.time
        transform: none
