validity_rules:
  infrastructure_invalid:
  - RUNNER_ERROR (the runner failed around the arm)
  - ARM_ERROR (the session failed after it started; its database, leak scan and charged cost are still recorded)
  - CONTAINMENT_FAILED (the layout did not pass its self-test or confidentiality probe)
  - HARNESS_MISMATCH (the served harness version is not the pinned one; another binary is refused before counting)
  - PROFILE_MISMATCH (a model or effort other than the pinned one answered)
  - PROVIDER_KEY_RETAINED (a provider value in retained state; those files are deleted at once)
  - 'NO_MODEL_STEP (no assistant step without a provider error: a rejected key, a rate limit, an outage)'
  - PROVIDER_ERROR_ENDED_TURN (a provider error ended the turn after some steps)
  counted_failures:
  - the deadline (30 minutes) or the cost cap ended the turn (truncated; excluded from behaviours 4 and 5)
  - the step limit (80) ended the turn (truncated; excluded from behaviours 4 and 5)
  - no change, a wrong change, or a change out of scope
  retry_policy:
    max_retries: 2
    allowed_for:
    - invalid_measurement
    - runner_lost
    - environment_blocked
  missing_result_policy: 'A registered attempt with no result (runner_lost) is charged at its cap and retried under the retry
    policy. A cell with no valid run after its retries is reported as unobserved: it neither shows nor rules out a behaviour.'
stopping_rule: The floor runs first (thresholds.floor); a profile that does not pass it runs no cell. Then every scheduled
  cell runs once, in schedule order, plus the retries the policy allows. The lane stops early only when the next attempt's
  cap and the overshoot margin would take the charged spend past budget_usd. Nothing is extended or rerun after outcomes are
  seen. Scoring happens only after every model run has ended.
scoring:
  hidden_channel: 'aew-private/eval/lower-bound-qualification/ (AEW_EVAL_HIDDEN_ROOT); oracles at cases/<id>/oracle. Deferred:
    the arm host holds no oracle while a model runs; each run''s final tree is exported and hashed, and scored after every
    model run has ended (eval/aew_eval/runner.py score_run), contained by bubblewrap on the scoring host'
  who_scores: mixed
  blinding: not_possible
  adjudication_policy: Task correctness and the T behaviours are automated (the hidden oracles and the run record's changed
    paths, rubric.md §4 and §5). The S behaviours are computed by the F19 reader's named, versioned metric functions from
    each run's kept session database, over arms[raw].config.session_db.fields only, under thresholds.behaviours. A metric
    that cannot be computed (no database, a field missing, the window passed) leaves that behaviour unobserved for the run;
    nobody adjudicates it by reading the transcript. There is one arm, so there is nothing to blind.
  rubric_sha256: 0c6703a7b45089808b5bd9ff542636cbd47efbdb9abcb3c92374488bf10b41fe
held_out: []
exposure_policy: 'No case is held out: the fixture is a public repository and the tasks are seeded for this lane. Nothing
  private enters a case, a prompt or the scratch tree, because a provider may retain prompts; the runs are contained on an
  arm host that holds no oracle and no private material. Q7''s sealed tasks and the M4-H corpus are never used. Results are
  qualification and instrumentation evidence only, never M4-H or treatment-effect evidence.'
amendment_policy: 'A change after the first run is registered is a new experiment id (lbq-v2-...); trying the next-cheaper
  profile is a new experiment id too (lbq-v1-<model>). A pre-gate experiment id is never reused for a treatment-effect experiment.
  This experiment is the next-cheaper profile (README.md, "The fallback"): opencode/gpt-5-nano, the cheapest paid model the
  pinned harness offers with a stable identity (released 2025-08-07). The operator chose on 2026-10-10 to run it after lbq-v1-deepseek-v4-1-flash,
  not only if that one is not a lower bound: it covers that case, and it gives a second lower-bound data point from another
  model family for M4-H''s choice. Its effort is high by the rule that pinned the DeepSeek profiles: the floor (AEW''s bridge
  protocol) is a hard prerequisite, so a lower-bound worker runs at the highest effort tier its provider offers, excluding
  an extended max tier where one exists (DeepSeek offers low, high and max, so high); gpt-5-nano offers minimal, low, medium
  and high and has no extended tier, so high. The trade-off: a higher effort gives the model its best chance at the floor,
  but can suppress the weak-worker behaviours, which leans the result toward not_a_lower_bound, the conservative direction
  for qualifying a stress specimen. Nothing else changes: the cases, oracles, rubric, schedule seed, limits and budget are
  lbq-v1-deepseek-v4-flash''s.'
