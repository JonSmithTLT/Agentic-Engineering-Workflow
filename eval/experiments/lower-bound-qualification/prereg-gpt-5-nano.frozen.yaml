  family: lbq-navigation
  sha256: 3f187f74d721c0ab48efc016b272c6934f8930303fb24e7870a76f47d117267a
  hidden_sha256: cf3a12db1ed3d98268cbc9fc181cf553c9a259d03a8e3ed9ea362097c07a56e2
