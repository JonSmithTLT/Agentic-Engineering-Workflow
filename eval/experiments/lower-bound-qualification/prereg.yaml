# The lane's preregistration (aew/eval-prereg/v1; evaluation component design v0.2 §4), unfrozen.
#
# `qualify.py freeze --by NAME` fills each case's `sha256` (the fixture as fetched plus the seeded overlay and the
# case manifest) and `hidden_sha256` (the oracle commitment already in each case manifest), and
# `scoring.rubric_sha256`, materializes the schedule from the seed, and writes prereg.frozen.yaml. A frozen record is
# never edited: a change after the first run is a new experiment id (lbq-v2-...), and this pre-gate experiment id is
# never reused for a treatment-effect experiment (synthesis §13.4).
schema: aew/eval-prereg/v1
experiment: lbq-v1-deepseek-v4-flash
purpose: qualification
question: >-
  Run raw through the pinned OpenCode 2.0.18 on three seeded tasks of an independent public repository, does
  opencode/deepseek-v4-flash (lower-bound class) show at least one of the eight weak-worker behaviours of synthesis
  §13.4, so that it can serve as the lower bound of the agent-effectiveness lanes?
arms:
  - id: raw
    kind: raw
    description: >-
      The lower-bound profile raw: OpenCode's own build agent, the pinned model, the case's task as its only message,
      no AEW assistance and nobody answering. Its harness session database is kept for the F19 reader.
    config:
      role: worker
      model: opencode/deepseek-v4-flash
      steps: 80
      cap_usd: 0.75
      provider_env: [OPENCODE_API_KEY]
      session_db:
        retain: true
        retention_days: 180
        fields:   # what the evaluator-side reader may extract (Revision C); never message text or tool output
          - session_message.seq
          - session_message.type
          - message.time.created
          - message.model
          - message.tokens
          - message.cost
          - tool.name
          - tool.state.status
          - tool.state.input.filePath
          - tool.state.input.path
          - tool.state.input.pattern
          - tool.state.input.include
          - tool.state.input.offset
          - tool.state.input.limit
          - tool.state.input.command (first 300 characters)
          - tool.state.input.oldString (sha256 only)
          - tool.state.input.newString (sha256 only)
          - tool.state.metadata.exit
          - tool.time
cases:
  - {id: LBQ-1, family: lbq-navigation, sha256: null, hidden_sha256: null, control_of: null}
  - {id: LBQ-2, family: lbq-cross-file, sha256: null, hidden_sha256: null, control_of: null}
  - {id: LBQ-3, family: lbq-long-horizon, sha256: null, hidden_sha256: null, control_of: null}
profiles:
  roles:
    worker: opencode/deepseek-v4-flash   # profiles.yaml: lb-deepseek-v4-flash (the free tier's paid twin)
  budget_usd: 5.0
runs_per_cell: 2
assignment:
  method: randomized_blocked
  seed: 20261010
primary_measure: >-
  behaviours_shown: how many of the eight behaviours (rubric.md §4) meet their preregistered threshold in at least
  one valid run. The profile is a lower bound for the lane when it is at least 1 (synthesis §13.4: a profile that
  shows none of them is not a lower bound, and the next-cheaper profile is tried).
secondary_measures:
  - the per-run value of every rubric.md §4 metric, and which behaviours each run shows
  - task_correct per run (rubric.md §5) and per case
  - cost_usd (OpenCode's reported cost), steps, wall_s, harness_outcome per run
thresholds:
  lower_bound_min_behaviours: 1
  floor: >-
    rubric.md §2, run before the ceiling: at least one of two live-lane trials passes. A profile that does not pass the
    floor is not measured on the ceiling cells.
  behaviour_thresholds: rubric.md §4 (one threshold per behaviour, stated there before any run)
metrics:   # rubric.md §4 defines each; the F19 metric module (delta D2) implements them under these names and versions
  - {name: tool_calls_before_first_relevant_source, version: lbq-1}
  - {name: irrelevant_files_opened, version: lbq-1}
  - {name: wrong_root_or_unbounded_search_count, version: lbq-1}
  - {name: tests_found_before_first_edit, version: lbq-1}
  - {name: missed_required_sites, version: lbq-1}
  - {name: forgotten_criteria, version: lbq-1}
  - {name: repeated_file_reads, version: lbq-1}
  - {name: repeated_tool_ngrams, version: lbq-1}
  - {name: shell_inspection_share, version: lbq-1}
  - {name: distractor_or_stale_note_actions, version: lbq-1}
  - {name: contradictory_edits, version: lbq-1}
validity_rules:
  infrastructure_invalid:
    - RUNNER_ERROR (the server did not start, or the runner failed before the arm returned)
    - PROFILE_MISMATCH (a model other than the pinned one answered)
    - PROVIDER_KEY_RETAINED (a provider variable's value is in the run's retained state)
    - NO_MODEL_STEP (the provider failed before the model's first step: an outage, a rate limit, a rejected key)
  counted_failures:
    - the deadline (30 minutes) or the cost cap ended the turn
    - the step limit (80) ended the turn
    - no change, a wrong change, or a change out of scope
  retry_policy:
    max_retries: 2
    allowed_for: [invalid_measurement, runner_lost, environment_blocked]
  missing_result_policy: >-
    A registered attempt with no result (runner_lost) is retried under the retry policy. A cell with no valid run
    after its retries is reported as unobserved: it neither shows nor rules out a behaviour.
stopping_rule: >-
  Every scheduled cell runs once, in schedule order, plus the retries the policy allows. The run stops early only
  when the next cell's cost cap would take the spend past budget_usd, or when the floor fails (then no cell runs).
  Nothing is extended or rerun after outcomes are seen.
scoring:
  hidden_channel: aew-private/eval/lower-bound-qualification/ (AEW_EVAL_HIDDEN_ROOT); oracles at cases/<id>/oracle
  who_scores: mixed
  blinding: not_possible
  adjudication_policy: >-
    Task correctness and the tree-observable behaviours are automated (the hidden oracles and the run record's changed
    paths, rubric.md §4 and §5). The session-observable behaviours are computed by the F19 reader's named, versioned
    metric functions from each run's retained session database, over the fields arms[raw].config.session_db.fields
    allows. A metric that cannot be computed (no database, a field missing) leaves that behaviour unobserved for the
    run; nobody adjudicates it by reading the transcript. There is one arm, so there is nothing to blind.
  rubric_sha256: null
held_out: []
exposure_policy: >-
  No case is held out: the fixture is a public repository and the tasks are seeded for this lane. Nothing private
  enters a case, a prompt or the scratch tree, because a provider (a free tier above all) may retain prompts. Q7's
  sealed tasks and the M4-H corpus are never used. Results are qualification and instrumentation evidence only, never
  M4-H or treatment-effect evidence.
amendment_policy: >-
  A change after the first run is registered is a new experiment id (lbq-v2-...); trying the next-cheaper profile is
  a new experiment id too (lbq-v1-<model>). A pre-gate experiment id is never reused for a treatment-effect
  experiment.
