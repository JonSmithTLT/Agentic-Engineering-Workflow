- schema: aew/eval-profile/v1
  id: lb-gpt-5-nano
  class: lower-bound
  ref: opencode/gpt-5-nano#high
  provider: opencode
  model: gpt-5-nano
  effort: high
  plan_role: backup
  twin_of: null
  harness: *harness
  effective_profile: *raw
  credential_env: [OPENCODE_API_KEY]
  cost_per_mtok_usd: {input: 0.05, output: 0.40, cache_read: 0.005,
                      source: "OpenCode 2.0.18's served catalog (/api/model), 2026-10-10"}
  availability:
    checked_at: "2026-10-10"
    offered_by_pinned_harness: true
    catalog_status: active
    checked_with: a placeholder value for OPENCODE_API_KEY (the catalog lists a paid provider only when its variable is set; no request was made)
    note: >-
      Variants offered: minimal, low, medium, high. Released 2025-08-07, a stable versioned id. Driven through
      OpenCode's own OpenAI provider package (@opencode/ai/providers/openai), so the Responses API, not chat
      completions (on which Zen refuses it as ModelProtocolUnsupported). Pinned to high by the rule that pinned the
      DeepSeek profiles: the floor is a hard prerequisite, so a lower-bound worker runs at the highest effort tier its
      provider offers, excluding an extended max tier where one exists; gpt-5-nano has none, so high. The trade-off:
      higher effort can suppress the weak-worker behaviours, leaning the result toward not_a_lower_bound (the
      conservative direction).
  floor:
    state: passed
    trials: 1
    evidence: [results/lbq-v1-gpt-5-nano/floor.json]
  ceiling:
    state: behaviours_shown
    experiment: lbq-v1-gpt-5-nano
    behaviours: [requirement_loss_on_longer_tasks]
    evidence: [results/lbq-v1-gpt-5-nano/score.json]
  qualification_state: qualified
  notes: >-
    lbq-v1-gpt-5-nano (2026-10-10, run at ed98424): the floor passed in its first trial ($0.005); the ceiling's 6 runs
    were valid and finished, and LBQ-3-raw-2 showed behaviour 5 (requirement loss on longer tasks: a finished run that
    met some of LBQ-3's criteria and forgot others). Task-correct in 4 of 6 runs (not LBQ-3-raw-2 or LBQ-1-raw-1).
    Qualified as the lane's lower bound on the tree-observable evidence; D2's reader scores the session-observable
    behaviours later from the kept databases. Total charged $0.066.
    The next-cheaper profile (synthesis 13.4): the cheapest paid model the pinned harness offers with a stable,
    versioned identity (input $0.05 per million tokens against $0.14 for lb-deepseek-v4-flash and $0.30 for
    lb-deepseek-v4.1-flash), and an older, smaller model. Its experiment is lbq-v1-gpt-5-nano. The operator chose on
    2026-10-10 to run it after lbq-v1-deepseek-v4-1-flash rather than only as a fallback: it covers the case where V4.1
    is not a lower bound, and adds a second lower-bound data point from another family for M4-H's choice.

