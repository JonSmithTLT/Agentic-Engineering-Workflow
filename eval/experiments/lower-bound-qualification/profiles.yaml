      linux-x64: 67d8275630aa3dfe5409c6c2e1bb44ab0cf0d9558a6593e769342b9f1dc93f4b
  effective_profile: &raw {context.orientation: null, tools.presentation: null}
  credential_env: []
  cost_per_mtok_usd: {input: 0, output: 0, cache_read: 0, source: "models.dev catalog served to OpenCode, 2026-10-10"}
  availability:
