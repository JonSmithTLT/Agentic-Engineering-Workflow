# Profile records (aew/eval-profile/v1; eval/aew_eval/profiles.py): one provider/model through the pinned harness, its
# capability class, and how far it is qualified. Reusable by every later lane: a preregistration pins a record's
# `ref`, and the record's qualification_state is derived from availability, floor and ceiling (never asserted).
#
# Chosen by the lead developer on 2026-10-09 (operator: "no preference, pick the best, keep it consistent for future
# research"): lower bound deepseek-v4-flash-free, with its stable paid twin so results stay reproducible if the free
# tier goes; backup minimax-m2.5-free; middle profile gpt-6-luna through the OpenAI API. The free models are no longer
# offered (2026-10-10): the lane pins the primary's paid twin, with the next-cheaper stable model as its fallback. Laguna is recorded as a note.
# Later on 2026-10-10 the paid twin became unavailable on OpenCode Zen (an upstream 404, though the catalog still lists
# it): the operator chose its successor, deepseek-v4.1-flash, as the replacement primary (lbq-v1-deepseek-v4-1-flash),
# and to run the next-cheaper profile, gpt-5-nano, after it (lbq-v1-gpt-5-nano).
# Availability is what OpenCode 2.0.18's served catalog offered on 2026-10-10 (qualify.py check, "harness_launch", or
# the same /api/model call from a private server with a placeholder key and no model request).

