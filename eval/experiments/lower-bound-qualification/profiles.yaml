- schema: aew/eval-profile/v1
  id: lb-deepseek-v4-flash
  class: lower-bound
  ref: opencode/deepseek-v4-flash#high
  provider: opencode
  model: deepseek-v4-flash
  effort: high
  plan_role: paid-twin
  twin_of: lb-deepseek-v4-flash-free
  harness: *harness
  effective_profile: *raw
  credential_env: [OPENCODE_API_KEY]
  cost_per_mtok_usd: {input: 0.14, output: 0.28, cache_read: 0.028,
                      source: "models.dev catalog served to OpenCode, 2026-10-10"}
  availability:
    checked_at: "2026-10-10"
    offered_by_pinned_harness: true
    catalog_status: null
    checked_with: a placeholder value for OPENCODE_API_KEY (the catalog lists a paid provider only when its variable is set; no request was made)
    note: >-
      Variants offered: low, high, max. Pinned to high: the floor (AEW's bridge protocol) is a hard prerequisite and
      flash-class models follow multi-step tool protocols poorly at low effort; at high it is still a flash-class model.
  floor: {state: not_run}
  ceiling: {state: not_run}
  qualification_state: unqualified
  notes: >-
    The profile the lane's preregistration pins (prereg.yaml), because the free tier is no longer offered.
    The operator approved paying for it (2026-10-10, within the lane's budget_usd).
    Unavailable on OpenCode Zen as of 2026-10-10: chat completions return an upstream 404 ("Endpoint is unavailable")
    while the served catalog still lists it as active, so its qualification_state (derived from the catalog) stays
    unqualified. Zen logged the operator's request; the key and billing were fine. Its floor never reached a model
    step (lane errors, never counted as trials), so it is neither floor_passed nor floor_failed. The replacement
    primary is lb-deepseek-v4.1-flash.

- schema: aew/eval-profile/v1
  id: lb-deepseek-v4.1-flash
  class: lower-bound
  ref: opencode/deepseek-v4.1-flash#high
  provider: opencode
  model: deepseek-v4.1-flash
  effort: high
  plan_role: replacement-primary
  twin_of: null
  harness: *harness
  effective_profile: *raw
  credential_env: [OPENCODE_API_KEY]
  cost_per_mtok_usd: {input: 0.30, output: 1.20, cache_read: 0.006,
                      source: "OpenCode 2.0.18's served catalog (/api/model), 2026-10-10"}
  availability:
    checked_at: "2026-10-10"
    offered_by_pinned_harness: true
    catalog_status: active
    checked_with: a placeholder value for OPENCODE_API_KEY (the catalog lists a paid provider only when its variable is set; no request was made)
    note: >-
      Variants offered: low, high, max. Family deepseek-flash, released 2026-09-10, a stable versioned id (not an
      -exp model), driven through the openai-compatible package (chat completions). Pinned to high for the same
      reason as lb-deepseek-v4-flash: the floor is a hard prerequisite, and flash-class models follow multi-step tool
      protocols poorly at low effort.
  floor:
    state: passed
    trials: 1
    evidence: [results/lbq-v2-deepseek-v4-1-flash/floor.json]
  ceiling:  # it ran: the tree-observable half shows none of its behaviours; the session-observable half waits for D2
    state: pending_session_behaviours
    experiment: lbq-v2-deepseek-v4-1-flash
    evidence: [results/lbq-v2-deepseek-v4-1-flash/score.json]
  qualification_state: floor_passed
  notes: >-
    lbq-v2-deepseek-v4-1-flash (2026-10-10, run at ed98424): the floor passed in its first trial ($0.023); the ceiling's
    6 runs were valid and finished (the cost cap ended none), every one task-correct and in scope, and none showed a
    tree-observable behaviour (2, 4, 5, 8 in part), so the ceiling stays pending until D2's reader scores the
    session-observable behaviours from the kept databases. On the tree evidence it is the stronger of the two cheap
    profiles. Total charged $0.2199. Its first experiment, lbq-v1-deepseek-v4-1-flash, passed its floor but every
    ceiling attempt was refused by a containment defect (no model data).
    The replacement primary (lbq-v1-deepseek-v4-1-flash), chosen by the operator on 2026-10-10 because
    lb-deepseek-v4-flash became unavailable on OpenCode Zen. It is the same family's successor; the trigger is
    unavailability, which the next-cheaper rule does not cover, as in the earlier move from the free tier to its paid
    twin. It costs more than its predecessor ($0.30 / $1.20 against $0.14 / $0.28), so it is not a next-cheaper
    profile; lb-gpt-5-nano stays the next-cheaper one.

