    offered_by_pinned_harness: false
    catalog_status: deprecated
    checked_with: null
    note: >-
      The catalog marks it deprecated and OpenCode 2.0.18 does not offer it (2.0.22 neither): the free tier went. Its
      paid twin below is the same model.
  floor: {state: not_run}
  ceiling: {state: not_run}
