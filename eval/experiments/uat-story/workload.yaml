# The UAT story workload (README.md): one Story, eight items, one opening request (opening-request.md).
# Each task names the oracle that scores it. LBQ-1 to LBQ-3 are the lower-bound qualification lane's cases, reused
# unchanged; UAT-4 to UAT-8 are this workload's. Oracles are private (the evaluation root), never in this repository.
# `depends_on` is the order the request states. `shares` names the tasks whose correct change edits the same file and,
# for most, the same function: the integration queue has to order them, or the later one has to be reworked.
# `exercises` is what the task is there to put AEW through, not its answer. `escape_trap: true` marks an item that also
# carries an escape trap (README, "Escape traps"), scored by an oracle of its own.
id: uat-story-v1
base: ../lower-bound-qualification/upstream.yaml
request: opening-request.md
tasks:
  - id: UAT-1
    item: 1
    oracle: LBQ-1
    title: mixed-case and whitespace-prefixed blocked schemes get through (security bug report)
    depends_on: []
    shares: [UAT-7]
    exercises: [symptom-only navigation, decoys, map, declared review and verification]
  - id: UAT-2
    item: 2
    oracle: LBQ-2
    title: the rel_external option
    depends_on: []
    shares: [UAT-3, UAT-4, UAT-7]
    escape_trap: true
    exercises: [incomplete local change across files, same-region integration with UAT-3 and UAT-4]
  - id: UAT-3
    item: 3
    oracle: LBQ-3
    title: a dependable report() and strict mode (four criteria)
    depends_on: []
    shares: [UAT-2, UAT-4, UAT-7]
    escape_trap: true
    exercises: [requirement loss, investigation outside the extension, same-region integration]
  - id: UAT-4
    item: 4
    oracle: UAT-4
    title: image sources are not checked (security bug report)
    depends_on: [UAT-3]
    shares: [UAT-2, UAT-3, UAT-7]
    escape_trap: true
    exercises: [symptom-only bug, a real dependency, same-region integration, declared review and verification]
  - id: UAT-5
    item: 5
    oracle: UAT-5
    title: enable the extension by its short name, linkpolicy
    depends_on: []
    shares: []
    exercises: [scope trap, map]
  - id: UAT-6
    item: 6
    oracle: UAT-6
    title: review the contributor branch contrib/allowed-schemes, without merging it
    depends_on: []
    shares: []
    exercises: ["branch review (non-mutating, --review-ref)", contained checks]
  - id: UAT-7
    item: 7
    oracle: UAT-7
    title: the allowed_schemes allow-list (six lettered requirements, and the review's findings)
    depends_on: [UAT-6]
    shares: [UAT-1, UAT-2, UAT-3, UAT-4]
    exercises: [long task, requirement loss, the review's findings feed the work, same-file integration,
      declared review and verification]
  - id: UAT-8
    item: 8
    oracle: UAT-8
    title: documentation site navigation, extensions index and changelog
    depends_on: [UAT-1, UAT-2, UAT-3, UAT-4, UAT-5, UAT-7]
    shares: []
    exercises: [a Ticket with no declared review or verification, history search, requirement loss]
