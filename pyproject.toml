[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aew"
version = "0.1.0.dev0"
description = "Agent Engineering Workflow: durable state engine, knowledge store and role contracts for LLM-assisted engineering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Runtime dependencies are deliberately minimal and already present in the SPT
# py311 offline wheelhouse (core-python.lock) for Rocky Linux 8 installs.
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.28",  # jsonschema's own dependency since 4.18; imported for cross-schema references
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional: parallel test execution for the non-serial lanes (docs/implementation/testing-and-ci-strategy.md).
# Kept out of `dev` so offline installs from the SPT wheelhouse need nothing new.
parallel = ["pytest-xdist>=3.6"]
# Optional: coverage, including the `aew` CLI, supervisor and broker subprocesses the tests start (register E2;
# docs/implementation/testing-and-ci-strategy.md, "Coverage"). CI measures the Linux lanes with it.
coverage = ["coverage[toml]>=7.10"]
# Static checks (docs/implementation/testing-and-ci-strategy.md, "Static checks"). Pinned: a new release can add rules
# or change inference, and that should arrive as its own reviewed change, not as a red merge gate.
lint = ["ruff==0.16.10", "pyright==1.1.414", "pip-audit==2.10.1"]

[project.scripts]
aew = "aew.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aew.schemas" = ["*.json"]
"aew.roles" = ["archetypes/*.yaml", "cards/*.yaml"]
"aew.templates" = ["*.md", "*.yaml"]

# Static checks (testing-and-ci-strategy.md, "Static checks"): Ruff and Pyright gate merges through `assurance`.
[tool.ruff]
line-length = 120
target-version = "py311"
# web/ has its own lint (web.yml); the dogfood fixture is a sample project under evaluation, not AEW code.
extend-exclude = ["web", "eval/m3/dogfood/fixture"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, Bandit's security rules, pyupgrade, import order.
select = ["E", "W", "F", "B", "S", "UP", "I"]
ignore = [
    "S603",  # every subprocess call passes an argv list; S602 (shell=True) stays on
    "S607",  # git, sh and the harness are found on PATH by design
    "S101",  # asserts narrow types and state internal invariants; no authority or input check is an assert
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixed fake credentials and temp paths, and seed their own randomness.
"tests/**" = ["S105", "S106", "S108", "S311"]
# Benchmarks time closures they call on the spot, and seed their own randomness.
"tools/perf/**" = ["B023", "S311"]
# The M3 spike probes are kept as they ran (results in eval/m3/spike/results); they talk only to a loopback server.
"eval/m3/spike/**" = ["S310", "E741", "UP031", "B023", "E501"]
# The dogfood harness's Lead prompt and task texts are evaluation inputs, kept byte-for-byte as they ran.
"eval/m3/dogfood/dogfood.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aew"]

[tool.pyright]
# The product code, checked as Linux and as Windows (CI runs both: platform branches are narrowed per platform).
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Lanes and markers: docs/implementation/testing-and-ci-strategy.md. Every test maps to exactly one lane.
markers = [
    "acceptance(id): acceptance scenario (M1: AT-1..AT-7, M2: AT-8..AT-13, KC 26); select with -m acceptance",
    "serial: timing or real-process concurrency is the property; never runs under xdist (--lane serial)",
    "exploratory: seeded randomized exploration; default budget is a merge gate, extended budgets run nightly",
]

[tool.coverage.run]
# Line and branch coverage of the product (src/aew), in this process and in every Python subprocess it starts
# (`aew` CLIs, harness supervisors, the Lead broker, xdist workers). Data files go where COVERAGE_FILE points, outside
# the checkout (the isolation guard fails a run that writes into it).
source_pkgs = ["aew"]
branch = true
parallel = true
patch = ["subprocess"]
sigterm = true
# Helper Python processes that never import aew (fake agents and servers) record nothing: not a problem.
disable_warnings = ["module-not-imported", "no-data-collected"]

[tool.coverage.report]
# Code for the other operating system cannot run here: a block marked `# pragma: windows-only` or `# pragma: posix-only`
# is excluded when measuring on the other OS. CI measures Linux (the default excludes windows-only); a Windows
# measurement sets AEW_COVERAGE_OTHER_OS=posix. Both sides still run in their own OS's test lanes.
exclude_also = ['if TYPE_CHECKING:', 'raise NotImplementedError', '^\s*\.\.\.$',
                '# pragma: ${AEW_COVERAGE_OTHER_OS-windows}-only']
precision = 1
skip_empty = true

[tool.coverage.paths]
# Combine data recorded from an editable install anywhere (CI runners, WSL clones) as src/aew.
source = ['src/aew', '*/src/aew', '*\src\aew']
