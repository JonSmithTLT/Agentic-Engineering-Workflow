[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aew"
version = "0.1.0.dev0"
description = "Agent Engineering Workflow: durable state engine, knowledge store and role contracts for LLM-assisted engineering"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Runtime dependencies are deliberately minimal and already present in the SPT
# py311 offline wheelhouse (core-python.lock) for Rocky Linux 8 installs.
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aew = "aew.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aew.schemas" = ["*.json"]
"aew.roles" = ["*.yaml"]
"aew.templates" = ["*.md", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running crash/race matrices",
]
