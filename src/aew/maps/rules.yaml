# The structural map's rule table (design v0.5 §2.3; plan §3.1). Package data: its sha256 is the record's
# generator.ruleset_sha256, so any edit here makes every existing map STALE (generator) and needs no version bump.
# A code change to aew/maps/structural.py that changes output bumps structural.VERSION instead (the golden test says so).
#
# Names are matched exactly (case-sensitive) unless the key says `lower`; globs use fnmatch against the file's name.
schema: aew/structural-map-rules/v1

