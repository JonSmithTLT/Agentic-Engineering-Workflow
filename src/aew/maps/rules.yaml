# Build descriptors by exact file name, then by glob; `parser` names a bounded parser (read only at depth <= 2).
build_descriptors:
  pyproject.toml: {kind: python, parser: pyproject}
  setup.py: {kind: python}
  setup.cfg: {kind: python, parser: setup_cfg}
  requirements.txt: {kind: python}
  Pipfile: {kind: python}
  package.json: {kind: node, parser: package_json}
  Cargo.toml: {kind: rust, parser: cargo}
  go.mod: {kind: go}
  CMakeLists.txt: {kind: cmake}
  Makefile: {kind: make}
  GNUmakefile: {kind: make}
  makefile: {kind: make}
  meson.build: {kind: meson}
  configure.ac: {kind: autotools}
  configure.in: {kind: autotools}
  BUILD: {kind: bazel}
  BUILD.bazel: {kind: bazel}
  WORKSPACE: {kind: bazel}
  MODULE.bazel: {kind: bazel}
  SConstruct: {kind: scons}
  build.gradle: {kind: gradle}
  build.gradle.kts: {kind: gradle}
  settings.gradle: {kind: gradle}
  pom.xml: {kind: maven}
  build.xml: {kind: ant}
  build.sbt: {kind: sbt}
  Gemfile: {kind: ruby}
  composer.json: {kind: php}
  mix.exs: {kind: elixir}
  Package.swift: {kind: swift}
  pubspec.yaml: {kind: dart}
  deno.json: {kind: deno}
  Dockerfile: {kind: container}
build_descriptor_globs:
  "*.csproj": dotnet
  "*.fsproj": dotnet
  "*.vcxproj": msbuild
  "*.sln": dotnet
  "*.gemspec": ruby
  "*.cabal": haskell
  "*.nimble": nim

# Conventional entry points, matched against the whole path (`*` crosses directories).
entry_point_conventions:
  - __main__.py
  - "*/__main__.py"
  - main.py
  - src/main.py
  - manage.py
  - main.go
  - "cmd/*/main.go"
  - src/main.rs
  - "src/bin/*.rs"
  - main.c
  - src/main.c
  - main.cpp
  - src/main.cpp
  - Program.cs
  - "*/Program.cs"
  - index.js
  - src/index.js
  - src/index.ts
  - src/main.ts

# Test candidates: directories by lower-case name, file-name globs, and runner configuration files by exact name.
test_directories: [test, tests, testing, spec, specs, __tests__]
test_file_patterns:
  - "test_*.py"
  - "*_test.py"
  - "*_test.go"
  - "*_test.rs"
  - "*.test.js"
  - "*.test.ts"
  - "*.test.tsx"
  - "*.spec.js"
  - "*.spec.ts"
  - "*Test.java"
  - "*Tests.cs"
  - "*_spec.rb"
  - "test_*.c"
  - "*_test.cpp"
test_runner_configs:
  pytest.ini: pytest
  conftest.py: pytest
  tox.ini: tox
  noxfile.py: nox
  jest.config.js: jest
  jest.config.ts: jest
  vitest.config.js: vitest
  vitest.config.ts: vitest
  karma.conf.js: karma
  .mocharc.json: mocha
  .mocharc.yml: mocha
  phpunit.xml: phpunit
  CTestTestfile.cmake: ctest
  .rspec: rspec

# Generated and vendored hints (navigation, never policy): directory names (lower-case) and file-name globs.
vendor_directories: [vendor, vendored, third_party, third-party, thirdparty, external, extern, node_modules]
generated_directories: [generated, gen, dist]
vendor_globs: []
generated_globs:
  - "*.min.js"
  - "*.min.css"
  - "*_pb2.py"
  - "*_pb2_grpc.py"
  - "*.pb.go"
  - "*.pb.cc"
  - "*.pb.h"
  - "*.generated.*"
  - "*.g.dart"
  - package-lock.json
  - yarn.lock
  - pnpm-lock.yaml
  - Cargo.lock
  - poetry.lock
  - uv.lock
  - go.sum
  - Gemfile.lock
  - composer.lock

