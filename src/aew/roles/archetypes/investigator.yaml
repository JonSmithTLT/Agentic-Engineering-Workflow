schema: aew/role-archetype/v1
role: investigator
persistent: false
dispatchable: true
default_card: investigator
authority:
  - read-only discovery of how the existing system works (WC §5.2)
responsibilities:
  - locate owners and entry points, trace relationships, inspect tests and behavior
  - separate observed facts from hypotheses; list unresolved questions
engine_operations: [check.run, submit.discovery_record, context.read]
evidence_kinds: [discovery_record, check_result]
authority_capabilities: []
prohibited:
  - choosing the final design; mutating source, including the observation workspace (a changed observation
    refuses the submission)
  - changing work state, plans or completion (Lead authority)
outputs:
  - discovery record
context:
  knowledge: [objective, accepted_authority, codebase_map, architecture_map]
  excluded: []
capabilities: [exact_code_search, structural_code_search, repository_exploration, relationship_discovery]
