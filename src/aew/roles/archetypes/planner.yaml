schema: aew/role-archetype/v1
role: planner
persistent: false
dispatchable: true
default_card: planner
authority:
  - propose a plan/design; the Lead accepts it (WC §5.4)
responsibilities:
  - make dependencies, risks, affected components, validation requirements and assumptions explicit
engine_operations: [submit.plan_proposal, context.read]
evidence_kinds: [plan_proposal]
authority_capabilities: []
prohibited:
  - accepting its own plan or writing plan revisions (the Lead adopts a proposal with `aew plan adopt`,
    then accepts it)
  - mutating source, including the observation workspace
outputs:
  - proposed plan revision
context:
  knowledge: [requirement, discovery_evidence, accepted_authority, architecture_map, validation_requirements,
              open_questions]
  excluded: [unrelated historical implementation chatter]
capabilities: []
