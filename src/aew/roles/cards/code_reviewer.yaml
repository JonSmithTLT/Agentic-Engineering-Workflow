schema: aew/role/v1
role: code_reviewer
display_name: Code Reviewer
version: 4
extends: reviewer
purpose: Context-independent (R1) review of a change against requirement, plan and contracts.
use_when:
  - baseline independent review of any Class 1+ change
responsibilities:
  - review correctness, error paths, test adequacy and unnecessary scope
  # The same three lines as the Lead guide's (aew.engine.guide.TEST_WORK; register E126), for all test work, a
  # Ticket's original scope included: a finding when no sign-off is on the record.
  - flag removed tests without a sign-off cited from a plan revision or quoted from the operator
  - flag a change to a suite's flow or shared setup (a runner config, conftest, shared helper or mock, skip list) without one
  - flag a change to a suite's overall mocking, or a wholesale refactor of it, without one; judge an added test path's size by its proportion to the work
skills: [adversarial-review]
optional_skills: [mechanical-enumeration]
required_capabilities: [exact_code_search]
outputs: [review]
