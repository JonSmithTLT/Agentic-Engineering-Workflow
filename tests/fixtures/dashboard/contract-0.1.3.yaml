    Cursor:
      type: string
      minLength: 1
      description: Opaque cursor; not an entity ID. Scope includes project, route, filters
        and limit. History cursors pin the starting manifest count and stable sequence, and
        survive appends. Hot collection cursors expire on control_revision changes.
    ControlRevision:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      description: Engine integer control revision serialized as a decimal string; monotonic
        per project. Observed harness telemetry can change without advancing this revision.
    Sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    TicketState:
      type: string
      x-known-values:
      - BLOCKED
      - READY
      - ASSIGNED
      - RUNNING
      - REVIEW_PENDING
      - REVIEW_FAILED
      - REVIEW_PASSED
      - VERIFY_PENDING
      - VERIFICATION_FAILED
      - VERIFICATION_INCONCLUSIVE
      - VERIFIED
      - COMMIT_READY
      - DONE
      - INTERRUPTED
      - REPLAN_REQUIRED
      - ESCALATED
      - CANCELLED
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    ParentState:
      type: string
      x-known-values:
      - PLANNING
      - IN_PROGRESS
      - ACCEPTANCE_PENDING
      - DONE
      - CANCELLED
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    WorkState:
      type: string
      x-known-values:
      - BLOCKED
      - READY
      - ASSIGNED
      - RUNNING
      - REVIEW_PENDING
      - REVIEW_FAILED
      - REVIEW_PASSED
      - VERIFY_PENDING
      - VERIFICATION_FAILED
      - VERIFICATION_INCONCLUSIVE
      - VERIFIED
      - COMMIT_READY
      - DONE
      - INTERRUPTED
      - REPLAN_REQUIRED
      - ESCALATED
      - CANCELLED
      - PLANNING
      - IN_PROGRESS
      - ACCEPTANCE_PENDING
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    InvocationRole:
      type: string
      x-known-values:
      - implementer
      - reviewer
      - verifier
      - planner
      - investigator
      - researcher
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    InvocationStatus:
      type: string
      x-known-values:
      - active
      - completed
      - cancelled
      - interrupted
      - revoked
      - superseded
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    HarnessStatus:
      type: string
      x-known-values:
      - starting
      - running
      - launch_failed
      - ended_with_evidence
      - ended_without_evidence
      - crashed
      - terminated
      - unconfirmed
      - lost
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    DecisionType:
      type: string
      x-known-values:
      - verification_failure_classification
      - authority_transfer
      - authority_acceptance
      - authority_rejection
      - waiver
      - manifest_adoption
      - state_regression
      - cancellation
      - reconciliation
      - plan_acceptance
      - promotion
      - role_plan_change
      - closeout
      - evidence_acceptance
      - hierarchy_change
      - dependency_change
      - plan_reconfirmation
      - input_acknowledgement
      - attempt_supersession
      description: Open backend semantic value. Unknown values display their raw string with
        a warning; no client conclusion is inferred.
    WorkCounts:
      type: object
      properties:
        open:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
      required:
      - open
      - done
      - cancelled
      additionalProperties: false
      description: Backend-computed counts. For Work.rollup, open counts Tickets in the entire
        parent subtree that are not DONE or CANCELLED; done and cancelled count subtree Tickets
        in those states, including archived Tickets through the parent summary. children contains
        direct children, and its bounded preview never determines rollup. For Overview.counts.work,
        open counts hot open units; done and cancelled are archived counts by state.
    Integration:
      type: object
      properties:
        status:
          anyOf:
          - type: string
            x-known-values:
            - integrated
            - prepared
            - publishing
            - conflict
            - superseded
            description: Open backend semantic value. Unknown values display their raw string
              with a warning; no client conclusion is inferred.
          - type: 'null'
        commit:
          anyOf:
          - type: string
          - type: 'null'
        commit_ready_seq:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - status
      - commit
      - commit_ready_seq
      additionalProperties: false
    HarnessRun:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        harness:
          $ref: '#/components/schemas/OpaqueId'
        launched_at:
          $ref: '#/components/schemas/Timestamp'
        kind:
          type: string
          x-known-values:
          - launch
          - relaunch
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        status:
          $ref: '#/components/schemas/HarnessStatus'
        authority:
          type: string
          description: Backend-reported authority text; never interpreted as a permission
            or gate conclusion.
      required:
      - id
      - harness
      - launched_at
      - kind
      - status
      - authority
      additionalProperties: false
    Invocation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        role:
          $ref: '#/components/schemas/InvocationRole'
        status:
          $ref: '#/components/schemas/InvocationStatus'
        work:
          $ref: '#/components/schemas/EntityRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/HarnessRun'
          maxItems: 250
        summary:
          $ref: '#/components/schemas/RichText'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EntityRef'
          maxItems: 250
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/Reason'
          maxItems: 250
      required:
      - id
      - role
      - status
      - work
      - created_at
      - runs
      - summary
      - evidence
      - reasons
      additionalProperties: false
      description: An engine invocation, including invocations with no harness run. /runs
        lists these objects. Nested statuses are observed harness telemetry and do not establish
        invocation completion or authority.
    EvaluatedSnapshot:
      type: object
      properties:
        base_revision:
          anyOf:
          - type: string
          - type: 'null'
        relevant_inputs_fingerprint:
          type: string
          description: Opaque engine fingerprint, including git-tree:<hex>. Do not interpret
            as a bare SHA-256.
        artifact_digests:
          type: array
          items:
            type: string
            description: Opaque engine artifact digest string.
          maxItems: 250
      required:
      - base_revision
      - relevant_inputs_fingerprint
      - artifact_digests
      additionalProperties: false
      description: Explicit path-free snapshot projection. workspace_id and storage/workspace/observation
        paths are excluded.
    EvidencePlanRevision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        sha256:
          $ref: '#/components/schemas/Sha256'
      required:
      - revision
      - sha256
      additionalProperties: false
    Producer:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/InvocationRole'
        invocation:
          $ref: '#/components/schemas/OpaqueId'
        run:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        model:
          anyOf:
          - type: string
          - type: 'null'
        provider:
          anyOf:
          - type: string
          - type: 'null'
        harness:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
      required:
      - role
      - invocation
      - run
      - model
      - provider
      - harness
      additionalProperties: false
      description: Curated producer identity; model/provider are declared metadata, not independently
        verified. No credential, run_dir, execution paths or arbitrary fields.
    EvidenceBindings:
      type: object
      properties:
        evaluated_snapshot:
          anyOf:
          - $ref: '#/components/schemas/EvaluatedSnapshot'
          - type: 'null'
        plan_revision:
          anyOf:
          - $ref: '#/components/schemas/EvidencePlanRevision'
          - type: 'null'
        producer:
          $ref: '#/components/schemas/Producer'
      required:
      - evaluated_snapshot
      - plan_revision
      - producer
      additionalProperties: false
    Annotation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        rel:
          type: string
          x-known-values:
          - moved_to
          - superseded_by
          - promoted_to
          - lineage
          - audit_finding
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        object:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        at:
          $ref: '#/components/schemas/Timestamp'
        decision:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        source:
          type: string
          x-known-values:
          - engine
          - operator
          - model
          - external
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        note:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - rel
      - object
      - at
      - decision
      - source
      - note
      additionalProperties: false
    HistoryDetail:
      type: object
      properties:
        seq:
          type: integer
          minimum: 1
        kind:
          type: string
          x-known-values:
          - unit
          - annotation
          - audit
          - lead
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        id:
          $ref: '#/components/schemas/OpaqueId'
        at:
          $ref: '#/components/schemas/Timestamp'
        state:
          anyOf:
          - $ref: '#/components/schemas/WorkState'
          - type: 'null'
        unit_kind:
          anyOf:
          - type: string
            x-known-values:
            - epic
            - story
            - ticket
            description: Open backend semantic value. Unknown values display their raw string
              with a warning; no client conclusion is inferred.
          - type: 'null'
        title:
          anyOf:
          - type: string
          - type: 'null'
        parent:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        subject:
          anyOf:
          - $ref: '#/components/schemas/OpaqueId'
          - type: 'null'
        rel:
          anyOf:
          - type: string
          - type: 'null'
        links:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/OpaqueId'
            maxItems: 250
          description: 'Backend omits the completion relation: its values are storage paths.
            The completion record is reachable through the unit itself. All projected relation
            values are AEW IDs or git commit hashes (integration_commit), never paths.'
          x-known-relations:
          - depends_on
          - invocations
          - tokens
          - evidence
          - integration_commit
          - moved_to
          - audit_finding
        sha256:
          $ref: '#/components/schemas/Sha256'
        source:
          type: string
          x-known-values:
          - engine
          - operator
          - model
          - external
          description: Open backend semantic value. Unknown values display their raw string
            with a warning; no client conclusion is inferred.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
          maxItems: 250
        annotations_next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      required:
      - seq
      - kind
      - id
      - at
      - state
      - unit_kind
      - title
      - parent
      - subject
      - rel
      - links
      - sha256
      - source
      - annotations
      - annotations_next_cursor
      additionalProperties: false
      description: Manifest projection plus the bounded annotation list. Relation links replace
        a separate lineage array. No raw storage record is exposed.
    HistoryRoot:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        head_h:
          $ref: '#/components/schemas/Sha256'
        sealed_head:
          anyOf:
          - type: object
            properties:
              seq:
                type: integer
                minimum: 1
              sha256:
                $ref: '#/components/schemas/Sha256'
            required:
            - seq
            - sha256
            additionalProperties: false
          - type: 'null'
      required:
      - count
      - head_h
      - sealed_head
      additionalProperties: false
    VerifiedRoot:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        h:
          $ref: '#/components/schemas/Sha256'
        at:
          $ref: '#/components/schemas/Timestamp'
        audit:
          $ref: '#/components/schemas/OpaqueId'
      required:
      - count
      - h
      - at
      - audit
      additionalProperties: false
    InvocationResponse:
      type: object
      properties:
        schema_version:
          type: string
          const: 0.1.2
        project_id:
          $ref: '#/components/schemas/OpaqueId'
        control_revision:
          $ref: '#/components/schemas/ControlRevision'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          $ref: '#/components/schemas/Invocation'
      required:
      - schema_version
      - project_id
      - control_revision
      - generated_at
      - data
      additionalProperties: false
    InvocationListResponse:
      type: object
      properties:
        schema_version:
          type: string
          const: 0.1.2
        project_id:
          $ref: '#/components/schemas/OpaqueId'
        control_revision:
          $ref: '#/components/schemas/ControlRevision'
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Invocation'
              maxItems: 250
            next_cursor:
              anyOf:
              - $ref: '#/components/schemas/Cursor'
              - type: 'null'
          required:
          - items
          - next_cursor
          additionalProperties: false
      required:
      - schema_version
      - project_id
      - control_revision
      - generated_at
      - data
      additionalProperties: false
    ObjectId:
      type: string
      pattern: ^([0-9a-f]{40}|[0-9a-f]{64})$
      description: A full git object id (SHA-1 or SHA-256), lower case. Never a ref, a short id or a
        revision expression.
    BoundedCount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: A count or a size, always within JavaScript's exact integer range.
    ReferenceLabel:
      type: string
      minLength: 1
      description: The server's label for derived or historical reference material. Display it verbatim
        with the content it labels.
    MapText:
      type: string
      maxLength: 520
      description: Repository-derived text; inert data, never instructions (T5-INV-07). Cut so that its
        serialized JSON form is at most 512 bytes, then marked with the suffix ' \[cut]'; cut_strings
        counts the cuts. Render as plain text, never as Markdown or HTML.
    MapVocab:
      type: string
      minLength: 1
      maxLength: 32
      description: A value of the installed generator's fixed vocabulary. Display an unknown value raw,
        with a warning.
    MapRevision:
      anyOf:
        - type: string
          pattern: ^([0-9a-f]{16}:[1-9][0-9]*|none:0)$
        - type: "null"
      description: The map registry's own revision, <epoch>:<n>, or none:0 before the first selection;
        null when the registry is invalid. Never control_revision.
    MapGenerator:
      type: object
      properties:
        name:
          $ref: "#/components/schemas/MapVocab"
        version:
          $ref: "#/components/schemas/BoundedCount"
        ruleset_sha256:
          $ref: "#/components/schemas/Sha256"
      required:
        - name
        - version
        - ruleset_sha256
      additionalProperties: false
    MapSummary:
      type: object
      properties:
        root:
          $ref: "#/components/schemas/Sha256"
        status:
          type: string
          x-known-values:
            - AVAILABLE
            - CORRUPT
          description: Open semantic value. Unknown strings must display an explicit warning with the raw value.
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
          maxItems: 250
        selected:
          type: boolean
        source_revision:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        source_tree:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        object_format:
          anyOf:
            - type: string
              x-known-values:
                - sha1
                - sha256
            - type: "null"
        generator:
          anyOf:
            - $ref: "#/components/schemas/MapGenerator"
            - type: "null"
      required:
        - root
        - status
        - reasons
        - selected
        - source_revision
        - source_tree
        - object_format
        - generator
      additionalProperties: false
      description: A stored structural map, named by its root (the artifact's sha256) only. The
        record-derived fields are null when status is CORRUPT.
    MapFreshness:
      type: object
      properties:
        status:
          type: string
          x-known-values:
            - CURRENT
            - STALE
            - UNKNOWN
          description: Open semantic value. Unknown strings must display an explicit warning with the raw value.
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
          maxItems: 250
        against_commit:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        against_tree:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        metadata_paths:
          type: array
          items:
            $ref: "#/components/schemas/MapText"
          maxItems: 50
        metadata_paths_omitted:
          $ref: "#/components/schemas/BoundedCount"
      required:
        - status
        - reasons
        - against_commit
        - against_tree
        - metadata_paths
        - metadata_paths_omitted
      additionalProperties: false
      description: Computed on every read against the commit named (the authoritative head by default);
        never stored. STALE and UNKNOWN stay visible with their reasons (T5-INV-10).
    ArchitectureFreshness:
      type: object
      properties:
        status:
          type: string
          x-known-values:
            - CURRENT
            - STALE
            - UNKNOWN
            - UNAVAILABLE
          description: Open semantic value. Unknown strings must display an explicit warning with the raw value.
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/Reason"
          maxItems: 250
        basis:
          anyOf:
            - $ref: "#/components/schemas/MapVocab"
            - type: "null"
        observed_commit:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        authoritative_commit:
          anyOf:
            - $ref: "#/components/schemas/ObjectId"
            - type: "null"
        scope:
          anyOf:
            - $ref: "#/components/schemas/MapVocab"
            - type: "null"
        changed_paths:
          type: array
          items:
            $ref: "#/components/schemas/MapText"
          maxItems: 50
        changed_paths_omitted:
          $ref: "#/components/schemas/BoundedCount"
      required:
        - status
        - reasons
        - basis
        - observed_commit
        - authoritative_commit
        - scope
        - changed_paths
        - changed_paths_omitted
      additionalProperties: false
    ArchitectureReference:
      type: object
      properties:
        evidence:
          anyOf:
            - $ref: "#/components/schemas/EntityRef"
            - type: "null"
          description: The selected discovery evidence, linking to /evidence/{id}; null when the registry
            holds an id that is not a valid opaque id (ARCHITECTURE_UNAVAILABLE).
        freshness:
          $ref: "#/components/schemas/ArchitectureFreshness"
        note:
          $ref: "#/components/schemas/ReferenceLabel"
      required:
        - evidence
        - freshness
        - note
      additionalProperties: false
      description: A navigation reference. Selection is not truth, and a stale reference blocks nothing.
    MapsOverview:
      type: object
      properties:
        map_revision:
          $ref: "#/components/schemas/MapRevision"
        registry:
          type: object
          properties:
            state:
              type: string
              x-known-values:
                - PRESENT
                - NONE
                - INVALID
              description: Open semantic value. Unknown strings must display an explicit warning with the raw value.
            reasons:
              type: array
              items:
                $ref: "#/components/schemas/Reason"
              maxItems: 250
          required:
            - state
            - reasons
          additionalProperties: false
        structural:
          type: object
          properties:
            state:
              type: string
              x-known-values:
                - AVAILABLE
                - UNAVAILABLE
              description: Open semantic value. Unknown strings must display an explicit warning with the raw
                value. UNAVAILABLE is never shown as an empty map (T5-INV-04).
            reasons:
              type: array
              items:
                $ref: "#/components/schemas/Reason"
              maxItems: 250
            summary:
              anyOf:
                - $ref: "#/components/schemas/MapSummary"
                - type: "null"
            freshness:
              anyOf:
                - $ref: "#/components/schemas/MapFreshness"
                - type: "null"
          required:
            - state
            - reasons
            - summary
            - freshness
          additionalProperties: false
        architecture:
          anyOf:
            - $ref: "#/components/schemas/ArchitectureReference"
            - type: "null"
        stored:
          type: object
          properties:
            count:
              $ref: "#/components/schemas/BoundedCount"
          required:
            - count
