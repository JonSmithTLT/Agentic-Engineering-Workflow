openapi: 3.1.0
info:
  title: AEW Read-only Dashboard API — C0 PROVISIONAL
  version: 0.1.3
  description: Not approved for domain implementation. AEW main-line contracts remain authoritative.
    Every route is same-origin GET/HEAD with authenticated cookies; no durable storage layout
    exposed. Compatibility rule (from 0.1.3) - a minor version adds new paths and never changes what
    an existing path returns. An envelope's schema_version is the contract version that defined that
    response's schema, so the 0.1.2 routes keep emitting 0.1.2. A change to a served path's
    response, an existing parameter, or a new required parameter is a 0.2.0 change.
servers:
- url: /api/v1
security:
- session: []
x-c0-review:
  status: ACCEPTED
  amends: 0.1.2
  review_document: web/docs/c0-review-main-line-0.1.3.md
  notes:
  - Additive renewal against merged S0 Appendix A; existing response envelopes remain 0.1.2.
  - Contract-only independent review; new routes await S1/S2 and live adoption remains pending.
