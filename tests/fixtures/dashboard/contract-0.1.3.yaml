                alone: telemetry can change at the same revision. Includes route, project,
                filters, limit and cursor scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '304':
          description: Representation unchanged. No payload. Preserve generated_at and control_revision;
            update only client last_checked_at.
        '401':
          description: Session required.
        '403':
          description: Capability unavailable.
