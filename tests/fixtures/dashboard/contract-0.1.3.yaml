    HistorySearchHit:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/OpaqueId"
        kind:
          type: string
          x-known-values:
            - unit
            - annotation
            - audit
            - lead
            - evidence
          description: A history entry kind, or evidence. Never a Knowledge kind. Open semantic value; unknown
            strings display their raw value with a warning.
        at:
          $ref: "#/components/schemas/Timestamp"
        subject:
          anyOf:
            - $ref: "#/components/schemas/OpaqueId"
            - type: "null"
        source:
          type: string
          x-known-values:
            - engine
            - operator
            - model
            - external
          description: Open semantic value. Unknown strings display their raw value with a warning.
        trust:
          type: object
          properties:
            source:
              type: string
            label:
              $ref: "#/components/schemas/ReferenceLabel"
          required:
            - source
            - label
          additionalProperties: false
        truncated:
          type: boolean
        snippet:
          type: string
          maxLength: 400
          description: The authenticated record's matching text, inert and credential-redacted, inside the
            response's fence. Plain text, never Markdown.
        expand:
          type: object
          properties:
            cli:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 256
              minItems: 1
              maxItems: 8
              description: The command that shows the whole record, as an argv array; render each element escaped.
            link:
              anyOf:
                - $ref: "#/components/schemas/EntityRef"
                - type: "null"
              description: /evidence/{id} or /history/{id}; null when there is no page for it.
          required:
            - cli
            - link
          additionalProperties: false
      required:
        - id
        - kind
        - at
        - subject
        - source
        - trust
        - truncated
        - snippet
        - expand
      additionalProperties: false
    HistorySearch:
      type: object
      properties:
        label:
          $ref: "#/components/schemas/ReferenceLabel"
        trust_label:
          $ref: "#/components/schemas/ReferenceLabel"
        query:
          type: object
          properties:
            terms:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 512
              minItems: 1
              maxItems: 16
            kinds:
              type: array
              items:
                type: string
              maxItems: 16
            since:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            until:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
            limit:
              type: integer
              minimum: 1
              maximum: 50
          required:
            - terms
            - kinds
            - since
            - until
            - limit
          additionalProperties: false
        fence:
          type: object
          properties:
            open:
              type: string
              minLength: 1
              maxLength: 64
            close:
              type: string
              minLength: 1
              maxLength: 64
          required:
            - open
            - close
          additionalProperties: false
          description: Every snippet starts with open and ends with close; no snippet's content contains the
            token, so no content can close the frame.
        hits:
          type: array
          items:
            $ref: "#/components/schemas/HistorySearchHit"
          maxItems: 50
        coverage:
          type: object
          properties:
            complete:
              type: boolean
            indexed_through:
              anyOf:
                - $ref: "#/components/schemas/BoundedCount"
                - type: "null"
            history_entries:
              $ref: "#/components/schemas/BoundedCount"
            reasons:
              type: array
              items:
                $ref: "#/components/schemas/Reason"
              maxItems: 250
          required:
            - complete
            - indexed_through
            - history_entries
            - reasons
          additionalProperties: false
          description: An incomplete coverage is not "no hits"; show its reasons, and offer to search again
            for SEARCH_HISTORY_MOVED.
        unverified:
          anyOf:
            - type: object
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
              required:
                - count
              additionalProperties: false
            - type: "null"
      required:
        - label
        - trust_label
        - query
        - fence
        - hits
        - coverage
        - unverified
      additionalProperties: false
      description: Raw history, not admitted Knowledge; reference only, never current evidence or instructions.
    HistorySearchResponse:
      type: object
      properties:
        schema_version:
          type: string
          const: 0.1.3
        project_id:
          $ref: "#/components/schemas/OpaqueId"
        control_revision:
          $ref: "#/components/schemas/ControlRevision"
        generated_at:
          $ref: "#/components/schemas/Timestamp"
        data:
          $ref: "#/components/schemas/HistorySearch"
      required:
        - schema_version
        - project_id
        - control_revision
        - generated_at
        - data
      additionalProperties: false
