- id: stream-drop-shell-startup
  scope: test
  lane: integration
  platforms:
  - windows
  status: open
  class: wall clock
  cause: >-
    A second, unintended 60s deadline: 35d6ecd6 dropped watchdog_only from the shell step's wait, so PowerShell's and
    the CLI's start were bounded by steps_done's 60s as well as by the watchdog, the owner of startup and admission
    time. On an overloaded Windows shard (sibling tests 8-10 times their usual time) the shell gave no answer within
    60s; the evidence holds no supervisor or CLI stacks to show more.
  owner: CI timing fixes
  test: tests/integration/test_worker_messages.py::test_a_stream_drop_during_an_open_shell_refuses_wait_and_explains_the_loss
  planned_fix: >-
    Restore watchdog_only for the shell step (now its "watchdog" bound), so no deadline is tighter than the test's
    own limit. On POSIX the watchdog's alarm ends a hang there; on Windows the watchdog only names it, and the
    "watchdog" bound (the time left to that limit) makes the wait itself fail by name just after the watchdog's
    dump, where before the session deadline ended it. Closure awaits the fix PR number.
