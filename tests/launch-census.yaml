# The launch census (G3 addendum 7, ruling 1's class guard; the designer's DV-2 and DV-5): every process start in src/
# and eval/, each classified, held both ways to the code by tests/unit/test_launch_census.py (two detectors,
# tests/helpers/launch_census.py).
#
# A row is one call of a start in one scope ("path::Class.function"), with one class per call, in source order:
#   contained          through establish (or eval's raw.verify_layout); `contained_by` names the scope that calls it.
#                      A weaker outcome there (the policy allows it, or a sandbox on the host's network) is entered in
#                      the register of weaker contexts by `weaker_registered_by`.
#   weaker_registered  always weaker, and entered in the register while it runs, by `registered_by`.
#   not_agent_context  with its reason: no model acts, and nothing an agent wrote runs.
# Under `required`, a containment failure refuses; every handler that can catch one is in `handlers`, with what it
# does. One that goes on is eval's only (eval has no policy, DV-5), with its reason.

excluded:
  eval/reviews/: the frozen review probes; it holds no lane (addendum 7)
  eval/m3/spike/: frozen probes, kept as they ran in M3; it holds no lane (the designer, 2026-11-01, confirming the
    Lead's reading; no change to addendum 7's text)

