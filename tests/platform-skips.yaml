# Tests that are expected to skip on a platform (docs/implementation/testing-and-ci-strategy.md,
# "Platform responsibilities"). The CI assurance job fails on any skip not listed here, and on a listed
# test that no longer skips. Adding an entry is a reviewed decision: say which platform covers it instead.
schema: aew/platform-skips/v1
skipped:
  win32:
    tests/integration/test_authority.py::test_operator_authorized_takeover_supersedes_everyone: >-
      POSIX pty operator path; a Windows console would appear on the desktop. Covered on Linux; on Windows
      the refusal path runs and AT-1 substitutes the terminal channel in-process.
