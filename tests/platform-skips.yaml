# Tests that are expected to skip on a platform (docs/implementation/testing-and-ci-strategy.md,
# "Platform responsibilities"). The CI assurance job fails on any skip not listed here, and on a listed
# test that no longer skips. Adding an entry is a reviewed decision: say which platform covers it instead.
schema: aew/platform-skips/v1
skipped:
  win32:
    tests/unit/test_eval_hidden.py::test_on_linux_a_worktree_roots_object_store_is_masked_too: >-
      the scoring sandbox is Linux bubblewrap only (F19 slice 3); what it masks for a worktree root is
      computed and tested on every platform (test_a_worktree_root_masks_its_object_store_and_every_checkout).
      Covered on Linux.
    tests/unit/test_eval_hidden.py::test_on_linux_the_models_programs_are_scored_in_a_sandbox: >-
      the model's programs are contained while scored only under Linux bubblewrap (F19 slice 3); Windows refuses
      held-out scoring instead (tested). Covered on Linux.
    tests/unit/test_store.py::test_a_holder_whose_lock_file_was_removed_commits_nothing: >-
      the lock file is removed while held, which Windows refuses for an open file (area 5 P2 is POSIX-only).
      Covered on Linux.
    tests/unit/test_store.py::test_a_taker_whose_lock_file_is_replaced_while_it_waits_locks_the_new_file: >-
      the lock file is replaced while open, which Windows refuses (area 5 P2 is POSIX-only). Covered on Linux.
    tests/integration/test_validation_checks.py::test_linux_checks_run_contained_and_a_write_to_the_candidate_is_refused: >-
      checks-mode validation runs under Linux bubblewrap containment (M4-D5); Windows has none, and refuses checks
      mode (VALIDATION_CONTAINMENT_UNAVAILABLE, tested). Covered on Linux.
    tests/integration/test_authority.py::test_operator_authorized_takeover_supersedes_everyone: >-
      POSIX pty operator path; a Windows console would appear on the desktop. Covered on Linux; on Windows
      the refusal path runs and AT-1 substitutes the terminal channel in-process.
    tests/integration/test_dashboard_session.py::test_serve_at_a_real_terminal_shows_the_challenge_and_writes_the_url: >-
      POSIX pty operator path for `aew dashboard serve` (F20.3); a Windows console would appear on the desktop.
      Covered on Linux; on Windows the no-terminal refusals run and the serving console is substituted in-process.
    tests/integration/test_dashboard_acceptance.py::test_the_real_cli_serves_the_product_end_to_end: >-
      POSIX pty operator path for F20.6's real-CLI walk (`aew dashboard serve` at a pseudo-terminal); a Windows
      console would appear on the desktop. Covered on Linux (serial lane); on Windows the in-process service runs
      the same walk (test_the_product_end_to_end_through_one_session).
    tests/integration/test_worktree_sync.py::test_executable_bit_only_change_materializes: >-
      needs POSIX filemode semantics (core.fileMode=false on Windows). Covered on Linux.
    tests/integration/test_worktree_sync.py::test_file_symlink_transitions_sync[file_to_symlink]: >-
      needs POSIX symlinks. Covered on Linux.
    tests/integration/test_worktree_sync.py::test_file_symlink_transitions_sync[symlink_to_file]: >-
      needs POSIX symlinks. Covered on Linux.
    tests/regression/test_review_2026_09_26.py::test_sync_handles_executable_bit_only_change: >-
      reviewer probe M6; needs a filemode-aware (POSIX) checkout. Covered on Linux.
    tests/unit/test_runlog_reads.py::test_a_heartbeat_that_is_a_link_is_none_and_never_raises: >-
      needs POSIX symlinks (a link loop, ENOTDIR). Windows reads the heartbeat through the same lstat and regular-file
      check, tested with a directory (test_a_heartbeat_or_record_that_is_a_directory_is_none). Covered on Linux.
    tests/unit/test_runlog_reads.py::test_a_record_that_is_a_fifo_a_device_or_a_link_is_none_and_never_blocks: >-
      needs POSIX FIFOs, /dev/zero and symlinks. Windows refuses a record that is not a regular file before opening
      it, tested with a directory and a record past its bound. Covered on Linux.
    tests/unit/test_runlog_reads.py::test_the_credential_scan_never_reads_through_a_link_or_blocks_on_a_fifo: >-
      needs POSIX FIFOs, /dev/zero and symlinks. Windows scans only what lstat shows is a regular file, through the same
      opener as a run record, and the chunked scan runs on every platform
      (test_the_credential_scan_finds_a_credential_wherever_chunks_split_it). Covered on Linux.
    tests/unit/test_runlog_reads.py::test_a_beat_never_follows_a_link_or_blocks_on_a_fifo: >-
      needs POSIX symlinks and FIFOs. Windows beats only a heartbeat lstat shows is a regular file, and a beat on a
      directory never raises on any platform (test_a_beat_on_a_heartbeat_that_is_a_directory_never_raises). Covered
      on Linux.
    tests/unit/test_runlog_reads.py::test_a_request_queue_that_is_a_link_is_not_read_or_emptied: >-
      needs POSIX symlinks; the queue is checked with lstat on every platform. Covered on Linux.
    tests/unit/test_runlog_reads.py::test_the_event_log_never_blocks_on_a_fifo_or_writes_through_a_link: >-
      needs POSIX FIFOs and symlinks. Windows appends only to what lstat shows is a regular file, and appends whole
      lines on every platform (test_the_event_log_appends_whole_lines). Covered on Linux.
    tests/unit/test_runlog_reads.py::test_the_request_queue_never_blocks_on_a_fifo_or_follows_a_link: >-
      needs POSIX FIFOs, /dev/zero and symlinks. The queue is read like a run record, tested on Windows with a
      request past the bound (test_a_request_past_the_bound_is_dropped). Covered on Linux.
    tests/integration/test_usage_ledger.py::test_links_and_fifos_in_a_run_directory_never_block_a_cancel_or_archival[heartbeat-loop]: >-
      needs POSIX symlinks; the run-directory reads it drives are tested on Windows in tests/unit/test_runlog_reads.py.
