    tests/unit/test_runlog_reads.py::test_a_heartbeat_that_is_a_link_is_none_and_never_raises: >-
      needs POSIX symlinks (a link loop, ENOTDIR). Windows reads the heartbeat through the same lstat and regular-file
      check, tested with a directory (test_a_heartbeat_or_record_that_is_a_directory_is_none). Covered on Linux.
    tests/unit/test_runlog_reads.py::test_a_record_that_is_a_fifo_a_device_or_a_link_is_none_and_never_blocks: >-
      needs POSIX FIFOs, /dev/zero and symlinks. Windows refuses a record that is not a regular file before opening
      it, tested with a directory and a record past its bound. Covered on Linux.
    tests/unit/test_runlog_reads.py::test_the_credential_scan_never_reads_through_a_link_or_blocks_on_a_fifo: >-
      needs POSIX FIFOs, /dev/zero and symlinks. Windows scans only what lstat shows is a regular file, through the same
      opener as a run record, and the chunked scan runs on every platform
      (test_the_credential_scan_finds_a_credential_wherever_chunks_split_it). Covered on Linux.
    tests/unit/test_runlog_reads.py::test_a_beat_never_follows_a_link_or_blocks_on_a_fifo: >-
      needs POSIX symlinks and FIFOs. Windows beats only a heartbeat lstat shows is a regular file, and a beat on a
      directory never raises on any platform (test_a_beat_on_a_heartbeat_that_is_a_directory_never_raises). Covered
      on Linux.
    tests/integration/test_dashboard_maps.py::test_on_posix_a_history_tail_that_cannot_be_read_is_damage_not_busy: >-
      POSIX's case of review finding H (register F20.8, S1): chmod 000 does not stop a read on Windows, where an
      unreadable tail is a sharing violation and busy by design
      (test_a_history_tail_the_os_will_not_let_a_lock_free_reader_read_is_busy_not_damage, which runs everywhere).
      Covered on Linux.
    tests/integration/test_dashboard_maps.py::test_a_fifo_artifact_or_registry_is_never_opened_and_a_swap_race_does_not_block: >-
