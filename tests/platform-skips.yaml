    tests/unit/test_store.py::test_a_taker_whose_lock_file_is_replaced_while_it_waits_locks_the_new_file: >-
      the lock file is replaced while open, which Windows refuses (area 5 P2 is POSIX-only). Covered on Linux.
    tests/integration/test_coordination_store.py::test_a_writer_whose_lock_file_was_removed_appends_nothing_and_the_thread_stays_readable: >-
