[extend]
useDefault = true

[[allowlists]]
description = "Public AEW credential IDs and SHA-256 digests in evidence"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''^token_id['"]?[ \t]*:[ \t]*['"]?tk_[0-9a-f]{16}['"]?[ \t\r\n]*$''',
  '''^openapi_sha256['"]?[ \t]*:[ \t]*['"]?[0-9a-f]{64}['"]?[ \t\r\n]*$''',
]
